apiVersion: hfl.dev/v1
kind: Template
metadata:
  name: cloudsql-instance
spec:
  version: "1.0.0"
  components:
    - name: db
      package:
        name: gcp-cloudsql-instance
        version: "0.1.0"
      inputs:
        name: db
        region: europe-west8
        database_version: POSTGRES_16
        tier: db-custom-2-7680
        backup_configuration:
          enabled: true
          point_in_time_recovery_enabled: true
        flags:
          cloudsql.iam_authentication: "on"
        databases:
          - orders
        users:
          app@myproject.iam.gserviceaccount.com:
            type: CLOUD_IAM_SERVICE_ACCOUNT
        gcp_deletion_protection: false
---
apiVersion: hfl.dev/v1
kind: Stack
metadata:
  name: cloudsql-instance
  scope: my-team
spec:
  template: cloudsql-instance
---
apiVersion: hfl.dev/v1
kind: Instance
metadata:
  name: cloudsql-instance-dev
  scope: my-team/dev
spec:
  stack: cloudsql-instance
  version: "1.0.0"
  components:
    db:
      values:
        project_id: myproject
        network_config:
          connectivity:
            psa_config:
              private_network: projects/myproject/global/networks/my-network
