apiVersion: hfl.dev/v1
kind: Template
metadata:
  name: cloud-identity-group
spec:
  version: "1.0.0"
  components:
    - name: group
      package:
        name: gcp-cloud-identity-group
        version: "0.1.0"
      inputs:
        customer_id: customers/C01234567
        name: mygroup@example.com
        display_name: My group name
        description: My group Description
        managers:
          - user1@example.com
        members:
          - user2@example.com
          - user3@example.com
---
apiVersion: hfl.dev/v1
kind: Stack
metadata:
  name: cloud-identity-group
  scope: my-team
spec:
  template: cloud-identity-group
---
apiVersion: hfl.dev/v1
kind: Instance
metadata:
  name: cloud-identity-group-dev
  scope: my-team/dev
spec:
  stack: cloud-identity-group
  version: "1.0.0"
