apiVersion: hfl.dev/v1
kind: Template
metadata:
  name: net-vpc-peering
spec:
  version: "1.0.0"
  components:
    - name: peering
      package:
        name: gcp-net-vpc-peering
        version: "0.1.0"
      inputs:
        prefix: name-prefix
        local_network: projects/project-1/global/networks/vpc-1
        peer_network: projects/project-1/global/networks/vpc-2
        routes_config:
          local:
            import: false
---
apiVersion: hfl.dev/v1
kind: Stack
metadata:
  name: net-vpc-peering
  scope: my-team
spec:
  template: net-vpc-peering
---
apiVersion: hfl.dev/v1
kind: Instance
metadata:
  name: net-vpc-peering-dev
  scope: my-team/dev
spec:
  stack: net-vpc-peering
  version: "1.0.0"
