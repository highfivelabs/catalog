# component net-cloud-armor-dev-policy
---
# Source: net-cloud-armor/templates/policy.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeSecurityPolicy
metadata:
  name: net-cloud-armor-dev-policy
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "net-cloud-armor-dev-policy"
    app.kubernetes.io/name: net-cloud-armor
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "policy"
    cnrm.cloud.google.com/project-id: "project-1"
spec:
  resourceID: "test-premium"
  description: "Terraform managed."
  type: "CLOUD_ARMOR"
  rule:
    - priority: 1000
      action: "deny(403)"
      preview: false
      match:
        versionedExpr: SRC_IPS_V1
        config:
          srcIpRanges:
            - "10.0.0.0/8"
    - priority: 2000
      action: "throttle"
      preview: false
      match:
        versionedExpr: SRC_IPS_V1
        config:
          srcIpRanges:
            - "*"
      rateLimitOptions:
        conformAction: allow
        exceedAction: "deny(429)"
        enforceOnKey: "IP"
        rateLimitThreshold:
          count: 100
          intervalSec: 60
    - priority: 2147483647
      action: "allow"
      description: "Default rule."
      preview: false
      match:
        versionedExpr: SRC_IPS_V1
        config:
          srcIpRanges:
            - "*"
