# component artifact-registry-dev-docker-artifact-registry
---
# Source: artifact-registry/templates/main.yaml
apiVersion: artifactregistry.cnrm.cloud.google.com/v1beta1
kind: ArtifactRegistryRepository
metadata:
  name: artifact-registry-dev-docker-artifact-registry
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "artifact-registry-dev-docker-artifact-registry"
    app.kubernetes.io/name: artifact-registry
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "repository"
    cnrm.cloud.google.com/project-id: "myproject"
spec:
  resourceID: "docker-registry"
  location: "europe-west1"
  description: "Terraform-managed registry"
  format: "DOCKER"
  mode: "STANDARD_REPOSITORY"
  cleanupPolicies:
    - id: "keep-5-versions"
      action: "KEEP"
      mostRecentVersions:
        keepCount: 5
  dockerConfig:
    immutableTags: true
---
# Source: artifact-registry/templates/iam.yaml
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPartialPolicy
metadata:
  name: artifact-registry-dev-docker-artifact-registry-iam
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "artifact-registry-dev-docker-artifact-registry"
    app.kubernetes.io/name: artifact-registry
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "iam"
spec:
  resourceRef:
    apiVersion: artifactregistry.cnrm.cloud.google.com/v1beta1
    kind: ArtifactRegistryRepository
    name: artifact-registry-dev-docker-artifact-registry
  bindings:
    - role: "roles/artifactregistry.writer"
      members:
        - member: "serviceAccount:ci@myproject.iam.gserviceaccount.com"
