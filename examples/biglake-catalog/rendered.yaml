---
# Source: biglake-catalog/templates/main.yaml
apiVersion: bigquerybiglake.cnrm.cloud.google.com/v1beta1
kind: BigLakeTable
metadata:
  name: biglake-catalog-dev-biglake-catalog-table-my-database-7ee96d7a
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "biglake-catalog-dev-biglake-catalog"
    app.kubernetes.io/name: biglake-catalog
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "table:my_database-my_table"
    cnrm.cloud.google.com/project-id: "myproject"
spec:
  parentDatabaseRef:
    external: "projects/myproject/locations/US/catalogs/my_catalog/databases/my_database"
  resourceID: "my_table"
  type: "HIVE"
  hiveOptions:
    tableType: "MANAGED_TABLE"
    storageDescriptor:
      locationURI: "gs://my-bucket/my-table-folder"
      inputFormat: "org.apache.hadoop.mapred.SequenceFileInputFormat"
      outputFormat: "org.apache.hadoop.hive.ql.io.HiveSequenceFileOutputFormat"
    parameters:
      "owner": "John Doe"
      "provider": "iceberg"
