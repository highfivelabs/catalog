apiVersion: hfl.dev/v1
kind: Template
metadata:
  name: datafusion
spec:
  version: "1.0.0"
  components:
    - name: datafusion
      package:
        name: gcp-datafusion
        version: "0.1.0"
      inputs:
        name: my-datafusion
        region: europe-west1
        project_id: my-project
        network: projects/my-project/global/networks/my-network
        ip_allocation_create: false
        ip_allocation: 10.0.0.0/22
        network_peering: false
---
apiVersion: hfl.dev/v1
kind: Stack
metadata:
  name: datafusion
  scope: my-team
spec:
  template: datafusion
---
apiVersion: hfl.dev/v1
kind: Instance
metadata:
  name: datafusion-dev
  scope: my-team/dev
spec:
  stack: datafusion
  version: "1.0.0"
