# component backup-dr-dev-dr
---
# Source: backup-dr/templates/main.yaml
apiVersion: backupdr.cnrm.cloud.google.com/v1beta1
kind: BackupDRBackupPlan
metadata:
  name: backup-dr-dev-dr-plan-my-backup-plan
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "backup-dr-dev-dr"
    app.kubernetes.io/name: backup-dr
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "backup_plan:my-backup-plan"
    cnrm.cloud.google.com/project-id: "myproject"
spec:
  projectRef:
    external: "projects/myproject"
  location: "us-central1"
  resourceID: "my-backup-plan"
  description: "Backup Plan for GCE Instances."
  resourceType: "compute.googleapis.com/Instance"
  backupVaultRef:
    name: backup-dr-dev-dr-vault
  backupRules:
    - ruleID: "daily-backup-rule"
      backupRetentionDays: 30
      standardSchedule:
        recurrenceType: "HOURLY"
        hourlyFrequency: 6
        timeZone: "America/Los_Angeles"
        backupWindow:
          startHourOfDay: 1
          endHourOfDay: 5
---
# Source: backup-dr/templates/main.yaml
apiVersion: backupdr.cnrm.cloud.google.com/v1beta1
kind: BackupDRBackupVault
metadata:
  name: backup-dr-dev-dr-vault
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "backup-dr-dev-dr"
    app.kubernetes.io/name: backup-dr
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "backup_vault"
    cnrm.cloud.google.com/project-id: "myproject"
spec:
  projectRef:
    external: "projects/myproject"
  location: "us-central1"
  resourceID: "backup-vault"
  backupMinimumEnforcedRetentionDuration: "100000s"
