apiVersion: dns.cnrm.cloud.google.com/v1beta1
kind: DNSManagedZone
metadata:
  name: dns-dev-private-dns
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "dns-dev-private-dns"
    app.kubernetes.io/name: dns
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "zone"
    cnrm.cloud.google.com/project-id: "myproject"
spec:
  resourceID: "test-example"
  dnsName: "test.example."
  description: "Terraform managed."
  visibility: "private"
  reverseLookup: false
  privateVisibilityConfig:
    networks:
      - networkRef:
          external: "projects/myproject/global/networks/default"
  cloudLoggingConfig:
    enableLogging: false
