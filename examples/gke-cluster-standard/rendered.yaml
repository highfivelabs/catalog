# component gke-cluster-standard-dev-cluster-1
---
# Source: gke-cluster-standard/templates/cluster.yaml
apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerCluster
metadata:
  name: gke-cluster-standard-dev-cluster-1
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "gke-cluster-standard-dev-cluster-1"
    app.kubernetes.io/name: gke-cluster-standard
    app.kubernetes.io/version: "0.1.0"
    environment: "dev"
  annotations:
    hfl.dev/id: "cluster"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/remove-default-node-pool: "true"
spec:
  resourceID: "cluster-1"
  location: "europe-west1-b"
  networkRef:
    external: "projects/my-project/global/networks/vpc"
  subnetworkRef:
    external: "projects/my-project/regions/europe-west1/subnetworks/gke"
  defaultMaxPodsPerNode: 32
  enableMultiNetworking: false
  enableIntranodeVisibility: false
  enableL4IlbSubsetting: false
  enableShieldedNodes: false
  enableFqdnNetworkPolicy: true
  enableTpu: false
  initialNodeCount: 1
  enableCiliumClusterwideNetworkPolicy: false
  datapathProvider: ADVANCED_DATAPATH
  nodePoolDefaults:
    nodeConfigDefaults:
      gcfsConfig:
        enabled: false
  addonsConfig:
    cloudrunConfig:
      disabled: true
    configConnectorConfig:
      enabled: false
    dnsCacheConfig:
      enabled: true
    gcePersistentDiskCsiDriverConfig:
      enabled: true
    gcpFilestoreCsiDriverConfig:
      enabled: true
    gcsFuseCsiDriverConfig:
      enabled: true
    gkeBackupAgentConfig:
      enabled: false
    horizontalPodAutoscaling:
      disabled: false
    httpLoadBalancing:
      disabled: false
    istioConfig:
      disabled: true
      auth: AUTH_NONE
    kalmConfig:
      enabled: false
    networkPolicyConfig:
      disabled: true
  costManagementConfig:
    enabled: true
  controlPlaneEndpointsConfig:
    dnsEndpointConfig:
      allowExternalTraffic: true
    ipEndpointsConfig:
      enabled: true
  ipAllocationPolicy:
    clusterSecondaryRangeName: "pods"
    servicesSecondaryRangeName: "services"
  loggingConfig:
    enableComponents: ["SYSTEM_COMPONENTS"]
  maintenancePolicy:
    dailyMaintenanceWindow:
      startTime: "03:00"
  masterAuth:
    clientCertificateConfig:
      issueClientCertificate: false
  masterAuthorizedNetworksConfig:
    cidrBlocks:
      - cidrBlock: "10.0.0.0/8"
        displayName: "internal-vms"
  monitoringConfig:
    enableComponents: ["SYSTEM_COMPONENTS"]
    managedPrometheus:
      enabled: true
  privateClusterConfig:
    enablePrivateNodes: true
    masterIpv4CidrBlock: "192.168.0.0/28"
  workloadIdentityConfig:
    workloadPool: "my-project.svc.id.goog"
