apiVersion: hfl.dev/v1
kind: Template
metadata:
  name: net-firewall-policy
spec:
  version: "1.0.0"
  components:
    - name: firewall-policy
      package:
        name: gcp-net-firewall-policy
        version: "0.1.0"
      inputs:
        name: test-1
        region: global
        attachments:
          my-vpc: projects/my-project/global/networks/my-vpc
        egress_rules:
          smtp:
            match:
              destination_ranges:
                - 0.0.0.0/0
              layer4_configs:
                - ports:
                    - "25"
                  protocol: tcp
            priority: 900
        ingress_rules:
          icmp:
            enable_logging: true
            match:
              layer4_configs:
                - protocol: icmp
              source_ranges:
                - 0.0.0.0/0
            priority: 1000
---
apiVersion: hfl.dev/v1
kind: Stack
metadata:
  name: net-firewall-policy
  scope: my-team
spec:
  template: net-firewall-policy
---
apiVersion: hfl.dev/v1
kind: Instance
metadata:
  name: net-firewall-policy-dev
  scope: my-team/dev
spec:
  stack: net-firewall-policy
  version: "1.0.0"
  components:
    firewall-policy:
      values:
        parent_id: my-project
