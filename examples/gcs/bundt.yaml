apiVersion: hfl.dev/v1
kind: Template
metadata:
  name: gcs
spec:
  version: "1.0.0"
  components:
    - name: bucket
      package:
        name: gcp-gcs
        version: "0.4.0"
      inputs:
        name: my-bucket
        location: EU
        versioning: true
        labels:
          cost-center: devops
        lifecycle_rules:
          expire-old-objects:
            action:
              type: Delete
            condition:
              age: 365
---
apiVersion: hfl.dev/v1
kind: Stack
metadata:
  name: gcs
  scope: my-team
spec:
  template: gcs
---
apiVersion: hfl.dev/v1
kind: Instance
metadata:
  name: gcs-dev
  scope: my-team/dev
spec:
  stack: gcs
  version: "1.0.0"
  components:
    bucket:
      values:
        project_id: myproject
        prefix: test
        iam:
          roles/storage.objectViewer:
            - group:devs@example.com
