apiVersion: hfl.dev/v1
kind: Template
metadata:
  name: data-catalog-policy-tag
spec:
  version: "1.0.0"
  components:
    - name: cmn-dc
      package:
        name: gcp-data-catalog-policy-tag
        version: "0.1.0"
      inputs:
        name: my-datacatalog-policy-tags
        location: eu
        tags:
          high:
            iam:
              roles/datacatalog.categoryFineGrainedReader:
                - group:high-readers@example.com
          low: {}
          medium: {}
        iam:
          roles/datacatalog.categoryAdmin:
            - group:data-admins@example.com
---
apiVersion: hfl.dev/v1
kind: Stack
metadata:
  name: data-catalog-policy-tag
  scope: my-team
spec:
  template: data-catalog-policy-tag
---
apiVersion: hfl.dev/v1
kind: Instance
metadata:
  name: data-catalog-policy-tag-dev
  scope: my-team/dev
spec:
  stack: data-catalog-policy-tag
  version: "1.0.0"
  components:
    cmn-dc:
      values:
        project_id: my-project
