apiVersion: cloudbuild.cnrm.cloud.google.com/v1beta1
kind: CloudBuildTrigger
metadata:
  name: source-repository-dev-repo-trigger-foo
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "source-repository-dev-repo"
    app.kubernetes.io/name: source-repository
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "trigger:foo"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
