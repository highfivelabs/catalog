---
# Source: dns/templates/main.yaml
apiVersion: dns.cnrm.cloud.google.com/v1beta1
kind: DNSManagedZone
metadata:
  name: peering
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "peering"
    app.kubernetes.io/name: dns
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "zone"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "peering"
  dnsName: "peer.example."
  description: "Terraform managed."
  visibility: "private"
  reverseLookup: false
  peeringConfig:
    targetNetwork:
      networkRef:
        external: "projects/host-project/global/networks/shared"
  privateVisibilityConfig:
    networks:
      - networkRef:
          external: "projects/my-project/global/networks/default"
  cloudLoggingConfig:
    enableLogging: false
