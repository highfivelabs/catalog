# Source: dns/templates/main.yaml
apiVersion: dns.cnrm.cloud.google.com/v1beta1
kind: DNSManagedZone
metadata:
  name: routing
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "routing"
    app.kubernetes.io/name: dns
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "zone"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "routing"
  dnsName: "routing.example."
  description: "Terraform managed."
  visibility: "private"
  reverseLookup: true
  privateVisibilityConfig:
    networks:
      - networkRef:
          external: "projects/my-project/global/networks/default"
  serviceDirectoryConfig:
    namespace:
      namespaceUrl: "https://servicedirectory.googleapis.com/v1/projects/my-project/locations/europe-west1/namespaces/ns"
  cloudLoggingConfig:
    enableLogging: false
---
# Source: dns/templates/recordsets.yaml
apiVersion: dns.cnrm.cloud.google.com/v1beta1
kind: DNSRecordSet
metadata:
  name: routing-rs-a-geo-84b5e09d
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "routing"
    app.kubernetes.io/name: dns
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "recordset:A geo"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  name: "geo.routing.example."
  type: "A"
  ttl: 300
  managedZoneRef:
    name: routing
  routingPolicy:
    geo:
      - location: "europe-west1"
        rrdatasRefs:
          - external: "10.0.0.1"
      - location: "europe-west8"
        healthCheckedTargets:
          internalLoadBalancers:
            - loadBalancerType: "regionalL4ilb"
              ipAddressRef:
                external: "10.0.1.1"
              port: "80"
              ipProtocol: "tcp"
              networkRef:
                external: "projects/my-project/global/networks/default"
              projectRef:
                external: "my-project"
              regionRef:
                external: "europe-west8"
