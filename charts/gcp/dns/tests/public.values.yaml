# A public zone with DNSSEC and logging, an apex record and an absolute one.
project_id: my-project
name: example
description: Public zone
labels: {env: prod}
force_destroy: true
zone_config:
  domain: example.com.
  public:
    enable_logging: true
    dnssec_config:
      state: "on"
      key_signing_key: {algorithm: ecdsap256sha256, key_length: 256}
recordsets:
  "A ": {records: [203.0.113.10]}
  "CNAME www": {records: [example.com.]}
  "TXT other.example.com.": {ttl: 60, records: ["v=spf1 -all"]}
deletion_policy: ABANDON
