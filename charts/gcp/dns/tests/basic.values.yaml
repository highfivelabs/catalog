# A private zone with two records, after the module README's first example.
project_id: my-project
name: test-example
zone_config:
  domain: test.example.
  private:
    client_networks: [projects/my-project/global/networks/default]
recordsets:
  "A localhost": {records: [127.0.0.1]}
  "A myhost": {ttl: 600, records: [10.0.0.120]}
iam:
  roles/dns.admin: ["group:dns-administrators@example.org"]
