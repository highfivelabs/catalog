# Names in full, labels and tags, as Bundt passes them from a team's naming
# convention (docs/design.md, "Names, labels and tags"): the zone takes its
# name as given; every object carries the labels and tags.
project_id: my-project
name: internal
names: {zone: shop-dev-internal}
labels: {hfl.dev/team: shop, hfl.dev/environment: dev}
tags: {team: shop, environment: dev}
zone_config:
  domain: internal.shop.example.
  private: {client_networks: [projects/my-project/global/networks/default]}
recordsets:
  "A api": {records: [10.0.0.9]}
