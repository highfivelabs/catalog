# Source: bigtable-instance/templates/main.yaml
apiVersion: bigtable.cnrm.cloud.google.com/v1beta1
kind: BigtableInstance
metadata:
  name: full
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: bigtable-instance
    app.kubernetes.io/version: "0.1.0"
    env: "prod"
  annotations:
    hfl.dev/id: "instance"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: "instance"
  displayName: "Bigtable analytics"
  deletionProtection: false
  cluster:
    - clusterId: "replica-a"
      zone: "europe-west1-b"
      storageType: "SSD"
      kmsKeyRef:
        external: "projects/kms-project/locations/europe-west1/keyRings/ring/cryptoKeys/key"
      autoscalingConfig:
        minNodes: 2
        maxNodes: 4
        cpuTarget: 70
    - clusterId: "replica-b"
      zone: "europe-west1-c"
      storageType: "HDD"
      kmsKeyRef:
        external: "projects/kms-project/locations/europe-west1/keyRings/ring/cryptoKeys/key"
      autoscalingConfig:
        minNodes: 1
        maxNodes: 5
        cpuTarget: 60
        storageTarget: 4096
