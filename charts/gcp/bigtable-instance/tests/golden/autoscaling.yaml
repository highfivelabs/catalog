---
# Source: bigtable-instance/templates/main.yaml
apiVersion: bigtable.cnrm.cloud.google.com/v1beta1
kind: BigtableGCPolicy
metadata:
  name: autoscaling-gc-t-cf
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "autoscaling"
    app.kubernetes.io/name: bigtable-instance
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "gc-policy:t/cf"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  instanceRef:
    name: autoscaling
  tableRef:
    name: autoscaling-table-t
  columnFamily: "cf"
  mode: "INTERSECTION"
  maxAge:
    - duration: "7d"
  maxVersion:
    - number: 3
---
# Source: bigtable-instance/templates/main.yaml
apiVersion: bigtable.cnrm.cloud.google.com/v1beta1
kind: BigtableInstance
metadata:
  name: autoscaling
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "autoscaling"
    app.kubernetes.io/name: bigtable-instance
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "instance"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "instance"
  displayName: "instance"
  deletionProtection: true
  cluster:
    - clusterId: "cluster-1"
      zone: "us-central1-a"
      autoscalingConfig:
        minNodes: 1
        maxNodes: 3
        cpuTarget: 50
---
# Source: bigtable-instance/templates/main.yaml
apiVersion: bigtable.cnrm.cloud.google.com/v1beta1
kind: BigtableTable
metadata:
  name: autoscaling-table-t
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "autoscaling"
    app.kubernetes.io/name: bigtable-instance
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "table:t"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "t"
  instanceRef:
    name: autoscaling
  columnFamily:
    - family: "cf"
