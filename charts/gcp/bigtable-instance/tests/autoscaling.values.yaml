# num_nodes is ignored when autoscaling is set (here by default_autoscaling),
# as fabric ignores it.
project_id: my-project
name: instance
clusters:
  cluster-1: {zone: us-central1-a, num_nodes: 3}
default_autoscaling: {min_nodes: 1, max_nodes: 3, cpu_target: 50}
tables:
  t: {column_families: {cf: {gc_policy: {mode: INTERSECTION, max_age: 7d, max_version: "3"}}}}
