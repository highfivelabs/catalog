#
# Values mirror the Terraform variables of fabric's bigtable-instance module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types and the module's validations.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.instance: the instance ID in full (6 to 33 characters, starting
# with a letter). A name set here takes no namePrefix; unset, name.
names: {}
# An optional convenience: "<namePrefix>-" in front of the instance ID (never
# one set under names). Empty (the default) changes nothing.
namePrefix: ""
# fabric's labels: labels attached to the instance. Kubernetes labels on
# every object; an unprefixed key also becomes a Google Cloud label on the
# instance.
labels: {}
# Cloud labels on every resource (the instance takes them).
tags: {}

# Clusters of the instance, {CLUSTER_ID: {zone, storage_type, num_nodes,
# autoscaling: {min_nodes, max_nodes, cpu_target, storage_target}}}. More
# than one enables replication. With autoscaling, num_nodes is ignored.
clusters: {}
# Default autoscaling for any cluster that sets none:
# {min_nodes, max_nodes, cpu_target, storage_target}.
default_autoscaling: null
# Default garbage collection policy for every column family of every table:
# {deletion_policy, gc_rules, mode, max_age, max_version}.
default_gc_policy: null
# Whether the instance may be deleted (Config Connector's
# deletionProtection).
deletion_protection: true
# The instance's display name (defaults to name).
display_name: null
# The KMS key id the clusters are encrypted with.
encryption_key: null
# IAM bindings in {ROLE => [MEMBERS]} format.
iam: {}
# The name (ID) of the Cloud Bigtable instance.
name: ""
# The project the instance is created in.
project_id: ""
# Tables, {TABLE: {split_keys: [], column_families: {FAMILY: {gc_policy}}}}.
tables: {}

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# instance and its tables when the component is deleted. PREVENT has no
# Config Connector equivalent.
deletion_policy: null
