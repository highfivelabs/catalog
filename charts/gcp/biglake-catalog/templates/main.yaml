{{- /*
Copyright 2026 High Five Labs
SPDX-License-Identifier: Apache-2.0
Ported from cloud-foundation-fabric modules/biglake-catalog/main.tf
(v60.0.0), Copyright 2023 Google LLC, Apache-2.0.

google_biglake_catalog.catalog: one BigLakeCatalog
(config-connector-extensions, biglake.gcp.hfl.dev/v1beta1).
google_biglake_database.databases: one BigLakeDatabase
(config-connector-extensions, biglake.gcp.hfl.dev/v1beta1) per key of
databases.
google_biglake_table.tables: one BigLakeTable (config-connector-extensions,
biglake.gcp.hfl.dev/v1beta1) per table of each database, keyed
<database>-<table> as fabric keys them. Config Connector's own BigLakeTable
reads BigLake's 403 for a missing table as a denial and never creates one.

BigLake IDs are letters, digits and underscores, so a namePrefix goes on
the catalog's name with its hyphens as underscores: <namePrefix>_<name>.
*/ -}}
{{- $v := .Values }}
{{- include "kcc.names" (list $ (list "catalog")) }}
{{- $abandon := include "kcc.abandon" . }}
{{- $project := printf "projects/%s" $v.project_id }}
{{- $catalog := index ($v.names | default dict) "catalog" | default "" }}
{{- if not $catalog }}
{{- $p := include "kcc.namePrefix" . | trimSuffix "-" | replace "-" "_" }}
{{- $catalog = ternary (printf "%s_%s" $p $v.name) $v.name (ne $p "") }}
{{- if gt (len $catalog) 63 }}
{{- fail (printf "biglake-catalog: catalog name %q is %d characters, more than the 63 the cloud allows for a catalog name; namePrefix %q is %d of them (with its \"_\"): shorten the namePrefix or the name" $catalog (len $catalog) $v.namePrefix (add1 (len $v.namePrefix))) }}
{{- end }}
{{- end }}
{{- if not (regexMatch "^[A-Za-z0-9_]+$" $catalog) }}
{{- fail (printf "biglake-catalog: catalog name %q may contain only letters, digits and underscores" $catalog) }}
{{- end }}
---
apiVersion: biglake.gcp.hfl.dev/v1beta1
kind: BigLakeCatalog
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" .Release.Name "id" "catalog" "project" $v.project_id "abandon" $abandon) | nindent 2 }}
spec:
  projectRef:
    external: {{ $project | quote }}
  location: {{ $v.location | quote }}
  resourceID: {{ $catalog | quote }}
{{- range $db, $d := $v.databases }}
---
apiVersion: biglake.gcp.hfl.dev/v1beta1
kind: BigLakeDatabase
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "database" $db)) "id" (printf "database:%s" $db) "project" $v.project_id "abandon" $abandon) | nindent 2 }}
spec:
  projectRef:
    external: {{ $project | quote }}
  location: {{ $v.location | quote }}
  catalog: {{ $catalog | quote }}
  resourceID: {{ $db | quote }}
  type: {{ $d.type | quote }}
  hiveOptions:
    locationUri: {{ $d.hive_options.location_uri | quote }}
    {{- with $d.hive_options.parameters }}
    parameters:
      {{- range $k, $p := . }}
      {{ $k | quote }}: {{ $p | quote }}
      {{- end }}
    {{- end }}
{{- range $t, $tb := $d.tables }}
{{- $h := $tb.hive_options }}
---
apiVersion: biglake.gcp.hfl.dev/v1beta1
kind: BigLakeTable
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "table" $db $t)) "id" (printf "table:%s-%s" $db $t) "project" $v.project_id "abandon" $abandon) | nindent 2 }}
spec:
  projectRef:
    external: {{ $project | quote }}
  location: {{ $v.location | quote }}
  catalog: {{ $catalog | quote }}
  database: {{ $db | quote }}
  resourceID: {{ $t | quote }}
  type: {{ $tb.type | quote }}
  hiveOptions:
    tableType: {{ $h.table_type | quote }}
    {{- with $h.parameters }}
    parameters:
      {{- range $k, $p := . }}
      {{ $k | quote }}: {{ $p | quote }}
      {{- end }}
    {{- end }}
    storageDescriptor:
      locationUri: {{ $h.location_uri | quote }}
      inputFormat: {{ $h.input_format | quote }}
      outputFormat: {{ $h.output_format | quote }}
{{- end }}
{{- end }}
