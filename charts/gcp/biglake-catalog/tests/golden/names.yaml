# Source: biglake-catalog/templates/main.yaml
apiVersion: biglake.gcp.hfl.dev/v1beta1
kind: BigLakeDatabase
metadata:
  name: names-database-db
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "names"
    app.kubernetes.io/name: biglake-catalog
    app.kubernetes.io/version: "0.2.0"
    environment: "dev"
    hfl.dev/environment: "dev"
    hfl.dev/team: "shop"
