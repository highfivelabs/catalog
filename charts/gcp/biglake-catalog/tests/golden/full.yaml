# Source: biglake-catalog/templates/main.yaml
apiVersion: biglake.gcp.hfl.dev/v1beta1
kind: BigLakeTable
metadata:
  name: full-table-sales-customers
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: biglake-catalog
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "table:sales-customers"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  projectRef:
    external: "projects/my-project"
  location: "us-central1"
  catalog: "lake"
  database: "sales"
  resourceID: "customers"
  type: "HIVE"
  hiveOptions:
    tableType: "MANAGED_TABLE"
    storageDescriptor:
      locationUri: "gs://my-bucket/sales/customers"
      inputFormat: "org.apache.hadoop.mapred.SequenceFileInputFormat"
      outputFormat: "org.apache.hadoop.hive.ql.io.HiveSequenceFileOutputFormat"
---
# Source: biglake-catalog/templates/main.yaml
apiVersion: biglake.gcp.hfl.dev/v1beta1
kind: BigLakeTable
metadata:
  name: full-table-sales-orders
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: biglake-catalog
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "table:sales-orders"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  projectRef:
    external: "projects/my-project"
  location: "us-central1"
  catalog: "lake"
  database: "sales"
  resourceID: "orders"
  type: "HIVE"
  hiveOptions:
    tableType: "EXTERNAL_TABLE"
    parameters:
      "provider": "iceberg"
    storageDescriptor:
      locationUri: "gs://my-bucket/sales/orders"
      inputFormat: "org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat"
      outputFormat: "org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat"
