# fabric's README example (modules/biglake-catalog/README.md, v60.0.0): a
# catalog, one Hive database and one table with Spark's parameters.
project_id: my-project
name: my_catalog
location: US
databases:
  my_database:
    type: HIVE
    hive_options:
      location_uri: gs://my-bucket/my-database-folder
      parameters: {owner: John Doe}
    tables:
      my_table:
        type: HIVE
        hive_options:
          table_type: MANAGED_TABLE
          location_uri: gs://my-bucket/my-table-folder
          input_format: org.apache.hadoop.mapred.SequenceFileInputFormat
          output_format: org.apache.hadoop.hive.ql.io.HiveSequenceFileOutputFormat
          parameters:
            spark.sql.create.version: 3.1.3
            spark.sql.sources.schema.numParts: "1"
            transient_lastDdlTime: "1680894197"
            spark.sql.partitionProvider: catalog
            owner: John Doe
            spark.sql.sources.schema.part.0: '{"fields":[{"metadata":{},"name":"id","nullable":true,"type":"integer"},{"metadata":{},"name":"name","nullable":true,"type":"string"},{"metadata":{},"name":"age","nullable":true,"type":"integer"}],"type":"struct"}'
            spark.sql.sources.provider: iceberg
            provider: iceberg
