# Applied to the fake cloud by hack/mock-apply.sh: a catalog, a database
# and a table.
project_id: mock-project
name: catalog_mock_lake
location: us
labels: {env: test}
databases:
  mock_db:
    type: HIVE
    hive_options:
      location_uri: gs://catalog-mock-bucket/db
      parameters: {owner: catalog}
    tables:
      mock_table:
        type: HIVE
        hive_options:
          table_type: EXTERNAL_TABLE
          location_uri: gs://catalog-mock-bucket/db/table
          input_format: org.apache.hadoop.mapred.SequenceFileInputFormat
          output_format: org.apache.hadoop.hive.ql.io.HiveSequenceFileOutputFormat
          parameters: {provider: iceberg}
