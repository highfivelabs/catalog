#
# Values mirror the Terraform variables of fabric's biglake-catalog module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.catalog sets the catalog's name in full (else name). Databases and
# tables are named by their keys, inside the catalog.
names: {}
# An optional convenience: "<namePrefix>-" in front of the catalog's name
# when names.catalog is not set. Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. BigLake resources take no Google
# Cloud labels, so these stay in Kubernetes.
labels: {}
# Cloud labels on every resource; none of these resources takes any, so
# these stay in Kubernetes too.
tags: {}

# Databases.
databases: {}
# Location.
location: ""
# Name.
name: ""
# Project ID.
project_id: ""

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# catalog, databases and tables when the component is deleted. PREVENT has
# no Config Connector equivalent.
deletion_policy: null
