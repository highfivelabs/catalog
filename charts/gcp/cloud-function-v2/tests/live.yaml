# The live case (hack/live-apply.sh LIVE_CHARTS=cloud-function-v2): an HTTP
# function (config-connector-extensions' CloudFunctions2Function) built from
# a one-file Python bundle live.pre.sh puts in a bucket of the run, and the
# service account it runs as (no project roles: granting them needs
# project IAM, which the live-test accounts do not hold).
project_id: ${PROJECT}
region: ${REGION}
name: ${RUN}-cf
description: catalog live test ${RUN}
bucket_name: ${PROJECT}-${RUN}-cf
bundle_config: {path: "gs://${PROJECT}-${RUN}-cf/fn.zip"}
service_account_config:
  roles: []
labels: {catalog-run: ${RUN}}
