# fabric's "PubSub and non-HTTP triggers" example: a Pub/Sub trigger run
# as a service account made elsewhere.
project_id: my-project
region: europe-west1
name: test-cf-http
bucket_name: my-bucket
bundle_config: {path: "gs://my-bucket/bundles/function.zip"}
trigger_config:
  event_type: google.cloud.pubsub.topic.v1.messagePublished
  pubsub_topic: projects/my-project/topics/my-topic
  service_account_email: sa-cloudfunction@my-project.iam.gserviceaccount.com
