# Applied to the fake cloud by hack/mock-apply.sh: the function (its
# bundle object need not exist in mockgcp), the bucket the chart makes for
# it, its service account with one project role, and a trigger account.
# No iam: README, "Tests".
project_id: mock-project
region: us-central1
name: mock-cf
bucket_name: catalog-mock-cf-code
bucket_config: {force_destroy: true}
bundle_config: {path: "gs://catalog-mock-cf-code/fn.zip"}
service_account_config:
  roles: [roles/logging.logWriter]
trigger_config:
  event_type: google.cloud.pubsub.topic.v1.messagePublished
  pubsub_topic: projects/mock-project/topics/catalog-mock-cf
  service_account_create: true
labels: {env: test}
