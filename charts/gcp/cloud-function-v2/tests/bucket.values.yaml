# fabric's "GCS bucket creation" example: the chart makes
# <prefix>-<bucket_name>, and the function's source is in it.
project_id: my-project
region: europe-west1
name: test-cf-http
bucket_name: my-bucket
bundle_config: {path: "gs://my-bucket/bundles/function.zip"}
prefix: myprefix
bucket_config:
  force_destroy: true
  lifecycle_delete_age_days: 1
