---
# Source: cloud-function-v2/templates/main.yaml
apiVersion: cloudfunctions2.gcp.hfl.dev/v1beta1
kind: CloudFunctions2Function
metadata:
  name: bucket
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "bucket"
    app.kubernetes.io/name: cloud-function-v2
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "function"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  projectRef:
    external: "my-project"
  location: "europe-west1"
  resourceID: "myprefix-test-cf-http"
  description: "Terraform managed."
  buildConfig:
    runtime: "python313"
    entryPoint: "main"
    source:
      storageSource:
        bucket: "myprefix-my-bucket"
        object: "bundles/function.zip"
  serviceConfig:
    allTrafficOnLatestRevision: true
    availableCpu: "0.166"
    availableMemory: "256M"
    environmentVariables:
      "LOG_EXECUTION_ID": "true"
    maxInstanceCount: 1
    minInstanceCount: 0
    serviceAccountEmail: "test-cf-http@my-project.iam.gserviceaccount.com"
    timeoutSeconds: 180
---
# Source: cloud-function-v2/templates/serviceaccount.yaml
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: bucket-sa-roles-logging-logwriter-aa3199fd
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "bucket"
    app.kubernetes.io/name: cloud-function-v2
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "sa-role:roles/logging.logWriter"
spec:
  resourceRef:
    apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
    kind: Project
    external: "projects/my-project"
  role: "roles/logging.logWriter"
  memberFrom:
    serviceAccountRef:
      name: bucket-sa
---
# Source: cloud-function-v2/templates/serviceaccount.yaml
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: bucket-sa-roles-monitoring-metricwriter-868061a5
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "bucket"
    app.kubernetes.io/name: cloud-function-v2
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "sa-role:roles/monitoring.metricWriter"
spec:
  resourceRef:
    apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
    kind: Project
    external: "projects/my-project"
  role: "roles/monitoring.metricWriter"
  memberFrom:
    serviceAccountRef:
      name: bucket-sa
---
# Source: cloud-function-v2/templates/serviceaccount.yaml
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMServiceAccount
metadata:
  name: bucket-sa
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "bucket"
    app.kubernetes.io/name: cloud-function-v2
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "service_account"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "test-cf-http"
  displayName: "test-cf-http"
---
# Source: cloud-function-v2/templates/bundle.yaml
apiVersion: storage.cnrm.cloud.google.com/v1beta1
kind: StorageBucket
metadata:
  name: bucket-bucket
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "bucket"
    app.kubernetes.io/name: cloud-function-v2
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "bucket"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/force-destroy: "true"
spec:
  resourceID: "myprefix-my-bucket"
  location: "europe-west1"
  uniformBucketLevelAccess: true
  lifecycleRule:
    - action:
        type: Delete
      condition:
        age: 1
        withState: ARCHIVED
  versioning:
    enabled: true
