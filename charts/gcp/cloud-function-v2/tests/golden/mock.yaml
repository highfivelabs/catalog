apiVersion: cloudfunctions2.gcp.hfl.dev/v1beta1
kind: CloudFunctions2Function
metadata:
  name: mock
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: cloud-function-v2
    app.kubernetes.io/version: "0.1.0"
    env: "test"
  annotations:
    hfl.dev/id: "function"
    cnrm.cloud.google.com/project-id: "mock-project"
spec:
  projectRef:
    external: "mock-project"
  location: "us-central1"
  resourceID: "mock-cf"
  description: "Terraform managed."
  buildConfig:
    runtime: "python313"
    entryPoint: "main"
    source:
      storageSource:
        bucket: "catalog-mock-cf-code"
        object: "fn.zip"
  eventTrigger:
    eventType: "google.cloud.pubsub.topic.v1.messagePublished"
    pubsubTopic: "projects/mock-project/topics/catalog-mock-cf"
    triggerRegion: "us-central1"
    serviceAccountEmail: "tf-cf-trigger-mock-cf@mock-project.iam.gserviceaccount.com"
    retryPolicy: "RETRY_POLICY_DO_NOT_RETRY"
  serviceConfig:
    allTrafficOnLatestRevision: true
    availableCpu: "0.166"
    availableMemory: "256M"
    environmentVariables:
      "LOG_EXECUTION_ID": "true"
    maxInstanceCount: 1
    minInstanceCount: 0
    serviceAccountEmail: "mock-cf@mock-project.iam.gserviceaccount.com"
    timeoutSeconds: 180
  labels:
    env: "test"
