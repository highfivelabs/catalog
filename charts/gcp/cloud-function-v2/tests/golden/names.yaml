# Source: cloud-function-v2/templates/main.yaml
apiVersion: cloudfunctions2.gcp.hfl.dev/v1beta1
kind: CloudFunctions2Function
metadata:
  name: names
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "names"
    app.kubernetes.io/name: cloud-function-v2
    app.kubernetes.io/version: "0.1.0"
    environment: "dev"
    hfl.dev/environment: "dev"
    hfl.dev/team: "shop"
    team: "shop"
  annotations:
    hfl.dev/id: "function"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  projectRef:
    external: "my-project"
  location: "europe-west1"
  resourceID: "shop-dev-fn"
  description: "Terraform managed."
  buildConfig:
    runtime: "python313"
    entryPoint: "main"
    source:
      storageSource:
        bucket: "my-bucket"
        object: "bundles/function.zip"
  eventTrigger:
    eventType: "google.cloud.pubsub.topic.v1.messagePublished"
    pubsubTopic: "projects/my-project/topics/my-topic"
    triggerRegion: "europe-west1"
    serviceAccountEmail: "shop-dev-fn-trigger@my-project.iam.gserviceaccount.com"
    retryPolicy: "RETRY_POLICY_DO_NOT_RETRY"
  serviceConfig:
    allTrafficOnLatestRevision: true
    availableCpu: "0.166"
    availableMemory: "256M"
    environmentVariables:
      "LOG_EXECUTION_ID": "true"
    maxInstanceCount: 1
    minInstanceCount: 0
    serviceAccountEmail: "shop-dev-fn@my-project.iam.gserviceaccount.com"
    timeoutSeconds: 180
    vpcConnector: "projects/my-project/locations/europe-west1/connectors/shop-dev-conn"
  labels:
    environment: "dev"
    team: "shop"
