---
# Source: cloud-function-v2/templates/main.yaml
apiVersion: cloudfunctions2.gcp.hfl.dev/v1beta1
kind: CloudFunctions2Function
metadata:
  name: service-account
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "service-account"
    app.kubernetes.io/name: cloud-function-v2
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "function"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  projectRef:
    external: "my-project"
  location: "europe-west1"
  resourceID: "test-cf-http"
  description: "Terraform managed."
  buildConfig:
    runtime: "python313"
    entryPoint: "main"
    source:
      storageSource:
        bucket: "my-bucket"
        object: "bundles/function.zip"
  serviceConfig:
    allTrafficOnLatestRevision: true
    availableCpu: "0.166"
    availableMemory: "256M"
    environmentVariables:
      "LOG_EXECUTION_ID": "true"
    maxInstanceCount: 1
    minInstanceCount: 0
    serviceAccountEmail: "existing@my-project.iam.gserviceaccount.com"
    timeoutSeconds: 180
