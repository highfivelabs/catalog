# Names in full, labels and tags, as Bundt passes them from a team's
# naming convention (docs/design.md, "Names, labels and tags").
project_id: my-project
region: europe-west1
name: test-cf-http
bucket_name: my-bucket
bundle_config: {path: "gs://my-bucket/bundles/function.zip"}
bucket_config: {}
trigger_config:
  event_type: google.cloud.pubsub.topic.v1.messagePublished
  pubsub_topic: projects/my-project/topics/my-topic
  service_account_create: true
vpc_connector_create: {ip_cidr_range: 10.8.0.0/28, network: vpc}
names:
  function: shop-dev-fn
  bucket: shop-dev-fn-code
  serviceAccount: shop-dev-fn
  triggerServiceAccount: shop-dev-fn-trigger
  vpcConnector: shop-dev-conn
labels: {hfl.dev/team: shop, hfl.dev/environment: dev}
tags: {team: shop, environment: dev}
