{{- /*
Copyright 2026 High Five Labs
SPDX-License-Identifier: Apache-2.0
Ported from cloud-foundation-fabric modules/cloud-function-v2/serviceaccount.tf
(v60.0.0), Copyright 2025 Google LLC, Apache-2.0.

google_service_account.service_account (service_account_config.create,
the default): an IAMServiceAccount; google_project_iam_member.default: one
IAMPolicyMember per service_account_config.roles entry, on the project,
with the account as member.
*/ -}}
{{- $v := .Values }}
{{- $c := $v.service_account_config | default dict }}
{{- if ne (toString $c.create) "false" }}
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMServiceAccount
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list .Release.Name "sa")) "id" "service_account" "project" $v.project_id "abandon" (include "kcc.abandon" .)) | nindent 2 }}
spec:
  resourceID: {{ include "cloudFunctionV2.serviceAccount" . | quote }}
  displayName: {{ $c.display_name | default $c.name | default $v.name | quote }}
{{- range $role := ($c.roles | default list) | uniq | sortAlpha }}
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "sa" $role)) "id" (printf "sa-role:%s" $role)) | nindent 2 }}
spec:
  resourceRef:
    apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
    kind: Project
    external: {{ printf "projects/%s" $v.project_id | quote }}
  role: {{ $role | quote }}
  memberFrom:
    serviceAccountRef:
      name: {{ include "kcc.name" (list $.Release.Name "sa") }}
{{- end }}
{{- end }}
