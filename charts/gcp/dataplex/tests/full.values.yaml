# Every variable: a prefix, a multi-region location type, lake and zone
# IAM, a bucket asset in another project, a dataset asset with discovery
# off, and an asset with every default.
name: sales
prefix: test
project_id: myproject
region: us-central1
location_type: MULTI_REGION
iam:
  roles/dataplex.viewer: ["group:b@example.com", "group:a@example.com", "group:b@example.com"]
zones:
  raw:
    type: RAW
    iam:
      roles/dataplex.dataReader: ["group:a@example.com"]
    assets:
      landing:
        resource_name: landing-bucket
        resource_project: data-project
        cron_schedule: "0 2 * * *"
      events:
        resource_name: events
        discovery_spec_enabled: false
        resource_spec_type: BIGQUERY_DATASET
  curated:
    type: CURATED
    discovery: false
    assets:
      marts:
        resource_name: marts
        resource_spec_type: BIGQUERY_DATASET
