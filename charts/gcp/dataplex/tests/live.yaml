# The live case (hack/live-apply.sh LIVE_CHARTS=dataplex): a lake, a RAW
# zone and an asset over a bucket of the run, a role on the lake and one on
# the zone (config-connector-extensions' DataplexLake, DataplexZone,
# DataplexAsset and IAMBinding).
name: ${RUN}-lake
project_id: ${PROJECT}
region: ${REGION}
labels: {catalog-run: ${RUN}}
iam:
  roles/dataplex.viewer: ["serviceAccount:${RUNNER}"]
zones:
  raw:
    type: RAW
    iam:
      roles/dataplex.dataReader: ["serviceAccount:${RUNNER}"]
    discovery: false
    assets:
      landing:
        resource_name: ${PROJECT}-${RUN}-dpx
        discovery_spec_enabled: false
