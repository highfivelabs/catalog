#
# Values mirror the Terraform variables of fabric's dataplex module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.lake sets the lake's name in full (else <prefix>-<name>). Zones and
# assets are named by their keys, inside the lake.
names: {}
# An optional convenience: "<namePrefix>-" in front of the lake's derived
# name. Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object; an unprefixed key also becomes a
# Google Cloud label.
labels: {}
# Cloud labels on every resource (Google Cloud labels).
tags: {}

# Dataplex lake IAM bindings in {ROLE => [MEMBERS]} format.
iam: {}
# The location type of the Dataplax Lake.
location_type: SINGLE_REGION
# Name of Dataplex Lake.
name: ""
# Optional prefix used to generate Dataplex Lake.
prefix: null
# The ID of the project where this Dataplex Lake will be created.
project_id: ""
# Region of the Dataplax Lake.
region: ""
# Dataplex lake zones, such as `RAW` and `CURATED`.
zones: {}

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# lake, zones and assets when the component is deleted. PREVENT has no
# Config Connector equivalent.
deletion_policy: null
