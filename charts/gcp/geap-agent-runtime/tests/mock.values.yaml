# Applied to the fake cloud by hack/mock-apply.sh: the engine with a
# package in GCS, the service account the chart makes with its two project
# roles, and the staging bucket.
name: catalog-mock-agent
project_id: mock-project
region: us-central1
labels: {env: test}
agent_runtime_config:
  agent_framework: google-adk
  identity_type: SERVICE_ACCOUNT
deployment_config:
  package_config:
    are_paths_local: false
    pickle_path: gs://catalog-mock-src/pickle.pkl
    dependencies_path: gs://catalog-mock-src/dependencies.tar.gz
    requirements_path: gs://catalog-mock-src/requirements.txt
