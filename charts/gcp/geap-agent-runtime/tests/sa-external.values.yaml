# fabric's README "Identities", a custom service account: the engine runs
# as an existing account; no account, no roles and, with no package, no
# bucket.
name: my-agent
project_id: project-id
region: europe-west8
agent_runtime_config:
  agent_framework: google-adk
  identity_type: SERVICE_ACCOUNT
service_account_config:
  create: false
  email: my-agent@project-id.iam.gserviceaccount.com
