# The live case (hack/live-apply.sh LIVE_CHARTS=geap-agent-runtime): an
# engine with no code and no account of its own (sessions only; the
# Vertex AI service agent runs it), config-connector-extensions'
# AIPlatformReasoningEngine. A package needs a pickled agent in Cloud
# Storage, which the fake-cloud case covers.
name: ${RUN}-agent
project_id: ${PROJECT}
region: ${REGION}
description: catalog live test ${RUN}
labels: {catalog-run: ${RUN}}
agent_runtime_config:
  identity_type: SERVICE_ACCOUNT
service_account_config:
  create: false
