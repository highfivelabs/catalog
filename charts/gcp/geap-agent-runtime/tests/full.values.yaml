# Every accepted variable set.
name: my-agent
project_id: project-id
region: europe-west8
description: An agent.
encryption_key: projects/project-id/locations/europe-west8/keyRings/my-keyring/cryptoKeys/my-key
labels: {env: test, hfl.dev/team: shop}
tags: {cost-center: x1}
deletion_policy: ABANDON
agent_runtime_config:
  agent_framework: langgraph
  identity_type: SERVICE_ACCOUNT
  container_concurrency: 4
  max_instances: 3
  min_instances: 0
  python_version: "3.12"
  resource_limits: {cpu: "2", memory: 4Gi}
  environment_variables: {A: "1", B: two}
  secret_environment_variables:
    TOKEN: {secret_id: token, version: "3"}
bucket_config:
  name: my-agent-staging
  uniform_bucket_level_access: false
deployment_config:
  package_config:
    are_paths_local: false
    pickle_path: gs://b/pickle.pkl
    dependencies_path: gs://b/dependencies.tar.gz
    requirements_path: gs://b/requirements.txt
networking_config:
  network_attachment_id: projects/project-id/regions/europe-west8/networkAttachments/nat
  dns_peering_configs:
    example.com.: {target_network_name: net-a, target_project_id: host-project}
    internal.: {target_network_name: projects/host-project/global/networks/net-b}
service_account_config:
  name: agent-runtime
  display_name: Agent runtime
  roles: [roles/aiplatform.user, roles/logging.logWriter]
