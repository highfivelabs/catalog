      name: full-sa
    deploymentSpec:
      containerConcurrency: 4
      maxInstances: 3
      minInstances: 0
      resourceLimits:
        cpu: "2"
        memory: "4Gi"
      env:
        - name: "A"
          value: "1"
        - name: "B"
          value: "two"
      pscInterfaceConfig:
        networkAttachmentRef:
          external: "projects/project-id/regions/europe-west8/networkAttachments/nat"
        dnsPeeringConfigs:
          - domain: "example.com."
            targetNetworkRef:
              external: "projects/host-project/global/networks/net-a"
            targetProjectRef:
              external: "host-project"
          - domain: "internal."
            targetNetworkRef:
              external: "projects/host-project/global/networks/net-b"
            targetProjectRef:
              external: "project-id"
      secretEnv:
        - name: "TOKEN"
          secretRef:
            secretRef:
              external: "projects/project-id/secrets/token"
            versionRef:
              external: "projects/project-id/secrets/token/versions/3"
    packageSpec:
      pythonVersion: "3.12"
      dependencyFilesGCSURI: "gs://b/dependencies.tar.gz"
      requirementsGCSURI: "gs://b/requirements.txt"
      pickleObjectGCSURI: "gs://b/pickle.pkl"
