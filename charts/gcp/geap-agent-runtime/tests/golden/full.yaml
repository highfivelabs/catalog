  description: "An agent."
  encryptionSpec:
    kmsKeyRef:
      external: "projects/project-id/locations/europe-west8/keyRings/my-keyring/cryptoKeys/my-key"
  labels:
    cost-center: "x1"
    env: "test"
  spec:
    agentFramework: "langgraph"
