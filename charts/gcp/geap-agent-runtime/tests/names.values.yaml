# Names in full, labels and tags, as Bundt passes them from a team's naming
# convention (docs/design.md, "Names, labels and tags").
name: my-agent
project_id: project-id
region: europe-west8
names: {agent: shop-dev-agent, serviceAccount: shop-dev-agent-sa, bucket: shop-dev-agent-staging}
labels: {hfl.dev/team: shop, hfl.dev/environment: dev}
tags: {team: shop, environment: dev}
agent_runtime_config:
  identity_type: SERVICE_ACCOUNT
deployment_config:
  package_config:
    are_paths_local: false
    pickle_path: gs://b/pickle.pkl
    dependencies_path: gs://b/dependencies.tar.gz
    requirements_path: gs://b/requirements.txt
