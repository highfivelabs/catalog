# fabric's README "Serialized Object Deployment" (pickle-gcs): files
# already in GCS, with the service account the chart makes
# (identity_type SERVICE_ACCOUNT; AGENT_IDENTITY, fabric's default, is
# refused: README.md, "Values").
name: my-agent
project_id: project-id
region: europe-west8
agent_runtime_config:
  agent_framework: google-adk
  identity_type: SERVICE_ACCOUNT
deployment_config:
  package_config:
    are_paths_local: false
    pickle_path: gs://my-bucket/pickle.pkl
    dependencies_path: gs://my-bucket/dependencies.tar.gz
    requirements_path: gs://my-bucket/requirements.txt
