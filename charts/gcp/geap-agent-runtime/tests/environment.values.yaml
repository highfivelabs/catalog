# fabric's README "Define environment variables and use secrets" and
# "Specify an encryption key".
name: my-agent
project_id: project-id
region: europe-west8
encryption_key: projects/project-id/locations/europe-west8/keyRings/my-keyring/cryptoKeys/my-key
agent_runtime_config:
  agent_framework: google-adk
  identity_type: SERVICE_ACCOUNT
  environment_variables:
    FOO: bar
  secret_environment_variables:
    MY_SECRET:
      secret_id: projects/project-id/secrets/my-secret
    SHORT:
      secret_id: other-secret
      version: "2"
