#
# Values mirror the Terraform variables of fabric's organization module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types and the module's validations.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables, but for tags (below). The chart makes no
# collision-prone resource of its own (the organization exists already), so
# names takes no key.
names: {}
# An optional convenience: "<namePrefix>-" in front of every name the chart
# derives (sinks, exclusions, entitlements, tag keys, the firewall policy
# association), never a custom role, constraint or tag value. Empty (the
# default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. An unprefixed key also becomes a Google
# Cloud label on the resources that take labels, so it must be a valid one.
labels: {}
# fabric's tag keys by short name, {KEY => {description, values, iam, ...}};
# an entry whose value is a string is the catalog's cloud label instead
# (README.md).
tags: {}

# Access level definitions, basic levels in access_policy.
access_levels: {}
# Access Policy name or ID (its number), required if creating access levels.
access_policy: null
# Cloud Asset Inventory feeds to a Pub/Sub topic.
asset_feeds: {}
# Cloud Asset Inventory search configurations. Refused when set (README.md).
asset_search: {}
# Hierarchical Cloud Armor policy association: {policy_id, name}. Alpha:
# needs allow_alpha.
cloud_armor_policy: null
# Essential contacts, EMAIL -> [NOTIFICATION_TYPES]: ALL, SUSPENSION,
# SECURITY, TECHNICAL, BILLING, LEGAL, PRODUCT_UPDATES.
contacts: {}
# Context-specific interpolations. Refused when set: Bundt replaces them
# with ${...} expressions in the component's inputs.
context: {}
# GCP user access bindings: {group_key, access_levels}. Alpha: needs
# allow_alpha.
context_aware_access_bindings: {}
# Custom roles, {ROLE_ID => {permissions, title, description, stage}}.
custom_roles: {}
# Paths to data files for fabric's factories. Refused when set (README.md).
factories_config: {}
# Hierarchical firewall policy to associate to the organization: {name, policy}.
firewall_policy: null
# IAM: authoritative {ROLE => [MEMBERS]}.
iam: {}
# Authoritative bindings, {KEY => {role, members, condition}}.
iam_bindings: {}
# Additive bindings, {KEY => {role, member, condition}}.
iam_bindings_additive: {}
# Authoritative IAM in {PRINCIPAL => [ROLES]} format.
iam_by_principals: {}
# Additive IAM in {PRINCIPAL => [ROLES]} format.
iam_by_principals_additive: {}
# Authoritative conditional IAM, {PRINCIPAL => {roles, condition}}.
iam_by_principals_conditional: {}
# IAM deny policies on the organization. Alpha: needs allow_alpha.
iam_deny_policies: {}
# Data access logs, {SERVICE => {ADMIN_READ, DATA_READ, DATA_WRITE}}.
logging_data_access: {}
# Logging exclusions for this organization, {NAME => FILTER}.
logging_exclusions: {}
# Default settings for logging resources. Refused when set (README.md).
logging_settings: null
# Logging sinks to create for the organization.
logging_sinks: {}
# Model Armor floor setting. Alpha: needs allow_alpha.
model_armor_floor_setting: null
# Network tags by key name: tag keys with purpose GCE_FIREWALL.
network_tags: {}
# Organization policies applied to this organization keyed by policy name.
org_policies: {}
# Organization policy custom constraints keyed by constraint name.
org_policy_custom_constraints: {}
# Organization id in organizations/nnnnnn format. Required.
organization_id: null
# Privileged Access Manager entitlements.
pam_entitlements: {}
# Security Command Center mute configs. Refused when set (README.md).
scc_mute_configs: {}
# Security Health Analytics custom modules. Alpha: needs allow_alpha.
scc_sha_custom_modules: {}
# Service agents configuration. Refused when set (README.md).
service_agents_config: {}
# Tag bindings for this organization, in key => tag value id format.
tag_bindings: {}
# Fine-grained control on tag resource and IAM creation: {ignore_iam,
# force_context_ids}; force_context_ids is refused.
tags_config: {}
# Workforce Identity Federation pools and providers.
workforce_identity_pools: {}

# Not a fabric variable: true accepts the features that need a v1alpha1
# Config Connector kind (iam_deny_policies, cloud_armor_policy,
# context_aware_access_bindings, model_armor_floor_setting,
# scc_sha_custom_modules). Beta kinds are always on. An alpha kind's schema
# may change between Config Connector releases (docs/design.md, "Alpha
# kinds").
allow_alpha: false

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# cloud resources when the component is deleted. PREVENT has no Config
# Connector equivalent.
deletion_policy: null
