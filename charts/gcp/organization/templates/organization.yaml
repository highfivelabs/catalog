{{- /*
Copyright 2026 High Five Labs
SPDX-License-Identifier: Apache-2.0
Ported from cloud-foundation-fabric modules/organization/main.tf,
org-policy-custom-constraints.tf and tags.tf (v60.0.0), Copyright 2025 and
2022 Google LLC, Apache-2.0.

The chart never makes the organization: everything goes on the one
organization_id names (organizations/N, fabric's check).
google_essential_contacts_contact.contact: an EssentialContactsContact per
entry of contacts, in English, as fabric's.
google_compute_firewall_policy_association.default (firewall_policy): a
ComputeFirewallPolicyAssociation of the hierarchical policy with the
organization. google_org_policy_custom_constraint.constraint: an
OrgPolicyCustomConstraint per entry of org_policy_custom_constraints.
google_tags_tag_binding.binding: a TagsTagBinding per entry of
tag_bindings. Refused (README.md): the variables with no stable Config
Connector kind, and the variables the other files of the module port.
*/ -}}
{{- $v := .Values }}
{{- include "kcc.names" (list $ list) }}
{{- $abandon := include "kcc.abandon" . }}
{{- $org := include "organization.id" . }}
{{- include "kcc.unsupported" (list $ "context" $v.context "Bundt replaces fabric's $context lookups with ${...} expressions in the component's inputs") }}
{{- include "kcc.unsupported" (list $ "factories_config" $v.factories_config "a chart cannot read the caller's files: their entries go in the variables they feed (custom_roles, org_policies, org_policy_custom_constraints, pam_entitlements, tags)") }}
{{- include "kcc.unsupported" (list $ "asset_search" $v.asset_search "a search is a read at plan time, not a resource; Bundt does not run one") }}
{{- include "kcc.unsupported" (list $ "access_levels" $v.access_levels "AccessContextManagerAccessLevel is not ported to this chart yet") }}
{{- include "kcc.unsupported" (list $ "access_policy" $v.access_policy "it names the access policy of access_levels, which is not ported to this chart yet") }}
{{- include "kcc.unsupported" (list $ "asset_feeds" $v.asset_feeds "AssetFeed is not ported to this chart yet") }}
{{- include "kcc.unsupported" (list $ "workforce_identity_pools" $v.workforce_identity_pools "IAMWorkforcePool and IAMWorkforcePoolProvider are not ported to this chart yet") }}
{{- include "kcc.unsupported" (list $ "cloud_armor_policy" $v.cloud_armor_policy "ComputeOrganizationSecurityPolicyAssociation is a v1alpha1 kind; not ported yet") }}
{{- include "kcc.unsupported" (list $ "context_aware_access_bindings" $v.context_aware_access_bindings "AccessContextManagerGCPUserAccessBinding is a v1alpha1 kind; not ported yet") }}
{{- include "kcc.unsupported" (list $ "iam_deny_policies" $v.iam_deny_policies "IAMDenyPolicy is a v1alpha1 kind; not ported yet") }}
{{- include "kcc.unsupported" (list $ "model_armor_floor_setting" $v.model_armor_floor_setting "ModelArmorFloorSetting is a v1alpha1 kind; not ported yet") }}
{{- include "kcc.unsupported" (list $ "scc_mute_configs" $v.scc_mute_configs "SecurityCenterMuteConfig is a v1alpha1 kind; not ported yet") }}
{{- include "kcc.unsupported" (list $ "scc_sha_custom_modules" $v.scc_sha_custom_modules "SecurityCenterManagementSecurityHealthAnalyticsCustomModule is a v1alpha1 kind; not ported yet") }}
{{- include "kcc.unsupported" (list $ "logging_settings" $v.logging_settings "Config Connector has no kind for an organization's logging settings (LoggingSettings)") }}
{{- include "kcc.unsupported" (list $ "service_agents_config" $v.service_agents_config "Config Connector has no kind for an organization's service identities (ServiceIdentity takes only a project)") }}
{{- $contacts := $v.contacts | default dict }}
{{- range $email := keys $contacts | sortAlpha }}
{{- $types := index $contacts $email }}
{{- range $t := $types }}
{{- if not (has $t (list "ALL" "SUSPENSION" "SECURITY" "TECHNICAL" "BILLING" "LEGAL" "PRODUCT_UPDATES")) }}
{{- fail "organization: Invalid contact notification value." }}
{{- end }}
{{- end }}
---
apiVersion: essentialcontacts.cnrm.cloud.google.com/v1beta1
kind: EssentialContactsContact
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "contact" $email)) "id" (printf "contact:%s" $email) "abandon" $abandon) | nindent 2 }}
spec:
  organizationRef:
    {{- include "organization.ref" $ | nindent 4 }}
  email: {{ $email | quote }}
  languageTag: en
  notificationCategorySubscriptions: {{ toJson $types }}
{{- end }}
{{- with $v.firewall_policy }}
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeFirewallPolicyAssociation
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "firewall-policy")) "id" "firewall_policy" "abandon" $abandon) | nindent 2 }}
spec:
  resourceID: {{ include "kcc.cloudName" (list $ "firewall policy association" .name 63) | quote }}
  attachmentTargetRef:
    external: {{ $org | quote }}
  firewallPolicyRef:
    external: {{ ternary .policy (printf "locations/global/firewallPolicies/%s" .policy) (hasPrefix "locations/" .policy) | quote }}
{{- end }}
{{- $constraints := $v.org_policy_custom_constraints | default dict }}
{{- range $name := keys $constraints | sortAlpha }}
{{- $c := index $constraints $name }}
---
apiVersion: orgpolicy.cnrm.cloud.google.com/v1beta1
kind: OrgPolicyCustomConstraint
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "constraint" $name)) "id" (printf "custom-constraint:%s" $name) "abandon" $abandon) | nindent 2 }}
spec:
  resourceID: {{ $name | quote }}
  organizationRef:
    {{- include "organization.ref" $ | nindent 4 }}
  {{- with $c.display_name }}
  displayName: {{ . | quote }}
  {{- end }}
  {{- with $c.description }}
  description: {{ . | quote }}
  {{- end }}
  actionType: {{ $c.action_type | quote }}
  condition: {{ $c.condition | quote }}
  methodTypes: {{ toJson $c.method_types }}
  resourceTypes: {{ toJson $c.resource_types }}
{{- end }}
{{- $bindings := $v.tag_bindings | default dict }}
{{- range $key := keys $bindings | sortAlpha }}
---
apiVersion: tags.cnrm.cloud.google.com/v1beta1
kind: TagsTagBinding
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "tag" $key)) "id" (printf "tag-binding:%s" $key)) | nindent 2 }}
spec:
  parentRef:
    external: {{ printf "//cloudresourcemanager.googleapis.com/%s" $org | quote }}
  tagValueRef:
    external: {{ index $bindings $key | quote }}
{{- end }}
