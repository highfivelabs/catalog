{{- /*
Copyright 2026 High Five Labs
SPDX-License-Identifier: Apache-2.0
Ported from cloud-foundation-fabric modules/organization/iam.tf (v60.0.0),
Copyright 2025 Google LLC, Apache-2.0.

google_organization_iam_custom_role.roles: one IAMCustomRole per entry of
custom_roles on the organization (the organization-id annotation), its role
ID the key, title "Custom role <key>" and
description "Terraform-managed." unless given, as fabric sets them.
*/ -}}
{{- $v := .Values }}
{{- $roles := $v.custom_roles | default dict }}
{{- range $key := keys $roles | sortAlpha }}
{{- $r := index $roles $key }}
{{- if not (has ($r.stage | default "GA") (list "ALPHA" "BETA" "GA" "DEPRECATED" "DISABLED" "EAP")) }}
{{- fail (printf "organization: custom_roles.%s: Stage must be one of ALPHA, BETA, GA, DEPRECATED, DISABLED, EAP." $key) }}
{{- end }}
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMCustomRole
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "role" $key)) "id" (printf "custom-role:%s" $key) "annotations" (dict "cnrm.cloud.google.com/organization-id" (include "organization.number" $)) "abandon" (include "kcc.abandon" $)) | nindent 2 }}
spec:
  resourceID: {{ $key | quote }}
  title: {{ $r.title | default (printf "Custom role %s" $key) | quote }}
  description: {{ $r.description | default "Terraform-managed." | quote }}
  {{- with $r.stage }}
  stage: {{ . | quote }}
  {{- end }}
  permissions:
    {{- range $p := $r.permissions }}
    - {{ $p | quote }}
    {{- end }}
{{- end }}
