# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set, or accepts only in part. Read by `task
# coverage`; `task coverage-verify` renders the chart to check that each one
# is refused. kind: gap (no Config Connector kind or field), alpha (only a
# v1alpha1 kind), not-ported (Config Connector has it, the chart does not
# map it yet) or by-design (Bundt replaces it). partial: the variable is
# accepted, the reason says what is refused.
refused:
  - variable: access_levels
    kind: not-ported
    reason: "AccessContextManagerAccessLevel is a stable kind, not ported to this chart yet"
  - variable: access_policy
    kind: not-ported
    reason: "names the access policy of access_levels, which is not ported to this chart yet"
  - variable: asset_feeds
    kind: not-ported
    reason: "AssetFeed is a stable kind, not ported to this chart yet"
  - variable: asset_search
    kind: by-design
    reason: "a Cloud Asset Inventory search is a read at plan time, not a resource; Bundt does not run one"
  - variable: cloud_armor_policy
    kind: alpha
    reason: "ComputeOrganizationSecurityPolicyAssociation is v1alpha1; not ported yet, even with allow_alpha"
  - variable: context
    kind: by-design
    reason: "Bundt replaces fabric's $context lookups with ${...} expressions and valueFrom in the component's inputs"
  - variable: context_aware_access_bindings
    kind: alpha
    reason: "AccessContextManagerGCPUserAccessBinding is v1alpha1; not ported yet, even with allow_alpha"
  - variable: factories_config
    kind: by-design
    reason: "a chart cannot read the caller's files: their entries go in the variables they feed (custom_roles, org_policies, org_policy_custom_constraints, pam_entitlements, tags)"
  - variable: iam_deny_policies
    kind: alpha
    reason: "IAMDenyPolicy is v1alpha1; not ported yet, even with allow_alpha"
  - variable: logging_settings
    kind: gap
    reason: "Config Connector has no kind for an organization's logging settings (LoggingSettings)"
  - variable: logging_sinks
    kind: gap
    reason: "intercept_children is refused (LoggingLogSink has no interceptChildren); a sink of type project is refused (LoggingLogSink's destination is never a project); a bigquery sink needs iam: false (dataset IAM is alpha)"
    partial: true
    fields: [intercept_children]
    values: [project]
  - variable: model_armor_floor_setting
    kind: alpha
    reason: "ModelArmorFloorSetting is v1alpha1; not ported yet, even with allow_alpha"
  - variable: network_tags
    kind: gap
    reason: "tag keys and values take no IAM conditions"
    partial: true
    fields: [iam_bindings.condition, iam_bindings_additive.condition]
  - variable: scc_mute_configs
    kind: alpha
    reason: "SecurityCenterMuteConfig is v1alpha1; not ported yet, even with allow_alpha"
  - variable: scc_sha_custom_modules
    kind: alpha
    reason: "SecurityCenterManagementSecurityHealthAnalyticsCustomModule is v1alpha1; not ported yet, even with allow_alpha"
  - variable: service_agents_config
    kind: gap
    reason: "Config Connector has no kind for an organization's service identities (ServiceIdentity takes only a project)"
  - variable: tags
    kind: gap
    reason: "fabric's tag keys are ported; allowed_values_regex is refused (TagsTagKey has no such field), and so are IAM conditions on tag keys and values (they take none). A tags entry whose value is a string is the catalog's cloud label, applied to every object"
    partial: true
    fields: [allowed_values_regex, iam_bindings.condition, iam_bindings_additive.condition]
  - variable: tags_config
    kind: by-design
    reason: "force_context_ids is refused: Bundt replaces fabric's $context ids with ${...} expressions"
    partial: true
    fields: [force_context_ids]
  - variable: workforce_identity_pools
    kind: not-ported
    reason: "IAMWorkforcePool and IAMWorkforcePoolProvider are stable kinds, not ported to this chart yet"
