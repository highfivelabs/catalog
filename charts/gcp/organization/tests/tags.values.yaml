# The module README's tags examples, less what the chart refuses
# (allowed_values_regex, IAM conditions on tag values: tests/*.fail.yaml):
# a tag key with IAM in each form and two values, a tag binding, and a
# network tag key with values.
organization_id: organizations/1122334455
tags:
  environment:
    description: Environment specification.
    iam:
      roles/resourcemanager.tagAdmin: ["group:organization-admins@example.org"]
    iam_bindings:
      viewer:
        role: roles/resourcemanager.tagViewer
        members: ["group:gcp-support@example.org"]
    iam_bindings_additive:
      user_app1:
        role: roles/resourcemanager.tagUser
        member: "group:app1-team@example.org"
    values:
      dev:
        iam_bindings_additive:
          user_app2:
            role: roles/resourcemanager.tagUser
            member: "group:app2-team@example.org"
      prod:
        description: "Environment: production."
        iam:
          roles/resourcemanager.tagViewer: ["group:app1-team@example.org"]
tag_bindings:
  env-prod: tagValues/1234567890
network_tags:
  net-environment:
    description: This is a network tag.
    network: my-project/my-vpc
    iam:
      roles/resourcemanager.tagAdmin: ["group:organization-admins@example.org"]
    values:
      dev: {}
      prod:
        description: "Environment: production."
        iam:
          roles/resourcemanager.tagUser: ["group:organization-admins@example.org"]
