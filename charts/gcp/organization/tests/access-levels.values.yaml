# The module README's context-aware access example, less the user access
# binding (AccessContextManagerGCPUserAccessBinding is v1alpha1), and an
# asset feed.
organization_id: organizations/1122334455
access_policy: "1234567890"
access_levels:
  trusted_ips:
    title: Trusted Corporate IPs
    conditions:
      - ip_subnetworks: [203.0.113.0/24, 198.51.100.0/24]
asset_feeds:
  all-iam:
    billing_project: my-project
    content_type: IAM_POLICY
    asset_types: [cloudresourcemanager.googleapis.com/Project]
    feed_output_config:
      pubsub_destination: {topic: projects/my-project/topics/feeds}
