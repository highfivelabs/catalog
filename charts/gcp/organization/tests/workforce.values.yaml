# The module README's workforce identity example, less what the chart
# refuses (oauth2_client_config, scim_usage, scim_tenant and the OIDC
# client secret: tests/*.fail.yaml): a pool with a SAML provider on the
# azuread mapping template, a SAML provider with its own mapping, and an
# OIDC provider with web SSO.
organization_id: organizations/1122334455
workforce_identity_pools:
  test-pool:
    display_name: Test Pool
    description: Workforce pool for testing.
    providers:
      saml-basic:
        attribute_mapping_template: azuread
        identity_provider:
          saml:
            idp_metadata_xml: '<?xml version="1.0" encoding="utf-8"?>...'
      saml-full:
        attribute_mapping:
          google.subject: assertion.sub
        identity_provider:
          saml:
            idp_metadata_xml: '<?xml version="1.0" encoding="utf-8"?>...'
      oidc-full:
        attribute_mapping:
          google.subject: assertion.sub
        identity_provider:
          oidc:
            issuer_uri: https://sts.windows.net/abcd01234/
            client_id: https://analysis.windows.net/powerbi/connector/GoogleBigQuery
            web_sso_config:
              response_type: CODE
              assertion_claims_behavior: MERGE_USER_INFO_OVER_ID_TOKEN_CLAIMS
