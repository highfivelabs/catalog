# The module README's PAM entitlement and custom role examples, and its
# firewall policy association.
organization_id: organizations/1122334455
pam_entitlements:
  net-admins:
    max_request_duration: 3600s
    manual_approvals:
      require_approver_justification: true
      steps:
        - approvers: ["group:gcp-organization-admins@example.com"]
    eligible_users: ["group:gcp-network-admins@example.com"]
    privileged_access:
      - role: roles/compute.networkAdmin
      - role: roles/compute.admin
custom_roles:
  myRole:
    title: My custom role
    description: Allows listing compute instances.
    permissions: [compute.instances.list]
iam:
  organizations/1122334455/roles/myRole: ["group:organization-admins@example.org"]
firewall_policy:
  name: test-1
  policy: "123456789"
