      roleBindings:
        - role: "roles/compute.networkAdmin"
        - role: "roles/compute.admin"
  requesterJustificationConfig:
    unstructured: {}
  approvalWorkflow:
    manualApprovals:
      requireApproverJustification: true
      steps:
        - approvers:
            - principals: ["group:gcp-organization-admins@example.com"]
          approvalsNeeded: 1
