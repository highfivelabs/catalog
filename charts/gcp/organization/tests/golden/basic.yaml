          set to true.
        expression: resource.matchTag('1234567890/allowexternal', 'true')
        title: Allow external identities
    - condition:
        description: For any resource without allowexternal=true, only allow identities
          from restricted domains.
        expression: '!resource.matchTag(''1234567890/allowexternal'', ''true'')'
      values:
        allowedValues:
        - C0xxxxxxx
        - C0yyyyyyy
