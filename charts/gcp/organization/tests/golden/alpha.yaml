apiVersion: modelarmor.cnrm.cloud.google.com/v1alpha1
kind: ModelArmorFloorSetting
metadata:
  name: alpha-model-armor
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "alpha"
    app.kubernetes.io/name: organization
    app.kubernetes.io/version: "0.3.0"
  annotations:
    hfl.dev/id: "model_armor_floor_setting"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  organizationRef:
    external: "organizations/1122334455"
  location: global
  enableFloorSettingEnforcement: true
  filterConfig:
    maliciousURIFilterSettings:
      filterEnforcement: ENABLED
    piAndJailbreakFilterSettings:
      filterEnforcement: ENABLED
      confidenceLevel: "MEDIUM_AND_ABOVE"
    raiSettings:
      raiFilters:
        - filterType: SEXUALLY_EXPLICIT
          confidenceLevel: "MEDIUM_AND_ABOVE"
        - filterType: HATE_SPEECH
          confidenceLevel: "MEDIUM_AND_ABOVE"
        - filterType: HARASSMENT
          confidenceLevel: "MEDIUM_AND_ABOVE"
        - filterType: DANGEROUS
          confidenceLevel: "MEDIUM_AND_ABOVE"
    sdpSettings:
      basicConfig:
        filterEnforcement: ENABLED
  floorSettingMetadata:
    multiLanguageDetection:
      enableMultiLanguageDetection: false
