apiVersion: iam.cnrm.cloud.google.com/v1alpha1
kind: IAMDenyPolicy
metadata:
  name: alpha-deny-prevent-sa-token-creation
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "alpha"
    app.kubernetes.io/name: organization
    app.kubernetes.io/version: "0.3.0"
  annotations:
    hfl.dev/id: "deny-policy:prevent-sa-token-creation"
spec:
  resourceID: "prevent-sa-token-creation"
  organizationRef:
    external: "organizations/1122334455"
  displayName: "Prevent SA token creation"
  rules:
    -
      description: "Deny service account token creation to all except the central admin group."
      denyRule:
        deniedPrincipals: ["principalSet://goog/public:all"]
        deniedPermissions: ["iam.serviceAccounts.getAccessToken"]
        exceptionPrincipals: ["principalSet://goog/group/gcp-admins@example.com"]
