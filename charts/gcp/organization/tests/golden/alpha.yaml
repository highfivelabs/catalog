apiVersion: securitycentermanagement.cnrm.cloud.google.com/v1alpha1
kind: SecurityCenterManagementSecurityHealthAnalyticsCustomModule
metadata:
  name: alpha-sha-cloudkmkeyrotationperiod-ea569cd0
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "alpha"
    app.kubernetes.io/name: organization
    app.kubernetes.io/version: "0.3.0"
  annotations:
    hfl.dev/id: "scc-sha-custom-module:cloudkmKeyRotationPeriod"
spec:
  organizationRef:
    external: "organizations/1122334455"
  location: global
  displayName: "cloudkmKeyRotationPeriod"
  enablementState: "ENABLED"
  customConfig:
    predicate:
      expression: "resource.rotationPeriod > duration(\"2592000s\")"
    resourceSelector:
      resourceTypes: ["cloudkms.googleapis.com/CryptoKey"]
    description: "The rotation period of the identified cryptokey resource exceeds 30 days."
    recommendation: "Set the rotation period to at most 30 days."
    severity: "MEDIUM"
