apiVersion: iam.cnrm.cloud.google.com/v1alpha1
kind: IAMDenyPolicy
metadata:
  name: alpha-deny-conditional-key-deny
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "alpha"
    app.kubernetes.io/name: organization
    app.kubernetes.io/version: "0.3.0"
  annotations:
    hfl.dev/id: "deny-policy:conditional-key-deny"
spec:
  resourceID: "conditional-key-deny"
  organizationRef:
    external: "organizations/1122334455"
  displayName: "Conditional SA Key Deny"
  rules:
    -
      description: "Deny key creation outside of authorized IPs using a condition."
      denyRule:
        deniedPrincipals: ["principalSet://goog/public:all"]
        deniedPermissions: ["iam.serviceAccountKeys.create"]
        denialCondition:
          expression: "!inIpRange(request.auth.access_levels, 'accessPolicies/123456789/accessLevels/trusted_ips')"
          title: "ip-restriction"
          description: "Restrict access to specific IP ranges"
