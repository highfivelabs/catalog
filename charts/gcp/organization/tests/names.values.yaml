# Labels and tags, as Bundt passes them from a team's naming convention
# (docs/design.md, "Names, labels and tags"). The chart gives no name in
# full: names takes no key (task test renders every case with a namePrefix).
organization_id: organizations/123456789012
labels: {hfl.dev/team: shop, hfl.dev/environment: dev}
tags: {team: shop, environment: dev}
logging_exclusions:
  no-gce: resource.type=gce_instance
iam:
  roles/viewer: ["group:viewers@example.org"]
