# Values mirror the Terraform variables of fabric's cloud-build-v2-connection
# module (v60.0.0): same names, types and defaults, so a module block's
# arguments become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.connection sets the connection's ID in full (else name).
names: {}
# An optional convenience: "<namePrefix>-" in front of the connection's ID
# (unless set under names) and of every repository's. Empty (the default)
# changes nothing.
namePrefix: ""
# Kubernetes labels on every object. None of these resources takes Google
# Cloud labels.
labels: {}
# Cloud labels: none of these resources takes Google Cloud labels, so they
# stay on the objects' metadata.labels.
tags: {}

# Annotations.
annotations: {}
# Connection configuration: exactly one of bitbucket_cloud,
# bitbucket_data_center, github, github_enterprise (refused), gitlab.
connection_config: {}
# Create connection.
connection_create: true
# Context-specific interpolations. Refused when set: Bundt expressions
# (${...}) and valueFrom replace fabric's $context lookups.
context: {}
# Flag indicating whether the connection is disabled or not.
disabled: false
# IAM bindings in {ROLE => [MEMBERS]} format.
iam: {}
# Authoritative IAM bindings in {KEY => {role = ROLE, members = [],
# condition = {}}}. Keys are arbitrary.
iam_bindings: {}
# Individual additive IAM bindings. Keys are arbitrary. IAMMember is
# v1alpha1: needs allow_alpha.
iam_bindings_additive: {}
# Authoritative IAM binding in {PRINCIPAL => [ROLES]} format. Merged with iam.
iam_by_principals: {}
# Location.
location: ""
# Name.
name: ""
# Project ID.
project_id: ""
# Repositories, each with its triggers. CloudBuildRepository is v1alpha1:
# needs allow_alpha.
repositories: {}

# Not a fabric variable: repositories (and their triggers) and
# iam_bindings_additive render config-connector-extensions'
# CloudBuildRepository and IAMMember, which are v1alpha1; set true to accept
# that their schemas may change (docs/design.md, "Alpha kinds").
allow_alpha: false
# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# connection, repositories and triggers when the component is deleted.
# PREVENT has no Config Connector equivalent.
deletion_policy: null
