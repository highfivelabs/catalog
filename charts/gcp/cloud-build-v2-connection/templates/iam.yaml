{{- /*
Copyright 2026 High Five Labs
SPDX-License-Identifier: Apache-2.0
Ported from cloud-foundation-fabric modules/cloud-build-v2-connection/iam.tf
(v60.0.0), Copyright 2025 Google LLC, Apache-2.0.

google_cloudbuildv2_connection_iam_binding.authoritative: one IAMBinding
(config-connector-extensions, iam.gcp.hfl.dev/v1beta1) per role of iam
merged with iam_by_principals, as fabric's local.iam merges them.
google_cloudbuildv2_connection_iam_binding.bindings: one IAMBinding per
entry of iam_bindings.
google_cloudbuildv2_connection_iam_member.bindings: one IAMMember
(config-connector-extensions, iam.gcp.hfl.dev/v1alpha1, so allow_alpha) per
entry of iam_bindings_additive.
fabric sends no condition for either (its variables accept one), so
neither does the chart. On the chart's connection, or on the connection of
that name when connection_create is false.
*/ -}}
{{- $v := .Values }}
{{- $ref := include "cbConnection.ref" . }}
{{- $iam := dict }}
{{- range $role, $members := ($v.iam | default dict) }}
{{- $_ := set $iam $role (concat (get $iam $role | default list) $members) }}
{{- end }}
{{- range $principal, $roles := ($v.iam_by_principals | default dict) }}
{{- range $role := $roles }}
{{- $_ := set $iam $role (append (get $iam $role | default list) $principal) }}
{{- end }}
{{- end }}
{{- range $role := keys $iam | sortAlpha }}
---
apiVersion: iam.gcp.hfl.dev/v1beta1
kind: IAMBinding
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "iam" $role)) "id" (printf "iam:%s" $role) "project" $v.project_id) | nindent 2 }}
spec:
  resourceRef:
    {{- $ref | nindent 4 }}
  role: {{ $role | quote }}
  members:
  {{- range $m := (index $iam $role | uniq | sortAlpha) }}
    - {{ $m | quote }}
  {{- end }}
{{- end }}
{{- range $bk := keys ($v.iam_bindings | default dict) | sortAlpha }}
{{- $b := index $v.iam_bindings $bk }}
---
apiVersion: iam.gcp.hfl.dev/v1beta1
kind: IAMBinding
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "iam-binding" $bk)) "id" (printf "iam-binding:%s" $bk) "project" $v.project_id) | nindent 2 }}
spec:
  resourceRef:
    {{- $ref | nindent 4 }}
  role: {{ $b.role | quote }}
  members:
  {{- range $m := ($b.members | uniq | sortAlpha) }}
    - {{ $m | quote }}
  {{- end }}
{{- end }}
{{- include "kcc.alpha" (list $ "iam_bindings_additive" $v.iam_bindings_additive "IAMMember (config-connector-extensions)") }}
{{- range $bk := keys ($v.iam_bindings_additive | default dict) | sortAlpha }}
{{- $b := index $v.iam_bindings_additive $bk }}
---
apiVersion: iam.gcp.hfl.dev/v1alpha1
kind: IAMMember
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "iam-member" $bk)) "id" (printf "iam-member:%s" $bk) "project" $v.project_id) | nindent 2 }}
spec:
  resourceRef:
    {{- $ref | nindent 4 }}
  role: {{ $b.role | quote }}
  member: {{ $b.member | quote }}
{{- end }}
