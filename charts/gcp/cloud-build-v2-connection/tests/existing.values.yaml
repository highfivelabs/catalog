# connection_create: false: repositories, triggers and IAM on a connection
# made elsewhere, named by name (connection_config is still required: fabric
# validates it whatever connection_create says).
project_id: my-project
name: shared-github
location: europe-west1
connection_create: false
allow_alpha: true
connection_config:
  github: {app_installation_id: 42}
repositories:
  infra:
    remote_uri: https://github.com/my-org/infra.git
    triggers:
      pr:
        pull_request: {branch: main}
        filename: cloudbuild.yaml
iam:
  roles/cloudbuild.connectionViewer: ["group:infra@example.com"]
