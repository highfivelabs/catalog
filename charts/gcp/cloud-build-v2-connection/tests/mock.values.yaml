# Applied to the fake cloud by hack/mock-apply.sh: a GitHub connection. No
# repositories or triggers: CloudBuildRepository is v1alpha1, and alpha
# features are not in fake-cloud cases. A role on the
# connection (IAMBinding; config-connector-extensions' fake cloud serves
# getIamPolicy on a connection since 35833eb). mockgcp reads neither the
# secret version nor the app installation.
project_id: mock-project
name: catalog-mock-cbconn
location: us-central1
labels: {env: test}
connection_config:
  github:
    app_installation_id: "1234567"
    authorizer_credential_secret_version: projects/mock-project/secrets/catalog-mock-gh/versions/1
iam:
  roles/cloudbuild.connectionViewer: ["group:viewers@example.com"]
