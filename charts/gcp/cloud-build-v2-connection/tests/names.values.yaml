# Names in full, labels and tags, as Bundt passes them from a team's naming
# convention (docs/design.md, "Names, labels and tags"): the connection takes
# its ID as given, with no prefix.
project_id: my-project
name: github
location: europe-west1
names: {connection: shop-dev-github}
labels: {hfl.dev/team: shop, hfl.dev/environment: dev}
tags: {team: shop, environment: dev}
connection_config:
  github: {app_installation_id: "1234567", authorizer_credential_secret_version: projects/my-project/secrets/gh/versions/1}
iam:
  roles/cloudbuild.connectionViewer: ["group:shop@example.com"]
