# fabric's README "Bitbucket Data Center" example (its misspelt
# app_instalation_id left out).
project_id: my-project
name: my-connection
location: europe-west1
allow_alpha: true
connection_config:
  bitbucket_data_center:
    host_uri: https://bbdc-host.com
    webhook_secret_secret_version: projects/my-project/secrets/webhook-secret/versions/1
    authorizer_credential_secret_version: projects/my-project/secrets/authorizer-credential/versions/1
    read_authorizer_credential_secret_version: projects/my-project/secrets/read-authorizer-credential/versions/1
repositories:
  my-repository:
    remote_uri: https://bbdc-host.com/scm/my-project/my-repository.git
    triggers:
      my-trigger:
        push: {branch: main}
        filename: cloudbuild.yaml
iam:
  roles/cloudbuild.connectionViewer: ["group:mygroup@example.com"]
