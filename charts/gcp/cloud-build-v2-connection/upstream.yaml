# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set, or accepts only in part. Read by `task
# coverage`; `task coverage-verify` renders the chart to check that each one
# is refused. kind: gap (no Config Connector kind or field), alpha (a
# v1alpha1 kind, accepted with allow_alpha: true) or by-design (Bundt
# replaces it). partial: the variable is accepted, the reason says what is
# refused.
refused:
  - variable: context
    kind: by-design
    reason: "Bundt replaces fabric's $context lookups with ${...} expressions and valueFrom in the component's inputs"
  - variable: connection_config
    kind: gap
    reason: "github_enterprise is refused: config-connector-extensions' CloudBuildConnection requires githubEnterpriseConfig.apiKey, which the module's variable has no field for"
    partial: true
    fields: [github_enterprise]
  - variable: repositories
    kind: alpha
    reason: "config-connector-extensions' CloudBuildRepository is v1alpha1: repositories, and the triggers on them, render only with allow_alpha: true"
    partial: true
  - variable: iam_bindings_additive
    kind: alpha
    reason: "config-connector-extensions' IAMMember is v1alpha1: rendered only with allow_alpha: true"
    partial: true
