apiVersion: v2
name: cloud-build-v2-connection
description: >-
  A Cloud Build (2nd gen) host connection to GitHub, GitLab or Bitbucket,
  its linked repositories, a build trigger per repository event, and IAM on
  the connection, as Config Connector and config-connector-extensions
  objects. A port of Cloud Foundation Fabric's cloud-build-v2-connection
  module.
type: application
version: 0.1.0
# The fabric release this chart was ported from (UPSTREAM.md).
appVersion: "fabric-v60.0.0"
kubeVersion: ">=1.27.0-0"
keywords: [gcp, config-connector, cloud-build, ci, github, gitlab, bitbucket, fabric]
home: https://github.com/highfivelabs/catalog
