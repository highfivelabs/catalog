#
# The Bundt Package for this chart (see iam-service-account/package.yaml).
# Outputs are fabric's declared outputs, selected (docs/design.md,
# "Outputs"). id is computed from the inputs as fabric computes it, so
# dependents need not wait; repository_ids from the rendered repositories;
# trigger_ids from each trigger's status.triggerId (the cloud assigns it),
# null until reported. Not outputs: fabric's whole objects (repositories,
# triggers).
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: gcp-cloud-build-v2-connection
spec:
  version: 0.1.0
  engine: helm
  providers: [kcc]
  outputs:
    id: >-
      'projects/' + inputs.project_id + '/locations/' + inputs.location + '/connections/'
      + ('connection' in inputs.names ? inputs.names.connection
        : (inputs.namePrefix != '' ? inputs.namePrefix + '-' : '') + inputs.name)
    repository_ids: >-
      resources.transformMapEntry(k, v, v.kind == 'CloudBuildRepository',
        {k.substring(11): 'projects/' + v.spec.projectRef.external + '/locations/' + v.spec.location
          + '/connections/' + v.spec.connection + '/repositories/' + v.spec.resourceID})
    trigger_ids: >-
      resources.transformMapEntry(k, v, v.kind == 'CloudBuildTrigger',
        {k.substring(8): has(v.status) && has(v.status.triggerId)
          ? dyn('projects/' + inputs.project_id + '/locations/' + v.spec.location + '/triggers/' + v.status.triggerId)
          : null})
