apiVersion: v2
name: gke-cluster
description: >-
  A GKE cluster, Standard with n node pools or Autopilot, public or private,
  with its node service account and that account's grants, as Config
  Connector objects. A port of terraform-google-modules' kubernetes-engine
  beta-private-cluster module, which carries every input of the root,
  private-cluster and beta-public-cluster variants, and of its Autopilot
  twins through mode: autopilot.
type: application
version: 0.2.0
# The module release this chart was ported from (UPSTREAM.md).
appVersion: "kubernetes-engine-v47.0.0"
kubeVersion: ">=1.27.0-0"
keywords: [gcp, config-connector, gke, kubernetes-engine, terraform-google-modules]
home: https://github.com/highfivelabs/catalog
sources:
  - https://github.com/terraform-google-modules/terraform-google-kubernetes-engine/tree/a19597ac18ad833d224448e2954df93095b8ce9d/modules/beta-private-cluster
  - https://github.com/terraform-google-modules/terraform-google-kubernetes-engine/tree/a19597ac18ad833d224448e2954df93095b8ce9d/modules/beta-autopilot-private-cluster
annotations:
  hfl.dev/source: terraform-google-kubernetes-engine/modules/beta-private-cluster
  hfl.dev/source-version: v47.0.0
  hfl.dev/source-commit: a19597ac18ad833d224448e2954df93095b8ce9d
  hfl.dev/config-connector: "1.160.0"
