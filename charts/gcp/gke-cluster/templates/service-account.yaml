The node service account (create_service_account) and the roles the module
grants it, each an additive IAMPolicyMember with the account as member
(docs/design.md, "IAM"). The fleet service agent grants
(fleet_project_grant_service_agent) are refused with fleet_project.
*/ -}}
{{- if include "gke.createSA" . }}
{{- $v := .Values }}
{{- $id := include "gke.saId" . }}
{{- $abandon := include "kcc.abandon" . }}
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMServiceAccount
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "gke.saObject" .) "id" "service_account" "project" $v.project_id "abandon" $abandon) | nindent 2 }}
spec:
  resourceID: {{ $id }}
  displayName: {{ $id | quote }}
  description: {{ printf "Terraform-managed service account for cluster %s" $v.name | quote }}
{{- $grants := dict }}
{{- $_ := set $grants (printf "%s|roles/container.defaultNodeServiceAccount" $v.project_id) (list $v.project_id "roles/container.defaultNodeServiceAccount") }}
{{- $_ := set $grants (printf "%s|%s" $v.project_id $v.monitoring_metric_writer_role) (list $v.project_id $v.monitoring_metric_writer_role) }}
{{- $_ := set $grants (printf "%s|roles/stackdriver.resourceMetadata.writer" $v.project_id) (list $v.project_id "roles/stackdriver.resourceMetadata.writer") }}
{{- if $v.grant_registry_access }}
{{- range $p := ($v.registry_project_ids | default (list $v.project_id)) }}
{{- $_ := set $grants (printf "%s|roles/storage.objectViewer" $p) (list $p "roles/storage.objectViewer") }}
{{- $_ := set $grants (printf "%s|roles/artifactregistry.reader" $p) (list $p "roles/artifactregistry.reader") }}
{{- if $v.enable_gcfs }}
{{- $_ := set $grants (printf "%s|roles/serviceusage.serviceUsageConsumer" $p) (list $p "roles/serviceusage.serviceUsageConsumer") }}
{{- end }}
{{- end }}
{{- end }}
{{- range $key, $g := $grants }}
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "grant" $key)) "id" (printf "grant-%s" $key) "project" $v.project_id) | nindent 2 }}
spec:
  resourceRef:
    {{- /* Config Connector needs apiVersion to resolve an external reference's kind */}}
    apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
    kind: Project
    external: {{ printf "projects/%s" (index $g 0) | quote }}
  role: {{ index $g 1 | quote }}
  memberFrom:
    serviceAccountRef:
      name: {{ include "gke.saObject" $ }}
{{- end }}
{{- end }}
