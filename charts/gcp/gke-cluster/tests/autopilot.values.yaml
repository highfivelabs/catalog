# The module README's usage example (beta-autopilot-private-cluster), as
# values: mode autopilot, private nodes and a private endpoint.
mode: autopilot
project_id: my-project
name: gke-test-1
region: us-central1
zones: [us-central1-a, us-central1-b, us-central1-f]
network: vpc-01
subnetwork: us-central1-01
ip_range_pods: us-central1-01-gke-01-pods
