# Standard, nodes running as a node service account made elsewhere (the
# project-wrapper chart's node_service_account_email output): no account
# and no IAM rendered here; the cluster and every pool use this one.
project_id: my-gke-project
name: gke-dev
region: us-central1
regional: false
zones: [us-central1-a]
network: vpc-01
subnetwork: us-central1-01
ip_range_pods: pods
ip_range_services: services
create_service_account: false
service_account: k8s-nodes@my-gke-project.iam.gserviceaccount.com
remove_default_node_pool: true
node_pools:
  - {name: pool-a, machine_type: e2-small, min_count: 1, max_count: 2}
  - {name: pool-b, machine_type: e2-small, autoscaling: false, node_count: 1}
