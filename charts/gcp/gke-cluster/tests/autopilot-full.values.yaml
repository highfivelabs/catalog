# Autopilot with what that mode adds and shares: an existing node service
# account, NET_ADMIN, the default compute class, network tags, authorized
# networks, a PSC control plane subnetwork, Shared VPC and notifications.
mode: autopilot
project_id: my-project
network_project_id: host-project
name: ap-prod
region: europe-west1
network: shared-vpc
subnetwork: gke-europe-west1
ip_range_pods: pods
ip_range_services: services
create_service_account: false
service_account: gke-nodes@my-project.iam.gserviceaccount.com
allow_net_admin: true
default_compute_class_enabled: true
network_tags: [allow-health-checks]
master_authorized_networks:
  - {cidr_block: 10.0.0.0/8, display_name: corp}
gcp_public_cidrs_access_enabled: false
private_endpoint_subnetwork: gke-control-plane
enable_private_endpoint: true
dns_allow_external_traffic: true
release_channel: STABLE
kubernetes_version: "1.33"
gateway_api_channel: CHANNEL_STANDARD
security_posture_mode: BASIC
security_posture_vulnerability_mode: VULNERABILITY_BASIC
notification_config_topic: projects/my-project/topics/gke-events
notification_filter_event_type: [UPGRADE_EVENT]
enable_vertical_pod_autoscaling: false
cluster_resource_labels: {env: prod}
