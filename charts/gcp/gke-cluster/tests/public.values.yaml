# The root module (a public cluster), as values: zonal, no private nodes,
# one fixed-size node pool, the default node pool removed, Terraform's
# node service account by name.
project_id: my-project
name: public-1
regional: false
zones: [europe-west1-b, europe-west1-c]
network: default
subnetwork: default
ip_range_pods: pods
ip_range_services: services
enable_private_nodes: false
remove_default_node_pool: true
release_channel: UNSPECIFIED
kubernetes_version: 1.33.5-gke.1000000
service_account_name: tf-gke-public-1-ab12
node_pools:
  - name: pool-01
    autoscaling: false
    node_count: 2
    auto_upgrade: false
    machine_type: e2-standard-2
