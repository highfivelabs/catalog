# Autopilot with only the webhook rule: a public cluster, so the control
# plane reaches nodes from the subnetwork's range, and Autopilot nodes get
# the cluster's network tag (beta-autopilot-private-cluster's cluster.tf).
mode: autopilot
project_id: my-project
name: gke-ap
region: europe-west1
network: vpc
subnetwork: gke
ip_range_pods: pods
ip_range_services: services
add_master_webhook_firewall_rules: true
firewall_ranges: {subnetwork: 10.0.0.0/24}
