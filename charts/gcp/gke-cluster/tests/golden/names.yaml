# Source: gke-cluster/templates/node-pools.yaml
apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerNodePool
metadata:
  name: names-pool-default-node-pool
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "names"
    app.kubernetes.io/name: gke-cluster
    app.kubernetes.io/version: "0.2.0"
    environment: "dev"
    hfl.dev/team: "shop"
    team: "shop"
  annotations:
    hfl.dev/id: "pool:default-node-pool"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: default-node-pool
  location: "europe-west1"
  clusterRef:
    name: names
  initialNodeCount: 1
  autoscaling:
    minNodeCount: 1
    maxNodeCount: 100
  management:
    autoRepair: true
    autoUpgrade: true
  upgradeSettings:
    strategy: "SURGE"
    maxSurge: 1
    maxUnavailable: 0
  nodeConfig:
    imageType: "COS_CONTAINERD"
    machineType: "e2-medium"
    diskSizeGb: 100
    diskType: "pd-standard"
    localSsdCount: 0
    serviceAccountRef: {"name":"names-nodes"}
    tags: ["gke-shop-dev-euw1-gke","gke-shop-dev-euw1-gke-default-node-pool"]
    loggingVariant: "DEFAULT"
    workloadMetadataConfig:
      mode: "GKE_METADATA"
    metadata: {"cluster_name":"gke","disable-legacy-endpoints":"true","node_pool":"default-node-pool"}
    labels: {"cluster_name":"gke","node_pool":"default-node-pool"}
    oauthScopes: ["https://www.googleapis.com/auth/cloud-platform"]
    preemptible: false
    spot: false
    shieldedInstanceConfig:
      enableSecureBoot: false
      enableIntegrityMonitoring: true
