# Source: gke-cluster/templates/cluster.yaml
apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerCluster
metadata:
  name: names
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "names"
    app.kubernetes.io/name: gke-cluster
    app.kubernetes.io/version: "0.2.0"
    cost-center: "shop"
    environment: "dev"
    hfl.dev/team: "shop"
    team: "shop"
  annotations:
    hfl.dev/id: "cluster"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: shop-dev-euw1-gke
  location: "europe-west1"
  networkRef:
    external: "projects/my-project/global/networks/vpc"
  subnetworkRef:
    external: "projects/my-project/regions/europe-west1/subnetworks/gke"
  networkingMode: VPC_NATIVE
  networkPolicy:
    enabled: false
  releaseChannel:
    channel: "REGULAR"
  defaultSnatStatus:
    disabled: false
  loggingService: "logging.googleapis.com/kubernetes"
  monitoringService: "monitoring.googleapis.com/kubernetes"
  clusterAutoscaling:
    enabled: false
    autoscalingProfile: "BALANCED"
  verticalPodAutoscaling:
    enabled: false
  defaultMaxPodsPerNode: 110
  enableShieldedNodes: true
  identityServiceConfig:
    enabled: false
  enableKubernetesAlpha: false
  enableTpu: false
  enableIntranodeVisibility: false
  enableL4IlbSubsetting: false
  enableCiliumClusterwideNetworkPolicy: false
  masterAuth:
    clientCertificateConfig:
      issueClientCertificate: false
  addonsConfig:
    httpLoadBalancing:
      disabled: false
    horizontalPodAutoscaling:
      disabled: false
    gcpFilestoreCsiDriverConfig:
      enabled: false
    gkeBackupAgentConfig:
      enabled: false
    networkPolicyConfig:
      disabled: true
    dnsCacheConfig:
      enabled: false
    gcePersistentDiskCsiDriverConfig:
      enabled: true
    configConnectorConfig:
      enabled: false
  datapathProvider: "DATAPATH_PROVIDER_UNSPECIFIED"
  protectConfig:
    workloadConfig:
      auditMode: "DISABLED"
  securityPostureConfig:
    mode: "DISABLED"
    vulnerabilityMode: "VULNERABILITY_DISABLED"
  ipAllocationPolicy:
    clusterSecondaryRangeName: "pods"
    stackType: "IPV4"
  maintenancePolicy:
    dailyMaintenanceWindow:
      startTime: "05:00"
  nodeConfig:
    imageType: "COS_CONTAINERD"
    machineType: "e2-medium"
    serviceAccountRef: {"name":"names-nodes"}
    tags: ["gke-shop-dev-euw1-gke","gke-shop-dev-euw1-gke-default-pool"]
    loggingVariant: "DEFAULT"
    workloadMetadataConfig:
      mode: "GKE_METADATA"
    shieldedInstanceConfig:
      enableSecureBoot: false
      enableIntegrityMonitoring: true
  privateClusterConfig:
    enablePrivateNodes: true
    enablePrivateEndpoint: false
  databaseEncryption:
    state: "DECRYPTED"
  workloadIdentityConfig:
    workloadPool: "my-project.svc.id.goog"
  meshCertificates:
    enableCertificates: false
  notificationConfig:
    pubsub:
      enabled: false
  nodePoolDefaults:
    nodeConfigDefaults:
      gcfsConfig:
        enabled: false
