# Source: gke-cluster/templates/cluster.yaml
apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerCluster
metadata:
  name: full
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: gke-cluster
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "cluster"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
    cnrm.cloud.google.com/remove-default-node-pool: "true"
spec:
  resourceID: std-prod
  location: "europe-west1"
  description: "Production cluster"
  nodeLocations: ["europe-west1-b","europe-west1-c","europe-west1-d"]
  networkRef:
    external: "projects/host-project/global/networks/shared-vpc"
  subnetworkRef:
    external: "projects/host-project/regions/europe-west1/subnetworks/gke-europe-west1"
  networkingMode: VPC_NATIVE
  enableK8sBetaApis:
    enabledApis: ["resource.k8s.io/v1beta1/deviceclasses"]
  networkPolicy:
    enabled: false
  releaseChannel:
    channel: "REGULAR"
  costManagementConfig:
    enabled: true
  defaultSnatStatus:
    disabled: false
  minMasterVersion: "1.33"
  loggingConfig:
    enableComponents: ["SYSTEM_COMPONENTS","WORKLOADS"]
  monitoringConfig:
    enableComponents: ["SYSTEM_COMPONENTS","APISERVER"]
    managedPrometheus:
      enabled: true
    advancedDatapathObservabilityConfig:
      - enableMetrics: true
  clusterAutoscaling:
    enabled: true
    autoscalingProfile: "OPTIMIZE_UTILIZATION"
    defaultComputeClassConfig:
      enabled: true
    autoProvisioningDefaults:
      serviceAccountRef: {"name":"full-nodes"}
      oauthScopes: ["https://www.googleapis.com/auth/cloud-platform"]
      bootDiskKMSKeyRef:
        external: "projects/kms-project/locations/europe-west1/keyRings/gke/cryptoKeys/disks"
      management:
        autoRepair: true
        autoUpgrade: true
      diskSize: 50
      upgradeSettings:
        strategy: "BLUE_GREEN"
        blueGreenSettings:
          nodePoolSoakDuration: "600s"
          standardRolloutPolicy:
            batchSoakDuration: "60s"
            batchNodeCount: 1
      shieldedInstanceConfig:
        enableSecureBoot: true
        enableIntegrityMonitoring: true
      imageType: "COS_CONTAINERD"
    resourceLimits:
      - resourceType: cpu
        minimum: 0
        maximum: 64
      - resourceType: memory
        minimum: 0
        maximum: 256
      - resourceType: "nvidia-l4"
        minimum: 0
        maximum: 4
  verticalPodAutoscaling:
    enabled: true
  defaultMaxPodsPerNode: 110
  enableShieldedNodes: true
  binaryAuthorization:
    evaluationMode: PROJECT_SINGLETON_POLICY_ENFORCE
  identityServiceConfig:
    enabled: false
  enableKubernetesAlpha: false
  enableTpu: false
  enableIntranodeVisibility: true
  enableL4IlbSubsetting: true
  disableL4LbFirewallReconciliation: false
  enableMultiNetworking: false
  enableCiliumClusterwideNetworkPolicy: true
  inTransitEncryptionConfig: "IN_TRANSIT_ENCRYPTION_INTER_NODE_TRANSPARENT"
  enableFqdnNetworkPolicy: true
  masterAuthorizedNetworksConfig:
    cidrBlocks:
    - cidrBlock: 10.0.0.0/8
      displayName: corp
    - cidrBlock: 192.168.0.0/24
  nodePoolAutoConfig:
    networkTags:
      tags: ["nap-nodes"]
    resourceManagerTags: {"tagKeys/123":"tagValues/456"}
  masterAuth:
    clientCertificateConfig:
      issueClientCertificate: false
  serviceExternalIpsConfig:
    enabled: false
  addonsConfig:
    httpLoadBalancing:
      disabled: false
    horizontalPodAutoscaling:
      disabled: false
    gcpFilestoreCsiDriverConfig:
      enabled: true
    gkeBackupAgentConfig:
      enabled: true
    networkPolicyConfig:
      disabled: true
    dnsCacheConfig:
      enabled: true
    gcePersistentDiskCsiDriverConfig:
      enabled: true
    configConnectorConfig:
      enabled: true
    gcsFuseCsiDriverConfig:
      enabled: true
    parallelstoreCsiDriverConfig:
      enabled: false
  datapathProvider: "ADVANCED_DATAPATH"
  protectConfig:
    workloadConfig:
      auditMode: "DISABLED"
  securityPostureConfig:
    mode: "DISABLED"
    vulnerabilityMode: "VULNERABILITY_DISABLED"
  ipAllocationPolicy:
    clusterSecondaryRangeName: "pods"
    servicesSecondaryRangeName: "services"
    additionalPodRangesConfig:
      podRangeNames: ["pods-extra"]
    additionalIpRangesConfigs:
      - subnetworkRef:
          external: "projects/host-project/regions/europe-west1/subnetworks/gke-extra"
        podIpv4RangeNames: ["extra-pods"]
    stackType: "IPV4"
  maintenancePolicy:
    recurringWindow:
      startTime: "2026-01-01T02:00:00Z"
      endTime: "2026-01-01T06:00:00Z"
      recurrence: "FREQ=WEEKLY;BYDAY=SA,SU"
    maintenanceExclusion:
      - exclusionName: "freeze"
        startTime: "2026-12-20T00:00:00Z"
        endTime: "2027-01-03T00:00:00Z"
        exclusionOptions:
          scope: "NO_UPGRADES"
  dnsConfig:
    clusterDns: "CLOUD_DNS"
    clusterDnsScope: "VPC_SCOPE"
    clusterDnsDomain: "std-prod.internal"
  initialNodeCount: 1
  resourceUsageExportConfig:
    enableNetworkEgressMetering: true
    enableResourceConsumptionMetering: true
    bigqueryDestination:
      datasetId: "gke_usage"
  privateClusterConfig:
    enablePrivateNodes: true
    enablePrivateEndpoint: false
    masterIpv4CidrBlock: "172.16.0.0/28"
  controlPlaneEndpointsConfig:
    dnsEndpointConfig:
      enableK8sTokensViaDns: true
    ipEndpointsConfig:
      enabled: true
  databaseEncryption:
    state: "ENCRYPTED"
    keyName: "projects/kms-project/locations/europe-west1/keyRings/gke/cryptoKeys/etcd"
  workloadIdentityConfig:
    workloadPool: "my-project.svc.id.goog"
  meshCertificates:
    enableCertificates: true
  authenticatorGroupsConfig:
    securityGroup: "gke-security-groups@example.com"
  notificationConfig:
    pubsub:
      enabled: false
  nodePoolDefaults:
    nodeConfigDefaults:
      loggingVariant: "MAX_THROUGHPUT"
      gcfsConfig:
        enabled: true
