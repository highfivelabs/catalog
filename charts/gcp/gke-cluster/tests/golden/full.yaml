# Source: gke-cluster/templates/node-pools.yaml
apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerNodePool
metadata:
  name: full-pool-general
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: gke-cluster
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "pool:general"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: general
  location: "europe-west1"
  clusterRef:
    name: full
  initialNodeCount: 1
  autoscaling:
    minNodeCount: 1
    maxNodeCount: 5
    locationPolicy: "BALANCED"
  maxPodsPerNode: 64
  networkConfig:
    podRange: "pods-extra"
    enablePrivateNodes: true
    podCidrOverprovisionConfig:
      disabled: true
  management:
    autoRepair: true
    autoUpgrade: true
  upgradeSettings:
    strategy: "SURGE"
    maxSurge: 1
    maxUnavailable: 0
  nodeConfig:
    imageType: "COS_CONTAINERD"
    machineType: "e2-standard-4"
    diskSizeGb: 100
    diskType: "pd-standard"
    localSsdCount: 0
    gvnic:
      enabled: true
    kubeletConfig:
      cpuManagerPolicy: "static"
      cpuCfsQuota: true
      podPidsLimit: 4096
    serviceAccountRef: {"name":"full-nodes"}
    tags: ["gke-std-prod","gke-std-prod-general","gke-nodes"]
    loggingVariant: "DEFAULT"
    workloadMetadataConfig:
      mode: "GKE_METADATA"
    metadata: {"block-project-ssh-keys":"true","cluster_name":"std-prod","disable-legacy-endpoints":"true","node_pool":"general"}
    labels: {"node_pool":"general","team":"platform","workload":"general"}
    resourceLabels: {"cost-center":"platform"}
    oauthScopes: ["https://www.googleapis.com/auth/cloud-platform"]
    preemptible: false
    spot: true
    linuxNodeConfig:
      sysctls: {"net.core.somaxconn":"4096"}
      cgroupMode: "CGROUP_MODE_V2"
    bootDiskKMSCryptoKeyRef:
      external: "projects/kms-project/locations/europe-west1/keyRings/gke/cryptoKeys/disks"
    shieldedInstanceConfig:
      enableSecureBoot: true
      enableIntegrityMonitoring: true
