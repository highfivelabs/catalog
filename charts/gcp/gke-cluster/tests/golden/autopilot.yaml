# Source: gke-cluster/templates/cluster.yaml
apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerCluster
metadata:
  name: autopilot
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "autopilot"
    app.kubernetes.io/name: gke-cluster
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "cluster"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: gke-test-1
  location: "us-central1"
  nodeLocations: ["us-central1-a","us-central1-b","us-central1-f"]
  networkRef:
    external: "projects/my-project/global/networks/vpc-01"
  subnetworkRef:
    external: "projects/my-project/regions/us-central1/subnetworks/us-central1-01"
  networkingMode: VPC_NATIVE
  enableAutopilot: true
  releaseChannel:
    channel: "REGULAR"
  defaultSnatStatus:
    disabled: false
  clusterAutoscaling:
    autoProvisioningDefaults:
      serviceAccountRef: {"name":"autopilot-nodes"}
  verticalPodAutoscaling:
    enabled: true
  enableL4IlbSubsetting: false
  enableCiliumClusterwideNetworkPolicy: false
  masterAuthorizedNetworksConfig:
    {}
  masterAuth:
    clientCertificateConfig:
      issueClientCertificate: false
  addonsConfig:
    httpLoadBalancing:
      disabled: false
    horizontalPodAutoscaling:
      disabled: false
    gcpFilestoreCsiDriverConfig:
      enabled: false
    gkeBackupAgentConfig:
      enabled: false
  protectConfig:
    workloadConfig:
      auditMode: "DISABLED"
  securityPostureConfig:
    mode: "DISABLED"
    vulnerabilityMode: "VULNERABILITY_DISABLED"
  ipAllocationPolicy:
    clusterSecondaryRangeName: "us-central1-01-gke-01-pods"
    servicesSecondaryRangeName: "us-central1-01-gke-01-services"
    stackType: "IPV4"
  maintenancePolicy:
    dailyMaintenanceWindow:
      startTime: "05:00"
  privateClusterConfig:
    enablePrivateNodes: true
    enablePrivateEndpoint: true
    masterGlobalAccessConfig:
      enabled: true
  databaseEncryption:
    state: "DECRYPTED"
  workloadIdentityConfig:
    workloadPool: "my-project.svc.id.goog"
  notificationConfig:
    pubsub:
      enabled: false
