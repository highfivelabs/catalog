# Source: gke-cluster/templates/cluster.yaml
apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerCluster
metadata:
  name: firewall
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "firewall"
    app.kubernetes.io/name: gke-cluster
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "cluster"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: gke-fw
  location: "europe-west1-b"
  networkRef:
    external: "projects/host-project/global/networks/vpc"
  subnetworkRef:
    external: "projects/host-project/regions/europe-west1/subnetworks/gke"
  networkingMode: VPC_NATIVE
  networkPolicy:
    enabled: false
  releaseChannel:
    channel: "REGULAR"
  defaultSnatStatus:
    disabled: false
  loggingService: "logging.googleapis.com/kubernetes"
  monitoringService: "monitoring.googleapis.com/kubernetes"
  clusterAutoscaling:
    enabled: true
    autoscalingProfile: "BALANCED"
    autoProvisioningDefaults:
      serviceAccountRef: {"name":"firewall-nodes"}
      oauthScopes: ["https://www.googleapis.com/auth/cloud-platform"]
      management:
        autoRepair: true
        autoUpgrade: true
      diskSize: 100
      upgradeSettings:
        strategy: "SURGE"
        maxSurge: 0
        maxUnavailable: 0
      shieldedInstanceConfig:
        enableSecureBoot: false
        enableIntegrityMonitoring: true
      imageType: "COS_CONTAINERD"
    resourceLimits:
      - resourceType: cpu
        minimum: 0
        maximum: 10
      - resourceType: memory
        minimum: 0
        maximum: 64
  verticalPodAutoscaling:
    enabled: false
  defaultMaxPodsPerNode: 110
  enableShieldedNodes: true
  identityServiceConfig:
    enabled: false
  enableKubernetesAlpha: false
  enableTpu: true
  enableIntranodeVisibility: false
  enableL4IlbSubsetting: false
  enableCiliumClusterwideNetworkPolicy: false
  nodePoolAutoConfig:
    networkTags:
      tags: ["web","gke-gke-fw"]
  masterAuth:
    clientCertificateConfig:
      issueClientCertificate: false
  addonsConfig:
    httpLoadBalancing:
      disabled: false
    horizontalPodAutoscaling:
      disabled: false
    gcpFilestoreCsiDriverConfig:
      enabled: false
    gkeBackupAgentConfig:
      enabled: false
    networkPolicyConfig:
      disabled: true
    dnsCacheConfig:
      enabled: false
    gcePersistentDiskCsiDriverConfig:
      enabled: true
    configConnectorConfig:
      enabled: false
  datapathProvider: "DATAPATH_PROVIDER_UNSPECIFIED"
  protectConfig:
    workloadConfig:
      auditMode: "DISABLED"
  securityPostureConfig:
    mode: "DISABLED"
    vulnerabilityMode: "VULNERABILITY_DISABLED"
  ipAllocationPolicy:
    clusterSecondaryRangeName: "pods"
    servicesSecondaryRangeName: "services"
    additionalPodRangesConfig:
      podRangeNames: ["pods-2"]
    stackType: "IPV4"
  maintenancePolicy:
    dailyMaintenanceWindow:
      startTime: "05:00"
  nodeConfig:
    imageType: "COS_CONTAINERD"
    machineType: "e2-medium"
    serviceAccountRef: {"name":"firewall-nodes"}
    tags: ["gke-gke-fw","gke-gke-fw-default-pool"]
    loggingVariant: "DEFAULT"
    workloadMetadataConfig:
      mode: "GKE_METADATA"
    shieldedInstanceConfig:
      enableSecureBoot: false
      enableIntegrityMonitoring: true
  privateClusterConfig:
    enablePrivateNodes: true
    enablePrivateEndpoint: false
    masterIpv4CidrBlock: "172.16.0.0/28"
  databaseEncryption:
    state: "DECRYPTED"
  workloadIdentityConfig:
    workloadPool: "my-project.svc.id.goog"
  meshCertificates:
    enableCertificates: false
  notificationConfig:
    pubsub:
      enabled: false
  nodePoolDefaults:
    nodeConfigDefaults:
      gcfsConfig:
        enabled: false
