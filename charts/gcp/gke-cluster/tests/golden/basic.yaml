    dailyMaintenanceWindow:
      startTime: "05:00"
  nodeConfig:
    imageType: "COS_CONTAINERD"
    machineType: "e2-medium"
    diskType: "pd-standard"
    gcfsConfig:
      enabled: false
    serviceAccountRef: {"external":"project-service-account@my-project.iam.gserviceaccount.com"}
    tags: ["gke-gke-test-1","gke-gke-test-1-default-pool","default-node-pool"]
    loggingVariant: "DEFAULT"
    workloadMetadataConfig:
      mode: "GKE_METADATA"
