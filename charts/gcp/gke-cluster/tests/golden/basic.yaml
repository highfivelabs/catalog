  subnetworkRef:
    external: "projects/my-project/regions/us-central1/subnetworks/us-central1-01"
  networkingMode: VPC_NATIVE
  networkPolicy:
    enabled: false
  releaseChannel:
    channel: "REGULAR"
  defaultSnatStatus:
    disabled: false
