# Source: gke-cluster/templates/node-pools.yaml
apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerNodePool
metadata:
  name: basic-pool-default-node-pool
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: gke-cluster
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "pool:default-node-pool"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: default-node-pool
  location: "us-central1"
  clusterRef:
    name: basic
  nodeLocations: ["us-central1-b","us-central1-c"]
  initialNodeCount: 80
  autoscaling:
    minNodeCount: 1
    maxNodeCount: 100
  management:
    autoRepair: true
    autoUpgrade: true
  upgradeSettings:
    strategy: "SURGE"
    maxSurge: 1
    maxUnavailable: 0
  nodeConfig:
    imageType: "COS_CONTAINERD"
    machineType: "e2-medium"
    diskSizeGb: 100
    diskType: "pd-standard"
    localSsdCount: 0
    gcfsConfig:
      enabled: false
    serviceAccountRef: {"external":"project-service-account@my-project.iam.gserviceaccount.com"}
    tags: ["gke-gke-test-1","gke-gke-test-1-default-node-pool","default-node-pool"]
    loggingVariant: "DEFAULT"
    workloadMetadataConfig:
      mode: "GKE_METADATA"
    metadata: {"cluster_name":"gke-test-1","disable-legacy-endpoints":"true","node-pool-metadata-custom-value":"my-node-pool","node_pool":"default-node-pool"}
    labels: {"cluster_name":"gke-test-1","default-node-pool":"true","node_pool":"default-node-pool"}
    taint:
      - key: "default-node-pool"
        value: "true"
        effect: "PREFER_NO_SCHEDULE"
    oauthScopes: ["https://www.googleapis.com/auth/logging.write","https://www.googleapis.com/auth/monitoring"]
    preemptible: false
    spot: false
    guestAccelerator:
      - type: "nvidia-l4"
        count: 1
        gpuDriverInstallationConfig:
          gpuDriverVersion: "LATEST"
        gpuSharingConfig:
          gpuSharingStrategy: "TIME_SHARING"
          maxSharedClientsPerGpu: 2
    shieldedInstanceConfig:
      enableSecureBoot: false
      enableIntegrityMonitoring: true
