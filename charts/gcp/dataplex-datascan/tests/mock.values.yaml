# Applied to the fake cloud by hack/mock-apply.sh: a data quality scan of a
# BigQuery table and a role on it (IAMBinding; config-connector-extensions'
# fake cloud serves getIamPolicy on a data scan since 35833eb).
name: catalog-mock-scan
project_id: mock-project
region: us-central1
labels: {env: test}
data:
  resource: //bigquery.googleapis.com/projects/mock-project/datasets/catalog_mock/tables/stations
data_quality_spec:
  rules:
    - {dimension: VALIDITY, column: address, non_null_expectation: {}, threshold: 0.99}
iam:
  roles/dataplex.dataScanViewer: ["group:viewers@example.com"]
