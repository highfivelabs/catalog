# fabric's README "Data Quality": every rule type, on a schedule.
name: datascan
prefix: test
project_id: my-project-name
region: us-central1
labels: {billing_id: a}
execution_schedule: TZ=America/New_York 0 1 * * *
data:
  resource: //bigquery.googleapis.com/projects/bigquery-public-data/datasets/austin_bikeshare/tables/bikeshare_stations
incremental_field: modified_date
data_quality_spec:
  sampling_percent: 100
  row_filter: station_id > 1000
  rules:
    - {dimension: VALIDITY, non_null_expectation: {}, column: address, threshold: 0.99}
    - column: council_district
      dimension: VALIDITY
      ignore_null: true
      threshold: 0.9
      range_expectation: {min_value: 1, max_value: 10, strict_min_enabled: true, strict_max_enabled: false}
    - column: council_district
      dimension: VALIDITY
      threshold: 0.8
      range_expectation: {min_value: 3, max_value: 9}
    - {column: power_type, dimension: VALIDITY, ignore_null: false, regex_expectation: {regex: .*solar.*}}
    - {column: property_type, dimension: VALIDITY, ignore_null: false, set_expectation: {values: [sidewalk, parkland]}}
    - {column: address, dimension: UNIQUENESS, uniqueness_expectation: {}}
    - column: number_of_docks
      dimension: VALIDITY
      statistic_range_expectation: {statistic: MEAN, min_value: 5, max_value: 15, strict_min_enabled: true, strict_max_enabled: true}
    - {column: footprint_length, dimension: VALIDITY, row_condition_expectation: {sql_expression: footprint_length > 0 AND footprint_length <= 10}}
    - {dimension: VALIDITY, table_condition_expectation: {sql_expression: COUNT(*) > 0}}
    - dimension: VALIDITY
      sql_assertion:
        sql_statement: |
          SELECT
            city_asset_number, council_district
          FROM ${data()}
          WHERE city_asset_number IS NOT NULL
          GROUP BY 1,2
          HAVING COUNT(*) > 1
