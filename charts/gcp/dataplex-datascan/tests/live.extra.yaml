# The dataset and table the live case's scan reads.
apiVersion: bigquery.cnrm.cloud.google.com/v1beta1
kind: BigQueryDataset
metadata:
  name: live-scan-ds
  annotations:
    cnrm.cloud.google.com/project-id: ${PROJECT}
    cnrm.cloud.google.com/delete-contents-on-destroy: "true"
  labels: {catalog-run: ${RUN}}
spec:
  resourceID: ${RUN_}_scan
  location: ${REGION}
  description: catalog live test ${RUN}
---
apiVersion: bigquery.cnrm.cloud.google.com/v1beta1
kind: BigQueryTable
metadata:
  name: live-scan-stations
  annotations: {cnrm.cloud.google.com/project-id: ${PROJECT}}
  labels: {catalog-run: ${RUN}}
spec:
  resourceID: stations
  datasetRef: {name: live-scan-ds}
  schema: '[{"name": "id", "type": "INT64"}, {"name": "address", "type": "STRING"}]'
