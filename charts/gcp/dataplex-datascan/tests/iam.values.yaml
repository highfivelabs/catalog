# fabric's README "IAM": every IAM variable on a profile scan. The
# additive member renders the v1alpha1 IAMMember, so allow_alpha.
name: datascan
prefix: test
project_id: my-project-name
region: us-central1
allow_alpha: true
data:
  resource: //bigquery.googleapis.com/projects/bigquery-public-data/datasets/austin_bikeshare/tables/bikeshare_stations
data_profile_spec: {}
iam:
  roles/dataplex.dataScanAdmin: ["serviceAccount:svc-1@project-id.iam.gserviceaccount.com"]
  roles/dataplex.dataScanEditor: ["user:admin-user@example.com"]
iam_by_principals:
  group:user-group@example.com: [roles/dataplex.dataScanViewer]
iam_bindings:
  viewer-temp:
    role: roles/dataplex.dataScanViewer
    members: ["user:temp@example.com"]
    condition: {title: expires, expression: "request.time < timestamp('2031-01-01T00:00:00Z')"}
iam_bindings_additive:
  am1-viewer: {member: "user:am1@example.com", role: roles/dataplex.dataScanViewer}
