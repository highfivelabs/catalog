{{- /*
Copyright 2026 High Five Labs
SPDX-License-Identifier: Apache-2.0
Ported from cloud-foundation-fabric modules/dataplex-datascan/iam.tf
(v60.0.0), Copyright 2024 Google LLC, Apache-2.0.

google_dataplex_datascan_iam_binding.authoritative_for_role: one
IAMBinding (config-connector-extensions, iam.gcp.hfl.dev/v1beta1) per role
of iam merged with iam_by_principals, exact per role as fabric's.
google_dataplex_datascan_iam_binding.bindings: one IAMBinding per entry of
iam_bindings.
google_dataplex_datascan_iam_member.bindings: one IAMMember
(config-connector-extensions, iam.gcp.hfl.dev/v1alpha1, so allow_alpha)
per entry of iam_bindings_additive.
*/ -}}
{{- $v := .Values }}
{{- $ref := dict "apiVersion" "dataplex.gcp.hfl.dev/v1beta1" "kind" "DataplexDataScan" "name" .Release.Name }}
{{- $roles := dict }}
{{- range $role, $members := ($v.iam | default dict) }}
{{- $_ := set $roles $role (concat (get $roles $role | default list) $members) }}
{{- end }}
{{- range $principal, $prs := ($v.iam_by_principals | default dict) }}
{{- range $role := $prs }}
{{- $_ := set $roles $role (append (get $roles $role | default list) $principal) }}
{{- end }}
{{- end }}
{{- range $role, $members := $roles }}
---
apiVersion: iam.gcp.hfl.dev/v1beta1
kind: IAMBinding
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "iam" $role)) "id" (printf "iam:%s" $role) "project" $v.project_id) | nindent 2 }}
spec:
  resourceRef:
    {{- toYaml $ref | nindent 4 }}
  role: {{ $role | quote }}
  members:
  {{- range $m := ($members | uniq | sortAlpha) }}
    - {{ $m | quote }}
  {{- end }}
{{- end }}
{{- range $key, $b := ($v.iam_bindings | default dict) }}
---
apiVersion: iam.gcp.hfl.dev/v1beta1
kind: IAMBinding
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "iam-binding" $key)) "id" (printf "iam-binding:%s" $key) "project" $v.project_id) | nindent 2 }}
spec:
  resourceRef:
    {{- toYaml $ref | nindent 4 }}
  role: {{ $b.role | quote }}
  members:
  {{- range $m := ($b.members | uniq | sortAlpha) }}
    - {{ $m | quote }}
  {{- end }}
  {{- with $b.condition }}
  condition:
    {{- include "kcc.condition" . | nindent 4 }}
  {{- end }}
{{- end }}
{{- include "kcc.alpha" (list $ "iam_bindings_additive" $v.iam_bindings_additive "IAMMember (config-connector-extensions)") }}
{{- range $key, $b := ($v.iam_bindings_additive | default dict) }}
---
apiVersion: iam.gcp.hfl.dev/v1alpha1
kind: IAMMember
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "iam-member" $key)) "id" (printf "iam-member:%s" $key) "project" $v.project_id) | nindent 2 }}
spec:
  resourceRef:
    {{- toYaml $ref | nindent 4 }}
  role: {{ $b.role | quote }}
  member: {{ $b.member | quote }}
  {{- with $b.condition }}
  condition:
    {{- include "kcc.condition" . | nindent 4 }}
  {{- end }}
{{- end }}
