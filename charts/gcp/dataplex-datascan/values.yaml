# Values mirror the Terraform variables of fabric's dataplex-datascan
# module (v60.0.0): same names, types and defaults, so a module block's
# arguments become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.datascan sets the scan's ID in full (else <prefix>-<name>).
names: {}
# An optional convenience: "<namePrefix>-" in front of the scan's derived
# ID. Empty (the default) changes nothing.
namePrefix: ""
# fabric's labels ("Resource labels."), with the catalog's meaning:
# Kubernetes labels on every object; an unprefixed key also becomes a
# Google Cloud label on the scan, where fabric puts its labels.
labels: {}
# Cloud labels on the scan (Google Cloud labels).
tags: {}

# The data source for DataScan. The source can be either a Dataplex
# `entity` or a BigQuery `resource`.
data: {}
# DataProfileScan related setting.
data_profile_spec: null
# DataQualityScan related setting.
data_quality_spec: null
# Custom description for DataScan.
description: null
# Schedule DataScan to run periodically based on a cron schedule
# expression. If not specified, the DataScan is created with `on_demand`
# schedule.
execution_schedule: null
# Paths to data files and folders that enable factory functionality.
# Accepted and ignored: the file's contents go under factories_data.
factories_config: {}
# The unnested field (of type Date or Timestamp) that contains values which
# monotonically increase over time.
incremental_field: null
# Name of Dataplex Scan.
name: ""
# Optional prefix used to generate Dataplex DataScan ID.
prefix: null
# The ID of the project where the Dataplex DataScan will be created.
project_id: ""
# Region for the Dataplex DataScan.
region: ""

# Authoritative IAM binding in {PRINCIPAL => [ROLES]} format. Merged with iam.
iam_by_principals: {}
# Dataplex DataScan IAM bindings in {ROLE => [MEMBERS]} format.
iam: {}
# Authoritative IAM bindings in {KEY => {role, members, condition}}.
iam_bindings: {}
# Individual additive IAM bindings. Keys are arbitrary.
iam_bindings_additive: {}

# Not a fabric variable: the data quality spec file that
# factories_config.data_quality_spec names, as data (docs/design.md,
# "Submodules and factories"): exactly the file's content, in the API's
# camelCase keys or fabric's snake_case ones.
factories_data:
  data_quality_spec: null

# Not a fabric variable: iam_bindings_additive renders config-connector-
# extensions' IAMMember, which is v1alpha1; set true to accept that its
# schema may change (docs/design.md, "Alpha kinds").
allow_alpha: false
# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# scan when the component is deleted. PREVENT has no Config Connector
# equivalent.
deletion_policy: null
