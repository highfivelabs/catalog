#
# The Bundt Package for this chart (see ../iam-service-account/package.yaml).
# Outputs are fabric's declared outputs that are not whole objects, for what
# the chart ports: id, name and pairing_key of the attachment, router_name
# (the router the attachment is on) and route_policies, each policy's ID
# keyed as fabric keys them. Not outputs: md5_configuration (a dedicated
# peer's secret; dedicated_interconnect_config is refused), and fabric's
# whole objects (attachment, router, router_interface; docs/design.md,
# "Outputs").
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: gcp-net-vlan-attachment
spec:
  version: 0.1.0
  engine: helm
  providers: [kcc]
  outputs:
    id: >-
      'projects/' + inputs.project_id + '/regions/' + inputs.region
      + '/interconnectAttachments/' + resources.attachment.spec.resourceID
    name: resources.attachment.spec.resourceID
    pairing_key: >-
      has(resources.attachment.status.pairingKey) ? dyn(resources.attachment.status.pairingKey) : null
    router_name: >-
      'router' in resources
      ? dyn(resources.router.spec.resourceID)
      : dyn(has(inputs.router_config.name) ? inputs.router_config.name : 'router')
    route_policies: >-
      resources.transformMapEntry(k, v, k.startsWith('route_policy:'),
        {k.substring(13): has(v.spec.routerRef.external)
          ? v.spec.routerRef.external + '/routePolicies/' + v.spec.resourceID
          : 'projects/' + inputs.project_id + '/regions/' + inputs.region
            + '/routers/' + resources.router.spec.resourceID + '/routePolicies/' + v.spec.resourceID})
