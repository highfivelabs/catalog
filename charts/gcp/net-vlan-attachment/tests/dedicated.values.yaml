# A Dedicated Interconnect attachment, after the module README's dedicated
# example, with the candidate addresses: config-connector-extensions'
# ComputeInterconnectAttachment, the router, its interface and the BGP
# peer, with a custom advertisement and BFD.
project_id: my-project
region: europe-west8
network: projects/my-project/global/networks/my-network
name: vlan-603
description: vlan-603
peer_asn: "65000"
mtu: 1500
dedicated_interconnect_config:
  bandwidth: BPS_10G
  bgp_range: 169.254.0.0/30
  bgp_priority: 100
  candidate_cloud_router_ip_address: 169.254.0.1/30
  candidate_customer_router_ip_address: 169.254.0.2/30
  interconnect: https://www.googleapis.com/compute/v1/projects/my-project/global/interconnects/interconnect-a
  vlan_tag: "603"
bgp_peer:
  custom_advertise: {all_subnets: true, ip_ranges: {on-prem: 10.0.0.0/8}}
  bfd: {min_receive_interval: 1000, min_transmit_interval: 1000, multiplier: 5}
router_config: {create: true, asn: 16550, name: router-1}
