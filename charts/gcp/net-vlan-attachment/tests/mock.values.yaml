# Applied to the fake cloud by hack/mock-apply.sh: a dedicated attachment
# (config-connector-extensions' ComputeInterconnectAttachment, served by its
# generated kinds' fake) on a new router, with the router interface and the
# BGP peer at the candidate addresses. mockgcp has no interconnect
# attachments, so the partner attachment has no fake-cloud case.
project_id: mock-project
region: us-central1
network: projects/mock-project/global/networks/default
name: catalog-vlan
description: catalog-vlan
peer_asn: "65000"
dedicated_interconnect_config:
  candidate_cloud_router_ip_address: 169.254.10.1/29
  candidate_customer_router_ip_address: 169.254.10.2/29
  interconnect: projects/mock-project/global/interconnects/catalog-ic
  vlan_tag: "610"
router_config: {create: true, asn: 16550, name: catalog-vlan-router}
