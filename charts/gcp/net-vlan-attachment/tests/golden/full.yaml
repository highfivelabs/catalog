---
# Source: net-vlan-attachment/templates/main.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeInterconnectAttachment
metadata:
  name: full
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: net-vlan-attachment
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "attachment"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "vlan-full"
  description: "full"
  region: "europe-west8"
  routerRef:
    name: full
  type: PARTNER
  adminEnabled: false
  edgeAvailabilityDomain: "AVAILABILITY_DOMAIN_ANY"
  mtu: "1440"
---
# Source: net-vlan-attachment/templates/main.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeRouter
metadata:
  name: full
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: net-vlan-attachment
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "router"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "my-router"
  region: "europe-west8"
  networkRef:
    external: "projects/my-project/global/networks/my-network"
  bgp:
    asn: 16550
    advertiseMode: CUSTOM
    advertisedGroups: [ALL_SUBNETS]
    advertisedIpRanges:
      - range: "10.0.0.0/8"
        description: "all"
    keepaliveInterval: 20
---
# Source: net-vlan-attachment/templates/main.yaml
apiVersion: compute.gcp.hfl.dev/v1alpha1
kind: ComputeRouterRoutePolicy
metadata:
  name: full-route-policy-import
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: net-vlan-attachment
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "route_policy:import"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "import"
  projectRef:
    external: "my-project"
  region: "europe-west8"
  routerRef:
    name: full
  type: ROUTE_POLICY_TYPE_IMPORT
  terms:
    - priority: 1
      match:
        expression: "destination == '10.0.0.0/8'"
        title: "t"
        description: "d"
        location: "l"
      actions:
        - expression: "drop()"
