---
# Source: net-vlan-attachment/templates/main.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeInterconnectAttachment
metadata:
  name: names
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "names"
    app.kubernetes.io/name: net-vlan-attachment
    app.kubernetes.io/version: "0.1.0"
    environment: "dev"
    hfl.dev/environment: "dev"
    hfl.dev/team: "shop"
    team: "shop"
  annotations:
    hfl.dev/id: "attachment"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "shop-dev-vlan"
  description: "vlan-a"
  region: "europe-west8"
