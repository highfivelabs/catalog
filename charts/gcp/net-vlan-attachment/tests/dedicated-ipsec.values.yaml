# A dedicated attachment with IPsec over Interconnect on an existing
# router: the address pool, the encrypted attachment naming it, and the
# interface and peer on router-1, advertising the IPsec gateway ranges
# (fabric's default without bgp_peer).
project_id: my-project
region: europe-west8
network: projects/my-project/global/networks/my-network
name: vlan-605
description: vlan-605
peer_asn: "65000"
vpn_gateways_ip_range: 10.255.255.0/29
ipsec_gateway_ip_ranges: {gateways: 10.255.255.0/29}
dedicated_interconnect_config:
  candidate_cloud_router_ip_address: 169.254.1.1/29
  candidate_customer_router_ip_address: 169.254.1.2/29
  interconnect: projects/my-project/global/interconnects/interconnect-a
  vlan_tag: "605"
router_config: {create: false, name: router-1}
