# An existing router: only the attachment is made, on the named router,
# and the route policies (allow_alpha) go on it too.
allow_alpha: true
project_id: my-project
region: europe-west8
network: projects/my-project/global/networks/my-network
name: vlan-604-x
description: vlan-604-x
peer_asn: "65000"
partner_interconnect_config: {edge_availability_domain: AVAILABILITY_DOMAIN_2}
router_config:
  create: false
  name: existing-router
  route_policies:
    export:
      type: EXPORT
      terms: [{priority: 1, match: {expression: "true"}, actions: []}]
