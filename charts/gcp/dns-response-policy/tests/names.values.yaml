# Names in full, labels and tags, as Bundt passes them from a team's naming
# convention (docs/design.md, "Names, labels and tags"): the policy takes
# its name as given, with no prefix; rules are named by their keys.
project_id: my-project
name: googleapis
names: {policy: shop-dev-googleapis}
labels: {hfl.dev/team: shop, hfl.dev/environment: dev}
tags: {team: shop, environment: dev}
rules:
  pubsub:
    dns_name: pubsub.googleapis.com.
    local_data:
      A: {rrdatas: [199.36.153.4]}
