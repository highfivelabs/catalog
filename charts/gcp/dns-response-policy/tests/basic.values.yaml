# fabric's README, "Manage policy and override resolution for specific
# names": a policy bound to one network, with a rule that answers a Google
# API name with the restricted VIP addresses.
project_id: my-project
name: googleapis
networks:
  landing: projects/my-project/global/networks/landing
rules:
  pubsub:
    dns_name: pubsub.googleapis.com.
    local_data:
      A:
        rrdatas: [199.36.153.4, 199.36.153.5]
