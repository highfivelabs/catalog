# fabric's README, "Use existing policy and override resolution via
# wildcard with exceptions": rules only, in the existing policy named
# googleapis (policy_create: false), one of them a bypass.
project_id: my-project
name: googleapis
policy_create: false
networks:
  landing: projects/my-project/global/networks/landing
rules:
  gcr:
    dns_name: gcr.io.
    local_data:
      CNAME: {rrdatas: [restricted.googleapis.com.]}
  googleapis-all:
    dns_name: "*.googleapis.com."
    local_data:
      CNAME: {rrdatas: [restricted.googleapis.com.]}
  pubsub:
    dns_name: pubsub.googleapis.com.
  restricted:
    dns_name: restricted.googleapis.com.
    local_data:
      A:
        rrdatas: [199.36.153.4, 199.36.153.5, 199.36.153.6, 199.36.153.7]
