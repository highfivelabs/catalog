# The live case (hack/live-apply.sh LIVE_CHARTS=dns-response-policy): a
# policy bound to a network of the run, a local data rule and a bypass rule
# (config-connector-extensions' DNSResponsePolicy and DNSResponsePolicyRule).
project_id: ${PROJECT}
name: ${RUN}-rp
description: catalog live test ${RUN}
labels: {catalog-run: ${RUN}}
networks:
  live: projects/${PROJECT}/global/networks/${RUN}-rp-net
rules:
  pubsub:
    dns_name: pubsub.googleapis.com.
    local_data:
      A: {ttl: 300, rrdatas: [199.36.153.4, 199.36.153.5]}
  storage:
    dns_name: storage.googleapis.com.
