---
# Source: dns-response-policy/templates/main.yaml
apiVersion: dns.gcp.hfl.dev/v1beta1
kind: DNSResponsePolicy
metadata:
  name: full-policy
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: dns-response-policy
    app.kubernetes.io/version: "0.1.0"
    cost-center: "net"
    env: "prod"
    hfl.dev/team: "net"
  annotations:
    hfl.dev/id: "policy"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  projectRef:
    external: "my-project"
  resourceID: "dns-policy"
  description: "Restricted Google APIs."
  networks:
    - networkUrl: "projects/my-project/global/networks/landing"
    - networkUrl: "https://www.googleapis.com/compute/v1/projects/my-project/global/networks/prod"
  gkeClusters:
    - gkeClusterName: "projects/my-project/locations/europe-west1/clusters/gke-a"
---
