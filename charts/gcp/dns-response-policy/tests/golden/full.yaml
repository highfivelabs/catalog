apiVersion: dns.gcp.hfl.dev/v1beta1
kind: DNSResponsePolicyRule
metadata:
  name: full-rule-bypass
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
