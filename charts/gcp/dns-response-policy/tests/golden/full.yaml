---
# Source: dns-response-policy/templates/main.yaml
apiVersion: dns.gcp.hfl.dev/v1beta1
kind: DNSResponsePolicyRule
metadata:
  name: full-rule-multi
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: dns-response-policy
    app.kubernetes.io/version: "0.1.0"
    cost-center: "net"
    env: "prod"
    hfl.dev/team: "net"
  annotations:
    hfl.dev/id: "rule:multi"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  projectRef:
    external: "my-project"
  responsePolicy: "projects/my-project/responsePolicies/dns-policy"
  resourceID: "multi"
  dnsName: "api.example.com."
  localData:
    localDatas:
      - name: "api.example.com."
        type: "A"
        ttl: 60
        rrdatas:
          - "10.0.0.1"
      - name: "api.example.com."
        type: "AAAA"
        rrdatas:
          - "fd00::1"
      - name: "api.example.com."
        type: "TXT"
        ttl: 300
        rrdatas:
          - "\"v=spf1 -all\""
