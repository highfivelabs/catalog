# fabric's README, "Define policy rules via a factory file": the rules
# file's content under factories_data.rules (factories_config is accepted
# and ignored), and one rule of the variable that wins over the file's
# rule of the same name.
project_id: my-project
name: googleapis
policy_create: false
factories_config:
  rules: config/rules.yaml
factories_data:
  rules:
    gcr:
      dns_name: gcr.io.
      local_data:
        CNAME: {rrdatas: [restricted.googleapis.com.]}
    googleapis-all:
      dns_name: "*.googleapis.com."
      local_data:
        CNAME: {rrdatas: [restricted.googleapis.com.]}
    pubsub:
      dns_name: pubsub.googleapis.com.
    restricted:
      dns_name: restricted.googleapis.com.
      local_data:
        A:
          rrdatas: [199.36.153.4, 199.36.153.5, 199.36.153.6, 199.36.153.7]
rules:
  pubsub:
    dns_name: pubsub.googleapis.com.
    local_data:
      A: {ttl: 300, rrdatas: [199.36.153.8]}
