# Applied to the fake cloud by hack/mock-apply.sh: a policy bound to one
# network (mockgcp does not check that a bound network exists, so none is
# made), a local data rule and a bypass rule.
project_id: mock-project
name: catalog-mock-rp
description: Catalog mock response policy.
labels: {env: test}
networks:
  default: projects/mock-project/global/networks/default
rules:
  pubsub:
    dns_name: pubsub.googleapis.com.
    local_data:
      A: {ttl: 300, rrdatas: [199.36.153.4, 199.36.153.5]}
  storage:
    dns_name: storage.googleapis.com.
