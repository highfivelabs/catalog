# Labels and tags (docs/design.md, "Names, labels and tags"). The chart
# gives no singular resource a name (each rule names itself in its entry),
# so names takes no key.
project_id: my-project
network_name: vpc
labels: {hfl.dev/team: shop}
tags: {team: shop, environment: dev}
egress_rules:
  - name: deny-smtp
    destination_ranges: [0.0.0.0/0]
    deny: [{protocol: tcp, ports: ["25"]}]
