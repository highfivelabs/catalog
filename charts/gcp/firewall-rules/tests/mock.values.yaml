# Applied to the fake cloud by hack/mock-apply.sh.
project_id: mock-project
network_name: default
ingress_rules:
  - name: catalog-fw-allow-ssh
    source_ranges: [10.0.0.0/8]
    target_tags: [ssh]
    allow: [{protocol: tcp, ports: ["22"]}]
egress_rules:
  - name: catalog-fw-deny-smtp
    priority: 900
    destination_ranges: [0.0.0.0/0]
    deny: [{protocol: tcp, ports: ["25"]}]
