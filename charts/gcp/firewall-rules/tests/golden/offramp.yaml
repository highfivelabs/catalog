# Source: firewall-rules/templates/main.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeFirewall
metadata:
  name: offramp-ofr-test-allow-iap-ssh
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "offramp"
    app.kubernetes.io/name: firewall-rules
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "rules_ingress_egress:ofr-test-allow-iap-ssh"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: ofr-test-allow-iap-ssh
  networkRef:
    external: "https://www.googleapis.com/compute/v1/projects/my-project/global/networks/ofr-test-shared"
  direction: INGRESS
  description: "SSH through Identity-Aware Proxy"
  disabled: false
  priority: 1000
  sourceRanges:
    - "35.235.240.0/20"
  targetTags:
    - "ssh"
  allow:
    - protocol: "tcp"
      ports:
        - "22"
