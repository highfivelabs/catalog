---
# Source: firewall-rules/templates/main.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeFirewall
metadata:
  name: mock-catalog-fw-allow-ssh
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: firewall-rules
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "rules_ingress_egress:catalog-fw-allow-ssh"
    cnrm.cloud.google.com/project-id: "mock-project"
spec:
  resourceID: catalog-fw-allow-ssh
  networkRef:
    external: "https://www.googleapis.com/compute/v1/projects/mock-project/global/networks/default"
  direction: INGRESS
  disabled: false
  priority: 1000
  sourceRanges:
    - "10.0.0.0/8"
  targetTags:
    - "ssh"
  allow:
    - protocol: "tcp"
      ports:
        - "22"
