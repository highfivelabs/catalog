apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeFirewall
metadata:
  name: names-deny-smtp
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "names"
    app.kubernetes.io/name: firewall-rules
    app.kubernetes.io/version: "0.1.0"
    environment: "dev"
    hfl.dev/team: "shop"
    team: "shop"
  annotations:
    hfl.dev/id: "rules_ingress_egress:deny-smtp"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: deny-smtp
  networkRef:
    external: "https://www.googleapis.com/compute/v1/projects/my-project/global/networks/vpc"
  direction: EGRESS
  disabled: false
  priority: 1000
  destinationRanges:
    - "0.0.0.0/0"
  deny:
    - protocol: "tcp"
      ports:
        - "25"
