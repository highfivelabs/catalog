---
# Source: firewall-rules/templates/main.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeFirewall
metadata:
  name: basic-allow-ssh
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: firewall-rules
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "rules_ingress_egress:allow-ssh"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: allow-ssh
  networkRef:
    external: "https://www.googleapis.com/compute/v1/projects/my-project/global/networks/vpc"
  direction: INGRESS
  disabled: false
  priority: 1000
  sourceRanges:
    - "10.0.0.0/8"
  allow:
    - protocol: "tcp"
      ports:
        - "22"
