#
# Values mirror the Terraform variables of terraform-google-modules'
# network module's firewall-rules submodule (v18.3.1): same names, types
# and defaults, so a module block's arguments become this file one to one
# (README.md, "From Terraform"). values.schema.json carries the types.
#
# Descriptions quoted from terraform-google-network
# (modules/firewall-rules/variables.tf, v18.3.1), Copyright Google LLC,
# Apache-2.0.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables.
#
# This chart gives no singular resource a name: every rule names itself in
# its entry, so names takes no key.
names: {}
# An optional convenience: "<namePrefix>-" in front of every rule's name.
# Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. A prefixed key (hfl.dev/team) stays in
# Kubernetes. Firewall rules have no Google Cloud labels, so an unprefixed
# key stays on the object only.
labels: {}
# Cloud labels on every resource. Firewall rules take none; accepted for
# the catalog's common interface, they stay on the objects.
tags: {}
# DELETE (the default) or ABANDON, which keeps the rules when the component
# is deleted. PREVENT is refused. Not a module variable.
deletion_policy: null

# Project id of the project that holds the network.
# Required.
project_id: ""
# Name of the network this set of firewall rules applies to.
# Required. A name, a projects/... path or a self link.
network_name: ""
# This is DEPRECATED and available for backward compatibility. Use
# ingress_rules and egress_rules variables. List of custom rule definitions
# Each: {name, description, direction (INGRESS), disabled, priority,
# ranges ([]), source_tags, source_service_accounts, target_tags,
# target_service_accounts, allow ([{protocol, ports}]), deny, log_config
# ({metadata})}. When it is not empty, ingress_rules and egress_rules are
# ignored, as in the module.
rules: []
# List of ingress rules. This will be ignored if variable 'rules' is non-empty
# Each: {name, description, disabled, priority, destination_ranges ([]),
# source_ranges ([]), source_tags, source_service_accounts, target_tags,
# target_service_accounts, allow, deny, log_config}.
ingress_rules: []
# List of egress rules. This will be ignored if variable 'rules' is non-empty
# The same shape as ingress_rules.
egress_rules: []
