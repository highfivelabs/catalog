#
# Values mirror the Terraform variables of fabric's net-vpn-ha module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types and the module's validations.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.gateway, names.router: the HA VPN gateway's and the Cloud Router's
# names in full. A name set here takes no namePrefix; unset, fabric's (name,
# and router_config.name or vpn-<name>).
names: {}
# An optional convenience: "<namePrefix>-" in front of every name the chart
# derives (the gateway, the router, the external gateways, the route
# policies), never one set under names. Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. An unprefixed key also becomes a Google
# Cloud label on the resources that take labels, so it must be a valid one.
labels: {}
# Cloud labels on every resource that takes them.
tags: {}
# Not a fabric variable: route policies (router_config.route_policies) are
# config-connector-extensions' ComputeRouterRoutePolicy, a v1alpha1 kind,
# refused unless this is true (docs/design.md, "Alpha kinds").
allow_alpha: false

# Context-specific interpolations. Refused when set: Bundt replaces them
# with ${...} expressions in the component's inputs.
context: {}
# VPN Gateway name (if an existing VPN Gateway is not used), and prefix
# used for dependent resources.
name: null
# VPC used for the gateway and routes (an id or self link).
network: null
# Configuration of the (external or GCP) peer gateway, keyed:
# {external: {redundancy_type, interfaces, description, name}} or {gcp: <self link>}.
peer_gateways: {}
# Project where resources will be created.
project_id: null
# Region used for resources.
region: null
# Cloud Router configuration for the VPN: {asn, create (true), custom_advertise,
# route_policies, keepalive, name, override_name}. To reuse an existing
# router, set create to false and use name to specify it. Required, as in
# fabric.
router_config: null
# VPN tunnel configurations, keyed. Refused when set: see README.md.
tunnels: {}
# HA VPN Gateway self link for using an existing HA VPN Gateway. Ignored if
# vpn_gateway_create is set.
vpn_gateway: null
# Create HA VPN Gateway: {description, ipv6}. Set to null to avoid creation.
vpn_gateway_create: {}

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# cloud resources when the component is deleted. PREVENT has no Config
# Connector equivalent.
deletion_policy: null
