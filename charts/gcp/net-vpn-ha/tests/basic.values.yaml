# GCP to on-premises, after the module README's example (without its
# tunnels, which the chart refuses): the HA gateway, the external peer
# gateway and the router.
project_id: my-project
region: europe-west1
network: projects/my-project/global/networks/my-network
name: mynet-to-onprem
peer_gateways:
  default:
    external:
      redundancy_type: SINGLE_IP_INTERNALLY_REDUNDANT
      interfaces: [8.8.8.8]
router_config: {asn: 64514}
