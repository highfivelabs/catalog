# GCP to GCP, after the module README's first example (without its
# tunnels): a GCP peer gateway makes no object, and the router advertises
# custom ranges.
project_id: my-project
region: europe-west4
network: https://www.googleapis.com/compute/v1/projects/my-project/global/networks/vpc1
name: net1-to-net-2
peer_gateways:
  default: {gcp: projects/my-project/regions/europe-west4/vpnGateways/net2-to-net1}
router_config:
  asn: 64514
  custom_advertise:
    all_subnets: true
    ip_ranges: {10.0.0.0/8: default}
