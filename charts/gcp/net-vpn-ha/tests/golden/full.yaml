kind: ComputeExternalVPNGateway
metadata:
  name: full-peer-aws
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: net-vpn-ha
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "external_gateway:aws"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "vpn-full-aws"
  description: "Terraform managed external VPN gateway"
  redundancyType: "FOUR_IPS_REDUNDANCY"
  interface:
    - id: 0
      ipAddress: "1.1.1.1"
    - id: 1
      ipAddress: "1.1.1.2"
    - id: 2
      ipAddress: "1.1.1.3"
    - id: 3
      ipAddress: "1.1.1.4"
