# Source: net-vpn-ha/templates/main.yaml
apiVersion: compute.gcp.hfl.dev/v1alpha1
kind: ComputeRouterRoutePolicy
metadata:
  name: existing-route-policy-import
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "existing"
    app.kubernetes.io/name: net-vpn-ha
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "route_policy:import"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "import"
  projectRef:
    external: "my-project"
  region: "europe-west1"
  routerRef:
    external: projects/my-project/regions/europe-west1/routers/existing-router
  type: ROUTE_POLICY_TYPE_IMPORT
  terms:
    - priority: 1
      match:
        expression: "true"
