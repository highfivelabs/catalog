# An existing gateway and router: no gateway and no router are made; the
# route policies (allow_alpha) go on the router router_config names.
allow_alpha: true
project_id: my-project
region: europe-west1
network: projects/my-project/global/networks/my-network
name: vpn-existing
vpn_gateway: projects/my-project/regions/europe-west1/vpnGateways/existing
vpn_gateway_create: null
router_config:
  create: false
  name: existing-router
  route_policies:
    import:
      type: IMPORT
      terms: [{priority: 1, match: {expression: "true"}, actions: []}]
