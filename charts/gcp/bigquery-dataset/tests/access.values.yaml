# fabric's README example "simple dataset with access and identities": with
# fabric's default dataset_access: false, one BigQueryDatasetAccess each
# (v1alpha1, so allow_alpha).
allow_alpha: true
project_id: my-project
id: my_dataset
access:
  reader-group: {role: READER, type: group}
  owner: {role: OWNER, type: user}
  project_owners: {role: OWNER, type: special_group}
  view_1: {role: READER, type: view}
access_identities:
  reader-group: playground-test@ludomagno.net
  owner: ludo@ludomagno.net
  project_owners: projectOwners
  view_1: my-project|my_dataset|my-table
