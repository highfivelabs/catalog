#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every object this
# chart renders carries the namePrefix in its cloud-side name
# (spec.resourceID), except the kinds listed here, each with the reason it
# cannot collide with another Instance's. A kind added to the chart and not
# listed fails `task test` until it is prefixed or listed.
exempt:
  BigQueryTable: "a table, view or materialized view is named within its dataset, whose ID carries the prefix"
  BigQueryRoutine: "a routine is named within its dataset, whose ID carries the prefix"
  BigQueryDatasetAccess: "one entry of the dataset's access list; it has no name of its own"
  TagsLocationTagBinding: "a tag value on the dataset; it has no name of its own"
  IAMBinding: "the members of one role on the dataset; it has no name of its own"
  IAMMember: "one member of one role on the dataset; it has no name of its own"
compactNames:
  BigQueryDataset: "a dataset ID is letters, digits and \"_\", so the namePrefix goes on with its hyphens as underscores"
