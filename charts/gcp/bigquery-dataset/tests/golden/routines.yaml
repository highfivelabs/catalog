apiVersion: bigquery.cnrm.cloud.google.com/v1beta1
kind: BigQueryRoutine
metadata:
  name: routines-routine-auth-routine-12a97f90
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "routines"
    app.kubernetes.io/name: bigquery-dataset
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "routine:auth_routine"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  projectRef:
    external: "my-project"
  datasetRef:
    external: "my_dataset"
  resourceID: "auth_routine"
  routineType: "TABLE_VALUED_FUNCTION"
  definitionBody: "SELECT 1 + value AS value"
  description: "Adds one."
  language: "SQL"
  determinismLevel: "DETERMINISTIC"
  returnTableType: "{\"columns\":[{\"name\":\"value\",\"type\":{\"typeKind\":\"INT64\"}}]}"
  arguments:
    - name: "value"
      argumentKind: "FIXED_TYPE"
      dataType: "{\"typeKind\":\"INT64\"}"
