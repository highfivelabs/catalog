apiVersion: bigquery.cnrm.cloud.google.com/v1beta1
kind: BigQueryRoutine
metadata:
  name: routines-routine-custom-masking-routine-935f1a18
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "routines"
    app.kubernetes.io/name: bigquery-dataset
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "routine:custom_masking_routine"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  projectRef:
    external: "my-project"
  datasetRef:
    external: "my_dataset"
  resourceID: "custom_masking_routine"
  routineType: "SCALAR_FUNCTION"
  definitionBody: "SAFE.REGEXP_REPLACE(ssn, '[0-9]', 'X')"
  language: "SQL"
  returnType: "{\"typeKind\" :  \"STRING\"}"
  arguments:
    - name: "ssn"
      dataType: "{\"typeKind\" :  \"STRING\"}"
