apiVersion: bigquery.cnrm.cloud.google.com/v1beta1
kind: BigQueryTable
metadata:
  name: full-table-external
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: bigquery-dataset
    app.kubernetes.io/version: "0.1.0"
    env: "prod"
    team: "data"
  annotations:
    hfl.dev/id: "table:external"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  datasetRef:
    external: "my_dataset"
  resourceID: "external"
  description: "Terraform managed."
  externalDataConfiguration:
    autodetect: false
    sourceUris:
      - gs://my-bucket/data/*.csv
    compression: "GZIP"
    connectionId: "projects/my-project/locations/eu/connections/c"
    fileSetSpecType: "FILE_SET_SPEC_TYPE_FILE_SYSTEM_MATCH"
    metadataCacheMode: "AUTOMATIC"
    referenceFileSchemaUri: "gs://my-bucket/schema.json"
    schema: "[{\"name\":\"a\",\"type\":\"STRING\"}]"
    sourceFormat: "CSV"
    ignoreUnknownValues: true
    maxBadRecords: 10
    csvOptions:
      quote: "\""
      allowJaggedRows: true
      allowQuotedNewlines: false
      encoding: "UTF-8"
      fieldDelimiter: ","
      skipLeadingRows: 1
    hivePartitioningOptions:
      mode: "AUTO"
      requirePartitionFilter: false
      sourceUriPrefix: "gs://my-bucket/data"
