kind: BigQueryTable
metadata:
  name: full-mview-daily
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: bigquery-dataset
    app.kubernetes.io/version: "0.1.0"
    env: "prod"
    kind: "mview"
    team: "data"
  annotations:
    hfl.dev/id: "materialized-view:daily"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  datasetRef:
    external: "my_dataset"
  resourceID: "daily"
  friendlyName: "Daily"
  description: "Daily counts."
  clustering:
    - day
  expirationTime: 1893456000000
  requirePartitionFilter: false
  timePartitioning:
    type: "DAY"
    field: "day"
  materializedView:
    query: "SELECT DATE(ts) AS day, COUNT(*) AS n FROM my_dataset.events GROUP BY day"
    enableRefresh: true
    refreshIntervalMs: 1800000
    allowNonIncrementalDefinition: false
