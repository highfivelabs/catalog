apiVersion: bigquery.cnrm.cloud.google.com/v1beta1
kind: BigQueryTable
metadata:
  name: tables-view-population
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "tables"
    app.kubernetes.io/name: bigquery-dataset
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "view:population"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  datasetRef:
    external: "my_dataset"
  resourceID: "population"
  friendlyName: "Population"
  description: "Terraform managed."
  schema: "[{\"description\":\"Total population\",\"name\":\"total\",\"type\":\"INT64\"}]"
  view:
    query: "SELECT SUM(population) AS total FROM my_dataset.countries"
    useLegacySql: false
