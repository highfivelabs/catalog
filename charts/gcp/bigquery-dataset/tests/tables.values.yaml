# fabric's README examples "tables and views" and "partitioned tables",
# merged.
project_id: my-project
id: my_dataset
tables:
  countries:
    friendly_name: Countries
    schema: '[{"name":"country","type":"STRING"},{"name":"population","type":"INT64"}]'
    deletion_protection: true
  table_a:
    deletion_protection: true
    friendly_name: Table a
    schema: '[{"name":"country","type":"STRING"},{"name":"population","type":"INT64"}]'
    partitioning:
      time: {type: DAY, expiration_ms: null}
views:
  population:
    friendly_name: Population
    query: SELECT SUM(population) AS total FROM my_dataset.countries
    schema:
      - {name: total, type: INT64, description: Total population}
    use_legacy_sql: false
    deletion_protection: true
