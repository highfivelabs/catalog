# dataset_access: true: the access rules, authorized views, datasets and
# routines in the dataset's own access list (fabric's README examples
# "authorized views, datasets and routines" and "access", merged).
project_id: my-project
id: my_dataset
dataset_access: true
access:
  reader-group: {role: READER, type: group}
  domain: {role: READER, type: domain}
  owner: {role: OWNER, type: user}
  project_owners: {role: OWNER, type: special_group}
  view_2: {role: READER, type: view}
access_identities:
  reader-group: readers@example.com
  domain: example.com
  owner: owner@example.com
  project_owners: projectOwners
  view_2: view_project|view_dataset|view_id_2
authorized_views:
  - {project_id: view_project, dataset_id: view_dataset, table_id: view_id_1}
  - {project_id: view_project, dataset_id: view_dataset, table_id: view_id_2}
authorized_datasets:
  - {project_id: auth_dataset_project, dataset_id: auth_dataset}
authorized_routines:
  - {project_id: auth_routine_project, dataset_id: auth_routine_dataset, routine_id: auth_routine}
