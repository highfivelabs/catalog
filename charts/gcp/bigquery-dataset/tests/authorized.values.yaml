# fabric's README example "authorized views, datasets and routines" (the
# private dataset), without its routine: with dataset_access: false (the
# default) authorized views and datasets are BigQueryDatasetAccess
# objects, and the kind has no routine (authorized-routines.fail.yaml).
# fabric's README example "authorized views via access", merged.
allow_alpha: true
project_id: private_project
id: private_dataset
authorized_views:
  - {project_id: auth_view_project, dataset_id: auth_view_dataset, table_id: auth_view}
  - {project_id: view_project, dataset_id: view_dataset, table_id: view_id_2}
authorized_datasets:
  - {project_id: auth_dataset_project, dataset_id: auth_dataset}
access:
  view_2: {role: READER, type: view}
  view_3: {role: READER, type: view}
access_identities:
  view_2: view_project|view_dataset|view_id_2
  view_3: view_project|view_dataset|view_id_3
