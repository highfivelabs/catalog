# fabric's README example "routines" without data_governance_type (refused:
# routine-governance.fail.yaml), and a table-valued function.
project_id: my-project
id: my_dataset
routines:
  custom_masking_routine:
    routine_type: SCALAR_FUNCTION
    language: SQL
    definition_body: SAFE.REGEXP_REPLACE(ssn, '[0-9]', 'X')
    return_type: '{"typeKind" :  "STRING"}'
    arguments:
      ssn:
        data_type: '{"typeKind" :  "STRING"}'
  auth_routine:
    routine_type: TABLE_VALUED_FUNCTION
    language: SQL
    description: Adds one.
    definition_body: SELECT 1 + value AS value
    determinism_level: DETERMINISTIC
    arguments:
      value:
        argument_kind: FIXED_TYPE
        data_type: '{"typeKind":"INT64"}'
    return_table_type: '{"columns":[{"name":"value","type":{"typeKind":"INT64"}}]}'
