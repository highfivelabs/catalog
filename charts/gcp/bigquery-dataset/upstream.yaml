# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set, or accepts only in part. Read by `task
# coverage`; `task coverage-verify` renders the chart to check that each one
# is refused. kind: gap (no Config Connector kind or field), alpha (a
# v1alpha1 kind, accepted with allow_alpha: true) or by-design (Bundt
# replaces it). partial: the variable is accepted, the reason says what is
# refused.
refused:
  - variable: context
    kind: by-design
    reason: "Bundt replaces fabric's $context lookups with ${...} expressions and valueFrom in the component's inputs"
  - variable: access
    kind: alpha
    reason: "with fabric's default dataset_access: false each entry is a BigQueryDatasetAccess, which is v1alpha1: needs allow_alpha: true. With dataset_access: true the entries are the dataset's own access list and need nothing"
    partial: true
    needs_allow_alpha: true
  - variable: authorized_views
    kind: alpha
    reason: "with fabric's default dataset_access: false each view is a BigQueryDatasetAccess, which is v1alpha1: needs allow_alpha: true. With dataset_access: true the views are in the dataset's own access list and need nothing"
    partial: true
    needs_allow_alpha: true
  - variable: authorized_datasets
    kind: alpha
    reason: "with fabric's default dataset_access: false each dataset is a BigQueryDatasetAccess, which is v1alpha1: needs allow_alpha: true. With dataset_access: true the datasets are in the dataset's own access list and need nothing"
    partial: true
    needs_allow_alpha: true
  - variable: authorized_routines
    kind: gap
    reason: "accepted with dataset_access: true only (the dataset's own access list): BigQueryDatasetAccess, fabric's default, has no routine"
    partial: true
  - variable: iam_bindings_additive
    kind: alpha
    reason: "config-connector-extensions' IAMMember is v1alpha1: rendered only with allow_alpha: true"
    partial: true
    needs_allow_alpha: true
  - variable: routines
    kind: gap
    reason: "data_governance_type, spark_options and remote_function_options are refused: BigQueryRoutine has no dataGovernanceType, sparkOptions or remoteFunctionOptions"
    partial: true
    fields: [data_governance_type, spark_options, remote_function_options]
