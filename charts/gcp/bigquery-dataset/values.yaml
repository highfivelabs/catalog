#
# Values mirror the Terraform variables of fabric's bigquery-dataset module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.dataset sets the dataset's ID in full (else fabric's: id).
names: {}
# An optional convenience: "<namePrefix>_" (its hyphens as underscores) in
# front of the dataset's ID when names.dataset is not set. Empty (the
# default) changes nothing.
namePrefix: ""
# fabric's own variable (the dataset's labels), with the catalog's meaning:
# labels on every object; an unprefixed one is a cloud label too.
labels: {}
# Cloud labels on every object.
tags: {}
# Accept the v1alpha1 kinds: BigQueryDatasetAccess (access,
# authorized_views and authorized_datasets with dataset_access: false) and
# config-connector-extensions' IAMMember (iam_bindings_additive).
allow_alpha: false
# DELETE (default) or ABANDON (keeps the dataset and everything in it).
deletion_policy: DELETE

# Map of access rules with role and identity type: domain, group,
# special_group, user or view. Keys match those in access_identities.
access: {}
# Identities of the access rules; a view is "project_id|dataset_id|table_id".
access_identities: {}
# Datasets authorized on the dataset.
authorized_datasets: []
# Routines authorized on the dataset (dataset_access: true only).
authorized_routines: []
# Views authorized on the dataset.
authorized_views: []
# Context-specific interpolations. Refused when set: Bundt expressions
# (${...}) and valueFrom replace fabric's $context lookups.
context: {}
# Set access in the dataset itself instead of separate objects.
dataset_access: false
# Optional description.
description: Terraform managed.
# The KMS key protecting the dataset's tables by default.
encryption_key: null
# Dataset friendly name.
friendly_name: null
# Authoritative IAM, {ROLE => [MEMBERS]}. Mutually exclusive with access.
iam: {}
# Authoritative IAM bindings, {KEY => {role, members, condition}}.
iam_bindings: {}
# Additive IAM bindings, {KEY => {role, member, condition}}: needs
# allow_alpha (IAMMember is v1alpha1).
iam_bindings_additive: {}
# Authoritative IAM, {PRINCIPAL => [ROLES]}, merged with iam.
iam_by_principals: {}
# Dataset ID.
id: ""
# Dataset location.
location: EU
# Materialized views, keyed by table ID.
materialized_views: {}
# Dataset options.
options: {}
# The project the dataset is created in.
project_id: ""
# Routines, keyed by routine ID.
routines: {}
# Tables, keyed by table ID.
tables: {}
# Tag bindings for the dataset, key => tag value ID.
tag_bindings: {}
# Views, keyed by table ID.
views: {}
