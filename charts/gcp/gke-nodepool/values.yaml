#
# Values mirror the Terraform variables of fabric's gke-nodepool module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types and the module's validations.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.nodepool: the node pool name in full; names.serviceAccount: the
# created service account's ID in full. A name set here takes no prefix;
# unset, the node pool is named name (or the component's name when name is
# null) and the account tf-gke-<name>, as fabric names them.
names: {}
# An optional convenience: "<namePrefix>-" in front of the derived node pool
# name and service account ID (never a name set under names). Empty (the
# default) changes nothing.
namePrefix: ""
# fabric's labels: "The resource labels to be applied each node (vm)",
# nodeConfig.resourceLabels. As every chart's labels, they also label every
# object in Kubernetes; a prefixed key (hfl.dev/team) stays in Kubernetes
# only.
labels: {}
# fabric's tags, "Network tags applied to nodes" (a list), are
# nodeConfig.tags. As every chart's tags, a map is cloud labels: on the
# nodes (nodeConfig.resourceLabels) and on every object.
tags: null

# Cluster id. Optional, but providing cluster_id is recommended.
cluster_id: null
# Cluster name.
cluster_name: ""
# Kubernetes nodes version. Ignored if auto_upgrade is set in management.
gke_version: null
# Kubernetes labels applied to each node.
k8s_labels: {}
# Cluster location.
location: ""
# Maximum number of pods per node.
max_pods_per_node: null
# Optional nodepool name.
name: null
# Network configuration ({enable_private_nodes, pod_range, ...}).
network_config: null
# Node-level configuration (README.md, "Values").
node_config:
  disk_type: pd-balanced
  gcfs: false
  gvnic: false
# Number of nodes per instance group: {initial, current}.
node_count:
  initial: 1
# Node locations.
node_locations: null
# Nodepool-level configuration ({autoscaling, management, placement_policy,
# queued_provisioning, upgrade_settings}).
nodepool_config: null
# Cluster project id.
project_id: ""
# Configuration of the desired reservation which instances could take
# capacity from.
reservation_affinity: null
# Resource manager tag keys and values attached to the nodes.
resource_manager_tags: null
# Nodepool service account: {create, email, oauth_scopes, display_name}.
# Neither created nor given: the Compute Engine default account.
service_account:
  create: false
  email: null
  oauth_scopes: null
  display_name: null
# Sole tenant node group.
sole_tenant_nodegroup: null
# Kubernetes taints applied to all nodes, {KEY: {value, effect}}.
taints: {}

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# node pool and service account when the component is deleted. PREVENT has
# no Config Connector equivalent.
deletion_policy: null
