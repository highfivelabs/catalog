Copyright 2026 High Five Labs
SPDX-License-Identifier: Apache-2.0
Ported from cloud-foundation-fabric modules/gke-nodepool/main.tf (v60.0.0),
Copyright 2022 Google LLC, Apache-2.0.

google_container_node_pool.nodepool: one ContainerNodePool on the cluster
cluster_id (or cluster_name) in location. What nodeConfig and networkConfig
cannot say is refused (README.md, "Values").
*/ -}}
{{- $v := .Values }}
{{- $nc := $v.node_config }}
{{- include "kcc.names" (list $ (list "nodepool" "serviceAccount")) }}
{{- $bd := $nc.boot_disk | default dict }}
{{- include "kcc.unsupported" (list $ "node_config.boot_disk.provisioned_iops" $bd.provisioned_iops "nodeConfig has no bootDisk (provisioned IOPS)") }}
{{- include "kcc.unsupported" (list $ "node_config.boot_disk.provisioned_throughput" $bd.provisioned_throughput "nodeConfig has no bootDisk (provisioned throughput)") }}
{{- include "kcc.unsupported" (list $ "node_config.flex_start" $nc.flex_start "nodeConfig has no flexStart") }}
{{- $kc := $nc.kubelet_config | default dict }}
{{- include "kcc.unsupported" (list $ "node_config.kubelet_config.insecure_kubelet_readonly_port_enabled" $kc.insecure_kubelet_readonly_port_enabled "nodeConfig's kubeletConfig has no insecureKubeletReadonlyPortEnabled") }}
{{- include "kcc.unsupported" (list $ "node_config.kubelet_config.container_log_max_size" $kc.container_log_max_size "nodeConfig's kubeletConfig has no containerLogMaxSize") }}
{{- include "kcc.unsupported" (list $ "node_config.kubelet_config.container_log_max_files" $kc.container_log_max_files "nodeConfig's kubeletConfig has no containerLogMaxFiles") }}
{{- include "kcc.unsupported" (list $ "node_config.kubelet_config.allowed_unsafe_sysctls" $kc.allowed_unsafe_sysctls "nodeConfig's kubeletConfig has no allowedUnsafeSysctls") }}
{{- $net := $v.network_config }}
{{- if $net }}
{{- include "kcc.unsupported" (list $ "network_config.total_egress_bandwidth_tier" $net.total_egress_bandwidth_tier "ContainerNodePool's networkConfig has no networkPerformanceConfig") }}
{{- end }}
{{- $img := include "nodepool.image" . | fromJson }}
{{- $pc := $v.nodepool_config | default dict }}
{{- $as := $pc.autoscaling }}
{{- $sa := $v.service_account }}
{{- $scopes := $sa.oauth_scopes | default (list "https://www.googleapis.com/auth/devstorage.read_only" "https://www.googleapis.com/auth/logging.write" "https://www.googleapis.com/auth/monitoring" "https://www.googleapis.com/auth/monitoring.write" "https://www.googleapis.com/auth/userinfo.email") }}
{{- $taints := $v.taints | default dict }}
{{- if $img.win }}{{ $taints = merge (dict "node.kubernetes.io/os" (dict "value" "windows" "effect" "NO_EXECUTE")) $taints }}{{ end }}
{{- /* Cloud labels on the nodes: fabric's labels (the unprefixed ones; a
prefixed key is a Kubernetes label only) and the chart's tags when they are
a map. */ -}}
{{- $resourceLabels := dict }}
{{- range $k, $val := ($v.labels | default dict) }}{{ if not (contains "/" $k) }}{{ $_ := set $resourceLabels $k (toString $val) }}{{ end }}{{ end }}
{{- if kindIs "map" $v.tags }}{{ range $k, $val := $v.tags }}{{ $_ := set $resourceLabels $k (toString $val) }}{{ end }}{{ end }}
{{- $networkTags := ternary $v.tags list (kindIs "slice" $v.tags) }}
---
apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerNodePool
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" .Release.Name "id" "nodepool" "project" $v.project_id "abandon" (include "kcc.abandon" .)) | nindent 2 }}
spec:
  resourceID: {{ include "nodepool.name" . | quote }}
  location: {{ $v.location | quote }}
  clusterRef:
    {{- /* The cluster's name, as Config Connector resolves a clusterRef to
    a ContainerCluster object: the node pool's project and location say
    where it is. A full id here makes Config Connector's delete look the
    pool up by a malformed id, find nothing and leave the pool in Google
    Cloud (live run, 2026-11-12), so cluster_id gives its last segment. */}}
    external: {{ $v.cluster_id | default $v.cluster_name | splitList "/" | last | quote }}
  {{- with $v.gke_version }}
  version: {{ . | quote }}
  {{- end }}
  {{- if not (kindIs "invalid" $v.max_pods_per_node) }}
  maxPodsPerNode: {{ $v.max_pods_per_node }}
  {{- end }}
  initialNodeCount: {{ $v.node_count.initial }}
  {{- if not (kindIs "invalid" $v.node_count.current) }}
  nodeCount: {{ $v.node_count.current }}
  {{- end }}
  {{- with $v.node_locations }}
  nodeLocations: {{ toJson . }}
  {{- end }}
  {{- with $as }}
  autoscaling:
    {{- with .location_policy }}
    locationPolicy: {{ . | quote }}
    {{- end }}
    {{- if .use_total_nodes }}
    {{- if not (kindIs "invalid" .max_node_count) }}
    totalMaxNodeCount: {{ .max_node_count }}
    {{- end }}
    {{- if not (kindIs "invalid" .min_node_count) }}
    totalMinNodeCount: {{ .min_node_count }}
    {{- end }}
    {{- else }}
    {{- if not (kindIs "invalid" .max_node_count) }}
    maxNodeCount: {{ .max_node_count }}
    {{- end }}
    {{- if not (kindIs "invalid" .min_node_count) }}
    minNodeCount: {{ .min_node_count }}
    {{- end }}
    {{- end }}
  {{- end }}
  {{- with $pc.management }}
  management:
    {{- if not (kindIs "invalid" .auto_repair) }}
    autoRepair: {{ .auto_repair }}
    {{- end }}
    {{- if not (kindIs "invalid" .auto_upgrade) }}
    autoUpgrade: {{ .auto_upgrade }}
    {{- end }}
  {{- end }}
  {{- with $net }}
  {{- $pr := .pod_range | default dict }}
  networkConfig:
    {{- if $pr.create }}
    createPodRange: true
    {{- end }}
    {{- if not (kindIs "invalid" .enable_private_nodes) }}
    enablePrivateNodes: {{ .enable_private_nodes }}
    {{- end }}
    {{- with $pr.cidr }}
    podIpv4CidrBlock: {{ . | quote }}
    {{- end }}
    {{- with $pr.name }}
    podRange: {{ . | quote }}
    {{- end }}
    {{- with .additional_node_network_configs }}
    additionalNodeNetworkConfigs:
      {{- range . }}
      - networkRef:
          external: {{ .network | quote }}
        subnetworkRef:
          external: {{ .subnetwork | quote }}
      {{- end }}
    {{- end }}
    {{- with .additional_pod_network_configs }}
    additionalPodNetworkConfigs:
      {{- range . }}
      - subnetworkRef:
          external: {{ .subnetwork | quote }}
        secondaryPodRange: {{ .secondary_pod_range | quote }}
        maxPodsPerNode: {{ .max_pods_per_node | int }}
      {{- end }}
    {{- end }}
    {{- if .pod_cidr_overprovisioning_disabled }}
    podCidrOverprovisionConfig:
      disabled: true
    {{- end }}
  {{- end }}
  {{- with $pc.upgrade_settings }}
  upgradeSettings:
    maxSurge: {{ .max_surge }}
    maxUnavailable: {{ .max_unavailable }}
    {{- with .strategy }}
    strategy: {{ . | quote }}
    {{- end }}
    {{- with .blue_green_settings }}
    blueGreenSettings:
      {{- with .node_pool_soak_duration }}
      nodePoolSoakDuration: {{ . | quote }}
      {{- end }}
      {{- $srp := .standard_rollout_policy | default dict }}
      standardRolloutPolicy:
        {{- if not (kindIs "invalid" $srp.batch_percentage) }}
        batchPercentage: {{ $srp.batch_percentage }}
        {{- end }}
        {{- if not (kindIs "invalid" $srp.batch_node_count) }}
        batchNodeCount: {{ $srp.batch_node_count }}
        {{- end }}
        {{- with $srp.batch_soak_duration }}
        batchSoakDuration: {{ . | quote }}
        {{- end }}
    {{- end }}
  {{- end }}
  {{- with $pc.placement_policy }}
  placementPolicy:
    type: {{ .type | quote }}
    {{- with .policy_name }}
    policyNameRef:
      external: {{ . | quote }}
    {{- end }}
    {{- with .tpu_topology }}
    tpuTopology: {{ . | quote }}
    {{- end }}
  {{- end }}
  {{- if $pc.queued_provisioning }}
  queuedProvisioning:
    enabled: true
  {{- end }}
  nodeConfig:
    {{- with ($bd.kms_key | default $nc.boot_disk_kms_key) }}
    bootDiskKMSCryptoKeyRef:
      external: {{ . | quote }}
    {{- end }}
    {{- $size := $bd.size_gb | default $nc.disk_size_gb }}
    {{- if not (kindIs "invalid" $size) }}
    diskSizeGb: {{ $size }}
    {{- end }}
    {{- with ($bd.type | default $nc.disk_type) }}
    diskType: {{ . | quote }}
    {{- end }}
    {{- with $nc.image_type }}
    imageType: {{ . | quote }}
    {{- end }}
    {{- with $v.k8s_labels }}
    labels: {{ toJson . }}
    {{- end }}
    {{- with $resourceLabels }}
    resourceLabels: {{ toJson . }}
    {{- end }}
    {{- if not (kindIs "invalid" $nc.local_ssd_count) }}
    localSsdCount: {{ $nc.local_ssd_count }}
    {{- end }}
    {{- with $nc.machine_type }}
    machineType: {{ . | quote }}
    {{- end }}
    metadata: {{ merge (dict "disable-legacy-endpoints" "true") ($nc.metadata | default dict) | toJson }}
    {{- with $nc.min_cpu_platform }}
    minCpuPlatform: {{ . | quote }}
    {{- end }}
    {{- with $v.sole_tenant_nodegroup }}
    nodeGroupRef:
      external: {{ . | quote }}
    {{- end }}
    oauthScopes: {{ toJson $scopes }}
    {{- if not (kindIs "invalid" $nc.preemptible) }}
    preemptible: {{ $nc.preemptible }}
    {{- end }}
    {{- if $sa.create }}
    serviceAccountRef:
      name: {{ include "kcc.name" (list .Release.Name "sa") }}
    {{- else if $sa.email }}
    serviceAccountRef:
      external: {{ $sa.email | quote }}
    {{- end }}
    {{- if and $nc.spot (not $nc.preemptible) }}
    spot: true
    {{- end }}
    {{- with $networkTags }}
    tags: {{ toJson . }}
    {{- end }}
    {{- with $v.resource_manager_tags }}
    resourceManagerTags: {{ toJson . }}
    {{- end }}
    {{- if not (kindIs "invalid" $nc.ephemeral_ssd_count) }}
    ephemeralStorageConfig:
      localSsdCount: {{ $nc.ephemeral_ssd_count }}
    {{- end }}
    {{- if not (kindIs "invalid" $nc.ephemeral_storage_local_ssd_count) }}
    ephemeralStorageLocalSsdConfig:
      localSsdCount: {{ $nc.ephemeral_storage_local_ssd_count }}
    {{- end }}
    {{- if and $nc.gcfs $img.cosContainerd }}
    gcfsConfig:
      enabled: true
    {{- end }}
    {{- with $nc.guest_accelerator }}
    guestAccelerator:
      - count: {{ .count }}
        type: {{ .type | quote }}
        {{- with .gpu_driver }}
        {{- with .partition_size }}
        gpuPartitionSize: {{ . | quote }}
        {{- end }}
        {{- if not (kindIs "invalid" .max_shared_clients_per_gpu) }}
        gpuSharingConfig:
          gpuSharingStrategy: TIME_SHARING
          maxSharedClientsPerGpu: {{ .max_shared_clients_per_gpu }}
        {{- end }}
        gpuDriverInstallationConfig:
          gpuDriverVersion: {{ .version | quote }}
        {{- end }}
    {{- end }}
    {{- if gt (int ($nc.local_nvme_ssd_count | default 0)) 0 }}
    localNvmeSsdBlockConfig:
      localSsdCount: {{ $nc.local_nvme_ssd_count }}
    {{- end }}
    {{- if and $nc.gvnic $img.cos }}
    gvnic:
      enabled: true
    {{- end }}
    {{- with $nc.kubelet_config }}
    kubeletConfig:
      cpuManagerPolicy: {{ .cpu_manager_policy | quote }}
      {{- if not (kindIs "invalid" .cpu_cfs_quota) }}
      cpuCfsQuota: {{ .cpu_cfs_quota }}
      {{- end }}
      {{- with .cpu_cfs_quota_period }}
      cpuCfsQuotaPeriod: {{ . | quote }}
      {{- end }}
      {{- if not (kindIs "invalid" .pod_pids_limit) }}
      podPidsLimit: {{ .pod_pids_limit }}
      {{- end }}
      {{- if not (kindIs "invalid" .image_gc_low_threshold_percent) }}
      imageGcLowThresholdPercent: {{ .image_gc_low_threshold_percent }}
      {{- end }}
      {{- if not (kindIs "invalid" .image_gc_high_threshold_percent) }}
      imageGcHighThresholdPercent: {{ .image_gc_high_threshold_percent }}
      {{- end }}
      {{- with .image_minimum_gc_age }}
      imageMinimumGcAge: {{ . | quote }}
      {{- end }}
      {{- with .image_maximum_gc_age }}
      imageMaximumGcAge: {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- with $nc.linux_node_config }}
    linuxNodeConfig:
      {{- with .sysctls }}
      sysctls: {{ toJson . }}
      {{- end }}
      cgroupMode: {{ .cgroup_mode | default "CGROUP_MODE_UNSPECIFIED" | quote }}
    {{- end }}
    {{- with $v.reservation_affinity }}
    reservationAffinity:
      consumeReservationType: {{ .consume_reservation_type | quote }}
      {{- with .key }}
      key: {{ . | quote }}
      {{- end }}
      {{- with .values }}
      values: {{ toJson . }}
      {{- end }}
    {{- end }}
    {{- if $nc.sandbox_config_gvisor }}
    sandboxConfig:
      sandboxType: gvisor
    {{- end }}
    {{- with $nc.shielded_instance_config }}
    shieldedInstanceConfig:
      {{- if not (kindIs "invalid" .enable_secure_boot) }}
      enableSecureBoot: {{ .enable_secure_boot }}
      {{- end }}
      {{- if not (kindIs "invalid" .enable_integrity_monitoring) }}
      enableIntegrityMonitoring: {{ .enable_integrity_monitoring }}
      {{- end }}
    {{- end }}
    {{- with $taints }}
    taint:
      {{- range $k := keys . | sortAlpha }}
      - key: {{ $k | quote }}
        value: {{ (index $taints $k).value | quote }}
        effect: {{ (index $taints $k).effect | quote }}
      {{- end }}
    {{- end }}
    {{- with $nc.workload_metadata_config_mode }}
    workloadMetadataConfig:
      mode: {{ . | quote }}
    {{- end }}
    {{- with $nc.advanced_machine_features }}
    advancedMachineFeatures:
      {{- if not (kindIs "invalid" .enable_nested_virtualization) }}
      enableNestedVirtualization: {{ .enable_nested_virtualization }}
      {{- end }}
      {{- if not (kindIs "invalid" .threads_per_core) }}
      threadsPerCore: {{ .threads_per_core }}
      {{- end }}
    {{- end }}
    {{- with $nc.containerd_config }}
    containerdConfig:
      {{- with .private_registry_access_config }}
      {{- $cas := .certificate_authority_domain_config | default list }}
      privateRegistryAccessConfig:
        enabled: {{ gt (len $cas) 0 }}
        {{- with $cas }}
        certificateAuthorityDomainConfig:
          {{- range . }}
          - fqdns: {{ toJson .fqdns }}
            gcpSecretManagerCertificateConfig:
              secretRef:
                external: {{ .gcp_secret_manager_certificate_config_secret_uri | quote }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- if not (kindIs "invalid" .writable_cgroups) }}
      writableCgroups:
        enabled: {{ .writable_cgroups }}
      {{- end }}
      {{- with .registry_hosts }}
      {{- $rh := . }}
      registryHosts:
        {{- range $server := keys $rh | sortAlpha }}
        - server: {{ $server | quote }}
          {{- $hosts := (index $rh $server).hosts | default dict }}
          {{- with $hosts }}
          hosts:
            {{- range $host := keys $hosts | sortAlpha }}
            {{- $h := index $hosts $host }}
            - host: {{ $host | quote }}
              {{- with $h.capabilities }}
              capabilities: {{ toJson . }}
              {{- end }}
              {{- if not (kindIs "invalid" $h.override_path) }}
              overridePath: {{ $h.override_path }}
              {{- end }}
              {{- with $h.dial_timeout }}
              dialTimeout: {{ . | quote }}
              {{- end }}
              {{- with $h.header }}
              header:
                {{- range $hk := keys . | sortAlpha }}
                - key: {{ $hk | quote }}
                  value: {{ index $h.header $hk | toJson }}
                {{- end }}
              {{- end }}
              {{- with $h.ca_gcp_secret_manager_secret_uri }}
              ca:
                - secretRef:
                    external: {{ . | quote }}
              {{- end }}
              {{- with $h.client }}
              client:
                - cert:
                    secretRef:
                      external: {{ .cert_gcp_secret_manager_secret_uri | quote }}
                  {{- with .key_gcp_secret_manager_secret_uri }}
                  key:
                    secretRef:
                      external: {{ . | quote }}
                  {{- end }}
              {{- end }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}
