{{- $v := .Values }}
{{- if $v.service_account.create }}
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMServiceAccount
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list .Release.Name "sa")) "id" "service_account" "project" $v.project_id "abandon" (include "kcc.abandon" .)) | nindent 2 }}
spec:
  resourceID: {{ include "nodepool.saId" . | quote }}
  displayName: {{ $v.service_account.display_name | default (printf "Terraform GKE %s %s." $v.cluster_name ($v.name | default "")) | quote }}
{{- end }}
