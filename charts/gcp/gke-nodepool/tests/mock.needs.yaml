# What tests/mock.values.yaml needs in the fake cloud: the cluster the node
# pool joins. hack/mock-apply.sh applies it first, waits for it, and deletes
# it after the chart's objects. Not part of the chart.
apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerCluster
metadata:
  name: catalog-mock-cluster
  annotations:
    cnrm.cloud.google.com/project-id: mock-project
    cnrm.cloud.google.com/remove-default-node-pool: "true"
spec:
  location: us-central1-a
  initialNodeCount: 1
