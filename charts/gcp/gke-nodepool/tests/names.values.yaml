# Names in full, labels and tags, as Bundt passes them from a team's naming
# convention (docs/design.md, "Names, labels and tags"): the node pool and
# its service account take their names as given; the tags (a map) are
# cloud labels, on the nodes and every object.
project_id: my-project
cluster_name: cluster-0
location: europe-west1
name: web
names: {nodepool: shop-dev-web, serviceAccount: shop-dev-web-nodes}
labels: {hfl.dev/team: shop, hfl.dev/environment: dev}
tags: {team: shop, environment: dev}
service_account: {create: true}
