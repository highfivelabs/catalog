---
# Source: gke-nodepool/templates/nodepool.yaml
apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerNodePool
metadata:
  name: names
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "names"
    app.kubernetes.io/name: gke-nodepool
    app.kubernetes.io/version: "0.1.0"
    environment: "dev"
    hfl.dev/environment: "dev"
    hfl.dev/team: "shop"
    team: "shop"
  annotations:
    hfl.dev/id: "nodepool"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "shop-dev-web"
  location: "europe-west1"
  clusterRef:
    external: "projects/my-project/locations/europe-west1/clusters/cluster-0"
  initialNodeCount: 1
  nodeConfig:
    diskType: "pd-balanced"
    resourceLabels: {"environment":"dev","team":"shop"}
    metadata: {"disable-legacy-endpoints":"true"}
    oauthScopes: ["https://www.googleapis.com/auth/devstorage.read_only","https://www.googleapis.com/auth/logging.write","https://www.googleapis.com/auth/monitoring","https://www.googleapis.com/auth/monitoring.write","https://www.googleapis.com/auth/userinfo.email"]
    serviceAccountRef:
      name: names-sa
---
# Source: gke-nodepool/templates/service-account.yaml
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMServiceAccount
metadata:
  name: names-sa
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "names"
    app.kubernetes.io/name: gke-nodepool
    app.kubernetes.io/version: "0.1.0"
    environment: "dev"
    hfl.dev/environment: "dev"
    hfl.dev/team: "shop"
    team: "shop"
  annotations:
    hfl.dev/id: "service_account"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "shop-dev-web-nodes"
  displayName: "Terraform GKE cluster-0 web."
