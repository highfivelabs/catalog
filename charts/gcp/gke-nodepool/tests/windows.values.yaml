# A Windows node pool with a given service account and total node
# autoscaling: fabric adds the Windows taint.
project_id: my-project
cluster_name: cluster-0
location: europe-west1
name: win
service_account: {email: nodes@my-project.iam.gserviceaccount.com}
node_config:
  image_type: WINDOWS_LTSC_CONTAINERD
  machine_type: n2-standard-4
  ephemeral_ssd_count: 1
  preemptible: true
  spot: true
nodepool_config:
  autoscaling: {use_total_nodes: true, min_node_count: 0, max_node_count: 3}
  queued_provisioning: true
