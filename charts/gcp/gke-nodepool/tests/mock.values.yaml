# Applied to the fake cloud by hack/mock-apply.sh, after the ContainerCluster
# in tests/mock.needs.yaml.
project_id: mock-project
cluster_name: catalog-mock-cluster
location: us-central1-a
name: catalog-mock-pool
labels: {env: test}
service_account: {create: true}
node_count: {initial: 1}
node_config: {machine_type: e2-small, disk_size_gb: 20, spot: true}
nodepool_config:
  autoscaling: {min_node_count: 0, max_node_count: 1}
  management: {auto_repair: true, auto_upgrade: true}
