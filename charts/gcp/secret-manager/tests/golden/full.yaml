      customerManagedEncryption:
        kmsKeyRef:
          external: "projects/my-project/locations/global/keyRings/kr/cryptoKeys/k"
  rotation:
    nextRotationTime: "2027-01-01T00:00:00Z"
    rotationPeriod: "2592000s"
  topics:
    - topicRef:
        external: "projects/my-project/topics/rotation"
