# Names in full, labels and tags, as Bundt passes them from a team's naming
# convention (docs/design.md, "Names, labels and tags"): db-password takes
# its name as given, with no prefix; api-key is named by its key; every
# object carries the labels and tags.
project_id: my-project
names: {db-password: shop-dev-database-password}
labels: {hfl.dev/team: shop, hfl.dev/environment: dev}
tags: {team: shop, environment: dev}
secrets:
  db-password: {}
  api-key:
    tag_bindings: {env: tagValues/1234567890}
