#
# Values mirror the Terraform variables of fabric's secret-manager module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types and the module's validations.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# Each secret's ID in full, {<key of secrets>: <secret id>}. A name set here
# takes no prefix. A secret not named here is named by its key, as fabric
# names it.
names: {}
# An optional convenience: "<namePrefix>-" in front of every derived secret
# ID (never one set under names). Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. A prefixed key (hfl.dev/team) stays in
# Kubernetes; an unprefixed one also becomes a Google Cloud label, since
# Config Connector copies it to the resource.
labels: {}
# Cloud labels on every resource: on Google Cloud, labels (Config
# Connector carries them as unprefixed metadata.labels).
tags: {}

# Context-specific interpolations. Refused when set: Bundt's ${...}
# expressions and valueFrom replace fabric's $context lookups.
context: {}
# Project id where the secrets are created.
project_id: ""
# Project number of project_id, used in the tag bindings' parent (fabric
# uses it to avoid permadiffs); the project id when null.
project_number: null
# Map of secrets to manage, {SECRET_ID: {...}} (README.md, "Values").
# Regional secrets (location) and versions are refused.
secrets: {}
# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# secrets when the component is deleted. PREVENT has no Config Connector
# equivalent.
deletion_policy: null
