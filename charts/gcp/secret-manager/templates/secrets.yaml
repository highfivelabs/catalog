{{- /*
Copyright 2026 High Five Labs
SPDX-License-Identifier: Apache-2.0
Ported from cloud-foundation-fabric modules/secret-manager/global.tf
(v60.0.0), Copyright 2025 Google LLC, Apache-2.0.

google_secret_manager_secret.default: one SecretManagerSecret per entry of
secrets. Regional secrets (regional.tf, an entry with location) have no
Config Connector kind and are refused; so are versions (README.md,
"Values").
*/ -}}
{{- $v := .Values }}
{{- include "kcc.unsupported" (list $ "context" $v.context "use Bundt expressions (${...}) and valueFrom in the component's inputs instead") }}
{{- $secrets := $v.secrets | default dict }}
{{- include "kcc.names" (list $ (keys $secrets | sortAlpha)) }}
{{- $abandon := include "kcc.abandon" . }}
{{- range $key := keys $secrets | sortAlpha }}
{{- $s := index $secrets $key }}
{{- include "kcc.unsupported" (list $ (printf "secrets.%s.location" $key) $s.location "a regional secret (google_secret_manager_regional_secret) has no Config Connector kind") }}
{{- include "kcc.unsupported" (list $ (printf "secrets.%s.versions" $key) $s.versions "a version's data would be written into the rendered SecretManagerSecretVersion; how Bundt supplies secret data (a Kubernetes Secret through secretData.valueFrom) is not settled") }}
{{- include "kcc.unsupported" (list $ (printf "secrets.%s.tags" $key) $s.tags "SecretManagerSecret has no field for resource manager tags at creation; use tag_bindings") }}
{{- $vc := $s.version_config | default dict }}
{{- include "kcc.unsupported" (list $ (printf "secrets.%s.version_config.destroy_ttl" $key) $vc.destroy_ttl "SecretManagerSecret has no version destroy TTL field") }}
{{- $ec := $s.expiration_config | default dict }}
{{- if and $ec.time $ec.ttl }}
{{- fail (printf "secret-manager: secrets.%s: only one of time and ttl can be set in expiration config (the module refuses it too)" $key) }}
{{- end }}
{{- if and $s.rotation_config (not $s.topics) }}
{{- fail (printf "secret-manager: secrets.%s: at least one topic must be configured when rotation_config is set (the module refuses it too)" $key) }}
{{- end }}
---
apiVersion: secretmanager.cnrm.cloud.google.com/v1beta1
kind: SecretManagerSecret
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "secretManager.object" (list $ $key)) "id" (printf "secret:%s" $key) "project" $v.project_id "labels" ($s.labels | default dict) "abandon" $abandon) | nindent 2 }}
spec:
  resourceID: {{ include "secretManager.id" (list $ $key) | quote }}
  {{- with $s.annotations }}
  annotations:
    {{- range $k, $a := . }}
    {{ $k | quote }}: {{ $a | quote }}
    {{- end }}
  {{- end }}
  {{- with $vc.aliases }}
  versionAliases:
    {{- range $alias, $n := . }}
    {{ $alias | quote }}: {{ $n | toString | quote }}
    {{- end }}
  {{- end }}
  {{- with $ec.time }}
  expireTime: {{ . | quote }}
  {{- end }}
  {{- with $ec.ttl }}
  ttl: {{ . | quote }}
  {{- end }}
  replication:
    {{- if kindIs "invalid" $s.global_replica_locations }}
    {{- with $s.kms_key }}
    auto:
      customerManagedEncryption:
        kmsKeyRef:
          external: {{ . | quote }}
    {{- else }}
    auto: {}
    {{- end }}
    {{- else }}
    userManaged:
      replicas:
        {{- range $location := keys $s.global_replica_locations | sortAlpha }}
        - location: {{ $location | quote }}
          {{- with index $s.global_replica_locations $location }}
          customerManagedEncryption:
            kmsKeyRef:
              external: {{ . | quote }}
          {{- end }}
        {{- end }}
    {{- end }}
  {{- with $s.rotation_config }}
  rotation:
    {{- with .next_time }}
    nextRotationTime: {{ . | quote }}
    {{- end }}
    rotationPeriod: {{ .period | quote }}
  {{- end }}
  {{- with $s.topics }}
  topics:
    {{- range $t := . }}
    - topicRef:
        external: {{ $t | quote }}
    {{- end }}
  {{- end }}
{{- end }}
