#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every object this
# chart renders carries the namePrefix in its cloud-side name
# (spec.resourceID), except the kinds listed here, each with the reason it
# cannot collide with another Instance's. A kind added to the chart and not
# listed fails `task test` until it is prefixed or listed.
noCloudNames: "the API assigns a rule's ID (ru_...), a deployment is one rule's, and rules name a reference list by its ID in their YARA-L text (%id), so the chart keeps fabric's ID, the key: namePrefix has no effect"
exempt:
  ChronicleRule: "the API assigns a rule's ID (ru_...); the chart sets none"
  ChronicleRuleDeployment: "the deployment of one rule; it has no name of its own"
  ChronicleReferenceList: "rules name a reference list by its ID in their YARA-L text (%id), so the chart keeps fabric's ID, the key"
