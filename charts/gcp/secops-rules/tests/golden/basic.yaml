kind: ChronicleRule
metadata:
  name: basic-rule-network-traffic-to-specific-country-bf2fdf62
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: secops-rules
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "rule:network_traffic_to_specific_country"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  projectRef:
    external: "my-project"
  location: "europe"
  instance: "3fb9b8b0-6a5a-4b0b-8a6f-b1a7b1f6c1d2"
  deletionPolicy: FORCE
  text: "rule network_traffic_to_specific_country {\n  meta:\n    author = \"Google Cloud Security\"\n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    not net.ip_in_range_cidr($e.target.ip, %private_ip_ranges)\n  condition:\n    $e\n}\n"
