#
# Values mirror the Terraform variables of fabric's secops-rules module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types and the module's validations.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables. The chart gives no derived names: a reference
# list's ID is its key (rules name it so), a rule's the API's.
names: {}
# An optional convenience; nothing here takes it (above).
namePrefix: ""
# Kubernetes labels on every object. Rules and reference lists take no
# Google Cloud labels, so these stay in Kubernetes.
labels: {}
# Cloud labels; nothing here takes them.
tags: {}
# Rule deployments are config-connector-extensions' v1alpha1
# ChronicleRuleDeployment: rules_config renders only with allow_alpha: true
# (docs/design.md, "Alpha kinds").
allow_alpha: false
# DELETE (default) or ABANDON (keeps the rules and reference lists).
deletion_policy: DELETE

# Paths to YAML config expected in 'rules' and 'reference_lists', and the
# folders of rule definitions (.yaral) and reference list contents (.txt).
# A chart cannot read files: rules and reference_lists are refused (put
# their content in rules_config and reference_lists_config), and the
# folders' files go in factories_data.
factories_config: {}
# Not a Terraform variable: the files of factories_config's folders, as
# data (docs/design.md, "Submodules and factories"). rules: {RULE =>
# YARA-L text} (was <rules_defs>/RULE.yaral); reference_lists: {LIST =>
# text, one entry per line} (was <reference_lists_defs>/LIST.txt).
factories_data:
  rules: {}
  reference_lists: {}
# Project used for resources.
project_id: ""
# SecOps Reference lists configuration: {LIST => {description, type}}, type
# CIDR, STRING or REGEX.
reference_lists_config: {}
# SecOps Detection rules configuration: {RULE => {enabled, alerting,
# archived, run_frequency}}, run_frequency LIVE, HOURLY or DAILY.
rules_config: {}
# SecOps Tenant configuration: {customer_id, region}.
tenant_config: null
