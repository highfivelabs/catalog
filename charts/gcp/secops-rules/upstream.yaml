# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set, or accepts only in part. Read by `task
# coverage`; `task coverage-verify` renders the chart to check that each one
# is refused. kind: gap (no Config Connector kind or field), alpha (only a
# v1alpha1 kind), not-ported (Config Connector has it, the chart does not
# map it yet) or by-design (Bundt replaces it). partial: the variable is
# accepted, the reason says what is refused.
refused:
  - variable: factories_config
    kind: by-design
    reason: "accepted; a chart cannot read the caller's files: rules and reference_lists (YAML paths) are refused, their content goes in rules_config and reference_lists_config, and the .yaral and .txt files the _defs folders hold go in factories_data"
    partial: true
    fields: [rules, reference_lists]
  - variable: rules_config
    kind: alpha
    reason: "accepted; each rule's deployment is config-connector-extensions' v1alpha1 ChronicleRuleDeployment: set allow_alpha: true"
    partial: true
    needs_allow_alpha: true
