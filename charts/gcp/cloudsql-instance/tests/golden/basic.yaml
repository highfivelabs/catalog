---
# Source: cloudsql-instance/templates/instance.yaml
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: basic
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: cloudsql-instance
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "instance"
    cnrm.cloud.google.com/project-id: "myproject"
spec:
  resourceID: db
  region: "europe-west8"
  databaseVersion: "POSTGRES_13"
  settings:
    tier: "db-g1-small"
    edition: ENTERPRISE
    deletionProtectionEnabled: true
    diskAutoresize: true
    diskAutoresizeLimit: 0
    diskType: PD_SSD
    availabilityType: ZONAL
    activationPolicy: ALWAYS
    ipConfiguration:
      ipv4Enabled: false
      privateNetworkRef:
        external: "projects/myproject/global/networks/my-network"
      enablePrivatePathForGoogleCloudServices: false
