apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLUser
metadata:
  name: postgres-iam-user-app-myproject-iam-gserviceaccount-co-65bb079a
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "postgres-iam"
    app.kubernetes.io/name: cloudsql-instance
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "user:app@myproject.iam.gserviceaccount.com"
    cnrm.cloud.google.com/project-id: "myproject"
spec:
  resourceID: "app@myproject.iam"
  instanceRef:
    name: postgres-iam
  type: CLOUD_IAM_SERVICE_ACCOUNT
