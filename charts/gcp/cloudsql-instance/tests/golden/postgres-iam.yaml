  resourceID: "app"
  instanceRef:
    name: postgres-iam
---
# Source: cloudsql-instance/templates/instance.yaml
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: postgres-iam
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "postgres-iam"
    app.kubernetes.io/name: cloudsql-instance
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "instance"
    cnrm.cloud.google.com/project-id: "myproject"
spec:
  resourceID: app
  region: "europe-west1"
  databaseVersion: "POSTGRES_16"
  settings:
    tier: "db-custom-2-7680"
    edition: ENTERPRISE
    deletionProtectionEnabled: true
    diskAutoresize: true
    diskAutoresizeLimit: 0
    diskType: PD_SSD
    availabilityType: ZONAL
    activationPolicy: ALWAYS
    ipConfiguration:
      ipv4Enabled: false
      enablePrivatePathForGoogleCloudServices: false
      pscConfig:
        - pscEnabled: true
          allowedConsumerProjects: ["consumer-project"]
    backupConfiguration:
      enabled: false
      startTime: "23:00"
      pointInTimeRecoveryEnabled: false
      transactionLogRetentionDays: 7
    passwordValidationPolicy:
      enablePasswordPolicy: true
      minLength: 10
      passwordChangeInterval: "3600s"
