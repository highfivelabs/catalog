---
# Source: cloudsql-instance/templates/databases.yaml
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLDatabase
metadata:
  name: mock-db-app
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: cloudsql-instance
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "database:app"
    cnrm.cloud.google.com/project-id: "mock-project"
spec:
  resourceID: "app"
  instanceRef:
    name: mock
---
# Source: cloudsql-instance/templates/instance.yaml
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: mock
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: cloudsql-instance
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "instance"
    cnrm.cloud.google.com/project-id: "mock-project"
spec:
  resourceID: catalog-mock-sql
  region: "us-central1"
  databaseVersion: "POSTGRES_16"
  settings:
    tier: "db-custom-1-3840"
    edition: ENTERPRISE
    deletionProtectionEnabled: false
    diskAutoresize: true
    diskAutoresizeLimit: 0
    diskType: PD_SSD
    availabilityType: ZONAL
    activationPolicy: ALWAYS
    ipConfiguration:
      ipv4Enabled: true
      enablePrivatePathForGoogleCloudServices: false
