# Names in full, labels and tags, as Bundt passes them from a team's naming
# convention (docs/design.md, "Names, labels and tags"): the primary takes
# its name as given (no namePrefix); every object carries the labels and
# tags.
names:
  instance: shop-dev-euw1-orders
name: orders
project_id: myproject
region: europe-west1
database_version: POSTGRES_16
tier: db-custom-1-3840
network_config:
  connectivity:
    psa_config:
      private_network: projects/myproject/global/networks/shop
replicas:
  shop-dev-euw4-orders-ro: {region: europe-west4}
databases: [orders]
labels: {hfl.dev/team: shop, hfl.dev/environment: dev}
tags: {team: shop, environment: dev, cost-center: cc-1234}
