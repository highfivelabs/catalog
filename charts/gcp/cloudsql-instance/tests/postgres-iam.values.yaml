# PostgreSQL with backups off, Private Service Connect, a service account
# user (its name drops .gserviceaccount.com, as fabric's) and a password
# policy change interval.
project_id: myproject
name: app
region: europe-west1
database_version: POSTGRES_16
tier: db-custom-2-7680
network_config:
  connectivity:
    psc_config:
      allowed_consumer_projects: [consumer-project]
backup_configuration:
  enabled: false
password_validation_policy:
  change_interval: 3600
  min_length: 10
users:
  app@myproject.iam.gserviceaccount.com: {type: CLOUD_IAM_SERVICE_ACCOUNT}
  dev@example.com: {type: CLOUD_IAM_USER}
databases: [app]
