# The network and DNS policy names in full, labels and tags (docs/design.md,
# "Names, labels and tags"). A route without a name of its own takes its
# name from the network's. Subnets name themselves in their entries.
names: {network: shop-dev-vpc, dnsPolicy: shop-dev-dns}
name: vpc
project_id: my-project
labels: {hfl.dev/team: shop}
tags: {team: shop, environment: dev}
subnets:
  - ip_cidr_range: 10.0.0.0/24
    name: shop-dev-euw1-apps
    region: europe-west1
create_googleapis_routes: {directpath: false, private: true, restricted: false}
dns_policy: {inbound: true}
