# fabric README, "Simple VPC"
project_id: my-project
name: my-network
subnets:
  - ip_cidr_range: 10.0.0.0/24
    name: production
    region: europe-west1
    secondary_ip_ranges:
      pods: {ip_cidr_range: 172.16.0.0/20}
      services: {ip_cidr_range: 192.168.0.0/24}
  - ip_cidr_range: 10.0.16.0/24
    name: production
    region: europe-west2
