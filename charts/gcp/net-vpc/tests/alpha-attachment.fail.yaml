# Network attachments no longer need allow_alpha (config-connector-
# extensions' ComputeNetworkAttachment is v1beta1; attachment.values.yaml
# renders one without it): this case now checks that the subnet is one of
# the chart's.
name: my-network
project_id: p
subnets: [{name: s, region: europe-west1, ip_cidr_range: 10.0.0.0/24}]
network_attachments: {a: {subnet: europe-west1/t}}
