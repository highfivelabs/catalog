# A PSC network attachment without allow_alpha: config-connector-extensions'
# ComputeNetworkAttachment (v1beta1), with a description and manual
# acceptance, on a subnet of this chart.
name: my-network
project_id: p
subnets: [{name: s, region: europe-west1, ip_cidr_range: 10.0.0.0/24}]
network_attachments:
  a:
    subnet: europe-west1/s
    description: Consumers of the shared services.
    producer_accept_lists: ["producer-project"]
    producer_reject_lists: ["123456789012"]
