# A subnet's iam_bindings stay an IAMPartialPolicy: IAMBinding does not
# take a ComputeSubnetwork.
project_id: my-project
name: vpc
subnets:
  - ip_cidr_range: 10.0.0.0/24
    name: apps
    region: europe-west1
    iam_bindings:
      users:
        role: roles/compute.networkUser
        members: ["group:devs@example.com"]
