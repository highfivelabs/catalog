#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every object this
# chart renders carries the namePrefix in its cloud-side name
# (spec.resourceID), except the kinds listed here, each with the reason it
# cannot collide with another Instance's. A kind added to the chart and not
# listed fails `task test` until it is prefixed or listed.
exempt:
  IAMPartialPolicy: "binds members on another object; it has no name of its own"
  IAMPolicyMember: "binds one member on another object; it has no name of its own"
  ComputeSharedVPCHostProject: "turns the project into a Shared VPC host; it has no name of its own"
  ComputeSharedVPCServiceProject: "attaches a project to the host; it has no name of its own"
  ServiceNetworkingConnection: "keyed by the service producer, per network"
  ComputeNetworkPeeringRoutesConfig: "named after the producer's peering, per network"
