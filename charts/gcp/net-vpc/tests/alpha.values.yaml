# Features that need alpha Config Connector kinds, with allow_alpha: PSC
# network attachments, PSA route exchange and peered DNS domains.
project_id: my-project
name: my-network
allow_alpha: true
subnets:
  - {name: psc-clients, region: europe-west1, ip_cidr_range: 10.0.0.0/24}
network_attachments:
  my-attachment:
    subnet: europe-west1/psc-clients
    automatic_connection: true
    producer_accept_lists: [producer-project]
psa_configs:
  - ranges: {myrange: 10.0.4.0/22}
    export_routes: true
    import_routes: true
    peered_domains: [internal.example.com.]
