# Every kind of subnet, the factory, routes, Shared VPC, DNS policy and PSA.
name: my-vpc
project_id: mock-project
subnets:
  - name: production
    region: europe-west1
    ip_cidr_range: 10.0.0.0/24
    secondary_ip_ranges:
      pods: {ip_cidr_range: 172.16.0.0/20}
      services: {ip_cidr_range: 192.168.0.0/24}
    flow_logs_config: {flow_sampling: 0.5, aggregation_interval: INTERVAL_10_MIN}
    iam:
      roles/compute.networkUser: ["group:net@example.com"]
  - name: staging
    region: europe-west2
    ip_cidr_range: 10.0.16.0/24
    description: ""
    enable_private_access: false
subnets_proxy_only:
  - {name: proxy, region: europe-west1, ip_cidr_range: 10.0.1.0/24, active: true}
subnets_psc:
  - {name: psc, region: europe-west1, ip_cidr_range: 10.0.3.0/24}
factories_data:
  subnets:
    factory-subnet:
      region: europe-west4
      ip_cidr_range: 10.128.0.0/24
      description: Sample description
      secondary_ip_ranges:
        secondary-range-a: {ip_cidr_range: 192.168.128.0/24}
routes:
  next-hop:
    dest_range: 192.168.128.0/24
    next_hop_type: ip
    next_hop: 10.0.0.5
shared_vpc_host: true
shared_vpc_service_projects: [service-project-1]
dns_policy: {inbound: true, logging: false, outbound: {private_ns: ["10.0.0.1"], public_ns: ["8.8.8.8"]}}
psa_configs:
  - ranges: {myrange: 10.0.4.0/22}
subnets_private_nat:
  - {name: pnat, region: europe-west1, ip_cidr_range: 192.168.15.0/24}
peering_config:
  peer_vpc_self_link: projects/other/global/networks/hub
  export_routes: true
  import_routes: true
firewall_policy_associations:
  global: {policy_id: projects/my-project/global/firewallPolicies/policy}
mtu: 1500
