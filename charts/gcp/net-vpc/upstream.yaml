# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set, or accepts only in part. Read by `task
# coverage`; `task coverage-verify` renders the chart to check that each one
# is refused. kind: gap (no Config Connector kind or field), alpha (only a
# v1alpha1 kind), not-ported (Config Connector has it, the chart does not
# map it yet) or by-design (Bundt replaces it). partial: the variable is
# accepted, the reason says what is refused.
refused:
  - variable: bgp_config
    kind: gap
    reason: "ComputeNetwork has no BGP path selection fields"
  - variable: context
    kind: by-design
    reason: "Bundt replaces fabric's $context lookups with ${...} expressions and valueFrom in the component's inputs"
  - variable: factories_config
    kind: by-design
    reason: "a chart cannot read the caller's files: accepted and ignored; the files' contents go under factories_data.subnets"
    partial: true
  - variable: firewall_policy_associations
    kind: gap
    reason: "only the global association; Config Connector has no regional network firewall policy association (gap 6)"
    partial: true
  - variable: internal_ranges
    kind: alpha
    reason: "NetworkConnectivityInternalRange is alpha in Config Connector v1.160.0 and not ported yet, even with allow_alpha"
  - variable: policy_based_routes
    kind: alpha
    reason: "NetworkConnectivityPolicyBasedRoute is alpha in v1.160.0 and not ported yet, even with allow_alpha"
  - variable: psa_configs
    kind: alpha
    reason: "export_routes, import_routes (ComputeNetworkPeeringRoutesConfig) and peered_domains (ServiceNetworkingPeeredDNSDomain) are alpha: need allow_alpha: true; routes only for servicenetworking.googleapis.com; deletion_policy only ABANDON"
    partial: true
    alpha_fields: [export_routes, import_routes, peered_domains]
  - variable: service_connection_policies
    kind: alpha
    reason: "NetworkConnectivityServiceConnectionPolicy is alpha in v1.160.0 and not ported yet, even with allow_alpha"
  - variable: subnets
    kind: gap
    reason: "ip_collection and allow_subnet_cidr_routes_overlap (ComputeSubnetwork has no such fields) and reserved_internal_range (internal ranges are alpha) are refused"
    partial: true
    fields: [ip_collection, allow_subnet_cidr_routes_overlap, reserved_internal_range]
