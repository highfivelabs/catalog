{{- $abandon := include "kcc.abandon" . }}
{{- $producers := list }}
{{- range $c := .Values.psa_configs }}
{{- $producer := $c.service_producer | default "servicenetworking.googleapis.com" }}
{{- if has $producer $producers }}
{{- fail "net-vpc: at most one psa_configs entry is possible for each service producer" }}
{{- end }}
{{- $producers = append $producers $producer }}
{{- include "kcc.alpha" (list $ (printf "psa_configs %s export_routes or import_routes" $producer) (or $c.export_routes $c.import_routes) "ComputeNetworkPeeringRoutesConfig") }}
{{- include "kcc.alpha" (list $ (printf "psa_configs %s peered_domains" $producer) $c.peered_domains "ServiceNetworkingPeeredDNSDomain") }}
{{- if and $c.deletion_policy (ne $c.deletion_policy "ABANDON") }}
{{- fail "net-vpc: psa_configs deletion_policy supports only ABANDON" }}
{{- end }}
{{- $prefix := printf "%s-" (replace "." "-" $producer) }}
{{- if not (kindIs "invalid" $c.range_prefix) }}{{ $prefix = (eq $c.range_prefix "") | ternary "" (printf "%s-" $c.range_prefix) }}{{ end }}
{{- $ranges := list }}
{{- range $rname, $cidr := $c.ranges }}
{{- $addr := include "kcc.cloudName" (list $ "private service access range" (printf "%s%s" $prefix $rname) 63 "letter") }}
{{- $ranges = append $ranges $addr }}
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeAddress
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "psa" $addr)) "id" (printf "psa_range:%s" $addr) "project" $.Values.project_id "labels" $c.labels "abandon" $abandon) | nindent 2 }}
spec:
  resourceID: {{ $addr }}
  location: global
  purpose: VPC_PEERING
  addressType: INTERNAL
  address: {{ splitList "/" $cidr | first | quote }}
  prefixLength: {{ splitList "/" $cidr | last | int64 }}
  networkRef:
    {{- include "netvpc.networkRef" $ | nindent 4 }}
{{- end }}
---
apiVersion: servicenetworking.cnrm.cloud.google.com/v1beta1
kind: ServiceNetworkingConnection
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "psa" $producer)) "id" (printf "psa:%s" $producer) "project" $.Values.project_id "abandon" (or $abandon (eq ($c.deletion_policy | default "") "ABANDON"))) | nindent 2 }}
spec:
  service: {{ $producer }}
  networkRef:
    {{- include "netvpc.networkRef" $ | nindent 4 }}
  reservedPeeringRanges:
    {{- range $addr := $ranges }}
    - name: {{ include "kcc.name" (list $.Release.Name "psa" $addr) }}
    {{- end }}
{{- /* Alpha: the peering's route exchange (ComputeNetworkPeeringRoutesConfig). */}}
{{- if or $c.export_routes $c.import_routes }}
{{- if ne $producer "servicenetworking.googleapis.com" }}
{{- fail (printf "net-vpc: psa_configs %s export_routes or import_routes: the peering's name is known only for servicenetworking.googleapis.com" $producer) }}
{{- end }}
---
apiVersion: compute.cnrm.cloud.google.com/v1alpha1
kind: ComputeNetworkPeeringRoutesConfig
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "psa-routes" $producer)) "id" (printf "psa_routes:%s" $producer) "project" $.Values.project_id "abandon" $abandon) | nindent 2 }}
spec:
  resourceID: {{ replace "." "-" $producer }}
  projectRef:
    external: {{ required "net-vpc: project_id is needed for PSA route exchange" $.Values.project_id | quote }}
  networkRef:
    {{- include "netvpc.networkRef" $ | nindent 4 }}
  exportCustomRoutes: {{ $c.export_routes | default false }}
  importCustomRoutes: {{ $c.import_routes | default false }}
{{- end }}
{{- /* Alpha: peered DNS domains (ServiceNetworkingPeeredDNSDomain). */}}
{{- range $d := ($c.peered_domains | default list) }}
---
apiVersion: servicenetworking.cnrm.cloud.google.com/v1alpha1
kind: ServiceNetworkingPeeredDNSDomain
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "psa-domain" $producer $d)) "id" (printf "psa_domain:%s:%s" $producer $d) "project" $.Values.project_id "abandon" $abandon) | nindent 2 }}
spec:
  resourceID: {{ include "kcc.cloudName" (list $ "peered DNS domain" (printf "%s%s" $prefix (trimSuffix "-" (replace "." "-" $d))) 63 "letter") }}
  dnsSuffix: {{ $d | quote }}
  networkRef:
    {{- include "netvpc.networkRef" $ | nindent 4 }}
{{- end }}
{{- end }}
