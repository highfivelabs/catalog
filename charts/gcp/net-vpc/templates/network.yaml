{{- $v := .Values }}
{{- include "kcc.unsupported" (list $ "bgp_config" $v.bgp_config "ComputeNetwork has no BGP path selection fields") }}
{{- include "kcc.unsupported" (list $ "internal_ranges" $v.internal_ranges "NetworkConnectivityInternalRange is alpha in v1.160.0 and not ported yet") }}
{{- include "kcc.unsupported" (list $ "policy_based_routes" $v.policy_based_routes "NetworkConnectivityPolicyBasedRoute is alpha in v1.160.0 and not ported yet") }}
{{- include "kcc.unsupported" (list $ "service_connection_policies" $v.service_connection_policies "NetworkConnectivityServiceConnectionPolicy is alpha in v1.160.0 and not ported yet") }}
{{- include "kcc.unsupported" (list $ "context" $v.context "use Bundt expressions (${...}) and valueFrom in the component's inputs instead") }}
{{- if kindIs "invalid" $v.vpc_reuse }}
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeNetwork
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" .Release.Name "id" "network" "project" $v.project_id "abandon" (include "kcc.abandon" .)) | nindent 2 }}
spec:
  resourceID: {{ $v.name }}
  {{- with $v.description }}
  description: {{ . | quote }}
  {{- end }}
  autoCreateSubnetworks: {{ $v.auto_create_subnetworks }}
  deleteDefaultRoutesOnCreate: {{ $v.delete_default_routes_on_create }}
  {{- if not (kindIs "invalid" $v.mtu) }}
  mtu: {{ $v.mtu | int64 }}
  {{- end }}
  routingMode: {{ $v.routing_mode }}
  networkFirewallPolicyEnforcementOrder: {{ $v.firewall_policy_enforcement_order }}
  {{- with $v.ipv6_config }}
  {{- if not (kindIs "invalid" .enable_ula_internal) }}
  enableUlaInternalIpv6: {{ .enable_ula_internal }}
  {{- end }}
  {{- with .internal_range }}
  internalIpv6Range: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
