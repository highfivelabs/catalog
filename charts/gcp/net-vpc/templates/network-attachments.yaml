kind: needs allow_alpha.
*/ -}}
{{- include "kcc.alpha" (list $ "network_attachments" .Values.network_attachments "ComputeNetworkAttachment") }}
{{- range $name, $a := .Values.network_attachments }}
{{- if and $a.description (ne $a.description "Terraform-managed.") }}
{{- fail (printf "net-vpc: network_attachments %s description is not supported: ComputeNetworkAttachment has no description field" $name) }}
{{- end }}
{{- $parts := splitList "/" $a.subnet }}
{{- $region := index $parts 0 }}
{{- $subnetName := index $parts 1 }}
---
apiVersion: compute.cnrm.cloud.google.com/v1alpha1
kind: ComputeNetworkAttachment
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "attachment" $name)) "id" (printf "network_attachment:%s" $name) "project" $.Values.project_id "abandon" (include "kcc.abandon" $)) | nindent 2 }}
spec:
  resourceID: {{ $name }}
  location: {{ $region }}
  projectRef:
    external: {{ required "net-vpc: project_id is needed for network attachments" $.Values.project_id | quote }}
  connectionPreference: {{ (kindIs "invalid" $a.automatic_connection | ternary false $a.automatic_connection) | ternary "ACCEPT_AUTOMATIC" "ACCEPT_MANUAL" }}
  subnetworkRefs:
    - name: {{ include "kcc.name" (list $.Release.Name "subnet" $region $subnetName) }}
  {{- with $a.producer_accept_lists }}
  producerAcceptLists:
    {{- range $p := . }}
    - kind: Project
      external: {{ $p | quote }}
    {{- end }}
  {{- end }}
  {{- with $a.producer_reject_lists }}
  producerRejectLists:
    {{- range $p := . }}
    - kind: Project
      external: {{ $p | quote }}
    {{- end }}
  {{- end }}
{{- end }}
