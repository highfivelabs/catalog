{{- /*
Copyright 2026 High Five Labs
SPDX-License-Identifier: Apache-2.0
Ported from cloud-foundation-fabric modules/net-vpc/subnets.tf (v60.0.0),
Copyright 2025 Google LLC, Apache-2.0: PSC network attachments.

google_compute_network_attachment.default: a ComputeNetworkAttachment of
config-connector-extensions (compute.gcp.hfl.dev/v1beta1; Config
Connector's own kind is v1alpha1), as net-address renders it, on a subnet
of this chart, named by its URL.
*/ -}}
{{- $subnets := include "netvpc.subnets" . | fromJson }}
{{- range $name, $a := .Values.network_attachments }}
{{- $s := index $subnets (toString $a.subnet) }}
{{- if not $s }}
{{- fail (printf "net-vpc: network_attachments %s subnet %q is not a subnet of this chart (REGION/NAME)" $name (toString $a.subnet)) }}
{{- end }}
---
apiVersion: compute.gcp.hfl.dev/v1beta1
kind: ComputeNetworkAttachment
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "attachment" $name)) "id" (printf "network_attachment:%s" $name) "project" $.Values.project_id "abandon" (include "kcc.abandon" $)) | nindent 2 }}
spec:
  resourceID: {{ include "kcc.cloudName" (list $ "network attachment" $name 63 "letter") | quote }}
  projectRef:
    external: {{ required "net-vpc: project_id is needed for network attachments" $.Values.project_id | quote }}
  region: {{ $s.region | quote }}
  description: {{ ternary "Terraform-managed." $a.description (kindIs "invalid" $a.description) | quote }}
  connectionPreference: {{ ternary "ACCEPT_AUTOMATIC" "ACCEPT_MANUAL" (eq $a.automatic_connection true) }}
  subnetworks:
    - {{ printf "projects/%s/regions/%s/subnetworks/%s" $.Values.project_id $s.region (include "kcc.cloudName" (list $ "subnet" $s.name 63 "letter")) | quote }}
  {{- with $a.producer_accept_lists }}
  producerAcceptLists:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $a.producer_reject_lists }}
  producerRejectLists:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
