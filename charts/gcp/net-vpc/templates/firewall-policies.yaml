{{- range $k, $a := .Values.firewall_policy_associations }}
{{- if ne $k "global" }}
{{- fail (printf "net-vpc: firewall_policy_associations %s is not supported: Config Connector v1.160.0 has no regional network firewall policy association (docs/gcp-inventory.md, \"Gaps\")" $k) }}
{{- end }}
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeNetworkFirewallPolicyAssociation
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "fw-policy" $k)) "id" (printf "firewall_policy_association:%s" $k) "project" $.Values.project_id "abandon" (include "kcc.abandon" $)) | nindent 2 }}
spec:
  resourceID: {{ if $a.name }}{{ include "kcc.cloudName" (list $ "firewall policy association" $a.name 63 "letter") }}{{ else }}{{ include "kcc.fit" (list $ "firewall policy association" (printf "%s-%s" (include "netvpc.networkName" $) $k) 63) }}{{ end }}
  projectRef:
    external: {{ required "net-vpc: project_id is needed for a firewall policy association" $.Values.project_id | quote }}
  attachmentTargetRef:
    {{- include "netvpc.networkRef" $ | nindent 4 }}
  firewallPolicyRef:
    external: {{ $a.policy_id | quote }}
{{- end }}
