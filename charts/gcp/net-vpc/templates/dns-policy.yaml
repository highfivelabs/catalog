{{- with .Values.dns_policy }}
apiVersion: dns.cnrm.cloud.google.com/v1beta1
kind: DNSPolicy
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (printf "%s-dns-policy" $.Release.Name) "id" "dns_policy" "project" $.Values.project_id "abandon" (include "kcc.abandon" $)) | nindent 2 }}
spec:
  resourceID: {{ include "kcc.resourceName" (list $ "dnsPolicy" "DNS policy" $.Values.name 63 "letter") }}
  {{- if not (kindIs "invalid" .inbound) }}
  enableInboundForwarding: {{ .inbound }}
  {{- end }}
  {{- if not (kindIs "invalid" .logging) }}
  enableLogging: {{ .logging }}
  {{- end }}
  networks:
    - networkRef:
        {{- include "netvpc.networkRef" $ | nindent 8 }}
  {{- with .outbound }}
  alternativeNameServerConfig:
    targetNameServers:
      {{- range $ns := (.private_ns | default list) }}
      - ipv4Address: {{ $ns | quote }}
        forwardingPath: private
      {{- end }}
      {{- range $ns := (.public_ns | default list) }}
      - ipv4Address: {{ $ns | quote }}
      {{- end }}
  {{- end }}
{{- end }}
