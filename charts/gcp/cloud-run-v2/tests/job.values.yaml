# fabric's README, "Creating Cloud Run Jobs".
project_id: my-project
region: europe-west1
name: example-hello
type: JOB
containers:
  hello:
    image: us-docker.pkg.dev/cloudrun/container/hello
    env:
      VAR1: VALUE1
      VAR2: VALUE2
iam:
  roles/run.invoker: ["group:team@example.com"]
deletion_protection: false
