# fabric's README, "Direct VPC Egress" (its service_config.max_instance_count
# is not an attribute of the variable, so Terraform drops it; left out).
project_id: my-project
region: europe-west1
name: example-hello
containers:
  hello:
    image: us-docker.pkg.dev/cloudrun/container/hello
revision:
  vpc_access:
    egress: ALL_TRAFFIC
    subnet: projects/my-project/regions/europe-west1/subnetworks/default
    tags: [tag1, tag2, tag3]
service_config:
  gen2_execution_environment: true
deletion_protection: false
