# fabric's README, "VPC Access Connector", an existing connector. The README
# sets service_config.vpc_access, which is not an attribute of the variable
# (Terraform drops it); the variable's place is revision.vpc_access.
project_id: my-project
region: europe-west4
name: example-hello
containers:
  hello:
    image: us-docker.pkg.dev/cloudrun/container/hello
revision:
  vpc_access:
    connector: projects/my-project/locations/europe-west4/connectors/connector
    egress: ALL_TRAFFIC
deletion_protection: false
