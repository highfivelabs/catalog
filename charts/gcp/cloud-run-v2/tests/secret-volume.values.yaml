# fabric's README, "Mounting secrets as volumes".
project_id: my-project
region: europe-west1
name: example-hello
containers:
  hello:
    image: us-docker.pkg.dev/cloudrun/container/hello
    volume_mounts:
      credentials: /credentials
volumes:
  credentials:
    secret:
      name: projects/my-project/secrets/credentials
      path: my-secret
      version: latest
deletion_protection: false
