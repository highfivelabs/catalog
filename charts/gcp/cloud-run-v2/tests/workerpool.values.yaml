# fabric's README, "Adding GPUs", the worker pool, without
# gpu_zonal_redundancy_disabled (refused: no kind has it); a RunWorkerPool
# is v1alpha1, so allow_alpha.
allow_alpha: true
project_id: my-project
region: europe-west1
name: worker
type: WORKERPOOL
revision:
  node_selector:
    accelerator: nvidia-l4
containers:
  hello:
    image: us-docker.pkg.dev/cloudrun/container/hello
    resources:
      limits:
        cpu: 4000m
        memory: 16Gi
        nvidia.com/gpu: "1"
iam:
  roles/run.developer: ["group:team@example.com"]
deletion_protection: false
