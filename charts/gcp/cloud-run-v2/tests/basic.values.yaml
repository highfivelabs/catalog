# fabric's README, "IAM and environment variables": a service with plain
# and Secret Manager environment variables and a public invoker role.
project_id: my-project
region: europe-west1
name: example-hello
containers:
  hello:
    image: us-docker.pkg.dev/cloudrun/container/hello
    env:
      VAR1: VALUE1
      VAR2: VALUE2
    env_from_key:
      SECRET1:
        secret: credentials
        version: "1"
iam:
  roles/run.invoker: [allUsers]
deletion_protection: false
