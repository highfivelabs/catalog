# fabric's README, "Eventarc triggers", a Cloud Storage bucket.
project_id: my-project
region: europe-west1
name: example-hello
containers:
  hello:
    image: us-docker.pkg.dev/cloudrun/container/hello
service_config:
  eventarc_triggers:
    storage:
      bucket-upload:
        bucket: my-bucket
        path: /webhook
    service_account_email: trigger@my-project.iam.gserviceaccount.com
deletion_protection: false
