---
# Source: cloud-run-v2/templates/serviceaccount.yaml
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMServiceAccount
metadata:
  name: cloudsql-sa
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "cloudsql"
    app.kubernetes.io/name: cloud-run-v2
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "service_account"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "example-hello"
  displayName: "example-hello"
---
# Source: cloud-run-v2/templates/main.yaml
apiVersion: run.cnrm.cloud.google.com/v1beta1
kind: RunService
metadata:
  name: cloudsql
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "cloudsql"
    app.kubernetes.io/name: cloud-run-v2
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "resource"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  projectRef:
    external: "my-project"
  location: "europe-west1"
  resourceID: "example-hello"
  template:
    executionEnvironment: EXECUTION_ENVIRONMENT_GEN1
    serviceAccountRef:
      external: "example-hello@my-project.iam.gserviceaccount.com"
    containers:
      - name: "hello"
        image: "us-docker.pkg.dev/cloudrun/container/hello"
        volumeMounts:
          - name: "cloudsql"
            mountPath: "/cloudsql"
    volumes:
      - name: "cloudsql"
        cloudSqlInstance:
          instances:
            - external: "my-project:europe-west1:db"
