    executionEnvironment: EXECUTION_ENVIRONMENT_GEN1
    scaling:
      maxInstanceCount: 2
    serviceAccountRef:
      external: "cat-mock-run@mock-project.iam.gserviceaccount.com"
    containers:
      - name: "hello"
        image: "us-docker.pkg.dev/cloudrun/container/hello"
        env:
          - name: "GREETING"
            value: "hello"
        resources:
          limits:
            "cpu": "1"
            "memory": "512Mi"
