# Source: cloud-run-v2/templates/main.yaml
apiVersion: run.cnrm.cloud.google.com/v1alpha1
kind: RunWorkerPool
metadata:
  name: workerpool
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "workerpool"
    app.kubernetes.io/name: cloud-run-v2
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "resource"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  projectRef:
    external: "my-project"
  location: "europe-west1"
  resourceID: "worker"
  template:
    nodeSelector:
      accelerator: "nvidia-l4"
    serviceAccountRef:
      external: "worker@my-project.iam.gserviceaccount.com"
    containers:
      - name: "hello"
        image: "us-docker.pkg.dev/cloudrun/container/hello"
        resources:
          limits:
            "cpu": "4000m"
            "memory": "16Gi"
            "nvidia.com/gpu": "1"
