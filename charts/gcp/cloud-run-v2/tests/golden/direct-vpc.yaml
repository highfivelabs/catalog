---
# Source: cloud-run-v2/templates/main.yaml
apiVersion: run.cnrm.cloud.google.com/v1beta1
kind: RunService
metadata:
  name: direct-vpc
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "direct-vpc"
    app.kubernetes.io/name: cloud-run-v2
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "resource"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  projectRef:
    external: "my-project"
  location: "europe-west1"
  resourceID: "example-hello"
  template:
    executionEnvironment: EXECUTION_ENVIRONMENT_GEN2
    vpcAccess:
      egress: "ALL_TRAFFIC"
      networkInterfaces:
        - {"subnetworkRef":{"external":"projects/my-project/regions/europe-west1/subnetworks/default"},"tags":["tag1","tag2","tag3"]}
    serviceAccountRef:
      external: "example-hello@my-project.iam.gserviceaccount.com"
    containers:
      - name: "hello"
        image: "us-docker.pkg.dev/cloudrun/container/hello"
