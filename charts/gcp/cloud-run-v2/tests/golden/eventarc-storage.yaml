---
# Source: cloud-run-v2/templates/eventarc.yaml
apiVersion: eventarc.cnrm.cloud.google.com/v1beta1
kind: EventarcTrigger
metadata:
  name: eventarc-storage-storage-bucket-upload
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "eventarc-storage"
    app.kubernetes.io/name: cloud-run-v2
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "trigger:storage:bucket-upload"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  projectRef:
    external: "my-project"
  location: "europe-west1"
  resourceID: "storage-bucket-upload"
  matchingCriteria:
    - attribute: type
      value: google.cloud.storage.object.v1.finalized
    - attribute: bucket
      value: "my-bucket"
  destination:
    cloudRunService:
      serviceRef:
        external: "projects/my-project/locations/europe-west1/services/example-hello"
      region: "europe-west1"
      path: "/webhook"
  serviceAccountRef:
    external: "trigger@my-project.iam.gserviceaccount.com"
---
