  resourceID: "example-hello"
  displayName: "example-hello"
---
# Source: cloud-run-v2/templates/main.yaml
apiVersion: run.cnrm.cloud.google.com/v1beta1
kind: RunService
metadata:
  name: otel-sidecar
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "otel-sidecar"
    app.kubernetes.io/name: cloud-run-v2
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "resource"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  projectRef:
    external: "my-project"
  location: "europe-west1"
  resourceID: "example-hello"
  template:
    executionEnvironment: EXECUTION_ENVIRONMENT_GEN1
    serviceAccountRef:
      external: "example-hello@my-project.iam.gserviceaccount.com"
    containers:
      - name: "collector"
        image: "us-docker.pkg.dev/cloud-ops-agents-artifacts/google-cloud-opentelemetry-collector/otelcol-google:0.122.1"
        volumeMounts:
          - name: "otel-config"
            mountPath: "/etc/otelcol-google/"
        livenessProbe:
          timeoutSeconds: 30
          periodSeconds: 30
          httpGet:
            path: "/"
            port: 13133
        startupProbe:
          timeoutSeconds: 30
          periodSeconds: 30
          httpGet:
            path: "/"
            port: 13133
      - name: "hello"
        image: "us-docker.pkg.dev/cloudrun/container/hello"
        dependsOn: ["collector"]
        ports:
          - {"containerPort":3000}
    volumes:
      - name: "otel-config"
        secret:
          secretRef:
            external: "otel-config"
          items:
            - path: "config.yaml"
              versionRef:
                external: "1"
