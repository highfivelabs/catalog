---
# Source: cloud-run-v2/templates/main.yaml
apiVersion: run.cnrm.cloud.google.com/v1beta1
kind: RunService
metadata:
  name: secret-volume
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "secret-volume"
    app.kubernetes.io/name: cloud-run-v2
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "resource"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  projectRef:
    external: "my-project"
  location: "europe-west1"
  resourceID: "example-hello"
  template:
    executionEnvironment: EXECUTION_ENVIRONMENT_GEN1
    serviceAccountRef:
      external: "example-hello@my-project.iam.gserviceaccount.com"
    containers:
      - name: "hello"
        image: "us-docker.pkg.dev/cloudrun/container/hello"
        volumeMounts:
          - name: "credentials"
            mountPath: "/credentials"
    volumes:
      - name: "credentials"
        secret:
          secretRef:
            external: "projects/my-project/secrets/credentials"
          items:
            - path: "my-secret"
              versionRef:
                external: "latest"
