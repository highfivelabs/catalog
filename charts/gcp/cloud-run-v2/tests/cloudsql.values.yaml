# fabric's README, "Connecting to Cloud SQL database".
project_id: my-project
region: europe-west1
name: example-hello
containers:
  hello:
    image: us-docker.pkg.dev/cloudrun/container/hello
    volume_mounts:
      cloudsql: /cloudsql
volumes:
  cloudsql:
    cloud_sql_instances: ["my-project:europe-west1:db"]
deletion_protection: false
