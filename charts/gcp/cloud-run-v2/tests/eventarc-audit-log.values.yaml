# fabric's README, "Eventarc triggers", audit logs, with an external
# service account.
project_id: my-project
region: europe-west1
name: example-hello
containers:
  hello:
    image: us-docker.pkg.dev/cloudrun/container/hello
service_config:
  eventarc_triggers:
    audit_log:
      setiampolicy:
        method: SetIamPolicy
        service: cloudresourcemanager.googleapis.com
    service_account_email: trigger@my-project.iam.gserviceaccount.com
iam:
  roles/run.invoker: ["serviceAccount:trigger@my-project.iam.gserviceaccount.com"]
deletion_protection: false
