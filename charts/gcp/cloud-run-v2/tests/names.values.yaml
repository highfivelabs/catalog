# Names in full, labels and tags, as Bundt passes them from a team's naming
# convention (docs/design.md, "Names, labels and tags").
project_id: my-project
region: europe-west1
name: hello
names: {service: shop-dev-hello, serviceAccount: shop-dev-hello-run, vpcConnector: shop-dev-hello}
labels: {hfl.dev/team: shop, hfl.dev/environment: dev}
tags: {team: shop, environment: dev}
containers:
  hello:
    image: us-docker.pkg.dev/cloudrun/container/hello
vpc_connector_create:
  ip_cidr_range: 10.10.10.0/28
  network: vpc
service_config:
  eventarc_triggers:
    pubsub:
      orders: orders
