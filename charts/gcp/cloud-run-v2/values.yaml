# Values mirror the Terraform variables of fabric's cloud-run-v2 module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types and the module's validations.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.service, names.job or names.workerPool (the one of the type),
# names.serviceAccount and names.vpcConnector: those names in full. A name
# set here takes no prefix; unset, each is fabric's (name, the account's
# name or name, the connector's name or name).
names: {}
# An optional convenience: "<namePrefix>-" in front of every derived name
# (the resource, its service account, connector and Eventarc triggers).
# Empty (the default) changes nothing.
namePrefix: ""
# fabric's own variable (the resource's labels), with the catalog's meaning:
# Kubernetes labels on every object; an unprefixed key also becomes a Google
# Cloud label.
labels: {}
# Cloud labels on every resource: on Google Cloud, labels.
tags: {}
# Accept the v1alpha1 kind RunWorkerPool (type: WORKERPOOL).
allow_alpha: false
# DELETE (the default) or ABANDON: what deleting an object does to its
# cloud resource. Not a fabric variable (docs/design.md, "Deletion").
deletion_policy: DELETE

# Binary Authorization configuration: {breakglass_justification, policy,
# use_default}. policy is refused.
binary_authorization: null
# Containers in name => attributes format.
containers: {}
# Context-specific interpolations. Refused when set: Bundt expressions
# (${...}) and valueFrom replace fabric's $context lookups.
context: {}
# Deletion protection setting for this Cloud Run service. Accepted and not
# rendered: Config Connector has no such guard (README.md, "Differences").
deletion_protection: null
# The full resource name of the Cloud KMS CryptoKey.
encryption_key: null
# IAM bindings for the Cloud Run resource in {ROLE => [MEMBERS]} format.
iam: {}
# Cloud Run Job specific configuration: {max_retries, task_count, timeout}.
job_config: {}
# The launch stage as defined by Google Cloud Platform Launch Stages.
launch_stage: null
# Whether the module controls the deployment of revisions. false is
# refused: Config Connector has no ignore_changes.
managed_revision: true
# Name used for the Cloud Run resource.
name: ""
# Project id used for all resources.
project_id: ""
# Region used for all resources.
region: ""
# Revision template configurations.
revision: {}
# Cloud Run service specific configuration options.
service_config: {}
# Service account configurations.
service_account_config:
  create: true
  display_name: null
  email: null
  name: null
  roles:
    - roles/logging.logWriter
    - roles/monitoring.metricWriter
# Tag bindings for this resource, in key => tag value id format.
tag_bindings: {}
# Type of Cloud Run resource to deploy: JOB, SERVICE or WORKERPOOL.
type: SERVICE
# Named volumes in containers in name => attributes format.
volumes: {}
# VPC connector network configuration. Must be provided if a new VPC
# connector is being created.
vpc_connector_create: null
# Cloud Run Worker Pool specific configuration.
workerpool_config: {}
