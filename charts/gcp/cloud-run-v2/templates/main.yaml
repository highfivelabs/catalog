google_cloud_run_v2_service.service (type SERVICE): one RunService.
google_cloud_run_v2_job.job (type JOB): one RunJob.
google_cloud_run_v2_worker_pool.default_managed (type WORKERPOOL): one
RunWorkerPool, which is v1alpha1 (allow_alpha).
The unmanaged variants (managed_revision: false) are refused: Config
Connector has no ignore_changes.
google_tags_location_tag_binding.binding: one TagsLocationTagBinding per
tag binding on the service or job, in its region.
References to the service account, connector, key, secrets and networks
are by their full names, so the resource can be deleted after those
