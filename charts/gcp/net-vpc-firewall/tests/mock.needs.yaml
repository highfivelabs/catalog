# What tests/mock.values.yaml needs in the fake cloud: the network the
# rules apply to. hack/mock-apply.sh applies it first, waits for it, and
# deletes it after the chart's objects. Not part of the chart.
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeNetwork
metadata:
  name: catalog-mock-fw-net
  annotations:
    cnrm.cloud.google.com/project-id: mock-project
spec:
  autoCreateSubnetworks: false
