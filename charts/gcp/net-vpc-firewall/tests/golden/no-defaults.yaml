---
# Source: net-vpc-firewall/templates/rules.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeFirewall
metadata:
  name: no-defaults-rule-deny-all
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "no-defaults"
    app.kubernetes.io/name: net-vpc-firewall
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "rule:deny-all"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "deny-all"
  networkRef:
    external: "projects/my-project/global/networks/my-network"
  direction: "EGRESS"
  priority: 1000
  disabled: false
  destinationRanges: ["0.0.0.0/0"]
  deny:
    - protocol: "all"
