# Source: net-vpc-firewall/templates/default-rules.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeFirewall
metadata:
  name: names-default-http
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "names"
    app.kubernetes.io/name: net-vpc-firewall
    app.kubernetes.io/version: "0.1.0"
    environment: "dev"
    hfl.dev/environment: "dev"
    hfl.dev/team: "shop"
    team: "shop"
  annotations:
    hfl.dev/id: "default:http"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "shop-dev-allow-http"
  networkRef:
    external: "projects/my-project/global/networks/shop-dev-vpc"
  description: "Allow http to machines with matching tags."
  direction: INGRESS
  sourceRanges: ["35.191.0.0/16","130.211.0.0/22","209.85.152.0/22","209.85.204.0/22"]
  targetTags: ["http-server"]
  allow:
    - protocol: "tcp"
      ports: ["80"]
