# Source: net-vpc-firewall/templates/default-rules.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeFirewall
metadata:
  name: mock-default-ssh
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: net-vpc-firewall
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "default:ssh"
    cnrm.cloud.google.com/project-id: "mock-project"
spec:
  resourceID: "catalog-mock-fw-net-ingress-tag-ssh"
  networkRef:
    external: "projects/mock-project/global/networks/catalog-mock-fw-net"
  description: "Allow SSH to machines with matching tags."
  direction: INGRESS
  sourceRanges: ["35.235.240.0/20"]
  targetTags: ["ssh"]
  allow:
    - protocol: "tcp"
      ports: ["22"]
