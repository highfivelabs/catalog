# Names in full, labels and tags, as Bundt passes them from a team's naming
# convention (docs/design.md, "Names, labels and tags"): the default rules
# take the names given; every object carries the labels and tags.
project_id: my-project
network: shop-dev-vpc
names: {http: shop-dev-allow-http, https: shop-dev-allow-https, ssh: shop-dev-allow-ssh}
labels: {hfl.dev/team: shop, hfl.dev/environment: dev}
tags: {team: shop, environment: dev}
default_rules_config: {admin_ranges: [10.0.0.0/8]}
