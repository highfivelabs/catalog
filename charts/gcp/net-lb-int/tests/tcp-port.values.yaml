# A TCP check on a fixed port: Helm merges it into the default (tcp on the
# serving port), and the chart drops the default's port_specification, as
# Terraform's replaced default would (the API refuses a port with
# USE_SERVING_PORT; seen live with net-lb-ext on 2026-11-12).
project_id: my-project
region: europe-west1
name: ilb-tcp
vpc_config:
  network: projects/my-project/global/networks/my-network
  subnetwork: projects/my-project/regions/europe-west1/subnetworks/gce
health_check_config:
  tcp: {port: 80}
