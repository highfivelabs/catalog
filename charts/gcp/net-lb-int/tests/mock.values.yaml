# Applied to the fake cloud by hack/mock-apply.sh, on the network and
# subnets in tests/mock.needs.yaml: an empty group the chart makes, the
# default TCP health check, one forwarding rule and its PSC service
# attachment.
project_id: mock-project
region: us-central1
name: catalog-mock-ilb
vpc_config:
  network: projects/mock-project/global/networks/catalog-mock-ilb-net
  subnetwork: projects/mock-project/regions/us-central1/subnetworks/catalog-mock-ilb-sn
group_configs:
  a: {zone: us-central1-a, named_ports: {http: 80}}
backends:
  - group: a
forwarding_rules_config:
  "": {ports: ["80"]}
service_attachments:
  "":
    nat_subnets: [projects/mock-project/regions/us-central1/subnetworks/catalog-mock-ilb-psc]
