# Source: net-lb-int/templates/main.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeServiceAttachment
metadata:
  name: full-psc
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: net-lb-int
    app.kubernetes.io/version: "0.1.0"
    env: "test"
  annotations:
    hfl.dev/id: "service_attachment:"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: "ilb-full"
  location: "europe-west1"
  description: "PSC for ilb-full"
  projectRef:
    external: "projects/my-project"
  targetServiceRef:
    name: full-fr
  natSubnets:
    - external: "projects/my-project/regions/europe-west1/subnetworks/psc"
  connectionPreference: ACCEPT_AUTOMATIC
  consumerAcceptLists:
    - projectRef:
        external: "projects/consumer-project"
      connectionLimit: 10
  consumerRejectLists:
    - external: "projects/bad-project"
  enableProxyProtocol: true
