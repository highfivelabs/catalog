    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: "ilb-full"
  location: "europe-west1"
  description: "the main rule"
  ipAddress:
    ip: "10.0.0.10"
  ipProtocol: "TCP"
  backendServiceRef:
    name: full
  loadBalancingScheme: INTERNAL
  networkRef:
    external: "projects/my-project/global/networks/my-network"
  subnetworkRef:
    external: "projects/my-project/regions/europe-west1/subnetworks/gce"
  allPorts: true
  allowGlobalAccess: false
  serviceLabel: "svc"
