---
# Source: net-lb-int/templates/main.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeBackendService
metadata:
  name: full
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: net-lb-int
    app.kubernetes.io/version: "0.1.0"
    env: "test"
  annotations:
    hfl.dev/id: "backend_service"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: "custom-bs"
  location: "europe-west1"
  description: "the backend"
  loadBalancingScheme: INTERNAL
  protocol: "TCP"
  networkRef:
    external: "projects/my-project/global/networks/my-network"
  healthChecks:
    - healthCheckRef:
        name: full
  connectionDrainingTimeoutSec: 10
  sessionAffinity: "CLIENT_IP"
  timeoutSec: 30
  backend:
    - balancingMode: CONNECTION
      description: "Terraform managed."
      failover: false
      group:
        instanceGroupRef:
          name: full-group-my-group
    - balancingMode: CONNECTION
      description: "failover group"
      failover: true
      group:
        instanceGroupRef:
          external: "projects/my-project/zones/europe-west1-c/instanceGroups/other"
  connectionTrackingPolicy:
    connectionPersistenceOnUnhealthyBackends: "NEVER_PERSIST"
    idleTimeoutSec: 600
    trackingMode: PER_SESSION
  failoverPolicy:
    disableConnectionDrainOnFailover: true
    dropTrafficIfUnhealthy: true
    failoverRatio: 0.5
  logConfig:
    enable: true
    sampleRate: 0.5
  subsetting:
    policy: CONSISTENT_HASH_SUBSETTING
---
