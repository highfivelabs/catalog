# Source: alloydb/templates/main.yaml
apiVersion: alloydb.cnrm.cloud.google.com/v1beta1
kind: AlloyDBInstance
metadata:
  name: full
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: alloydb
    app.kubernetes.io/version: "0.1.0"
    team: "orders"
  annotations:
    hfl.dev/id: "instance"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: prod-db
  clusterRef:
    external: "projects/myproject/locations/europe-west8/clusters/prod-db"
  instanceType: PRIMARY
  availabilityType: "ZONAL"
  displayName: "Orders primary"
  gceZone: "europe-west8-b"
  annotations:
    "owner": "orders-team"
  databaseFlags:
    "alloydb.iam_authentication": "on"
    "max_connections": "200"
  connectionPoolConfig:
    enabled: true
    flags:
      "max_pool_size": "50"
      "pool_mode": "transaction"
  machineConfig:
    cpuCount: 4
  networkConfig:
    authorizedExternalNetworks:
      - cidrRange: "198.51.100.0/24"
      - cidrRange: "203.0.113.0/24"
    enablePublicIp: true
    enableOutboundPublicIp: true
  observabilityConfig:
    enabled: true
    preserveComments: false
    trackWaitEvents: true
    maxQueryStringLength: 10240
    recordApplicationTags: false
    queryPlansPerMinute: 20
    trackActiveQueries: true
    trackClientAddress: false
    assistiveExperiencesEnabled: false
