          minutes: 0
          seconds: 0
          nanos: 0
    quantityBasedRetention:
      count: 14
  continuousBackupConfig:
    enabled: true
    recoveryWindowDays: 7
    encryptionConfig:
      kmsKeyNameRef:
        external: "projects/myproject/locations/europe-west8/keyRings/ring/cryptoKeys/alloydb"
  encryptionConfig:
    kmsKeyNameRef:
      external: "projects/myproject/locations/europe-west8/keyRings/ring/cryptoKeys/alloydb"
