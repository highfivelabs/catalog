kind: AlloyDBCluster
metadata:
  name: names
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "names"
    app.kubernetes.io/name: alloydb
    app.kubernetes.io/version: "0.1.0"
    cost-center: "cc-1234"
    environment: "dev"
    hfl.dev/environment: "dev"
    hfl.dev/team: "shop"
    team: "shop"
  annotations:
    hfl.dev/id: "cluster"
spec:
  resourceID: shop-dev-euw8-orders
  projectRef:
    external: "myproject"
  location: "europe-west8"
  clusterType: PRIMARY
  databaseVersion: "POSTGRES_15"
  displayName: "shop-dev-euw8-orders"
  networkConfig:
    networkRef:
      external: "projects/myproject/global/networks/shop"
  automatedBackupPolicy:
    enabled: true
    backupWindow: "1800s"
    labels:
      cost-center: "cc-1234"
      environment: "dev"
      team: "shop"
    weeklySchedule:
      daysOfWeek: ["MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY","SUNDAY"]
      startTimes:
        - hours: 23
          minutes: 0
          seconds: 0
          nanos: 0
    quantityBasedRetention:
      count: 7
  continuousBackupConfig:
    enabled: true
    recoveryWindowDays: 14
