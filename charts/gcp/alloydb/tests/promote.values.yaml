# Promoting the secondary: its cluster and instance become PRIMARY and the
# instance takes the database flags, as fabric does.
project_id: myproject
cluster_name: db
instance_name: db
location: europe-west8
flags: {max_connections: "200"}
network_config:
  psa_config:
    network: projects/myproject/global/networks/my-network
cross_region_replication:
  enabled: true
  promote_secondary: true
  region: europe-west12
  secondary_cluster_name: db-west12
  secondary_instance_name: db-west12
