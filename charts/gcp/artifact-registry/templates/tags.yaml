Ported from cloud-foundation-fabric modules/artifact-registry/main.tf
(v60.0.0), Copyright 2022 Google LLC, Apache-2.0.

google_tags_location_tag_binding.binding: one TagsLocationTagBinding per
tag binding, its parent the repository as fabric writes it
(//artifactregistry.googleapis.com/projects/<p>/locations/<l>/repositories/<id>).
*/ -}}
{{- $v := .Values }}
{{- range $key := keys ($v.tag_bindings | default dict) | sortAlpha }}
---
apiVersion: tags.cnrm.cloud.google.com/v1beta1
kind: TagsLocationTagBinding
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "tag" $key)) "id" (printf "tag-%s" $key)) | nindent 2 }}
spec:
  location: {{ $v.location | quote }}
  parentRef:
    external: {{ printf "//artifactregistry.googleapis.com/projects/%s/locations/%s/repositories/%s" $v.project_id $v.location (include "artifactRegistry.id" $) | quote }}
  tagValueRef:
    external: {{ index $v.tag_bindings $key | quote }}
{{- end }}
