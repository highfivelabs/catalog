# A virtual Docker repository in front of two others.
project_id: my-project
location: europe-west1
name: virtual-docker
universe: {package_domain: example.dev, prefix: eu0}
format:
  docker:
    virtual:
      remote: {repository: projects/my-project/locations/europe-west1/repositories/dockerhub, priority: 1}
      local: {repository: projects/my-project/locations/europe-west1/repositories/docker-registry, priority: 10}
