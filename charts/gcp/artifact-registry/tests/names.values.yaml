# Names in full, labels and tags, as Bundt passes them from a team's naming
# convention (docs/design.md, "Names, labels and tags"): the repository takes
# its name as given, with no prefix; every object carries the labels and tags.
project_id: my-project
location: europe-west1
name: images
names: {repository: shop-dev-euw1-images}
labels: {hfl.dev/team: shop, hfl.dev/environment: dev}
tags: {team: shop, environment: dev}
format: {docker: {standard: {immutable_tags: true}}}
tag_bindings: {env: tagValues/1234567890}
