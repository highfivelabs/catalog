---
# Source: net-cloudnat/templates/main.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeRouter
metadata:
  name: full-router
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: net-cloudnat
    app.kubernetes.io/version: "0.1.0"
    hfl.dev/team: "platform"
  annotations:
    hfl.dev/id: "router"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: my-router
  region: "europe-west8"
  networkRef:
    external: "https://www.googleapis.com/compute/v1/projects/my-project/global/networks/my-vpc"
  bgp:
    asn: 64514
---
# Source: net-cloudnat/templates/main.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeRouterNAT
metadata:
  name: full
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: net-cloudnat
    app.kubernetes.io/version: "0.1.0"
    hfl.dev/team: "platform"
  annotations:
    hfl.dev/id: "nat"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: nat
  region: "europe-west8"
  routerRef:
    name: full-router
  type: PUBLIC
  endpointTypes: ["ENDPOINT_TYPE_VM","ENDPOINT_TYPE_SWG"]
  natIpAllocateOption: MANUAL_ONLY
  natIps:
    - external: "projects/my-project/regions/europe-west8/addresses/nat-1"
    - external: "projects/my-project/regions/europe-west8/addresses/nat-2"
  sourceSubnetworkIpRangesToNat: LIST_OF_SUBNETWORKS
  subnetwork:
    - subnetworkRef:
        external: "projects/my-project/regions/europe-west8/subnetworks/apps"
      sourceIpRangesToNat: ["ALL_IP_RANGES"]
    - subnetworkRef:
        external: "projects/my-project/regions/europe-west8/subnetworks/gke"
      sourceIpRangesToNat: ["PRIMARY_IP_RANGE","LIST_OF_SECONDARY_IP_RANGES"]
      secondaryIpRangeNames: ["pods"]
    - subnetworkRef:
        external: "projects/my-project/regions/europe-west8/subnetworks/data"
      sourceIpRangesToNat: ["PRIMARY_IP_RANGE"]
  icmpIdleTimeoutSec: 30
  tcpEstablishedIdleTimeoutSec: 1200
  tcpTimeWaitTimeoutSec: 120
  tcpTransitoryIdleTimeoutSec: 30
  udpIdleTimeoutSec: 30
  enableEndpointIndependentMapping: false
  enableDynamicPortAllocation: true
  logConfig:
    enable: true
    filter: ERRORS_ONLY
  minPortsPerVm: 64
  maxPortsPerVm: 4096
  rules:
    - ruleNumber: 0
      description: "to the partner"
      match: "inIpRange(destination.ip, '1.1.0.0/16')"
      action:
        sourceNatActiveIpsRefs:
          - external: "projects/my-project/regions/europe-west8/addresses/nat-2"
    - ruleNumber: 100
      match: "destination.ip == '8.8.8.8'"
      action:
        sourceNatActiveIpsRefs:
          - external: "projects/my-project/regions/europe-west8/addresses/nat-1"
