---
# Source: net-cloudnat/templates/main.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeRouterNAT
metadata:
  name: private
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "private"
    app.kubernetes.io/name: net-cloudnat
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "nat"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: private-nat
  region: "europe-west8"
  routerRef:
    external: "projects/my-project/regions/europe-west8/routers/existing-router"
  type: PRIVATE
  sourceSubnetworkIpRangesToNat: LIST_OF_SUBNETWORKS
  subnetwork:
    - subnetworkRef:
        external: "projects/my-project/regions/europe-west8/subnetworks/apps"
      sourceIpRangesToNat: ["ALL_IP_RANGES"]
  enableEndpointIndependentMapping: false
  enableDynamicPortAllocation: true
  logConfig:
    enable: false
    filter: ALL
  maxPortsPerVm: 65536
  rules:
    - ruleNumber: 0
      match: "nexthop.hub == '//networkconnectivity.googleapis.com/projects/my-project/locations/global/hubs/hub'"
      action:
        sourceNatActiveRangesRefs:
          - external: "projects/my-project/regions/europe-west8/subnetworks/pnat"
