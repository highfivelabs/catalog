# A private NAT (hybrid NAT to Network Connectivity Center spokes) on an
# existing router: no router object, the port allocation defaults of a
# PRIVATE NAT, and a rule over a private-NAT subnet.
project_id: my-project
region: europe-west8
name: private-nat
type: PRIVATE
router_create: false
router_name: existing-router
config_source_subnetworks:
  all: false
  subnetworks:
    - self_link: projects/my-project/regions/europe-west8/subnetworks/apps
rules:
  - match: nexthop.hub == '//networkconnectivity.googleapis.com/projects/my-project/locations/global/hubs/hub'
    source_ranges: [projects/my-project/regions/europe-west8/subnetworks/pnat]
