#
# Values mirror the Terraform variables of fabric's project module
# (v60.0.0): same names, types and defaults. This chart ports the core of
# the module (README.md lists what is ported); every other variable is
# kept so tfvars convert one to one, and refused when set.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# Each collision-prone cloud name in full, {project}. A name set here
# takes no prefix. A name not set derives from name, as fabric names it.
names: {}
# An optional convenience: "<namePrefix>-" in front of every derived cloud
# name (never one set under names). Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object (fabric's labels, on the project, are
# these: here every object carries them). A prefixed key (hfl.dev/team) stays in
# Kubernetes; an unprefixed one also becomes a Google Cloud label, since
# Config Connector copies it to the resource.
labels: {}
# Cloud labels on every resource: on Google Cloud, labels (Config
# Connector carries them as unprefixed metadata.labels).
# A value that is a map is fabric's tags variable: a tag key to create,
# {description, allowed_values_regex (refused), id, iam, iam_bindings,
# iam_bindings_additive, values: {VALUE: {description, id, iam, ...}}}.
tags: {}

# Project name and ID suffix; the project ID is "<prefix>-<name>".
name: ""
prefix: null
# Descriptive project name. Set when name differs from project ID.
descriptive_name: null
# Parent folder or organization, "folders/ID" or "organizations/ID".
parent: null
# Billing account ID.
billing_account: null
auto_create_network: false
# DELETE (the default) or ABANDON. PREVENT is refused: use lien_reason.
deletion_policy: DELETE
# If non-empty, creates a project lien with this description.
lien_reason: null
# Reuse an existing project instead of creating one:
# {use_data_source, attributes: {name, number, services_enabled}}.
project_reuse: null

# Service APIs to enable.
services: []
service_config:
  disable_on_destroy: false
  disable_dependent_services: false

# Authoritative IAM on the project, {ROLE: [MEMBERS]}, {PRINCIPAL: [ROLES]}
# and {KEY: {role, members, condition}}; additive {KEY: {member, role,
# condition}} and {PRINCIPAL: [ROLES]}.
iam: {}
iam_by_principals: {}
iam_bindings: {}
iam_bindings_additive: {}
iam_by_principals_additive: {}
# Authoritative conditional IAM, {PRINCIPAL: {roles, condition}}, merged
# into iam_bindings as fabric merges it.
iam_by_principals_conditional: {}

# Organization policies, {POLICY: {inherit_from_parent, reset, rules}};
# a "dry_run:<POLICY>" key sets the policy's dry-run spec.
org_policies: {}
# Essential contacts, {EMAIL: [NOTIFICATION_TYPES]}.
contacts: {}
# Attach this project to a Shared VPC host. Ported: host_project,
# network_users, iam_bindings_additive.
shared_vpc_service_config:
  host_project: null

# Project default service account setting; only keep is supported.
default_service_account: keep

# Custom roles, {ROLE_ID: {permissions, title, description, stage}}.
custom_roles: {}
# Log sinks, {NAME: {destination, type, filter, description, disabled,
# exclusions, iam, unique_writer, bq_partitioned_table}}; type is
# bigquery, logging, pubsub or storage (project is refused). With iam (the
# default) the writer identity is granted on the destination, except for
# bigquery, which needs iam: false.
logging_sinks: {}
# Log exclusions, {NAME: FILTER}.
logging_exclusions: {}
# Log-based metrics, {NAME: {filter, bucket_name, description, disabled,
# label_extractors, value_extractor, bucket_options, metric_descriptor}}.
logging_metrics: {}
# Data access logs, {SERVICE: {ADMIN_READ, DATA_READ, DATA_WRITE}}.
logging_data_access: {}
# Log scopes, {NAME: {resource_names, description}}: the alpha kind
# LoggingLogScope, so they need allow_alpha.
log_scopes: {}
# Make this project a Shared VPC host, {enabled, service_projects}.
shared_vpc_host_config: null
# Tag bindings on the project, {KEY: TAG_VALUE_ID}.
tag_bindings: {}
# Projects whose metrics scope this project joins, [PROJECT_ID].
metric_scopes: []
# Notification channels, {KEY: {type, description, enabled, labels,
# user_labels}}; display_name and sensitive_labels are refused.
notification_channels: {}
# Alert policies, {KEY: {display_name, combiner, conditions, ...}}; a
# notification channel given by a key of notification_channels refers to
# that channel.
alerts: {}
# Network tags (tag keys with purpose GCE_FIREWALL), {KEY: {network
# ("<project>/<vpc>" or ALL), description, id, iam, iam_bindings,
# iam_bindings_additive, values}}.
network_tags: {}
# {force_context_ids (refused), ignore_iam}: ignore_iam skips the IAM of
# tag keys and values.
tags_config: {}
# Workload identity pools and their providers, {POOL: {display_name,
# description, disabled, providers: {PROVIDER: {identity_provider: {aws |
# oidc}, attribute_mapping, attribute_condition, ...}}}}; fabric's OIDC
# templates github, gitlab, okta, terraform.
workload_identity_pools: {}
# Privileged Access Manager entitlements on the project, {ID:
# {max_request_duration, eligible_users, privileged_access, ...}}.
pam_entitlements: {}
# BigQuery reservations and assignments, {NAME: {location, slot_capacity,
# ..., assignments: {JOB_TYPE: [projects/ID]}}}.
bigquery_reservations: {}
# KMS Autokey key handles, {NAME: {location, resource_type_selector}}.
kms_autokeys: {}
# Quota preferences, {KEY: {service, quota_id, preferred_value,
# dimensions, justification, contact_email, annotations}};
# ignore_safety_checks is refused.
quotas: {}

# Not a fabric variable: accept features that need a v1alpha1 Config
# Connector kind (log_scopes), whose schema may change between releases
# (docs/design.md, "Alpha kinds").
allow_alpha: false

# Refused (README.md, "Not ported"): alpha kinds not ported yet, grants to
# service agents (their emails need the project number), and the caller's
# files.
asset_feeds: {}
service_encryption_key_ids: {}
iam_deny_policies: {}
scc_mute_configs: {}
scc_sha_custom_modules: {}
vpc_sc: null
factories_config: {}
service_agents_config: {}
service_agents_folder_bindings: {}
service_agents_project_bindings: {}

# Not supported (docs/gcp-inventory.md, "Gaps"); refused when set.
compute_metadata: {}
default_network_tier: null
cloud_armor_policy: null
asset_search: {}
universe: null
skip_delete: null
context: {}
