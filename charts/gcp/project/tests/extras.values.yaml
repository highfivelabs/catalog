# Custom roles, data access logs, log exclusions, tag bindings and a Shared
# VPC host with two service projects.
name: host-project
parent: folders/1234567890
billing_account: 012345-6789AB-CDEF01
services: [compute.googleapis.com]
custom_roles:
  myRole:
    permissions: [compute.instances.get, compute.instances.list]
  myOtherRole:
    title: Other role
    description: Reads networks.
    stage: BETA
    permissions: [compute.networks.get]
logging_data_access:
  allServices:
    ADMIN_READ: {exempted_members: ["group:auditors@example.org"]}
  storage.googleapis.com:
    DATA_READ: {}
    DATA_WRITE: {}
logging_exclusions:
  no-gce-instances: resource.type=gce_instance
tag_bindings:
  env: tagValues/1234567890
shared_vpc_host_config:
  enabled: true
  service_projects: [service-project-1, projects/service-project-2]
