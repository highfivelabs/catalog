apiVersion: monitoring.cnrm.cloud.google.com/v1beta1
kind: MonitoringAlertPolicy
metadata:
  name: mock-alert-catalog-mock-alert
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: project
    app.kubernetes.io/version: "0.7.0"
    env: "test"
  annotations:
    hfl.dev/id: "alert:catalog-mock-alert"
    cnrm.cloud.google.com/project-id: "catalog-mock-prj"
spec:
  displayName: "catalog mock alert"
  combiner: "OR"
  notificationChannels:
    - name: mock-channel-catalog-mock-email
  conditions:
    - displayName: "errors"
      conditionThreshold:
        comparison: "COMPARISON_GT"
        duration: "60s"
        filter: "metric.type=\"logging.googleapis.com/log_entry_count\" resource.type=\"global\""
        thresholdValue: 10
        aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_RATE
