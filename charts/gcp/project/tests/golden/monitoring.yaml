kind: APIQuotaPreference
metadata:
  name: monitoring-quota-cpus
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "monitoring"
    app.kubernetes.io/name: project
    app.kubernetes.io/version: "0.8.0"
  annotations:
