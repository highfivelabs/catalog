spec:
  resourceID: "breakglass"
  projectRef:
    name: identity
  location: global
  maxRequestDuration: "3600s"
  eligibleUsers:
    - principals: ["group:oncall@example.com"]
  privilegedAccess:
    gcpIAMAccess:
      roleBindings:
        - role: "roles/owner"
        - role: "roles/compute.admin"
          conditionExpression: "resource.name.startsWith('projects/id-project/zones/europe-west1-b')"
  requesterJustificationConfig:
    unstructured: {}
  approvalWorkflow:
    manualApprovals:
      requireApproverJustification: true
      steps:
        - approvers:
            - principals: ["group:leads@example.com"]
          approvalsNeeded: 1
          approverEmailRecipients: ["leads@example.com"]
  additionalNotificationTargets:
    adminEmailRecipients: ["sec@example.com"]
