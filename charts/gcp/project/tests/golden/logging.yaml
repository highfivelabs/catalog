# Source: project/templates/logging-metrics.yaml
apiVersion: logging.cnrm.cloud.google.com/v1beta1
kind: LoggingLogMetric
metadata:
  name: logging-metric-bounds
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "logging"
    app.kubernetes.io/name: project
    app.kubernetes.io/version: "0.9.0"
  annotations:
    hfl.dev/id: "logging-metric:bounds"
spec:
  resourceID: "bounds"
  projectRef:
    name: logging
  filter: "resource.type=gce_instance"
  valueExtractor: "EXTRACT(jsonPayload.n)"
  bucketOptions:
    explicitBuckets:
      bounds: [1,10,100]
  metricDescriptor:
    metricKind: "DELTA"
    valueType: "DISTRIBUTION"
---
# Source: project/templates/logging-metrics.yaml
apiVersion: logging.cnrm.cloud.google.com/v1beta1
kind: LoggingLogMetric
metadata:
  name: logging-metric-errors
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "logging"
    app.kubernetes.io/name: project
    app.kubernetes.io/version: "0.9.0"
  annotations:
    hfl.dev/id: "logging-metric:errors"
spec:
  resourceID: "errors"
  projectRef:
    name: logging
  filter: "severity>=ERROR"
  description: "Errors."
  labelExtractors: {"service":"EXTRACT(resource.labels.service_name)"}
  metricDescriptor:
    metricKind: "DELTA"
    valueType: "INT64"
    displayName: "Errors"
    labels:
      - key: "service"
        description: "The service."
        valueType: "STRING"
---
# Source: project/templates/logging-metrics.yaml
apiVersion: logging.cnrm.cloud.google.com/v1beta1
kind: LoggingLogMetric
metadata:
  name: logging-metric-latency
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "logging"
    app.kubernetes.io/name: project
    app.kubernetes.io/version: "0.9.0"
  annotations:
    hfl.dev/id: "logging-metric:latency"
spec:
  resourceID: "latency"
  projectRef:
    name: logging
  filter: "resource.type=http_load_balancer"
  disabled: false
  loggingLogBucketRef:
    external: "projects/logs-project/locations/global/buckets/audit"
  valueExtractor: "EXTRACT(httpRequest.latency)"
  bucketOptions:
    exponentialBuckets:
      numFiniteBuckets: 64
      growthFactor: 2
      scale: 0.01
  metricDescriptor:
    metricKind: "DELTA"
    valueType: "DISTRIBUTION"
    unit: "s"
---
# Source: project/templates/logging-metrics.yaml
apiVersion: logging.cnrm.cloud.google.com/v1beta1
kind: LoggingLogMetric
metadata:
  name: logging-metric-sizes
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "logging"
    app.kubernetes.io/name: project
    app.kubernetes.io/version: "0.9.0"
  annotations:
    hfl.dev/id: "logging-metric:sizes"
spec:
  resourceID: "sizes"
  projectRef:
    name: logging
  filter: "resource.type=gcs_bucket"
  valueExtractor: "EXTRACT(protoPayload.size)"
  bucketOptions:
    linearBuckets:
      numFiniteBuckets: 10
      width: 100
      offset: 0
  metricDescriptor:
    metricKind: "DELTA"
    valueType: "DISTRIBUTION"
