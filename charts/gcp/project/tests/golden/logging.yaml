# Source: project/templates/logging.yaml
apiVersion: logging.cnrm.cloud.google.com/v1beta1
kind: LoggingLogSink
metadata:
  name: logging-sink-audit-bucket
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "logging"
    app.kubernetes.io/name: project
    app.kubernetes.io/version: "0.9.0"
  annotations:
    hfl.dev/id: "logging-sink:audit-bucket"
spec:
  resourceID: "audit-bucket"
  projectRef:
    name: logging
  description: "audit-bucket (Terraform-managed)."
  destination:
    loggingLogBucketRef:
      external: "projects/logs-project/locations/global/buckets/audit"
  filter: "logName:\"cloudaudit.googleapis.com\""
  uniqueWriterIdentity: true
  disabled: false
  exclusions:
    - name: "no-gce"
      filter: "resource.type=gce_instance"
    - name: "no-gke"
      filter: "resource.type=k8s_container"
---
