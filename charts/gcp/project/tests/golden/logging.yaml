# Source: project/templates/logging.yaml
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: logging-sink-writer-audit-bucket
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "logging"
    app.kubernetes.io/name: project
    app.kubernetes.io/version: "0.9.0"
  annotations:
    hfl.dev/id: "logging-sink-writer:audit-bucket"
spec:
  memberFrom:
    logSinkRef:
      name: logging-sink-audit-bucket
  role: roles/logging.bucketWriter
  resourceRef:
    apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
    kind: Project
    external: "projects/logs-project"
  condition:
    title: "audit-bucket bucket writer"
    description: "Grants bucketWriter to the writer identity used by log sink audit-bucket on logs-project"
    expression: "resource.name.endsWith('locations/global/buckets/audit')"
