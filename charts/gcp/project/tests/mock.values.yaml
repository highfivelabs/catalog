# Applied to the fake cloud by hack/mock-apply.sh. No lien and no Shared
# VPC: mockgcp has neither.
name: catalog-mock-prj
parent: organizations/123456789
billing_account: 010101-ABCDEF-010101
labels: {env: test}
services: [compute.googleapis.com, storage.googleapis.com]
iam:
  roles/viewer: ["user:dev@example.com"]
iam_bindings_additive:
  logs: {member: "user:dev@example.com", role: roles/logging.viewer}
org_policies:
  compute.disableSerialPortAccess: {rules: [{enforce: true}]}
contacts:
  ops@example.com: [SECURITY, TECHNICAL]
custom_roles:
  catalogMockRole: {permissions: [compute.instances.get]}
logging_data_access:
  storage.googleapis.com: {DATA_READ: {}}
logging_exclusions:
  catalog-mock-exclusion: resource.type=gce_instance
logging_sinks:
  catalog-mock-sink:
    destination: projects/catalog-mock-prj/locations/global/buckets/_Default
    type: logging
    filter: severity>=ERROR
logging_metrics:
  catalog-mock-metric:
    filter: severity>=ERROR
    metric_descriptor: {metric_kind: DELTA, value_type: INT64}
