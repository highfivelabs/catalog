# Applied to the fake cloud by hack/mock-apply.sh. No lien and no Shared
# VPC: mockgcp has neither.
name: catalog-mock-prj
parent: organizations/123456789
billing_account: 010101-ABCDEF-010101
labels: {env: test}
services: [compute.googleapis.com, storage.googleapis.com]
iam:
  roles/viewer: ["user:dev@example.com"]
iam_bindings_additive:
  logs: {member: "user:dev@example.com", role: roles/logging.viewer}
org_policies:
  compute.disableSerialPortAccess: {rules: [{enforce: true}]}
contacts:
  ops@example.com: [SECURITY, TECHNICAL]
custom_roles:
  catalogMockRole: {permissions: [compute.instances.get]}
logging_data_access:
  storage.googleapis.com: {DATA_READ: {}}
logging_exclusions:
  catalog-mock-exclusion: resource.type=gce_instance
logging_sinks:
  catalog-mock-sink:
    destination: projects/catalog-mock-prj/locations/global/buckets/_Default
    type: logging
    filter: severity>=ERROR
logging_metrics:
  catalog-mock-metric:
    filter: severity>=ERROR
    metric_descriptor: {metric_kind: DELTA, value_type: INT64}
notification_channels:
  catalog-mock-email: {type: email, labels: {email_address: ops@example.com}}
alerts:
  catalog-mock-alert:
    display_name: catalog mock alert
    combiner: OR
    notification_channels: [catalog-mock-email]
    conditions:
      - display_name: errors
        condition_threshold:
          comparison: COMPARISON_GT
          duration: 60s
          filter: metric.type="logging.googleapis.com/log_entry_count" resource.type="global"
          threshold_value: 10
          aggregations: [{alignment_period: 60s, per_series_aligner: ALIGN_RATE}]
quotas:
  catalog-mock-cpus:
    service: compute.googleapis.com
    quota_id: CPUS-per-project-region
    preferred_value: 8
    dimensions: {region: us-central1}
tags:
  catalog-mock-env:
    description: catalog mock tag key
    values: {dev: {}}
pam_entitlements:
  catalog-mock-pam:
    max_request_duration: 3600s
    eligible_users: ["user:dev@example.com"]
    privileged_access: [{role: roles/viewer}]
bigquery_reservations:
  catalog-mock-res: {location: US, slot_capacity: 0, edition: ENTERPRISE, max_slots: 50}
kms_autokeys:
  catalog-mock-disk: {location: us-central1}
