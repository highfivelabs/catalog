#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every object this
# chart renders carries the namePrefix in its cloud-side name
# (spec.resourceID), except the kinds listed here, each with the reason it
# cannot collide with another Instance's. A kind added to the chart and not
# listed fails `task test` until it is prefixed or listed.
exempt:
  IAMPartialPolicy: "binds members on another object; it has no name of its own"
  IAMPolicyMember: "binds one member on another object; it has no name of its own"
  Service: "named by the API it enables (compute.googleapis.com), per project"
  OrgPolicyPolicy: "named by the constraint, per project"
  EssentialContactsContact: "keyed by the contact's email"
  ResourceManagerLien: "its name is generated by Google Cloud"
  ComputeSharedVPCServiceProject: "attaches the project to a host; it has no name of its own"
  IAMBinding: "the members of one role on another object; it has no name of its own"
  IAMCustomRole: "its ID is scoped to the project and takes no \"-\", so a namePrefix cannot go in front; the project's name carries it"
  IAMAuditConfig: "configures one service's audit logs on the project; it has no name of its own"
  TagsTagBinding: "a binding of a tag value to the project; it has no name of its own"
  ComputeSharedVPCHostProject: "makes the project a Shared VPC host; it has no name of its own"
  MonitoringNotificationChannel: "Google Cloud assigns its ID; its display name is the Kubernetes object's name"
  MonitoringAlertPolicy: "Google Cloud assigns its ID; display_name is fabric's and not unique"
