{{- $c := .Values.service_config | default dict }}
{{- $annotations := dict
  "cnrm.cloud.google.com/disable-on-destroy" (toString ($c.disable_on_destroy | default false))
  "cnrm.cloud.google.com/disable-dependent-services" (toString ($c.disable_dependent_services | default false)) }}
{{- range $s := (.Values.services | uniq | sortAlpha) }}
---
apiVersion: serviceusage.cnrm.cloud.google.com/v1beta1
kind: Service
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "service" (trimSuffix ".googleapis.com" $s))) "id" (printf "service:%s" $s) "annotations" $annotations) | nindent 2 }}
spec:
  resourceID: {{ $s }}
  projectRef:
    {{- include "project.ref" $ | nindent 4 }}
{{- end }}
