# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set, or accepts only in part. Read by `task
# coverage`; `task coverage-verify` renders the chart to check that each one
# is refused. kind: gap (no Config Connector kind or field), alpha (only a
# v1alpha1 kind), not-ported (Config Connector has it, the chart does not
# map it yet) or by-design (Bundt replaces it). partial: the variable is
# accepted, the reason says what is refused.
refused:
  - variable: alerts
    kind: not-ported
    reason: "Config Connector has a stable kind for it; the chart does not map it yet (charts/gcp/project/README.md, \"Not ported\")"
  - variable: asset_feeds
    kind: not-ported
    reason: "Config Connector has a stable kind for it; the chart does not map it yet (charts/gcp/project/README.md, \"Not ported\")"
  - variable: asset_search
    kind: by-design
    reason: "a search is a read, not a resource"
  - variable: bigquery_reservations
    kind: not-ported
    reason: "Config Connector has a stable kind for it; the chart does not map it yet (charts/gcp/project/README.md, \"Not ported\")"
  - variable: cloud_armor_policy
    kind: alpha
    reason: "ComputeOrganizationSecurityPolicyAssociation is alpha in v1.160.0"
  - variable: compute_metadata
    kind: gap
    reason: "ComputeProjectMetadata owns all of a project's metadata, while fabric sets single items; there is no per-item kind (gap 10)"
  - variable: context
    kind: by-design
    reason: "Bundt replaces fabric's $context lookups with ${...} expressions and valueFrom in the component's inputs"
  - variable: default_network_tier
    kind: gap
    reason: "Config Connector has no project default network tier (gap 10)"
  - variable: default_service_account
    kind: gap
    reason: "only keep (the default) is supported: Config Connector cannot delete, deprivilege or disable a project's default service accounts (gap 10)"
    partial: true
    values: [delete, deprivilege, disable]
  - variable: deletion_policy
    kind: by-design
    reason: "DELETE and ABANDON only: PREVENT is refused, use lien_reason"
    partial: true
