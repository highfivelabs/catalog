#
# The Bundt Package for this chart (see ../iam-service-account/package.yaml).
# With project_reuse the chart makes no project object, so these outputs
# have no value.
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: gcp-project
spec:
  version: 0.1.0
  engine: helm
  providers: [kcc]
  outputs:
    project_id: resources.project.spec.resourceID
    id: resources.project.spec.resourceID
    name: resources.project.spec.name
    number: resources.project.status.number
    services: >-
      resources.filter(k, resources[k].kind == 'Service').map(k, resources[k].spec.resourceID).sort()
