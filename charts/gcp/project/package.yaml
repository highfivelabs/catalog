#
# The Bundt Package for this chart (see ../iam-service-account/package.yaml).
# Outputs are fabric's declared outputs for what the chart ports, selected
# from the live objects and the component's values: project_id and id
# come from inputs, as fabric computes them (names.project when it is set), so they have a value with
# project_reuse too; name and number need the project object.
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: gcp-project
spec:
  version: 0.9.1
  engine: helm
  providers: [kcc]
  outputs:
    project_id: >-
      ('project' in inputs.names && inputs.names.project != '' ? inputs.names.project : (inputs.namePrefix != '' ? inputs.namePrefix + '-' : '') + (inputs.prefix != null ? inputs.prefix + '-' : '') + inputs.name)
    id: >-
      ('project' in inputs.names && inputs.names.project != '' ? inputs.names.project : (inputs.namePrefix != '' ? inputs.namePrefix + '-' : '') + (inputs.prefix != null ? inputs.prefix + '-' : '') + inputs.name)
    name: resources.project.spec.name
    number: resources.project.status.number
    services: >-
      resources.filter(k, resources[k].kind == 'Service').map(k, resources[k].spec.resourceID).sort()
    organization_policies_ids: >-
      resources.transformMapEntry(k, v, v.kind == 'OrgPolicyPolicy',
        {v.spec.resourceID: 'projects/' + ('project' in inputs.names && inputs.names.project != '' ? inputs.names.project : (inputs.namePrefix != '' ? inputs.namePrefix + '-' : '') + (inputs.prefix != null ? inputs.prefix + '-' : '') + inputs.name)
          + '/policies/' + v.spec.resourceID})
    sink_writer_identities: >-
      resources.transformMapEntry(k, v, v.kind == 'LoggingLogSink', {k.substring(13): v.status.writerIdentity})
    alert_ids: >-
      resources.transformMapEntry(k, v, v.kind == 'MonitoringAlertPolicy', {k.substring(6): v.status.name})
    notification_channel_names: >-
      resources.transformMapEntry(k, v, v.kind == 'MonitoringNotificationChannel', {k.substring(21): v.status.name})
    tag_keys: >-
      resources.transformMapEntry(k, v, v.kind == 'TagsTagKey' && k.startsWith('tag-key:'), {k.substring(8): 'tagKeys/' + v.status.name})
    tag_values: >-
      resources.transformMapEntry(k, v, v.kind == 'TagsTagValue' && k.startsWith('tag-value:'), {k.substring(10): 'tagValues/' + v.status.name})
    network_tag_keys: >-
      resources.transformMapEntry(k, v, v.kind == 'TagsTagKey' && k.startsWith('network-tag-key:'), {k.substring(16): 'tagKeys/' + v.status.name})
    network_tag_values: >-
      resources.transformMapEntry(k, v, v.kind == 'TagsTagValue' && k.startsWith('network-tag-value:'), {k.substring(18): 'tagValues/' + v.status.name})
    kms_autokeys: >-
      resources.transformMapEntry(k, v, v.kind == 'KMSKeyHandle', {k.substring(12): v.status.observedState.kmsKey})
