# fabric's README example (modules/binauthz/README.md, v60.0.0): a policy
# that denies by default and requires an attestation on one cluster, and
# the attestor with a PGP key, its note and IAM on it.
project_id: my-project
default_admission_rule:
  evaluation_mode: ALWAYS_DENY
  enforcement_mode: ENFORCED_BLOCK_AND_AUDIT_LOG
  attestors: null
cluster_admission_rules:
  europe-west1-c.cluster:
    evaluation_mode: REQUIRE_ATTESTATION
    enforcement_mode: ENFORCED_BLOCK_AND_AUDIT_LOG
    attestors: [test]
attestors_config:
  test:
    note_reference: null
    pgp_public_keys:
      - |
        mQENBFtP0doBCADF+joTiXWKVuP8kJt3fgpBSjT9h8ezMfKA4aXZctYLx5wslWQl
        bB7Iu2ezkECNzoEeU7WxUe8a61pMCh9cisS9H5mB2K2uM4Jnf8tgFeXn3akJDVo0
        =6Bvm
    pkix_public_keys: null
    iam:
      roles/viewer: ["user:user1@example.com"]
