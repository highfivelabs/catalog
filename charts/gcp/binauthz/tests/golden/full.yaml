apiVersion: binaryauthorization.cnrm.cloud.google.com/v1beta1
kind: BinaryAuthorizationPolicy
metadata:
  name: full
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: binauthz
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "policy"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  projectRef:
    external: "projects/my-project"
  admissionWhitelistPatterns:
    - namePattern: "europe-docker.pkg.dev/my-project/images/*"
    - namePattern: "gcr.io/google_containers/*"
  defaultAdmissionRule:
    evaluationMode: "REQUIRE_ATTESTATION"
    enforcementMode: "DRYRUN_AUDIT_LOG_ONLY"
    requireAttestationsBy:
      - name: full-attestor-build
      - name: full-attestor-security
  clusterAdmissionRules:
    "europe-west1-b.dev":
      evaluationMode: "ALWAYS_ALLOW"
      enforcementMode: "DRYRUN_AUDIT_LOG_ONLY"
    "europe-west1.prod":
      evaluationMode: "REQUIRE_ATTESTATION"
      enforcementMode: "ENFORCED_BLOCK_AND_AUDIT_LOG"
      requireAttestationsBy:
        - name: full-attestor-build
