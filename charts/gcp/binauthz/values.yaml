#
# Values mirror the Terraform variables of fabric's binauthz module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# This chart gives no singular resource a name: attestors are named by
# their keys in attestors_config, and their notes <key>-note, as fabric
# names them, so names takes no key.
names: {}
# An optional convenience: "<namePrefix>-" in front of every attestor and
# note name. Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. Attestors, notes and the policy take
# no Google Cloud labels, so these stay in Kubernetes.
labels: {}
# Cloud labels on every resource; none of these resources takes any, so
# these stay in Kubernetes too.
tags: {}

# An image name pattern to allowlist.
admission_whitelist_patterns: null
# Attestors configuration: {NAME: {note_reference, iam, pgp_public_keys,
# pkix_public_keys}}. A null note_reference makes the note <NAME>-note.
attestors_config: null
# Admission rules: {CLUSTER: {evaluation_mode, enforcement_mode,
# attestors}}, the cluster as <location>.<cluster id>.
cluster_admission_rules: null
# Default admission rule.
default_admission_rule:
  evaluation_mode: ALWAYS_ALLOW
  enforcement_mode: ENFORCED_BLOCK_AND_AUDIT_LOG
  attestors: null
# Project ID.
project_id: ""

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# policy, attestors and notes when the component is deleted. PREVENT has no
# Config Connector equivalent.
deletion_policy: null
