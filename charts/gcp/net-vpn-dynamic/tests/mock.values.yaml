# Applied to the fake cloud by hack/mock-apply.sh, on the network in
# tests/mock.needs.yaml: the gateway, its address, its three forwarding
# rules, the router and an export route policy (allow_alpha:
# config-connector-extensions' fake cloud runs its
# ComputeRouterRoutePolicy controller).
allow_alpha: true
project_id: mock-project
region: us-central1
name: catalog-mock-dynvpn
network: projects/mock-project/global/networks/catalog-mock-dynvpn-net
router_config:
  asn: 64514
  route_policies:
    export:
      type: EXPORT
      terms: [{priority: 1, match: {expression: "destination == '10.0.0.0/8'"}, actions: [{expression: "accept()"}]}]
