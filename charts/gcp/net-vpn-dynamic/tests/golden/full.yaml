  region: "europe-west1"
  routerRef:
    name: full
  type: ROUTE_POLICY_TYPE_IMPORT
  terms:
    - priority: 1
      match:
        expression: "destination == '10.0.0.0/8'"
        title: "onprem"
        description: "on-premises range"
        location: "here"
      actions:
        - expression: "drop()"
          title: "drop"
