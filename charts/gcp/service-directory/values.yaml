#
# Values mirror the Terraform variables of fabric's service-directory module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types and the module's validations.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables, except labels, which is fabric's variable too.
#
# names.namespace: the namespace's ID in full. A name set here takes no
# prefix; unset, the namespace is name (with namePrefix in front).
names: {}
# An optional convenience: "<namePrefix>-" in front of the namespace ID
# (never one set under names). Services and endpoints are named inside the
# namespace and take none. Empty (the default) changes nothing.
namePrefix: ""
# Cloud labels on every resource, besides labels. Services and endpoints
# carry their labels as Service Directory metadata (README.md, "Values").
tags: {}

# Map of endpoint attributes, keys are in service/endpoint format:
# {address, port, network, metadata}.
endpoint_config: {}
# IAM bindings for namespace, in {ROLE => [MEMBERS]} format.
iam: {}
# Labels (fabric's: on the namespace; here on every object).
labels: {}
# Namespace location.
location: ""
# Namespace name.
name: ""
# Project used for resources.
project_id: ""
# IAM bindings for services, in {SERVICE => {ROLE => [MEMBERS]}} format.
service_iam: {}
# Service configuration, using service names as keys: {endpoints, metadata}.
services: {}

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# namespace, services and endpoints when the component is deleted. PREVENT
# has no Config Connector equivalent.
deletion_policy: null
