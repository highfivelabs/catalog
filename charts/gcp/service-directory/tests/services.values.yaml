# Services with IAM and endpoints, after the module README's examples.
project_id: my-project
location: europe-west1
name: sd-1
labels: {env: test}
services:
  one:
    endpoints: [first, second]
    metadata: {team: alpha}
service_iam:
  one:
    roles/servicedirectory.editor: ["serviceAccount:service-editor.example.com"]
endpoint_config:
  one/first: {address: 127.0.0.1, port: 80, metadata: {}}
  one/second:
    address: 127.0.0.2
    port: 8080
    network: projects/1234567890/locations/global/networks/default
    metadata: {zone: a}
deletion_policy: ABANDON
