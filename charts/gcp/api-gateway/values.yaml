#
# Values mirror the Terraform variables of fabric's api-gateway module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.api, names.gateway and names.serviceAccount set those cloud names
# in full; unset, they derive from api_id as fabric derives them (api_id,
# gw-<api_id>, sa-api-cfg-<api_id>). The API config's name is fabric's,
# api-cfg-<API name>-<hash of spec>, under the API.
names: {}
# An optional convenience: "<namePrefix>-" in front of every derived name.
# Empty (the default) changes nothing.
namePrefix: ""
# fabric's labels (Map of labels), which fabric puts on the API: Kubernetes
# labels on every object; an unprefixed key also becomes a Google Cloud
# label, because Config Connector copies it.
labels: null
# Cloud labels on every resource (Google Cloud labels).
tags: {}

# API identifier.
api_id: ""
# IAM bindings for the API in {ROLE => [MEMBERS]} format.
iam: null
# Project identifier.
project_id: ""
# Region.
region: ""
# Flag indicating whether a service account needs to be created.
service_account_create: false
# Service account for creating API configs.
service_account_email: null
# String with the contents of the OpenAPI spec.
spec: ""

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# API, config, gateway and service account when the component is deleted.
# PREVENT has no Config Connector equivalent.
deletion_policy: null
