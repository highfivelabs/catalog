# Every variable: an existing service account (fabric's README "Use
# existing service account"), labels, a role with members given twice and
# out of order, and a real OpenAPI 2.0 spec.
project_id: my-project
api_id: orders
region: us-central1
service_account_email: sa@my-project.iam.gserviceaccount.com
labels: {team: shop, hfl.dev/environment: dev}
iam:
  roles/apigateway.admin: ["user:user@example.com"]
  roles/apigateway.viewer: ["user:b@example.com", "group:a@example.com", "user:b@example.com"]
spec: |
  swagger: "2.0"
  info:
    title: orders
    version: "1.0.0"
  schemes: [https]
  produces: [application/json]
  paths:
    /orders:
      get:
        operationId: listOrders
        x-google-backend:
          address: https://orders-abc123-uc.a.run.app
        responses:
          "200":
            description: OK
