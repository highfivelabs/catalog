# Applied to the fake cloud by hack/mock-apply.sh: the API, its config on a
# service account the chart makes, and the gateway, and a role on each (IAMBinding; config-connector-extensions'
# fake cloud serves getIamPolicy on a config and a gateway since 35833eb).
project_id: mock-project
api_id: cat-mock-api
region: us-central1
service_account_create: true
labels: {env: test}
spec: |
  swagger: "2.0"
  info:
    title: cat-mock-api
    version: "1.0.0"
  schemes: [https]
  produces: [application/json]
  paths:
    /hello:
      get:
        operationId: hello
        x-google-backend:
          address: https://example.com
        responses:
          "200":
            description: OK
iam:
  roles/apigateway.viewer: ["group:viewers@example.com"]
