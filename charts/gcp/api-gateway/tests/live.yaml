# The live case (hack/live-apply.sh LIVE_CHARTS=api-gateway): the API, its
# config (config-connector-extensions' APIGatewayAPIConfig), the gateway
# (APIGatewayGateway), and a role on each (IAMBinding). The config runs as
# the runner itself: an account the chart makes needs its creator to act as
# it, and neither live-test account holds both roles (run cat-11140120-96a6:
# catalog-live-tests may create accounts but not act as them;
# cce-live-tests the reverse). The fake-cloud case covers
# service_account_create.
project_id: ${PROJECT}
api_id: ${RUN}-a
region: ${REGION}
service_account_email: ${RUNNER}
labels: {catalog-run: ${RUN}}
spec: |
  swagger: "2.0"
  info:
    title: ${RUN}-a
    version: "1.0.0"
  schemes: [https]
  produces: [application/json]
  paths:
    /hello:
      get:
        operationId: hello
        x-google-backend:
          address: https://example.com
        responses:
          "200":
            description: OK
iam:
  roles/apigateway.viewer: ["serviceAccount:${RUNNER}"]
