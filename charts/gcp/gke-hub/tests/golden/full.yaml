# Source: gke-hub/templates/main.yaml
apiVersion: gkehub.cnrm.cloud.google.com/v1beta1
kind: GKEHubFeatureMembership
metadata:
  name: full-configmanagement-mcp
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: gke-hub
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "configmanagement-membership:mcp"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  projectRef:
    external: "my-project"
  location: global
  featureRef:
    name: full-feature-configmanagement
  membershipRef:
    name: full-membership-mcp
  membershipLocation: "europe-west1"
  configmanagement:
    version: "1.19.0"
    configSync:
      git:
        gcpServiceAccountRef:
          external: "sync@my-project.iam.gserviceaccount.com"
        httpsProxy: "http://proxy.example.com:3128"
        policyDir: "configsync"
        secretType: "gcpserviceaccount"
        syncBranch: "main"
        syncRepo: "https://github.com/example/configsync"
        syncRev: "HEAD"
        syncWaitSecs: "30"
      preventDrift: true
      sourceFormat: "unstructured"
    hierarchyController:
      enableHierarchicalResourceQuota: true
      enablePodTreeLabels: false
      enabled: true
