# Source: gke-hub/templates/main.yaml
apiVersion: gkehub.cnrm.cloud.google.com/v1beta1
kind: GKEHubFeatureMembership
metadata:
  name: full-policycontroller-mcp
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: gke-hub
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "policycontroller-membership:mcp"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  projectRef:
    external: "my-project"
  location: global
  featureRef:
    name: full-feature-policycontroller
  membershipRef:
    name: full-membership-mcp
  membershipLocation: "europe-west1"
  policycontroller:
    version: "1.19.0"
    policyControllerHubConfig:
      auditIntervalSeconds: 60
      constraintViolationLimit: 20
      deploymentConfigs:
        admission:
          containerResources:
            limits:
              cpu: "1"
              memory: "1Gi"
            requests:
              cpu: "500m"
          podAffinity: "ANTI_AFFINITY"
          podTolerations:
            - {"effect":"NoSchedule","key":"dedicated","operator":"Equal","value":"system"}
          replicaCount: 2
      exemptableNamespaces: ["kube-system"]
      installSpec: "INSTALL_SPEC_ENABLED"
      logDeniesEnabled: true
      monitoring:
        backends: ["PROMETHEUS","CLOUD_MONITORING"]
      mutationEnabled: true
      policyContent:
        templateLibrary:
          installation: "ALL"
      referentialRulesEnabled: true
