#
# Values mirror the Terraform variables of fabric's gke-hub module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types and the module's validations.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.<cluster key>: that cluster's membership ID in full. A name set here
# takes no prefix; unset, the membership ID is the key (with namePrefix in
# front), as fabric names it.
names: {}
# An optional convenience: "<namePrefix>-" in front of the membership IDs
# (never one set under names). Features are named by the API. Empty (the
# default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. Memberships and features take no labels
# here, so these stay in Kubernetes.
labels: {}
# Cloud labels on every resource; these stay in Kubernetes too.
tags: {}

# GKE clusters to register with GKE Hub and their feature configurations:
# {KEY => {id, configmanagement, policycontroller, servicemesh,
# workload_identity}}. id is projects/<p>/locations/<l>/clusters/<c>; the
# other three name a template.
clusters: {}
# Config management configurations, in config name => {options} format.
configmanagement_templates: {}
# Fleet features to enable: appdevexperience, configmanagement,
# identityservice, multiclusterservicediscovery, policycontroller,
# servicemesh (true to enable), multiclusteringress (the config cluster's
# key).
features: {}
# Fleet default member config.
fleet_default_member_config: null
# GKE hub location, also the membership location (global when null).
location: null
# Policy Controller configurations, in config name => {options} format.
policycontroller_templates: {}
# GKE hub project ID.
project_id: ""
# Service Mesh configurations, in config name => {management} format.
servicemesh_templates: {}

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# memberships, features and feature memberships when the component is
# deleted. PREVENT has no Config Connector equivalent.
deletion_policy: null
