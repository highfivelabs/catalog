#
# The Bundt Package for this chart (see iam-service-account/package.yaml).
# fabric's one output, cluster_ids: each cluster key's membership ID,
# projects/<project>/locations/<location>/memberships/<id>, computed from
# the inputs as the membership is named (names.<key> when it is set, else
# the key with the namePrefix in front).
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: gcp-gke-hub
spec:
  version: 0.1.0
  engine: helm
  providers: [kcc]
  outputs:
    cluster_ids: >-
      inputs.clusters.transformMap(k, v,
        'projects/' + inputs.project_id + '/locations/' + (inputs.location == null ? 'global' : inputs.location) + '/memberships/' +
        (k in inputs.names && inputs.names[k] != '' ? inputs.names[k] : (inputs.namePrefix != '' ? inputs.namePrefix + '-' : '') + k))
