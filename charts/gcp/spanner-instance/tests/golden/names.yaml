    name: names
---
# Source: spanner-instance/templates/main.yaml
apiVersion: spanner.cnrm.cloud.google.com/v1beta1
kind: SpannerInstance
metadata:
  name: names
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "names"
    app.kubernetes.io/name: spanner-instance
    app.kubernetes.io/version: "0.1.0"
    environment: "dev"
    hfl.dev/environment: "dev"
    hfl.dev/team: "shop"
    team: "shop"
  annotations:
    hfl.dev/id: "instance"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "shop-dev-orders"
  config: "custom-shop-orders"
  displayName: "orders"
  numNodes: 1
---
# Source: spanner-instance/templates/main.yaml
apiVersion: spanner.gcp.hfl.dev/v1beta1
kind: SpannerInstanceConfig
metadata:
  name: names-config
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "names"
    app.kubernetes.io/name: spanner-instance
    app.kubernetes.io/version: "0.1.0"
    environment: "dev"
    hfl.dev/environment: "dev"
    hfl.dev/team: "shop"
    team: "shop"
  annotations:
    hfl.dev/id: "instance_config"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  projectRef:
    external: "my-project"
  resourceID: "custom-shop-orders"
  displayName: "custom-shop-orders"
  replicas:
    - location: "us-east1"
      type: "READ_WRITE"
      defaultLeaderLocation: true
  labels:
    environment: "dev"
    team: "shop"
