    external: "my-project"
  resourceID: "custom-nam11-config"
  displayName: "Test Spanner Instance Config"
  baseConfigRef:
    external: "projects/my-project/instanceConfigs/name11"
  replicas:
    - location: "us-west1"
      type: "READ_ONLY"
      defaultLeaderLocation: false
