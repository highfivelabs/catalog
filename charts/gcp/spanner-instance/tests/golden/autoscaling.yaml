# Source: spanner-instance/templates/main.yaml
apiVersion: spanner.cnrm.cloud.google.com/v1beta1
kind: SpannerInstance
metadata:
  name: autoscaling
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "autoscaling"
    app.kubernetes.io/name: spanner-instance
    app.kubernetes.io/version: "0.1.0"
    foo: "bar"
  annotations:
    hfl.dev/id: "instance"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "my-instance"
  config: "regional-us-central1"
  displayName: "Regional instance"
  autoscalingConfig:
    autoscalingLimits:
      maxProcessingUnits: 3000
      minProcessingUnits: 2000
    autoscalingTargets:
      highPriorityCpuUtilizationPercent: 75
      storageUtilizationPercent: 90
