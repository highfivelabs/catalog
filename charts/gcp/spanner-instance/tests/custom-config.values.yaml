# fabric's README example "Instance with custom config" (its base_config,
# "name11", kept as written).
project_id: my-project
instance:
  name: my-instance
  display_name: Regional instance
  config:
    name: custom-nam11-config
    auto_create:
      display_name: Test Spanner Instance Config
      base_config: name11
      replicas:
        - location: us-west1
          type: READ_ONLY
          default_leader_location: false
  num_nodes: 1
