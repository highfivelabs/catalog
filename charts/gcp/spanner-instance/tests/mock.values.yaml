# Applied to the fake cloud by hack/mock-apply.sh: a user-managed instance
# configuration, an instance on it, a database with DDL, and IAM on both.
project_id: mock-project
labels: {env: test}
instance:
  name: catalog-mock-spanner
  config:
    name: custom-catalog-mock
    auto_create:
      base_config: regional-us-central1
      replicas:
        - {location: us-central1, type: READ_WRITE, default_leader_location: true}
  processing_units: 100
databases:
  orders:
    ddl:
      - CREATE TABLE t (id INT64) PRIMARY KEY (id)
    iam:
      roles/spanner.databaseReader: ["user:dev@example.com"]
iam:
  roles/spanner.viewer: ["user:dev@example.com"]
