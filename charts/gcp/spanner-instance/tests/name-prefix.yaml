#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every object this
# chart renders carries the namePrefix in its cloud-side name
# (spec.resourceID), except the kinds listed here, each with the reason it
# cannot collide with another Instance's. A kind added to the chart and not
# listed fails `task test` until it is prefixed or listed.
exempt:
  SpannerInstanceConfig: "Spanner requires a user-managed configuration's ID to start with custom-, so it is the name given in instance.config.name, which fabric's users choose per project"
  SpannerDatabase: "a database's name is unique only within its instance, which carries the prefix"
  IAMPartialPolicy: "binds members on the instance or a database; it has no name of its own"
  IAMPolicyMember: "binds one member on the instance or a database; it has no name of its own"
