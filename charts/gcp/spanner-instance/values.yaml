#
# Values mirror the Terraform variables of fabric's spanner-instance module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types and the module's validations.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.instance: the instance ID in full (2 to 64 characters, starting
# with a letter). A name set here takes no namePrefix; unset, instance.name.
names: {}
# An optional convenience: "<namePrefix>-" in front of the instance ID (never
# one set under names). Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object; an unprefixed key also becomes a
# Google Cloud label on the instance and the instance configuration.
labels: {}
# Cloud labels on every resource that takes them (the instance and the
# instance configuration).
tags: {}

# Databases, {NAME: {database_dialect, ddl, default_time_zone,
# deletion_protection, enable_drop_protection, iam, iam_bindings,
# iam_bindings_additive, kms_key_name, version_retention_period}}.
databases: {}
# IAM bindings on the instance in {ROLE => [MEMBERS]} format.
iam: {}
# Authoritative IAM bindings on the instance, {KEY => {role, members}}.
iam_bindings: {}
# Individual additive IAM bindings on the instance, {KEY => {member, role}}.
iam_bindings_additive: {}
# Instance attributes: {name, display_name, config: {name, auto_create:
# {base_config, display_name, labels, replicas: [{location, type,
# default_leader_location}]}}, num_nodes, processing_units, autoscaling:
# {limits, targets}, edition, default_backup_schedule_type, labels,
# force_destroy}. Required.
instance: null
# Set to false to manage databases and IAM bindings in an existing instance.
instance_create: true
# Project id. Required.
project_id: ""

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# instance configuration, the instance and its databases when the component
# is deleted. PREVENT has no Config Connector equivalent.
deletion_policy: null
