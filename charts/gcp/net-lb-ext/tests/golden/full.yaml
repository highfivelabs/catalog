  resourceID: "custom-fr"
  location: "europe-west1"
  ipVersion: IPV6
  ipProtocol: "TCP"
  backendServiceRef:
    name: full
  loadBalancingScheme: EXTERNAL
  subnetworkRef:
    external: "projects/my-project/regions/europe-west1/subnetworks/v6"
  ports:
    - "80"
    - "443"
