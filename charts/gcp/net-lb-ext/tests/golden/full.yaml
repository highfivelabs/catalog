---
# Source: net-lb-ext/templates/main.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeBackendService
metadata:
  name: full
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: net-lb-ext
    app.kubernetes.io/version: "0.1.0"
    env: "test"
  annotations:
    hfl.dev/id: "backend_service"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: "custom-bs"
  location: "europe-west1"
  description: "the backend"
  loadBalancingScheme: EXTERNAL
  protocol: "UNSPECIFIED"
  healthChecks:
    - healthCheckRef:
        name: full
  connectionDrainingTimeoutSec: 10
  localityLbPolicy: "WEIGHTED_MAGLEV"
  portName: "http"
  securityPolicyRef:
    external: "projects/my-project/regions/europe-west1/securityPolicies/edge"
  sessionAffinity: "CLIENT_IP_PROTO"
  timeoutSec: 30
  backend:
    - balancingMode: CONNECTION
      description: "Terraform managed."
      failover: false
      group:
        instanceGroupRef:
          name: full-group-my-group
    - balancingMode: CONNECTION
      description: "failover group"
      failover: true
      group:
        instanceGroupRef:
          external: "projects/my-project/zones/europe-west1-c/instanceGroups/other"
  connectionTrackingPolicy:
    connectionPersistenceOnUnhealthyBackends: "ALWAYS_PERSIST"
    idleTimeoutSec: 60
    trackingMode: PER_CONNECTION
  failoverPolicy:
    disableConnectionDrainOnFailover: false
    dropTrafficIfUnhealthy: true
    failoverRatio: 0.25
  logConfig:
    enable: true
    sampleRate: 1
---
