    app.kubernetes.io/version: "0.1.0"
    env: "test"
  annotations:
    hfl.dev/id: "forwarding_rule:"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: "nlb-full"
  location: "europe-west1"
  description: "the main rule"
  ipAddress:
    ip: "34.1.2.3"
  ipProtocol: "UDP"
  backendServiceRef:
    name: full
  loadBalancingScheme: EXTERNAL
  allPorts: true
---
# Source: net-lb-ext/templates/main.yaml
