kind: ComputeInstanceGroup
metadata:
  name: full-group-my-group
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: net-lb-ext
    app.kubernetes.io/version: "0.1.0"
    env: "test"
  annotations:
    hfl.dev/id: "group:my-group"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: "custom-group"
  zone: "europe-west1-b"
  description: "a group"
  instances:
    - external: "projects/my-project/zones/europe-west1-b/instances/vm-a"
  namedPort:
    - name: "http"
      port: 80
