  loadBalancingScheme: EXTERNAL
  protocol: "UNSPECIFIED"
  healthChecks:
    - healthCheckRef:
        name: basic
  backend:
    - balancingMode: CONNECTION
      description: "Terraform managed."
      failover: false
      group:
        instanceGroupRef:
          external: "projects/my-project/zones/europe-west1-b/instanceGroups/my-ig"
