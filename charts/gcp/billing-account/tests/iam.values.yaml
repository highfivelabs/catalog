# fabric's IAM variables: iam and iam_by_principals merged by role,
# iam_bindings (one with a condition) and iam_bindings_additive.
id: 012345-6789AB-CDEF01
iam:
  roles/billing.admin: ["group:billing-admins@example.com"]
iam_by_principals:
  "group:finance@example.com": [roles/billing.viewer, roles/billing.costsManager]
iam_bindings:
  creator:
    role: roles/billing.creator
    members: ["user:creator@example.com"]
  conditional:
    role: roles/billing.user
    members: ["group:projects@example.com"]
    condition:
      title: expires
      expression: request.time < timestamp("2027-01-01T00:00:00Z")
iam_bindings_additive:
  viewer:
    role: roles/billing.viewer
    member: user:viewer@example.com
