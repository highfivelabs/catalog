# fabric's README example "log sinks": one sink per destination type,
# with a filter, exclusions and a partitioned BigQuery table.
allow_alpha: true
id: 012345-6789AB-CDEF01
logging_sinks:
  bq:
    destination: projects/my-project/datasets/billing_logs
    type: bigquery
    bq_partitioned_table: true
    filter: severity=WARNING
  gcs:
    destination: my-bucket
    type: storage
    exclusions:
      no-debug: {filter: severity=DEBUG, description: drop debug}
  logs:
    destination: projects/my-project/locations/global/buckets/billing
    type: logging
    description: To a log bucket.
  project:
    destination: my-project
    type: project
  pubsub:
    destination: projects/my-project/topics/billing-logs
    type: pubsub
    disabled: true
