# Source: billing-account/templates/budgets.yaml
apiVersion: billingbudgets.cnrm.cloud.google.com/v1beta1
kind: BillingBudgetsBudget
metadata:
  name: mock-budget-monthly
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: billing-account
    app.kubernetes.io/version: "0.1.0"
    env: "test"
  annotations:
    hfl.dev/id: "budget:monthly"
spec:
  billingAccountRef:
    external: "012345-6789AB-CDEF01"
  displayName: "Monthly"
  amount:
    specifiedAmount:
      units: 100
  budgetFilter:
    creditTypesTreatment: "INCLUDE_ALL_CREDITS"
    calendarPeriod: "MONTH"
  thresholdRules:
    - thresholdPercent: 0.5
      spendBasis: "CURRENT_SPEND"
  allUpdatesRule:
    schemaVersion: "1.0"
    monitoringNotificationChannels:
      - name: mock-channel-ops
