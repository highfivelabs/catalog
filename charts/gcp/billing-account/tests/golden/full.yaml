metadata:
  name: full-iam
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: billing-account
    app.kubernetes.io/version: "0.1.0"
    hfl.dev/team: "shop"
    team: "shop"
  annotations:
    hfl.dev/id: "iam"
spec:
  resourceRef:
    apiVersion: billing.cnrm.cloud.google.com/v1beta1
    external: 012345-6789AB-CDEF01
