---
# Source: billing-account/templates/budgets.yaml
apiVersion: billingbudgets.cnrm.cloud.google.com/v1beta1
kind: BillingBudgetsBudget
metadata:
  name: full-budget-b
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: billing-account
    app.kubernetes.io/version: "0.1.0"
    hfl.dev/team: "shop"
    team: "shop"
  annotations:
    hfl.dev/id: "budget:b"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  billingAccountRef:
    external: "012345-6789AB-CDEF01"
  displayName: "Budget"
  amount:
    specifiedAmount:
      currencyCode: "EUR"
      nanos: 500000000
      units: 1000
  budgetFilter:
    creditTypesTreatment: "EXCLUDE_ALL_CREDITS"
  allUpdatesRule:
    schemaVersion: "1.0"
    monitoringNotificationChannels:
      - name: full-channel-ops
---
# Source: billing-account/templates/main.yaml
apiVersion: iam.cnrm.cloud.google.com/v1beta1
