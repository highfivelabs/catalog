# Source: billing-account/templates/logging.yaml
apiVersion: logging.gcp.hfl.dev/v1alpha1
kind: LoggingBillingAccountSink
metadata:
  name: sinks-sink-bq
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "sinks"
    app.kubernetes.io/name: billing-account
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "sink:bq"
spec:
  billingAccountRef:
    external: "012345-6789AB-CDEF01"
  resourceID: "bq"
  description: "bq (Terraform-managed)."
  destination:
    bigQueryDatasetRef:
      external: "projects/my-project/datasets/billing_logs"
  filter: "severity=WARNING"
  disabled: false
  bigqueryOptions:
    usePartitionedTables: true
