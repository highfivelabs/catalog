---
# Source: billing-account/templates/main.yaml
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPartialPolicy
metadata:
  name: iam-iam
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "iam"
    app.kubernetes.io/name: billing-account
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "iam"
spec:
  resourceRef:
    apiVersion: billing.cnrm.cloud.google.com/v1beta1
    external: 012345-6789AB-CDEF01
    kind: BillingAccount
  bindings:
    - role: "roles/billing.admin"
      members:
        - member: "group:billing-admins@example.com"
    - role: "roles/billing.costsManager"
      members:
        - member: "group:finance@example.com"
    - role: "roles/billing.viewer"
      members:
        - member: "group:finance@example.com"
    - role: "roles/billing.user"
      members:
        - member: "group:projects@example.com"
      condition:
        title: "expires"
        expression: "request.time < timestamp(\"2027-01-01T00:00:00Z\")"
    - role: "roles/billing.creator"
      members:
        - member: "user:creator@example.com"
---
# Source: billing-account/templates/main.yaml
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: iam-iam-viewer
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "iam"
    app.kubernetes.io/name: billing-account
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "iam-additive-viewer"
spec:
  resourceRef:
    apiVersion: billing.cnrm.cloud.google.com/v1beta1
    external: 012345-6789AB-CDEF01
    kind: BillingAccount
  role: "roles/billing.viewer"
  member: "user:viewer@example.com"
