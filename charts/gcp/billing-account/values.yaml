#
# Values mirror the Terraform variables of fabric's billing-account module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# This chart gives no fixed names: log sinks are named by their keys.
names: {}
# An optional convenience: "<namePrefix>-" in front of each log sink's
# name. Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object; an unprefixed one is a cloud label of
# each notification channel too.
labels: {}
# Cloud labels on every object (notification channels' user labels).
tags: {}
# config-connector-extensions' LoggingBillingAccountSink is v1alpha1:
# logging_sinks render only with allow_alpha: true.
allow_alpha: false
# DELETE (default) or ABANDON (keeps the budgets, channels and sinks).
deletion_policy: DELETE

# Notification channels used by budget alerts.
budget_notification_channels: {}
# Billing budgets. Notification channels are keys of
# budget_notification_channels ("$notification_channels:<key>") or
# channel IDs.
budgets: {}
# Context-specific interpolations. Refused when set: Bundt expressions
# (${...}) and valueFrom replace fabric's $context lookups.
context: {}
# Path to budget data files. Accepted and ignored: a chart cannot read the
# caller's files; put each file's contents under budgets.<file name>.
factories_config: {}
# Billing account ID.
id: ""
# Authoritative IAM, {ROLE => [MEMBERS]}.
iam: {}
# Authoritative IAM bindings, {KEY => {role, members, condition}}.
iam_bindings: {}
# Additive IAM bindings, {KEY => {role, member, condition}}.
iam_bindings_additive: {}
# Authoritative IAM, {PRINCIPAL => [ROLES]}, merged with iam.
iam_by_principals: {}
# Log sinks for the billing account: needs allow_alpha.
logging_sinks: {}
# Projects associated with this billing account. Refused when set: the
# project chart's billing_account sets a project's billing account.
projects: []
