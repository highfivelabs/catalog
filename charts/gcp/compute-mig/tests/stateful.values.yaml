# fabric's README, "Stateful MIGs - Instance Config": one named instance
# with a preserved disk and metadata. fabric's example leaves target_size
# null, which the chart refuses without an autoscaler (tests/no-size.fail.yaml;
# README.md, "The target size"): here it is 1. The README's
# most_disruptive_allowed_action is not one of the variable's attributes
# (Terraform drops it in the type conversion); the attribute is
# most_disruptive_action.
project_id: my-project
location: europe-west8-b
name: mig-test
instance_template: projects/my-project/global/instanceTemplates/nginx-template
target_size: 1
stateful_config:
  instance-1:
    minimal_action: NONE
    most_disruptive_action: REPLACE
    preserved_state:
      disks:
        data-1: {source: projects/my-project/zones/europe-west8-b/disks/test-disk}
      metadata: {foo: bar}
