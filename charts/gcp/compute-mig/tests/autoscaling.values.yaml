# fabric's README, "Autoscaling": a CPU autoscaler (the example also sets
# target_size, which the chart keeps).
project_id: my-project
location: europe-west8-b
name: mig-test
target_size: 3
instance_template: projects/my-project/global/instanceTemplates/nginx-template
autoscaler_config:
  max_replicas: 3
  min_replicas: 1
  cooldown_period: 30
  scaling_signals:
    cpu_utilization: {target: 0.65}
