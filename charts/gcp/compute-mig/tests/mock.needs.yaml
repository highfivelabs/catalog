# What tests/mock.values.yaml needs in the fake cloud: a network, a subnet
# and the instance template the group's versions use. hack/mock-apply.sh
# applies them first, waits for them, and deletes them after the chart's
# objects. Not part of the chart.
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeNetwork
metadata:
  name: catalog-mock-mig-net
  annotations:
    cnrm.cloud.google.com/project-id: mock-project
spec:
  autoCreateSubnetworks: false
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeSubnetwork
metadata:
  name: catalog-mock-mig-sn
  annotations:
    cnrm.cloud.google.com/project-id: mock-project
spec:
  region: us-central1
  ipCidrRange: 10.20.0.0/24
  networkRef:
    name: catalog-mock-mig-net
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeInstanceTemplate
metadata:
  name: catalog-mock-mig
  annotations:
    cnrm.cloud.google.com/project-id: mock-project
spec:
  machineType: e2-micro
  disk:
    - sourceImageRef:
        external: projects/debian-cloud/global/images/family/debian-12
      boot: true
      autoDelete: true
      diskSizeGb: 10
      diskType: pd-standard
  networkInterface:
    - networkRef:
        name: catalog-mock-mig-net
      subnetworkRef:
        name: catalog-mock-mig-sn
