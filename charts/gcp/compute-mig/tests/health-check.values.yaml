# fabric's README, "Health Check and Autohealing Policies": the
# auto-created HTTP health check, logging on, used for auto-healing.
project_id: my-project
location: europe-west8-b
name: mig-test
target_size: 3
instance_template: projects/my-project/global/instanceTemplates/nginx-template
auto_healing_policies: {initial_delay_sec: 30}
health_check_config:
  enable_logging: true
  http: {port: 80}
