# Names in full, labels and tags, as Bundt passes them from a team's naming
# convention (docs/design.md, "Names, labels and tags").
project_id: my-project
location: europe-west8-b
name: mig-test
instance_template: projects/my-project/global/instanceTemplates/nginx-template
names: {group: shop-dev-web, healthCheck: shop-dev-web-hc, autoscaler: shop-dev-web-as}
labels: {hfl.dev/team: shop, hfl.dev/environment: dev}
tags: {team: shop, environment: dev}
auto_healing_policies: {initial_delay_sec: 30}
health_check_config:
  http: {port: 80}
autoscaler_config: {max_replicas: 3, min_replicas: 1}
