---
# Source: compute-mig/templates/autoscaler.yaml
apiVersion: compute.gcp.hfl.dev/v1beta1
kind: ComputeAutoscaler
metadata:
  name: autoscaling
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "autoscaling"
    app.kubernetes.io/name: compute-mig
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "autoscaler"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  projectRef:
    external: "my-project"
  resourceID: "mig-test"
  zone: "europe-west8-b"
  targetRef:
    name: autoscaling
  description: "Terraform managed."
  autoscalingPolicy:
    minReplicas: 1
    maxReplicas: 3
    cooldownPeriod: 30
    mode: "ON"
    cpuUtilization:
      target: 0.65
      predictiveMethod: NONE
---
# Source: compute-mig/templates/main.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeInstanceGroupManager
metadata:
  name: autoscaling
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "autoscaling"
    app.kubernetes.io/name: compute-mig
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "group_manager"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "mig-test"
  projectRef:
    external: "my-project"
  location: "europe-west8-b"
  baseInstanceName: "mig-test"
  description: "Terraform managed."
  targetSize: 3
  versions:
    - name: "default"
      instanceTemplateRef:
        external: "projects/my-project/global/instanceTemplates/nginx-template"
