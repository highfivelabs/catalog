---
# Source: compute-mig/templates/autoscaler.yaml
apiVersion: compute.gcp.hfl.dev/v1beta1
kind: ComputeAutoscaler
metadata:
  name: names
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "names"
    app.kubernetes.io/name: compute-mig
    app.kubernetes.io/version: "0.1.0"
    environment: "dev"
    hfl.dev/environment: "dev"
    hfl.dev/team: "shop"
    team: "shop"
  annotations:
    hfl.dev/id: "autoscaler"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  projectRef:
    external: "my-project"
  resourceID: "shop-dev-web-as"
  zone: "europe-west8-b"
  targetRef:
    name: names
  description: "Terraform managed."
  autoscalingPolicy:
    minReplicas: 1
    maxReplicas: 3
    cooldownPeriod: 60
    mode: "ON"
    cpuUtilization:
      target: 0.6
      predictiveMethod: NONE
---
