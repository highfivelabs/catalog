# Every accepted variable on a zonal group: two versions, named ports,
# target pools, an existing health check for auto-healing beside the
# auto-created one, the update policy's every field, stateful disks and
# instances, and an autoscaler with every signal.
project_id: my-project
location: europe-west8-b
name: mig-full
description: Full MIG.
default_version_name: stable
instance_template: projects/my-project/global/instanceTemplates/nginx-template
target_size: 4
target_pools:
  - https://www.googleapis.com/compute/v1/projects/my-project/regions/europe-west8/targetPools/pool-a
named_ports: {http: 80, https: 443}
auto_healing_policies:
  health_check: projects/my-project/global/healthChecks/existing
  initial_delay_sec: 120
health_check_config:
  check_interval_sec: 10
  description: TCP check.
  healthy_threshold: 2
  timeout_sec: 5
  unhealthy_threshold: 3
  tcp: {port: 8080, proxy_header: NONE, request: ping, response: pong}
update_policy:
  minimal_action: REPLACE
  type: PROACTIVE
  max_surge: {percent: 20}
  max_unavailable: {fixed: 0}
  min_ready_sec: 30
  most_disruptive_action: REPLACE
  regional_redistribution_type: PROACTIVE
  replacement_method: RECREATE
versions:
  canary:
    instance_template: projects/my-project/global/instanceTemplates/nginx-canary
    target_size: {percent: 25}
stateful_disks: {data-1: true, data-2: false}
stateful_config:
  instance-a:
    minimal_action: REFRESH
    most_disruptive_action: REPLACE
    remove_state_on_destroy: true
    preserved_state:
      disks:
        data-1: {source: projects/my-project/zones/europe-west8-b/disks/a1, delete_on_instance_deletion: true, read_only: true}
      metadata: {role: primary, shard: "1"}
autoscaler_config:
  max_replicas: 8
  min_replicas: 2
  cooldown_period: 90
  mode: ONLY_UP
  scaling_control:
    in: {max_replicas_percent: 50, time_window_sec: 300}
  scaling_signals:
    cpu_utilization: {target: 0.7, optimize_availability: true}
    load_balancing_utilization: {target: 0.9}
    metrics:
      - name: pubsub.googleapis.com/subscription/num_undelivered_messages
        type: GAUGE
        single_instance_assignment: 100
        time_series_filter: resource.type = pubsub_subscription AND resource.label.subscription_id = sub
    schedules:
      - name: business-hours
        cron_schedule: "0 8 * * MON-FRI"
        duration_sec: 36000
        min_required_replicas: 4
        description: true
        timezone: Europe/Rome
        disabled: false
labels: {hfl.dev/team: shop}
deletion_policy: ABANDON
