# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set, or accepts only in part. Read by `task
# coverage`; `task coverage-verify` renders the chart to check that each one
# is refused. kind: gap (no Config Connector kind or field), alpha (only a
# v1alpha1 kind), not-ported (Config Connector has it, the chart does not
# map it yet) or by-design (Bundt replaces it). partial: the variable is
# accepted, the reason says what is refused.
refused:
  - variable: all_instances_config
    kind: gap
    reason: "ComputeInstanceGroupManager has no allInstancesConfig field"
  - variable: instance_lifecycle_policy
    kind: gap
    reason: "ComputeInstanceGroupManager has no instanceLifecyclePolicy field"
  - variable: instance_flexibility_policy_selections
    kind: gap
    reason: "ComputeInstanceGroupManager has no instanceFlexibilityPolicy field"
  - variable: wait_for_instances
    kind: gap
    reason: "a Terraform client-side wait for the group's instances; Config Connector has no field for it"
  - variable: autoscaler_config
    kind: gap
    reason: "scaling_control.down beside scaling_control.in: Compute Engine v1, which the autoscaler kinds call, has one scale-in control"
    partial: true
    fields: [scaling_control.down]
