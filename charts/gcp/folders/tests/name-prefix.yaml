#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every object this
# chart renders carries the namePrefix in its cloud-side name, except the
# kinds listed under exempt, each with the reason it cannot collide with
# another Instance's.
exempt:
  IAMPartialPolicy: "binds members on a folder; it has no name of its own"
# A folder's spec.resourceID is the number Google assigns it; its name,
# unique among its siblings, is its display name, which carries the prefix.
nameFields:
  Folder: displayName
