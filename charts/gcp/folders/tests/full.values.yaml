# Every ported input: folders under an organization with a prefix, a
# folder with its own roles, one with the default roles, one with all
# admins only, adoption of an existing folder, ABANDON, labels and tags.
parent: organizations/123456789012
names: [shared, prod, nonprod, sandbox]
prefix: acme
set_roles: true
folder_admin_roles: [roles/resourcemanager.folderViewer, roles/resourcemanager.projectCreator]
per_folder_admins:
  prod:
    members: ["group:prod-admins@example.com", "group:platform@example.com"]
    roles: [roles/resourcemanager.folderAdmin]
  nonprod:
    members: ["user:dev-lead@example.com"]
all_folder_admins: ["group:platform@example.com"]
deletion_protection: true
deletion_policy: ABANDON
resource_ids:
  "folder:shared": "folders/333333333333"
  "folder:prod": "444444444444"
labels: {hfl.dev/team: platform}
tags: {environment: prod}
