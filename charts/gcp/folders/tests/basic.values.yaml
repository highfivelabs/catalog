# The module README's usage example, as values: three folders under a
# folder, each with its own admins, and a security group admin of all.
parent: folders/65552901371
names: [dev, staging, production]
set_roles: true
per_folder_admins:
  dev:
    members: ["group:gcp-developers@domain.com"]
  staging:
    members: ["group:gcp-qa@domain.com"]
  production:
    members: ["group:gcp-ops@domain.com"]
all_folder_admins: ["group:gcp-security@domain.com"]
