# An existing folder (folder_create: false): no Folder is made; IAM, a
# contact, an org policy, a tag binding, a sink and the firewall policy
# association go on folders/1234567890.
folder_create: false
id: folders/1234567890
iam:
  roles/viewer: ["group:viewers@example.org"]
contacts:
  "admins@example.org": [ALL]
org_policies:
  compute.skipDefaultNetworkCreation:
    rules: [{enforce: true}]
tag_bindings:
  env: tagValues/1234567890
firewall_policy: {name: default, policy: "12345"}
logging_sinks:
  audit:
    destination: audit-bucket
    type: storage
