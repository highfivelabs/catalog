# Applied to the fake cloud by hack/mock-apply.sh: a folder under an
# organization with an authoritative role, an additive member and a logging
# exclusion. No org policy: an OrgPolicyPolicy on a new Folder cannot be
# deleted once the Folder object is gone, which the fake cloud's
# delete-everything-at-once step hits (README.md, "Config Connector bugs").
parent: organizations/123450000000
name: catalog-mock-folder
iam:
  roles/viewer: ["group:viewers@example.com"]
iam_bindings_additive:
  browser: {role: roles/browser, member: "user:one@example.com"}
logging_exclusions:
  no-gce: resource.type=gce_instance
