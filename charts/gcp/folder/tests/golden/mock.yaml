  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: folder
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "logging-exclusion:no-gce"
spec:
  resourceID: "no-gce"
