#
# Values mirror the Terraform variables of fabric's folder module (v60.0.0):
# same names, types and defaults, so a module block's arguments become this
# file one to one (README.md, "From Terraform"). values.schema.json carries
# the types and the module's validations.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.folder: the folder's display name in full (at most 30 characters).
# A name set here takes no namePrefix; unset, name.
names: {}
# An optional convenience: "<namePrefix>-" in front of every name the chart
# derives (the display name, sinks, exclusions, entitlements), never one set
# under names. Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. An unprefixed key also becomes a Google
# Cloud label on the resources that take labels, so it must be a valid one.
labels: {}
# Cloud labels on every resource that takes them.
tags: {}

# Cloud Asset Inventory feeds. Refused when set (README.md).
asset_feeds: {}
# Cloud Asset Inventory search configurations. Refused when set (README.md).
asset_search: {}
# Create an Assured Workloads folder instead. Refused when set (README.md).
assured_workload_config: null
# Enable autokey support for this folder's children: {project}.
autokey_config: null
# Hierarchical Cloud Armor policy association. Refused when set (README.md).
cloud_armor_policy: null
# Essential contacts, EMAIL -> [NOTIFICATION_TYPES]: ALL, SUSPENSION,
# SECURITY, TECHNICAL, BILLING, LEGAL, PRODUCT_UPDATES.
contacts: {}
# Context-specific interpolations. Refused when set: Bundt replaces them
# with ${...} expressions in the component's inputs.
context: {}
# Deletion protection setting for this folder. true is refused (README.md).
deletion_protection: false
# Paths to data files for fabric's factories. Refused when set (README.md).
factories_config: {}
# Hierarchical firewall policy to associate to this folder: {name, policy}.
firewall_policy: null
# Create folder. When set to false, uses id to reference an existing folder.
folder_create: true
# IAM: authoritative {ROLE => [MEMBERS]}.
iam: {}
# Authoritative bindings, {KEY => {role, members, condition}}.
iam_bindings: {}
# Additive bindings, {KEY => {role, member, condition}}.
iam_bindings_additive: {}
# Authoritative IAM in {PRINCIPAL => [ROLES]} format.
iam_by_principals: {}
# Additive IAM in {PRINCIPAL => [ROLES]} format.
iam_by_principals_additive: {}
# Authoritative conditional IAM, {PRINCIPAL => {roles, condition}}.
iam_by_principals_conditional: {}
# IAM deny policies. Refused when set (README.md).
iam_deny_policies: {}
# Folder ID in case you use folder_create=false (folders/N).
id: null
# Data access logs, {SERVICE => {ADMIN_READ, DATA_READ, DATA_WRITE}}.
logging_data_access: {}
# Logging exclusions for this folder, {NAME => FILTER}.
logging_exclusions: {}
# Default settings for logging resources. Refused when set (README.md).
logging_settings: null
# Logging sinks to create for the folder.
logging_sinks: {}
# Folder name (its display name).
name: null
# Organization policies applied to this folder keyed by policy name.
org_policies: {}
# Privileged Access Manager entitlements.
pam_entitlements: {}
# Parent in folders/folder_id or organizations/org_id format.
parent: null
# Security Command Center mute configs. Refused when set (README.md).
scc_mute_configs: {}
# Security Health Analytics custom modules. Refused when set (README.md).
scc_sha_custom_modules: {}
# Service agents configuration. Refused when set (README.md).
service_agents_config: {}
# Tag bindings for this folder, in key => tag value id format.
tag_bindings: null

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# cloud resources when the component is deleted. PREVENT has no Config
# Connector equivalent.
deletion_policy: null
