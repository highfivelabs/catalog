---
# Source: gke-cluster-standard/templates/cluster.yaml
apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerCluster
metadata:
  name: mock
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: gke-cluster-standard
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "cluster"
    cnrm.cloud.google.com/project-id: "mock-project"
    cnrm.cloud.google.com/remove-default-node-pool: "true"
spec:
  resourceID: "catalog-mock-gks"
  location: "us-central1-a"
  networkRef:
    external: "projects/mock-project/global/networks/catalog-mock-gks-net"
  subnetworkRef:
    external: "projects/mock-project/regions/us-central1/subnetworks/catalog-mock-gks-sn"
  defaultMaxPodsPerNode: 110
  enableMultiNetworking: false
  enableIntranodeVisibility: false
  enableL4IlbSubsetting: false
  enableShieldedNodes: false
  enableFqdnNetworkPolicy: true
  enableTpu: false
  initialNodeCount: 1
  enableCiliumClusterwideNetworkPolicy: false
  datapathProvider: ADVANCED_DATAPATH
  nodePoolDefaults:
    nodeConfigDefaults:
      gcfsConfig:
        enabled: false
  addonsConfig:
    cloudrunConfig:
      disabled: true
    configConnectorConfig:
      enabled: false
    dnsCacheConfig:
      enabled: true
    gcePersistentDiskCsiDriverConfig:
      enabled: true
    gcpFilestoreCsiDriverConfig:
      enabled: true
    gcsFuseCsiDriverConfig:
      enabled: true
    gkeBackupAgentConfig:
      enabled: false
    horizontalPodAutoscaling:
      disabled: false
    httpLoadBalancing:
      disabled: false
    istioConfig:
      disabled: true
      auth: AUTH_NONE
    kalmConfig:
      enabled: false
    networkPolicyConfig:
      disabled: true
  costManagementConfig:
    enabled: true
  controlPlaneEndpointsConfig:
    dnsEndpointConfig:
      allowExternalTraffic: true
    ipEndpointsConfig:
      enabled: false
  loggingConfig:
    enableComponents: ["SYSTEM_COMPONENTS"]
  maintenancePolicy:
    dailyMaintenanceWindow:
      startTime: "03:00"
  masterAuth:
    clientCertificateConfig:
      issueClientCertificate: false
  monitoringConfig:
    enableComponents: ["SYSTEM_COMPONENTS"]
    managedPrometheus:
      enabled: true
  workloadIdentityConfig:
    workloadPool: "mock-project.svc.id.goog"
