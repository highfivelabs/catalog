# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set, or accepts only in part. Read by `task
# coverage`; `task coverage-verify` renders the chart to check that each one
# is refused.
refused:
  - variable: context
    kind: by-design
    reason: "Bundt replaces fabric's $context lookups with ${...} expressions and valueFrom in the component's inputs"
  - variable: deletion_protection
    kind: by-design
    reason: "accepted and has no effect: it is Terraform's own guard against destroy, and Config Connector has none; deletion_policy: ABANDON keeps the cluster, and a Bundt policy can block deleting it"
    partial: true
  - variable: fleet_project
    kind: gap
    reason: "ContainerCluster has no fleet; GKEHubMembership registers a cluster with a fleet"
  - variable: enable_addons
    kind: gap
    reason: "accepted; agent_sandbox and stateful_ha are refused when true: ContainerCluster's addonsConfig has no agentSandboxConfig or statefulHaConfig"
    partial: true
    fields: [agent_sandbox, stateful_ha]
  - variable: enable_features
    kind: gap
    reason: "accepted; refused when set (or true): anonymous_authentication, dns.additive_vpc_scope_dns_domain, managed_opentelemetry, rbac_binding_config, secret_manager_config, secret_sync_config, which ContainerCluster has no field for"
    partial: true
    fields: [anonymous_authentication, dns.additive_vpc_scope_dns_domain, managed_opentelemetry, rbac_binding_config, secret_manager_config, secret_sync_config]
  - variable: access_config
    kind: gap
    reason: "accepted; dns_access.enable_k8s_certs and ip_access.private_endpoint_authorized_ranges_enforcement are refused when true: ContainerCluster has no enableK8sCertsViaDns or privateEndpointEnforcementEnabled"
    partial: true
    fields: [dns_access.enable_k8s_certs, ip_access.private_endpoint_authorized_ranges_enforcement]
  - variable: cluster_autoscaling
    kind: gap
    reason: "accepted; auto_provisioning_locations, and a disk_type other than pd-standard, are refused: clusterAutoscaling has no autoProvisioningLocations, autoProvisioningDefaults no diskType"
    partial: true
    fields: [auto_provisioning_locations, auto_provisioning_defaults.disk_type]
  - variable: node_config
    kind: gap
    reason: "accepted; kubelet_readonly_port_enabled is refused: neither nodeConfig nor nodePoolDefaults has insecureKubeletReadonlyPortEnabled"
    partial: true
    fields: [kubelet_readonly_port_enabled]
  - variable: node_pool_auto_config
    kind: gap
    reason: "accepted; kubelet_readonly_port_enabled and cgroup_mode are refused: nodePoolAutoConfig has no nodeKubeletConfig or linuxNodeConfig"
    partial: true
    fields: [kubelet_readonly_port_enabled, cgroup_mode]
  - variable: monitoring_config
    kind: gap
    reason: "accepted; advanced_datapath_observability.enable_relay true is refused: ContainerCluster has only the deprecated relayMode, not enableRelay"
    partial: true
    fields: [advanced_datapath_observability.enable_relay]
  - variable: backup_configs
    kind: gap
    reason: "accepted; a channel's deletion_policy PREVENT is refused (no Config Connector equivalent; ABANDON is carried)"
    partial: true
    fields: [backup_channels.deletion_policy, restore_channels.deletion_policy]
    values: [PREVENT]
