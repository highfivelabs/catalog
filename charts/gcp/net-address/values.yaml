#
# Values mirror the Terraform variables of fabric's net-address module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types and the module's validations.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names: none. Every address, endpoint and attachment is named in its own
# entry (its name, else its key), as fabric names them.
names: {}
# An optional convenience: "<namePrefix>-" in front of every address,
# endpoint and attachment name. Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object; an unprefixed key also becomes a
# Google Cloud label on the resources that take labels.
labels: {}
# Cloud labels on every resource that takes them.
tags: {}

# Context-specific interpolations. Refused when set: Bundt's ${...}
# expressions and valueFrom replace fabric's $context lookups.
context: {}
# Map of external addresses, keyed by name:
# {region, description, ipv6: {endpoint_type}, labels, name, subnetwork, tier}.
external_addresses: {}
# Global addresses to create: {description, ipv6 (empty map for IPv6), name}.
global_addresses: {}
# Map of internal addresses to create, keyed by name:
# {region, subnetwork, address, description, ipv6, labels, name, purpose}.
internal_addresses: {}
# Internal addresses used for HA VPN over Cloud Interconnect:
# {address, network, region, prefix_length, description, name}.
ipsec_interconnect_addresses: {}
# PSC network attachments, names as keys: {subnet_self_link,
# automatic_connection, description, producer_accept_lists,
# producer_reject_lists}.
network_attachments: {}
# Project where the addresses will be created.
project_id: ""
# Internal addresses used for Private Service Access:
# {address, network, prefix_length, description, name}.
psa_addresses: {}
# Internal addresses used for Private Service Connect, with an optional
# endpoint: {address, description, name, network, region, subnet_self_link,
# service_attachment: {psc_service_attachment_link, global_access,
# service_directory_registration: {namespace, region}}}.
psc_addresses: {}

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# addresses, endpoints and attachments when the component is deleted.
# PREVENT has no Config Connector equivalent.
deletion_policy: null
