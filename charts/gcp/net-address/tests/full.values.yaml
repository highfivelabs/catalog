# Every kind of address and endpoint the chart carries.
project_id: my-project
external_addresses:
  nlb-v6:
    region: europe-west1
    name: custom-nlb
    description: an IPv6 address
    ipv6: {endpoint_type: NETLB}
    subnetwork: https://www.googleapis.com/compute/v1/projects/my-project/regions/europe-west1/subnetworks/v6
internal_addresses:
  v6: {region: europe-west1, subnetwork: projects/my-project/regions/europe-west1/subnetworks/v6, ipv6: {}, labels: {tier: db}}
psa_addresses:
  cloudsql-mysql: {address: 10.10.10.0, network: projects/my-project/global/networks/my-network, prefix_length: 24}
ipsec_interconnect_addresses:
  vpn-gw-range-1: {address: 10.255.255.0, region: europe-west1, network: projects/my-project/global/networks/my-network, prefix_length: 29, name: custom-range}
network_attachments:
  gce-0:
    subnet_self_link: projects/my-project/regions/europe-west8/subnetworks/gce
    producer_accept_lists: [my-other-project]
  gce-1:
    subnet_self_link: https://www.googleapis.com/compute/v1/projects/my-project/regions/europe-west8/subnetworks/gce
    automatic_connection: true
    description: automatic
    producer_reject_lists: [bad-project]
psc_addresses:
  googleapis:
    address: 10.0.0.32
    network: projects/my-project/global/networks/my-network
    service_attachment: {psc_service_attachment_link: all-apis}
  cloudsql-one:
    address: 10.0.16.32
    subnet_self_link: projects/my-project/regions/europe-west1/subnetworks/default
    region: europe-west1
    service_attachment:
      psc_service_attachment_link: projects/p-tenant/regions/europe-west1/serviceAttachments/sa
      global_access: true
      service_directory_registration: {namespace: my-ns}
  plain: {address: 10.0.0.33, network: projects/my-project/global/networks/my-network}
deletion_policy: ABANDON
