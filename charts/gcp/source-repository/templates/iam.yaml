{{- /*
Copyright 2026 High Five Labs
SPDX-License-Identifier: Apache-2.0
Ported from cloud-foundation-fabric modules/source-repository/iam.tf
(v60.0.0), Copyright 2022 Google LLC, Apache-2.0.

iam and iam_by_principals (google_sourcerepo_repository_iam_binding.authoritative)
and iam_bindings (.bindings) one IAMPartialPolicy (IAMBinding does not take a
SourceRepoRepository), iam_bindings_additive (google_sourcerepo_repository_iam_member.bindings)
one IAMPolicyMember each (docs/design.md, "IAM"). Config Connector's IAM on a
repository supports no conditions: a condition is refused.
*/ -}}
{{- $v := .Values }}
{{- range $k, $b := ($v.iam_bindings | default dict) }}
{{- include "kcc.unsupported" (list $ (printf "iam_bindings.%s.condition" $k) $b.condition "Config Connector's IAM on a SourceRepoRepository does not support conditions") }}
{{- end }}
{{- range $k, $b := ($v.iam_bindings_additive | default dict) }}
{{- include "kcc.unsupported" (list $ (printf "iam_bindings_additive.%s.condition" $k) $b.condition "Config Connector's IAM on a SourceRepoRepository does not support conditions") }}
{{- end }}
{{- include "kcc.iam" (dict "root" $ "base" .Release.Name "idPrefix" "" "resourceRef" (dict "apiVersion" "sourcerepo.cnrm.cloud.google.com/v1beta1" "kind" "SourceRepoRepository" "name" .Release.Name) "v" (dict "iam" $v.iam "iam_by_principals" $v.iam_by_principals "iam_bindings" $v.iam_bindings "iam_bindings_additive" $v.iam_bindings_additive)) }}
