---
# Source: source-repository/templates/main.yaml
apiVersion: cloudbuild.cnrm.cloud.google.com/v1beta1
kind: CloudBuildTrigger
metadata:
  name: names-trigger-build
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "names"
    app.kubernetes.io/name: source-repository
    app.kubernetes.io/version: "0.1.0"
    environment: "dev"
    hfl.dev/environment: "dev"
    hfl.dev/team: "shop"
    team: "shop"
  annotations:
    hfl.dev/id: "trigger:build"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  location: global
  filename: "cloudbuild.yaml"
  triggerTemplate:
    repoRef:
      name: names
    branchName: "main"
---
# Source: source-repository/templates/main.yaml
apiVersion: sourcerepo.cnrm.cloud.google.com/v1beta1
kind: SourceRepoRepository
metadata:
  name: names
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "names"
    app.kubernetes.io/name: source-repository
    app.kubernetes.io/version: "0.1.0"
    environment: "dev"
    hfl.dev/environment: "dev"
    hfl.dev/team: "shop"
    team: "shop"
  annotations:
    hfl.dev/id: "repository"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "shop-dev-app"
