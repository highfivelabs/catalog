#
# Values mirror the Terraform variables of fabric's source-repository module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types and the module's validations.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.repository: the repository's name in full. A name set here takes no
# prefix; unset, the repository is name (with namePrefix in front).
names: {}
# An optional convenience: "<namePrefix>-" in front of the repository's and
# the triggers' names (never one set under names). Empty (the default)
# changes nothing.
namePrefix: ""
# Kubernetes labels on every object. Repositories and triggers take no
# Google Cloud labels, so these stay in Kubernetes.
labels: {}
# Cloud labels on every resource; repositories and triggers take none, so
# these stay in Kubernetes too.
tags: {}

# IAM bindings in {ROLE => [MEMBERS]} format.
iam: {}
# Authoritative IAM bindings in {KEY => {role, members, condition}}. Keys
# are arbitrary.
iam_bindings: {}
# Individual additive IAM bindings ({KEY => {member, role, condition}}).
iam_bindings_additive: {}
# Authoritative IAM binding in {PRINCIPAL => [ROLES]} format. Merged with iam.
iam_by_principals: {}
# Repository name.
name: ""
# Project used for resources.
project_id: ""
# Cloud Build triggers: {NAME => {filename, included_files, service_account,
# substitutions, template: {branch_name, project_id, tag_name}}}.
triggers: {}

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# repository and its triggers when the component is deleted. PREVENT has no
# Config Connector equivalent.
deletion_policy: null
