#
# The Bundt Package for this chart (see iam-service-account/package.yaml).
# Outputs are fabric's declared outputs, selected (docs/design.md,
# "Outputs"). IDs from the rendered objects, as fabric's resources compute
# them; self links from the objects' status. addresses is the address
# given for each subnetwork key (addresses), else null: ComputeForwardingRule
# reports no allocated address (no status field, and spec.ipAddress is not
# written back; the field gap net-lb-ext records). Not outputs: fabric's
# whole objects (backend_service, forwarding_rules, groups, health_check,
# target_proxy).
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: gcp-net-lb-proxy-int-cross-region
spec:
  version: 0.1.0
  engine: helm
  providers: [kcc]
  outputs:
    addresses: >-
      inputs.vpc_config.subnetworks.transformMapEntry(k, v, true,
        {k: inputs.addresses != null && k in inputs.addresses ? dyn(inputs.addresses[k]) : null})
    backend_service_id: >-
      'projects/' + resources.backend_service.metadata.annotations['cnrm.cloud.google.com/project-id']
      + '/global/backendServices/' + resources.backend_service.spec.resourceID
    backend_service_self_link: resources.backend_service.status.selfLink
    group_self_links: >-
      resources.transformMapEntry(k, v, v.kind == 'ComputeInstanceGroup',
        {k.substring(6): v.status.selfLink})
    health_check_id: >-
      'health_check' in resources
      ? dyn('projects/' + resources.health_check.metadata.annotations['cnrm.cloud.google.com/project-id']
        + '/global/healthChecks/' + resources.health_check.spec.resourceID)
      : null
    health_check_self_link: >-
      'health_check' in resources ? dyn(resources.health_check.status.selfLink) : null
    ids: >-
      resources.transformMapEntry(k, v, v.kind == 'ComputeForwardingRule',
        {k.substring(16): 'projects/' + v.metadata.annotations['cnrm.cloud.google.com/project-id']
          + '/global/forwardingRules/' + v.spec.resourceID})
    neg_ids: >-
      resources.transformMapEntry(k, v, v.kind == 'ComputeNetworkEndpointGroup',
        {k.substring(4): 'projects/' + v.metadata.annotations['cnrm.cloud.google.com/project-id']
          + '/zones/' + v.spec.location + '/networkEndpointGroups/' + v.spec.resourceID})
    psc_neg_ids: >-
      resources.transformMapEntry(k, v, v.kind == 'ComputeRegionNetworkEndpointGroup',
        {k.substring(8): 'projects/' + v.metadata.annotations['cnrm.cloud.google.com/project-id']
          + '/regions/' + v.spec.region + '/networkEndpointGroups/' + v.spec.resourceID})
    target_proxy_id: >-
      'projects/' + resources.target_proxy.metadata.annotations['cnrm.cloud.google.com/project-id']
      + '/global/targetTcpProxies/' + resources.target_proxy.spec.resourceID
