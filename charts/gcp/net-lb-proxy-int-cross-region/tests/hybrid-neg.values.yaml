# fabric's README "Hybrid NEG creation": a hybrid NEG with one endpoint.
name: ilb-proxy-test
project_id: my-project
port: 80
vpc_config:
  network: projects/my-project/global/networks/my-vpc
  subnetworks: {europe-west1: projects/my-project/regions/europe-west1/subnetworks/my-subnet-1}
neg_configs:
  hybrid-a:
    hybrid:
      network: projects/my-project/global/networks/my-vpc
      zone: europe-west1-b
      endpoints:
        endpoint-1: {ip_address: 10.10.10.1, port: 80}
backend_service_config:
  backends:
    - {group: hybrid-a, max_connections: {per_endpoint: 100}}
