# fabric's README "Zonal NEG creation": a GCE NEG with no endpoints.
name: ilb-proxy-test
project_id: my-project
port: 80
vpc_config:
  network: projects/my-project/global/networks/my-vpc
  subnetworks: {europe-west1: projects/my-project/regions/europe-west1/subnetworks/my-subnet-1}
neg_configs:
  neg-a:
    gce: {zone: europe-west1-b, network: projects/my-project/global/networks/my-vpc, subnetwork: projects/my-project/regions/europe-west1/subnetworks/my-subnet-1}
backend_service_config:
  backends:
    - {group: neg-a, max_connections: {per_endpoint: 100}}
