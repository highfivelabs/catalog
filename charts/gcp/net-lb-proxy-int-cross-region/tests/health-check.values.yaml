# fabric's README "Health Checks": a TCP check on port 8080 and an existing
# NEG as the backend.
name: ilb-proxy-test
project_id: my-project
port: 80
vpc_config:
  network: projects/my-project/global/networks/my-vpc
  subnetworks: {europe-west1: projects/my-project/regions/europe-west1/subnetworks/my-subnet-1}
backend_service_config:
  backends:
    - group: projects/my-project/zones/europe-west1-b/networkEndpointGroups/my-neg
      max_connections: {per_endpoint: 100}
health_check_config:
  tcp: {port: 8080}
