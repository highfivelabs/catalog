# Source: net-lb-proxy-int-cross-region/templates/backend-service.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeBackendService
metadata:
  name: full
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: net-lb-proxy-int-cross-region
    app.kubernetes.io/version: "0.1.0"
    cost-center: "c42"
    env: "prod"
    hfl.dev/team: "net"
  annotations:
    hfl.dev/id: "backend_service"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: "ilb-proxy-bs"
  location: global
  description: "The backends."
  loadBalancingScheme: INTERNAL_MANAGED
  protocol: TCP
  healthChecks:
    - healthCheckRef:
        name: full
  affinityCookieTtlSec: 60
  connectionDrainingTimeoutSec: 30
  portName: "tcp"
  sessionAffinity: "CLIENT_IP"
  timeoutSec: 45
  backend:
    - balancingMode: "UTILIZATION"
      capacityScaler: 0.5
      description: "the group"
      group:
        instanceGroupRef:
          name: full-group-ig-a
      maxUtilization: 0.8
    - balancingMode: "CONNECTION"
      capacityScaler: 1
      description: "Terraform managed."
      group:
        networkEndpointGroupRef:
          name: full-neg-neg-other
      maxConnectionsPerEndpoint: 50
    - balancingMode: "CONNECTION"
      capacityScaler: 1
      description: "Terraform managed."
      group:
        networkEndpointGroupRef:
          external: "projects/my-project/regions/europe-west1/networkEndpointGroups/ilb-proxy-psc-api"
      maxConnections: 1000
    - balancingMode: "CONNECTION"
      capacityScaler: 1
      description: "Terraform managed."
      group:
        instanceGroupRef:
          external: "projects/my-project/zones/europe-west4-a/instanceGroups/legacy"
      maxConnectionsPerInstance: 10
  logConfig:
    enable: true
    sampleRate: 0.5
