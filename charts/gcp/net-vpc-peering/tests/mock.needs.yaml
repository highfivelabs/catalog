# What tests/mock.values.yaml needs in the fake cloud: the two networks.
# hack/mock-apply.sh applies them first, waits for them, and deletes them
# after the chart's objects. Not part of the chart.
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeNetwork
metadata:
  name: catalog-mock-peer-a
  annotations:
    cnrm.cloud.google.com/project-id: mock-project
spec:
  autoCreateSubnetworks: false
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeNetwork
metadata:
  name: catalog-mock-peer-b
  annotations:
    cnrm.cloud.google.com/project-id: mock-project
spec:
  autoCreateSubnetworks: false
