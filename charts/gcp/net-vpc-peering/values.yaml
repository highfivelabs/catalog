#
# Values mirror the Terraform variables of fabric's net-vpc-peering module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types and the module's validations.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.local, names.peer: the peerings' names in full, as fabric's
# name.local and name.peer are. A name set here takes no prefix; unset,
# fabric's name, else <prefix>-<local network>-<peer network> (and the
# reverse for the peer side), as fabric names them.
names: {}
# An optional convenience: "<namePrefix>-" in front of the peering names,
# fabric's name.local and name.peer included (never one set under names).
# Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. Peerings take no Google Cloud labels,
# so these stay in Kubernetes.
labels: {}
# Cloud labels on every resource; peerings take none, so these stay in
# Kubernetes too.
tags: {}

# Resource link of the network to add a peering to.
local_network: ""
# Optional names for the peering resources ({local, peer}). If not set,
# peering names are generated from the network names.
name: {}
# Create the peering on the remote side too.
peer_create_peering: true
# Resource link of the peer network.
peer_network: ""
# Optional name prefix for the network peerings.
prefix: null
# Import and export of routes for the local and the peer side:
# {local: {export, import, public_export, public_import}, peer: {...}}.
routes_config: {}
# IPV4_ONLY or IPV4_IPV6.
stack_type: null

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# peerings when the component is deleted. PREVENT has no Config Connector
# equivalent.
deletion_policy: null
