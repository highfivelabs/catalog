apiVersion: accesscontextmanager.cnrm.cloud.google.com/v1beta1
kind: AccessContextManagerAccessLevel
metadata:
  name: full-level-corp
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: vpc-sc
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "access_level:corp"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  accessPolicyRef:
    name: full
  resourceID: "corp"
  title: "Corporate devices"
  description: "Managed, encrypted devices"
  basic:
    combiningFunction: "AND"
    conditions:
      - devicePolicy:
          allowedDeviceManagementLevels: ["COMPLETE"]
          allowedEncryptionStatuses: ["ENCRYPTED"]
          requireAdminApproval: true
          requireCorpOwned: true
          requireScreenLock: true
          osConstraints:
            - osType: "DESKTOP_CHROME_OS"
              minimumVersion: "100.0.0"
              requireVerifiedChromeOs: true
        members:
          - serviceAccountRef:
              external: "serviceAccount:ci@my-project.iam.gserviceaccount.com"
          - user: "admin@example.com"
        negate: false
        requiredAccessLevels:
          - name: full-level-geo
          - external: "accessPolicies/12345678/accessLevels/other"
