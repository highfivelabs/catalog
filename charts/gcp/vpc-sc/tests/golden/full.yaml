# Source: vpc-sc/templates/perimeters.yaml
apiVersion: accesscontextmanager.cnrm.cloud.google.com/v1beta1
kind: AccessContextManagerServicePerimeter
metadata:
  name: full-perimeter-main
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: vpc-sc
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "perimeter:main"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  accessPolicyRef:
    name: full
  resourceID: "main"
  title: "Main perimeter"
  description: "Data projects"
  perimeterType: PERIMETER_TYPE_REGULAR
  useExplicitDryRunSpec: true
  spec:
    accessLevels:
      - name: full-level-corp
    resources:
      - projectRef:
          external: "projects/11111"
      - projectRef:
          external: "//compute.googleapis.com/projects/my-project/global/networks/vpc"
    restrictedServices:
      - "storage.googleapis.com"
      - "bigquery.googleapis.com"
    egressPolicies:
      - egressFrom:
          identityType: "ANY_USER_ACCOUNT"
        egressTo:
          operations:
            - serviceName: "bigquery.googleapis.com"
              methodSelectors:
                - method: "*"
          resources:
            - projectRef:
                external: "projects/44444"
      - egressFrom:
          identities:
            - serviceAccountRef:
                external: "serviceAccount:ci@my-project.iam.gserviceaccount.com"
        egressTo:
          externalResources:
            - "s3://bucket-a"
          operations:
            - serviceName: "storage.googleapis.com"
    ingressPolicies:
      - ingressFrom:
          identities:
            - serviceAccountRef:
                external: "serviceAccount:ci@my-project.iam.gserviceaccount.com"
            - user: "admin@example.com"
          sources:
            - accessLevelRef:
                name: full-level-corp
            - projectRef:
                external: "projects/22222"
        ingressTo:
          operations:
            - serviceName: "storage.googleapis.com"
              methodSelectors:
                - method: "google.storage.objects.get"
            - serviceName: "bigquery.googleapis.com"
              methodSelectors:
                - permission: "bigquery.tables.getData"
          resources:
            - projectRef:
                external: "*"
      - ingressFrom:
          identityType: "ANY_IDENTITY"
          sources:
            - accessLevelRef:
                external: "*"
        ingressTo:
          operations:
            - serviceName: "*"
          resources:
            - projectRef:
                external: "projects/33333"
    vpcAccessibleServices:
      enableRestriction: true
      allowedServices:
        - "storage.googleapis.com"
  status:
    resources:
      - projectRef:
          external: "projects/11111"
    restrictedServices:
      - "storage.googleapis.com"
    egressPolicies:
      - egressFrom:
          identityType: "ANY_USER_ACCOUNT"
        egressTo:
          operations:
            - serviceName: "bigquery.googleapis.com"
              methodSelectors:
                - method: "*"
          resources:
            - projectRef:
                external: "projects/44444"
    vpcAccessibleServices:
      enableRestriction: false
