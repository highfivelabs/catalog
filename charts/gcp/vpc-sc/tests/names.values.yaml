# Names in full, labels and tags, as Bundt passes them from a team's naming
# convention (docs/design.md, "Names, labels and tags"): the access policy
# takes its title as given; access levels and perimeters are named by their
# keys; every object carries the labels and tags (Kubernetes only: these
# resources take no Google Cloud labels).
access_policy_create: {parent: organizations/123456, title: policy}
names: {policy: shop-dev-vpcsc}
labels: {hfl.dev/team: shop, hfl.dev/environment: dev}
tags: {team: shop, environment: dev}
access_levels:
  corp: {conditions: [{regions: [DE]}]}
perimeters:
  data:
    status:
      access_levels: ["$access_levels:corp"]
      resources: [projects/11111]
iam:
  roles/accesscontextmanager.policyReader: ["user:auditor@example.com"]
