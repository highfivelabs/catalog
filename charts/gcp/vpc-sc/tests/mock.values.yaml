# Applied to the fake cloud by hack/mock-apply.sh: a created access policy
# (mockgcp takes any organization) with one access level and one perimeter
# around a placeholder project number. The chart has no project_id.
access_policy_create: {parent: organizations/123456789012, title: catalog-mock-vpcsc}
access_levels:
  catalog_mock_level:
    conditions: [{regions: [DE]}]
perimeters:
  catalog_mock_perimeter:
    status:
      access_levels: ["$access_levels:catalog_mock_level"]
      resources: [projects/123456789012]
      restricted_services: [storage.googleapis.com]
