#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every object this
# chart renders carries the namePrefix in its cloud-side name, except the
# kinds listed here, each with the reason it cannot collide with another
# Instance's. A kind added to the chart and not listed fails `task test`
# until it is prefixed or listed.
exempt:
  IAMPartialPolicy: "binds members on the access policy; it has no name of its own"
  IAMPolicyMember: "binds one member on the access policy; it has no name of its own"
# An access policy's resourceID is the number Google assigns it; the name
# the caller gives it, which the namePrefix goes on, is its title.
nameFields:
  AccessContextManagerAccessPolicy: title
compactNames:
  AccessContextManagerAccessLevel: "an access level's name is letters, digits and \"_\", so the namePrefix goes on with its hyphens as underscores"
  AccessContextManagerServicePerimeter: "a perimeter's name is letters, digits and \"_\", so the namePrefix goes on with its hyphens as underscores"
