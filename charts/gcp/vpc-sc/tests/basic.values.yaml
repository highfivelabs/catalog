# An existing access policy with one access level and one enforced
# perimeter around two projects, after the module README's first examples.
access_policy: "12345678"
access_levels:
  a1:
    conditions:
      - members: ["user:user1@example.com"]
  a2:
    combining_function: OR
    conditions:
      - regions: [IT, FR]
      - ip_subnetworks: [101.101.101.0/24]
perimeters:
  p1:
    status:
      access_levels: ["$access_levels:a1", "$access_levels:a2"]
      resources: [projects/11111, projects/111111]
      restricted_services: [storage.googleapis.com]
      vpc_accessible_services:
        allowed_services: [storage.googleapis.com]
        enable_restriction: true
