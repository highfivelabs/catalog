#
# Values mirror the Terraform variables of fabric's iam-service-account
# module (v60.0.0): same names, types and defaults, so a module block's
# arguments become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types and the module's validations.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# Each collision-prone cloud name in full, {serviceAccount}. A name set here
# takes no prefix. A name not set derives from name, as fabric names it.
names: {}
# An optional convenience: "<namePrefix>-" in front of every derived cloud
# name (never one set under names). Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. A prefixed key (hfl.dev/team) stays in
# Kubernetes; an unprefixed one also becomes a Google Cloud label, since
# Config Connector copies it to the resource.
labels: {}
# Cloud labels on every resource: on Google Cloud, labels (Config
# Connector carries them as unprefixed metadata.labels).
tags: {}

# Name of the service account to create (the account ID, before "@").
name: ""
# Prefix applied to service account names.
prefix: null
# Project where the service account is created. null takes the
# namespace's project (cnrm.cloud.google.com/project-id on the namespace).
project_id: null
# Project number of project_id. Unused: Config Connector reads it.
project_number: null
# Display name of the service account to create.
display_name: Terraform-managed.
# Optional description.
description: null
# DELETE (the default) or ABANDON, which keeps the account when the
# component is deleted. PREVENT has no Config Connector equivalent.
deletion_policy: null

# Authoritative IAM on the service account, {ROLE: [MEMBERS]}.
iam: {}
# Authoritative IAM on the service account, {PRINCIPAL: [ROLES]}.
iam_by_principals: {}
# Authoritative bindings with conditions, {KEY: {role, members, condition}}.
iam_bindings: {}
# Additive bindings, {KEY: {member, role, condition}}.
iam_bindings_additive: {}
# Additive bindings, {PRINCIPAL: [ROLES]}.
iam_by_principals_additive: {}

# Roles granted to this service account on other resources (additive),
# {ID: [ROLES]}, and the same with conditions, {KEY: {<id field>, role, condition}}.
iam_billing_roles: {}
iam_billing_bindings: {}
iam_folder_roles: {}
iam_folder_bindings: {}
iam_organization_roles: {}
iam_organization_bindings: {}
iam_project_roles: {}
iam_project_bindings: {}
iam_sa_roles: {}
iam_sa_bindings: {}
iam_storage_roles: {}
iam_storage_bindings: {}

# Not supported (docs/gcp-inventory.md, "Gaps"); kept so tfvars convert
# one to one, and refused when set.
service_account_reuse: null
create_ignore_already_exists: null
tag_bindings: {}
context: {}
