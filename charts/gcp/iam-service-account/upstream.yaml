# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set, or accepts only in part. Read by `task
# coverage`; `task coverage-verify` renders the chart to check that each one
# is refused. kind: gap (no Config Connector kind or field), alpha (only a
# v1alpha1 kind), not-ported (Config Connector has it, the chart does not
# map it yet) or by-design (Bundt replaces it). partial: the variable is
# accepted, the reason says what is refused.
refused:
  - variable: context
    kind: by-design
    reason: "Bundt replaces fabric's $context lookups with ${...} expressions and valueFrom in the component's inputs"
  - variable: create_ignore_already_exists
    kind: by-design
    reason: "Config Connector acquires an account with the same ID anyway"
  - variable: deletion_policy
    kind: gap
    reason: "DELETE and ABANDON only: PREVENT has no Config Connector equivalent (docs/design.md, \"Deletion\")"
    partial: true
    values: [PREVENT]
  - variable: service_account_reuse
    kind: by-design
    reason: "a reused account is not a component: reference it by email where it is used"
  - variable: tag_bindings
    kind: gap
    reason: "a service account's tag binding names its unique ID, known only after apply, and TagsTagBinding has no service account reference (gap 8)"
