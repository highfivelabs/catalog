#
# The Bundt Package for this chart (bundt: specs/catalog/packages.md R6).
# hack/publish.sh pushes the chart and writes spec.source (its OCI
# repository and digest) into the copy it submits; spec.version is the
# chart's version. Outputs mirror the fabric module's outputs, as CEL over
# the live objects, each object bound as resources.<its hfl.dev/id>
# (docs/design.md, "Outputs").
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: gcp-iam-service-account
spec:
  version: 0.4.0
  engine: helm
  providers: [kcc]
  outputs:
    email: resources.service_account.status.email
    iam_email: resources.service_account.status.member
    id: resources.service_account.status.name
    name: resources.service_account.status.email
    unique_id: resources.service_account.status.uniqueId
