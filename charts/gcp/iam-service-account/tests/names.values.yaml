# The account ID in full, labels and tags (docs/design.md, "Names, labels
# and tags"). Service accounts take no cloud labels: the tags stay on the
# objects only.
names: {serviceAccount: shop-dev-runtime}
name: runtime
prefix: ignored
project_id: myproject
labels: {hfl.dev/team: shop}
tags: {team: shop}
iam_project_roles:
  myproject: [roles/logging.logWriter]
