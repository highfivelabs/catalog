---
# Source: iam-service-account/templates/iam.yaml
apiVersion: iam.gcp.hfl.dev/v1beta1
kind: IAMBinding
metadata:
  name: iam-binding-iam-binding-users
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "iam-binding"
    app.kubernetes.io/name: iam-service-account
    app.kubernetes.io/version: "0.4.0"
  annotations:
    hfl.dev/id: "iam-binding-users"
spec:
  resourceRef:
    apiVersion: iam.cnrm.cloud.google.com/v1beta1
    kind: IAMServiceAccount
    name: iam-binding
  role: "roles/iam.serviceAccountUser"
  members:
    - "group:deployers@example.com"
---
# Source: iam-service-account/templates/serviceaccount.yaml
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMServiceAccount
metadata:
  name: iam-binding
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "iam-binding"
    app.kubernetes.io/name: iam-service-account
    app.kubernetes.io/version: "0.4.0"
  annotations:
    hfl.dev/id: "service_account"
    cnrm.cloud.google.com/project-id: "myproject"
spec:
  resourceID: runtime
  displayName: "Terraform-managed."
