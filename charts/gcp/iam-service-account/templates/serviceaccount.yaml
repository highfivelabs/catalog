{{- include "kcc.unsupported" (list $ "service_account_reuse" (not (kindIs "invalid" .Values.service_account_reuse)) "a reused service account is not a component: reference it by email where it is used") }}
{{- include "kcc.unsupported" (list $ "create_ignore_already_exists" .Values.create_ignore_already_exists "Config Connector acquires an existing account with the same resourceID instead") }}
{{- include "kcc.unsupported" (list $ "tag_bindings" .Values.tag_bindings "a service account's tag binding names its unique ID, known only after apply; TagsTagBinding has no service account reference") }}
{{- include "kcc.unsupported" (list $ "context" .Values.context "use Bundt expressions (${...}) and valueFrom in the component's inputs instead") }}
{{- $prefix := ternary "" (printf "%s-" .Values.prefix) (empty .Values.prefix) }}
{{- include "kcc.names" (list $ (list "serviceAccount")) }}
{{- $accountId := include "kcc.resourceName" (list $ "serviceAccount" "service account ID" (printf "%s%s" $prefix (splitList "@" .Values.name | first)) 30 "letter") }}
{{- if not (regexMatch "^[a-z](?:[-a-z0-9]{4,28}[a-z0-9])$" $accountId) }}
{{- fail (printf "iam-service-account: the account ID %q must be 6 to 30 lower-case letters, digits or hyphens, start with a letter and not end with a hyphen" $accountId) }}
{{- end }}
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMServiceAccount
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" .Release.Name "id" "service_account" "project" .Values.project_id "abandon" (include "kcc.abandon" .)) | nindent 2 }}
spec:
  resourceID: {{ $accountId }}
  {{- with .Values.display_name }}
  displayName: {{ . | quote }}
  {{- end }}
  {{- with .Values.description }}
  description: {{ . | quote }}
  {{- end }}
