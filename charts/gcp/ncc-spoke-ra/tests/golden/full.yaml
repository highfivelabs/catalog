# Source: ncc-spoke-ra/templates/main.yaml
apiVersion: compute.gcp.hfl.dev/v1alpha1
kind: ComputeRouterRoutePolicy
metadata:
  name: full-route-policy-import-all
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: ncc-spoke-ra
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "route_policy:import-all"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: "import-all"
  projectRef:
    external: "my-project"
  region: "europe-west1"
  routerRef:
    name: full-router
  type: ROUTE_POLICY_TYPE_IMPORT
  terms:
    - priority: 1
      match:
        expression: "destination == '10.0.0.0/8'"
        title: "rfc1918"
      actions:
        - expression: "accept()"
