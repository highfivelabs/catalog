# Source: ncc-spoke-ra/templates/main.yaml
apiVersion: networkconnectivity.cnrm.cloud.google.com/v1beta1
kind: NetworkConnectivitySpoke
metadata:
  name: full-spoke
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: ncc-spoke-ra
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "spoke_ra"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: "spoke-ra"
  projectRef:
    external: "my-project"
  location: "europe-west1"
  hubRef:
    name: full-hub
  linkedRouterApplianceInstances:
    instances:
      - ipAddress: "10.0.0.3"
        virtualMachineRef:
          external: "projects/my-project/zones/europe-west1-b/instances/router-app-a"
    siteToSiteDataTransfer: true
