# Source: ncc-spoke-ra/templates/main.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeRouter
metadata:
  name: full-router
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: ncc-spoke-ra
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "router"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: "spoke-ra-cr"
  region: "europe-west1"
  networkRef:
    external: "projects/my-project/global/networks/my-vpc"
  bgp:
    asn: 65000
    advertiseMode: CUSTOM
    advertisedGroups: [ALL_SUBNETS]
    advertisedIpRanges:
      - range: "10.254.0.0/24"
        description: "other"
      - range: "10.255.0.0/24"
        description: "onprem"
    keepaliveInterval: 20
