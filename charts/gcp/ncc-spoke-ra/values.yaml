#
# Values mirror the Terraform variables of fabric's ncc-spoke-ra module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types and the module's validations.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.spoke, names.router, names.hub: the spoke's, the Cloud Router's and
# the new hub's names in full. A name set here takes no prefix; unset, the
# spoke is name, the router <name>-cr and the hub hub.name, as fabric
# names them. The router's interfaces and peers are named after the router.
names: {}
# An optional convenience: "<namePrefix>-" in front of every name the chart
# derives (never one set under names). Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object; an unprefixed key also becomes a
# Google Cloud label on the hub and the spoke.
labels: {}
# Cloud labels on every resource that takes them.
tags: {}
# Not a fabric variable: true accepts the v1alpha1 kind route policies need
# (docs/design.md, "Alpha kinds").
allow_alpha: false

# Site-to-site data transfer feature, available only in some regions.
data_transfer: false
# The NCC hub: {create, description, id, name}. Either an existing hub's id,
# or create: true and a name.
hub: {}
# The name of the NCC spoke.
name: ""
# The ID of the project where the NCC hub and spokes will be created.
project_id: ""
# Region where the spoke is located.
region: ""
# Router appliances this spoke is associated with:
# [{internal_ip, vm_self_link, import_policies, export_policies}].
router_appliances: []
# The Cloud Router: {asn, custom_advertise: {all_subnets, ip_ranges},
# ip_interface0, ip_interface1, keepalive, peer_asn, route_policies,
# routes_priority (100)}.
router_config: {}
# Network and subnetwork for the router's interfaces:
# {network_name, subnet_self_link}.
vpc_config: {}

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# hub, spoke, router and route policies when the component is deleted.
# PREVENT has no Config Connector equivalent.
deletion_policy: null
