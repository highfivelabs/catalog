# Packet mirroring rules on a global policy (allow_alpha).
name: mirror
parent_id: my-project
region: global
allow_alpha: true
security_profile_group_ids: {mirror: //networksecurity.googleapis.com/organizations/1/locations/global/securityProfileGroups/mirror}
ingress_mirroring_rules:
  all:
    priority: 100
    security_profile_group: mirror
    target_tags: [tagValues/1]
    match: {source_ranges: [10.0.0.0/8]}
egress_mirroring_rules:
  skip: {priority: 200, action: do_not_mirror, match: {destination_ranges: [10.0.0.0/8]}}
