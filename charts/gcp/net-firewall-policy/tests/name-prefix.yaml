#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every object this
# chart renders carries the namePrefix in its cloud-side name
# (spec.resourceID), except the kinds listed here, each with the reason it
# cannot collide with another Instance's. A kind added to the chart and not
# listed fails `task test` until it is prefixed or listed.
exempt:
  ComputeFirewallPolicyRule: "named by its priority within its policy; it has no name of its own"
  ComputeNetworkFirewallPolicyRule: "named by its priority within its policy; ruleName is a label, not an identifier"
  ComputeRegionNetworkFirewallPolicyRule: "named by its priority within its policy; ruleName is a label, not an identifier"
  ComputeNetworkFirewallPolicyPacketMirroringRule: "named by its priority within its policy; ruleName is a label, not an identifier"
nameFields:
  ComputeFirewallPolicy: shortName
