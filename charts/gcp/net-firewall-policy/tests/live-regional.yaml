# The live case "regional" (LIVE_CHARTS=net-firewall-policy:regional): a
# regional network policy (config-connector-extensions'
# ComputeRegionNetworkFirewallPolicy, its association and rules; v1alpha1,
# so allow_alpha) attached to a network of the run.
name: ${RUN}-rfwp
parent_id: ${PROJECT}
region: ${REGION}
allow_alpha: true
description: catalog live test ${RUN}
attachments: {fwp: projects/${PROJECT}/global/networks/${RUN}-rfwp-net}
ingress_rules:
  allow-iap-ssh: {priority: 1000, match: {source_ranges: [35.235.240.0/20], layer4_configs: [{protocol: tcp, ports: ["22"]}]}}
egress_rules:
  deny-smtp: {priority: 900, action: deny, match: {destination_ranges: [0.0.0.0/0], layer4_configs: [{protocol: tcp, ports: ["25"]}]}}
