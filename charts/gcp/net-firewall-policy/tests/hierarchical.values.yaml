# A hierarchical policy on a folder, after the module README's first
# example.
name: test-1
parent_id: folders/1234567890
attachments: {test: folders/4567890123}
egress_rules:
  smtp:
    priority: 900
    match:
      destination_ranges: [0.0.0.0/0]
      layer4_configs: [{protocol: tcp, ports: ["25"]}]
ingress_rules:
  icmp:
    priority: 1000
    enable_logging: true
    match:
      source_ranges: [0.0.0.0/0]
      layer4_configs: [{protocol: icmp}]
  mgmt:
    priority: 1001
    match: {source_ranges: [10.1.1.0/24, 10.1.2.0/24]}
    target_resources: [projects/my-project/global/networks/vpc]
