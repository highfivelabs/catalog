apiVersion: compute.gcp.hfl.dev/v1beta1
kind: ComputeNetworkFirewallPolicyRule
metadata:
  name: global-rule-egress-smtp-eccb7226
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "global"
    app.kubernetes.io/name: net-firewall-policy
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "rule:egress/smtp"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  firewallPolicyRef:
    name: global-policy
  projectRef:
    external: "my-project"
  priority: 900
  action: "deny"
  direction: EGRESS
  ruleName: "smtp"
  description: "no mail"
  disabled: true
  targetServiceAccounts:
    - external: "app@my-project.iam.gserviceaccount.com"
  match:
    destIPRanges:
    - "0.0.0.0/0"
    destFqdns:
    - "example.com"
    destRegionCodes:
    - "US"
    layer4Configs:
    - ipProtocol: "tcp"
      ports:
        - "25"
