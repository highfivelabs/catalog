apiVersion: compute.gcp.hfl.dev/v1beta1
kind: ComputeNetworkFirewallPolicyRule
metadata:
  name: global-rule-ingress-tagged-04156965
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "global"
    app.kubernetes.io/name: net-firewall-policy
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "rule:ingress/tagged"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  firewallPolicyRef:
    name: global-policy
  projectRef:
    external: "my-project"
  priority: 1000
  action: "deny"
  direction: INGRESS
  ruleName: "tagged"
  disabled: false
  targetSecureTags:
    - name: "tagValues/1"
    - name: "tagValues/2"
  match:
    srcAddressGroups:
    - "projects/my-project/locations/global/addressGroups/ag"
    srcThreatIntelligences:
    - "iplist-known-malicious-ips"
    srcSecureTags:
      - name: "tagValues/3"
    layer4Configs:
    - ipProtocol: "all"
