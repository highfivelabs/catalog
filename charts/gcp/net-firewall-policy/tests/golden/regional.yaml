# Source: net-firewall-policy/templates/main.yaml
apiVersion: compute.gcp.hfl.dev/v1alpha1
kind: ComputeRegionNetworkFirewallPolicyRule
metadata:
  name: regional-rule-ingress-ssh-d292bf2d
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "regional"
    app.kubernetes.io/name: net-firewall-policy
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "rule:ingress/ssh"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  firewallPolicyRef:
    name: regional-policy
  priority: 1000
  action: "allow"
  direction: INGRESS
  ruleName: "ssh"
  disabled: false
  match:
    srcIPRanges:
    - "35.235.240.0/20"
    layer4Configs:
    - ipProtocol: "tcp"
      ports:
        - "22"
