# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set, or accepts only in part. Read by `task
# coverage`; `task coverage-verify` renders the chart to check that each one
# is refused.
refused:
  - variable: context
    kind: by-design
    reason: "Bundt replaces fabric's $context lookups with ${...} expressions and valueFrom in the component's inputs"
  - variable: factories_config
    kind: by-design
    reason: "a chart cannot read the caller's files: accepted and ignored; the rule files' contents go under factories_data.ingress_rules, egress_rules, ingress_mirroring_rules and egress_mirroring_rules, the CIDR file's under factories_data.cidrs"
    partial: true
    fields: [cidr_file_path, egress_rules_file_path, ingress_rules_file_path, ingress_mirroring_rules_file_path, egress_mirroring_rules_file_path]
  - variable: tag_bindings
    kind: gap
    reason: "a network firewall policy's tag binding names the policy by the number the cloud assigns, and TagsLocationTagBinding cannot reference a firewall policy object"
  - variable: ingress_rules
    kind: gap
    reason: "accepted; tls_inspect, security_profile_group and action apply_security_profile_group are refused (the rule kinds have no tlsInspect or securityProfileGroup), and so are target_tags and match.source_tags on a hierarchical policy (ComputeFirewallPolicyRule has no secure tags)"
    partial: true
    fields: [tls_inspect, security_profile_group, target_tags, match.source_tags]
    values: [apply_security_profile_group]
  - variable: egress_rules
    kind: gap
    reason: "accepted; tls_inspect, security_profile_group and action apply_security_profile_group are refused (the rule kinds have no tlsInspect or securityProfileGroup), and so are target_tags and match.source_tags on a hierarchical policy (ComputeFirewallPolicyRule has no secure tags)"
    partial: true
    fields: [tls_inspect, security_profile_group, target_tags, match.source_tags]
    values: [apply_security_profile_group]
  - variable: ingress_mirroring_rules
    kind: alpha
    reason: "ComputeNetworkFirewallPolicyPacketMirroringRule (config-connector-extensions) is v1alpha1: needs allow_alpha: true; tls_inspect and match.source_tags are refused (the kind has no tlsInspect or srcSecureTags)"
    partial: true
    fields: [tls_inspect, match.source_tags]
    needs_allow_alpha: true
  - variable: egress_mirroring_rules
    kind: alpha
    reason: "ComputeNetworkFirewallPolicyPacketMirroringRule (config-connector-extensions) is v1alpha1: needs allow_alpha: true; tls_inspect and match.source_tags are refused (the kind has no tlsInspect or srcSecureTags)"
    partial: true
    fields: [tls_inspect, match.source_tags]
    needs_allow_alpha: true
