# Values mirror the Terraform variables of fabric's net-firewall-policy
# module (v60.0.0): same names, types and defaults, so a module block's
# arguments become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types and the module's validations.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.policy: the policy's name in full (a hierarchical policy's short
# name). A name set here takes no prefix; unset, the policy is named name.
# Associations are <policy name>-<key>, as fabric names them.
names: {}
# An optional convenience: "<namePrefix>-" in front of the policy name, and
# so of the associations' names. Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. Firewall policies and rules take no
# Google Cloud labels, so these stay in Kubernetes.
labels: {}
# Cloud labels on every resource; firewall policies take none, so these
# stay in Kubernetes too.
tags: {}
# Not a fabric variable: true accepts the v1alpha1 kinds a regional policy
# and packet mirroring rules need (docs/design.md, "Alpha kinds").
allow_alpha: false

# Ids of the resources to which this policy will be attached, in
# descriptive name => self link format: folders or the organization for a
# hierarchical policy, VPCs for a network policy.
attachments: {}
# Context-specific interpolations. Refused when set: Bundt's ${...}
# expressions and valueFrom replace fabric's $context lookups.
context: {}
# Policy description.
description: null
# Egress packet mirroring rules (a global network policy), keyed by name:
# {priority, action (mirror), description, disabled, security_profile_group,
# target_tags, tls_inspect, match: {destination_ranges, source_ranges,
# source_tags, layer4_configs}}.
egress_mirroring_rules: {}
# Egress rules, keyed by name: {priority, action (deny), description,
# disabled, enable_logging, security_profile_group, target_resources,
# target_service_accounts, target_tags, tls_inspect, match: {address_groups,
# fqdns, region_codes, threat_intelligences, destination_ranges,
# source_ranges, source_tags, layer4_configs: [{protocol, ports}]}}.
egress_rules: {}
# Paths to the optional factory files. A chart cannot read the caller's
# files: accepted and ignored; their contents go under factories_data.
factories_config: {}
# Not a fabric variable: the factory files' contents, one key per file of
# factories_config: cidrs (cidr_file_path: name => list of ranges),
# ingress_rules, egress_rules, ingress_mirroring_rules and
# egress_mirroring_rules (each a map of rules, as the variables).
factories_data: {}
# Ingress packet mirroring rules (a global network policy), as
# egress_mirroring_rules.
ingress_mirroring_rules: {}
# Ingress rules, keyed by name, as egress_rules (action allow).
ingress_rules: {}
# Policy name.
name: ""
# Parent node where the policy will be created: folders/nnn or
# organizations/nnn for a hierarchical policy, a project ID for a network
# policy.
parent_id: ""
# Policy region. Null for a hierarchical policy, global for a global
# network policy, a region for a regional one (allow_alpha).
region: null
# Security profile group IDs that rules may name by key.
security_profile_group_ids: {}
# Tag bindings for this firewall policy, in key => tag value id format.
tag_bindings: {}

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# policy, its associations and rules when the component is deleted.
# PREVENT has no Config Connector equivalent.
deletion_policy: null
