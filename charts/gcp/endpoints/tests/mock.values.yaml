# The fake-cloud case (hack/mock-apply.sh): a service from an OpenAPI
# document, and one role on it.
allow_alpha: true
project_id: mock-project
service_name: cat-mock-echo.endpoints.mock-project.cloud.goog
openapi_config: {yaml_path: openapi.yaml}
labels: {env: test}
iam:
  roles/servicemanagement.serviceConsumer: ["group:consumers@example.com"]
files_data:
  openapi_config: |
    swagger: "2.0"
    info:
      title: cat-mock-echo
      version: "1.0.0"
    host: cat-mock-echo.endpoints.mock-project.cloud.goog
    paths:
      /echo:
        get:
          operationId: echo
          responses:
            "200":
              description: OK
