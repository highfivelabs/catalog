# Every variable: IAM on several roles (a member twice), ABANDON.
allow_alpha: true
project_id: my-project
service_name: echo.endpoints.my-project.cloud.goog
openapi_config: {yaml_path: openapi.yaml}
iam:
  roles/servicemanagement.serviceController: ["serviceAccount:sa@my-project.iam.gserviceaccount.com"]
  roles/servicemanagement.serviceConsumer: ["group:b@example.com", "group:a@example.com", "group:b@example.com"]
labels: {team: api}
deletion_policy: ABANDON
files_data:
  openapi_config: |
    swagger: "2.0"
    info:
      description: "A simple Google Cloud Endpoints API example."
      title: "Endpoints Example"
      version: "1.0.0"
    host: "echo-api.endpoints.YOUR-PROJECT-ID.cloud.goog"
