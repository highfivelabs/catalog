# fabric's "OpenAPI" example (modules/endpoints/README.md), the file's
# contents under files_data. fabric gives the role without roles/, which the
# IAM API refuses; here it has it.
allow_alpha: true
project_id: my-project
service_name: YOUR-API.endpoints.YOUR-PROJECT-ID.cloud.goog
openapi_config: {yaml_path: configs/endpoints/openapi.yaml}
iam:
  roles/servicemanagement.serviceController:
    - serviceAccount:123456890-compute@developer.gserviceaccount.com
files_data:
  openapi_config: |
    swagger: "2.0"
    info:
      description: "A simple Google Cloud Endpoints API example."
      title: "Endpoints Example"
      version: "1.0.0"
    host: "echo-api.endpoints.YOUR-PROJECT-ID.cloud.goog"
