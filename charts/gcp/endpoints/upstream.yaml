# Module variables the chart keeps in values.yaml but refuses when set, or
# accepts only in part (read by `task coverage`; `task coverage-verify`
# checks each is refused). The whole chart needs allow_alpha: true
# (EndpointsService is v1alpha1).
refused:
  - variable: openapi_config
    kind: by-design
    reason: "a chart cannot read the caller's files: yaml_path is accepted and ignored; the document's contents go under files_data.openapi_config"
    partial: true
    fields: [yaml_path]
  - variable: grpc_config
    kind: by-design
    reason: "a chart cannot read the caller's files: yaml_path and protoc_output_path are accepted and ignored; the files' contents go under files_data.grpc_config and files_data.protoc_output_base64"
    partial: true
    fields: [yaml_path, protoc_output_path]
  - variable: project_id
    kind: by-design
    reason: "accepted; null (fabric's default, the Terraform provider's project) is refused: a chart has no provider project"
    partial: true
