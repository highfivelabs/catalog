#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every object this
# chart renders carries the namePrefix in its cloud-side name
# (spec.resourceID), except the kinds listed here, each with the reason it
# cannot collide with another Instance's. A kind added to the chart and not
# listed fails `task test` until it is prefixed or listed.
exempt:
  LoggingLogView: "a view is named within its bucket, whose ID carries the prefix"
  LoggingLink: "a link is named within its bucket, whose ID carries the prefix"
  TagsTagBinding: "a tag value on the bucket; it has no name of its own"
  IAMBinding: "the members of one role on a view; it has no name of its own"
  IAMMember: "one member of one role on a view; it has no name of its own"
