# Every accepted variable on a project bucket.
parent: my-project
name: mybucket
description: Audit logs.
location: europe-west1
locked: true
retention: 365
deletion_policy: ABANDON
labels: {env: prod}
tag_bindings:
  env: tagValues/1234567890
views:
  stdout:
    filter: LOG_ID("stdout")
    description: stdout only
    location: europe-west1
