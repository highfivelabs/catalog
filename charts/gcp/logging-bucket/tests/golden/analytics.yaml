---
# Source: logging-bucket/templates/main.yaml
apiVersion: logging.cnrm.cloud.google.com/v1beta1
kind: LoggingLink
metadata:
  name: analytics-link
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "analytics"
    app.kubernetes.io/name: logging-bucket
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "link"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  loggingLogBucketRef:
    external: "projects/my-project/locations/global/buckets/mybucket"
  resourceID: "log"
  description: "Log Analytics Dataset"
---
# Source: logging-bucket/templates/main.yaml
apiVersion: logging.cnrm.cloud.google.com/v1beta1
kind: LoggingLogBucket
metadata:
  name: analytics
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "analytics"
    app.kubernetes.io/name: logging-bucket
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "bucket"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  projectRef:
    external: "my-project"
  location: "global"
  resourceID: "mybucket"
  retentionDays: 30
  enableAnalytics: true
