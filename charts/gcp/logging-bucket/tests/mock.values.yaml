# The fake-cloud case (hack/mock-apply.sh): a project bucket with Log
# Analytics and a linked dataset, and a view with a role on it.
parent: mock-project
name: cat-mock-logs
location: us-central1
labels: {env: test}
log_analytics:
  enable: true
  dataset_link_id: cat_mock_logs
views:
  stdout:
    filter: LOG_ID("stdout")
    iam:
      roles/logging.viewAccessor: ["group:auditors@example.com"]
