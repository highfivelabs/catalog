# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set, or accepts only in part. Read by `task
# coverage`; `task coverage-verify` renders the chart to check that each one
# is refused. kind: gap (no Config Connector kind or field), alpha (a
# v1alpha1 kind, accepted with allow_alpha: true) or by-design (Bundt
# replaces it). partial: the variable is accepted, the reason says what is
# refused.
refused:
  - variable: context
    kind: by-design
    reason: "Bundt replaces fabric's $context lookups with ${...} expressions and valueFrom in the component's inputs"
  - variable: kms_key_name
    kind: gap
    reason: "LoggingLogBucket has no cmekSettings, so a bucket cannot be given a CMEK key"
  - variable: views
    kind: gap
    reason: "IAM on a view (iam, iam_bindings, iam_bindings_additive) is accepted on a project's bucket only: config-connector-extensions' IAMBinding and IAMMember take a project's log view only. iam_bindings_additive also needs allow_alpha: true (IAMMember is v1alpha1)"
    partial: true
    fields: [iam, iam_bindings, iam_bindings_additive]
