#
# Values mirror the Terraform variables of fabric's logging-bucket module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.bucket sets the bucket's ID in full (else fabric's: name).
names: {}
# An optional convenience: "<namePrefix>-" in front of the bucket's ID
# when names.bucket is not set. Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object (a log bucket has no cloud labels).
labels: {}
# Kubernetes labels too: a log bucket, its views and its link have no
# cloud labels.
tags: {}
# config-connector-extensions' IAMMember is v1alpha1: a view's
# iam_bindings_additive renders only with allow_alpha: true.
allow_alpha: false
# DELETE (default) or ABANDON (keeps the bucket, its views and its link).
deletion_policy: DELETE

# Context-specific interpolations. Refused when set: Bundt expressions
# (${...}) and valueFrom replace fabric's $context lookups.
context: {}
# Human-readable description for the logging bucket.
description: null
# CMEK key for the bucket. Refused when set: LoggingLogBucket has no
# cmekSettings.
kms_key_name: null
# Location of the bucket.
location: global
# Whether the bucket is locked (project buckets only).
locked: null
# Log Analytics: enable, and a linked BigQuery dataset (project buckets
# only).
log_analytics:
  enable: false
  dataset_link_id: null
  description: Log Analytics Dataset
# Name of the logging bucket.
name: ""
# The parent: a project ID, folders/<id>, organizations/<id> or a billing
# account ID.
parent: ""
# project, folder, organization or billing_account.
parent_type: project
# Retention time in days.
retention: 30
# Tag bindings for the bucket, key => tag value ID.
tag_bindings: {}
# Log views, keyed by view name, with IAM on each.
views: {}
