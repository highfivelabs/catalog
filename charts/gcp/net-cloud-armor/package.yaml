#
# The Bundt Package for this chart (see ../iam-service-account/package.yaml).
# fabric's three outputs: id, the policy's ID as the provider computes it
# (projects/<p>/global/securityPolicies/<name>, or regions/<r>); name, from
# the object (names.policy, else the namePrefix and name); self_link, which
# Config Connector reports.
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: gcp-net-cloud-armor
spec:
  version: 0.1.0
  engine: helm
  providers: [kcc]
  outputs:
    id: >-
      'projects/' + resources.policy.metadata.annotations['cnrm.cloud.google.com/project-id']
        + (has(resources.policy.spec.region) ? '/regions/' + resources.policy.spec.region : '/global')
        + '/securityPolicies/' + resources.policy.spec.resourceID
    name: resources.policy.spec.resourceID
    self_link: resources.policy.status.selfLink
