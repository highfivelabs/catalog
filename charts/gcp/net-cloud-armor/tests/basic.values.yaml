# A global policy with two rules, after the module README's first example.
name: test-premium
parent_id: {project_id: my-project}
rules:
  deny-ip:
    priority: 1000
    action: deny(403)
    match: {src_ip_ranges: [10.0.0.0/8]}
  sqli:
    priority: 2000
    action: deny(403)
    match: {expression: "evaluatePreconfiguredExpr('sqli-v33-stable')"}
