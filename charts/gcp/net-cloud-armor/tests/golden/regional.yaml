apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeSecurityPolicy
metadata:
  name: regional
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "regional"
    app.kubernetes.io/name: net-cloud-armor
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "policy"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "regional-policy"
  region: "europe-west1"
  description: "Terraform managed."
  type: "CLOUD_ARMOR"
  advancedOptionsConfig:
    jsonParsing: "STANDARD"
  rule:
    - priority: 100
      action: "allow"
      preview: false
      match:
        versionedExpr: SRC_IPS_V1
        config:
          srcIpRanges:
            - "203.0.113.0/24"
    - priority: 2147483647
      action: "allow"
      description: "Default rule."
      preview: false
      match:
        versionedExpr: SRC_IPS_V1
        config:
          srcIpRanges:
            - "*"
