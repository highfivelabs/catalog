---
# Source: net-cloud-armor/templates/policy.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeSecurityPolicy
metadata:
  name: basic
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: net-cloud-armor
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "policy"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "test-premium"
  description: "Terraform managed."
  type: "CLOUD_ARMOR"
  rule:
    - priority: 1000
      action: "deny(403)"
      preview: false
      match:
        versionedExpr: SRC_IPS_V1
        config:
          srcIpRanges:
            - "10.0.0.0/8"
    - priority: 2000
      action: "deny(403)"
      preview: false
      match:
        expr:
          expression: "evaluatePreconfiguredExpr('sqli-v33-stable')"
    - priority: 2147483647
      action: "allow"
      description: "Default rule."
      preview: false
      match:
        versionedExpr: SRC_IPS_V1
        config:
          srcIpRanges:
            - "*"
