# Values mirror the Terraform variables of fabric's net-cloud-armor module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types and the module's validations.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.policy: the security policy's name in full. A name set here takes
# no namePrefix; unset, the policy is named name, as fabric names it.
names: {}
# An optional convenience: "<namePrefix>-" in front of the policy's name
# (never one set under names). Empty (the default) changes nothing.
namePrefix: ""
# Cloud labels on the policy. The policy is the only resource.
tags: {}

# Adaptive Protection: {layer_7_ddos_defense: {enable, rule_visibility,
# threshold_configs}}. Global CLOUD_ARMOR policies only; threshold_configs
# is refused (README.md).
adaptive_protection_config: null
# Advanced options: {json_custom_content_types, json_parsing, log_level,
# request_body_inspection_size, user_ip_request_headers};
# request_body_inspection_size is refused (README.md).
advanced_options_config: null
# Hierarchical policy attachments. Refused: hierarchical policies are a gap.
attachments: {}
# Context-specific interpolations. Refused: Bundt expressions replace them.
context: {}
# DDoS protection level (CLOUD_ARMOR_NETWORK). Refused: a gap.
ddos_protection: null
# The default rule at priority 2147483647: {action (allow), description
# (Default rule.), preview (false)}.
default_rule_config: {}
# Policy description.
description: Terraform managed.
# Paths to data files. Unused here: a chart cannot read the caller's files.
# Put the rules file's contents under factories_data.rules instead.
factories_config: {}
# The rules factory's file as data: {rules: CONTENT}, CONTENT exactly
# fabric's rules file (a map of rules as in rules); rules wins on a key in
# both, as fabric merges them.
factories_data:
  rules: {}
# Policy labels (global policies only), with the catalog's meaning:
# Kubernetes labels on the object; an unprefixed key also becomes a Google
# Cloud label, as fabric's labels are.
labels: {}
# Policy name.
name: ""
# The policy's parent: {project_id} (organization_id and folder_id, a
# hierarchical policy, are refused).
parent_id: {}
# reCAPTCHA options: {redirect_site_key}. Global CLOUD_ARMOR policies only.
recaptcha_options_config: null
# Policy region; null or global for a global policy.
region: null
# Policy rules, {KEY: {priority, action, description, preview, match:
# {src_ip_ranges, expression, recaptcha_options}, network_match,
# header_action, preconfigured_waf_config, rate_limit_options,
# redirect_options}}; network_match and match.recaptcha_options are refused.
rules: {}
# Policy type: CLOUD_ARMOR, CLOUD_ARMOR_EDGE, CLOUD_ARMOR_NETWORK or
# CLOUD_ARMOR_INTERNAL_SERVICE.
type: CLOUD_ARMOR
# User-defined fields (CLOUD_ARMOR_NETWORK). Refused: a gap.
user_defined_fields: {}

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# policy when the component is deleted. PREVENT has no Config Connector
# equivalent.
deletion_policy: null
