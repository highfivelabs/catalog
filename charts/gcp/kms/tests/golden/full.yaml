  keyRingRef:
    name: full
  purpose: "ENCRYPT_DECRYPT"
  destroyScheduledDuration: "86400s"
  rotationPeriod: "2592000s"
  versionTemplate:
    algorithm: "GOOGLE_SYMMETRIC_ENCRYPTION"
    protectionLevel: "HSM"
