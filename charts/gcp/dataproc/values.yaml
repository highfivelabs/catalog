#
# Values mirror the Terraform variables of fabric's dataproc module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.cluster: the cluster name in full (at most 51 characters, starting
# with a letter). A name set here takes no namePrefix; unset, name.
names: {}
# An optional convenience: "<namePrefix>-" in front of the cluster name
# (never one set under names). Empty (the default) changes nothing.
namePrefix: ""
# fabric's labels: the cluster's labels, which Dataproc also puts on the
# cluster's VMs. Kubernetes labels on every object; an unprefixed key is
# also a Google Cloud label on the cluster.
labels: {}
# Cloud labels on every resource (the cluster takes them).
tags: {}

# Dataproc cluster config: {graceful_decommission_timeout, cluster_config:
# {...}, virtual_cluster_config: {...}}, as fabric's variable.
dataproc_config: {}
# Cluster name.
name: ""
# Project ID.
project_id: ""
# Dataproc region.
region: ""

# IAM on the cluster (variables-iam.tf).
# Authoritative for the roles listed, {ROLE: [MEMBERS]}.
iam: {}
# {PRINCIPAL: [ROLES]}, merged with iam.
iam_by_principals: {}
# {KEY: {role, members, condition}}.
iam_bindings: {}
# {KEY: {member, role, condition}}, additive.
iam_bindings_additive: {}

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# cluster when the component is deleted. PREVENT has no Config Connector
# equivalent.
deletion_policy: null
