google_dataproc_cluster.cluster: one DataprocCluster, its cluster_config
(on Compute Engine) or virtual_cluster_config (on GKE) mapped field by
field (README.md, "Values"). graceful_decommission_timeout is refused: it
is a parameter of an update call, not of the cluster, and Config Connector
has no field for it.
*/ -}}
{{- $v := .Values }}
{{- $d := $v.dataproc_config | default dict }}
{{- include "kcc.unsupported" (list $ "dataproc_config.graceful_decommission_timeout" $d.graceful_decommission_timeout "DataprocCluster has no graceful decommission timeout (it is a parameter of the update call)") }}
{{- include "kcc.names" (list $ (list "cluster")) }}
{{- $c := $d.cluster_config }}
{{- $vc := $d.virtual_cluster_config }}
---
apiVersion: dataproc.cnrm.cloud.google.com/v1beta1
kind: DataprocCluster
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" .Release.Name "id" "cluster" "project" $v.project_id "abandon" (include "kcc.abandon" .)) | nindent 2 }}
spec:
  resourceID: {{ include "kcc.resourceName" (list $ "cluster" "cluster" $v.name 51 "letter") | quote }}
  location: {{ $v.region | quote }}
  projectRef:
    external: {{ $v.project_id | quote }}
  {{- with $c }}
  config:
    {{- with .staging_bucket }}
    stagingBucketRef:
      external: {{ . | quote }}
    {{- end }}
    {{- with .temp_bucket }}
    tempBucketRef:
      external: {{ . | quote }}
    {{- end }}
    {{- with .gce_cluster_config }}
    gceClusterConfig:
      {{- with .zone }}
      zone: {{ . | quote }}
      {{- end }}
      {{- with .network }}
      networkRef:
        external: {{ . | quote }}
      {{- end }}
      {{- with .subnetwork }}
      subnetworkRef:
        external: {{ . | quote }}
      {{- end }}
      {{- with .service_account }}
      serviceAccountRef:
        external: {{ . | quote }}
      {{- end }}
      {{- with .service_account_scopes }}
      serviceAccountScopes:
      {{- range . }}
        - {{ . | quote }}
      {{- end }}
      {{- end }}
      {{- with .tags }}
      tags:
      {{- range . }}
        - {{ . | quote }}
      {{- end }}
      {{- end }}
      {{- if not (kindIs "invalid" .internal_ip_only) }}
      internalIPOnly: {{ .internal_ip_only }}
      {{- end }}
      {{- with .metadata }}
      metadata:
      {{- range $k, $m := . }}
        {{ $k | quote }}: {{ $m | quote }}
      {{- end }}
      {{- end }}
      {{- with .reservation_affinity }}
      reservationAffinity:
        consumeReservationType: {{ .consume_reservation_type | quote }}
        key: {{ .key | quote }}
        values:
          - {{ .values | quote }}
      {{- end }}
      {{- with .node_group_affinity }}
      nodeGroupAffinity:
        nodeGroupRef:
          external: {{ .node_group_uri | quote }}
      {{- end }}
      {{- with .shielded_instance_config }}
      shieldedInstanceConfig:
        enableSecureBoot: {{ .enable_secure_boot }}
        enableVtpm: {{ .enable_vtpm }}
        enableIntegrityMonitoring: {{ .enable_integrity_monitoring }}
      {{- end }}
      {{- with .confidential_instance_config }}
      confidentialInstanceConfig:
        enableConfidentialCompute: {{ .enable_confidential_compute }}
      {{- end }}
    {{- end }}
    {{- with .master_config }}
    masterConfig:
      {{- include "dataproc.instanceGroup" . | nindent 6 }}
    {{- end }}
    {{- with .worker_config }}
    workerConfig:
      {{- include "dataproc.instanceGroup" . | nindent 6 }}
    {{- end }}
    {{- with .preemptible_worker_config }}
    secondaryWorkerConfig:
      {{- include "dataproc.instanceGroup" . | nindent 6 }}
    {{- end }}
    {{- with .software_config }}
    softwareConfig:
      {{- with .image_version }}
      imageVersion: {{ . | quote }}
      {{- end }}
      {{- with .override_properties }}
      properties:
      {{- range $k, $p := . }}
        {{ $k | quote }}: {{ $p | quote }}
      {{- end }}
      {{- end }}
      {{- with .optional_components }}
      optionalComponents:
      {{- range . }}
        - {{ . | quote }}
      {{- end }}
      {{- end }}
    {{- end }}
    {{- with .security_config }}
    {{- with .kerberos_config }}
    securityConfig:
      kerberosConfig:
        {{- range $tf, $kcc := dict "cross_realm_trust_admin_server" "crossRealmTrustAdminServer" "cross_realm_trust_kdc" "crossRealmTrustKdc" "cross_realm_trust_realm" "crossRealmTrustRealm" "cross_realm_trust_shared_password_uri" "crossRealmTrustSharedPassword" "kdc_db_key_uri" "kdcDbKey" "key_password_uri" "keyPassword" "keystore_uri" "keystore" "keystore_password_uri" "keystorePassword" "realm" "realm" "root_principal_password_uri" "rootPrincipalPassword" "truststore_password_uri" "truststorePassword" "truststore_uri" "truststore" }}
        {{- with (index $.Values.dataproc_config.cluster_config.security_config.kerberos_config $tf) }}
        {{ $kcc }}: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- if not (kindIs "invalid" .enable_kerberos) }}
        enableKerberos: {{ eq (lower (toString .enable_kerberos)) "true" }}
        {{- end }}
        kmsKeyRef:
          external: {{ .kms_key_uri | quote }}
        {{- if not (kindIs "invalid" .tgt_lifetime_hours) }}
        tgtLifetimeHours: {{ int .tgt_lifetime_hours }}
        {{- end }}
    {{- end }}
    {{- end }}
    {{- with .autoscaling_config }}
    autoscalingConfig:
      policyRef:
        external: {{ .policy_uri | quote }}
    {{- end }}
    {{- with .initialization_action }}
    initializationActions:
      - executableFile: {{ .script | quote }}
        {{- if not (kindIs "invalid" .timeout_sec) }}
        executionTimeout: {{ printf "%ss" (toString .timeout_sec | trimSuffix "s") | quote }}
        {{- end }}
    {{- end }}
    {{- with .encryption_config }}
    {{- with .kms_key_name }}
    encryptionConfig:
      gcePdKmsKeyRef:
        external: {{ . | quote }}
    {{- end }}
    {{- end }}
    {{- with .dataproc_metric_config }}
    dataprocMetricConfig:
      metrics:
      {{- range .metrics }}
        - metricSource: {{ .metric_source | quote }}
          {{- with .metric_overrides }}
          metricOverrides:
          {{- range . }}
            - {{ . | quote }}
          {{- end }}
          {{- end }}
      {{- end }}
    {{- end }}
    {{- with .lifecycle_config }}
    lifecycleConfig:
      {{- with .idle_delete_ttl }}
      idleDeleteTtl: {{ . | quote }}
      {{- end }}
      {{- with .auto_delete_time }}
      autoDeleteTime: {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- with .endpoint_config }}
    endpointConfig:
      enableHttpPortAccess: {{ eq (lower (toString .enable_http_port_access)) "true" }}
    {{- end }}
    {{- with .metastore_config }}
    metastoreConfig:
      dataprocMetastoreServiceRef:
        external: {{ .dataproc_metastore_service | quote }}
    {{- end }}
  {{- end }}
  {{- with $vc }}
  virtualClusterConfig:
    {{- with .staging_bucket }}
    stagingBucketRef:
      external: {{ . | quote }}
    {{- end }}
    {{- with .auxiliary_services_config }}
    auxiliaryServicesConfig:
      {{- with .metastore_config }}
      metastoreConfig:
        dataprocMetastoreServiceRef:
          external: {{ .dataproc_metastore_service | quote }}
      {{- end }}
      {{- with .spark_history_server_config }}
      sparkHistoryServerConfig:
        dataprocClusterRef:
          external: {{ .dataproc_cluster | quote }}
      {{- end }}
    {{- end }}
    {{- with .kubernetes_cluster_config }}
    kubernetesClusterConfig:
      {{- with .kubernetes_namespace }}
      kubernetesNamespace: {{ . | quote }}
      {{- end }}
      {{- with .kubernetes_software_config }}
      kubernetesSoftwareConfig:
        componentVersion:
        {{- range $k, $cv := .component_version }}
          {{ $k | quote }}: {{ $cv | quote }}
        {{- end }}
        {{- with .properties }}
        properties:
        {{- range $k, $p := . }}
          {{ $k | quote }}: {{ $p | quote }}
        {{- end }}
        {{- end }}
      {{- end }}
      gkeClusterConfig:
        {{- with .gke_cluster_config.gke_cluster_target }}
        gkeClusterTargetRef:
          external: {{ . | quote }}
        {{- end }}
        {{- with .gke_cluster_config.node_pool_target }}
        nodePoolTarget:
          - nodePoolRef:
              external: {{ .node_pool | quote }}
            roles:
            {{- range .roles }}
              - {{ . | quote }}
            {{- end }}
            {{- with .node_pool_config }}
            nodePoolConfig:
              {{- with .autoscaling }}
              autoscaling:
                {{- if not (kindIs "invalid" .min_node_count) }}
                minNodeCount: {{ .min_node_count }}
                {{- end }}
                {{- if not (kindIs "invalid" .max_node_count) }}
                maxNodeCount: {{ .max_node_count }}
                {{- end }}
              {{- end }}
              config:
                {{- with .config.machine_type }}
                machineType: {{ . | quote }}
                {{- end }}
                {{- if not (kindIs "invalid" .config.preemptible) }}
                preemptible: {{ .config.preemptible }}
                {{- end }}
                {{- if not (kindIs "invalid" .config.local_ssd_count) }}
                localSsdCount: {{ .config.local_ssd_count }}
                {{- end }}
                {{- with .config.min_cpu_platform }}
                minCpuPlatform: {{ . | quote }}
                {{- end }}
                {{- if not (kindIs "invalid" .config.spot) }}
                spot: {{ .config.spot }}
                {{- end }}
              {{- with .locations }}
              locations:
              {{- range . }}
                - {{ . | quote }}
              {{- end }}
              {{- end }}
            {{- end }}
        {{- end }}
    {{- end }}
  {{- end }}
