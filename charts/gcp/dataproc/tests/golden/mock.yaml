---
# Source: dataproc/templates/main.yaml
apiVersion: dataproc.cnrm.cloud.google.com/v1beta1
kind: DataprocCluster
metadata:
  name: mock
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: dataproc
    app.kubernetes.io/version: "0.1.0"
    env: "test"
  annotations:
    hfl.dev/id: "cluster"
    cnrm.cloud.google.com/project-id: "mock-project"
spec:
  resourceID: "catalog-mock-dp"
  location: "us-central1"
  projectRef:
    external: "mock-project"
  config:
    masterConfig:
      numInstances: 1
      machineType: "n2-standard-2"
    softwareConfig:
      properties:
        "dataproc:dataproc.allow.zero.workers": "true"
---
# Source: dataproc/templates/iam.yaml
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPartialPolicy
metadata:
  name: mock-iam
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: dataproc
    app.kubernetes.io/version: "0.1.0"
    env: "test"
  annotations:
    hfl.dev/id: "iam"
spec:
  resourceRef:
    apiVersion: dataproc.cnrm.cloud.google.com/v1beta1
    kind: DataprocCluster
    name: mock
  bindings:
    - role: "roles/dataproc.viewer"
      members:
        - member: "user:dev@example.com"
