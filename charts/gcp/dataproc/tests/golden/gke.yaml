---
# Source: dataproc/templates/main.yaml
apiVersion: dataproc.cnrm.cloud.google.com/v1beta1
kind: DataprocCluster
metadata:
  name: gke
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "gke"
    app.kubernetes.io/name: dataproc
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "cluster"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "my-gke-cluster"
  location: "europe-west8"
  projectRef:
    external: "my-project"
  virtualClusterConfig:
    stagingBucketRef:
      external: "my-staging"
    auxiliaryServicesConfig:
      metastoreConfig:
        dataprocMetastoreServiceRef:
          external: "projects/my-project/locations/europe-west8/services/metastore"
      sparkHistoryServerConfig:
        dataprocClusterRef:
          external: "projects/my-project/regions/europe-west8/clusters/history"
    kubernetesClusterConfig:
      kubernetesNamespace: "dataproc"
      kubernetesSoftwareConfig:
        componentVersion:
          "SPARK": "3.1-dataproc-7"
        properties:
          "spark:spark.eventLog.enabled": "true"
      gkeClusterConfig:
        gkeClusterTargetRef:
          external: "projects/my-project/locations/europe-west8/clusters/gke"
        nodePoolTarget:
          - nodePoolRef:
              external: "projects/my-project/locations/europe-west8/clusters/gke/nodePools/dp"
            roles:
              - "DEFAULT"
            nodePoolConfig:
              autoscaling:
                minNodeCount: 1
                maxNodeCount: 6
              config:
                machineType: "n1-standard-4"
                preemptible: true
                localSsdCount: 0
                spot: false
              locations:
                - "europe-west8-b"
