# A cluster on Compute Engine with every cluster_config field the chart
# carries, and IAM of every kind.
project_id: my-project
name: my-cluster
region: europe-west8
labels: {env: prod}
dataproc_config:
  cluster_config:
    staging_bucket: my-staging
    temp_bucket: my-temp
    gce_cluster_config:
      zone: europe-west8-b
      network: projects/my-project/global/networks/vpc
      subnetwork: projects/my-project/regions/europe-west8/subnetworks/subnet
      service_account: dataproc@my-project.iam.gserviceaccount.com
      service_account_scopes: [cloud-platform]
      tags: [dataproc]
      internal_ip_only: true
      metadata: {enable-oslogin: "true"}
      reservation_affinity: {consume_reservation_type: SPECIFIC_RESERVATION, key: compute.googleapis.com/reservation-name, values: my-reservation}
      node_group_affinity: {node_group_uri: projects/my-project/zones/europe-west8-b/nodeGroups/ng}
      shielded_instance_config: {enable_secure_boot: true, enable_vtpm: true, enable_integrity_monitoring: true}
      confidential_instance_config: {enable_confidential_compute: false}
    master_config:
      num_instances: 1
      machine_type: n2-standard-4
      min_cpu_platform: Intel Cascade Lake
      image_uri: projects/my-project/global/images/dataproc
      disk_config: {boot_disk_type: pd-ssd, boot_disk_size_gb: 100, num_local_ssds: 0}
      accelerators: {accelerator_type: nvidia-tesla-t4, accelerator_count: 1}
    worker_config:
      num_instances: 2
      machine_type: n2-standard-4
      min_cpu_platform: Intel Cascade Lake
      image_uri: projects/my-project/global/images/dataproc
      disk_config: {boot_disk_type: pd-standard, boot_disk_size_gb: 200, num_local_ssds: 1}
    preemptible_worker_config:
      num_instances: 2
      preemptibility: SPOT
      disk_config: {boot_disk_type: pd-standard, boot_disk_size_gb: 100, num_local_ssds: 0}
    software_config:
      image_version: "2.2"
      override_properties: {"dataproc:dataproc.allow.zero.workers": "true"}
      optional_components: [JUPYTER]
    security_config:
      kerberos_config:
        enable_kerberos: "true"
        kms_key_uri: projects/my-project/locations/europe-west8/keyRings/ring/cryptoKeys/key
        root_principal_password_uri: gs://secrets/root-password.encrypted
        realm: EXAMPLE.COM
        tgt_lifetime_hours: "10"
    autoscaling_config: {policy_uri: projects/my-project/regions/europe-west8/autoscalingPolicies/policy}
    initialization_action: {script: gs://scripts/init.sh, timeout_sec: "500"}
    encryption_config: {kms_key_name: projects/my-project/locations/europe-west8/keyRings/ring/cryptoKeys/key}
    lifecycle_config: {idle_delete_ttl: 3600s}
    endpoint_config: {enable_http_port_access: "true"}
    dataproc_metric_config:
      metrics: [{metric_source: SPARK, metric_overrides: ["spark:driver:DAGScheduler:job.allJobs"]}]
    metastore_config: {dataproc_metastore_service: projects/my-project/locations/europe-west8/services/metastore}
iam:
  roles/dataproc.viewer: ["group:viewers@example.com"]
iam_by_principals:
  "group:editors@example.com": [roles/dataproc.editor]
iam_bindings:
  cond:
    role: roles/dataproc.editor
    members: ["group:temp@example.com"]
    condition: {title: until-2027, expression: "request.time < timestamp('2027-01-01T00:00:00Z')"}
iam_bindings_additive:
  one: {member: "user:one@example.com", role: roles/dataproc.viewer}
deletion_policy: ABANDON
