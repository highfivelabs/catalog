#
# The Bundt Package for this chart (see iam-service-account/package.yaml).
# fabric's two outputs, computed from inputs (names.cluster when it is
# set): name is the cluster's name, id its
# projects/<project>/regions/<region>/clusters/<name>.
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: gcp-dataproc
spec:
  version: 0.1.0
  engine: helm
  providers: [kcc]
  outputs:
    name: >-
      ('cluster' in inputs.names && inputs.names.cluster != '' ? inputs.names.cluster : (inputs.namePrefix != '' ? inputs.namePrefix + '-' : '') + inputs.name)
    id: >-
      'projects/' + inputs.project_id + '/regions/' + inputs.region + '/clusters/' +
      ('cluster' in inputs.names && inputs.names.cluster != '' ? inputs.names.cluster : (inputs.namePrefix != '' ? inputs.namePrefix + '-' : '') + inputs.name)
