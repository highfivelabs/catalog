#
# Values mirror the Terraform variables of fabric's data-catalog-policy-tag
# module (v60.0.0): same names, types and defaults, so a module block's
# arguments become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types and the module's validations.

# Names and labels (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.taxonomy: the taxonomy's display name in full (unique in the
# organization; the cloud assigns its ID). A name set here takes no
# namePrefix; unset, name.
names: {}
# An optional convenience: "<namePrefix>-" in front of the taxonomy's
# display name (never one set under names). Empty (the default) changes
# nothing.
namePrefix: ""
# Kubernetes labels on every object. Taxonomies and policy tags take no
# Google Cloud labels, so these stay in Kubernetes.
labels: {}

# A list of policy types that are activated for this taxonomy:
# FINE_GRAINED_ACCESS_CONTROL or POLICY_TYPE_UNSPECIFIED.
activated_policy_types: [FINE_GRAINED_ACCESS_CONTROL]
# Context-specific interpolations. Not supported: Bundt's ${...}
# expressions and valueFrom replace fabric's $context lookups.
context: {}
# Description of this taxonomy.
description: Taxonomy - Terraform managed
# Paths to the optional factory's files. Unused here: a chart cannot read
# the caller's files. Put the taxonomy file's contents under
# factories_data.taxonomy instead (README.md, "Values").
factories_config: {}
# Data Catalog Taxonomy location.
location: ""
# Name (display name) of this taxonomy.
name: ""
# GCP project id.
project_id: ""
# Policy tags, {TAG: {description, iam: {ROLE: [MEMBERS]}, iam_bindings,
# iam_bindings_additive}}. Not cloud labels: fabric's own variable.
tags: {}

# IAM on the taxonomy (variables-iam.tf).
# Authoritative for the roles listed, {ROLE: [MEMBERS]}.
iam: {}
# {PRINCIPAL: [ROLES]}, merged with iam.
iam_by_principals: {}
# {KEY: {role, members, condition}}.
iam_bindings: {}
# {KEY: {member, role, condition}}, additive.
iam_bindings_additive: {}

# Not a fabric variable: the taxonomy factory file's content, exactly as
# the file at factories_config.taxonomy holds it ({description, tags, iam,
# iam_bindings, iam_bindings_additive}); merged as fabric merges the file.
factories_data:
  taxonomy: {}
# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# taxonomy and its tags when the component is deleted. PREVENT has no
# Config Connector equivalent.
deletion_policy: null
