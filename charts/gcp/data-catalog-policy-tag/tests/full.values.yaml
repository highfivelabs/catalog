# Every field the chart carries: the taxonomy's IAM of every kind, tags with
# their own IAM, a description, and policy types.
project_id: my-project
location: europe-west1
name: classification
description: Data classification
activated_policy_types: [FINE_GRAINED_ACCESS_CONTROL, POLICY_TYPE_UNSPECIFIED]
labels: {hfl.dev/team: data}
iam:
  roles/datacatalog.categoryAdmin: ["group:data-admins@example.com"]
iam_by_principals:
  "group:data-stewards@example.com": [roles/datacatalog.categoryAdmin, roles/datacatalog.viewer]
iam_bindings:
  viewers:
    role: roles/datacatalog.viewer
    members: ["group:analysts@example.com"]
    condition: {title: weekdays, expression: "request.time.getDayOfWeek() < 5"}
iam_bindings_additive:
  auditor: {member: "user:auditor@example.com", role: roles/datacatalog.viewer}
tags:
  low: {description: Low sensitivity}
  high:
    iam:
      roles/datacatalog.categoryFineGrainedReader: ["group:high-readers@example.com"]
    iam_bindings:
      cond:
        role: roles/datacatalog.categoryFineGrainedReader
        members: ["group:temp@example.com"]
        condition: {title: until-2027, expression: "request.time < timestamp('2027-01-01T00:00:00Z')", description: temporary}
    iam_bindings_additive:
      one: {member: "user:one@example.com", role: roles/datacatalog.categoryFineGrainedReader}
deletion_policy: ABANDON
