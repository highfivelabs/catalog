#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every object this
# chart renders carries the namePrefix in its cloud-side name
# (spec.resourceID), except the kinds listed here, each with the reason it
# cannot collide with another Instance's. A kind added to the chart and not
# listed fails `task test` until it is prefixed or listed.
exempt:
  DataCatalogPolicyTag: "its display name is unique only within its taxonomy, whose display name carries the prefix"
  IAMPartialPolicy: "binds members on the taxonomy or a policy tag; it has no name of its own"
  IAMPolicyMember: "binds one member on the taxonomy or a policy tag; it has no name of its own"
# A taxonomy's resourceID is the ID the cloud assigns it; the name the
# caller gives it, unique in the organization, which the namePrefix goes on,
# is displayName.
nameFields:
  DataCatalogTaxonomy: displayName
