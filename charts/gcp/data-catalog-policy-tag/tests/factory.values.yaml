# The taxonomy factory: the file fabric reads from factories_config.taxonomy,
# as data. Its description and IAM merge with the variables', its tags too
# (the file's tag wins).
project_id: my-project
location: eu
name: factory
factories_config: {taxonomy: data/taxonomy.yaml}
tags:
  low: {}
  high: {description: from the variable}
factories_data:
  taxonomy:
    description: From the factory
    iam:
      roles/datacatalog.viewer: ["group:viewers@example.com"]
    tags:
      high:
        description: from the file
        iam:
          roles/datacatalog.categoryFineGrainedReader: ["group:high@example.com"]
      critical: {}
