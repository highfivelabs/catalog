apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPartialPolicy
metadata:
  name: full-tag-high-iam
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: data-catalog-policy-tag
    app.kubernetes.io/version: "0.1.0"
    hfl.dev/team: "data"
  annotations:
    hfl.dev/id: "tag:high/iam"
spec:
  resourceRef:
    apiVersion: datacatalog.cnrm.cloud.google.com/v1beta1
    kind: DataCatalogPolicyTag
    name: full-tag-high
  bindings:
    - role: "roles/datacatalog.categoryFineGrainedReader"
      members:
        - member: "group:high-readers@example.com"
    - role: "roles/datacatalog.categoryFineGrainedReader"
      members:
        - member: "group:temp@example.com"
      condition:
        title: "until-2027"
        expression: "request.time < timestamp('2027-01-01T00:00:00Z')"
        description: "temporary"
