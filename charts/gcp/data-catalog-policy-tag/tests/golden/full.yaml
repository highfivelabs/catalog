# Source: data-catalog-policy-tag/templates/iam.yaml
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPartialPolicy
metadata:
  name: full-iam
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: data-catalog-policy-tag
    app.kubernetes.io/version: "0.1.0"
    hfl.dev/team: "data"
  annotations:
    hfl.dev/id: "iam"
spec:
  resourceRef:
    apiVersion: datacatalog.cnrm.cloud.google.com/v1beta1
    kind: DataCatalogTaxonomy
    name: full
  bindings:
    - role: "roles/datacatalog.categoryAdmin"
      members:
        - member: "group:data-admins@example.com"
        - member: "group:data-stewards@example.com"
    - role: "roles/datacatalog.viewer"
      members:
        - member: "group:data-stewards@example.com"
    - role: "roles/datacatalog.viewer"
      members:
        - member: "group:analysts@example.com"
      condition:
        title: "weekdays"
        expression: "request.time.getDayOfWeek() < 5"
