#
# The Bundt Package for this chart (see iam-service-account/package.yaml).
# fabric's two outputs, read from the live objects because the cloud
# assigns a taxonomy's and a policy tag's ID: id is the taxonomy's full
# resource name (projects/<project>/locations/<location>/taxonomies/<id>),
# tags each policy tag's (.../policyTags/<id>), keyed by tag.
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: gcp-data-catalog-policy-tag
spec:
  version: 0.1.0
  engine: helm
  providers: [kcc]
  outputs:
    id: resources.taxonomy.status.name
    tags: >-
      resources.transformMapEntry(k, v, v.kind == 'DataCatalogPolicyTag', {k.substring(4): v.status.name})
