google_data_catalog_taxonomy.default: one DataCatalogTaxonomy, its
description the factory file's when it has one;
google_data_catalog_policy_tag.default: a DataCatalogPolicyTag per tag of
tags merged with the factory file's (README.md, "Values"). Their IAM is in
iam.yaml.
*/ -}}
{{- $v := .Values }}
{{- include "kcc.unsupported" (list $ "context" $v.context "use Bundt expressions (${...}) and valueFrom in the component's inputs instead") }}
{{- include "kcc.names" (list $ (list "taxonomy")) }}
{{- $abandon := include "kcc.abandon" . }}
{{- $f := $v.factories_data.taxonomy | default dict }}
{{- $description := ternary $f.description $v.description (hasKey $f "description") }}
---
apiVersion: datacatalog.cnrm.cloud.google.com/v1beta1
kind: DataCatalogTaxonomy
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" .Release.Name "id" "taxonomy" "project" $v.project_id "abandon" $abandon) | nindent 2 }}
spec:
  projectRef:
    external: {{ $v.project_id | quote }}
  region: {{ $v.location | quote }}
  displayName: {{ include "kcc.resourceName" (list $ "taxonomy" "taxonomy" $v.name 200) | quote }}
  {{- if not (kindIs "invalid" $description) }}
  description: {{ $description | quote }}
  {{- end }}
  {{- with $v.activated_policy_types }}
  activatedPolicyTypes:
  {{- range . }}
    - {{ . | quote }}
  {{- end }}
  {{- end }}
{{- range $k, $t := (include "dataCatalogPolicyTag.tags" . | fromJson) }}
---
apiVersion: datacatalog.cnrm.cloud.google.com/v1beta1
kind: DataCatalogPolicyTag
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "tag" $k)) "id" (printf "tag:%s" $k) "project" $v.project_id "abandon" $abandon) | nindent 2 }}
spec:
  taxonomyRef:
    name: {{ $.Release.Name }}
  displayName: {{ $k | quote }}
  description: {{ $t.description | default (printf "%s - Terraform managed." $k) | quote }}
{{- end }}
