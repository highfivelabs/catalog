# fabric's README example "Create vault and plan" (modules/backup-dr/
# README.md, v60.0.0): a vault and one plan with an hourly and a monthly
# rule.
project_id: your-gcp-project-id
location: us-central1
name: backup-vault
backup_plans:
  my-backup-plan:
    resource_type: compute.googleapis.com/Instance
    description: Backup Plan for GCE Instances.
    backup_rules:
      - rule_id: daily-backup-rule
        backup_retention_days: 30
        standard_schedule:
          recurrence_type: HOURLY
          hourly_frequency: 6
          time_zone: America/Los_Angeles
          backup_window: {start_hour_of_day: 1, end_hour_of_day: 5}
      - rule_id: monthly-backup-rule
        backup_retention_days: 30
        standard_schedule:
          recurrence_type: MONTHLY
          time_zone: America/Los_Angeles
          week_day_of_month: {week_of_month: FIRST, day_of_week: MONDAY}
          backup_window: {start_hour_of_day: 1, end_hour_of_day: 5}
