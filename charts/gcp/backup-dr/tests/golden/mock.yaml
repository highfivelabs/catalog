# Source: backup-dr/templates/main.yaml
apiVersion: backupdr.gcp.hfl.dev/v1beta1
kind: BackupDRManagementServer
metadata:
  name: mock-management-server
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: backup-dr
    app.kubernetes.io/version: "0.1.0"
    env: "test"
  annotations:
    hfl.dev/id: "management_server"
    cnrm.cloud.google.com/project-id: "mock-project"
spec:
  projectRef:
    external: "projects/mock-project"
  location: "us-central1"
  resourceID: "catalog-mock-ms"
  type: "BACKUP_RESTORE"
  networks:
    - network: "projects/mock-project/global/networks/default"
      peeringMode: "PRIVATE_SERVICE_ACCESS"
