# fabric's README example "Create only backup plan with existing vault":
# vault_reuse with a vault ID, which the plan's reference expands to the
# vault's name in the location.
project_id: your-gcp-project-id
location: us-central1
vault_reuse: {vault_id: backup-vault-test}
backup_plans:
  my-backup-plan:
    resource_type: compute.googleapis.com/Instance
    description: Backup Plan for GCE Instances.
    backup_rules:
      - rule_id: daily-backup-rule
        backup_retention_days: 30
        standard_schedule:
          recurrence_type: HOURLY
          hourly_frequency: 6
          time_zone: America/Los_Angeles
          backup_window: {start_hour_of_day: 1, end_hour_of_day: 5}
