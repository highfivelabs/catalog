# Applied to the fake cloud by hack/mock-apply.sh: a vault, a plan in it
# and a management server.
project_id: mock-project
location: us-central1
name: catalog-mock-vault
labels: {env: test}
backup_plans:
  catalog-mock-plan:
    resource_type: compute.googleapis.com/Instance
    backup_rules:
      - rule_id: daily
        backup_retention_days: 7
        standard_schedule:
          recurrence_type: DAILY
          time_zone: UTC
          backup_window: {start_hour_of_day: 1, end_hour_of_day: 5}
management_server_config:
  name: catalog-mock-ms
  network_config: {network: projects/mock-project/global/networks/default}
