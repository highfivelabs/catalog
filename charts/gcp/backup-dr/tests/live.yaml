# The live case (hack/live-apply.sh LIVE_CHARTS=backup-dr, with
# LIVE_TIMEOUT=4200: a management server takes most of an hour): a vault,
# a plan in it, and a management server (config-connector-extensions'
# BackupDRManagementServer) on a network of the run with private services
# access (live.extra.yaml).
project_id: ${PROJECT}
location: ${REGION}
name: ${RUN}-vault
labels: {catalog-run: ${RUN}}
vault_config:
  description: catalog live test ${RUN}
  backup_minimum_enforced_retention_duration: 86400s
backup_plans:
  ${RUN}-plan:
    resource_type: compute.googleapis.com/Instance
    description: catalog live test ${RUN}
    backup_rules:
      - rule_id: daily
        backup_retention_days: 1
        standard_schedule:
          recurrence_type: DAILY
          time_zone: UTC
          backup_window: {start_hour_of_day: 1, end_hour_of_day: 5}
management_server_config:
  name: ${RUN}-ms
  network_config: {network: projects/${PROJECT}/global/networks/${RUN}-bdr-net}
