#
# Values mirror the Terraform variables of fabric's backup-dr module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.vault sets the vault's name in full (else name), and
# names.managementServer the management server's (else
# management_server_config.name). Backup plans are named by their keys.
names: {}
# An optional convenience: "<namePrefix>-" in front of every name not set
# under names. Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object; an unprefixed key also becomes a
# Google Cloud label on the vault and the management server.
labels: {}
# Cloud labels on every resource (Google Cloud labels).
tags: {}

# Map of Backup Plans to create in this Vault.
backup_plans: {}
# Location for the Backup Vault and Plans (e.g. us-central1).
location: ""
# Configuration to create a Management Server. If null, no server is
# created.
management_server_config: null
# Name of the Backup Vault to create. Leave null if reusing an existing
# vault via `vault_reuse`.
name: null
# Project ID.
project_id: ""
# Configuration for the Backup Vault. Only used if `vault_reuse` is null.
vault_config: {}
# Configuration to reuse an existing Backup Vault.
vault_reuse: null

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# vault, plans and management server when the component is deleted.
# PREVENT has no Config Connector equivalent.
deletion_policy: null
