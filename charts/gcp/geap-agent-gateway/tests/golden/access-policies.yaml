# Source: geap-agent-gateway/templates/access-policies.yaml
apiVersion: iam.gcp.hfl.dev/v1beta1
kind: IAMAccessPolicy
metadata:
  name: access-policies-access-policy-agents
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "access-policies"
    app.kubernetes.io/name: geap-agent-gateway
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "access_policy:agents"
    cnrm.cloud.google.com/project-id: "my-project-id"
spec:
  resourceID: "agents"
  projectRef:
    external: "my-project-id"
  location: global
  displayName: "Agents egress"
  annotations:
    "owner": "platform"
  details:
    rules:
      - effect: "ALLOW"
        principals:
          - "principalSet://goog/public:all"
        operation:
          permissions:
            - "iap.googleapis.com/resources.egressViaIAP"
        conditions:
          "iap.googleapis.com":
            expression: "request.time < timestamp('2027-01-01T00:00:00Z')"
      - effect: "DENY"
        principals:
          - "principalSet://goog/public:all"
        excludedPrincipals:
          - "principal://goog/subject/two@example.com"
        operation:
          permissions:
            - "iap.googleapis.com/resources.egressViaIAP"
          excludedPermissions:
            - "iap.googleapis.com/resources.other"
        conditions:
          "iap.googleapis.com":
            expression: "destination.agent_registry.mcp_server.name == 'projects/other/locations/us-central1/mcpServers/tools'"
      - effect: "ALLOW"
        description: "One agent."
        principals:
          - "principal://goog/subject/one@example.com"
        operation:
          permissions:
            - "iap.googleapis.com/resources.egressViaIAP"
        conditions:
          "iap.googleapis.com":
            expression: "destination.agent_registry.agent.name == 'projects/my-project-id/locations/europe-west1/agents/my-agent'"
      - effect: "ALLOW"
        principals:
          - "principalSet://goog/group/agents@example.com"
          - "principal://iam.googleapis.com/projects/-/serviceAccounts/agent@my-project-id.iam.gserviceaccount.com"
        operation:
          permissions:
            - "iap.googleapis.com/resources.egressViaIAP"
        conditions:
          "iap.googleapis.com":
            expression: "destination.is_registered == true && destination.agent_registry.location in ['europe-west1', 'us-central1']"
---
