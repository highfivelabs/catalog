apiVersion: networkservices.gcp.hfl.dev/v1alpha1
kind: NetworkServicesAgentGateway
metadata:
  name: access-policies
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "access-policies"
    app.kubernetes.io/name: geap-agent-gateway
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "gateway"
    cnrm.cloud.google.com/project-id: "my-project-id"
spec:
  projectRef:
    external: "my-project-id"
  location: "europe-west1"
  resourceID: "my-gateway"
  description: "Terraform managed."
  registries:
    - "projects/my-project-id/locations/europe-west1"
    - "projects/my-project-id/locations/us-central1"
  googleManaged:
    governedAccessPath: AGENT_TO_ANYWHERE
