apiVersion: networkservices.gcp.hfl.dev/v1alpha1
kind: NetworkServicesAgentConnectivityTemplate
metadata:
  name: full-template
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: geap-agent-gateway
    app.kubernetes.io/version: "0.3.0"
