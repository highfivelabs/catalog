  accessTypes:
    - "PRIVATE"
    - "PUBLIC"
  description: "PSC-I to the shared VPC."
  labels:
    env: "prod"
    purpose: "agents"
    team: "platform"
  egressNetworkConfig:
    networkAttachment: "projects/my-project-id/regions/europe-west1/networkAttachments/my-na"
    vpcEgress: "PRIVATE_RANGES_ONLY"
