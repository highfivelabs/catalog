---
# Source: geap-agent-gateway/templates/main.yaml
apiVersion: networkservices.gcp.hfl.dev/v1alpha1
kind: NetworkServicesAgentGateway
metadata:
  name: full
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: geap-agent-gateway
    app.kubernetes.io/version: "0.1.0"
    env: "prod"
    team: "platform"
  annotations:
    hfl.dev/id: "gateway"
    cnrm.cloud.google.com/project-id: "my-project-id"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  projectRef:
    external: "my-project-id"
  location: "europe-west1"
  resourceID: "my-gateway"
  agentConnectivityTemplate: "projects/1234567890/locations/europe-west1/agentConnectivityTemplates/my-template"
  description: "Agent egress for the platform team."
  labels:
    env: "prod"
    team: "platform"
  registries:
    - "//agentregistry.googleapis.com/projects/my-project-id/locations/global"
    - "//agentregistry.googleapis.com/projects/my-project-id/locations/europe-west1"
  googleManaged:
    governedAccessPath: CLIENT_TO_AGENT
