---
# Source: geap-agent-gateway/templates/access-policies.yaml
apiVersion: iam.gcp.hfl.dev/v1beta1
kind: IAMAccessPolicy
metadata:
  name: mock-access-policy-cat-mock-ap
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: geap-agent-gateway
    app.kubernetes.io/version: "0.2.0"
    env: "test"
  annotations:
    hfl.dev/id: "access_policy:cat-mock-ap"
    cnrm.cloud.google.com/project-id: "mock-project"
spec:
  resourceID: "cat-mock-ap"
  projectRef:
    external: "mock-project"
  location: global
  details:
    rules:
      - effect: "ALLOW"
        principals:
          - "principalSet://goog/group/agents@example.com"
        operation:
          permissions:
            - "iap.googleapis.com/resources.egressViaIAP"
        conditions:
          "iap.googleapis.com":
            expression: "destination.is_registered == true && destination.agent_registry.location == 'us-central1'"
---
# Source: geap-agent-gateway/templates/access-policies.yaml
