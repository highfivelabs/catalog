kind: IAMPolicyBinding
metadata:
  name: mock-policy-binding-cat-mock-ap
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: geap-agent-gateway
    app.kubernetes.io/version: "0.2.0"
    env: "test"
  annotations:
    hfl.dev/id: "policy_binding:cat-mock-ap"
