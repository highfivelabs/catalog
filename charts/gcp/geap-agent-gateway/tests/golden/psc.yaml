    external: "my-project-id"
  location: "europe-west1"
  resourceID: "my-gateway"
  agentConnectivityTemplate: "projects/1234567890/locations/europe-west1/agentConnectivityTemplates/my-gateway"
  description: "Terraform managed."
  googleManaged:
    governedAccessPath: AGENT_TO_ANYWHERE
