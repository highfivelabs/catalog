apiVersion: networkservices.gcp.hfl.dev/v1alpha1
kind: NetworkServicesAgentGateway
metadata:
  name: psc
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "psc"
    app.kubernetes.io/name: geap-agent-gateway
    app.kubernetes.io/version: "0.1.0"
