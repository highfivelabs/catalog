# expect: Each access policy must either define at least one rule in 'rules' or set 'policy_reuse' (not both).
# access_policies render (access-policies.values.yaml); this case checks
# fabric's validation.
allow_alpha: true
iap_config: null
name: my-gateway
project_id: my-project-id
region: europe-west1
access_path: egress
access_policies:
  corp-guardrails: {policy_reuse: organizations/123456789012/locations/global/accessPolicies/corp-guardrails, rules: {r: {principals: ["allUsers"]}}}
