# Every accepted variable: ingress given in lower case, registries,
# description, the template's own name, labels and description, and
# fabric's labels (the chart's labels) on both objects.
allow_alpha: true
iap_config: null
name: my-gateway
description: Agent egress for the platform team.
project_id: my-project-id
project_number: "1234567890"
region: europe-west1
access_path: ingress
labels: {env: prod}
tags: {team: platform}
registries:
  - //agentregistry.googleapis.com/projects/my-project-id/locations/global
  - //agentregistry.googleapis.com/projects/my-project-id/locations/europe-west1
deletion_policy: ABANDON
networking_config:
  name: my-template
  description: PSC-I to the shared VPC.
  labels: {purpose: agents}
  access_types: [PRIVATE, PUBLIC]
  psc_i_network_attachment_id: projects/my-project-id/regions/europe-west1/networkAttachments/my-na
