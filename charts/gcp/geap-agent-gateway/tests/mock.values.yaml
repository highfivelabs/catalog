# The fake-cloud case (hack/mock-apply.sh): a Google-managed egress gateway
# and the connectivity template it makes over a network attachment, and an
# IAM v3 access policy bound to the gateway (config-connector-extensions'
# IAMAccessPolicy and IAMPolicyBinding), and fabric's default IAP
# authorization and Model Armor on the gateway (NetworkServicesAuthzExtension
# and NetworkSecurityAuthzPolicy, two of each).
allow_alpha: true
model_armor_config:
  request_template_id: cat-mock-req
  response_template_id: cat-mock-resp
  authz_hosts: [mcp.example.com]
name: cat-mock-agw
project_id: mock-project
project_number: "123456789"
region: us-central1
access_path: AGENT_TO_ANYWHERE
labels: {env: test}
networking_config:
  psc_i_network_attachment_id: projects/mock-project/regions/us-central1/networkAttachments/cat-mock-agw-na
  access_types: [PRIVATE]
access_policies:
  cat-mock-ap:
    target_resource: gateway
    rules:
      registry:
        principals: ["group:agents@example.com"]
        registry: true
