# expect: authorization extension name
# fabric's default IAP authorization names its extension and policy
# <name>-iap: with a namePrefix, a gateway ID that fits can leave that name
# longer than the 63 characters the API allows.
allow_alpha: true
namePrefix: abcde
name: ggggggggggggggggggggggggggggggggggggggggggggggggggggggg
project_id: my-project-id
region: europe-west1
access_path: egress
