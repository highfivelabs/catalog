# fabric's README example "Screening content with Model Armor": short
# template ids, expanded against the project and region, and authz_hosts as
# the CONTENT_AUTHZ policy's HTTP rule, beside the default IAP authorization.
allow_alpha: true
name: my-gateway
project_id: my-project-id
region: europe-west1
access_path: AGENT_TO_ANYWHERE
model_armor_config:
  authz_hosts: [api.example.com]
  request_template_id: agw-request-template
  response_template_id: agw-response-template
