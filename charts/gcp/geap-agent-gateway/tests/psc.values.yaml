# fabric's README example "VPC connectivity", its context lookups resolved:
# the gateway with the connectivity template it makes over a Private
# Service Connect network attachment, with DNS peering.
allow_alpha: true
iap_config: null
name: my-gateway
project_id: my-project-id
project_number: "1234567890"
region: europe-west1
access_path: AGENT_TO_ANYWHERE
networking_config:
  psc_i_network_attachment_id: projects/my-project-id/regions/europe-west1/networkAttachments/my-na
  access_types: [PRIVATE]
  vpc_egress: ALL_TRAFFIC
  dns_peering_config:
    domains: [corp.internal.]
    target_network: projects/my-project-id/global/networks/my-vpc
