# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set, or accepts only in part. Read by `task
# coverage`; `task coverage-verify` renders the chart to check that each one
# is refused. kind: gap (no Config Connector kind or field) or by-design
# (Bundt replaces it). partial: the variable is accepted, the reason says
# what is refused. The whole chart needs allow_alpha: true (both kinds are
# config-connector-extensions' v1alpha1).
refused:
  - variable: context
    kind: by-design
    reason: "Bundt replaces fabric's $context lookups with ${...} expressions and valueFrom in the component's inputs"
  - variable: access_policies
    kind: gap
    reason: "Config Connector's IAMAccessPolicy (v1alpha1) takes an organization only, not a project, and config-connector-extensions' IAMPolicyBinding targets a principal set only, not a resource (the project or the gateway)"
  - variable: iap_config
    kind: gap
    reason: "Config Connector's NetworkServicesAuthzExtension (v1alpha1) is a load balancer callout with a required backend service and no service field, so it cannot delegate to IAP; fabric's default ({}) makes one, so every render sets iap_config: null"
  - variable: model_armor_config
    kind: gap
    reason: "Config Connector's NetworkServicesAuthzExtension (v1alpha1) is a load balancer callout with a required backend service and no service field, so it cannot delegate to Model Armor"
  - variable: project_number
    kind: by-design
    reason: "accepted; null (fabric's default, which reads the google_project data source) is refused when the chart makes a connectivity template: a chart cannot read the project's number"
    partial: true
