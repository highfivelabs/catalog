# Values mirror the Terraform variables of fabric's geap-agent-gateway
# module (v60.0.0): same names, types and defaults, so a module block's
# arguments become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.gateway sets the gateway's ID in full and
# names.connectivityTemplate the connectivity template's (else fabric's:
# name, and networking_config.name or name).
names: {}
# An optional convenience: "<namePrefix>-" in front of every name not set
# under names. Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object; an unprefixed key also becomes a
# Google Cloud label on the gateway and the connectivity template. This is
# also fabric's labels variable (the gateway's labels).
labels: {}
# Cloud labels on the gateway and the connectivity template.
tags: {}
# Both kinds are config-connector-extensions' v1alpha1: the chart renders
# only with allow_alpha: true (docs/design.md, "Alpha kinds").
allow_alpha: false
# DELETE (default) or ABANDON (keeps the gateway and the template).
deletion_policy: DELETE

# The direction the gateway applies to: ingress (CLIENT_TO_AGENT) or egress
# (AGENT_TO_ANYWHERE). Required for a Google-managed gateway.
access_path: null
# IAM v3 access policies and their bindings, keyed by policy ID: an
# IAMAccessPolicy (rules) and an IAMPolicyBinding (bind) each, of
# config-connector-extensions (README.md, "Values").
access_policies: {}
# Context-specific interpolations. Refused when set: Bundt expressions
# (${...}) and valueFrom replace fabric's $context lookups.
context: {}
# The description of the Agent Gateway.
description: Terraform managed.
# Identity-Aware Proxy request authorization: fabric's default ({}) makes an
# authorization extension for iap.googleapis.com and a REQUEST_AUTHZ
# authorization policy binding it to the gateway (README.md, "Values").
# null for none.
iap_config: {}
# Whether the Agent Gateway is Google or self-managed.
is_google_managed: true
# Model Armor content authorization: request_template_id and
# response_template_id (short ids are expanded against the project and
# region) make an authorization extension and a CONTENT_AUTHZ authorization
# policy on the gateway.
model_armor_config: null
# The name of the Agent Gateway.
name: ""
# The networking configuration: psc_i_network_attachment_id makes an agent
# connectivity template, connectivity_template_reuse attaches an existing
# one.
networking_config:
  access_types: null
  connectivity_template_reuse: null
  description: Terraform managed.
  dns_peering_config: null
  labels: null
  name: null
  psc_i_network_attachment_id: null
  vpc_egress: PRIVATE_RANGES_ONLY
# The project of the gateway.
project_id: ""
# The project's number: the gateway references a connectivity template the
# chart makes by it. Required when psc_i_network_attachment_id is set.
project_number: null
# The URI of a compatible self-managed proxy (is_google_managed false).
proxy_uri: null
# The region of the gateway.
region: ""
# The Agent Registries governed by the gateway.
registries: null
