#
# The Bundt Package for this chart (bundt: specs/catalog/packages.md R6).
# hack/publish.sh pushes the chart and writes spec.source (its OCI
# repository and digest) into the copy it submits; spec.version is the
# chart's version. Outputs mirror the module's outputs, as CEL over the
# live objects, each object bound as resources.<its hfl.dev/id>, and the
# values as inputs (docs/design.md, "Outputs"). The module's three outputs
# are whole Terraform objects; each is the one field consumers take
# (README.md, "Outputs"): the policy's number, each association's name by
# its target, and each rule's resource name by its priority.
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: gcp-hierarchical-firewall-policy
spec:
  version: 0.1.0
  engine: helm
  providers: [kcc]
  outputs:
    fw_policy: >-
      has(resources.policy.spec.resourceID) ? resources.policy.spec.resourceID : resources.policy.status.id
    target_associations: >-
      resources.transformMapEntry(k, v, v.kind == 'ComputeFirewallPolicyAssociation',
        {v.spec.attachmentTargetRef.external: v.spec.resourceID})
    rules: >-
      resources.transformMapEntry(k, v, v.kind == 'ComputeFirewallPolicyRule',
        {string(v.spec.priority): has(v.status.externalRef) ? v.status.externalRef : ''})
