#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every object this
# chart renders carries the namePrefix in its cloud-side name, except the
# kinds listed here, each with the reason it cannot collide with another
# Instance's. A kind added to the chart and not listed fails `task test`
# until it is prefixed or listed.
exempt:
  ComputeFirewallPolicyRule: "named by its priority within its policy; it has no name of its own"
  ComputeFirewallPolicyAssociation: "named by the module after its target (the folder's or organization's number), within its policy; a folder or an organization takes one association per policy"
# A firewall policy's resourceID is the number the cloud assigns it; the
# name the caller gives it, which must be unique in the organization and
# which the namePrefix goes on, is shortName.
nameFields:
  ComputeFirewallPolicy: shortName
