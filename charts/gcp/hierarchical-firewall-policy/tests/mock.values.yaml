# Applied to the fake cloud by hack/mock-apply.sh: a policy with one rule
# and no association. A hierarchical firewall policy belongs to a folder or
# an organization, not a project (the chart has no project_id); mockgcp
# takes any parent, so this one is a placeholder folder.
parent_node: folders/111111111111
policy_name: catalog-hfp
rules:
  - priority: 1000
    direction: INGRESS
    action: allow
    match: {src_ip_ranges: ["35.235.240.0/20"], layer4_configs: [{ip_protocol: tcp, ports: ["22"]}]}
