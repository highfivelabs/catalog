# Source: hierarchical-firewall-policy/templates/main.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeFirewallPolicyRule
metadata:
  name: full-rule-100
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: hierarchical-firewall-policy
    app.kubernetes.io/version: "0.1.0"
    hfl.dev/team: "platform"
    team: "platform"
  annotations:
    hfl.dev/id: "rule:100"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  firewallPolicyRef:
    name: full
  priority: 100
  action: "allow"
  direction: "INGRESS"
  description: "From address groups to tagged networks"
  disabled: false
  enableLogging: false
  targetServiceAccounts:
    - external: "web@app-project.iam.gserviceaccount.com"
  targetResources:
    - external: "https://www.googleapis.com/compute/v1/projects/net-host/global/networks/shared"
  match:
    srcIPRanges:
      - "10.0.0.0/8"
    srcFqdns:
      - "example.com"
    srcRegionCodes:
      - "US"
    srcThreatIntelligences:
      - "iplist-known-malicious-ips"
    srcAddressGroups:
      - "organizations/123456789012/locations/global/addressGroups/corp"
    destIPRanges:
      - "10.1.0.0/16"
    layer4Configs:
    - ipProtocol: "tcp"
      ports:
        - "443"
    - ipProtocol: "udp"
---
