# The policy's name in full, labels and tags (docs/design.md, "Names,
# labels and tags"). Rules and associations take no name of their own.
names: {policy: shop-dev-baseline}
parent_node: folders/111111111111
policy_name: baseline
target_folders: ["333333333333"]
labels: {hfl.dev/team: shop}
tags: {team: shop, environment: dev}
rules:
  - priority: 1000
    direction: INGRESS
    action: allow
    match: {src_ip_ranges: ["35.235.240.0/20"], layer4_configs: [{ip_protocol: tcp, ports: ["22"]}]}
