# The module README's usage example, as values (project ID a placeholder).
parent_node: folders/123456789012
policy_name: test-policy
description: test firewall policy
target_folders: ["123456789012", "987654321098"]
target_org: "123456123456"
rules:
  - priority: "1"
    direction: INGRESS
    action: allow
    rule_name: ingress-1
    description: test ingres rule 1
    enable_logging: true
    match:
      src_ip_ranges: ["10.100.0.1/32"]
      src_fqdns: ["example.com"]
      src_region_codes: ["US"]
      src_threat_intelligences: ["iplist-public-clouds"]
      layer4_configs: [{ip_protocol: all}]
  - priority: "2"
    direction: INGRESS
    action: deny
    rule_name: ingress-2
    disabled: true
    description: test ingres rule 2
    match:
      src_ip_ranges: ["10.100.0.2/32"]
      src_fqdns: ["example.org"]
      src_region_codes: ["BE"]
      layer4_configs: [{ip_protocol: all}]
  - priority: "3"
    direction: INGRESS
    action: allow
    rule_name: ingress-3
    disabled: true
    description: test ingres rule 3
    enable_logging: true
    target_service_accounts: ["fw-test-svc-acct@my-project.iam.gserviceaccount.com"]
    match:
      src_ip_ranges: ["10.100.0.3/32"]
      dest_ip_ranges: ["10.100.0.103/32"]
      layer4_configs: [{ip_protocol: tcp, ports: ["80"]}]
  - priority: "101"
    direction: EGRESS
    action: allow
    rule_name: egress-101
    description: test egress rule 101
    enable_logging: true
    match:
      src_ip_ranges: ["10.100.0.2/32"]
      dest_fqdns: ["example.com"]
      dest_region_codes: ["US"]
      dest_threat_intelligences: ["iplist-public-clouds"]
      layer4_configs: [{ip_protocol: all}]
  - priority: "102"
    direction: EGRESS
    action: deny
    rule_name: egress-102
    disabled: true
    description: test egress rule 102
    match:
      src_ip_ranges: ["10.100.0.102/32"]
      dest_ip_ranges: ["10.100.0.2/32"]
      dest_region_codes: ["AR"]
      layer4_configs: [{ip_protocol: all}]
  - priority: "103"
    direction: EGRESS
    action: allow
    rule_name: egress-103
    disabled: true
    description: test ingres rule 103
    enable_logging: true
    target_service_accounts: ["fw-test-svc-acct@my-project.iam.gserviceaccount.com"]
    match:
      dest_ip_ranges: ["10.100.0.103/32"]
      layer4_configs: [{ip_protocol: tcp, ports: ["80", "8080", "8081-8085"]}]
