#
# Values mirror the Terraform variables of fabric's net-swp module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.gateway, names.policy (the gateway security policy),
# names.tlsInspectionPolicy and names.serviceAttachment set those cloud
# names in full; unset, each is name, as fabric names all four. URL lists
# are named by their keys, and policy rules by theirs under the policy.
names: {}
# An optional convenience: "<namePrefix>-" in front of every derived name
# (the four above and each URL list's). Empty (the default) changes
# nothing.
namePrefix: ""
# Kubernetes labels on every object; an unprefixed key also becomes a
# Google Cloud label on the gateway (the one resource here that has
# labels).
labels: {}
# Cloud labels on the gateway (Google Cloud labels), with
# gateway_config.labels.
tags: {}

# List of certificates to be used for Secure Web Proxy.
certificates: []
# Optional description for the created resources.
description: Managed by Terraform.
# Path to folder with YAML resource description data files. A chart cannot
# read the caller's files: accepted and ignored; their contents go under
# factories_data.
factories_config: {}
# Not a fabric variable: the factory files' contents, one key per folder of
# factories_config: policy_rules (file name => a rule as the factory's
# schema has it: priority, allow, description, enable, application_matcher,
# session_matcher, tls_inspect, matcher_args) and url_lists (file name =>
# {description, values}).
factories_data: {}
# Optional Secure Web Gateway configuration: {addresses, delete_router_on_destroy,
# labels, next_hop_routing_mode, ports, scope}.
gateway_config: {}
# Name of the Secure Web Proxy resource.
name: ""
# Name of the network the Secure Web Proxy is deployed into.
network: ""
# Policy rules definitions. Merged with policy rules defined via the
# factory: {NAME => {priority, allow, description, enabled,
# application_matcher, session_matcher, tls_inspect, matcher_args:
# {application, session}}}.
policy_rules: {}
# Replacement contexts for policy rules matcher arguments: {secure_tags,
# service_accounts, url_lists}.
policy_rules_contexts: {}
# Project id of the project that holds the network.
project_id: ""
# Region where resources will be created.
region: ""
# PSC service attachment configuration: {nat_subnets, automatic_connection,
# consumer_accept_lists, consumer_reject_lists, description, domain_name,
# enable_proxy_protocol, reconcile_connections}.
service_attachment: null
# Name of the subnetwork the Secure Web Proxy is deployed into.
subnetwork: ""
# TLS inspection configuration: {create_config: {ca_pool, description,
# exclude_public_ca_set}, id}.
tls_inspection_config: {}
# URL lists: {NAME => {values, description}}.
url_lists: {}

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps every
# resource when the component is deleted. PREVENT has no Config Connector
# equivalent.
deletion_policy: null
