apiVersion: networkservices.gcp.hfl.dev/v1beta1
kind: NetworkServicesGateway
metadata:
  name: tls
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "tls"
    app.kubernetes.io/name: net-swp
