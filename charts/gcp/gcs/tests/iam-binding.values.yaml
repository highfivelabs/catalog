# iam_bindings: one exact IAMBinding per key (config-connector-extensions),
# the condition carried; iam stays the IAMPartialPolicy.
project_id: myproject
name: data
location: EU
iam:
  roles/storage.objectViewer: ["group:readers@example.com"]
iam_bindings:
  admins:
    role: roles/storage.admin
    members: ["group:admins@example.com", "user:ada@example.com"]
  temp:
    role: roles/storage.objectCreator
    members: ["user:bob@example.com"]
    condition: {title: until-2030, expression: "request.time < timestamp('2030-01-01T00:00:00Z')"}
