# Source: gcs/templates/iam.yaml
apiVersion: iam.gcp.hfl.dev/v1beta1
kind: IAMBinding
metadata:
  name: iam-binding-iam-binding-temp
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "iam-binding"
    app.kubernetes.io/name: gcs
    app.kubernetes.io/version: "0.4.0"
  annotations:
    hfl.dev/id: "iam-binding-temp"
spec:
  resourceRef:
    apiVersion: storage.cnrm.cloud.google.com/v1beta1
    kind: StorageBucket
    name: iam-binding
  role: "roles/storage.objectCreator"
  members:
    - "user:bob@example.com"
  condition:
    title: "until-2030"
    expression: "request.time < timestamp('2030-01-01T00:00:00Z')"
