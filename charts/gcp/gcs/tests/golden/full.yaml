---
# Source: gcs/templates/bucket.yaml
apiVersion: storage.cnrm.cloud.google.com/v1beta1
kind: StorageBucket
metadata:
  name: full
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: gcs
    app.kubernetes.io/version: "0.4.0"
    env: "dev"
  annotations:
    hfl.dev/id: "bucket"
    cnrm.cloud.google.com/project-id: "mock-project"
    cnrm.cloud.google.com/force-destroy: "true"
spec:
  resourceID: hfl-my-bucket
  location: "US-CENTRAL1"
  storageClass: STANDARD
  uniformBucketLevelAccess: true
  publicAccessPrevention: enforced
  versioning:
    enabled: true
  autoclass:
    enabled: true
  cors:
    - maxAgeSeconds: 3600
      method:
      - GET
      origin:
      - '*'
  customPlacementConfig:
    dataLocations: ["US-CENTRAL1","US-EAST1"]
  encryption:
    kmsKeyRef:
      external: "projects/kms-project/locations/us/keyRings/ring/cryptoKeys/key"
  logging:
    logBucket: "log-bucket"
    logObjectPrefix: "logs"
  lifecycleRule:
    - action:
        type: SetStorageClass
        storageClass: COLDLINE
      condition:
        age: 90
    - action:
        type: Delete
      condition:
        age: 30
        withState: ANY
  retentionPolicy:
    retentionPeriod: 86400
  softDeletePolicy:
    retentionDurationSeconds: 0
  website:
    mainPageSuffix: "index.html"
    notFoundPage: "404.html"
  ipFilter:
    mode: Enabled
    allowAllServiceAgentAccess: true
    publicNetworkSource:
      allowedIpCidrRanges: ["203.0.113.0/24"]
    vpcNetworkSources:
      - networkRef:
          external: "projects/myproject/global/networks/default"
        allowedIpCidrRanges: ["10.0.0.0/8"]
---
# Source: gcs/templates/notification.yaml
apiVersion: storage.cnrm.cloud.google.com/v1beta1
kind: StorageNotification
metadata:
  name: full-notification
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: gcs
    app.kubernetes.io/version: "0.4.0"
    env: "dev"
  annotations:
    hfl.dev/id: "notification"
    cnrm.cloud.google.com/project-id: "mock-project"
spec:
  bucketRef:
    name: full
  topicRef:
    name: full-topic
  payloadFormat: JSON_API_V1
---
# Source: gcs/templates/tags.yaml
apiVersion: tags.cnrm.cloud.google.com/v1beta1
