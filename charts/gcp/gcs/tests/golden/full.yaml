metadata:
  name: full-tag-env
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: gcs
    app.kubernetes.io/version: "0.4.0"
    env: "dev"
  annotations:
    hfl.dev/id: "tag-env"
spec:
  location: "US-CENTRAL1"
  parentRef:
    external: "//storage.googleapis.com/projects/_/buckets/hfl-my-bucket"
  tagValueRef:
    external: "tagValues/123"
