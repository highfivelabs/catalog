# Names in full, labels and tags, as Bundt passes them from a team's naming
# convention (docs/design.md, "Names, labels and tags"): the bucket and the
# topic take the names as given, with no prefix; every object carries the
# labels and tags.
names:
  bucket: shop-dev-euw1-assets
  topic: shop-dev-euw1-assets-events
name: assets
prefix: ignored-when-names-bucket-is-set
project_id: myproject
location: EU
labels: {hfl.dev/team: shop, hfl.dev/environment: dev}
tags: {team: shop, environment: dev, cost-center: cc-1234}
iam_bindings_additive:
  reader: {member: "group:readers@example.com", role: roles/storage.objectViewer}
notification_config:
  enabled: true
  payload_format: JSON_API_V1
  sa_email: service-123@gs-project-accounts.iam.gserviceaccount.com
  topic_name: bucket-events
