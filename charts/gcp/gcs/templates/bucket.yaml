{{- $v := .Values }}
{{- include "kcc.unsupported" (list $ "enable_object_retention" $v.enable_object_retention "StorageBucket has no object retention field") }}
{{- include "kcc.unsupported" (list $ "enable_hierarchical_namespace" $v.enable_hierarchical_namespace "StorageBucket has no hierarchical namespace field") }}
{{- include "kcc.unsupported" (list $ "rpo" $v.rpo "StorageBucket has no rpo field (Config Connector PR #13713)") }}
{{- include "kcc.unsupported" (list $ "objects_to_upload" $v.objects_to_upload "Config Connector has no bucket object kind") }}
{{- include "kcc.unsupported" (list $ "kms_autokeys" $v.kms_autokeys "a KMSKeyHandle's key is known only after apply and StorageBucket cannot reference a handle") }}
{{- include "kcc.unsupported" (list $ "context" $v.context "use Bundt expressions (${...}) and valueFrom in the component's inputs instead") }}
{{- if and $v.autoclass (ne $v.storage_class "STANDARD") }}
{{- fail "gcs: autoclass needs storage_class STANDARD" }}
{{- end }}
{{- if $v.bucket_create }}
{{- $annotations := dict }}
{{- if $v.force_destroy }}{{- $_ := set $annotations "cnrm.cloud.google.com/force-destroy" "true" }}{{- end }}
apiVersion: storage.cnrm.cloud.google.com/v1beta1
kind: StorageBucket
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" .Release.Name "id" "bucket" "project" $v.project_id "labels" $v.labels "annotations" $annotations "abandon" (include "kcc.abandon" .)) | nindent 2 }}
spec:
  resourceID: {{ include "gcs.bucketName" . }}
  location: {{ $v.location | quote }}
  storageClass: {{ $v.storage_class }}
  {{- if not (kindIs "invalid" $v.uniform_bucket_level_access) }}
  uniformBucketLevelAccess: {{ $v.uniform_bucket_level_access }}
  {{- end }}
  {{- if not (kindIs "invalid" $v.default_event_based_hold) }}
  defaultEventBasedHold: {{ $v.default_event_based_hold }}
  {{- end }}
  {{- if not (kindIs "invalid" $v.requester_pays) }}
  requesterPays: {{ $v.requester_pays }}
  {{- end }}
  {{- with $v.public_access_prevention }}
  publicAccessPrevention: {{ . }}
  {{- end }}
  {{- if not (kindIs "invalid" $v.versioning) }}
  versioning:
    enabled: {{ $v.versioning }}
  {{- end }}
  {{- if not (kindIs "invalid" $v.autoclass) }}
  autoclass:
    enabled: {{ $v.autoclass }}
  {{- end }}
  {{- with $v.cors }}
  {{- $cors := dict "maxAgeSeconds" (max 3600 (.max_age_seconds | default 0)) }}
  {{- with .origin }}{{ $_ := set $cors "origin" . }}{{ end }}
  {{- with .method }}{{ $_ := set $cors "method" . }}{{ end }}
  {{- with .response_header }}{{ $_ := set $cors "responseHeader" . }}{{ end }}
  {{- /* fabric: max_age_seconds = max(3600, cors.max_age_seconds) */}}
  cors:
    {{- toYaml (list $cors) | nindent 4 }}
  {{- end }}
  {{- with $v.custom_placement_config }}
  customPlacementConfig:
    dataLocations: {{ toJson . }}
  {{- end }}
  {{- with $v.encryption_key }}
  encryption:
    kmsKeyRef:
      external: {{ . | quote }}
  {{- end }}
  {{- with $v.logging_config }}
  logging:
    logBucket: {{ .log_bucket | quote }}
    {{- with .log_object_prefix }}
    logObjectPrefix: {{ . | quote }}
    {{- end }}
  {{- end }}
  {{- with $v.lifecycle_rules }}
  lifecycleRule:
    {{- range $key, $rule := . }}
    - action:
        type: {{ $rule.action.type }}
        {{- with $rule.action.storage_class }}
        storageClass: {{ . }}
        {{- end }}
      condition:
        {{- $c := $rule.condition | default dict }}
        {{- if not (kindIs "invalid" $c.age) }}
        age: {{ $c.age }}
        {{- end }}
        {{- with $c.created_before }}
        createdBefore: {{ . | quote }}
        {{- end }}
        {{- with $c.custom_time_before }}
        customTimeBefore: {{ . | quote }}
        {{- end }}
        {{- if not (kindIs "invalid" $c.days_since_custom_time) }}
        daysSinceCustomTime: {{ $c.days_since_custom_time }}
        {{- end }}
        {{- if not (kindIs "invalid" $c.days_since_noncurrent_time) }}
        daysSinceNoncurrentTime: {{ $c.days_since_noncurrent_time }}
        {{- end }}
        {{- with $c.matches_prefix }}
        matchesPrefix: {{ toJson . }}
        {{- end }}
        {{- with $c.matches_storage_class }}
        matchesStorageClass: {{ toJson . }}
        {{- end }}
        {{- with $c.matches_suffix }}
        matchesSuffix: {{ toJson . }}
        {{- end }}
        {{- with $c.noncurrent_time_before }}
        noncurrentTimeBefore: {{ . | quote }}
        {{- end }}
        {{- if not (kindIs "invalid" $c.num_newer_versions) }}
        numNewerVersions: {{ $c.num_newer_versions }}
        {{- end }}
        {{- with $c.with_state }}
        withState: {{ . }}
        {{- end }}
    {{- end }}
  {{- end }}
  {{- with $v.retention_policy }}
  retentionPolicy:
    retentionPeriod: {{ .retention_period | int64 }}
    {{- if not (kindIs "invalid" .is_locked) }}
    isLocked: {{ .is_locked }}
    {{- end }}
  {{- end }}
  {{- if not (kindIs "invalid" $v.soft_delete_retention) }}
  softDeletePolicy:
    retentionDurationSeconds: {{ $v.soft_delete_retention | int64 }}
  {{- end }}
  {{- with $v.website }}
  website:
    {{- with .main_page_suffix }}
    mainPageSuffix: {{ . | quote }}
    {{- end }}
    {{- with .not_found_page }}
    notFoundPage: {{ . | quote }}
    {{- end }}
  {{- end }}
  {{- with $v.ip_filter }}
  ipFilter:
    mode: Enabled
    {{- if not (kindIs "invalid" .allow_cross_org_vpcs) }}
    allowCrossOrgVpcs: {{ .allow_cross_org_vpcs }}
    {{- end }}
    {{- if not (kindIs "invalid" .allow_all_service_agent_access) }}
    allowAllServiceAgentAccess: {{ .allow_all_service_agent_access }}
    {{- end }}
    {{- with .public_network_sources }}
    publicNetworkSource:
      allowedIpCidrRanges: {{ toJson . }}
    {{- end }}
    {{- with .vpc_network_sources }}
    vpcNetworkSources:
      {{- range $network, $ranges := . }}
      - networkRef:
          external: {{ $network | quote }}
        allowedIpCidrRanges: {{ toJson $ranges }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
