{{- range $key, $value := .Values.tag_bindings }}
---
apiVersion: tags.cnrm.cloud.google.com/v1beta1
kind: TagsLocationTagBinding
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "tag" $key)) "id" (printf "tag-%s" $key)) | nindent 2 }}
spec:
  location: {{ $.Values.location | quote }}
  parentRef:
    external: {{ printf "//storage.googleapis.com/projects/_/buckets/%s" (include "gcs.bucketName" $) | quote }}
  tagValueRef:
    external: {{ $value | quote }}
{{- end }}
