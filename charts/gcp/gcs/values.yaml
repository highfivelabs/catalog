#
# Values mirror the Terraform variables of fabric's gcs module (v60.0.0):
# same names, types and defaults. values.schema.json carries the types
# and the module's validations.

# Bucket name suffix; the bucket is named "<prefix>-<name>", lower-cased.
name: ""
# Optional prefix used to generate the bucket name.
prefix: null
# Bucket project. null takes the namespace's project.
project_id: null
# Bucket location (required when bucket_create is true).
location: null
# Create the bucket. false manages IAM, notifications and tag bindings on
# an existing bucket named "<prefix>-<name>".
bucket_create: true
storage_class: STANDARD
# Delete the bucket's objects with it (Config Connector's force-destroy).
force_destroy: false
uniform_bucket_level_access: true
# Labels on the bucket.
labels: {}
default_event_based_hold: null
requester_pays: null
# enforced or inherited.
public_access_prevention: null
versioning: null
autoclass: null
# {origin, method, response_header, max_age_seconds}
cors: null
# Regions of a dual-region bucket.
custom_placement_config: null
# KMS key name (projects/.../cryptoKeys/...).
encryption_key: null
# {log_bucket, log_object_prefix}
logging_config: null
# {KEY: {action: {type, storage_class}, condition: {...}}}
lifecycle_rules: {}
# {retention_period, is_locked}; retention_period in seconds.
retention_policy: null
# Seconds soft-deleted objects are kept; 0 disables soft delete.
soft_delete_retention: null
# {main_page_suffix, not_found_page}
website: null
# {allow_cross_org_vpcs, allow_all_service_agent_access,
#  public_network_sources, vpc_network_sources: {NETWORK: [CIDRS]}}
ip_filter: null
# {enabled, payload_format, sa_email, topic_name, create_topic: {create,
#  kms_key_id}, event_types, custom_attributes, object_name_prefix}
notification_config: null
# Tag bindings, {KEY: TAG_VALUE_ID}.
tag_bindings: {}

# Authoritative IAM, {ROLE: [MEMBERS]}, {PRINCIPAL: [ROLES]} and
# {KEY: {role, members, condition}}; additive, {KEY: {member, role, condition}}.
iam: {}
iam_by_principals: {}
iam_bindings: {}
iam_bindings_additive: {}

# DELETE (the default) or ABANDON. Not a fabric gcs variable: every chart
# takes it (docs/design.md, "Deletion").
deletion_policy: null

# Accept features that need an alpha (v1alpha1) Config Connector kind:
# managed_folders. Beta kinds are always on. An alpha kind's schema may
# change between Config Connector releases (docs/design.md, "Alpha kinds").
allow_alpha: false
# Managed folders (alpha), {PATH: {force_destroy}}. Their iam variables are
# not supported: IAMPolicyMember cannot reference a managed folder, and
# force_destroy true needs a field the kind lacks.
managed_folders: {}

# Not supported (docs/gcp-inventory.md, "Gaps"); refused when set.
enable_object_retention: null
enable_hierarchical_namespace: null
rpo: null
objects_to_upload: {}
kms_autokeys: {}
context: {}
