#
# The Bundt Package for this chart (see iam-service-account/package.yaml).
# Outputs are fabric's declared outputs, selected from the live objects
# (resources.<id>) and the component's values (inputs): name, id and url
# are computed from inputs as fabric computes them (names.bucket when it is
# set), so they have a value with bucket_create false too. fabric's bucket and objects outputs (whole
# Terraform objects) are not outputs.
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: gcp-gcs
spec:
  version: 0.3.0
  engine: helm
  providers: [kcc]
  outputs:
    name: >-
      ('bucket' in inputs.names && inputs.names.bucket != '' ? inputs.names.bucket : (inputs.namePrefix != '' ? inputs.namePrefix + '-' : '') + (inputs.prefix != null ? inputs.prefix + '-' : '') + inputs.name.lowerAscii())
    id: >-
      ('bucket' in inputs.names && inputs.names.bucket != '' ? inputs.names.bucket : (inputs.namePrefix != '' ? inputs.namePrefix + '-' : '') + (inputs.prefix != null ? inputs.prefix + '-' : '') + inputs.name.lowerAscii())
    url: >-
      inputs.bucket_create
      ? resources.bucket.status.url
      : 'gs://' + ('bucket' in inputs.names && inputs.names.bucket != '' ? inputs.names.bucket : (inputs.namePrefix != '' ? inputs.namePrefix + '-' : '') + (inputs.prefix != null ? inputs.prefix + '-' : '') + inputs.name.lowerAscii())
    notification: "'notification' in resources ? resources.notification.status.selfLink : null"
    topic: >-
      'topic' in resources
      ? dyn('projects/' + resources.topic.metadata.annotations['cnrm.cloud.google.com/project-id'] + '/topics/' + resources.topic.spec.resourceID)
      : null
