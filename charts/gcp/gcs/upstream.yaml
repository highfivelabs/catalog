# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set, or accepts only in part. Read by `task
# coverage`; `task coverage-verify` renders the chart to check that each one
# is refused. kind: gap (no Config Connector kind or field), alpha (only a
# v1alpha1 kind), not-ported (Config Connector has it, the chart does not
# map it yet) or by-design (Bundt replaces it). partial: the variable is
# accepted, the reason says what is refused.
refused:
  - variable: context
    kind: by-design
    reason: "Bundt replaces fabric's $context lookups with ${...} expressions and valueFrom in the component's inputs"
  - variable: enable_hierarchical_namespace
    kind: gap
    reason: "StorageBucket has no hierarchical namespace field"
  - variable: enable_object_retention
    kind: gap
    reason: "StorageBucket has no object retention field"
  - variable: kms_autokeys
    kind: gap
    reason: "a key handle's key is known only after apply and StorageBucket cannot reference a handle (gap 8)"
  - variable: managed_folders
    kind: alpha
    reason: "StorageManagedFolder is v1alpha1: needs allow_alpha: true; nested paths (a/b), iam, iam_bindings, iam_bindings_additive, iam_by_principals and force_destroy: true are refused (IAMPolicyMember cannot reference a managed folder; the kind has no force_destroy)"
    partial: true
  - variable: objects_to_upload
    kind: gap
    reason: "Config Connector has no bucket object kind (docs/gcp-inventory.md, gap 5)"
  - variable: rpo
    kind: gap
    reason: "StorageBucket has no rpo field (Config Connector PR #13713)"
