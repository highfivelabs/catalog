# Values mirror the Terraform variables of fabric's dataplex-aspect-types
# module (v60.0.0): same names, types and defaults, so a module block's
# arguments become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.<key> sets the ID of the aspect type of that key in full (else the
# key, as fabric names it).
names: {}
# An optional convenience: "<namePrefix>-" in front of every aspect type ID
# not set under names. Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object; an unprefixed key also becomes a
# Google Cloud label on every aspect type.
labels: {}
# Cloud labels on every aspect type (Google Cloud labels).
tags: {}

# Aspect templates. Merged with those defined via the factory.
aspect_types: {}
# Context-specific interpolations. Refused when set: Bundt expressions
# (${...}) and valueFrom replace fabric's $context lookups.
context: {}
# Paths to folders for the optional factories. Accepted and ignored: the
# files' contents go under factories_data (below).
factories_config: {}
# Location for aspect types.
location: global
# Project id where resources will be created.
project_id: ""

# Not a fabric variable: the aspect type factory's files, as data
# (docs/design.md, "Submodules and factories"). One entry per file of the
# folder factories_config.aspect_types names, keyed by the file's name
# without .yaml (the aspect type's ID, as fabric takes it), each exactly
# the file's content.
factories_data:
  aspect_types: {}

# Not a fabric variable: iam_bindings_additive renders config-connector-
# extensions' IAMMember, which is v1alpha1; set true to accept that its
# schema may change (docs/design.md, "Alpha kinds").
allow_alpha: false
# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# aspect types when the component is deleted. PREVENT has no Config
# Connector equivalent.
deletion_policy: null
