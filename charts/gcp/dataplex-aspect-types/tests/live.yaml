# The live case (hack/live-apply.sh LIVE_CHARTS=dataplex-aspect-types): one
# aspect type and a role on it (config-connector-extensions'
# DataplexAspectType and IAMBinding).
project_id: ${PROJECT}
location: ${REGION}
labels: {catalog-run: ${RUN}}
aspect_types:
  ${RUN}-aspect:
    display_name: catalog live test ${RUN}
    metadata_template: '{"name": "catalog-live", "type": "record", "recordFields": [{"name": "owner", "type": "string", "index": 1, "constraints": {"required": true}}]}'
    iam:
      roles/dataplex.aspectTypeUser: ["serviceAccount:${RUNNER}"]
