# Names in full, labels and tags, as Bundt passes them from a team's naming
# convention (docs/design.md, "Names, labels and tags"): quality takes its
# ID as given, with no prefix; owner is named by its key.
project_id: my-project
names: {quality: shop-dev-quality}
labels: {hfl.dev/team: shop, hfl.dev/environment: dev}
tags: {team: shop, environment: dev}
aspect_types:
  quality:
    metadata_template: '{"name": "quality", "type": "record", "recordFields": [{"name": "score", "type": "double", "index": 1}]}'
  owner:
    metadata_template: '{"name": "owner", "type": "record", "recordFields": [{"name": "team", "type": "string", "index": 1}]}'
