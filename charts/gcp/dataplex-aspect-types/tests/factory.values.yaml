# fabric's README "Factory example": two files under data/aspect-types, as
# data. The $iam_principals:test-sa lookup of the second file is written
# as the principal itself (context is refused: Bundt expressions replace it).
project_id: test-project
allow_alpha: true
factories_config: {aspect_types: data/aspect-types}
factories_data:
  aspect_types:
    aspect-0:
      display_name: Test template 0.
      iam:
        roles/dataplex.aspectTypeOwner: ["group:data-owners@example.com"]
      metadata_template: |
        {"name": "tf-test-template-0", "type": "record", "recordFields": [{"name": "type", "type": "enum", "annotations": {"displayName": "Type", "description": "Specifies the type of view represented by the entry."}, "index": 1, "constraints": {"required": true}, "enumValues": [{"name": "VIEW", "index": 1}]}]}
    aspect-1:
      display_name: Test template 1.
      iam_bindings_additive:
        user:
          role: roles/dataplex.aspectTypeUser
          member: serviceAccount:sa-0@test-project.iam.gserviceaccount.com
      metadata_template: |
        {"name": "tf-test-template-1", "type": "record", "recordFields": [{"name": "type", "type": "enum", "annotations": {"displayName": "Type", "description": "Specifies the type of view represented by the entry."}, "index": 1, "constraints": {"required": true}, "enumValues": [{"name": "VIEW", "index": 1}]}]}
