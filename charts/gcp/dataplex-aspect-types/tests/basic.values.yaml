# fabric's README "Simple example": one aspect type with IAM on it.
# iam_bindings_additive renders the v1alpha1 IAMMember, so allow_alpha.
project_id: test-project
allow_alpha: true
aspect_types:
  tf-test-template:
    display_name: Test template.
    iam:
      roles/dataplex.aspectTypeOwner: ["group:data-owners@example.com"]
    iam_bindings_additive:
      user:
        role: roles/dataplex.aspectTypeUser
        member: serviceAccount:sa-0@test-project.iam.gserviceaccount.com
    metadata_template: |
      {
        "name": "tf-test-template",
        "type": "record",
        "recordFields": [
          {
            "name": "type",
            "type": "enum",
            "annotations": {
              "displayName": "Type",
              "description": "Specifies the type of view represented by the entry."
            },
            "index": 1,
            "constraints": {
              "required": true
            },
            "enumValues": [
              {
                "name": "VIEW",
                "index": 1
              }
            ]
          }
        ]
      }
