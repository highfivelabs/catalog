# Every baseline value set: required labels, Artifact Registry read access,
# an extra role, an API in both lists (rendered once, by the project chart),
# a node account named for a second job, and ABANDON.
required_labels: [env, team]
project:
  name: gke-prod
  prefix: hfl
  parent: folders/1234567890
  billing_account: 012345-6789AB-CDEF01
  deletion_policy: ABANDON
  labels: {env: prod, hfl.dev/owner: platform}
  tags: {team: platform}
  services: [container.googleapis.com, storage.googleapis.com]
node_service_account:
  name: k8s-gpu-nodes
  display_name: GKE GPU nodes
  grant_artifact_registry_reader: true
  extra_roles: [roles/storage.objectViewer]
