apiVersion: v2
name: project-wrapper
description: >-
  A Google Cloud project with an opinionated baseline for running GKE: the
  catalog's project chart (a port of Cloud Foundation Fabric's project
  module) plus the APIs a cluster needs and a dedicated node service account
  named for its job, with only the roles nodes need. Not a module port.
type: application
version: 0.1.0
kubeVersion: ">=1.27.0-0"
keywords: [gcp, config-connector, project, gke, wrapper]
home: https://github.com/highfivelabs/catalog
dependencies:
  - name: project
    version: 0.5.0
    repository: file://../project
annotations:
  # Not a port of one module: upstream checks skip a chart marked as a
  # wrapper (it has no upstream.yaml); its dependencies carry the pins.
  hfl.dev/kind: wrapper
  hfl.dev/config-connector: "1.160.0"
