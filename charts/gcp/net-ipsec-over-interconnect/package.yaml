#
# The Bundt Package for this chart (see ../iam-service-account/package.yaml).
# Outputs are fabric's declared outputs that are not whole objects, for what
# the chart ports: id and self_link of the HA VPN gateway, router_name (the
# new router's, else router_config.name) and route_policies, each policy's
# ID keyed as fabric keys them. Not outputs: random_secret (the chart makes
# no secret), tunnels (refused, so there are none) and fabric's whole
# objects (bgp_peers, external_gateway, router; docs/design.md, "Outputs").
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: gcp-net-ipsec-over-interconnect
spec:
  version: 0.1.0
  engine: helm
  providers: [kcc]
  outputs:
    id: >-
      'projects/' + inputs.project_id + '/regions/' + inputs.region
      + '/vpnGateways/' + resources.gateway.spec.resourceID
    self_link: resources.gateway.status.selfLink
    router_name: >-
      'router' in resources
      ? dyn(resources.router.spec.resourceID)
      : dyn(inputs.router_config.name)
    route_policies: >-
      resources.transformMapEntry(k, v, k.startsWith('route_policy:'),
        {k.substring(13): has(v.spec.routerRef.external)
          ? v.spec.routerRef.external + '/routePolicies/' + v.spec.resourceID
          : 'projects/' + inputs.project_id + '/regions/' + inputs.region
            + '/routers/' + resources.router.spec.resourceID + '/routePolicies/' + v.spec.resourceID})
