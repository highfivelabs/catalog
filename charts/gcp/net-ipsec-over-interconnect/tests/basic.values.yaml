# The module README's example, without its tunnels (which the chart
# refuses): the HA VPN gateway on two VLAN attachments, an external peer
# gateway with two interfaces, and the router.
project_id: my-project
region: europe-west8
network: projects/my-project/global/networks/my-network
name: vpn-ipsec
interconnect_attachments:
  a: projects/my-project/regions/europe-west8/interconnectAttachments/vlan-a
  b: projects/my-project/regions/europe-west8/interconnectAttachments/vlan-b
peer_gateway_config:
  create: true
  interfaces: [172.16.0.1, 172.16.0.2]
router_config: {asn: 64514}
