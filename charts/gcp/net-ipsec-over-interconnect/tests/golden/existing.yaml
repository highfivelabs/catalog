kind: ComputeRouterRoutePolicy
metadata:
  name: existing-route-policy-export
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "existing"
    app.kubernetes.io/name: net-ipsec-over-interconnect
    app.kubernetes.io/version: "0.1.0"
