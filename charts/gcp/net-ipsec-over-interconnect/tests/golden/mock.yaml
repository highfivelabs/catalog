---
# Source: net-ipsec-over-interconnect/templates/main.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeExternalVPNGateway
metadata:
  name: mock-peer
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: net-ipsec-over-interconnect
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "external_gateway"
    cnrm.cloud.google.com/project-id: "mock-project"
spec:
  resourceID: "peer-vpn-gw-catalog-mock-ipsec"
  description: "Terraform managed IPSec over Interconnect VPN gateway"
  redundancyType: TWO_IPS_REDUNDANCY
  interface:
    - id: 0
      ipAddress: "172.16.0.1"
    - id: 1
      ipAddress: "172.16.0.2"
---
# Source: net-ipsec-over-interconnect/templates/main.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeRouter
metadata:
  name: mock
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: net-ipsec-over-interconnect
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "router"
    cnrm.cloud.google.com/project-id: "mock-project"
spec:
  resourceID: "router-catalog-mock-ipsec"
  region: "us-central1"
  networkRef:
    external: "projects/mock-project/global/networks/catalog-mock-ipsec-net"
  bgp:
    asn: 64514
    advertiseMode: DEFAULT
---
# Source: net-ipsec-over-interconnect/templates/main.yaml
apiVersion: compute.gcp.hfl.dev/v1alpha1
kind: ComputeRouterRoutePolicy
metadata:
  name: mock-route-policy-import
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: net-ipsec-over-interconnect
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "route_policy:import"
    cnrm.cloud.google.com/project-id: "mock-project"
spec:
  resourceID: "import"
  projectRef:
    external: "mock-project"
  region: "us-central1"
  routerRef:
    name: mock
  type: ROUTE_POLICY_TYPE_IMPORT
  terms:
    - priority: 1
      match:
        expression: "destination == '10.0.0.0/8'"
      actions:
        - expression: "drop()"
---
# Source: net-ipsec-over-interconnect/templates/main.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeVPNGateway
metadata:
  name: mock
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: net-ipsec-over-interconnect
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "gateway"
    cnrm.cloud.google.com/project-id: "mock-project"
spec:
  resourceID: "vpn-gw-catalog-mock-ipsec"
  region: "us-central1"
  networkRef:
    external: "projects/mock-project/global/networks/catalog-mock-ipsec-net"
  vpnInterfaces:
    - id: 0
      interconnectAttachmentRef:
        external: "projects/mock-project/regions/us-central1/interconnectAttachments/catalog-mock-ipsec-a"
    - id: 1
      interconnectAttachmentRef:
        external: "projects/mock-project/regions/us-central1/interconnectAttachments/catalog-mock-ipsec-b"
