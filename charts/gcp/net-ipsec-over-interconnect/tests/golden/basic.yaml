kind: ComputeExternalVPNGateway
metadata:
  name: basic-peer
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: net-ipsec-over-interconnect
    app.kubernetes.io/version: "0.1.0"
