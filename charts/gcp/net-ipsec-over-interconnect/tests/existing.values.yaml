# An existing peer gateway and router: only the HA VPN gateway is made,
# and the route policies (allow_alpha) go on the named router.
allow_alpha: true
project_id: my-project
region: europe-west8
network: projects/my-project/global/networks/my-network
name: vpn-ipsec
interconnect_attachments: {a: vlan-a, b: vlan-b}
peer_gateway_config: {id: projects/my-project/global/externalVpnGateways/onprem}
router_config:
  create: false
  name: existing-router
  route_policies:
    export:
      type: EXPORT
      terms: [{priority: 1, match: {expression: "true"}, actions: []}]
