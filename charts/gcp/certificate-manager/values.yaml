#
# Values mirror the Terraform variables of fabric's certificate-manager
# module (v60.0.0): same names, types and defaults, so a module block's
# arguments become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types and the module's validations.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.map: the certificate map's name in full, as fabric's map.name is.
# A name set here takes no namePrefix. Certificates, DNS authorizations,
# issuance configs and map entries are named by their keys, as fabric
# names them.
names: {}
# An optional convenience: "<namePrefix>-" in front of every name the chart
# gives (the map's, and every certificate's, DNS authorization's, issuance
# config's and map entry's key), never one set under names. Empty (the
# default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. An unprefixed key also becomes a
# Google Cloud label (Config Connector copies it), so it must be a valid
# one; a prefixed key (hfl.dev/team) stays in Kubernetes.
labels: {}
# Cloud labels on every resource.
tags: {}

# Certificates, keyed by name: {description, labels, location, scope,
# self_managed: {pem_certificate, pem_private_key}, managed: {domains,
# dns_authorizations, issuance_config}}. self_managed is refused (README.md).
certificates: {}
# DNS authorizations, keyed by name: {domain, description, location, type,
# labels}. As in fabric, labels are accepted and not applied.
dns_authorizations: {}
# Issuance configs, keyed by name: {ca_pool, description, key_algorithm,
# labels, lifetime, location, rotation_window_percentage}.
issuance_configs: {}
# The certificate map: {name, description, labels, entries: {KEY:
# {description, hostname, labels, matcher, certificates}}}. null for none.
map: null
# Project id.
project_id: ""

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# cloud resources when the component is deleted. PREVENT has no Config
# Connector equivalent.
deletion_policy: null
