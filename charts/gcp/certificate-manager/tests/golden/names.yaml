---
# Source: certificate-manager/templates/main.yaml
apiVersion: certificatemanager.cnrm.cloud.google.com/v1beta1
kind: CertificateManagerCertificate
metadata:
  name: names-certificate-c
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "names"
    app.kubernetes.io/name: certificate-manager
    app.kubernetes.io/version: "0.1.0"
    environment: "dev"
    hfl.dev/environment: "dev"
    hfl.dev/team: "shop"
    team: "shop"
  annotations:
    hfl.dev/id: "certificate:c"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "c"
  projectRef:
    external: "my-project"
  location: "global"
  managed:
    domains:
      - shop.example.com
---
# Source: certificate-manager/templates/main.yaml
apiVersion: certificatemanager.gcp.hfl.dev/v1beta1
kind: CertificateManagerCertificateIssuanceConfig
metadata:
  name: names-issuance-config-ca
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "names"
    app.kubernetes.io/name: certificate-manager
    app.kubernetes.io/version: "0.1.0"
    environment: "dev"
    hfl.dev/environment: "dev"
    hfl.dev/team: "shop"
    team: "shop"
  annotations:
    hfl.dev/id: "issuance_config:ca"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "ca"
  projectRef:
    external: "my-project"
  location: "global"
  certificateAuthorityConfig:
    certificateAuthorityServiceConfig:
      caPool: "projects/my-project/locations/us-central1/caPools/p"
  lifetime: "2592000s"
  rotationWindowPercentage: 50
  keyAlgorithm: "RSA_2048"
  labels:
    environment: dev
    team: shop
---
# Source: certificate-manager/templates/main.yaml
apiVersion: certificatemanager.cnrm.cloud.google.com/v1beta1
kind: CertificateManagerCertificateMap
metadata:
  name: names-map
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "names"
    app.kubernetes.io/name: certificate-manager
    app.kubernetes.io/version: "0.1.0"
    environment: "dev"
    hfl.dev/environment: "dev"
    hfl.dev/team: "shop"
    team: "shop"
  annotations:
    hfl.dev/id: "map"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "shop-dev-certs"
  projectRef:
    external: "my-project"
---
# Source: certificate-manager/templates/main.yaml
apiVersion: certificatemanager.cnrm.cloud.google.com/v1beta1
kind: CertificateManagerCertificateMapEntry
metadata:
  name: names-entry-e
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "names"
    app.kubernetes.io/name: certificate-manager
    app.kubernetes.io/version: "0.1.0"
    environment: "dev"
    hfl.dev/environment: "dev"
    hfl.dev/team: "shop"
    team: "shop"
  annotations:
    hfl.dev/id: "entry:e"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "e"
  projectRef:
    external: "my-project"
  mapRef:
    name: names-map
  certificatesRefs:
    - name: names-certificate-c
  hostname: "shop.example.com"
