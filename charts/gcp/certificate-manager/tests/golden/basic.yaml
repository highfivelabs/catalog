---
# Source: certificate-manager/templates/main.yaml
apiVersion: certificatemanager.cnrm.cloud.google.com/v1beta1
kind: CertificateManagerCertificate
metadata:
  name: basic-certificate-mycert
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: certificate-manager
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "certificate:mycert"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "mycert"
  projectRef:
    external: "my-project"
  location: "global"
  managed:
    domains:
      - example.com
---
# Source: certificate-manager/templates/main.yaml
apiVersion: certificatemanager.cnrm.cloud.google.com/v1beta1
kind: CertificateManagerCertificateMap
metadata:
  name: basic-map
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: certificate-manager
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "map"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "map"
  projectRef:
    external: "my-project"
  description: "My certificate map"
---
# Source: certificate-manager/templates/main.yaml
apiVersion: certificatemanager.cnrm.cloud.google.com/v1beta1
kind: CertificateManagerCertificateMapEntry
metadata:
  name: basic-entry-mycertentry
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: certificate-manager
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "entry:mycertentry"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "mycertentry"
  projectRef:
    external: "my-project"
  mapRef:
    name: basic-map
  certificatesRefs:
    - name: basic-certificate-mycert
  hostname: "example.com"
