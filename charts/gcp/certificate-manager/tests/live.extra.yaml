# The CA pool the live case's issuance config names (no CA in it: the
# config needs only the pool).
apiVersion: privateca.cnrm.cloud.google.com/v1beta1
kind: PrivateCACAPool
metadata:
  name: live-cm-pool
  annotations: {cnrm.cloud.google.com/project-id: ${PROJECT}}
  labels: {catalog-run: ${RUN}}
spec:
  projectRef: {external: projects/${PROJECT}}
  location: ${REGION}
  resourceID: ${RUN}-pool
  tier: DEVOPS
