# The fake-cloud case (hack/mock-apply.sh): a DNS authorization, a
# certificate it authorizes, and a map with an entry for it. The issuance
# config is config-connector-extensions' kind, which the fake cloud's pin
# predates, so it is render-tested only.
project_id: mock-project
dns_authorizations:
  catalog-mock-dns: {domain: mock.example.com}
certificates:
  catalog-mock-cert:
    managed: {domains: [mock.example.com], dns_authorizations: [catalog-mock-dns]}
map:
  name: catalog-mock-map
  entries:
    catalog-mock-entry: {certificates: [catalog-mock-cert], hostname: mock.example.com}
