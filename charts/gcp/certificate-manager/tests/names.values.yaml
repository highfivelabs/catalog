# Names in full, labels and tags, as Bundt passes them from a team's naming
# convention (docs/design.md, "Names, labels and tags").
project_id: my-project
names: {map: shop-dev-certs}
labels: {hfl.dev/team: shop, hfl.dev/environment: dev}
tags: {team: shop, environment: dev}
map:
  name: map
  entries:
    e: {certificates: [c], hostname: shop.example.com}
certificates:
  c: {managed: {domains: [shop.example.com]}}
issuance_configs:
  ca: {ca_pool: projects/my-project/locations/us-central1/caPools/p, key_algorithm: RSA_2048, lifetime: 2592000s, rotation_window_percentage: 50}
