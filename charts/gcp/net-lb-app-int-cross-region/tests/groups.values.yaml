# fabric's README, "Instance Groups".
name: ilb-test
project_id: my-project
backend_service_configs:
  default:
    port_name: http
    backends:
      - group: europe-west1
      - group: europe-west4
group_configs:
  europe-west1:
    zone: europe-west1-b
    instances: [projects/myprj/zones/europe-west1-b/instances/vm-a]
    named_ports: {http: 80}
  europe-west4:
    zone: europe-west4-a
    instances: [projects/myprj/zones/europe-west1-b/instances/vm-b]
    named_ports: {http: 80}
vpc_config:
  network: projects/my-project/global/networks/my-vpc
  subnetworks:
    europe-west1: projects/my-project/regions/europe-west1/subnetworks/my-subnet-1
    europe-west4: projects/my-project/regions/europe-west4/subnetworks/my-subnet-2
