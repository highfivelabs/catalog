# fabric's README, "mTLS with Server TLS Policy".
name: ilb-test
project_id: my-project
backend_service_configs:
  default:
    backends:
      - group: projects/myprj/zones/europe-west1-a/instanceGroups/my-ig-ew1
      - group: projects/myprj/zones/europe-west4-a/instanceGroups/my-ig-ew4
protocol: HTTPS
https_proxy_config:
  certificate_manager_certificates:
    - projects/myprj/locations/global/certificates/certificate
  server_tls_policy: projects/myprj/locations/global/serverTlsPolicies/my-tls-policy
vpc_config:
  network: projects/my-project/global/networks/my-vpc
  subnetworks:
    europe-west1: projects/my-project/regions/europe-west1/subnetworks/my-subnet-1
    europe-west4: projects/my-project/regions/europe-west4/subnetworks/my-subnet-2
