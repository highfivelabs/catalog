# Source: net-lb-app-int-cross-region/templates/urlmap.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeURLMap
metadata:
  name: url-map
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "url-map"
    app.kubernetes.io/name: net-lb-app-int-cross-region
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "url_map"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "ilb-test"
  location: global
  description: "Terraform managed."
  defaultService:
    backendServiceRef:
      name: url-map-bs-default
  hostRule:
    - hosts: ["*"]
      pathMatcher: "pathmap"
  pathMatcher:
    - name: "pathmap"
      defaultService:
        backendServiceRef:
          name: url-map-bs-default
      pathRule:
        - paths: ["/video","/video/*"]
          service:
            backendServiceRef:
              name: url-map-bs-video
