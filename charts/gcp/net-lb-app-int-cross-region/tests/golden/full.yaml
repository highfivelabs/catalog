    hfl.dev/id: "url_map"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: "ilb-full"
  location: global
  description: "The URL map."
  defaultRouteAction:
    corsPolicy:
      allowCredentials: true
      allowHeaders: ["x-a"]
      allowMethods: ["GET"]
      allowOriginRegexes: [".*\\.example\\.com"]
      allowOrigins: ["https://example.com"]
      disabled: false
      exposeHeaders: ["x-b"]
      maxAge: 3600
    faultInjectionPolicy:
      abort:
        httpStatus: 503
        percentage: 0.5
      delay:
        fixedDelay:
          seconds: "1"
          nanos: 0
        percentage: 1
    requestMirrorPolicy:
      backendServiceRef:
        name: full-bs-mirror
    retryPolicy:
      numRetries: 2
      retryConditions: ["5xx"]
      perTryTimeout:
        seconds: "3"
    timeout:
      seconds: "30"
      nanos: 5
    urlRewrite:
      hostRewrite: "rewritten.example.com"
      pathPrefixRewrite: "/v2"
    weightedBackendServices:
      - backendServiceRef:
          name: full-bs-api
        weight: 10
      - backendServiceRef:
          name: full-bs-default
        weight: 90
        headerAction:
          requestHeadersToAdd:
            - headerName: "x-canary"
              headerValue: "no"
              replace: true
          responseHeadersToRemove: ["x-internal"]
  headerAction:
    requestHeadersToAdd:
      - headerName: "x-lb"
        headerValue: "ilb"
        replace: false
    requestHeadersToRemove: ["x-remove"]
    responseHeadersToAdd:
      - headerName: "x-served-by"
        headerValue: "ilb"
        replace: true
    responseHeadersToRemove: ["server"]
  hostRule:
    - hosts: ["api.example.com"]
      pathMatcher: "api"
      description: "API hosts."
    - hosts: ["old.example.com"]
      pathMatcher: "redirect"
  pathMatcher:
    - name: "api"
      description: "API."
      defaultService:
        backendServiceRef:
          name: full-bs-api
      pathRule:
        - paths: ["/v1/*"]
          service:
            backendServiceRef:
              name: full-bs-api
          routeAction:
            timeout:
              seconds: "10"
            urlRewrite:
              pathPrefixRewrite: "/"
        - paths: ["/old/*"]
          urlRedirect:
            hostRedirect: "new.example.com"
            httpsRedirect: false
            pathRedirect: "/new"
            redirectResponseCode: "MOVED_PERMANENTLY_DEFAULT"
            stripQuery: true
      routeRules:
        - priority: 1
          service: "projects/my-project/global/backendServices/ilb-full-api"
          headerAction:
            requestHeadersToAdd:
              - headerName: "x-route"
                headerValue: "1"
                replace: true
          matchRules:
            - ignoreCase: true
              fullPathMatch: "/api/v1/users"
              headerMatches:
                - headerName: "x-exact"
                  invertMatch: false
                  exactMatch: "a"
                - headerName: "x-prefix"
                  invertMatch: true
                  prefixMatch: "b"
                - headerName: "x-suffix"
                  invertMatch: false
                  suffixMatch: "c"
                - headerName: "x-regex"
                  invertMatch: false
                  regexMatch: "d.*"
                - headerName: "x-present"
                  invertMatch: false
                  presentMatch: true
                - headerName: "x-range"
                  invertMatch: false
                  rangeMatch:
                    rangeEnd: 10
                    rangeStart: 1
              metadataFilters:
                - filterMatchCriteria: MATCH_ALL
                  filterLabels:
                    - name: "env"
                      value: "prod"
              queryParameterMatches:
                - name: "q1"
                  exactMatch: "v"
                - name: "q2"
                  regexMatch: "v.*"
                - name: "q3"
                  presentMatch: true
            - ignoreCase: false
              prefixMatch: "/api/"
            - ignoreCase: false
              regexMatch: "/api/[a-z]+"
            - ignoreCase: false
              pathTemplateMatch: "/api/{id=*}"
          routeAction:
            urlRewrite:
              pathTemplateRewrite: "/{id}"
        - priority: 2
          service: "projects/my-project/global/backendServices/external"
          urlRedirect:
            prefixRedirect: "/p"
    - name: "redirect"
      defaultUrlRedirect:
        hostRedirect: "new.example.com"
        httpsRedirect: false
        stripQuery: false
  test:
    - host: "api.example.com"
      path: "/v1/x"
      service:
        backendServiceRef:
          external: "projects/my-project/global/backendServices/ilb-full-api"
      description: "API test."
