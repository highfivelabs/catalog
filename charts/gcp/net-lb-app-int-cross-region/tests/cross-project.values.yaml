# fabric's README, "Cross-project backend services".
name: ilb-test
project_id: prj-host
backend_service_configs:
  default:
    project_id: prj-svc
    backends:
      - group: projects/prj-svc/zones/europe-west1-a/instanceGroups/my-ig-ew1
      - group: projects/prj-svc/zones/europe-west4-a/instanceGroups/my-ig-ew4
health_check_configs:
  default:
    project_id: prj-svc
    http: {port_specification: USE_SERVING_PORT}
vpc_config:
  network: projects/my-project/global/networks/my-vpc
  subnetworks:
    europe-west1: projects/my-project/regions/europe-west1/subnetworks/my-subnet-1
    europe-west4: projects/my-project/regions/europe-west4/subnetworks/my-subnet-2
