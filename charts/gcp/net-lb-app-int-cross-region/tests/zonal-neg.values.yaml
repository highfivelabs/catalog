# fabric's README, "Zonal NEG creation" (the addresses written out).
name: ilb-test
project_id: my-project
backend_service_configs:
  default:
    backends:
      - {balancing_mode: RATE, group: my-neg-ew1, max_rate: {per_endpoint: 1}}
      - {balancing_mode: RATE, group: my-neg-ew4, max_rate: {per_endpoint: 1}}
neg_configs:
  my-neg-ew1:
    gce:
      zone: europe-west1-b
      endpoints:
        e-0: {instance: test-ew1, ip_address: 10.0.0.10, port: 80}
  my-neg-ew4:
    gce:
      zone: europe-west4-b
      endpoints:
        e-0: {instance: test-ew4, ip_address: 10.0.0.11, port: 80}
vpc_config:
  network: projects/my-project/global/networks/my-vpc
  subnetworks:
    europe-west1: projects/my-project/regions/europe-west1/subnetworks/my-subnet-1
    europe-west4: projects/my-project/regions/europe-west4/subnetworks/my-subnet-2
