# fabric's README, "Private Service Connect NEG creation".
name: ilb-test
project_id: my-project
backend_service_configs:
  default:
    backends:
      - group: neg-ew1
      - group: neg-ew4
    health_checks: []
health_check_configs: {}
neg_configs:
  neg-ew1:
    psc: {region: europe-west1, target_service: europe-west1-cloudkms.googleapis.com}
  neg-ew4:
    psc: {region: europe-west4, target_service: europe-west4-cloudkms.googleapis.com}
vpc_config:
  network: projects/my-project/global/networks/my-vpc
  subnetworks:
    europe-west1: projects/my-project/regions/europe-west1/subnetworks/my-subnet-1
    europe-west4: projects/my-project/regions/europe-west4/subnetworks/my-subnet-2
