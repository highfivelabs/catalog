# fabric's README, "Hybrid NEG creation".
name: ilb-test
project_id: my-project
backend_service_configs:
  default:
    backends:
      - {balancing_mode: RATE, group: neg-ew1, max_rate: {per_endpoint: 1}}
      - {balancing_mode: RATE, group: neg-ew4, max_rate: {per_endpoint: 1}}
neg_configs:
  neg-ew1:
    hybrid:
      zone: europe-west1-b
      endpoints:
        e-0-ew1: {ip_address: 10.0.0.10, port: 80}
  neg-ew4:
    hybrid:
      zone: europe-west4-b
      endpoints:
        e-0-ew4: {ip_address: 10.0.0.20, port: 80}
vpc_config:
  network: projects/my-project/global/networks/my-vpc
  subnetworks:
    europe-west1: projects/my-project/regions/europe-west1/subnetworks/my-subnet-1
    europe-west4: projects/my-project/regions/europe-west4/subnetworks/my-subnet-2
