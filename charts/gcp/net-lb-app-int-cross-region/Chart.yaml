apiVersion: v2
name: net-lb-app-int-cross-region
description: >-
  A cross-region internal Application Load Balancer: global forwarding
  rules in each region's subnet, an HTTP or HTTPS proxy, a URL map,
  backend services, health checks, optional instance groups, network
  endpoint groups and PSC service attachments, as Config Connector
  objects. A port of Cloud Foundation Fabric's net-lb-app-int-cross-region
  module.
type: application
version: 0.1.0
# The fabric release this chart was ported from (UPSTREAM.md).
appVersion: "fabric-v60.0.0"
kubeVersion: ">=1.27.0-0"
keywords: [gcp, config-connector, load-balancer, http, https, url-map, cross-region, neg, fabric]
