# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set, or accepts only in part. Read by `task
# coverage`; `task coverage-verify` renders the chart to check that each one
# is refused. kind: gap (no Config Connector kind or field) or by-design
# (Bundt replaces it). partial: the variable is accepted, the reason says
# what is refused.
refused:
  - variable: context
    kind: by-design
    reason: "Bundt replaces fabric's $context lookups with ${...} expressions and valueFrom in the component's inputs"
  - variable: backend_service_configs
    kind: gap
    reason: "ComputeBackendService's logConfig has no optionalMode or optionalFields"
    partial: true
    fields: [log_config.optional_mode, log_config.optional_fields]
  - variable: service_attachment
    kind: gap
    reason: "ComputeServiceAttachment has no domainNames or reconcileConnections"
    partial: true
    fields: [domain_name, reconcile_connections]
  - variable: service_directory_registration
    kind: gap
    reason: "ComputeForwardingRule's serviceDirectoryRegistrations has no namespace or serviceDirectoryRegion"
