#
# Values mirror the Terraform variables of fabric's datafusion module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types and the module's validations.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# The cloud names in full: {instance, firewall}. A name set here takes no
# prefix. Not set, each derives as fabric derives it: <name> and
# <name>-allow-ssh.
names: {}
# An optional convenience: "<namePrefix>-" in front of every derived cloud
# name (never one set under names). Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object (fabric's labels, on the instance, are
# these). A prefixed key (hfl.dev/team) stays in Kubernetes; an unprefixed
# one also becomes a Google Cloud label, since Config Connector copies it.
labels: {}
# Cloud labels on every resource (Config Connector carries them as
# unprefixed metadata.labels).
tags: {}

# DataFusion instance description.
description: Terraform managed.
# Option to enable Stackdriver Logging.
enable_stackdriver_logging: false
# Option to enable Stackdriver Monitoring.
enable_stackdriver_monitoring: false
# Create the firewall rule that allows SSH from the instance's range.
firewall_create: true
# The IP range allocated to the instance (CIDR), when it is not made by
# the module.
ip_allocation: null
# Create the IP range for the instance: refused when true (README.md,
# "Values"); set false and give ip_allocation.
ip_allocation_create: true
# Name of the DataFusion instance.
name: ""
# The network the tenant project peers with:
# projects/{project-id}/global/networks/{network}.
network: ""
# Create the network peering with the tenant project: refused when true
# (README.md, "Values").
network_peering: true
# Create a private instance.
private_instance: true
# Project ID.
project_id: ""
# DataFusion region.
region: ""
# BASIC or ENTERPRISE (the default); the API also takes DEVELOPER.
type: ENTERPRISE

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# instance and the firewall rule when the component is deleted. PREVENT has
# no Config Connector equivalent.
deletion_policy: null
