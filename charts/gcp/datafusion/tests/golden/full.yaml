---
# Source: datafusion/templates/main.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeFirewall
metadata:
  name: full-allow-ssh
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: datafusion
    app.kubernetes.io/version: "0.1.0"
    team: "data"
  annotations:
    hfl.dev/id: "firewall"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: etl-allow-ssh
  networkRef:
    external: "projects/my-project/global/networks/my-network"
  direction: INGRESS
  sourceRanges: ["10.10.0.0/22"]
  targetTags: ["etl-allow-ssh"]
  allow:
    - protocol: tcp
      ports: ["22"]
---
# Source: datafusion/templates/main.yaml
apiVersion: datafusion.cnrm.cloud.google.com/v1beta1
kind: DataFusionInstance
metadata:
  name: full
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: datafusion
    app.kubernetes.io/version: "0.1.0"
    team: "data"
  annotations:
    hfl.dev/id: "instance"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: etl
  location: "europe-west1"
  type: BASIC
  description: "ETL pipelines"
  privateInstance: true
  enableStackdriverLogging: true
  enableStackdriverMonitoring: true
  networkConfig:
    networkRef:
      external: "projects/my-project/global/networks/my-network"
    ipAllocation: "10.10.0.0/22"
