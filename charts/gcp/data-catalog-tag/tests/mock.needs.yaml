#
# What tests/mock.values.yaml needs and the chart does not make: the tag
# template its tags fill in (Config Connector's DataCatalogTagTemplate,
# v1alpha1; mockgcp refuses a tag whose template does not exist).
apiVersion: datacatalog.cnrm.cloud.google.com/v1alpha1
kind: DataCatalogTagTemplate
metadata:
  name: catalog-mock-tt
spec:
  projectRef:
    external: mock-project
  location: us-central1
  resourceID: catalog_mock_tt
  displayName: Catalog mock template
  fields:
    owner:
      displayName: Owner
      isRequired: true
      type:
        primitiveType: STRING
    score:
      displayName: Score
      type:
        primitiveType: DOUBLE
    reviewed:
      displayName: Reviewed
      type:
        primitiveType: BOOL
