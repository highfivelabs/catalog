# Labels. The chart gives no cloud name, so names takes no key
# (docs/design.md, "Names, labels and tags"); ABANDON keeps the tags.
labels: {hfl.dev/team: shop, hfl.dev/environment: dev, env: dev}
deletion_policy: ABANDON
tags:
  a:
    project_id: my-project
    parent: projects/my-project/datasets/a
    location: us
    template: projects/my-project/locations/us/tagTemplates/owners
    fields:
      owner: {string_value: shop}
      reviewed: {bool_value: false}
