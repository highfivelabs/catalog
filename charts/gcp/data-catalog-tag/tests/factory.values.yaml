# fabric's README, "Factory": the file data/tag_1.yaml under
# factories_data.tags.tag_1 (factories_config is accepted and ignored),
# beside a tag of the variable.
factories_config:
  tags: data
factories_data:
  tags:
    tag_1:
      project_id: project-data-product
      parent: projects/project-data-product/datasets/exposure
      location: europe-west1
      template: projects/project-datagov/locations/europe-west1/tagTemplates/test
      fields:
        owner_email: {string_value: example@example.com}
        num: {double_value: 5}
        pii: {enum_value: NONE}
        bool: {bool_value: true}
tags:
  landing/countries:
    project_id: project-data-product
    parent: projects/project-data-product/datasets/landing/tables/countries
    column: country
    location: europe-west1
    template: projects/project-datagov/locations/europe-west1/tagTemplates/demo
    fields:
      source: {string_value: DB-1 Table-A Column-B}
