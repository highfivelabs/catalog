# Applied to the fake cloud by hack/mock-apply.sh: a tag on a dataset and
# one on a column of a table, with the tag template tests/mock.needs.yaml
# makes. mockgcp does not check that the @bigquery entry exists (the real
# API resolves it from the BigQuery resource), so no dataset is made.
labels: {env: test}
tags:
  dataset:
    project_id: mock-project
    parent: projects/mock-project/datasets/catalog_mock
    location: us-central1
    template: projects/mock-project/locations/us-central1/tagTemplates/catalog_mock_tt
    fields:
      owner: {string_value: data-platform}
      score: {double_value: 4.5}
      reviewed: {bool_value: true}
  column:
    project_id: mock-project
    parent: projects/mock-project/datasets/catalog_mock/tables/orders
    column: customer_id
    location: us-central1
    template: projects/mock-project/locations/us-central1/tagTemplates/catalog_mock_tt
    fields:
      owner: {string_value: sales}
