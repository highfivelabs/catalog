# The live case (hack/live-apply.sh LIVE_CHARTS=data-catalog-tag): a tag on
# a BigQuery dataset of the run and one on a column of its table, with the
# tag template live.extra.yaml makes (config-connector-extensions'
# DataCatalogTag).
labels: {catalog-run: ${RUN}}
tags:
  dataset:
    project_id: ${PROJECT}
    parent: projects/${PROJECT}/datasets/${RUN_}_dct
    location: ${REGION}
    template: projects/${PROJECT}/locations/${REGION}/tagTemplates/${RUN_}_tt
    fields:
      owner: {string_value: data-platform}
      score: {double_value: 4.5}
      reviewed: {bool_value: true}
  column:
    project_id: ${PROJECT}
    parent: projects/${PROJECT}/datasets/${RUN_}_dct/tables/orders
    column: customer_id
    location: ${REGION}
    template: projects/${PROJECT}/locations/${REGION}/tagTemplates/${RUN_}_tt
    fields:
      owner: {string_value: sales}
