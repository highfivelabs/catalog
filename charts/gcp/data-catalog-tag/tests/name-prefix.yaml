#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every object this
# chart renders carries the namePrefix in its cloud-side name
# (spec.resourceID), except the kinds listed here, each with the reason it
# cannot collide with another Instance's. A kind added to the chart and not
# listed fails `task test` until it is prefixed or listed.
exempt:
  DataCatalogTag: "the API assigns a tag's ID at create; a tag is found by its entry, template and column, all module inputs, so it has no name a namePrefix could apply to"
# Every kind this chart renders is exempt: it gives no cloud name at all.
noCloudNames: "a Data Catalog tag's ID is the API's, and its entry is named by the BigQuery resource it tags; the chart names nothing"
