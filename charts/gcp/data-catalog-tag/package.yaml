#
# The Bundt Package for this chart (see iam-service-account/package.yaml).
# Outputs are fabric's declared outputs (docs/design.md, "Outputs"):
# data_catalog_tag_ids, keyed by the tag's key, is the tag's name as
# Terraform's id gives it, projects/<p>/locations/<l>/entryGroups/@bigquery/
# entries/<entry>/tags/<id>. The API assigns the tag's ID at create, so it
# is read from the object's status.externalRef, null until reported.
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: gcp-data-catalog-tag
spec:
  version: 0.1.0
  engine: helm
  providers: [kcc]
  outputs:
    data_catalog_tag_ids: >-
      resources.transformMapEntry(k, v, v.kind == 'DataCatalogTag',
        {k.substring(4): has(v.status) && has(v.status.externalRef) ? dyn(v.status.externalRef) : null})
