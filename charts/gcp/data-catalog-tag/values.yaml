#
# Values mirror the Terraform variables of fabric's data-catalog-tag module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types.

# Names and labels (docs/design.md, "Names, labels and tags"). Not
# Terraform variables. A tag has no name of its own: the API assigns its ID,
# and it is found by its entry, template and column. So the chart gives no
# cloud name, names takes no key, and namePrefix changes nothing
# (tests/name-prefix.yaml).
names: {}
# An optional convenience every chart takes; it has nothing to prefix here.
namePrefix: ""
# Kubernetes labels on every object. Data Catalog tags have no cloud
# labels, so an unprefixed one stays in Kubernetes too, but must still be a
# valid Google Cloud label. (This chart's tags value is the module's own
# tags variable, below, not cloud labels.)
labels: {}

# Paths to data files and folders that enable factory functionality.
# Accepted and ignored: the files' contents go under factories_data
# (below).
factories_config: {}
# Tags definitions in the form {TAG => TAG_DEFINITION}.
tags: {}

# Not a fabric variable: the tags factory's files, as data (docs/design.md,
# "Submodules and factories"). One entry per file of the folder
# factories_config.tags names, keyed by the file's name without .yaml (the
# tag's key, as fabric takes it), each exactly the file's content. A tag of
# the tags variable wins over the file of the same key, as fabric's merge
# does.
factories_data:
  tags: {}

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# tags when the component is deleted. PREVENT has no Config Connector
# equivalent.
deletion_policy: null
