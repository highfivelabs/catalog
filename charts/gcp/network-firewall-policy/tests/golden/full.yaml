# Source: network-firewall-policy/templates/main.yaml
apiVersion: compute.cnrm.cloud.google.com/v1alpha1
kind: ComputeNetworkFirewallPolicyRule
metadata:
  name: full-rule-200
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: network-firewall-policy
    app.kubernetes.io/version: "0.1.0"
    hfl.dev/team: "net"
  annotations:
    hfl.dev/id: "rule:200"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: "200"
  projectRef:
    external: "my-project"
  firewallPolicyRef:
    external: "fw-policy"
  action: "deny"
  direction: EGRESS
  disabled: false
  enableLogging: false
  targetServiceAccountRefs:
    - external: "vm@my-project.iam.gserviceaccount.com"
  match:
    destIpRanges:
      - "0.0.0.0/0"
    destFqdns:
      - "bad.example.com"
    destRegionCodes:
      - "KP"
    destThreatIntelligences:
      - "iplist-tor-exit-nodes"
    destAddressGroups:
      - "projects/my-project/locations/global/addressGroups/bad"
    layer4Configs:
    - ipProtocol: "all"
