# Source: network-firewall-policy/templates/main.yaml
apiVersion: compute.cnrm.cloud.google.com/v1alpha1
kind: ComputeNetworkFirewallPolicyRule
metadata:
  name: full-rule-100
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: network-firewall-policy
    app.kubernetes.io/version: "0.1.0"
    hfl.dev/team: "net"
  annotations:
    hfl.dev/id: "rule:100"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: "100"
  projectRef:
    external: "my-project"
  firewallPolicyRef:
    external: "fw-policy"
  action: "allow"
  direction: INGRESS
  ruleName: "allow-everything-listed"
  description: "Every INGRESS match field"
  disabled: true
  enableLogging: true
  targetSecureTags:
    - name: "tagValues/111"
    - name: "tagValues/222"
  match:
    srcIpRanges:
      - "10.0.0.0/8"
    srcFqdns:
      - "example.com"
    srcRegionCodes:
      - "US"
    srcThreatIntelligences:
      - "iplist-known-malicious-ips"
    srcAddressGroups:
      - "projects/my-project/locations/global/addressGroups/ag"
    srcSecureTags:
      - name: "tagValues/333"
    destIpRanges:
      - "10.1.0.0/16"
    layer4Configs:
    - ipProtocol: "tcp"
      ports:
        - "80"
        - "443"
        - "8000-8100"
    - ipProtocol: "udp"
