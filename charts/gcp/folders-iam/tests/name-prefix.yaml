#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every object this
# chart renders carries the namePrefix in its cloud-side name, except the
# kinds listed here, each with the reason it cannot collide with another
# Instance's.
exempt:
  IAMPolicyMember: "binds one member on a folder; it has no name of its own"
  IAMPartialPolicy: "binds members on a folder; it has no name of its own"
nothingNamed: "the chart makes IAM bindings on folders it does not create, and nothing with a cloud name of its own"
