---
# Source: folders-iam/templates/main.yaml
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPartialPolicy
metadata:
  name: authoritative-1234567890-iam
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "authoritative"
    app.kubernetes.io/name: folders-iam
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "folder:1234567890:iam"
spec:
  resourceRef:
    apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
    external: folders/1234567890
    kind: Folder
  bindings:
    - role: "roles/resourcemanager.folderEditor"
      members:
        - member: "group:my-group@my-org.com"
        - member: "serviceAccount:my-sa@my-project.iam.gserviceaccount.com"
    - role: "roles/resourcemanager.folderViewer"
      members:
        - member: "user:my-user@my-org.com"
    - role: "roles/editor"
      members:
        - member: "user:my-user@my-org.com"
      condition:
        title: "expires_after_2019_12_31"
        expression: "request.time < timestamp(\"2020-01-01T00:00:00Z\")"
        description: "Expiring at midnight of 2019-12-31"
    - role: "roles/resourcemanager.folderViewer"
      members:
        - member: "group:support@my-org.com"
      condition:
        title: "business_hours"
        expression: "request.time.getHours(\"Europe/Berlin\") >= 9"
