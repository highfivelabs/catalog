# Every input: additive on two folders (one given twice, both ways, which
# is one folder), roles and conditional roles, labels, tags, ABANDON.
folders: ["folders/1234567890", "1234567890", "folders/3456789012"]
mode: additive
bindings:
  roles/browser: [group:everyone@my-org.com]
  roles/resourcemanager.folderViewer: [user:a@my-org.com, user:b@my-org.com]
  roles/resourcemanager.folderAdmin: []
conditional_bindings:
  - role: roles/resourcemanager.projectCreator
    title: until_2030
    description: Until 2030
    expression: request.time < timestamp("2030-01-01T00:00:00Z")
    members: [group:builders@my-org.com, user:a@my-org.com]
deletion_policy: ABANDON
labels: {hfl.dev/team: platform}
tags: {environment: prod}
