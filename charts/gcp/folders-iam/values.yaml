#
# Values mirror the Terraform variables of terraform-google-modules' iam
# module, modules/folders_iam (v8.3.0): same names, types and defaults, so
# a module block's arguments become this file one to one (README.md, "From
# Terraform"). The variables follow in alphabetical order, each with the
# module's own description. values.schema.json carries the types.
#
# Descriptions quoted from terraform-google-iam
# (modules/folders_iam/variables.tf, v8.3.0), Copyright Google LLC,
# Apache-2.0.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables. The chart gives no cloud names (IAM bindings have
# none), so names takes no key; namePrefix changes nothing.
names: {}
namePrefix: ""
# Kubernetes labels on every object. A prefixed key (hfl.dev/team) stays in
# Kubernetes; an unprefixed one is checked as a Google Cloud label.
labels: {}
# Cloud labels, as unprefixed metadata.labels (IAM bindings carry none).
tags: {}
# DELETE (the default) or ABANDON. Not a module variable. The chart makes
# no resource of its own, only IAM grants, which are removed with the
# component either way (docs/design.md, "Deletion"); PREVENT is refused.
deletion_policy: null

# Map of role (key) and list of members (value) to add the IAM policies/bindings
bindings: {}
# List of maps of role and respective conditions, and the members to add the IAM policies/bindings
# [{role, title, description, expression, members: [MEMBER]}]
conditional_bindings: []
# Folders list to add the IAM policies/bindings
# Each folders/<number> or <number>, as the module takes them.
folders: []
# Mode for adding the IAM policies/bindings, additive and authoritative
mode: additive
