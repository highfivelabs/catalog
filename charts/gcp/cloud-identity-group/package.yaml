#
# The Bundt Package for this chart (see iam-service-account/package.yaml).
# fabric's outputs: id, the group's resource name (groups/<id>), which
# Cloud Identity assigns, read from the group's status; name, the group's
# key, from the inputs (names.group when it is set).
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: gcp-cloud-identity-group
spec:
  version: 0.1.0
  engine: helm
  providers: [kcc]
  outputs:
    id: resources.group.status.name
    name: >-
      ('group' in inputs.names && inputs.names.group != '' ? inputs.names.group : inputs.name)
