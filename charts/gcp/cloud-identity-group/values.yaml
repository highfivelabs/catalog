#
# Values mirror the Terraform variables of fabric's cloud-identity-group
# module (v60.0.0): same names, types and defaults, so a module block's
# arguments become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types and the module's validations.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.group: the group's key (its email address) in full, in place of
# name.
names: {}
# An optional convenience the other charts share. A group's name is an
# email address, given in full, so the namePrefix does not go into it.
namePrefix: ""
# Kubernetes labels on every object. Cloud Identity labels are fixed
# group types, not free labels, so these stay in Kubernetes.
labels: {}
# Cloud labels on every resource; groups and memberships take none, so
# these stay in Kubernetes too.
tags: {}

# Directory customer ID in the form customers/C0xxxxxxx.
customer_id: ""
# Group description.
description: null
# Group display name.
display_name: ""
# List of group managers.
managers: []
# List of group members.
members: []
# Group ID (usually an email).
name: ""

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# group and its memberships when the component is deleted. PREVENT has no
# Config Connector equivalent.
deletion_policy: null
