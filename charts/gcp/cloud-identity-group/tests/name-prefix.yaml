#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every object this
# chart renders carries the namePrefix in its cloud-side name
# (spec.resourceID), except the kinds listed here, each with the reason it
# cannot collide with another Instance's. A kind added to the chart and not
# listed fails `task test` until it is prefixed or listed.
exempt:
  CloudIdentityGroup: "Cloud Identity assigns the group's resource name; its key is an email address (name or names.group), given in full, which a namePrefix does not go into"
  CloudIdentityMembership: "a member of the chart's group; Cloud Identity assigns its name"
noCloudNames: "the group's only caller-given name is its email address, given in full (name or names.group); Cloud Identity names the group and its memberships"
