# A private Autopilot cluster with fabric's defaults, after the module README's
# first example.
project_id: my-project
name: cluster-1
location: europe-west1-b
vpc_config:
  network: projects/my-project/global/networks/vpc
  subnetwork: projects/my-project/regions/europe-west1/subnetworks/gke
  secondary_range_names: {pods: pods, services: services}
access_config:
  ip_access:
    authorized_ranges: {internal-vms: 10.0.0.0/8}
  master_ipv4_cidr_block: 192.168.0.0/28
labels: {environment: dev}
