# The fake-cloud case (hack/mock-apply.sh): a regional Autopilot cluster on the network
# and subnet tests/mock.needs.yaml makes, fabric's defaults, no backup
# objects (their kinds are newer than the fake cloud's CCE_COMMIT).
project_id: mock-project
name: catalog-mock-gka
location: us-central1
vpc_config:
  network: projects/mock-project/global/networks/catalog-mock-gka-net
  subnetwork: projects/mock-project/regions/us-central1/subnetworks/catalog-mock-gka-sn
access_config: {private_nodes: false}
