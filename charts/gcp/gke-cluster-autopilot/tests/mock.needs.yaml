# What tests/mock.values.yaml needs in the fake cloud: the network and the
# subnet the cluster is on. hack/mock-apply.sh applies them first, waits for
# them, and deletes them after the chart's objects. Not part of the chart.
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeNetwork
metadata:
  name: catalog-mock-gka-net
  annotations:
    cnrm.cloud.google.com/project-id: mock-project
spec:
  autoCreateSubnetworks: false
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeSubnetwork
metadata:
  name: catalog-mock-gka-sn
  annotations:
    cnrm.cloud.google.com/project-id: mock-project
spec:
  region: us-central1
  ipCidrRange: 10.71.0.0/24
  networkRef:
    name: catalog-mock-gka-net
