# Source: gke-cluster-autopilot/templates/backup.yaml
apiVersion: gkebackup.gcp.hfl.dev/v1beta1
kind: GKEBackupRestorePlan
metadata:
  name: full-restore-plan-all
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: gke-cluster-autopilot
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "restore_plan:all"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: "all"
  projectRef:
    external: "my-project"
  location: "europe-west1"
  cluster: "projects/my-project/locations/europe-west1/clusters/cluster-full"
  backupPlan: "projects/my-project/locations/europe-west1/backupPlans/daily"
  restoreConfig:
    namespacedResourceRestoreMode: "FAIL_ON_CONFLICT"
    clusterResourceConflictPolicy: "USE_EXISTING_VERSION"
    clusterResourceRestoreScope:
      selectedGroupKinds: [{"resourceGroup":"storage.k8s.io","resourceKind":"StorageClass"}]
    volumeDataRestorePolicy: "RESTORE_VOLUME_DATA_FROM_BACKUP"
    volumeDataRestorePolicyBindings:
      - volumeType: "GCE_PERSISTENT_DISK"
        policy: "NO_VOLUME_DATA_RESTORATION"
    selectedNamespaces:
      namespaces: ["default"]
    restoreOrder:
      groupKindDependencies:
        - requiring: {"resourceKind":"Pod"}
          satisfying: {"resourceKind":"ConfigMap"}
    transformationRules:
      - fieldActions:
          - op: "REMOVE"
            path: "/metadata/annotations"
        description: "drop annotations"
        resourceFilter:
          namespaces: ["default"]
          groupKinds: [{"resourceKind":"Deployment"}]
---
