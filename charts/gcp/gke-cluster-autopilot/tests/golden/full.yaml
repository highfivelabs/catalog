  labels: {"team":"ops"}
---
# Source: gke-cluster-autopilot/templates/backup.yaml
apiVersion: gkebackup.gcp.hfl.dev/v1beta1
kind: GKEBackupBackupPlan
metadata:
  name: full-backup-plan-daily
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: gke-cluster-autopilot
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "backup_plan:daily"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: "daily"
  projectRef:
    external: "my-project"
  location: "europe-west1"
  cluster: "projects/my-project/locations/europe-west1/clusters/cluster-full"
  retentionPolicy:
    backupRetainDays: 7
    locked: false
  backupSchedule:
    cronSchedule: "0 3 * * *"
  backupConfig:
    includeVolumeData: true
    includeSecrets: true
    encryptionKey:
      gcpKmsEncryptionKey: "projects/kms/locations/europe-west1/keyRings/k/cryptoKeys/backup"
    selectedApplications:
      namespacedNames:
        - {namespace: "app", name: "web"}
        - {namespace: "app", name: "api"}
---
# Source: gke-cluster-autopilot/templates/backup.yaml
apiVersion: gkebackup.gcp.hfl.dev/v1beta1
kind: GKEBackupBackupPlan
metadata:
  name: full-backup-plan-ns
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: gke-cluster-autopilot
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "backup_plan:ns"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: "ns"
  projectRef:
    external: "my-project"
  location: "europe-west1"
  cluster: "projects/my-project/locations/europe-west1/clusters/cluster-full"
  retentionPolicy:
    backupDeleteLockDays: 2
    locked: true
  backupConfig:
    includeVolumeData: true
    includeSecrets: false
    selectedNamespaces:
      namespaces: ["default"]
