---
# Source: gke-cluster-autopilot/templates/cluster.yaml
apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerCluster
metadata:
  name: mock
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: gke-cluster-autopilot
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "cluster"
    cnrm.cloud.google.com/project-id: "mock-project"
spec:
  resourceID: "catalog-mock-gka"
  location: "us-central1"
  networkRef:
    external: "projects/mock-project/global/networks/catalog-mock-gka-net"
  subnetworkRef:
    external: "projects/mock-project/regions/us-central1/subnetworks/catalog-mock-gka-sn"
  enableMultiNetworking: false
  enableL4IlbSubsetting: false
  enableTpu: false
  initialNodeCount: 1
  enableAutopilot: true
  allowNetAdmin: false
  enableCiliumClusterwideNetworkPolicy: false
  enableFqdnNetworkPolicy: false
  addonsConfig:
    httpLoadBalancing:
      disabled: false
    horizontalPodAutoscaling:
      disabled: false
    cloudrunConfig:
      disabled: true
    kalmConfig:
      enabled: false
    configConnectorConfig:
      enabled: false
    gkeBackupAgentConfig:
      enabled: false
  costManagementConfig:
    enabled: true
  controlPlaneEndpointsConfig:
    dnsEndpointConfig:
      allowExternalTraffic: true
    ipEndpointsConfig:
      enabled: false
  loggingConfig:
    enableComponents: ["SYSTEM_COMPONENTS","WORKLOADS"]
  maintenancePolicy:
    dailyMaintenanceWindow:
      startTime: "03:00"
  masterAuth:
    clientCertificateConfig:
      issueClientCertificate: false
  monitoringConfig:
    enableComponents: ["SYSTEM_COMPONENTS"]
    managedPrometheus:
      enabled: true
  releaseChannel:
    channel: "REGULAR"
