# Values mirror the Terraform variables of fabric's gke-cluster-autopilot
# module (v60.0.0): same names, types and defaults, so a module block's
# arguments become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types and the module's validations.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.cluster: the cluster's name in full; names.topic: the upgrade
# notifications topic's (fabric's gke-pubsub-notifications). A name set
# here takes no prefix. Backup plans and channels are named by their keys.
names: {}
# An optional convenience: "<namePrefix>-" in front of every name the chart
# derives (never one set under names). Empty (the default) changes nothing.
namePrefix: ""
# fabric's labels, the cluster's resource labels: Kubernetes labels on every
# object; an unprefixed key also becomes a Google Cloud label.
labels: {}
# Cloud labels on every resource that takes them.
tags: {}

# Control plane endpoint and nodes access configurations: {dns_access:
# {allow_external_traffic, enable_k8s_tokens, enable_k8s_certs}, ip_access:
# {authorized_ranges, disable_public_endpoint,
# gcp_public_cidrs_access_enabled,
# private_endpoint_authorized_ranges_enforcement, private_endpoint_config:
# {endpoint_subnetwork, global_access}}, master_ipv4_cidr_block,
# private_nodes (true)}.
access_config: {}
# Configuration for Backup for GKE: {enable_backup_agent, backup_channels,
# backup_plans, restore_channels, restore_plans}, each map keyed by name.
backup_configs: {}
# Context-specific interpolations. Refused when set: Bundt's ${...}
# expressions and valueFrom replace fabric's $context lookups.
context: {}
# Prevent Terraform from destroying or recreating the cluster. Accepted;
# Config Connector has no such guard (README.md).
deletion_protection: true
# Cluster description.
description: null
# Addons enabled in the cluster (true means enabled).
enable_addons: {}
# Enable cluster-level features. Certain features allow configuration.
enable_features: {}
# The name of the fleet host project where this cluster will be registered.
fleet_project: null
# Enable issuing client certificate.
issue_client_certificate: false
# Cluster location (region or zone).
location: ""
# Logging configuration.
logging_config: {}
# Maintenance window configuration.
maintenance_config:
  daily_window_start_time: "03:00"
  recurring_window: null
  maintenance_exclusions: []
# Minimum version of the master, defaults to the version of the most recent
# official release.
min_master_version: null
# Monitoring configuration.
monitoring_config: {}
# Cluster name.
name: ""
# Node-level configuration: the auto-provisioned nodes' service account,
# boot disk key, network tags and resource manager tags.
node_config: {}
# Zones in which the cluster's nodes are located.
node_locations: []
# Cluster project id.
project_id: ""
# Release channel for GKE upgrades: RAPID, REGULAR or STABLE (Autopilot
# clusters must use one).
release_channel: REGULAR
# VPC-level configuration: {disable_default_snat,
# disable_l4_lb_firewall_reconciliation, network, subnetwork,
# secondary_range_blocks: {pods, services}, secondary_range_names: {pods,
# services}, additional_ranges, stack_type}.
vpc_config: {}

# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# cluster and its backup resources when the component is deleted. PREVENT
# has no Config Connector equivalent.
deletion_policy: null
