# Source: pubsub/templates/subscriptions.yaml
apiVersion: pubsub.cnrm.cloud.google.com/v1beta1
kind: PubSubSubscription
metadata:
  name: full-sub-pull
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: pubsub
    app.kubernetes.io/version: "0.1.0"
    env: "dev"
    team: "data"
  annotations:
    hfl.dev/id: "subscription:pull"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: "pull"
  topicRef:
    name: full
  ackDeadlineSeconds: 20
  messageRetentionDuration: "1200s"
  retainAckedMessages: true
  filter: "attributes.domain = \"com\""
  enableMessageOrdering: true
  enableExactlyOnceDelivery: true
  deadLetterPolicy:
    deadLetterTopicRef:
      external: "projects/my-project/topics/dead-letter"
    maxDeliveryAttempts: 10
  retryPolicy:
    maximumBackoff: "300s"
    minimumBackoff: "10s"
