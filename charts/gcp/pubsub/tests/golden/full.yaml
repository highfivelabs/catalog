apiVersion: pubsub.cnrm.cloud.google.com/v1beta1
kind: PubSubSubscription
metadata:
  name: full-sub-gcs-sub
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
