---
# Source: pubsub/templates/iam.yaml
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPartialPolicy
metadata:
  name: basic-iam
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: pubsub
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "iam"
spec:
  resourceRef:
    apiVersion: pubsub.cnrm.cloud.google.com/v1beta1
    kind: PubSubTopic
    name: basic
  bindings:
    - role: "roles/pubsub.subscriber"
      members:
        - member: "user:user1@example.org"
    - role: "roles/pubsub.viewer"
      members:
        - member: "group:viewers@example.org"
---
# Source: pubsub/templates/topic.yaml
apiVersion: pubsub.cnrm.cloud.google.com/v1beta1
kind: PubSubTopic
metadata:
  name: basic
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: pubsub
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "topic"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "my-topic"
