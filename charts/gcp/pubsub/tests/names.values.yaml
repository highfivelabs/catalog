# Names in full, labels and tags, as Bundt passes them from a team's naming
# convention (docs/design.md, "Names, labels and tags"): the topic takes its
# name as given (and the schema <topic>-schema); subscriptions are named by
# their keys; every object carries the labels and tags.
project_id: my-project
name: events
names: {topic: shop-dev-events}
labels: {hfl.dev/team: shop, hfl.dev/environment: dev}
tags: {team: shop, environment: dev}
schema: {schema_type: PROTOCOL_BUFFER, definition: "syntax = \"proto3\"; message M { string s = 1; }"}
subscriptions:
  workers: {}
