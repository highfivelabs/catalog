#
# Values mirror the Terraform variables of terraform-google-modules'
# org-policy module, modules/org_policy_v2 (v7.4.0): same names, types and
# defaults, so a module block's arguments become this file one to one
# (README.md, "From Terraform"). values.schema.json carries the types and
# the module's validation.
#
# Descriptions quoted from terraform-google-org-policy
# (modules/org_policy_v2/variables.tf, v7.4.0), Copyright Google LLC,
# Apache-2.0.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables. An organization policy has no name of its own: it is
# named by its parent and its constraint, which the cloud fixes. So the
# chart gives no cloud name, names takes no key, and namePrefix changes
# nothing (tests/name-prefix.yaml).
names: {}
# An optional convenience every chart takes; it has nothing to prefix here.
namePrefix: ""
# Kubernetes labels on every object. A prefixed key (hfl.dev/team) stays in
# Kubernetes. Organization policies have no cloud labels, so an unprefixed
# one stays in Kubernetes too, but must still be a valid Google Cloud label.
labels: {}
# Cloud labels on every resource; organization policies have none, so these
# are Kubernetes labels only (they must still be valid Google Cloud labels).
tags: {}
# DELETE (the default) or ABANDON, which keeps the policies when the
# component is deleted. Not a module variable. PREVENT is refused.
deletion_policy: null

# Resource hierarchy node to apply the policy to: can be one of `organization`, `folder`, or `project`.
policy_root: organization
# The policy root id, either of organization_id, folder_id or project_id
policy_root_id: null
# Set of folders to exclude from the policy
exclude_folders: []
# Set of projects to exclude from the policy
exclude_projects: []
# The constraint to be applied (required)
constraint: ""
# The constraint type to work with (either 'boolean' or 'list')
policy_type: list
# Determines the inheritance behavior for this policy (only supported on list constraints)
inherit_from_parent: false
# List of rules per policy. (required) Each rule:
#   enforcement  bool (required)
#   dry_run      bool, default false: the rule goes to the dry-run spec
#   parameters   string, default null: the managed constraint's parameters, as JSON
#   allow        list(string), default []
#   deny         list(string), default []
#   conditions   list({description, expression, title, location}), default []
rules: []
