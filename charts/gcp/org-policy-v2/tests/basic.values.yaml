# The module README's first example (boolean), as values: a dry-run rule
# and an enforced, conditional one, on an organization.
policy_root: organization
policy_root_id: "123456789"
constraint: compute.requireOsLogin
policy_type: boolean
exclude_folders: []
exclude_projects: []
rules:
  - enforcement: false
    dry_run: true
  - enforcement: true
    conditions:
      - description: description of the condition
        expression: "resource.matchTagId('tagKeys/123456789', 'tagValues/123456789') && resource.matchTag('123456789/env', 'prod')"
        location: sample-location.log
        title: Title of the condition
