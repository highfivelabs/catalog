# The offramp fixture (module "resource_locations"): a list constraint on a
# folder with an allow list, the arguments exactly as the Terraform module
# call has them (folder number a placeholder).
policy_root: folder
policy_root_id: "111111111111"
constraint: gcp.resourceLocations
policy_type: list
rules:
  - enforcement: true
    allow: ["in:us-locations"]
