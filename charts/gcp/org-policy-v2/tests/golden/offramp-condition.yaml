---
# Source: org-policy-v2/templates/boolean_constraints.yaml
apiVersion: orgpolicy.cnrm.cloud.google.com/v1beta1
kind: OrgPolicyPolicy
metadata:
  name: offramp-condition
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "offramp-condition"
    app.kubernetes.io/name: org-policy-v2
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "policy"
spec:
  folderRef:
    external: folders/111111111111
  resourceID: "compute.requireOsLogin"
  spec:
    rules:
    - enforce: true
    - condition:
        description: Projects tagged break-glass may skip OS Login
        expression: resource.matchTag('123456789012/break-glass', 'true')
        title: break-glass
      enforce: false
