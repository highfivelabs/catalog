# A boolean managed constraint with parameters, a dry-run rule, and
# exclusions on a folder and a project (each set not enforced there).
policy_root: folder
policy_root_id: "111111111111"
constraint: essentialcontacts.managed.allowedContactDomains
policy_type: boolean
exclude_folders: ["222222222222"]
exclude_projects: [sandbox-project]
rules:
  - enforcement: false
  - enforcement: true
    parameters: '{"allowedDomains":["@example.com"]}'
    conditions:
      - title: prod
        description: Production only
        expression: "resource.matchTag('123456789012/env', 'prod')"
        location: ""
  - enforcement: true
    dry_run: true
    parameters: '{"allowedDomains":["@example.com","@example.org"]}'
