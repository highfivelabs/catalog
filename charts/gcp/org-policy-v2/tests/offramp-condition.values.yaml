# The offramp fixture (module "require_os_login"): a boolean constraint on a
# folder, enforced except where a tag matches, the arguments exactly as the
# Terraform module call has them (folder and organization numbers
# placeholders). The empty location is left out of the condition.
policy_root: folder
policy_root_id: "111111111111"
constraint: compute.requireOsLogin
policy_type: boolean
rules:
  - enforcement: true
    conditions: []
  - enforcement: false
    conditions:
      - title: break-glass
        description: Projects tagged break-glass may skip OS Login
        expression: "resource.matchTag('123456789012/break-glass', 'true')"
        location: ""
