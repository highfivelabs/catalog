# Source: avm-res-storage-storageaccount/templates/services.yaml
apiVersion: storage.azure.com/v20250601
kind: StorageAccountsManagementPolicy
metadata:
  name: mock-storage-lifecycle
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: avm-res-storage-storageaccount
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "management_policy"
spec:
  owner:
    name: mock-storage
  policy:
    rules:
      - name: "expire-tmp"
        enabled: true
        type: Lifecycle
        definition:
          actions:
            baseBlob:
              delete:
                daysAfterModificationGreaterThan: 7
          filters:
            blobTypes: ["blockBlob"]
            prefixMatch: ["assets/tmp/"]
