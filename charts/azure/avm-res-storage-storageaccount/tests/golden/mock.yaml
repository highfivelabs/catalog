apiVersion: storage.azure.com/v20250601
kind: StorageAccount
metadata:
  name: mock-storage
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: avm-res-storage-storageaccount
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "storage_account"
spec:
  azureName: "catalogst001"
  location: "eastus2"
  owner:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg"
  kind: StorageV2
  sku:
    name: Standard_LRS
  accessTier: Hot
  allowBlobPublicAccess: false
  allowCrossTenantReplication: false
  allowSharedKeyAccess: false
