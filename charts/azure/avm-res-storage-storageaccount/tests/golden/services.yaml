# Source: avm-res-storage-storageaccount/templates/services.yaml
apiVersion: storage.azure.com/v20250601
kind: StorageAccountsManagementPolicy
metadata:
  name: services-storage-lifecycle
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "services"
    app.kubernetes.io/name: avm-res-storage-storageaccount
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "management_policy"
spec:
  owner:
    name: services-storage
  policy:
    rules:
      - name: "hot-from-cool"
        enabled: false
        type: Lifecycle
        definition:
          actions:
            baseBlob:
              enableAutoTierToHotFromCool: true
              tierToCool:
                daysAfterLastAccessTimeGreaterThan: 14
          filters:
            blobTypes: ["blockBlob"]
      - name: "expire-logs"
        enabled: true
        type: Lifecycle
        definition:
          actions:
            baseBlob:
              tierToCool:
                daysAfterModificationGreaterThan: 30
              tierToArchive:
                daysAfterModificationGreaterThan: 90
                daysAfterLastTierChangeGreaterThan: 7
              delete:
                daysAfterModificationGreaterThan: 365
            snapshot:
              delete:
                daysAfterCreationGreaterThan: 30
            version:
              tierToCool:
                daysAfterCreationGreaterThan: 10
              delete:
                daysAfterCreationGreaterThan: 90
          filters:
            blobTypes: ["blockBlob"]
            prefixMatch: ["audit/","logs/"]
            blobIndexMatch:
              - name: "tier"
                op: "=="
                value: "logs"
---
