    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "storage_account"
spec:
  azureName: "stpremium001"
  location: "eastus2"
  owner:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-data"
  kind: BlockBlobStorage
