# Source: avm-res-storage-storageaccount/templates/main.yaml
apiVersion: storage.azure.com/v20250601
kind: StorageAccount
metadata:
  name: full-storage
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: avm-res-storage-storageaccount
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "storage_account"
spec:
  azureName: "stplatform001"
  location: "westeurope"
  owner:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-data"
  kind: StorageV2
  sku:
    name: Standard_GZRS
  identity:
    type: SystemAssigned,UserAssigned
    userAssignedIdentities:
      - reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-id/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uai-data"
  accessTier: Cool
  allowBlobPublicAccess: false
  allowCrossTenantReplication: false
  allowedCopyScope: AAD
  allowSharedKeyAccess: false
  azureFilesIdentityBasedAuthentication:
    directoryServiceOptions: AD
    defaultSharePermission: StorageFileDataSmbShareReader
    activeDirectoryProperties:
      domainGuid: "1b2c3d4e-0000-0000-0000-000000000000"
      domainName: "corp.example.com"
      domainSid: "S-1-5-21-1"
      forestName: "corp.example.com"
      netBiosDomainName: "CORP"
      azureStorageSid: "S-1-5-21-2"
  customDomain:
    name: "files.example.com"
    useSubDomainName: false
  defaultToOAuthAuthentication: true
  encryption:
    keySource: Microsoft.Storage
    requireInfrastructureEncryption: true
    services:
      queue:
        enabled: true
        keyType: Account
      table:
        enabled: true
        keyType: Service
  immutableStorageWithVersioning:
    enabled: true
    immutabilityPolicy:
      allowProtectedAppendWrites: true
      immutabilityPeriodSinceCreationInDays: 7
      state: Unlocked
  isHnsEnabled: true
  isLocalUserEnabled: false
  isNfsV3Enabled: false
  isSftpEnabled: false
  largeFileSharesState: Enabled
  minimumTlsVersion: TLS1_2
  networkAcls:
    bypass: "AzureServices, Metrics"
    defaultAction: Deny
    ipRules:
      - action: Allow
        value: "198.51.100.7"
      - action: Allow
        value: "203.0.113.0/24"
    virtualNetworkRules:
      - action: Allow
        reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-net/providers/Microsoft.Network/virtualNetworks/vnet-hub/subnets/snet-apps"
    resourceAccessRules:
      - resourceReference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-sec/providers/Microsoft.Security/datascanners/storageDataScanner"
        tenantId: "11111111-1111-1111-1111-111111111111"
  publicNetworkAccess: Enabled
  routingPreference:
    routingChoice: MicrosoftRouting
    publishInternetEndpoints: false
    publishMicrosoftEndpoints: true
  sasPolicy:
    expirationAction: Log
    sasExpirationPeriod: "01.12:00:00"
  supportsHttpsTrafficOnly: true
  tags:
    environment: prod
