# Every account input the chart carries, a container, queue, table and
# share each with a role assignment, and diagnostic settings on the account
# and on the blob service.
name: stplatform001
location: westeurope
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-data
account_kind: StorageV2
account_tier: Standard
account_replication_type: GZRS
account_sku_name: null
access_tier: Cool
allow_nested_items_to_be_public: false
allowed_copy_scope: AAD
cross_tenant_replication_enabled: false
custom_domain: {name: files.example.com, use_subdomain: false}
default_to_oauth_authentication: true
https_traffic_only_enabled: true
infrastructure_encryption_enabled: true
is_hns_enabled: true
large_file_share_enabled: true
local_user_enabled: false
min_tls_version: TLS1_2
nfsv3_enabled: false
public_network_access_enabled: true
queue_encryption_key_type: Account
table_encryption_key_type: Service
sftp_enabled: false
shared_access_key_enabled: false
enable_telemetry: false
routing: {choice: MicrosoftRouting, publish_microsoft_endpoints: true}
sas_policy: {expiration_period: "01.12:00:00"}
immutability_policy: {allow_protected_append_writes: true, period_since_creation_in_days: 7, state: Unlocked}
azure_files_authentication:
  directory_type: AD
  default_share_level_permission: StorageFileDataSmbShareReader
  active_directory: {domain_guid: 1b2c3d4e-0000-0000-0000-000000000000, domain_name: corp.example.com, domain_sid: S-1-5-21-1, forest_name: corp.example.com, netbios_domain_name: CORP, storage_sid: S-1-5-21-2}
managed_identities:
  system_assigned: true
  user_assigned_resource_ids: [/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-id/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uai-data]
network_rules:
  bypass: [Metrics, AzureServices]
  default_action: Deny
  ip_rules: [203.0.113.0/24, 198.51.100.7]
  virtual_network_subnet_ids: [/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-net/providers/Microsoft.Network/virtualNetworks/vnet-hub/subnets/snet-apps]
  private_link_access:
    - endpoint_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-sec/providers/Microsoft.Security/datascanners/storageDataScanner
      endpoint_tenant_id: 11111111-1111-1111-1111-111111111111
tags: {environment: prod}
lock: {kind: CanNotDelete}
role_assignments:
  readers: {role_definition_id_or_name: Storage Blob Data Reader, principal_id: 4179302c-702e-4de7-a061-beacd0a1be09, principal_type: Group}
containers:
  logs:
    name: logs
    public_access: None
    metadata: {owner: platform}
    immutable_storage_with_versioning: {enabled: true}
    role_assignments:
      writer: {role_definition_id_or_name: Storage Blob Data Contributor, principal_id: 7d3c1f0e-2b4a-4c6d-8e9f-1a2b3c4d5e6f}
queues:
  jobs:
    name: jobs
    metadata: {owner: platform}
    role_assignments:
      sender: {role_definition_id_or_name: Storage Queue Data Message Sender, principal_id: 7d3c1f0e-2b4a-4c6d-8e9f-1a2b3c4d5e6f}
tables:
  state:
    name: state
    role_assignments:
      reader: {role_definition_id_or_name: Storage Table Data Reader, principal_id: 7d3c1f0e-2b4a-4c6d-8e9f-1a2b3c4d5e6f}
shares:
  home:
    name: home
    quota: 100
    access_tier: Hot
    enabled_protocol: SMB
    role_assignments:
      smb: {role_definition_id_or_name: Storage File Data SMB Share Contributor, principal_id: 7d3c1f0e-2b4a-4c6d-8e9f-1a2b3c4d5e6f}
diagnostic_settings_storage_account:
  metrics:
    name: diag-metrics
    metrics: [{category: Transaction}]
    workspace_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-ops/providers/Microsoft.OperationalInsights/workspaces/law
diagnostic_settings_blob:
  blob:
    name: diag-blob
    logs: [{category_group: allLogs}]
    metrics: [{category: Transaction, retention_policy: {days: 0, enabled: false}}]
    workspace_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-ops/providers/Microsoft.OperationalInsights/workspaces/law
