# The services' properties (blob, file, queue, table), lifecycle rules,
# Data Lake Gen2 filesystems and private endpoints: one to blob with a
# DNS zone group (two zones), a lock and a role assignment, one to dfs in
# another resource group with an IP configuration and an application
# security group.
name: stservices001
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-data
is_hns_enabled: true
public_network_access_enabled: false
blob_properties:
  versioning_enabled: true
  change_feed: {enabled: true, retention_in_days: 30}
  delete_retention_policy: {enabled: true, days: 14}
  container_delete_retention_policy: {enabled: true, days: 7, allow_permanent_delete: false}
  restore_policy: {enabled: true, days: 7}
  last_access_time_tracking_policy: {enable: true, name: AccessTimeTracking, blob_type: [blockBlob], tracking_granularity_in_days: 1}
  default_service_version: "2020-06-12"
  cors_rules:
    - {allowed_headers: ["*"], allowed_methods: [GET, HEAD], allowed_origins: ["https://app.example.com"], exposed_headers: ["x-ms-meta-*"], max_age_in_seconds: 3600}
file_service_properties:
  share_retention_policy: {days: 14}
  smb:
    versions: [SMB3.1.1, SMB3.0]
    authentication_types: [Kerberos]
    channel_encryption_types: [AES-256-GCM, AES-128-GCM]
    kerberos_ticket_encryption_type: [AES-256]
    multichannel_enabled: false
queue_properties:
  cors_rules:
    - {allowed_headers: ["*"], allowed_methods: [GET], allowed_origins: ["*"], exposed_headers: ["*"], max_age_in_seconds: 60}
table_properties:
  cors_rules: []
storage_management_policy_rule:
  logs:
    name: expire-logs
    enabled: true
    actions:
      base_blob:
        tier_to_cool_after_days_since_modification_greater_than: 30
        tier_to_archive_after_days_since_modification_greater_than: 90
        tier_to_archive_after_days_since_last_tier_change_greater_than: 7
        delete_after_days_since_modification_greater_than: 365
      snapshot:
        delete_after_days_since_creation_greater_than: 30
      version:
        change_tier_to_cool_after_days_since_creation: 10
        delete_after_days_since_creation: 90
    filters:
      blob_types: [blockBlob]
      prefix_match: [logs/, audit/]
      match_blob_index_tag: [{name: tier, value: logs}]
  hot:
    name: hot-from-cool
    enabled: false
    actions:
      base_blob:
        auto_tier_to_hot_from_cool_enabled: true
        tier_to_cool_after_days_since_last_access_time_greater_than: 14
    filters:
      blob_types: [blockBlob]
storage_data_lake_gen2_filesystems:
  raw: {name: raw}
  curated: {name: curated, default_encryption_scope: scope-curated, properties: {owner: data}}
private_endpoints:
  blob:
    subresource_name: blob
    subnet_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-net/providers/Microsoft.Network/virtualNetworks/vnet/subnets/snet-pe
    private_dns_zone_resource_ids:
      - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-dns/providers/Microsoft.Network/privateDnsZones/privatelink.blob.core.windows.net
      - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-dns/providers/Microsoft.Network/privateDnsZones/privatelink.blob.core.windows.net.contoso
    lock: {kind: CanNotDelete}
    role_assignments:
      reader: {role_definition_id_or_name: Reader, principal_id: 7d3c1f0e-2b4a-4c6d-8e9f-1a2b3c4d5e6f}
    tags: {tier: private}
  dfs:
    name: pe-stservices-dfs
    subresource_name: dfs
    resource_group_name: rg-net
    location: westeurope
    subnet_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-net/providers/Microsoft.Network/virtualNetworks/vnet/subnets/snet-pe
    network_interface_name: nic-pe-stservices-dfs
    private_service_connection_name: psc-dfs
    ip_configurations:
      one: {name: ipconfig-dfs, private_ip_address: 10.0.2.10}
    application_security_group_associations:
      app: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-net/providers/Microsoft.Network/applicationSecurityGroups/asg-app
    lock: {kind: ReadOnly, name: pe-readonly, notes: no changes}
