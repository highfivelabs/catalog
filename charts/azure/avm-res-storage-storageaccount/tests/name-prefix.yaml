#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every
# object this chart renders carries the namePrefix (its hyphens removed: an
# account name is lower-case letters and digits) in its Azure name
# (spec.azureName, nameFields below), except the kinds listed here, each with
# the reason it cannot collide with another Instance's.
exempt:
  StorageAccountsBlobServicesContainer: "named inside its account, whose name carries the prefix"
  StorageAccountsQueueServicesQueue: "named inside its account, whose name carries the prefix"
  StorageAccountsTableServicesTable: "named inside its account, whose name carries the prefix"
  StorageAccountsFileServicesShare: "named inside its account, whose name carries the prefix"
  RoleAssignment: "its name is a GUID (a stable UUID ASO makes), scoped to the account or one of its children"
  ManagementLock: "named inside the account it locks, whose name carries the prefix (the module's lock-<name>)"
  DiagnosticSetting: "named inside the account or service it is on, by the entry's name"
nameFields:
  StorageAccount: azureName
compactNames:
  StorageAccount: "an account name is 3 to 24 lower-case letters and digits, so the namePrefix goes on without its hyphens"
