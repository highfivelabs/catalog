#
# Values mirror the Terraform variables of the Azure Verified Module
# avm-res-storage-storageaccount (v0.11.0): same names, types and defaults,
# so a module block's arguments become this file one to one.
# values.schema.json carries the types and the module's validations.
#
# Descriptions quoted or condensed from
# terraform-azurerm-avm-res-storage-storageaccount (variables*.tf,
# v0.11.0), Copyright (c) Microsoft Corporation, MIT.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables, except tags.
#
# The storage account's name in full, {storageAccount}. A name set here
# takes no prefix; one not set is name, with the namePrefix in front
# without its hyphens (an account name is 3 to 24 lower-case letters and
# digits).
names: {}
# An optional convenience: the namePrefix, hyphens removed, in front of the
# account's name (never one set under names). Empty (the default) changes
# nothing.
namePrefix: ""
# Kubernetes labels on every object. ASO never copies them to Azure.
labels: {}
# DELETE (the default) or ABANDON, which keeps every resource in Azure when
# the component is deleted (ASO's reconcile-policy detach-on-delete).
# PREVENT is refused: use lock. Not a module variable.
deletion_policy: null

# The name of the resource. Required.
name: ""
# Azure region where the resource should be deployed. Required.
location: ""
# The resource ID of the resource group to deploy into. Required.
parent_id: ""
# (Optional) Tags of the resource.
tags: null
# Controls whether or not telemetry is enabled for the module. Accepted;
# the chart never sends telemetry.
enable_telemetry: true

# (Optional) Defines the access tier for BlobStorage, FileStorage and
# StorageV2 accounts. Valid options are Hot, Cool, Cold, Premium and
# Smart. Smart is refused (ASO's API version predates it).
access_tier: Hot
# (Optional) Defines the Kind of account. BlobStorage, BlockBlobStorage,
# FileStorage, Storage or StorageV2.
account_kind: StorageV2
# (Required) Defines the type of replication to use for this storage
# account. LRS, GRS, RAGRS, ZRS, GZRS or RAGZRS.
account_replication_type: ZRS
# (Optional) The SKU name; when set it wins over account_tier and
# account_replication_type.
account_sku_name: Standard_ZRS
# (Required) Defines the Tier to use for this storage account. Standard or
# Premium.
account_tier: Standard
# (Optional) Allow or disallow nested items within this Account to opt into
# being public.
allow_nested_items_to_be_public: false
# (Optional) Restrict copy to and from Storage Accounts within an AAD
# tenant or with Private Links to the same VNet. AAD or PrivateLink.
allowed_copy_scope: null
# (Optional) Should cross Tenant replication be enabled?
cross_tenant_replication_enabled: false
# (Optional) {name, use_subdomain}
custom_domain: null
# (Optional) Default to Azure Active Directory authorization in the Azure
# portal when accessing the Storage Account.
default_to_oauth_authentication: null
# (Optional) Specifies the Edge Zone within the Azure Region where this
# Storage Account should exist.
edge_zone: null
# (Optional) Forces HTTPS if enabled.
https_traffic_only_enabled: true
# (Optional) Is infrastructure encryption enabled?
infrastructure_encryption_enabled: false
# (Optional) Is Hierarchical Namespace enabled?
is_hns_enabled: null
# (Optional) Is Local User Enabled?
local_user_enabled: false
# (Optional) The minimum supported TLS version for the storage account.
min_tls_version: TLS1_2
# {bypass (["AzureServices"]), default_action ("Deny"), ip_rules,
# virtual_network_subnet_ids, private_link_access: [{endpoint_resource_id,
# endpoint_tenant_id}], timeouts}. timeouts is refused.
network_rules: {}
# (Optional) Is NFSv3 protocol enabled?
nfsv3_enabled: false
# (Optional) Set to V2 to use the provisioned v2 billing model
# (StandardV2_* or PremiumV2_* SKU names).
provisioned_billing_model_version: null
# (Optional) Whether the public network access is enabled?
public_network_access_enabled: false
# (Optional) {choice ("MicrosoftRouting"), publish_internet_endpoints,
# publish_microsoft_endpoints}
routing: null
# (Optional) {expiration_action ("Log"), expiration_period}
sas_policy: null
# (Optional) Boolean, enable SFTP for the storage account.
sftp_enabled: false
# (Optional) Indicates whether the storage account permits requests to be
# authorized with the account access key via Shared Key.
shared_access_key_enabled: false
# (Optional) Is Large File Share Enabled?
large_file_share_enabled: null
# (Optional) The encryption type of the queue service. Service or Account.
queue_encryption_key_type: null
# (Optional) The encryption type of the table service. Service or Account.
table_encryption_key_type: null
# (Optional) {allow_protected_append_writes, period_since_creation_in_days,
# state}
immutability_policy: null
# (Optional) {directory_type ("AADKERB"), default_share_level_permission,
# active_directory: {domain_guid, domain_name, domain_sid, forest_name,
# netbios_domain_name, storage_sid}}
azure_files_authentication: null
# Controls the Managed Identity configuration on this resource.
# {system_assigned, user_assigned_resource_ids}
managed_identities: {}
# Controls the Resource Lock configuration for this resource.
# {kind (CanNotDelete or ReadOnly), name (default lock-<name>)}
lock: null
# A map of role assignments to create on this resource.
# Each: {role_definition_id_or_name, principal_id, description,
# skip_service_principal_aad_check, condition, condition_version,
# delegated_managed_identity_resource_id, principal_type}.
role_assignments: {}
# Whether role definitions are looked up by name. Accepted; ASO always
# resolves a role name (wellKnownName).
role_assignment_definition_lookup_enabled: true

# Containers. Each: {name, public_access ("None"), metadata,
# default_encryption_scope, deny_encryption_scope_override,
# enable_nfs_v3_all_squash, enable_nfs_v3_root_squash,
# immutable_storage_with_versioning: {enabled}, role_assignments,
# timeouts}. timeouts is refused.
containers: {}
# Queues. Each: {name, metadata, role_assignments, timeouts}. timeouts is
# refused.
queues: {}
# Tables. Each: {name, signed_identifiers, role_assignments, timeouts}.
# signed_identifiers and timeouts are refused.
tables: {}
# File shares. Each: {name, quota, access_tier, enabled_protocol,
# metadata, provisioned_bandwidth_mibps, provisioned_iops, root_squash,
# signed_identifiers, role_assignments, timeouts}. signed_identifiers and
# timeouts are refused.
shares: {}

# Diagnostic settings (the v2 interface) on the account and on its blob,
# file, queue and table services. Each: {name, logs: [{category,
# category_group, enabled (true), retention_policy: {days, enabled}}],
# metrics: [{category, enabled, retention_policy}],
# log_analytics_destination_type ("Dedicated"), workspace_resource_id,
# storage_account_resource_id, event_hub_authorization_rule_resource_id,
# event_hub_name, marketplace_partner_resource_id}.
diagnostic_settings_storage_account: {}
diagnostic_settings_blob: {}
diagnostic_settings_file: {}
diagnostic_settings_queue: {}
diagnostic_settings_table: {}

# Not mapped yet: refused when set (README.md, "Refused when set").
blob_properties: null
file_service_properties: null
queue_properties: null
table_properties: null
storage_management_policy_rule: {}
storage_data_lake_gen2_filesystems: {}
private_endpoints: {}
customer_managed_key: null
# (Optional) Whether the module manages the private DNS zone group of its
# private endpoints. Accepted; private_endpoints are refused.
private_endpoints_manage_dns_zone_group: true
# SFTP and NFSv3 local users. Refused: no ASO kind.
local_user: {}
# Static website on the blob service. Refused: a data-plane setting.
static_website: null
# (Optional) How long to wait for CORS rules on the table service to
# propagate. Accepted; the chart sets no table service properties and ASO
# waits on its own.
table_service_cors_propagation_wait: 2m
# The API versions of the azapi resources. Refused when set: ASO's kinds
# fix them.
resource_types: {}
# Refused when set: ASO retries itself and has no per-request timeouts.
storage_management_policy_timeouts: null
retry: {}
timeouts: null
