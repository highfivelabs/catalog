# The module's default example (examples/default): a Premium cache in the
# three zones, a system-assigned identity, no public access, a private
# endpoint with a DNS zone group, a diagnostic setting to a workspace and
# memory settings.
name: redis-default
location: eastus2
resource_group_name: rg-example
subscription_id: 00000000-0000-0000-0000-000000000000
diagnostic_settings:
  diag_setting_1:
    name: diagSetting1
    log_groups: [allLogs]
    metric_categories: [AllMetrics]
    log_analytics_destination_type: null
    workspace_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.OperationalInsights/workspaces/law-example
managed_identities: {system_assigned: true}
private_endpoints:
  endpoint1:
    subnet_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/endppoint-vnet/subnets/endpoint
    private_dns_zone_group_name: private-dns-zone-group
    private_dns_zone_resource_ids: [/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/privateDnsZones/privatelink.redis.cache.windows.net]
public_network_access_enabled: false
redis_configuration:
  maxmemory_reserved: 1330
  maxmemory_delta: 1330
  maxmemory_policy: allkeys-lru
tags: {scenario: default}
