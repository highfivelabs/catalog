# Whole names from a naming convention: names.redisCache is used as given;
# the namePrefix goes on no name set in full. labels stay in Kubernetes;
# tags reach Azure. A Standard cache with Entra authentication only and
# ABANDON.
name: orders
location: eastus2
resource_group_name: rg-shop-dev
subscription_id: 00000000-0000-0000-0000-000000000000
namePrefix: shop-dev
names: {redisCache: redis-shop-dev-eus2}
labels: {hfl.dev/team: shop}
tags: {team: shop}
sku_name: Standard
capacity: 1
zones: []
access_keys_authentication_enabled: false
redis_configuration: {active_directory_authentication_enabled: true}
deletion_policy: ABANDON
lock: {kind: ReadOnly, name: keep}
