#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every
# object this chart renders carries the namePrefix in its Azure name
# (spec.azureName, nameFields below), except the kinds listed here, each with
# the reason it cannot collide with another Instance's.
exempt:
  RedisPatchSchedule: "Azure names it default, inside its cache, whose name carries the prefix"
  RedisAccessPolicy: "named inside its cache, whose name carries the prefix, by the entry's name"
  RedisAccessPolicyAssignment: "named inside its cache, whose name carries the prefix, by the entry's name"
  RedisFirewallRule: "named inside its cache, whose name carries the prefix, by the entry's name"
  RedisLinkedServer: "named by the linked cache's name (as azurerm names it), inside its cache"
  PrivateEndpointsPrivateDnsZoneGroup: "named inside its private endpoint (default), as the module names it"
  RoleAssignment: "its name is a GUID (a stable UUID ASO makes), scoped to the cache or endpoint"
  ManagementLock: "named inside the resource it locks, whose name carries the prefix (the module's lock-<kind>)"
  DiagnosticSetting: "named on the cache it watches (the module's diag-<name>), whose name carries the prefix"
nameFields:
  Redis: azureName
  PrivateEndpoint: azureName
