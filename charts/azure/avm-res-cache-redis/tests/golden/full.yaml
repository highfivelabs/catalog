# Source: avm-res-cache-redis/templates/main.yaml
apiVersion: cache.azure.com/v20241101
kind: Redis
metadata:
  name: full-redis
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: avm-res-cache-redis
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "cache"
spec:
  azureName: "redis-full"
  location: "eastus2"
  owner:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-cache"
  sku:
    name: Premium
    family: P
    capacity: 1
  disableAccessKeyAuthentication: true
  enableNonSslPort: false
  identity:
    type: "SystemAssigned, UserAssigned"
    userAssignedIdentities:
      - reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-id/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uai-redis"
  minimumTlsVersion: "1.2"
  publicNetworkAccess: Disabled
  redisConfiguration:
    aad-enabled: "true"
    aof-backup-enabled: "false"
    authnotrequired: "false"
    maxfragmentationmemory-reserved: "50"
    maxmemory-delta: "50"
    maxmemory-policy: "volatile-lru"
    maxmemory-reserved: "50"
    notify-keyspace-events: "KEA"
    preferred-data-persistence-auth-method: "ManagedIdentity"
    rdb-backup-enabled: "false"
    rdb-backup-frequency: "60"
    rdb-backup-max-snapshot-count: "1"
    storage-subscription-id: "00000000-0000-0000-0000-000000000000"
  redisVersion: "6"
  replicasPerMaster: 1
  replicasPerPrimary: 1
  shardCount: 2
  staticIP: "10.0.1.10"
  subnetReference:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-net/providers/Microsoft.Network/virtualNetworks/vnet/subnets/redis"
  tags:
    scenario: full
  tenantSettings:
    team: data
  zones:
    - "1"
    - "2"
