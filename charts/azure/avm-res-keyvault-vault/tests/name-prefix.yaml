#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every
# object this chart renders carries the namePrefix in its Azure name
# (spec.azureName, nameFields below), except the kinds listed here, each with
# the reason it cannot collide with another Instance's.
exempt:
  VaultKey: "named inside its vault, whose name carries the prefix"
  RoleAssignment: "its name is a GUID (a stable UUID ASO makes), scoped to the vault or a key"
  ManagementLock: "named inside the vault it locks, whose name carries the prefix (the module's lock-<name>)"
  DiagnosticSetting: "named inside the vault it is on (the module's diag-<name>)"
nameFields:
  Vault: azureName
