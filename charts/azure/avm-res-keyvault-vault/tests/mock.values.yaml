# For an apply against the fake cloud (docs/azure.md, "8. Charts"): a
# standard vault without purge protection, one key and a private endpoint
# with a DNS zone group (the fake keeps the references as sent), and a
# secret (aso-extensions' VaultSecret, which writes it in the fake vault's
# data plane) whose value is a reference to a Secret the harness makes
# before the apply with a random value (hack/test-secret.sh; nothing
# committed), as the line below asks:
# secret: catalog-kv-secrets random
name: catalog-kv-001
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg
tenant_id: 11111111-2222-3333-4444-555555555555
sku_name: standard
purge_protection_enabled: false
tags: {catalog: mock}
keys:
  k: {name: catalog-key, key_type: RSA, key_size: 2048}
secrets:
  s: {name: catalog-secret, content_type: text/plain}
secrets_value:
  s: {secretName: catalog-kv-secrets, key: value}
private_endpoints:
  pe:
    subnet_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/virtualNetworks/catalog-vnet/subnets/snet-pe
    private_dns_zone_resource_ids: [/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/privateDnsZones/privatelink.vaultcore.azure.net]
