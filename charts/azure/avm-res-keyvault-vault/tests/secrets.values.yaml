# Secrets in the vault as aso-extensions VaultSecrets, each one's value a
# reference to a Kubernetes Secret in the component's namespace
# (docs/secrets.md), put there by External Secrets Operator, never a value:
# one by secrets_value with dates, a content type, tags and a role
# assignment on the secret, one by secrets_value_wo (its version accepted).
name: kv-secrets-001
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-sec
tenant_id: 11111111-2222-3333-4444-555555555555
secrets:
  db:
    name: db-password
    content_type: text/plain
    not_before_date: "2026-11-14T00:00:00Z"
    expiration_date: "2027-11-14T00:00:00Z"
    tags: {app: example}
    role_assignments:
      reader: {role_definition_id_or_name: Key Vault Secrets User, principal_id: 33333333-3333-3333-3333-333333333333}
  api:
    name: api-key
secrets_value:
  db: {secretName: kv-secrets, key: db-password}
secrets_value_wo:
  api: {secretName: kv-secrets, key: api-key}
secrets_value_wo_version:
  api: 1
