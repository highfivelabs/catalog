apiVersion: keyvault.azure.com/v1api20230701
kind: Vault
metadata:
  name: full-kv
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: avm-res-keyvault-vault
    app.kubernetes.io/version: "0.3.0"
  annotations:
    hfl.dev/id: "vault"
spec:
  azureName: "kv-platform-001"
  location: "westeurope"
  owner:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-sec"
  properties:
    tenantId: "11111111-2222-3333-4444-555555555555"
    sku:
      family: A
      name: standard
    enabledForDeployment: true
    enabledForDiskEncryption: true
    enabledForTemplateDeployment: true
    enablePurgeProtection: true
    enableRbacAuthorization: true
    networkAcls:
      bypass: AzureServices
      defaultAction: Deny
      ipRules:
        - value: "203.0.113.0/24"
      virtualNetworkRules:
        - reference:
            armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-net/providers/Microsoft.Network/virtualNetworks/vnet-hub/subnets/snet-apps"
    publicNetworkAccess: Disabled
    softDeleteRetentionInDays: 30
  tags:
    environment: prod
