# Source: avm-res-keyvault-vault/templates/keys.yaml
apiVersion: keyvault.azure.com/v20230701
kind: VaultKey
metadata:
  name: full-key-cmk
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: avm-res-keyvault-vault
    app.kubernetes.io/version: "0.3.0"
  annotations:
    hfl.dev/id: "key:cmk"
spec:
  azureName: "cmk-storage"
  owner:
    name: full-kv
  properties:
    kty: "RSA"
    keyOps:
      - "wrapKey"
      - "unwrapKey"
    keySize: 4096
    rotationPolicy:
      attributes:
        expiryTime: "P1Y"
      lifetimeActions:
        - action:
            type: rotate
          trigger:
            timeBeforeExpiry: "P30D"
        - action:
            type: notify
          trigger:
            timeBeforeExpiry: "P29D"
  tags:
    use: cmk
---
