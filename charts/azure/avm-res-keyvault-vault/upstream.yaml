# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set, or accepts only in part. Read by `task
# coverage`; `task coverage-verify` renders the chart to check that each one
# is refused. kind: gap (no Azure Service Operator or aso-extensions kind or
# field; the reason names the type when a kind is missing), not-ported (one
# exists, this chart does not map it yet) or by-design (Bundt replaces it).
# partial: the variable is accepted, the reason says what is refused.
refused:
  - variable: contacts
    kind: gap
    reason: "certificate contacts are a Key Vault data-plane setting (/certificates/contacts), with no ASO or aso-extensions kind"
  - variable: keys
    kind: gap
    reason: "accepted, but a release policy's immutable flag is refused: ASO's VaultKey release_policy has contentType and data only"
    partial: true
    fields: [release_policy.immutable]
  - variable: ignore_body_changes
    kind: gap
    reason: "Azure Service Operator applies every property it is given and cannot leave a path to another writer (no ignore-changes)"
  - variable: resource_types
    kind: by-design
    reason: "ASO's kinds fix the API versions (Vault 2023-07-01)"
  - variable: retry
    kind: by-design
    reason: "Azure Service Operator retries every failed request itself, with backoff, until the resource is ready"
  - variable: timeouts
    kind: by-design
    reason: "Azure Service Operator has no per-request timeouts; Bundt sets a component's time limit"
