{{- with .custom_proto_header_name }}{{ $_ := set $f "customProtoHeaderName" . }}{{ end }}
{{- $_ := set $h "forwardProxy" $f }}
{{- end }}
{{- $_ := set $spec "httpSettings" $h }}
{{- end }}
---
apiVersion: app.azure.com/v20250101
kind: AuthConfig
metadata:
  {{- include "aso.metadata" (dict "root" $ "name" (include "aso.name" (list $.Release.Name "auth" $k)) "id" (printf "auth_config:%s" $k) "abandon" $abandon) | nindent 2 }}
spec:
  azureName: {{ $a.name | quote }}
  owner:
    armId: {{ $appID }}
  {{- with $spec }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
{{- with $v.lock }}
{{- $notes := ternary "Cannot delete the resource or its child resources." "Cannot delete or modify the resource or its child resources." (eq (toString .kind) "CanNotDelete") }}
{{- include "aso.lock" (dict "root" $ "base" $obj "idPrefix" "" "owner" $owner "v" (dict "kind" .kind "name" (.name | default (printf "lock-%s" $appName)) "notes" $notes)) }}
{{- end }}
{{- include "aso.roleAssignments" (dict "root" $ "base" $obj "idPrefix" "" "owner" $owner "v" $v.role_assignments) }}
