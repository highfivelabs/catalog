# Whole names from a naming convention: names.containerApp is used as
# given; the namePrefix goes on no name set in full. labels stay in
# Kubernetes; tags reach Azure. The group by ID (resource_group_id).
name: web
location: eastus2
resource_group_name: rg-shop-dev
resource_group_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-shop-dev
container_app_environment_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-shop-dev/providers/Microsoft.App/managedEnvironments/cae-shop-dev
namePrefix: shop-dev
names: {containerApp: ca-shop-dev-web}
labels: {hfl.dev/team: shop}
tags: {team: shop}
template:
  containers:
    - {name: web, image: mcr.microsoft.com/k8se/quickstart:latest, cpu: 0.5, memory: 1Gi}
