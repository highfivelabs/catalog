---
# Source: avm-res-app-containerapp/templates/main.yaml
apiVersion: app.azure.hfl.dev/v20260701
kind: ContainerApp
metadata:
  name: secrets-app
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "secrets"
    app.kubernetes.io/name: avm-res-app-containerapp
    app.kubernetes.io/version: "0.4.0"
  annotations:
    hfl.dev/id: "container_app"
spec:
  azureName: "ca-secrets"
  location: "eastus2"
  owner:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example"
  environmentReference:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.App/managedEnvironments/cae-example"
  managedEnvironmentReference:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.App/managedEnvironments/cae-example"
  configuration:
    activeRevisionsMode: Single
    maxInactiveRevisions: 0
    registries:
      -
        passwordSecretRef: "registry-password"
        server: "registry.example.com"
        username: "puller"
    secrets:
      -
        name: "db-password"
        value: {"key":"db-password","name":"ca-app-secrets"}
      -
        name: "registry-password"
        value: {"key":"password","name":"ca-registry"}
      - identityReference:
          wellKnownName: "system"
        keyVaultUrl: "https://kv-example.vault.azure.net/secrets/api-key"
        name: "api-key"
  template:
    containers:
      - name: "app"
        image: "registry.example.com/app:1.0"
        env:
          - name: "DB_PASSWORD"
            secretRef: "db-password"
          - name: "API_KEY"
            secretRef: "api-key"
        resources:
          cpu: 0.25
          memory: "0.5Gi"
    scale:
      cooldownPeriod: 300
      maxReplicas: 10
      pollingInterval: 30
