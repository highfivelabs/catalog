# Source: avm-res-app-containerapp/templates/main.yaml
apiVersion: app.azure.com/v20250101
kind: AuthConfig
metadata:
  name: full-auth-current
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: avm-res-app-containerapp
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "auth_config:current"
spec:
  azureName: "current"
  owner:
    name: full-app
  encryptionSettings:
    containerAppAuthEncryptionSecretName: auth-enc
    containerAppAuthSigningSecretName: auth-sign
  globalValidation:
    excludedPaths:
    - /healthz
    redirectToProvider: azureactivedirectory
    unauthenticatedClientAction: RedirectToLoginPage
  httpSettings:
    forwardProxy:
      convention: Custom
      customHostHeaderName: X-Host
      customProtoHeaderName: X-Proto
    requireHttps: true
    routes:
      apiPrefix: /.auth
  identityProviders:
    apple:
      enabled: true
      login:
        scopes:
        - name
      registration:
        clientId: apple-client
        clientSecretSettingName: apple-secret
    azureActiveDirectory:
      enabled: true
      login:
        disableWWWAuthenticate: false
        loginParameters:
        - response_type=code id_token
      registration:
        clientId: 33333333-4444-5555-6666-777777777777
        clientSecretSettingName: microsoft-provider-authentication-secret
        openIdIssuer: https://login.microsoftonline.com/11111111-2222-3333-4444-555555555555/v2.0
      validation:
        allowedAudiences:
        - api://ca-full
        defaultAuthorizationPolicy:
          allowedApplications:
          - a1
          allowedPrincipals:
            groups:
            - g1
            identities:
            - i1
        jwtClaimChecks:
          allowedClientApplications:
          - a1
          allowedGroups:
          - g1
    azureStaticWebApps:
      enabled: false
      registration:
        clientId: swa-client
    customOpenIdConnectProviders:
      okta:
        enabled: true
        login:
          nameClaimType: name
          scopes:
          - openid
        registration:
          clientCredential:
            clientSecretSettingName: okta-secret
            method: ClientSecretPost
          clientId: okta-client
          openIdConnectConfiguration:
            authorizationEndpoint: https://example.okta.com/oauth2/v1/authorize
            certificationUri: https://example.okta.com/oauth2/v1/keys
            issuer: https://example.okta.com
            tokenEndpoint: https://example.okta.com/oauth2/v1/token
    facebook:
      enabled: true
      graphApiVersion: v18.0
      login:
        scopes:
        - email
      registration:
        appId: fb-app
        appSecretSettingName: facebook-secret
    gitHub:
      enabled: true
      login:
        scopes:
        - user
      registration:
        clientId: gh-client
        clientSecretSettingName: github-secret
    google:
      enabled: true
      login:
        scopes:
        - openid
      registration:
        clientId: google-client
        clientSecretSettingName: google-secret
      validation:
        allowedAudiences:
        - google-aud
    twitter:
      enabled: false
      registration:
        consumerKey: tw-key
        consumerSecretSettingName: twitter-secret
  login:
    allowedExternalRedirectUrls:
    - https://example.com/after
    cookieExpiration:
      convention: FixedTime
      timeToExpiration: "08:00:00"
    nonce:
      nonceExpirationInterval: "00:05:00"
      validateNonce: true
    preserveUrlFragmentsForLogins: true
    routes:
      logoutEndpoint: /.auth/logout
    tokenStore:
      azureBlobStorage:
        sasUrlSettingName: token-store-sas
      enabled: true
      tokenRefreshExtensionHours: 72
  platform:
    enabled: true
    runtimeVersion: ~1
