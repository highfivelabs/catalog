# Source: avm-res-app-containerapp/templates/main.yaml
apiVersion: app.azure.com/v20250101
kind: ContainerApp
metadata:
  name: full-app
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: avm-res-app-containerapp
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "container_app"
spec:
  azureName: "ca-full"
  location: "eastus2"
  owner:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example"
  identity:
    type: SystemAssigned,UserAssigned
    userAssignedIdentities:
      - reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-pull"
  environmentReference:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.App/managedEnvironments/cae-example"
  managedEnvironmentReference:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.App/managedEnvironments/cae-example"
  workloadProfileName: "Consumption"
  configuration:
    activeRevisionsMode: Multiple
    dapr:
      appId: "ca-full"
      appPort: 8080
      appProtocol: grpc
      enableApiLogging: true
      enabled: true
      httpMaxRequestSize: 4
      httpReadBufferSize: 65
      logLevel: debug
    identitySettings:
      - identityReference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-pull"
        lifecycle: Init
    ingress:
      additionalPortMappings:
        - exposedPort: 9090
          external: false
          targetPort: 9090
      allowInsecure: true
      clientCertificateMode: accept
      corsPolicy:
        allowCredentials: true
        allowedHeaders: ["x-request-id"]
        allowedMethods: ["GET","POST"]
        allowedOrigins: ["https://example.com"]
        exposeHeaders: ["x-trace"]
        maxAge: 600
      customDomains:
        - name: "app.example.com"
          bindingType: SniEnabled
          certificateReference:
            armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.App/managedEnvironments/cae-example/certificates/cert-app"
      exposedPort: 0
      external: true
      ipSecurityRestrictions:
        - action: Allow
          description: "office"
          ipAddressRange: "203.0.113.0/24"
          name: "office"
      stickySessions:
        affinity: sticky
      targetPort: 8080
      traffic:
        - latestRevision: false
          label: "blue"
          revisionName: "v1"
          weight: 80
        - latestRevision: true
          weight: 20
      transport: http2
    maxInactiveRevisions: 5
    registries:
      - identityReference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-pull"
        server: "crexample.azurecr.io"
    runtime:
      java:
        enableMetrics: true
    secrets:
      - identityReference:
          wellKnownName: "system"
        keyVaultUrl: "https://kv-example.vault.azure.net/secrets/db-password"
        name: "db-password"
    service:
      type: "redis"
  template:
    containers:
      - name: "app"
        image: "crexample.azurecr.io/app:1.0"
        args: ["--port","8080"]
        command: ["/app"]
        env:
          - name: "MODE"
            value: "full"
          - name: "DB_PASSWORD"
            secretRef: "db-password"
        probes:
          - failureThreshold: 5
            httpGet:
              host: localhost
              httpHeaders:
              - name: X-Probe
                value: liveness
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 20
            terminationGracePeriodSeconds: 10
            timeoutSeconds: 2
            type: Liveness
          - failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            successThreshold: 2
            tcpSocket:
              port: 8080
            timeoutSeconds: 1
            type: Readiness
          - failureThreshold: 3
            httpGet:
              path: /ready
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
            type: Startup
        resources:
          cpu: 0.5
          memory: "1Gi"
        volumeMounts:
          - mountPath: "/tmp/scratch"
            volumeName: "scratch"
          - mountPath: "/mnt/secrets"
            subPath: "db"
            volumeName: "secrets"
    initContainers:
      - name: "migrate"
        image: "crexample.azurecr.io/migrate:1.0"
        args: ["up"]
        command: ["/migrate"]
        env:
          - name: "MODE"
            value: "init"
        resources:
          cpu: 0.25
          memory: "0.5Gi"
        volumeMounts:
          - mountPath: "/tmp/scratch"
            volumeName: "scratch"
    revisionSuffix: "v1"
    scale:
      cooldownPeriod: 120
      maxReplicas: 5
      minReplicas: 1
      pollingInterval: 15
      rules:
        - name: "queue"
          azureQueue:
            accountName: "stexample"
            identityReference:
              wellKnownName: "system"
            queueLength: 10
            queueName: "jobs"
        - name: "cron"
          custom:
            metadata:
              "desiredReplicas": "2"
              "end": "0 18 * * *"
              "start": "0 8 * * *"
              "timezone": "UTC"
            type: "cron"
        - name: "http"
          http:
            metadata:
              "concurrentRequests": "50"
        - name: "tcp"
          tcp:
            auth:
              - secretRef: "db-password"
                triggerParameter: "password"
            metadata:
              "concurrentRequests": "100"
    serviceBinds:
      - name: "redis"
        serviceReference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.App/containerApps/redis"
    terminationGracePeriodSeconds: 30
    volumes:
      - name: "scratch"
        storageType: EmptyDir
      - name: "secrets"
        secrets:
          - path: "db"
            secretRef: "db-password"
        storageType: Secret
      - name: "files"
        mountOptions: "dir_mode=0777"
        storageName: "share-files"
        storageType: AzureFile
  tags:
    env: test
---
