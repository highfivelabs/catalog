---
# Source: avm-res-app-containerapp/templates/main.yaml
apiVersion: app.azure.com/v20250101
kind: ContainerApp
metadata:
  name: mock-app
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: avm-res-app-containerapp
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "container_app"
spec:
  azureName: "catalog-ca"
  location: "eastus2"
  owner:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg"
  environmentReference:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.App/managedEnvironments/catalog-cae"
  managedEnvironmentReference:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.App/managedEnvironments/catalog-cae"
  configuration:
    activeRevisionsMode: Single
    ingress:
      allowInsecure: false
      exposedPort: 0
      external: true
      targetPort: 80
      traffic:
        - latestRevision: true
          weight: 100
      transport: auto
    maxInactiveRevisions: 0
  template:
    containers:
      - name: "hello"
        image: "mcr.microsoft.com/k8se/quickstart:latest"
        probes:
          - failureThreshold: 3
            httpGet:
              path: /
              port: 80
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 10
            successThreshold: 3
            timeoutSeconds: 1
            type: Readiness
        resources:
          cpu: 0.25
          memory: "0.5Gi"
    scale:
      cooldownPeriod: 300
      maxReplicas: 1
      minReplicas: 0
      pollingInterval: 30
  tags:
    catalog: mock
