  owner:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example"
  kind: "functionapp"
  environmentReference:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.App/managedEnvironments/cae"
  managedEnvironmentReference:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.App/managedEnvironments/cae"
  configuration:
    activeRevisionsMode: Single
    ingress:
      allowInsecure: false
      exposedPort: 0
      external: true
      targetPort: 80
      traffic:
        - latestRevision: true
          weight: 100
      transport: auto
    maxInactiveRevisions: 0
  template:
    containers:
      - name: "fn"
        image: "mcr.microsoft.com/azure-functions/dotnet8-quickstart-demo:1.0"
        resources:
          cpu: 0.5
          memory: "1Gi"
    scale:
      cooldownPeriod: 300
      maxReplicas: 10
      pollingInterval: 30
