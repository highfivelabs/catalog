# The module README's default shape: one container from a public image in
# an existing environment, with external ingress on port 80.
name: ca-example
location: eastus2
resource_group_name: rg-example
subscription_id: 00000000-0000-0000-0000-000000000000
container_app_environment_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.App/managedEnvironments/cae-example
revision_mode: Single
template:
  containers:
    - name: hello
      image: mcr.microsoft.com/k8se/quickstart:latest
      cpu: 0.25
      memory: 0.5Gi
ingress:
  external_enabled: true
  target_port: 80
  traffic_weight:
    - latest_revision: true
      percentage: 100
