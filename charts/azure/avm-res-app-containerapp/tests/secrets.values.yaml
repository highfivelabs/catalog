# The app's secrets with values as references to Kubernetes Secrets in the
# component's namespace (docs/secrets.md), put there by External Secrets
# Operator, beside a Key Vault one; a registry pulled with a username and
# a password that is one of those secrets. No secret value is in the
# values.
name: ca-secrets
location: eastus2
resource_group_name: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
container_app_environment_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.App/managedEnvironments/cae-example
secrets:
  db:
    name: db-password
    value: {secretName: ca-app-secrets, key: db-password}
  registry:
    name: registry-password
    value: {secretName: ca-registry, key: password}
  vault:
    name: api-key
    key_vault_secret_id: https://kv-example.vault.azure.net/secrets/api-key
    identity: system
registries:
  - server: registry.example.com
    username: puller
    password_secret_name: registry-password
template:
  containers:
    - name: app
      image: registry.example.com/app:1.0
      cpu: 0.25
      memory: 0.5Gi
      env:
        - {name: DB_PASSWORD, secret_name: db-password}
        - {name: API_KEY, secret_name: api-key}
