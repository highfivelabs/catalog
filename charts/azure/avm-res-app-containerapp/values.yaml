#
# Every variable of avm-res-app-containerapp v0.9.0 (variables.tf), with
# its default, and the chart's own values first. README.md maps each one to
# Azure Service Operator.

# Not Terraform variables.
# names.containerApp: the container app's name in full; no prefix.
names: {}
# A prefix for the container app's name: <namePrefix>-<name>.
namePrefix: ""
# Kubernetes labels on every object; never sent to Azure (tags are).
labels: {}
# DELETE (default) or ABANDON; PREVENT is refused (use lock).
deletion_policy: null
# The subscription of resource_group_name when it is a name and
# resource_group_id is not set: ASO's owner is a resource ID.
subscription_id: ""

# Module variables (alphabetical, required ones included).
auth_configs: {}
container_app_environment_resource_id: ""
dapr: null
enable_telemetry: true
identity_settings: null
ingress: null
kind: null
location: null
lock: null
managed_identities: {}
max_inactive_revisions: 0
name: null
registries: null
resource_group_id: null
resource_group_name: ""
revision_mode: Single
role_assignments: {}
runtime: null
secrets: null
service: null
tags: null
template: {containers: []}
timeouts: null
workload_profile_name: null
