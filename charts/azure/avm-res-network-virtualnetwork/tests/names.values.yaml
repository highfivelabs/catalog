# Whole names from a naming convention: names.virtualNetwork is used as
# given; the namePrefix goes on no name set in full. labels stay in
# Kubernetes; tags reach Azure.
name: platform
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-shop-dev
address_space: [10.10.0.0/16]
namePrefix: shop-dev
names: {virtualNetwork: vnet-shop-dev-eus2}
labels: {hfl.dev/team: shop}
tags: {team: shop}
subnets:
  a: {name: snet-a, address_prefix: 10.10.0.0/24}
