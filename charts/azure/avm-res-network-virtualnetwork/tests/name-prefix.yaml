#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every
# object this chart renders carries the namePrefix in its Azure name
# (spec.azureName, nameFields below), except the kinds listed here, each with
# the reason it cannot collide with another Instance's.
exempt:
  VirtualNetworksSubnet: "named inside its network, whose name carries the prefix; Azure fixes some subnet names (GatewaySubnet, AzureFirewallSubnet, AzureBastionSubnet), so the entry's name is used as given"
  VirtualNetworksVirtualNetworkPeering: "named inside its network by the entry (name, reverse_name), as the module names it"
  RoleAssignment: "its name is a GUID (a stable UUID ASO makes), scoped to the network or subnet"
  ManagementLock: "named inside the network it locks, whose name carries the prefix (the module's lock-<kind>)"
  DiagnosticSetting: "named inside the network it is on, whose name carries the prefix (the module's diag-<name>)"
nameFields:
  VirtualNetwork: azureName
