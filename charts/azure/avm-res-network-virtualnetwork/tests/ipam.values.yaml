# Address space and a subnet from Azure Virtual Network Manager IPAM pools:
# one IPv4 pool by prefix length, one IPv6 pool by prefix length, a subnet
# by prefix length.
name: vnet-ipam
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-ipam
ipam_pools:
  - id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-avnm/providers/Microsoft.Network/networkManagers/avnm/ipamPools/v4
    prefix_length: 22
  - id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-avnm/providers/Microsoft.Network/networkManagers/avnm/ipamPools/v6
    prefix_length: 56
subnets:
  a:
    name: snet-a
    ipam_pools:
      - pool_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-avnm/providers/Microsoft.Network/networkManagers/avnm/ipamPools/v4
        prefix_length: 24
