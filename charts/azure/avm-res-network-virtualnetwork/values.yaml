#
# Values mirror the Terraform variables of the Azure Verified Module
# avm-res-network-virtualnetwork (v0.23.0): same names, types and defaults,
# so a module block's arguments become this file one to one.
# values.schema.json carries the types and the module's validations.
#
# Descriptions quoted from terraform-azurerm-avm-res-network-virtualnetwork
# (variables.tf, v0.23.0), Copyright (c) Microsoft Corporation, MIT.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables, except tags.
#
# The virtual network's name in full, {virtualNetwork}. A name set here
# takes no prefix; one not set is name, with the namePrefix in front.
# Subnets and peerings are named by their entries.
names: {}
# An optional convenience: "<namePrefix>-" in front of the network's name
# (never one set under names). Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. ASO never copies them to Azure (Azure
# tags are tags).
labels: {}
# DELETE (the default) or ABANDON, which keeps every resource in Azure when
# the component is deleted (ASO's reconcile-policy detach-on-delete).
# PREVENT is refused: use lock. Not a module variable.
deletion_policy: null

# (Optional) The address spaces applied to the virtual network. You can
# supply more than one address space. Either address_space or ipam_pools
# must be specified, but not both.
address_space: null
# (Optional) The BGP community to send to the virtual network gateway.
bgp_community: null
# Specifies an AzureNetwork DDoS Protection Plan. {id, enable}
ddos_protection_plan: null
# A map of diagnostic settings to create on the virtual network.
# Each: {name, log_categories, log_groups (["allLogs"]), metric_categories
# (["AllMetrics"]), log_analytics_destination_type ("Dedicated"),
# workspace_resource_id, storage_account_resource_id,
# event_hub_authorization_rule_resource_id, event_hub_name,
# marketplace_partner_resource_id}.
diagnostic_settings: {}
# (Optional) Specifies a list of IP addresses representing DNS servers.
# {dns_servers}
dns_servers: null
# This variable controls whether or not telemetry is enabled for the
# module. Accepted; the chart never sends telemetry.
enable_telemetry: true
# (Optional) Enable VM Protection for the virtual network. Defaults to false.
enable_vm_protection: false
# (Optional) Specifies the encryption settings for the virtual network.
# {enabled, enforcement (AllowUnencrypted or DropUnencrypted)}
encryption: null
# (Optional) Specifies the extended location of the virtual network.
# {name, type (EdgeZone)}
extended_location: null
# (Optional) The flow timeout in minutes for the virtual network. Defaults
# to 4.
flow_timeout_in_minutes: null
# (Optional) Paths in each resource's body whose changes the azapi provider
# ignores after creation. Refused when a list is not empty: ASO cannot
# leave a path to another writer.
# {virtual_networks, virtual_networks_subnets: {virtual_networks_subnets},
# virtual_networks_virtual_network_peerings:
# {virtual_networks_virtual_network_peerings}}
ignore_body_changes: {}
# (Optional) Specifies the IPAM settings for requesting an address_space
# from an IP Pool. Only one IPv4 and one IPv6 pool can be specified.
# Each: {id, number_of_ip_addresses, prefix_length}.
ipam_pools: null
# Required. The Azure region (location) of the virtual network.
location: ""
# (Optional) Controls the Resource Lock configuration for this resource.
# {kind (CanNotDelete or ReadOnly), name (default lock-<kind>)}
lock: null
# The name of the virtual network to create. Required.
name: null
# Required. The ID of the resource group where the virtual network will be
# deployed: /subscriptions/<id>/resourceGroups/<name>.
parent_id: ""
# (Optional) A map of virtual network peering configurations. Each entry
# specifies a remote virtual network by ID and includes settings for
# traffic forwarding, gateway transit, and remote gateways usage.
# Each: {name, remote_virtual_network_resource_id, allow_forwarded_traffic,
# allow_gateway_transit, allow_virtual_network_access (true),
# do_not_verify_remote_gateways, enable_only_ipv6_peering,
# peer_complete_vnets (true), local_peered_address_spaces,
# remote_peered_address_spaces, local_peered_subnets,
# remote_peered_subnets, use_remote_gateways, create_reverse_peering,
# reverse_name, reverse_* (as above, for the reverse peering),
# sync_remote_address_space_enabled, sync_remote_address_space_triggers,
# timeouts, retry}. The sync, timeouts and retry are refused.
peerings: {}
# The retry configuration of the azapi resources. Refused when set: ASO
# retries itself.
retry: {}
# (Optional) A map of role assignments to create on the virtual network.
# Each: {role_definition_id_or_name, principal_id, description,
# skip_service_principal_aad_check, condition, condition_version,
# delegated_managed_identity_resource_id, principal_type}.
role_assignments: {}
# (Optional) A map of subnets to create.
# Each: {name, address_prefix, address_prefixes, ipam_pools: [{pool_id,
# number_of_ip_addresses, prefix_length, allocation_type}], nat_gateway:
# {id}, network_security_group: {id}, private_endpoint_network_policies
# ("Enabled"), private_endpoint_network_policies_enabled (true),
# private_link_service_network_policies_enabled (true), route_table: {id},
# service_endpoint_policies: {<key>: {id}}, service_endpoints,
# default_outbound_access_enabled (false), sharing_scope, delegations:
# [{name, service_delegation: {name}}], role_assignments,
# ignore_body_changes, timeouts, retry}. ignore_body_changes, timeouts and
# retry are refused.
subnets: {}
# (Optional) Tags of the resource. Azure tags on the virtual network.
tags: null
# The timeouts of the azapi resources. Refused when set: ASO has none;
# Bundt sets a component's time limit.
timeouts: {}
