#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every
# object this chart renders carries the namePrefix in its Azure name
# (spec.azureName, nameFields below), except the kinds listed here, each with
# the reason it cannot collide with another Instance's.
exempt:
  DnsResolversInboundEndpoint: "named inside its resolver, whose name carries the prefix, as the module names it (the entry's name, or in-<key>-dnsResolver-inbound)"
  DnsResolversOutboundEndpoint: "named inside its resolver, whose name carries the prefix, as the module names it (the entry's name, or out-<key>-dnsResolver-outbound)"
  DnsForwardingRuleSetsForwardingRule: "named inside its ruleset, whose name carries the prefix, by the rule's key, as the module names it"
  DnsForwardingRuleSetsVirtualNetworkLink: "named inside its ruleset, whose name carries the prefix (the module's default-<ruleset name>, or the link's name)"
  RoleAssignment: "its name is a GUID (a stable UUID ASO makes), scoped to the resolver or a ruleset"
  ManagementLock: "named inside the resolver or ruleset it locks, whose name carries the prefix (the module's lock-<kind>, lock-<outbound key>-<ruleset name>)"
nameFields:
  DnsResolver: azureName
  DnsForwardingRuleset: azureName
