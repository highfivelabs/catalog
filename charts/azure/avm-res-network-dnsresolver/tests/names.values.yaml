# Whole names from a naming convention: names.dnsResolver is used as
# given; the namePrefix goes on no name set in full (a ruleset would take
# it: the zz9 renders check that). labels stay in Kubernetes; tags reach
# Azure.
name: resolver
location: eastus2
resource_group_name: rg-shop-dev
subscription_id: 00000000-0000-0000-0000-000000000000
virtual_network_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-shop-dev/providers/Microsoft.Network/virtualNetworks/vnet-shop
namePrefix: shop-dev
names: {dnsResolver: dnspr-shop-dev-eus2}
labels: {hfl.dev/team: shop}
tags: {team: shop}
inbound_endpoints:
  in: {subnet_name: inbound}
