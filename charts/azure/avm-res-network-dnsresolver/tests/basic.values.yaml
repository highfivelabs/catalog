# The module's default example: a resolver with one inbound endpoint and
# one outbound endpoint, no rulesets, the group by name.
name: resolver
location: eastus2
resource_group_name: rg-dns
subscription_id: 00000000-0000-0000-0000-000000000000
virtual_network_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-dns/providers/Microsoft.Network/virtualNetworks/vnet-dns
inbound_endpoints:
  inbound1: {name: inbound1, subnet_name: inbound}
outbound_endpoints:
  outbound1: {name: outbound1, subnet_name: outbound}
