#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every
# object this chart renders carries the namePrefix in its Azure name
# (spec.azureName, nameFields below), except the kinds listed here, each with
# the reason it cannot collide with another Instance's.
exempt:
  FirewallPoliciesRuleCollectionGroup: "named inside its policy, whose name carries the prefix, by the entry's name, as the submodule names it"
  RoleAssignment: "its name is a GUID (a stable UUID ASO makes), scoped to the policy"
  ManagementLock: "named inside the policy it locks, whose name carries the prefix (the module's lock-<kind>)"
  DiagnosticSetting: "named on the policy it watches (the module's diag-<name>), whose name carries the prefix"
nameFields:
  FirewallPolicy: azureName
