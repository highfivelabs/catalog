# For an apply against the fake cloud (docs/azure.md, "8. Charts"): a
# Standard policy with one rule collection group in the fake cloud's
# resource group.
name: catalog-fwp
location: eastus2
resource_group_name: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg
firewall_policy_sku: Standard
firewall_policy_threat_intelligence_mode: Alert
tags: {catalog: mock}
rule_collection_groups:
  core:
    name: rcg-core
    priority: 200
    network_rule_collection:
      - name: dns
        priority: 400
        action: Allow
        rule:
          - {name: dns, protocols: [UDP], source_addresses: [10.42.0.0/16], destination_addresses: [168.63.129.16], destination_ports: ["53"]}
