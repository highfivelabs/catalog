{{- /*
Copyright 2026 High Five Labs
SPDX-License-Identifier: Apache-2.0
Ported from terraform-azurerm-avm-res-web-site main.custom_domains.tf,
modules/certificate and modules/hostname_binding (v0.24.1), Copyright (c)
Microsoft Corporation, MIT.

module.certificate: one aso-extensions Certificate
(web.azure.hfl.dev/v20260715; the module sends Microsoft.Web/certificates
at the module's default version) per certificates entry, owned by the
resource group parent_id names, on the site's plan, from a Key Vault secret
(the vault by ARM ID) or a PFX upload (pfx_blob, password) as references
to Kubernetes Secrets (docs/secrets.md). module.hostname_binding: one aso-extensions
SitesHostNameBinding per custom_domains entry, owned by the Site, named for
the hostname. A binding's certificate_key is refused: the binding takes the
certificate's thumbprint, which Azure computes and a render cannot read.
*/ -}}
{{- $v := .Values }}
{{- $n := .Chart.Name }}
{{- $abandon := include "aso.abandon" . }}
{{- $site := include "aso.name" (list .Release.Name "site") }}
{{- $farm := regexReplaceAll "(?i)/providers/microsoft\\.web/serverfarms/" (toString $v.service_plan_resource_id) "/providers/Microsoft.Web/serverfarms/" }}
{{- range $key, $c := ($v.certificates | default dict) }}
{{- $p := printf "certificates.%s" $key }}
{{- /* A PFX upload: pfx_blob and password are references to Kubernetes
Secrets ({secretName, key}; docs/secrets.md), which aso-extensions'
Certificate takes as SecretReferences. Key Vault or a PFX, not both, as in
the module. */ -}}
{{- $pfx := include "aso.secretRef" (list $ (printf "%s.pfx_blob" $p) $c.pfx_blob) }}
{{- $pw := include "aso.secretRef" (list $ (printf "%s.password" $p) $c.password) }}
{{- if not (or $c.key_vault_id $pfx) }}{{ fail (printf "%s: %s: Either `key_vault_id` (with `key_vault_secret_name`) or `pfx_blob` must be supplied." $n $p) }}{{ end }}
{{- if and (or $c.key_vault_id $c.key_vault_secret_name) $pfx }}{{ fail (printf "%s: %s: Set either `key_vault_id`/`key_vault_secret_name` or `pfx_blob`, not both." $n $p) }}{{ end }}
{{- if ne (empty $c.key_vault_id) (empty $c.key_vault_secret_name) }}{{ fail (printf "%s: %s: `key_vault_id` and `key_vault_secret_name` must be supplied together." $n $p) }}{{ end }}
---
apiVersion: web.azure.hfl.dev/v20260715
kind: Certificate
metadata:
  {{- include "aso.metadata" (dict "root" $ "name" (include "aso.name" (list $.Release.Name "cert" $key)) "id" (printf "certificate:%s" $key) "abandon" $abandon) | nindent 2 }}
spec:
  azureName: {{ include "aso.cloudName" (list $ "certificate" ($c.name | default $key) 260 false) | quote }}
  location: {{ $v.location | quote }}
  owner:
    {{- include "aso.owner" (list $ "parent_id" $v.parent_id) | nindent 4 }}
  serverFarmReference:
    armId: {{ $farm | quote }}
  {{- with $c.key_vault_id }}
  keyVaultReference:
    armId: {{ . | quote }}
  keyVaultSecretName: {{ $c.key_vault_secret_name | quote }}
  {{- end }}
  {{- with $pfx }}
  pfxBlob: {{ . }}
  {{- end }}
  {{- with $pw }}
  password: {{ . }}
  {{- end }}
  {{- with $c.host_names }}
  hostNames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with (include "aso.tags" (list (dict "Values" (dict) "Chart" $.Chart) $c.tags) | fromJson) }}
  tags:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- range $key, $d := ($v.custom_domains | default dict) }}
{{- include "aso.unsupported" (list $ (printf "custom_domains.%s.certificate_key" $key) $d.certificate_key "the binding takes the certificate's thumbprint, which Azure computes when it makes the certificate and a render cannot read; set thumbprint (the certificate's status.thumbprint)") }}
---
apiVersion: web.azure.hfl.dev/v20260715
kind: SitesHostNameBinding
metadata:
  {{- include "aso.metadata" (dict "root" $ "name" (include "aso.name" (list $site "host" $key)) "id" (printf "hostname_binding:%s" $key) "abandon" $abandon) | nindent 2 }}
spec:
  azureName: {{ $d.hostname | quote }}
  owner:
    name: {{ $site }}
  {{- with $d.ssl_state }}
  sslState: {{ . | quote }}
  {{- end }}
  {{- with $d.thumbprint }}
  thumbprint: {{ . | quote }}
  {{- end }}
{{- end }}
