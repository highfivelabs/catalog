Ported from terraform-azurerm-avm-res-web-site main.tf, main.config.tf,
main.interfaces.tf, locals.tf, locals.body.tf, locals.config.tf,
locals.app_settings.tf and variables.tf (v0.24.1), Copyright (c) Microsoft
Corporation, MIT.

azapi_resource.this (Microsoft.Web/sites@2025-03-01): one ASO Site
(web.azure.com/v20250501), owned by the resource group parent_id names,
with the body the module builds (_site.tpl, site.body). The config
submodules the module applies after the site are carried inline where ASO's
Site has the field: config_appsettings (siteConfig.appSettings, the merged
app settings of locals.app_settings.tf) and config_metadata
(siteConfig.metadata). config_authsettingsv2, config_logs, config_slotconfignames and the
publishing credential policies are aso-extensions kinds (config.yaml).
config_connectionstrings, config_azurestorageaccounts, config_authsettings
(v1), config_backup and the slot swap are refused (upstream.yaml). azapi_resource.lock, role_assignment and
diagnostic_setting: the AVM interfaces (avm-utl-interfaces 0.7.0, diagnostic
settings v2). Slots, custom domains, certificates and private endpoints are
in their own templates. The telemetry and extensions_zipdeploy are not
ported.
*/ -}}
{{- $v := .Values }}
{{- $n := .Chart.Name }}
{{- /* by-design refusals */ -}}
{{- include "aso.unsupported" (list $ "retry" $v.retry "Azure Service Operator retries every failed request itself, with backoff, until the resource is ready") }}
{{- include "aso.unsupported" (list $ "timeouts" $v.timeouts "Azure Service Operator has no per-request timeouts; Bundt sets a component's time limit") }}
{{- range $k, $l := ($v.ignore_body_changes | default dict) }}
{{- include "aso.unsupported" (list $ "ignore_body_changes" $l "Azure Service Operator owns every field it is given; it cannot leave one to another writer") }}
{{- end }}
{{- range $k, $t := ($v.resource_types | default dict) }}
{{- include "aso.unsupported" (list $ "resource_types" $t "the API versions are the kinds' (ASO Site 2025-05-01; aso-extensions SitesSlot, SitesHostNameBinding and Certificate 2026-07-15)") }}
{{- end }}
{{- include "aso.unsupported" (list $ "zip_deploy_file" $v.zip_deploy_file "a zip deploy uploads a local file to the site's Kudu (extensions/zipDeploy), application code a Package does not carry") }}
{{- /* secret values: the builder's decision */ -}}
{{- $secv := "a secret value (the module marks it sensitive); how a component supplies one is the builder's decision" }}
{{- include "aso.unsupported" (list $ "application_insights_connection_string" $v.application_insights_connection_string $secv) }}
{{- include "aso.unsupported" (list $ "application_insights_key" $v.application_insights_key $secv) }}
{{- include "aso.unsupported" (list $ "storage_account_access_key" $v.storage_account_access_key $secv) }}
{{- include "aso.unsupported" (list $ "slot_sensitive_app_settings" $v.slot_sensitive_app_settings $secv) }}
{{- include "aso.unsupported" (list $ "slots_storage_shares_to_mount_sensitive_values" $v.slots_storage_shares_to_mount_sensitive_values $secv) }}
{{- include "aso.unsupported" (list $ "connection_strings" $v.connection_strings "a connection string's value is a secret (ASO's siteConfig.connectionStrings takes it in plain text); how a component supplies one is the builder's decision") }}
{{- include "aso.unsupported" (list $ "storage_shares_to_mount" $v.storage_shares_to_mount "each mount needs the storage account's access key, a secret value (ASO's siteConfig.azureStorageAccounts takes it from a Kubernetes Secret); how a component supplies one is the builder's decision") }}
{{- with $v.site_config }}
{{- include "aso.unsupported" (list $ "site_config.application_insights_connection_string" .application_insights_connection_string "the Application Insights connection string, which the module marks sensitive as application_insights_connection_string; a secret value is the builder's decision") }}
{{- include "aso.unsupported" (list $ "site_config.application_insights_key" .application_insights_key "the Application Insights instrumentation key, which the module marks sensitive as application_insights_key; a secret value is the builder's decision") }}
{{- end }}
{{- /* gaps: sites/config sections, publishing policies and actions with no kind */ -}}
{{- /* auth_settings (v1) is written only without auth_settings_v2, as the module does */ -}}
{{- if not $v.auth_settings_v2 }}
{{- include "aso.unsupported" (list $ "auth_settings" $v.auth_settings "Microsoft.Web/sites/config (authsettings) has no Azure Service Operator or aso-extensions kind (it has a PUT and no GET; use auth_settings_v2)") }}
{{- end }}
{{- include "aso.unsupported" (list $ "backup" $v.backup "Microsoft.Web/sites/config (backup) has no Azure Service Operator or aso-extensions kind (and its storage_account_url is a SAS URL, a secret)") }}
{{- include "aso.unsupported" (list $ "app_service_active_slot" $v.app_service_active_slot "a slot swap is an action (POST Microsoft.Web/sites/slotsswap), which no Azure Service Operator or aso-extensions kind performs") }}
{{- if not (eq (toString $v.delete_empty_service_plan) "true") }}
{{- fail (printf "%s: delete_empty_service_plan false is not supported: Azure Service Operator deletes a site without the deleteEmptyServerFarm query parameter, so Azure's default (true) applies (docs/azure.md, \"Charts\")" $n) }}
{{- end }}
{{- /* Logic Apps: the module writes the storage account key into AzureWebJobsStorage. */ -}}
{{- if eq $v.kind "logicapp" }}
{{- fail (printf "%s: kind logicapp is not supported: the module writes the storage account's access key into the AzureWebJobsStorage app setting (a secret value, the builder's decision) (docs/azure.md, \"Charts\")" $n) }}
{{- end }}
{{- $logicOnly := "only a Logic App (kind logicapp, which is refused) reads it" }}
{{- if ne (toString $v.logic_app_node_version) "~22" }}{{ include "aso.unsupported" (list $ "logic_app_node_version" (toString $v.logic_app_node_version) $logicOnly) }}{{ end }}
{{- if ne (toString $v.logic_app_runtime_version) "~4" }}{{ include "aso.unsupported" (list $ "logic_app_runtime_version" (toString $v.logic_app_runtime_version) $logicOnly) }}{{ end }}
{{- if ne (toString $v.bundle_version) "[1.*, 2.0.0)" }}{{ include "aso.unsupported" (list $ "bundle_version" (toString $v.bundle_version) $logicOnly) }}{{ end }}
{{- if ne (toString $v.use_extension_bundle) "true" }}{{ include "aso.unsupported" (list $ "use_extension_bundle" "false" $logicOnly) }}{{ end }}
{{- include "aso.unsupported" (list $ "storage_account_share_name" $v.storage_account_share_name $logicOnly) }}
{{- /* names and the module's validations */ -}}
{{- include "aso.names" (list $ (list "site")) }}
{{- if not $v.name }}{{ fail (printf "%s: name is required" $n) }}{{ end }}
{{- if not $v.location }}{{ fail (printf "%s: location is required" $n) }}{{ end }}
{{- if not (regexMatch "^/subscriptions/[a-f0-9-]+/resourceGroups/[a-zA-Z0-9._-]+$" (toString $v.parent_id)) }}
{{- fail (printf "%s: The value must be a valid Azure Resource Group resource ID. e.g. `/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}`" $n) }}
{{- end }}
{{- if not (regexMatch "^/subscriptions/[a-f0-9-]+/resourceGroups/[a-zA-Z0-9._-]+/providers/Microsoft.Web/[sS]erver[fF]arms/[a-zA-Z0-9._-]+$" (toString $v.service_plan_resource_id)) }}
{{- fail (printf "%s: The value must be a valid Azure App Service Plan resource ID. e.g. `/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Web/serverFarms/{serverFarmName}`" $n) }}
{{- end }}
{{- $fc1 := eq (toString $v.function_app_uses_fc1) "true" }}
{{- if $fc1 }}
{{- range $f := list "fc1_runtime_name" "fc1_runtime_version" "storage_authentication_type" "storage_container_endpoint" }}
{{- if kindIs "invalid" (index $v $f) }}{{ fail (printf "%s: `%s` is required when `function_app_uses_fc1` is `true`." $n $f) }}{{ end }}
{{- end }}
{{- if and (eq (lower (toString $v.storage_authentication_type)) "userassignedidentity") (not $v.storage_user_assigned_identity_id) }}
{{- fail (printf "%s: `storage_user_assigned_identity_id` is required when `function_app_uses_fc1` is `true` and `storage_authentication_type` is `UserAssignedIdentity`." $n) }}
{{- end }}
{{- end }}
{{- $mi := $v.managed_identities | default dict }}
{{- $settings := $v.app_settings | default dict }}
{{- $lowerKeys := list }}
{{- $clientIds := list }}
{{- range $k, $s := $settings }}
{{- $lowerKeys = append $lowerKeys (lower $k) }}
{{- if eq (lower $k) "azurewebjobsstorage__clientid" }}
{{- $clientIds = append $clientIds $s }}
{{- if not (regexMatch "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" (toString $s)) }}
{{- fail (printf "%s: `app_settings` must contain at most one case-insensitive `AzureWebJobsStorage__clientId` entry, and its value must be a valid client ID UUID." $n) }}
{{- end }}
{{- end }}
{{- end }}
{{- if gt (len $clientIds) 1 }}{{ fail (printf "%s: `app_settings` must contain at most one case-insensitive `AzureWebJobsStorage__clientId` entry, and its value must be a valid client ID UUID." $n) }}{{ end }}
{{- $smi := eq (toString $v.storage_uses_managed_identity) "true" }}
{{- with $v.storage_user_assigned_identity_client_id }}
{{- if not $smi }}{{ fail (printf "%s: `storage_user_assigned_identity_client_id` requires `storage_uses_managed_identity` to be `true`, because it only has meaning as part of an identity-based `AzureWebJobsStorage` connection." $n) }}{{ end }}
{{- if not (regexMatch "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" .) }}{{ fail (printf "%s: `storage_user_assigned_identity_client_id` must be a valid client ID UUID or `null`." $n) }}{{ end }}
{{- end }}
{{- if and $smi (not $v.storage_account_name) }}
{{- fail (printf "%s: `storage_account_name` is required when `storage_uses_managed_identity` is `true`, because it is used to set the `AzureWebJobsStorage__accountName` app setting." $n) }}
{{- end }}
{{- if and $smi (not (eq (toString $mi.system_assigned) "true")) (not $v.storage_user_assigned_identity_client_id) (ne (len $clientIds) 1) }}
{{- fail (printf "%s: `storage_uses_managed_identity` is `true` but the app has no identity to authenticate as. Set `managed_identities.system_assigned = true`, select a user-assigned identity with `storage_user_assigned_identity_client_id`, or supply `AzureWebJobsStorage__clientId` yourself through `app_settings`." $n) }}
{{- end }}
{{- if and (or $v.storage_user_assigned_identity_client_id (gt (len $clientIds) 0)) (not $mi.user_assigned_resource_ids) }}
{{- fail (printf "%s: `storage_user_assigned_identity_client_id` and `app_settings.AzureWebJobsStorage__clientId` select a user-assigned identity, so at least one must be attached to the app in `managed_identities.user_assigned_resource_ids`." $n) }}
{{- end }}
{{- range $k, $d := ($v.custom_domains | default dict) }}
{{- if and $d.thumbprint $d.certificate_key }}{{ fail (printf "%s: Each `custom_domains` entry must set at most one of `thumbprint` or `certificate_key`." $n) }}{{ end }}
{{- end }}
{{- with $v.lock }}
{{- if not (has .kind (list "CanNotDelete" "ReadOnly")) }}{{ fail (printf "%s: The lock level must be one of: `CanNotDelete`, or `ReadOnly`." $n) }}{{ end }}
{{- end }}
{{- /* locals.app_settings.tf: the merged app settings (the Application Insights ones are refused above). */ -}}
{{- $merged := deepCopy $settings }}
{{- if eq $v.kind "functionapp" }}
{{- if and (not $fc1) (not (has "functions_extension_version" $lowerKeys)) }}{{ $_ := set $merged "FUNCTIONS_EXTENSION_VERSION" $v.functions_extension_version }}{{ end }}
{{- /* storage_account_name without a managed identity: AzureWebJobsStorage is the connection string with the access key, which is refused, so the module's value is null and nothing is sent. */ -}}
{{- if and $smi (not (has "azurewebjobsstorage__accountname" $lowerKeys)) }}{{ $_ := set $merged "AzureWebJobsStorage__accountName" $v.storage_account_name }}{{ end }}
{{- if and $smi (not (has "azurewebjobsstorage__credential" $lowerKeys)) }}{{ $_ := set $merged "AzureWebJobsStorage__credential" "managedidentity" }}{{ end }}
{{- if and $smi $v.storage_user_assigned_identity_client_id (not (has "azurewebjobsstorage__clientid" $lowerKeys)) }}{{ $_ := set $merged "AzureWebJobsStorage__clientId" $v.storage_user_assigned_identity_client_id }}{{ end }}
{{- if not (eq (toString $v.builtin_logging_enabled) "true") }}
{{- $_ := set $merged "AzureWebJobsFeatureFlags" "EnableWorkerIndexing" }}
{{- $_ := set $merged "AzureWebJobsDashboard" "" }}
{{- end }}
{{- if and (eq (toString $v.content_share_force_disabled) "true") (not $fc1) }}{{ $_ := set $merged "WEBSITE_CONTENTSHARE" "" }}{{ end }}
{{- end }}
{{- $sc := include "site.withDefaults" (list $v.site_config (include "site.siteConfigDefaults" . | fromJson)) | fromJson }}
{{- $farm := regexReplaceAll "(?i)/providers/microsoft\\.web/serverfarms/" (toString $v.service_plan_resource_id) "/providers/Microsoft.Web/serverfarms/" }}
{{- $abandon := include "aso.abandon" . }}
{{- $obj := include "aso.name" (list .Release.Name "site") }}
---
apiVersion: web.azure.com/v20250501
kind: Site
metadata:
  {{- include "aso.metadata" (dict "root" $ "name" $obj "id" "site" "abandon" $abandon) | nindent 2 }}
spec:
  azureName: {{ include "site.siteName" . | quote }}
  location: {{ $v.location | quote }}
  owner:
    {{- include "aso.owner" (list $ "parent_id" $v.parent_id) | nindent 4 }}
  kind: {{ include "site.armKind" . | quote }}
  {{- (include "site.body" (dict "root" $ "v" $v "sc" $sc "slot" false "appSettings" $merged "serverFarm" $farm "vnetBackup" $v.virtual_network_backup_restore_enabled) | fromJson).v | toYaml | nindent 2 }}
  {{- with (include "aso.tags" (list $ dict) | fromJson) }}
  tags:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- $owner := dict "group" "web.azure.com" "kind" "Site" "name" $obj }}
{{- include "aso.lock" (dict "root" $ "base" $obj "idPrefix" "" "owner" $owner "v" $v.lock) }}
{{- include "aso.roleAssignments" (dict "root" $ "base" $obj "idPrefix" "" "owner" $owner "v" $v.role_assignments) }}
{{- include "aso.diagnosticSettingsV2" (dict "root" $ "base" $obj "idPrefix" "" "owner" $owner "v" $v.diagnostic_settings "what" "diagnostic_settings") }}
