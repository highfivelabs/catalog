#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every
# object this chart renders carries the namePrefix in its Azure name
# (spec.azureName, nameFields below), except the kinds listed here, each with
# the reason it cannot collide with another Instance's.
exempt:
  SitesSlot: "named inside the site it belongs to, whose name carries the prefix (the entry's name)"
  SitesHostNameBinding: "named for a custom hostname, inside the site, whose name carries the prefix; the hostname is the team's DNS name"
  SitesSlotsHostNameBinding: "named for a custom hostname, inside the slot it belongs to"
  PrivateEndpoint: "its default name is derived from the site's ID, which carries the prefix; a name an entry sets is the team's"
  PrivateEndpointsPrivateDnsZoneGroup: "named inside the endpoint it belongs to"
  RoleAssignment: "its name is a GUID (a stable UUID ASO makes), scoped to the site, slot or endpoint"
  ManagementLock: "named inside the resource it locks, whose name carries the prefix (the module's lock-<kind>)"
  DiagnosticSetting: "named inside the site it is on, whose name carries the prefix"
  SitesConfigAuthSettingsV2: "a config section of the site, its name fixed by Azure (authsettingsV2)"
  SitesConfigLogs: "a config section of the site, its name fixed by Azure (logs)"
  SitesConfigSlotConfigNames: "a config section of the site, its name fixed by Azure (slotConfigNames)"
  SitesBasicPublishingCredentialsPolicyFtp: "a policy of the site, its name fixed by Azure (ftp)"
  SitesBasicPublishingCredentialsPolicyScm: "a policy of the site, its name fixed by Azure (scm)"
nameFields:
  Site: azureName
  Certificate: azureName
