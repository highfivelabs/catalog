# The module's defaults for a Linux web app on an existing plan: HTTPS
# only, public network access disabled, TLS 1.3. FTP basic
# authentication must be left as Azure has it (true): the module's default
# (false) writes a publishing credentials policy, which has no kind.
name: app-example
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
service_plan_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Web/serverFarms/asp-example
ftp_publish_basic_authentication_enabled: true
