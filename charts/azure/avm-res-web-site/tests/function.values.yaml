# A Linux Python function app whose host storage connection uses a
# user-assigned identity (storage_uses_managed_identity), with built-in
# logging off and the content share disabled.
name: func-example
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
service_plan_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Web/serverfarms/asp-ep
kind: functionapp
ftp_publish_basic_authentication_enabled: true
storage_account_name: stfuncexample
storage_uses_managed_identity: true
storage_user_assigned_identity_client_id: 44444444-4444-4444-4444-444444444444
builtin_logging_enabled: false
content_share_force_disabled: true
daily_memory_time_quota: 0
managed_identities:
  user_assigned_resource_ids: [/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uai-func]
app_settings:
  FUNCTIONS_WORKER_RUNTIME: python
site_config:
  application_stack:
    python: {python_version: "3.12"}
  runtime_scale_monitoring_enabled: true
  app_scale_limit: 10
  elastic_instance_minimum: 1
