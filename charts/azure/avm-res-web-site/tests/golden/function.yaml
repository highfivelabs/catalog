---
# Source: avm-res-web-site/templates/main.yaml
apiVersion: web.azure.com/v20250501
kind: Site
metadata:
  name: function-site
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "function"
    app.kubernetes.io/name: avm-res-web-site
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "site"
spec:
  azureName: "func-example"
  location: "eastus2"
  owner:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example"
  kind: "functionapp,linux"
  clientAffinityEnabled: false
  clientCertEnabled: false
  dailyMemoryTimeQuota: 0
  enabled: true
  httpsOnly: true
  identity:
    type: UserAssigned
    userAssignedIdentities:
    - reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uai-func
  outboundVnetRouting:
    allTraffic: false
    applicationTraffic: false
    backupRestoreTraffic: false
    contentShareTraffic: false
    imagePullTraffic: false
  publicNetworkAccess: Disabled
  reserved: true
  serverFarmReference:
    armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Web/serverfarms/asp-ep
  siteConfig:
    alwaysOn: true
    appSettings:
    - name: AzureWebJobsDashboard
      value: ""
    - name: AzureWebJobsFeatureFlags
      value: EnableWorkerIndexing
    - name: AzureWebJobsStorage__accountName
      value: stfuncexample
    - name: AzureWebJobsStorage__clientId
      value: 44444444-4444-4444-4444-444444444444
    - name: AzureWebJobsStorage__credential
      value: managedidentity
    - name: FUNCTIONS_EXTENSION_VERSION
      value: ~4
    - name: FUNCTIONS_WORKER_RUNTIME
      value: python
    - name: WEBSITE_CONTENTSHARE
      value: ""
    ftpsState: FtpsOnly
    functionAppScaleLimit: 10
    functionsRuntimeScaleMonitoringEnabled: true
    http20Enabled: false
    ipSecurityRestrictionsDefaultAction: Allow
    linuxFxVersion: PYTHON|3.12
    loadBalancing: LeastRequests
    managedPipelineMode: Integrated
    minTlsVersion: "1.3"
    minimumElasticInstanceCount: 1
    remoteDebuggingEnabled: false
    scmIpSecurityRestrictionsDefaultAction: Allow
    scmIpSecurityRestrictionsUseMain: false
    scmMinTlsVersion: "1.2"
    use32BitWorkerProcess: false
    vnetRouteAllEnabled: false
    webSocketsEnabled: false
