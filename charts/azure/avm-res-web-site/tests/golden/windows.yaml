# Source: avm-res-web-site/templates/main.yaml
apiVersion: web.azure.com/v20250501
kind: Site
metadata:
  name: windows-site
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "windows"
    app.kubernetes.io/name: avm-res-web-site
    app.kubernetes.io/version: "0.3.0"
    team: "web"
  annotations:
    hfl.dev/id: "site"
    serviceoperator.azure.com/reconcile-policy: detach-on-delete
spec:
  azureName: "app-win"
  location: "eastus2"
  owner:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full"
  kind: "app"
  clientAffinityEnabled: true
  clientCertEnabled: true
  clientCertExclusionPaths: /health
  clientCertMode: Optional
  dnsConfiguration:
    dnsMaxCacheTimeout: 30
    dnsServers:
    - 168.63.129.16
  enabled: true
  endToEndEncryptionEnabled: true
  httpsOnly: true
  identity:
    type: SystemAssigned, UserAssigned
    userAssignedIdentities:
    - reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uai
  ipMode: IPv4
  keyVaultReferenceIdentity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uai
  outboundVnetRouting:
    allTraffic: true
    applicationTraffic: false
    backupRestoreTraffic: true
    contentShareTraffic: false
    imagePullTraffic: true
  publicNetworkAccess: Enabled
  reserved: false
  serverFarmReference:
    armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Web/serverfarms/asp-win
  siteConfig:
    alwaysOn: true
    appSettings:
    - name: FEATURE_FLAG
      value: "on"
    - name: WEBSITE_RUN_FROM_PACKAGE
      value: "1"
    autoHealEnabled: true
    autoHealRules:
      actions:
        actionType: Recycle
        minProcessExecutionTime: "00:01:00"
      triggers:
        requests:
          count: 100
          timeInterval: "00:01:00"
        statusCodes:
        - count: 10
          status: 500
          timeInterval: "00:05:00"
    cors:
      allowedOrigins:
      - https://example.com
      supportCredentials: true
    defaultDocuments:
    - index.html
    ftpsState: FtpsOnly
    healthCheckPath: /healthz
    http20Enabled: true
    ipSecurityRestrictions:
    - action: Allow
      ipAddress: 203.0.113.0/24
      name: office
      priority: 100
      tag: Default
    - action: Allow
      headers:
        x-azure-fdid:
        - 00000000-0000-0000-0000-000000000001
      ipAddress: AzureFrontDoor.Backend
      name: frontdoor
      priority: 200
      tag: ServiceTag
    - action: Allow
      name: subnet
      priority: 65000
      vnetSubnetResourceReference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/virtualNetworks/vnet/subnets/snet-apps
    ipSecurityRestrictionsDefaultAction: Deny
    loadBalancing: LeastRequests
    localMySqlEnabled: false
    managedPipelineMode: Integrated
    metadata:
    - name: OWNER
      value: web
    - name: CURRENT_STACK
      value: dotnet
    minTlsVersion: "1.2"
    netFrameworkVersion: v8.0
    numberOfWorkers: 2
    remoteDebuggingEnabled: false
    scmIpSecurityRestrictions:
    - action: Allow
      ipAddress: 203.0.113.0/24
      name: office
      priority: 65000
      tag: Default
    scmIpSecurityRestrictionsDefaultAction: Allow
    scmIpSecurityRestrictionsUseMain: false
    scmMinTlsVersion: "1.2"
    use32BitWorkerProcess: false
    virtualApplications:
    - physicalPath: site\wwwroot
      preloadEnabled: true
      virtualDirectories:
      - physicalPath: site\static
        virtualPath: /static
      virtualPath: /
    vnetRouteAllEnabled: false
    webSocketsEnabled: false
  virtualNetworkSubnetReference:
    armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/virtualNetworks/vnet/subnets/snet-apps
  tags:
    env: test
