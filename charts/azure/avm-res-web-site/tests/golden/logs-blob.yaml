# Source: avm-res-web-site/templates/config.yaml
apiVersion: web.azure.hfl.dev/v20260715
kind: SitesConfigLogs
metadata:
  name: logs-blob-logs
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "logs-blob"
    app.kubernetes.io/name: avm-res-web-site
    app.kubernetes.io/version: "0.5.0"
  annotations:
    hfl.dev/id: "config_logs:app"
spec:
  owner:
    name: logs-blob-site
  applicationLogs:
    azureBlobStorage:
      level: Information
      retentionInDays: 14
      sasUrl:
        key: application
        name: app-logs-sas
    fileSystem:
      level: "Off"
  detailedErrorMessages:
    enabled: false
  failedRequestsTracing:
    enabled: false
  httpLogs:
    azureBlobStorage:
      retentionInDays: 7
      sasUrl:
        key: http
        name: app-logs-sas
