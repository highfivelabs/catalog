# Source: avm-res-web-site/templates/config.yaml
apiVersion: web.azure.hfl.dev/v20260715
kind: SitesConfigAuthSettingsV2
metadata:
  name: config-authv2
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "config"
    app.kubernetes.io/name: avm-res-web-site
    app.kubernetes.io/version: "0.4.0"
  annotations:
    hfl.dev/id: "config_authsettingsv2"
spec:
  owner:
    name: config-site
  globalValidation:
    excludedPaths:
    - /health
    requireAuthentication: true
    unauthenticatedClientAction: Return401
  httpSettings:
    forwardProxy:
      convention: Custom
      customHostHeaderName: X-Original-Host
    requireHttps: true
    routes:
      apiPrefix: /.auth
  identityProviders:
    azureActiveDirectory:
      enabled: true
      registration:
        clientId: 22222222-2222-2222-2222-222222222222
        clientSecretSettingName: MICROSOFT_PROVIDER_AUTHENTICATION_SECRET
        openIdIssuer: https://sts.windows.net/00000000-0000-0000-0000-000000000000/v2.0
      validation:
        allowedAudiences:
        - api://app-config
        defaultAuthorizationPolicy:
          allowedApplications:
          - 33333333-3333-3333-3333-333333333333
          allowedPrincipals: {}
        jwtClaimChecks: {}
    customOpenIdConnectProviders:
      okta:
        enabled: true
        login:
          nameClaimType: email
          scopes:
          - openid
          - email
        registration:
          clientCredential:
            clientSecretSettingName: OKTA_SECRET
            method: ClientSecretPost
          clientId: okta-client
          openIdConnectConfiguration:
            wellKnownOpenIdConfiguration: https://example.okta.com/.well-known/openid-configuration
    gitHub:
      enabled: false
      login:
        scopes:
        - user
  login:
    allowedExternalRedirectUrls:
    - https://app.example.com
    nonce:
      nonceExpirationInterval: "00:05:00"
      validateNonce: true
    preserveUrlFragmentsForLogins: false
    tokenStore:
      enabled: true
      tokenRefreshExtensionHours: 72
  platform:
    enabled: true
    runtimeVersion: ~1
