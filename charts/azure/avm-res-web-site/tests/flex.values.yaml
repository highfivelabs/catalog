# A Flex Consumption (FC1) function app: functionAppConfig carries the
# runtime, scale and deployment storage (by its system-assigned identity);
# the siteConfig properties FC1 rejects are left out.
name: func-flex
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
service_plan_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Web/serverfarms/asp-flex
kind: functionapp
ftp_publish_basic_authentication_enabled: true
function_app_uses_fc1: true
fc1_runtime_name: node
fc1_runtime_version: "20"
storage_container_endpoint: https://stflex.blob.core.windows.net/deployments
storage_authentication_type: SystemAssignedIdentity
maximum_instance_count: 40
instance_memory_in_mb: 2048
always_ready:
  http: {instance_count: 1}
managed_identities: {system_assigned: true}
site_config:
  application_stack:
    node: {node_version: "20"}
