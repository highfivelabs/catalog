# The web app's secret inputs as references to Kubernetes Secrets in the
# component's namespace (docs/secrets.md), put there by External Secrets
# Operator: a certificate uploaded as a PFX with its password, and Azure
# Files shares mounted with the storage account's access key, on the site
# and on a slot (whose keys are in
# slots_storage_shares_to_mount_sensitive_values, as in the module).
name: app-secrets
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
service_plan_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Web/serverFarms/asp-example
ftp_publish_basic_authentication_enabled: true
certificates:
  www:
    name: app-www
    pfx_blob: {secretName: app-tls, key: pfx}
    password: {secretName: app-tls, key: password}
    host_names: [www.example.com]
storage_shares_to_mount:
  content:
    name: content
    account_name: stexample
    share_name: content
    mount_path: /mnt/content
    access_key: {secretName: app-storage, key: key1}
deployment_slots:
  staging:
    ftp_publish_basic_authentication_enabled: true
    webdeploy_publish_basic_authentication_enabled: true
    storage_shares_to_mount:
      content: {name: content, account_name: stexample, share_name: content-staging, mount_path: /mnt/content}
slots_storage_shares_to_mount_sensitive_values:
  content: {secretName: app-storage, key: key1}
