# A Linux container web app with two deployment slots: staging (its own
# settings, identity and a custom domain, the site's lock inherited) and
# canary (on another plan, with its own lock and role assignment, tags not
# inherited).
name: app-slots
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
service_plan_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Web/serverfarms/asp-p1
ftp_publish_basic_authentication_enabled: true
all_child_resources_inherit_tags: false
tags: {env: prod}
lock: {kind: CanNotDelete}
app_settings: {WEBSITES_PORT: "8080"}
site_config:
  container_registry_use_managed_identity: true
  application_stack:
    docker: {docker_image_name: shop/web, docker_registry_url: https://acr.azurecr.io, docker_image_tag: "1.0"}
deployment_slots:
  staging:
    ftp_publish_basic_authentication_enabled: true
    webdeploy_publish_basic_authentication_enabled: true
    public_network_access_enabled: true
    tags: {slot: staging}
    managed_identities: {system_assigned: true}
    app_settings: {WEBSITES_PORT: "8080", SLOT: staging}
    site_config:
      always_on: false
      application_stack:
        docker: {docker_image_name: shop/web, docker_registry_url: https://acr.azurecr.io, docker_image_tag: "1.1"}
    custom_domains:
      staging:
        hostname: staging.example.com
  canary:
    name: canary-1
    ftp_publish_basic_authentication_enabled: true
    webdeploy_publish_basic_authentication_enabled: true
    server_farm_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Web/serverFarms/asp-canary
    lock: {kind: ReadOnly, name: canary-ro}
    role_assignments:
      reader: {role_definition_id_or_name: Reader, principal_id: 55555555-5555-5555-5555-555555555555}
