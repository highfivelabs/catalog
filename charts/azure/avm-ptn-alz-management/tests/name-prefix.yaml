#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every
# object this chart renders carries the namePrefix in its Azure name
# (spec.azureName, nameFields below), except the kinds listed here, each with
# the reason it cannot collide with another Instance's.
exempt:
  WorkspacesLinkedService: "the workspace's one Automation link, Automation, inside the workspace, whose name carries the prefix when the chart makes it"
  Solution: "named <solution>(<workspace>) inside the workspace's group, by the workspace's name, which carries the prefix when the chart makes it"
  OnboardingState: "Sentinel's onboarding state of the workspace, inside it (Azure's name, default)"
nameFields:
  ResourceGroup: azureName
  Workspace: azureName
  AutomationAccount: azureName
  UserAssignedIdentity: azureName
  DataCollectionRule: azureName
