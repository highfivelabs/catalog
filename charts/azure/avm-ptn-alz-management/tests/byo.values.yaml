# An existing resource group and workspace (the module's
# examples/bring_your_own_law): nothing made at the group's or the
# workspace's level; the Automation account linked to the existing
# workspace, its solutions, Sentinel onboarding (named, with a
# customer-managed key) and the change tracking rule writing to it; the
# other two rules and the identity disabled.
automation_account_name: aa-byo
location: eastus2
resource_group_name: rg-byo
subscription_id: 00000000-0000-0000-0000-000000000000
resource_group_creation_enabled: false
log_analytics_workspace_creation_enabled: false
log_analytics_workspace_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-logs/providers/Microsoft.OperationalInsights/workspaces/law-central
linked_automation_account_creation_enabled: true
sentinel_onboarding: {name: default, customer_managed_key_enabled: true}
data_collection_rules:
  change_tracking: {name: dcr-change-tracking}
  vm_insights: {name: dcr-vm-insights, enabled: false}
  defender_sql: {name: dcr-defender-sql, enabled: false}
user_assigned_managed_identities:
  ama: {name: uami-ama, enabled: false}
