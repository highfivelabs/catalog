apiVersion: insights.azure.com/v1api20240311
kind: DataCollectionRule
metadata:
  name: basic-dcr-vm-insights
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: avm-ptn-alz-management
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "data_collection_rule:vm_insights"
spec:
  azureName: "dcr-vm-insights"
  location: "eastus2"
  owner:
    name: basic-rg
  description: Data collection rule for VM Insights.
  dataSources:
    performanceCounters:
      - name: VMInsightsPerfCounters
        streams: [Microsoft-InsightsMetrics]
        samplingFrequencyInSeconds: 60
        counterSpecifiers: ['\VmInsights\DetailedMetrics']
    extensions:
      - name: DependencyAgentDataSource
        extensionName: DependencyAgent
        streams: [Microsoft-ServiceMap]
        extensionSettings: {}
  destinations:
    logAnalytics:
      - name: VMInsightsPerf-Logs-Dest
        workspaceResourceReference:
          group: operationalinsights.azure.com
          kind: Workspace
          name: basic-law
  dataFlows:
    - streams: [Microsoft-InsightsMetrics]
      destinations: [VMInsightsPerf-Logs-Dest]
    - streams: [Microsoft-ServiceMap]
      destinations: [VMInsightsPerf-Logs-Dest]
