# For an apply against the fake cloud: an HTTPS gateway whose listener's
# certificate is a PFX and password in a Kubernetes Secret, and an Entra
# JWT validation configuration its rule names. The harness makes the
# Secret before the apply from a self-signed certificate it generates
# then (hack/test-secret.sh; nothing committed), as the line below asks:
# secret: catalog-appgw-tls pfx
name: catalog-appgw-tls
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg
tags: {catalog: mock}
sku: {name: Standard_v2, tier: Standard_v2, capacity: 1}
public_ip_addresses:
  pub: {name: catalog-appgw-tls-pip}
gateway_ip_configurations:
  - name: gw-ip
    subnet: {id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/virtualNetworks/catalog-vnet/subnets/snet-appgw}
frontend_ip_configurations:
  - {name: fe-public, public_ip_address_key: pub}
frontend_ports:
  - {name: port-443, port: 443}
ssl_certificates:
  - {name: tls, data: {secretName: catalog-appgw-tls, key: pfx}, password: {secretName: catalog-appgw-tls, key: password}}
backend_address_pools:
  - {name: pool-web}
probes:
  - {name: probe-http, protocol: Http, host: 127.0.0.1, path: /, interval: 30, timeout: 30, unhealthy_threshold: 3}
backend_http_settings_collection:
  - {name: http-80, port: 80, protocol: Http, cookie_based_affinity: Disabled, request_timeout: 30, probe: {probe_key: probe-http}}
http_listeners:
  - {name: listener-443, protocol: Https, frontend_ip_configuration: {frontend_ip_configuration_key: fe-public}, frontend_port: {frontend_port_key: port-443}, ssl_certificate: {ssl_certificate_key: tls}}
request_routing_rules:
  - {name: rule-https, rule_type: Basic, priority: 100, http_listener: {http_listener_key: listener-443}, backend_address_pool: {backend_address_pool_key: pool-web}, backend_http_settings: {backend_http_settings_key: http-80}, entra_jwt_validation_config: {entra_jwt_validation_config_key: api}}
entra_jwt_validation_configs:
  - name: api
    client_id: 11111111-1111-1111-1111-111111111111
    tenant_id: 00000000-0000-0000-0000-000000000000
    audiences: [api://catalog-appgw]
    un_authorized_request_action: Deny
