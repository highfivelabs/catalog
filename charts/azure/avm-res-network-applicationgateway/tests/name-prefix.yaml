#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every
# object this chart renders carries the namePrefix in its Azure name
# (spec.azureName, nameFields below), except the kinds listed here, each with
# the reason it cannot collide with another Instance's.
exempt:
  RoleAssignment: "its name is a GUID (a stable UUID ASO makes), scoped to the gateway"
  ManagementLock: "named inside the gateway it locks, whose name carries the prefix (the module's lock-<kind>)"
  DiagnosticSetting: "named inside the gateway it is on, whose name carries the prefix (the module's diag-<name>)"
nameFields:
  ApplicationGateway: azureName
  PublicIPAddress: azureName
