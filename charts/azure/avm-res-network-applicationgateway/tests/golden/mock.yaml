      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/applicationGateways/catalog-appgw/probes/probe-http
    protocol: Http
    requestTimeout: 30
  frontendIPConfigurations:
  - name: fe-public
    publicIPAddress:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/publicIPAddresses/catalog-appgw-pip
  frontendPorts:
  - name: port-80
    port: 80
  gatewayIPConfigurations:
  - name: gw-ip
    subnet:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/virtualNetworks/catalog-vnet/subnets/snet-appgw
  httpListeners:
  - frontendIPConfiguration:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/applicationGateways/catalog-appgw/frontendIPConfigurations/fe-public
    frontendPort:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/applicationGateways/catalog-appgw/frontendPorts/port-80
    name: listener-80
    protocol: Http
  location: eastus2
  owner:
    armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg
  probes:
  - host: 127.0.0.1
    interval: 30
    name: probe-http
    path: /
    protocol: Http
    timeout: 30
    unhealthyThreshold: 3
  requestRoutingRules:
  - backendAddressPool:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/applicationGateways/catalog-appgw/backendAddressPools/pool-web
    backendHttpSettings:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/applicationGateways/catalog-appgw/backendHttpSettingsCollection/http-80
    httpListener:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/applicationGateways/catalog-appgw/httpListeners/listener-80
    name: rule-basic
    priority: 100
    ruleType: Basic
  sku:
    capacity: 1
    name: Standard_v2
    tier: Standard_v2
  tags:
