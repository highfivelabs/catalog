apiVersion: network.azure.com/v1api20220701
kind: ApplicationGateway
metadata:
  name: basic-appgw
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: avm-res-network-applicationgateway
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "application_gateway"
spec:
  azureName: appgw-example
  backendAddressPools:
  - backendAddresses:
