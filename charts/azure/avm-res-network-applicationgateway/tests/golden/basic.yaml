    name: http-80
    port: 80
    protocol: Http
    requestTimeout: 30
  frontendIPConfigurations:
  - name: fe-public
    publicIPAddress:
      reference:
        group: network.azure.com
        kind: PublicIPAddress
        name: basic-pip-pub
  frontendPorts:
  - name: port-80
    port: 80
  gatewayIPConfigurations:
  - name: gw-ip
    subnet:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet/subnets/snet-appgw
  httpListeners:
  - frontendIPConfiguration:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/applicationGateways/appgw-example/frontendIPConfigurations/fe-public
    frontendPort:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/applicationGateways/appgw-example/frontendPorts/port-80
    name: listener-80
    protocol: Http
  location: eastus2
  owner:
    armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
  requestRoutingRules:
  - backendAddressPool:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/applicationGateways/appgw-example/backendAddressPools/pool-web
    backendHttpSettings:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/applicationGateways/appgw-example/backendHttpSettingsCollection/http-80
    httpListener:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/applicationGateways/appgw-example/httpListeners/listener-80
    name: rule-basic
    priority: 100
    ruleType: Basic
  sku:
    capacity: 1
    name: Standard_v2
    tier: Standard_v2
