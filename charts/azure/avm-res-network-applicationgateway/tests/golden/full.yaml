# Source: avm-res-network-applicationgateway/templates/main.yaml
apiVersion: network.azure.com/v1api20220701
kind: ApplicationGateway
metadata:
  name: full-appgw
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: avm-res-network-applicationgateway
    app.kubernetes.io/version: "0.1.0"
    team: "net"
  annotations:
    hfl.dev/id: "application_gateway"
    serviceoperator.azure.com/reconcile-policy: detach-on-delete
spec:
  autoscaleConfiguration:
    maxCapacity: 3
    minCapacity: 1
  azureName: appgw-full
  backendAddressPools:
  - backendAddresses:
    - ipAddress: 10.0.1.4
    - fqdn: web.example.com
    name: pool-web
  - name: pool-api
  backendHttpSettingsCollection:
  - affinityCookieName: APPGW
    authenticationCertificates:
    - reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/authenticationCertificates/auth
    connectionDraining:
      drainTimeoutInSec: 60
      enabled: true
    cookieBasedAffinity: Enabled
    hostName: web.example.com
    name: http-80
    path: /
    pickHostNameFromBackendAddress: false
    port: 80
    probe:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/probes/probe-http
    probeEnabled: true
    protocol: Http
    requestTimeout: 30
    trustedRootCertificates:
    - reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/trustedRootCertificates/root
  - name: http-api
    port: 8080
    probe:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/probes/probe-http
    protocol: Http
  backendSettingsCollection:
  - hostName: db.example.com
    name: tcp-5432
    pickHostNameFromBackendAddress: false
    port: 5432
    probe:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/probes/probe-tcp
    protocol: Tcp
    timeout: 60
    trustedRootCertificates:
    - reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/trustedRootCertificates/root
  customErrorConfigurations:
  - customErrorPageUrl: https://example.com/502.html
    statusCode: HttpStatus502
  enableFips: false
  enableHttp2: true
  firewallPolicy:
    reference:
      armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/ApplicationGatewayWebApplicationFirewallPolicies/wafp
  forceFirewallPolicyAssociation: true
  frontendIPConfigurations:
  - name: fe-public
    privateLinkConfiguration:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/privateLinkConfigurations/plc
    publicIPAddress:
      reference:
        group: network.azure.com
        kind: PublicIPAddress
        name: full-pip-pub
  - name: fe-private
    privateIPAddress: 10.0.0.10
    privateIPAllocationMethod: Static
    subnet:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/virtualNetworks/vnet/subnets/snet-appgw
  frontendPorts:
  - name: port-80
    port: 80
  - name: port-8443
    port: 8443
  gatewayIPConfigurations:
  - name: gw-ip
    subnet:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/virtualNetworks/vnet/subnets/snet-appgw
  globalConfiguration:
    enableRequestBuffering: true
    enableResponseBuffering: false
  httpListeners:
  - customErrorConfigurations:
    - customErrorPageUrl: https://example.com/403.html
      statusCode: HttpStatus403
    firewallPolicy:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/ApplicationGatewayWebApplicationFirewallPolicies/wafp
    frontendIPConfiguration:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/frontendIPConfigurations/fe-public
    frontendPort:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/frontendPorts/port-80
    hostName: web.example.com
    name: listener-80
    protocol: Http
    requireServerNameIndication: false
  - frontendIPConfiguration:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/frontendIPConfigurations/fe-private
    frontendPort:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/frontendPorts/port-80
    hostNames:
    - old.example.com
    - legacy.example.com
    name: listener-redirect
    protocol: Http
    sslCertificate:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/sslCertificates/cert
    sslProfile:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/sslProfiles/profile-strict
  identity:
    type: SystemAssigned, UserAssigned
    userAssignedIdentities:
    - reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uai
  listeners:
  - frontendIPConfiguration:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/frontendIPConfigurations/fe-private
    frontendPort:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/frontendPorts/port-8443
    name: tls-listener
    protocol: Tcp
    sslProfile:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/sslProfiles/profile-strict
  loadDistributionPolicies:
  - loadDistributionAlgorithm: RoundRobin
    loadDistributionTargets:
    - reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/loadDistributionPolicies/ldp-rr/loadDistributionTargets/t1
    name: ldp-rr
  location: eastus2
  owner:
    armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full
  privateLinkConfigurations:
  - ipConfigurations:
    - name: plc-ip
      primary: true
      privateIPAllocationMethod: Dynamic
      subnet:
        reference:
          armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/virtualNetworks/vnet/subnets/snet-pl
    name: plc
  probes:
  - host: web.example.com
    interval: 30
    match:
      body: ok
      statusCodes:
      - 200-399
    minServers: 0
    name: probe-http
    path: /healthz
    pickHostNameFromBackendHttpSettings: false
    port: 80
    protocol: Http
    timeout: 30
    unhealthyThreshold: 3
  - interval: 30
    name: probe-tcp
    pickHostNameFromBackendSettings: true
    protocol: Tcp
    timeout: 30
    unhealthyThreshold: 3
  redirectConfigurations:
  - includePath: true
    includeQueryString: true
    name: to-listener
    pathRules:
    - reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/urlPathMaps/paths/pathRules/old
    redirectType: Permanent
    targetListener:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/httpListeners/listener-80
    urlPathMaps:
    - reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/urlPathMaps/paths
  - name: to-url
    redirectType: Found
    requestRoutingRules:
    - reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/requestRoutingRules/rule-redirect
    targetUrl: https://example.com
  requestRoutingRules:
  - httpListener:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/httpListeners/listener-80
    name: rule-paths
    priority: 100
    rewriteRuleSet:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/rewriteRuleSets/rw-headers
    ruleType: PathBasedRouting
    urlPathMap:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/urlPathMaps/paths
  - httpListener:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/httpListeners/listener-redirect
    name: rule-redirect
    priority: 110
    redirectConfiguration:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/redirectConfigurations/to-url
    ruleType: Basic
  - backendAddressPool:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/backendAddressPools/pool-web
    backendHttpSettings:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/backendHttpSettingsCollection/http-80
    httpListener:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/httpListeners/listener-80
    loadDistributionPolicy:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/loadDistributionPolicies/ldp-rr
    name: rule-ldp
    priority: 120
    ruleType: Basic
  rewriteRuleSets:
  - name: rw-headers
    rewriteRules:
    - actionSet:
        requestHeaderConfigurations:
        - headerName: X-Forwarded-Proto
          headerValue: https
        responseHeaderConfigurations:
        - headerName: Strict-Transport-Security
          headerValue: max-age=31536000
        urlConfiguration:
          modifiedPath: /new
          modifiedQueryString: a=b
          reroute: false
      conditions:
      - ignoreCase: true
        negate: false
        pattern: text/html
        variable: http_resp_Content-Type
      name: add-hsts
      ruleSequence: 100
  routingRules:
  - backendAddressPool:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/backendAddressPools/pool-api
    backendSettings:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/backendSettingsCollection/tcp-5432
    listener:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/listeners/tls-listener
    name: tcp-rule
    priority: 200
    ruleType: Basic
  sku:
    name: WAF_v2
    tier: WAF_v2
  sslPolicy:
    cipherSuites:
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    disabledSslProtocols: []
    minProtocolVersion: TLSv1_2
    policyType: CustomV2
  sslProfiles:
  - clientAuthConfiguration:
      verifyClientCertIssuerDN: true
      verifyClientRevocation: OCSP
    name: profile-strict
    sslPolicy:
      policyName: AppGwSslPolicy20220101S
      policyType: Predefined
    trustedClientCertificates:
    - reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/trustedClientCertificates/ca
  tags:
    env: test
    team: net
  urlPathMaps:
  - defaultBackendAddressPool:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/backendAddressPools/pool-web
    defaultBackendHttpSettings:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/backendHttpSettingsCollection/http-80
    defaultLoadDistributionPolicy:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/loadDistributionPolicies/ldp-rr
    defaultRewriteRuleSet:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/rewriteRuleSets/rw-headers
    name: paths
    pathRules:
    - backendAddressPool:
        reference:
          armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/backendAddressPools/pool-api
      backendHttpSettings:
        reference:
          armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/backendHttpSettingsCollection/http-api
      firewallPolicy:
        reference:
          armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/ApplicationGatewayWebApplicationFirewallPolicies/wafp
      loadDistributionPolicy:
        reference:
          armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/loadDistributionPolicies/ldp-rr
      name: api
      paths:
      - /api/*
      rewriteRuleSet:
        reference:
          armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/rewriteRuleSets/rw-headers
    - name: old
      paths:
      - /old/*
      redirectConfiguration:
        reference:
          armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/redirectConfigurations/to-listener
  - defaultRedirectConfiguration:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/applicationGateways/appgw-full/redirectConfigurations/to-url
    name: redirect-paths
  webApplicationFirewallConfiguration:
    disabledRuleGroups:
    - ruleGroupName: REQUEST-942-APPLICATION-ATTACK-SQLI
      rules:
      - 942100
      - 942110
    enabled: true
    exclusions:
    - matchVariable: RequestHeaderNames
      selector: X-Custom
      selectorMatchOperator: Equals
    fileUploadLimitInMb: 100
    firewallMode: Prevention
    maxRequestBodySizeInKb: 128
    requestBodyCheck: true
    ruleSetType: OWASP
    ruleSetVersion: "3.2"
  zones:
  - "1"
  - "2"
  - "3"
