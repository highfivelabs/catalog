    port: 443
    protocol: Https
    requestTimeout: 30
    trustedRootCertificates:
    - reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/applicationGateways/appgw-tls/trustedRootCertificates/backend-ca
  frontendIPConfigurations:
  - name: fe-public
    publicIPAddress:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/publicIPAddresses/pip-appgw-tls
  frontendPorts:
  - name: port-443
    port: 443
  - name: port-8443
    port: 8443
  gatewayIPConfigurations:
  - name: gw-ip
    subnet:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet/subnets/snet-appgw
  httpListeners:
  - frontendIPConfiguration:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/applicationGateways/appgw-tls/frontendIPConfigurations/fe-public
    frontendPort:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/applicationGateways/appgw-tls/frontendPorts/port-443
    name: listener-443
    protocol: Https
    sslCertificate:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/applicationGateways/appgw-tls/sslCertificates/tls-eso
  - frontendIPConfiguration:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/applicationGateways/appgw-tls/frontendIPConfigurations/fe-public
    frontendPort:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/applicationGateways/appgw-tls/frontendPorts/port-8443
    name: listener-8443
    protocol: Https
    sslCertificate:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/applicationGateways/appgw-tls/sslCertificates/tls-kv
    sslProfile:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/applicationGateways/appgw-tls/sslProfiles/mtls
  identity:
    type: UserAssigned
    userAssignedIdentities:
    - reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-appgw
  location: eastus2
  owner:
    armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
  requestRoutingRules:
  - backendAddressPool:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/applicationGateways/appgw-tls/backendAddressPools/pool-web
    backendHttpSettings:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/applicationGateways/appgw-tls/backendHttpSettingsCollection/https-443
    httpListener:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/applicationGateways/appgw-tls/httpListeners/listener-443
    name: rule-443
    priority: 100
    ruleType: Basic
  - backendAddressPool:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/applicationGateways/appgw-tls/backendAddressPools/pool-web
    backendHttpSettings:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/applicationGateways/appgw-tls/backendHttpSettingsCollection/https-443
    httpListener:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/applicationGateways/appgw-tls/httpListeners/listener-8443
    name: rule-8443
    priority: 110
    ruleType: Basic
  sku:
    capacity: 1
    name: Standard_v2
    tier: Standard_v2
  sslCertificates:
  - data:
      key: pfx
      name: appgw-tls
    name: tls-eso
    password:
      key: password
      name: appgw-tls
  - keyVaultSecretId: https://kv-example.vault.azure.net/secrets/appgw-tls
    name: tls-kv
  sslProfiles:
  - name: mtls
    trustedClientCertificates:
    - reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/applicationGateways/appgw-tls/trustedClientCertificates/client-ca
