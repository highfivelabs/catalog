---
# Source: avm-res-network-applicationgateway/templates/main.yaml
apiVersion: network.azure.hfl.dev/v20260301
kind: ApplicationGateway
metadata:
  name: mock-tls-appgw
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock-tls"
    app.kubernetes.io/name: avm-res-network-applicationgateway
    app.kubernetes.io/version: "0.4.0"
  annotations:
    hfl.dev/id: "application_gateway"
spec:
  azureName: catalog-appgw-tls
  backendAddressPools:
  - name: pool-web
  backendHttpSettingsCollection:
  - cookieBasedAffinity: Disabled
    name: http-80
    port: 80
    probe:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/applicationGateways/catalog-appgw-tls/probes/probe-http
    protocol: Http
    requestTimeout: 30
  entraJWTValidationConfigs:
  - audiences:
    - api://catalog-appgw
    clientId: 11111111-1111-1111-1111-111111111111
    name: api
    tenantId: 00000000-0000-0000-0000-000000000000
    unAuthorizedRequestAction: Deny
  frontendIPConfigurations:
  - name: fe-public
    publicIPAddress:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/publicIPAddresses/catalog-appgw-tls-pip
  frontendPorts:
  - name: port-443
    port: 443
  gatewayIPConfigurations:
  - name: gw-ip
    subnet:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/virtualNetworks/catalog-vnet/subnets/snet-appgw
  httpListeners:
  - frontendIPConfiguration:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/applicationGateways/catalog-appgw-tls/frontendIPConfigurations/fe-public
    frontendPort:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/applicationGateways/catalog-appgw-tls/frontendPorts/port-443
    name: listener-443
    protocol: Https
    sslCertificate:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/applicationGateways/catalog-appgw-tls/sslCertificates/tls
  location: eastus2
  owner:
    armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg
  probes:
  - host: 127.0.0.1
    interval: 30
    name: probe-http
    path: /
    protocol: Http
    timeout: 30
    unhealthyThreshold: 3
  requestRoutingRules:
  - backendAddressPool:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/applicationGateways/catalog-appgw-tls/backendAddressPools/pool-web
    backendHttpSettings:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/applicationGateways/catalog-appgw-tls/backendHttpSettingsCollection/http-80
    entraJWTValidationConfig:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/applicationGateways/catalog-appgw-tls/entraJWTValidationConfigs/api
    httpListener:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/applicationGateways/catalog-appgw-tls/httpListeners/listener-443
    name: rule-https
    priority: 100
    ruleType: Basic
  sku:
    capacity: 1
    name: Standard_v2
    tier: Standard_v2
  sslCertificates:
  - data:
      key: pfx
      name: catalog-appgw-tls
    name: tls
    password:
      key: password
      name: catalog-appgw-tls
  tags:
    catalog: mock
---
# Source: avm-res-network-applicationgateway/templates/main.yaml
apiVersion: network.azure.com/v20250301
kind: PublicIPAddress
metadata:
  name: mock-tls-pip-pub
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock-tls"
    app.kubernetes.io/name: avm-res-network-applicationgateway
    app.kubernetes.io/version: "0.4.0"
  annotations:
    hfl.dev/id: "public_ip:pub"
spec:
  azureName: "catalog-appgw-tls-pip"
  location: "eastus2"
  owner:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg"
  ddosSettings:
    protectionMode: VirtualNetworkInherited
  idleTimeoutInMinutes: 4
  publicIPAddressVersion: IPv4
  publicIPAllocationMethod: Static
  sku:
    name: Standard
    tier: Regional
  tags:
    catalog: mock
