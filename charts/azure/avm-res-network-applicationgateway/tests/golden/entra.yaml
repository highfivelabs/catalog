    frontendPort:
      reference:
        armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/applicationGateways/appgw-jwt/frontendPorts/port-80
    name: listener-80
    protocol: Http
  location: eastus2
  owner:
    armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
