# The module's minimal shape: a Standard_v2 gateway with one public
# frontend on a public IP it makes, port 80, a pool, HTTP settings, a
# listener and a basic rule, every reference by key.
name: appgw-example
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
sku: {name: Standard_v2, tier: Standard_v2, capacity: 1}
public_ip_addresses:
  pub: {name: pip-appgw-example}
gateway_ip_configurations:
  - name: gw-ip
    subnet: {id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet/subnets/snet-appgw}
frontend_ip_configurations:
  - {name: fe-public, public_ip_address_key: pub}
frontend_ports:
  - {name: port-80, port: 80}
backend_address_pools:
  - name: pool-web
    backend_addresses: [{ip_address: 10.0.1.4}]
backend_http_settings_collection:
  - {name: http-80, port: 80, protocol: Http, cookie_based_affinity: Disabled, request_timeout: 30}
http_listeners:
  - name: listener-80
    protocol: Http
    frontend_ip_configuration: {frontend_ip_configuration_key: fe-public}
    frontend_port: {frontend_port_key: port-80}
request_routing_rules:
  - name: rule-basic
    rule_type: Basic
    priority: 100
    http_listener: {http_listener_key: listener-80}
    backend_address_pool: {backend_address_pool_key: pool-web}
    backend_http_settings: {backend_http_settings_key: http-80}
