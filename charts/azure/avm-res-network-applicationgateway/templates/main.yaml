---
apiVersion: network.azure.com/v1api20220701
kind: ApplicationGateway
metadata:
  {{- include "aso.metadata" (dict "root" $ "name" $obj "id" "application_gateway" "abandon" $abandon) | nindent 2 }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{- $gwOwner := dict "group" "network.azure.com" "kind" "ApplicationGateway" "name" $obj }}
{{- with $v.lock }}
{{- $notes := ternary "Cannot delete the resource or its child resources." "Cannot delete or modify the resource or its child resources." (eq .kind "CanNotDelete") }}
{{- include "aso.lock" (dict "root" $ "base" $obj "idPrefix" "" "owner" $gwOwner "v" (dict "kind" .kind "name" .name "notes" $notes)) }}
{{- end }}
{{- $ras := dict }}
{{- range $rk, $r := ($v.role_assignments | default dict) }}
{{- $r2 := deepCopy $r }}
{{- if and (kindIs "invalid" $r.principal_type) $r.skip_service_principal_aad_check }}{{ $_ := set $r2 "principal_type" "ServicePrincipal" }}{{ end }}
{{- $_ := set $ras $rk $r2 }}
{{- end }}
{{- include "aso.roleAssignments" (dict "root" $ "base" $obj "idPrefix" "" "owner" $gwOwner "v" $ras) }}
{{- include "aso.diagnosticSettings" (dict "root" $ "base" $obj "idPrefix" "" "owner" $gwOwner "v" $v.diagnostic_settings "defaultName" (printf "diag-%s" $v.name)) }}
{{- /* azapi_resource.public_ip_addresses: Standard, Regional, Static. */ -}}
{{- range $k, $ip := $pips }}
{{- $pobj := include "aso.name" (list $.Release.Name "pip" $k) }}
{{- $ver := $ip.ip_version | default "IPv4" }}
{{- $zones := list }}
{{- if not (kindIs "invalid" $ip.zones) }}{{ range $ip.zones }}{{ $zones = append $zones (toString .) }}{{ end }}
{{- else }}{{ range ($v.zones | default list) }}{{ $zones = append $zones (toString .) }}{{ end }}{{ end }}
{{- $ptags := include "aso.tags" (list $ ($ip.tags | default dict)) | fromJson }}
---
apiVersion: network.azure.com/v20250301
kind: PublicIPAddress
metadata:
  {{- include "aso.metadata" (dict "root" $ "name" $pobj "id" (printf "public_ip:%s" $k) "abandon" $abandon) | nindent 2 }}
spec:
  azureName: {{ include "aso.cloudName" (list $ "public IP" $ip.name 80 false) | quote }}
  location: {{ $v.location | quote }}
  owner:
    {{- include "aso.owner" (list $ (printf "public_ip_addresses.%s.parent_id" $k) ($ip.parent_id | default $v.parent_id)) | nindent 4 }}
  ddosSettings:
    {{- with $ip.ddos_protection_plan_resource_id }}
    ddosProtectionPlan:
      reference:
        armId: {{ . | quote }}
    {{- end }}
    protectionMode: {{ $ip.ddos_protection_mode | default "VirtualNetworkInherited" }}
  {{- if or $ip.domain_name_label $ip.reverse_fqdn }}
  dnsSettings:
    {{- with $ip.domain_name_label }}
    domainNameLabel: {{ . | quote }}
    {{- end }}
    {{- with $ip.reverse_fqdn }}
    reverseFqdn: {{ . | quote }}
    {{- end }}
  {{- end }}
  idleTimeoutInMinutes: {{ ternary 4 $ip.idle_timeout_in_minutes (kindIs "invalid" $ip.idle_timeout_in_minutes) | int }}
  {{- with $ip.ip_tags }}
  ipTags:
    {{- range $tk, $t := . }}
    - ipTagType: {{ $tk | quote }}
      tag: {{ $t | quote }}
    {{- end }}
  {{- end }}
  publicIPAddressVersion: {{ $ver }}
  publicIPAllocationMethod: Static
  {{- with $ip.public_ip_prefix_resource_id }}
  publicIPPrefix:
    reference:
      armId: {{ . | quote }}
  {{- end }}
  sku:
    name: Standard
    tier: Regional
  {{- with $zones }}
  zones:
    {{- toYaml (sortAlpha .) | nindent 4 }}
  {{- end }}
  {{- with $ptags }}
  tags:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
