azapi_resource.this (Microsoft.Network/applicationGateways): one ASO
ApplicationGateway (network.azure.com/v1api20220701, ASO's only version:
ARM 2022-07-01, where the module sends 2025-03-01), owned by the resource
group parent_id names, every component inline as ARM carries it. A
component's internal reference (an *_key) becomes the gateway's ARM ID, the
collection's segment and the component's configured name, as the module
resolves it (_appgw.tpl). azapi_resource.public_ip_addresses: one ASO
PublicIPAddress per public_ip_addresses entry, which a frontend with that
public_ip_address_key references by Kubernetes name.
azurerm_management_lock.this: an aso-extensions ManagementLock;
azurerm_role_assignment.this: ASO RoleAssignments;
azurerm_monitor_diagnostic_setting.this: ASO DiagnosticSettings. The
telemetry is not ported. Refused (upstream.yaml): what ARM 2022-07-01
lacks, the certificates (their data is a Kubernetes Secret in ASO), and the
azapi provider's mechanics.
*/ -}}
