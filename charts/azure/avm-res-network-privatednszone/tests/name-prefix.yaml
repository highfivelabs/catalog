#
# The namePrefix convention (docs/design.md, "Names, labels and tags"). A
# private DNS zone's Azure name is the domain it serves, and a prefix would
# serve another domain; every other object is named inside the zone. So no
# object here takes the namePrefix, each kind with the reason.
noCloudNames: "a private DNS zone's name is its domain (domain_name), which a prefix would change; zones of one name in two resource groups do not collide. Records, links, the lock and role assignments are named inside the zone"
exempt:
  PrivateDnsZone: "its name is the domain it serves (domain_name), which a prefix would change"
  PrivateDnsZonesARecord: "named inside its zone, as the entry names it"
  PrivateDnsZonesAAAARecord: "named inside its zone, as the entry names it"
  PrivateDnsZonesCNAMERecord: "named inside its zone, as the entry names it"
  PrivateDnsZonesMXRecord: "named inside its zone, as the entry names it"
  PrivateDnsZonesPTRRecord: "named inside its zone, as the entry names it"
  PrivateDnsZonesSRVRecord: "named inside its zone, as the entry names it"
  PrivateDnsZonesTXTRecord: "named inside its zone, as the entry names it"
  PrivateDnsZonesSOARecord: "the zone's one SOA record set, always named @ inside its zone"
  PrivateDnsZonesVirtualNetworkLink: "named inside its zone, as the entry names it"
  RoleAssignment: "its name is a GUID (a stable UUID ASO makes), scoped to the zone"
  ManagementLock: "named inside the zone it locks (the module's lock-<domain_name>)"
