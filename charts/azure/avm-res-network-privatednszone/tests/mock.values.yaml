# For an apply against the fake cloud (docs/azure.md, "8. Charts"): a zone
# with an A and a TXT record in the fake cloud's resource group.
domain_name: catalog.mock.internal
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg
tags: {catalog: mock}
a_records:
  app: {name: app, ttl: 60, ip_addresses: [10.42.0.10]}
txt_records:
  owner: {name: "@", ttl: 60, records: {a: {value: [catalog]}}}
