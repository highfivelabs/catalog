# The module README's default example, cut down: a zone with an A record
# and a link to one network.
domain_name: privatelink.example.internal
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
a_records:
  web: {name: web, ttl: 300, ip_addresses: [10.0.0.4]}
virtual_network_links:
  hub:
    name: hub-link
    virtual_network_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet-hub
