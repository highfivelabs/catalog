# Every input the chart carries: the group by ID, a DDoS plan, DNS label and
# reverse FQDN, IP tags, a prefix, one zone, a longer idle timeout, tags, a
# lock, role assignments and diagnostic settings.
name: pip-web
location: westeurope
resource_group_name: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-net
allocation_method: Static
ddos_protection_mode: Enabled
ddos_protection_plan_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-net/providers/Microsoft.Network/ddosProtectionPlans/ddos
domain_name_label: web-example
reverse_fqdn: web.example.com.
idle_timeout_in_minutes: 15
ip_tags: {RoutingPreference: Internet}
public_ip_prefix_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-net/providers/Microsoft.Network/publicIPPrefixes/ippre
zones: [2]
enable_telemetry: false
tags: {environment: prod}
lock: {kind: CanNotDelete}
role_assignments:
  netops:
    role_definition_id_or_name: Network Contributor
    principal_id: 4179302c-702e-4de7-a061-beacd0a1be09
    skip_service_principal_aad_check: true
diagnostic_settings:
  law:
    workspace_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-ops/providers/Microsoft.OperationalInsights/workspaces/law
  archive:
    name: to-storage
    log_groups: []
    log_categories: [DDoSProtectionNotifications]
    log_analytics_destination_type: AzureDiagnostics
    storage_account_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-ops/providers/Microsoft.Storage/storageAccounts/stdiag
