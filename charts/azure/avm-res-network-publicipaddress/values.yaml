#
# Values mirror the Terraform variables of the Azure Verified Module
# avm-res-network-publicipaddress (v0.2.1): same names, types and defaults,
# so a module block's arguments become this file one to one.
# values.schema.json carries the types and the module's validations.
#
# Descriptions quoted from terraform-azurerm-avm-res-network-publicipaddress
# (variables.tf, v0.2.1), Copyright (c) Microsoft Corporation, MIT.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables, except tags.
#
# The public IP's name in full, {publicIp}. A name set here takes no
# prefix; one not set is name, with the namePrefix in front.
names: {}
# An optional convenience: "<namePrefix>-" in front of the name (never one
# set under names). Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. ASO never copies them to Azure (Azure
# tags are tags).
labels: {}
# DELETE (the default) or ABANDON, which keeps every resource in Azure when
# the component is deleted (ASO's reconcile-policy detach-on-delete).
# PREVENT is refused: use lock. Not a module variable.
deletion_policy: null
# The subscription of resource_group_name. Not a module variable: the
# module's azurerm provider knows its subscription; ASO's owner is an
# Azure resource ID. Not needed when resource_group_name is a resource
# group's ID (/subscriptions/<id>/resourceGroups/<name>).
subscription_id: ""

# The allocation method of the public IP: Static or Dynamic.
allocation_method: Static
# The DDoS protection mode: Disabled, Enabled or VirtualNetworkInherited.
ddos_protection_mode: VirtualNetworkInherited
# The ID of the DDoS protection plan (only with ddos_protection_mode
# Enabled).
ddos_protection_plan_id: null
# A map of diagnostic settings to create on the public IP.
# Each: {name, log_categories, log_groups (["allLogs"]), metric_categories
# (["AllMetrics"]), log_analytics_destination_type ("Dedicated"),
# workspace_resource_id, storage_account_resource_id,
# event_hub_authorization_rule_resource_id, event_hub_name,
# marketplace_partner_resource_id}.
diagnostic_settings: {}
# A label for the domain name (the FQDN <label>.<location>.cloudapp.azure.com).
domain_name_label: null
# The Edge Zone of the public IP.
edge_zone: null
# This variable controls whether or not telemetry is enabled for the
# module. Accepted; the chart never sends telemetry.
enable_telemetry: true
# The idle timeout of TCP connections, in minutes.
idle_timeout_in_minutes: 4
# A map of IP tags (type to value) of the public IP.
ip_tags: {}
# The IP version: IPv4 or IPv6.
ip_version: IPv4
# The Azure region of the public IP.
location: ""
# Controls the Resource Lock configuration for this resource.
# {kind (CanNotDelete or ReadOnly), name (default lock-<kind>)}
lock: null
# The name of the public IP.
name: null
# The ID of the public IP prefix to allocate the address from.
public_ip_prefix_id: null
# The name of the resource group of the public IP (or its ID).
resource_group_name: ""
# A fully qualified domain name that resolves to this public IP (reverse
# DNS).
reverse_fqdn: null
# A map of role assignments to create on the public IP.
# Each: {role_definition_id_or_name, principal_id,
# skip_service_principal_aad_check, condition, condition_version,
# delegated_managed_identity_resource_id, principal_type}.
role_assignments: {}
# The SKU of the public IP: Basic or Standard.
sku: Standard
# The tier of the SKU of the public IP address: Global or Regional.
sku_tier: Regional
# (Optional) Tags of the resource.
tags: null
# A set of availability zones to use.
zones: [1, 2, 3]
