#
# The Bundt Package for this chart. Outputs are the module's declared
# outputs, selected from the live object (resources.<id>) and the
# component's values (inputs). name is computed from inputs as the module
# sets it; public_ip_address is the address Azure allocated (ASO's
# status.ipAddress); public_ip_id and resource_id are both the address's
# ARM ID, as in the module.
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: azure-avm-res-network-publicipaddress
spec:
  version: 0.1.0
  engine: helm
  providers: [aso]
  outputs:
    name: >-
      ('publicIp' in inputs.names && inputs.names.publicIp != '' ? inputs.names.publicIp : (inputs.namePrefix != '' ? inputs.namePrefix + '-' : '') + inputs.name)
    public_ip_address: resources.public_ip.status.ipAddress
    public_ip_id: resources.public_ip.status.id
    resource_id: resources.public_ip.status.id
