#
# Every variable of avm-res-network-bastionhost v0.9.0 (variables.tf,
# variables.interfaces.tf), with its default, and the chart's own values
# first. README.md maps each one to Azure Service Operator.

# Not Terraform variables.
# names.bastionHost: the bastion host's name in full; no prefix.
names: {}
# A prefix for the bastion host's and the made public IP's names: <namePrefix>-<name>.
namePrefix: ""
# Kubernetes labels on every object; never sent to Azure (tags are).
labels: {}
# DELETE (default) or ABANDON; PREVENT is refused (use lock).
deletion_policy: null

# Module variables (alphabetical, required ones included).
copy_paste_enabled: true
diagnostic_settings: {}
enable_telemetry: true
file_copy_enabled: false
ip_configuration: null
ip_connect_enabled: false
kerberos_enabled: false
location: ""
lock: null
name: null
parent_id: ""
private_only_enabled: false
role_assignments: {}
scale_units: 2
session_recording_enabled: false
shareable_link_enabled: false
sku: Basic
tags: null
tunneling_enabled: false
virtual_network_id: null
zones: ["1", "2", "3"]
