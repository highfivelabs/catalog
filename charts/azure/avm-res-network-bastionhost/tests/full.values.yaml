# A Standard host with every flag Standard takes, two scale units over
# three, a named IP configuration and public IP with its own tags, and the
# lock, role assignments (on the host and the public IP, as the module
# does) and diagnostic settings.
name: bas-full
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
sku: Standard
copy_paste_enabled: false
file_copy_enabled: true
ip_connect_enabled: true
kerberos_enabled: true
shareable_link_enabled: true
tunneling_enabled: true
scale_units: 3
zones: ["1", "2"]
tags: {env: dev}
labels: {hfl.dev/team: net}
enable_telemetry: false
ip_configuration:
  name: ipconfig-full
  subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet/subnets/AzureBastionSubnet
  create_public_ip: true
  public_ip_address_name: pip-bas-full
  public_ip_tags: {role: bastion}
  public_ip_merge_with_module_tags: true
lock: {kind: CanNotDelete}
role_assignments:
  reader: {role_definition_id_or_name: Reader, principal_id: 11111111-1111-1111-1111-111111111111, principal_type: Group}
diagnostic_settings:
  law: {workspace_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.OperationalInsights/workspaces/law}
