# Whole names from a naming convention: names.bastionHost is used as
# given; an existing public IP, so no name takes the namePrefix. labels
# stay in Kubernetes; tags reach Azure.
name: web
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
namePrefix: shop-dev
names: {bastionHost: bas-shop-dev}
labels: {hfl.dev/team: shop}
tags: {team: shop}
ip_configuration: {subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet/subnets/AzureBastionSubnet, create_public_ip: false, public_ip_address_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/publicIPAddresses/pip-shop}
