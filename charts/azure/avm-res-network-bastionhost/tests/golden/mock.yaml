      publicIPAddress:
        reference:
          group: network.azure.com
          kind: PublicIPAddress
          name: mock-pip
      subnet:
        reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/virtualNetworks/catalog-vnet/subnets/AzureBastionSubnet"
  scaleUnits: 2
  tags:
    catalog: mock
