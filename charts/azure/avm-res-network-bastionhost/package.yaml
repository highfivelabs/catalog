#
# The Bundt Package for this chart. Outputs are the module's declared
# outputs, selected from the live objects (resources.<id>): name,
# resource_id and dns_name (properties.dnsName, which the module exports
# from Azure's response) are the bastion host's. The module's resource
# output (the whole azapi object) is not an output.
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: azure-avm-res-network-bastionhost
spec:
  version: 0.1.0
  engine: helm
  providers: [aso]
  outputs:
    name: resources.bastion_host.spec.azureName
    resource_id: resources.bastion_host.status.id
    dns_name: >-
      'dnsName' in resources.bastion_host.status ? resources.bastion_host.status.dnsName : null
