#
# The Bundt Package for this chart. Outputs are the module's declared
# outputs, selected from the live objects (resources.<id>): the firewall's
# name and ARM ID. Not outputs: private_ip_address, since ASO's
# AzureFirewall status carries an IP configuration's ID only, not its
# private address (a hub firewall's address is in status.hubIPAddresses,
# but a firewall in a network's is not), and resource, the module's
# azurerm-shaped compatibility object, whose IP configurations need it.
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: azure-avm-res-network-azurefirewall
spec:
  version: 0.1.0
  engine: helm
  providers: [aso]
  outputs:
    name: resources.azure_firewall.spec.azureName
    resource_id: resources.azure_firewall.status.id
