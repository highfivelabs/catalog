# Whole names from a naming convention: names.azureFirewall is used as
# given; the namePrefix goes on no name set in full. labels stay in
# Kubernetes; tags reach Azure.
name: hub
location: eastus2
resource_group_name: rg-shop-dev
subscription_id: 00000000-0000-0000-0000-000000000000
namePrefix: shop-dev
names: {azureFirewall: afw-shop-dev-hub}
labels: {hfl.dev/team: shop}
tags: {team: shop}
firewall_sku_name: AZFW_VNet
firewall_sku_tier: Standard
ip_configurations:
  a: {name: ipconfig1, subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-shop-dev/providers/Microsoft.Network/virtualNetworks/vnet/subnets/AzureFirewallSubnet}
