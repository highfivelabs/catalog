# A firewall in a virtual hub: no IP configurations, two public IPs
# Azure allocates, the deprecated list left empty.
name: afw-hub
location: eastus2
resource_group_name: rg-example
subscription_id: 00000000-0000-0000-0000-000000000000
firewall_sku_name: AZFW_Hub
firewall_sku_tier: Premium
firewall_policy_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/firewallPolicies/afwp-premium
firewall_virtual_hub:
  virtual_hub_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualHubs/vhub-eastus2
  public_ip_count: 2
