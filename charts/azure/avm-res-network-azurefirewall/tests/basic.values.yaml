# The module README's default shape: a Standard firewall in a network's
# AzureFirewallSubnet with one public IP, in all three zones.
name: afw-example
location: eastus2
resource_group_name: rg-example
subscription_id: 00000000-0000-0000-0000-000000000000
firewall_sku_name: AZFW_VNet
firewall_sku_tier: Standard
ip_configurations:
  default:
    name: ipconfig1
    subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet-hub/subnets/AzureFirewallSubnet
    public_ip_address_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/publicIPAddresses/pip-afw
