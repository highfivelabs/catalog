# For an apply against the fake cloud (docs/azure.md, "8. Charts"): a
# Basic firewall in the fake cloud's resource group, its subnets and public
# IPs by ID (the fake keeps any body), with a lock.
name: catalog-afw
location: eastus2
resource_group_name: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg
firewall_sku_name: AZFW_VNet
firewall_sku_tier: Basic
firewall_zones: []
tags: {catalog: mock}
ip_configurations:
  a:
    name: ipconfig1
    subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/virtualNetworks/catalog-vnet/subnets/AzureFirewallSubnet
    public_ip_address_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/publicIPAddresses/catalog-afw-pip
firewall_management_ip_configuration:
  name: mgmt
  subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/virtualNetworks/catalog-vnet/subnets/AzureFirewallManagementSubnet
  public_ip_address_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/publicIPAddresses/catalog-afw-mgmt-pip
lock: {kind: CanNotDelete}
