#
# Every variable of avm-res-network-azurefirewall v0.5.0 (variables.tf),
# with its default, and the chart's own values first. README.md maps each
# one to Azure Service Operator.

# Not Terraform variables.
# names.azureFirewall: the firewall's name in full; no prefix.
names: {}
# A prefix for the firewall's name: <namePrefix>-<name>.
namePrefix: ""
# Kubernetes labels on every object; never sent to Azure (tags are).
labels: {}
# DELETE (default) or ABANDON; PREVENT is refused (use lock).
deletion_policy: null
# The subscription of resource_group_name when it is a name and parent_id
# is not set: ASO's owner is a resource ID.
subscription_id: ""

# Module variables (alphabetical, required ones included).
diagnostic_settings: {}
enable_telemetry: true
firewall_ip_configuration: null
firewall_management_ip_configuration: null
firewall_policy_id: null
firewall_private_ip_ranges: null
firewall_sku_name: null
firewall_sku_tier: null
firewall_timeouts: null
firewall_virtual_hub: null
firewall_zones: ["1", "2", "3"]
ignore_body_changes: {}
ip_configurations: {}
location: null
lock: null
name: null
parent_id: null
resource_group_name: ""
resource_types: {}
retry: null
role_assignments: {}
tags: null
timeouts: null
