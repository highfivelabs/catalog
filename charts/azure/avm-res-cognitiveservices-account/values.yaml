#
# Values mirror the Terraform variables of the Azure Verified Module
# avm-res-cognitiveservices-account (v0.11.1): same names, types and
# defaults, so a module block's arguments become this file one to one.
# values.schema.json carries the types and the module's validations.
# README.md maps each one to Azure Service Operator.
#
# Descriptions quoted from terraform-azurerm-avm-res-cognitiveservices-account
# (variables.tf, v0.11.1), Copyright (c) Microsoft Corporation, MIT.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables, except tags.
#
# The account's name in full, {account}. A name set here takes no prefix;
# one not set is name, with the namePrefix in front. Deployments, RAI
# policies and private endpoints are named by their entries.
names: {}
# An optional convenience: "<namePrefix>-" in front of the account's name
# (never one set under names). Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. ASO never copies them to Azure (Azure
# tags are tags).
labels: {}
# DELETE (the default) or ABANDON, which keeps every resource in Azure when
# the component is deleted (ASO's reconcile-policy detach-on-delete).
# PREVENT is refused: use lock. Not a module variable.
deletion_policy: null

# Module variables (alphabetical, required ones included).

# Whether this resource supports project management as child resources
# (AI Foundry).
allow_project_management: false
# The AML Workspace configuration (AIServices only): {resource_id,
# identity_client_id}.
aml_workspace: null
# (Optional) The projects, by project name, associated with this resource
# (AIServices only).
associated_projects: []
# Model deployments, each {name, rai_policy_name, version_upgrade_option
# ("OnceNewDefaultVersionAvailable"), dynamic_throttling_enabled (false),
# model: {format, name, version}, scale: {capacity (1), family, size, tier,
# type}, retry, timeouts}.
cognitive_deployments: {}
# (Optional) If kind is TextAnalytics, the ID of the Search service.
custom_question_answering_search_service_id: null
# (Optional) If kind is TextAnalytics, the key of the Search service: a
# reference to a Kubernetes Secret, {secretName, key} (docs/secrets.md); a
# string is refused.
custom_question_answering_search_service_key: null
# (Optional) The subdomain name used for token-based authentication.
custom_subdomain_name: null
# The customer managed key: {key_vault_resource_id, key_name, key_version,
# user_assigned_identity: {resource_id}}.
customer_managed_key: null
# (Optional) The default project (AIServices only).
default_project: null
# Serialize deployments on the account. Accepted with no effect: ASO
# retries a deployment Azure refuses while another runs.
deployment_serialization_enabled: true
# Diagnostic settings on the account, each {name, log_categories,
# log_groups (["allLogs"]), metric_categories (["AllMetrics"]),
# log_analytics_destination_type ("Dedicated"), workspace_resource_id,
# storage_account_resource_id, event_hub_authorization_rule_resource_id,
# event_hub_name, marketplace_partner_resource_id}.
diagnostic_settings: {}
# Whether dynamic throttling is enabled for this account.
dynamic_throttling_enabled: false
# This variable controls whether or not telemetry is enabled for the
# module. Accepted; the chart never sends telemetry.
enable_telemetry: true
# (Optional) The allowed FQDNs for this account.
fqdns: []
# Whether customer_managed_key is a managed HSM key.
is_hsm_key: false
# (Required) The kind of Cognitive Service Account (TextAnalytics, OpenAI,
# AIServices ...).
kind: ""
# Whether local authentication (keys) is enabled.
local_auth_enabled: null
# (Required) The Azure location of the account.
location: ""
# The resource lock: {kind (CanNotDelete or ReadOnly), name (lock-<kind>)}.
lock: null
# Managed identities: {system_assigned (false), user_assigned_resource_ids
# ([])}.
managed_identities: {}
# (Required) The name of the Cognitive Service or AI Service Account.
name: null
# (Optional) MetricsAdvisor only: the Azure AD client ID.
metrics_advisor_aad_client_id: null
# (Optional) MetricsAdvisor only: the Azure AD tenant ID.
metrics_advisor_aad_tenant_id: null
# (Optional) MetricsAdvisor only: the super user's name.
metrics_advisor_super_user_name: null
# (Optional) MetricsAdvisor only: the website name.
metrics_advisor_website_name: null
# Network ACLs: {default_action, ip_rules, virtual_network_rules: [{subnet_id,
# ignore_missing_vnet_service_endpoint}], bypass}.
network_acls: null
# Network injection (AIServices only): {subnet_id, scenario ("agent"),
# microsoft_managed_network_enabled (false)}.
network_injections: null
# Whether outbound network access is restricted.
outbound_network_access_restricted: null
# (Required) The ID of the resource group the account is created in.
parent_id: ""
# Private endpoints to the account, each {name, role_assignments, lock,
# tags, subnet_resource_id, private_dns_zone_group_name ("default"),
# private_dns_zone_resource_ids, application_security_group_associations,
# private_service_connection_name, network_interface_name, location,
# resource_group_name, ip_configurations}.
private_endpoints: {}
# Whether the module manages the private endpoints' DNS zone groups.
private_endpoints_manage_dns_zone_group: true
# Whether public network access is allowed.
public_network_access_enabled: true
# (Optional) QnAMaker only, required there: the runtime endpoint.
qna_runtime_endpoint: null
# The RAI monitor configuration (AIServices only): {adx_storage_resource_id,
# identity_client_id}.
rai_monitor_config: null
# RAI policies, each {name, base_policy_name, mode, content_filters: [{blocking,
# enabled, name, severity_threshold, source}], custom_block_lists: [{source,
# block_list_name, blocking}], retry, timeouts}.
rai_policies: {}
# Retry configuration of the AzAPI provider. Refused when set: ASO retries
# itself.
retry: null
# Role assignments on the account, each {role_definition_id_or_name,
# principal_id, skip_service_principal_aad_check, condition,
# condition_version, delegated_managed_identity_resource_id,
# principal_type}.
role_assignments: {}
# (Required) The SKU name (F0, S0 ...).
sku_name: ""
# User-owned storage: [{identity_client_id, storage_account_id}].
storage: null
# Tags to be applied to the account.
tags: null
# Per-operation timeouts of the AzAPI provider. Refused when set: ASO has
# none; Bundt sets a component's time limit.
timeouts: null
