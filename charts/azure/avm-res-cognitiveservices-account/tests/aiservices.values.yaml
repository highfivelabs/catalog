# An AI Foundry (AIServices) account: project management, a network
# injection for agents, an AML workspace, a RAI monitor, a managed HSM key,
# and a private endpoint with the interfaces module's default names (from
# the account's ID) in another resource group, without a DNS zone group.
name: ais-example
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
kind: AIServices
sku_name: S0
custom_subdomain_name: ais-example
allow_project_management: true
dynamic_throttling_enabled: true
associated_projects: [proj-a]
default_project: proj-a
is_hsm_key: true
customer_managed_key:
  key_vault_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.KeyVault/managedHSMs/hsm-example
  key_name: ais-key
  key_version: fedcba9876543210fedcba9876543210
managed_identities: {system_assigned: true}
network_injections: {subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet/subnets/snet-agents, scenario: agent, microsoft_managed_network_enabled: true}
aml_workspace: {resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.MachineLearningServices/workspaces/aml, identity_client_id: 77777777-7777-7777-7777-777777777777}
rai_monitor_config: {adx_storage_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Kusto/clusters/adx}
private_endpoints_manage_dns_zone_group: false
private_endpoints:
  hub:
    subnet_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-hub/providers/Microsoft.Network/virtualNetworks/hub/subnets/snet-pe
    resource_group_name: rg-hub
    location: westus3
    private_dns_zone_resource_ids: [/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-hub/providers/Microsoft.Network/privateDnsZones/privatelink.cognitiveservices.azure.com]
