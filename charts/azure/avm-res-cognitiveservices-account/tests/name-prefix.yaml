#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every
# object this chart renders carries the namePrefix in its Azure name
# (spec.azureName, nameFields below), except the kinds listed here, each with
# the reason it cannot collide with another Instance's.
exempt:
  Deployment: "named inside the account it belongs to, whose name carries the prefix (the entry's name)"
  AccountsRaiPolicy: "named inside the account it belongs to, whose name carries the prefix (the entry's name)"
  PrivateEndpoint: "its default name is derived from the account's ID, which carries the prefix; a name an entry sets is the team's"
  PrivateEndpointsPrivateDnsZoneGroup: "named inside the endpoint it belongs to"
  RoleAssignment: "its name is a GUID (a stable UUID ASO makes), scoped to the account or endpoint"
  ManagementLock: "named inside the resource it locks, whose name carries the prefix (the module's lock-<kind>)"
  DiagnosticSetting: "named inside the resource it is on, whose name carries the prefix (the module's diag-<name>)"
nameFields:
  Account: azureName
