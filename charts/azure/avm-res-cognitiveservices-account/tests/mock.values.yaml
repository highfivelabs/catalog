# For an apply against the fake cloud (docs/azure.md, "8. Charts"): an
# OpenAI account with a model deployment and the RAI policy it uses (an
# aso-extensions kind, which the fake cloud's run reconciles), in the fake
# cloud's resource group.
name: catalog-cog
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg
kind: OpenAI
sku_name: S0
custom_subdomain_name: catalog-cog
tags: {catalog: mock}
managed_identities: {system_assigned: true}
rai_policies:
  p: {name: catalog-policy, base_policy_name: Microsoft.DefaultV2, mode: Default}
cognitive_deployments:
  gpt: {name: gpt, rai_policy_name: catalog-policy, model: {format: OpenAI, name: gpt-4o-mini, version: "2024-07-18"}, scale: {type: GlobalStandard, capacity: 1}}
