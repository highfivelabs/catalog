# Source: avm-res-cognitiveservices-account/templates/deployments.yaml
apiVersion: cognitiveservices.azure.hfl.dev/v20250601
kind: AccountsRaiPolicy
metadata:
  name: full-account-rai-strict
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: avm-res-cognitiveservices-account
    app.kubernetes.io/version: "0.1.0"
    hfl.dev/team: "ai"
  annotations:
    hfl.dev/id: "rai_policy:strict"
spec:
  azureName: "strict"
  owner:
    name: full-account
  properties:
    basePolicyName: "Microsoft.DefaultV2"
    contentFilters:
      - blocking: true
        enabled: true
        name: "Hate"
        severityThreshold: "Low"
        source: "Prompt"
      - blocking: true
        enabled: true
        name: "Hate"
        severityThreshold: "Low"
        source: "Completion"
    customBlocklists:
      - blocking: true
        blocklistName: "words"
        source: "Prompt"
    mode: "Blocking"
