apiVersion: cognitiveservices.azure.com/v20250601
kind: Account
metadata:
  name: full-account
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: avm-res-cognitiveservices-account
    app.kubernetes.io/version: "0.1.0"
    hfl.dev/team: "ai"
  annotations:
    hfl.dev/id: "account"
spec:
  azureName: "cog-full"
  location: "eastus2"
  owner:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example"
  kind: "OpenAI"
  sku:
    name: "S0"
  identity:
    type: "SystemAssigned, UserAssigned"
    userAssignedIdentities:
      - reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uai-cog"
  properties:
    allowProjectManagement: false
    allowedFqdnList:
      - example.com
      - contoso.com
    customSubDomainName: "cog-full-example"
    dynamicThrottlingEnabled: false
    disableLocalAuth: true
    encryption:
      keySource: Microsoft.KeyVault
      keyVaultProperties:
        keyName: cog-key
        keyVaultUri: https://kv-example.vault.azure.net/
        keyVersion: 0123456789abcdef0123456789abcdef
    networkAcls:
      bypass: "AzureServices"
      defaultAction: "Deny"
      ipRules:
        - value: "198.51.100.7"
        - value: "203.0.113.0/24"
      virtualNetworkRules:
        - ignoreMissingVnetServiceEndpoint: true
          reference:
            armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet/subnets/snet-app"
    publicNetworkAccess: Disabled
    restrictOutboundNetworkAccess: true
    userOwnedStorage:
      -
        identityClientId: "44444444-4444-4444-4444-444444444444"
        resourceReference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Storage/storageAccounts/stcog"
  tags:
    env: dev
