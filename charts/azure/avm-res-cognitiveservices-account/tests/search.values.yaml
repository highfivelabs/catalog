# A Language account with custom question answering: its Search service by
# ID and the Search service's admin key as a reference to a Kubernetes
# Secret in the component's namespace (docs/secrets.md), put there by
# External Secrets Operator, never a value.
name: cog-search
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
kind: TextAnalytics
sku_name: S
custom_subdomain_name: cog-search-example
custom_question_answering_search_service_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Search/searchServices/srch-example
custom_question_answering_search_service_key: {secretName: cog-search, key: admin-key}
