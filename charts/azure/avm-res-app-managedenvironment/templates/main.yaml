azapi_resource.this: one aso-extensions ManagedEnvironment
(app.azure.hfl.dev/v20251002preview, beside ASO's 2025-01-01 kind under its
name), the children owned by its ARM ID, owned by the resource group parent_id or resource_group_name names, its
body as the module builds it (local.resource_body), with the deprecated
inputs folded in as the module's effective_* locals fold them.
The child modules: aso-extensions kinds (app.azure.hfl.dev), each owned by
the environment: ManagedEnvironmentsCertificate (certificates),
ManagedEnvironmentsDaprComponent (dapr_components),
ManagedEnvironmentsDaprSubscription (dapr_subscriptions),
ManagedEnvironmentsStorage (storages), ManagedEnvironmentsManagedCertificate
(managed_certificates), ManagedEnvironmentsJavaComponent (java_components),
ManagedEnvironmentsDotNetComponent (dot_net_components),
ManagedEnvironmentsHttpRouteConfig (http_route_configs) and
ManagedEnvironmentsMaintenanceConfiguration (maintenance_configurations).
azapi_resource.lock: an aso-extensions ManagementLock, with the module's
name and notes.
azapi_resource.role_assignments: ASO RoleAssignments.
azapi_resource.diagnostic_settings: ASO DiagnosticSettings.
time_sleep.lock_removal, the role definition lookup, the workspace's
customer ID and shared key lookups and the telemetry are not ported.
Secret values (the shared key, certificate passwords and blobs, connection
strings, keys) and what ASO v2.22.0 and aso-extensions have no field or
kind for are refused (upstream.yaml).
*/ -}}
{{- define "cae.set" -}}
{{- if not (kindIs "invalid" .) -}}
{{- if or (kindIs "map" .) (kindIs "slice" .) (kindIs "string" .) -}}
{{- if not (empty .) }}true{{ end -}}
{{- else -}}true{{- end -}}
{{- end -}}
{{- end -}}
{{- define "cae.identityRef" -}}
{{- if hasPrefix "/" . -}}
armId: {{ . | quote }}
{{- else -}}
wellKnownName: {{ . | quote }}
{{- end -}}
{{- end -}}
{{- define "cae.workloadProfiles" -}}
{{- $what := index . 0 }}{{ $list := index . 1 -}}
{{- $types := list "Consumption" "Flex" "D4" "D8" "D16" "D32" "E4" "E8" "E16" "E32" "DC4" "DC8" "DC16" "DC32" "DC48" "DC64" "DC96" "NC24-A100" "NC48-A100" "NC96-A100" "Consumption-GPU-NC24-A100" "Consumption-GPU-NC8as-T4" -}}
{{- range $list -}}
{{- if not (regexMatch "^[a-zA-Z][a-zA-Z0-9_-]{0,13}[a-zA-Z0-9]$" (toString .name)) -}}
{{- fail "avm-res-app-managedenvironment: Invalid value for workload profile name. It must start with a letter, contain only letters, numbers, underscores, or dashes, and not end with an underscore or dash. Maximum 15 characters." -}}
{{- end -}}
{{- if not (has .workload_profile_type $types) -}}
{{- fail "avm-res-app-managedenvironment: Invalid value for workload_profile_type. Valid options are 'Consumption', 'Flex', 'D4', 'D8', 'D16', 'D32', 'E4', 'E8', 'E16', 'E32', 'DC4', 'DC8', 'DC16', 'DC32', 'DC48', 'DC64', 'DC96', 'NC24-A100', 'NC48-A100', 'NC96-A100', 'Consumption-GPU-NC24-A100', and 'Consumption-GPU-NC8as-T4'." -}}
{{- end -}}
{{- if and (eq .workload_profile_type "Flex") (ne (toString .name) "Flex") -}}
{{- fail (printf "avm-res-app-managedenvironment: When workload_profile_type is 'Flex', %s name must be 'Flex'." $what) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $v := .Values }}
{{- $chart := .Chart.Name }}
{{- include "aso.names" (list $ (list "managedEnvironment")) }}
{{- if not $v.name }}{{ fail "avm-res-app-managedenvironment: name is required" }}{{ end }}
{{- if not $v.location }}{{ fail "avm-res-app-managedenvironment: location is required" }}{{ end }}
{{- /* The azapi provider's mechanics. */ -}}
{{- $ibc := false }}
{{- range $_, $x := ($v.ignore_body_changes | default dict) }}
{{- if kindIs "map" $x }}{{ range $_, $paths := $x }}{{ if $paths }}{{ $ibc = true }}{{ end }}{{ end }}
{{- else if include "cae.set" $x }}{{ $ibc = true }}{{ end }}
{{- end }}
{{- include "aso.unsupported" (list $ "ignore_body_changes" $ibc "Azure Service Operator applies every property it is given and cannot leave a path to another writer (no ignore-changes)") }}
{{- include "aso.unsupported" (list $ "resource_types" $v.resource_types "ASO's and aso-extensions' kinds fix the API versions (aso-extensions' ManagedEnvironment 2025-10-02-preview; the children 2025-01-01, 2026-01-01, 2026-03-02-preview or 2026-07-01)") }}
{{- include "aso.unsupported" (list $ "retry" $v.retry "Azure Service Operator retries every failed request itself, with backoff, until the resource is ready") }}
{{- include "aso.unsupported" (list $ "timeouts" $v.timeouts "Azure Service Operator has no per-request timeouts; Bundt sets a component's time limit") }}
{{- /* The fields after ASO's ManagedEnvironment API version 2025-01-01:
the chart always renders aso-extensions' ManagedEnvironment
(app.azure.hfl.dev/v20251002preview, beside ASO's under its name; the
module sends 2025-10-02-preview) in place of ASO's, and owns the children
by ARM ID (they name ASO's kind as their owner). The secret values these
carry (connection_string, key) are refused below. */ -}}
{{- $pna := $v.public_network_access }}
{{- if and (kindIs "invalid" $pna) (not (kindIs "invalid" $v.public_network_access_enabled)) }}
{{- $pna = ternary "Enabled" "Disabled" $v.public_network_access_enabled }}
{{- end }}
{{- if and (not (kindIs "invalid" $pna)) (not (has $pna (list "Enabled" "Disabled"))) }}
{{- fail "avm-res-app-managedenvironment: public_network_access must be \"Enabled\" or \"Disabled\"" }}
{{- end }}
{{- with $v.disk_encryption_configuration }}{{ with .key_vault_configuration }}{{ with .auth }}{{ with .identity }}
{{- if not (hasPrefix "/" .) }}
{{- fail "avm-res-app-managedenvironment: disk_encryption_configuration.key_vault_configuration.auth.identity must be a user-assigned identity's resource ID: ARM 2025-10-02-preview takes no system-assigned identity there" }}
{{- end }}
{{- end }}{{ end }}{{ end }}{{ end }}
{{- /* Secret values: the builder's decision (docs/azure.md, "Charts"). */ -}}
{{- $secret := "%s is a secret value, which would sit in the component's inputs; how a component supplies one (a Kubernetes Secret for ASO's SecretReference) is not settled" }}
{{- range $n := list "connection_string" "key" "certificate_password" "certificate_value" "custom_domain_certificate_password" "custom_domain_certificate_value" "dapr_ai_connection_string" "dapr_ai_instrumentation_key" "dapr_application_insights_connection_string" "shared_key" "log_analytics_workspace_primary_shared_key" }}
{{- include "aso.unsupported" (list $ $n (include "cae.set" (index $v $n)) (printf $secret $n)) }}
{{- end }}
{{- range $n := list "connection_string_version" "key_version" "certificate_password_version" "certificate_value_version" "dapr_ai_connection_string_version" "dapr_ai_instrumentation_key_version" "shared_key_version" }}
{{- include "aso.unsupported" (list $ $n (include "cae.set" (index $v $n)) (printf "it tracks %s, a secret value the chart does not take" (trimSuffix "_version" $n))) }}
{{- end }}
{{- include "aso.unsupported" (list $ "log_analytics_workspace" (include "cae.set" $v.log_analytics_workspace) "the module reads the workspace's primary shared key and sends it, a secret value the chart does not take; send logs to Azure Monitor (app_logs_configuration.destination azure-monitor and diagnostic_settings) instead") }}
{{- include "aso.unsupported" (list $ "log_analytics_workspace_customer_id" (include "cae.set" $v.log_analytics_workspace_customer_id) "a Log Analytics destination needs the workspace's shared key, a secret value the chart does not take; send logs to Azure Monitor instead") }}
{{- /* The resource group. */ -}}
{{- $parent := "" }}
{{- if $v.parent_id }}
{{- $parent = toString $v.parent_id }}
{{- if not (regexMatch "(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+$" $parent) }}{{ fail "avm-res-app-managedenvironment: `parent_id` must be a valid Azure resource group resource ID, or null." }}{{ end }}
{{- else }}
{{- $rg := toString $v.resource_group_name }}
{{- if not $rg }}{{ fail "avm-res-app-managedenvironment: resource_group_name is required" }}{{ end }}
{{- if hasPrefix "/" $rg }}
{{- $parent = $rg }}
{{- else if $v.subscription_id }}
{{- $parent = printf "/subscriptions/%s/resourceGroups/%s" $v.subscription_id $rg }}
{{- else }}
{{- fail "avm-res-app-managedenvironment: resource_group_name is a name: set subscription_id too (ASO's owner is the group's resource ID), or parent_id" }}
{{- end }}
{{- end }}
{{- $abandon := include "aso.abandon" . }}
{{- $obj := include "aso.name" (list .Release.Name "cae") }}
{{- $envName := include "aso.resourceName" (list $ "managedEnvironment" "Container Apps environment" $v.name 60 "^[a-z][a-z0-9-]{0,58}[a-z0-9]$") }}
{{- $tags := include "aso.tags" (list $ dict) | fromJson }}
{{- /* local.effective_app_logs_configuration: app_logs_configuration, else
the deprecated log_analytics_workspace_destination (the workspace and its
customer ID are refused above). */ -}}
{{- $alc := $v.app_logs_configuration }}
{{- if and (kindIs "invalid" $alc) $v.log_analytics_workspace_destination }}
{{- $alc = dict "destination" $v.log_analytics_workspace_destination }}
{{- end }}
{{- if not (kindIs "invalid" $alc) }}
{{- if and $alc.destination (not (has $alc.destination (list "log-analytics" "azure-monitor"))) }}
{{- fail "avm-res-app-managedenvironment: app_logs_configuration.destination must be \"log-analytics\" or \"azure-monitor\". Omit app_logs_configuration to disable app logs." }}
{{- end }}
{{- if eq (toString $alc.destination) "log-analytics" }}
{{- fail "avm-res-app-managedenvironment: app_logs_configuration: destination log-analytics is not supported: it needs the workspace's shared key, a secret value the chart does not take; use azure-monitor and diagnostic_settings (docs/azure.md, \"Charts\")" }}
{{- end }}
{{- end }}
{{- /* local.effective_custom_domain_configuration. */ -}}
{{- $cdc := $v.custom_domain_configuration }}
{{- if and (kindIs "invalid" $cdc) (or $v.custom_domain_dns_suffix $v.custom_domain_certificate_key_vault_url $v.custom_domain_certificate_key_vault_identity) }}
{{- $cdc = dict "dns_suffix" $v.custom_domain_dns_suffix }}
{{- if or $v.custom_domain_certificate_key_vault_url $v.custom_domain_certificate_key_vault_identity }}
{{- $_ := set $cdc "certificate_key_vault_properties" (dict "key_vault_url" $v.custom_domain_certificate_key_vault_url "identity" $v.custom_domain_certificate_key_vault_identity) }}
{{- end }}
{{- end }}
{{- if and (not (kindIs "invalid" $cdc)) (include "cae.set" $cdc.certificate_value) }}
{{- fail (printf "avm-res-app-managedenvironment: custom_domain_configuration: certificate_value is not supported: %s (docs/azure.md, \"Charts\")" (printf $secret "a certificate's blob")) }}
{{- end }}
{{- /* local.effective_vnet_configuration. */ -}}
{{- $vnet := $v.vnet_configuration }}
{{- if and (kindIs "invalid" $vnet) (or (not (kindIs "invalid" $v.internal_load_balancer_enabled)) $v.infrastructure_subnet_id) }}
{{- $vnet = dict "infrastructure_subnet_id" $v.infrastructure_subnet_id "internal" $v.internal_load_balancer_enabled }}
{{- end }}
{{- /* local.effective_peer_authentication and _traffic_configuration. */ -}}
{{- $pa := $v.peer_authentication }}
{{- if and (kindIs "invalid" $pa) (not (kindIs "invalid" $v.peer_authentication_enabled)) }}
{{- $pa = dict "mtls" (dict "enabled" $v.peer_authentication_enabled) }}
{{- end }}
{{- $pt := $v.peer_traffic_configuration }}
{{- if and (kindIs "invalid" $pt) (not (kindIs "invalid" $v.peer_traffic_encryption_enabled)) }}
{{- $pt = dict "encryption" (dict "enabled" $v.peer_traffic_encryption_enabled) }}
{{- end }}
{{- /* local.workload_profiles: the profiles given, less any Consumption
one, then the Consumption profile Azure makes itself. */ -}}
{{- include "cae.workloadProfiles" (list "workload_profiles" ($v.workload_profiles | default list)) }}
{{- include "cae.workloadProfiles" (list "workload_profile" ($v.workload_profile | default list)) }}
{{- $wpIn := $v.workload_profiles }}
{{- if kindIs "invalid" $wpIn }}{{ $wpIn = $v.workload_profile }}{{ end }}
{{- $zr := $v.zone_redundant }}
{{- if kindIs "invalid" $zr }}{{ $zr = $v.zone_redundancy_enabled }}{{ end }}
{{- $irg := $v.infrastructure_resource_group | default $v.infrastructure_resource_group_name }}
{{- $mi := $v.managed_identities | default dict }}
{{- $uai := $mi.user_assigned_resource_ids | default list }}
{{- $idType := "" }}
{{- if and $mi.system_assigned $uai }}{{ $idType = "SystemAssigned,UserAssigned" }}{{ else if $mi.system_assigned }}{{ $idType = "SystemAssigned" }}{{ else if $uai }}{{ $idType = "UserAssigned" }}{{ end }}
{{- if and (not (kindIs "invalid" $vnet)) (eq (toString $vnet.internal) "true") (eq (toString $pna) "Enabled") }}
{{- fail "avm-res-app-managedenvironment: public_network_access cannot be \"Enabled\" when vnet_configuration.internal is true. Set public_network_access to \"Disabled\" or disable the internal load balancer." }}
{{- end }}
{{- $envID := printf "%s/providers/Microsoft.App/managedEnvironments/%s" $parent $envName }}
---
apiVersion: app.azure.hfl.dev/v20251002preview
kind: ManagedEnvironment
metadata:
  {{- include "aso.metadata" (dict "root" $ "name" $obj "id" "managed_environment" "abandon" $abandon) | nindent 2 }}
spec:
  azureName: {{ $envName | quote }}
  location: {{ $v.location | quote }}
  owner:
    {{- include "aso.owner" (list $ "the resource group" $parent) | nindent 4 }}
  {{- with $v.kind }}
  kind: {{ . | quote }}
  {{- end }}
  {{- with $idType }}
  identity:
    type: {{ . }}
    {{- with $uai }}
    userAssignedIdentities:
      {{- range (uniq . | sortAlpha) }}
      - reference:
          armId: {{ . | quote }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- if not (kindIs "invalid" $alc) }}
  {{- with $alc.destination }}
  appLogsConfiguration:
    destination: {{ . | quote }}
  {{- else }}
  appLogsConfiguration: {}
  {{- end }}
  {{- end }}
  {{- if not (kindIs "invalid" $cdc) }}
  {{- $c := dict }}
  {{- with $cdc.certificate_key_vault_properties }}
  {{- $kv := dict }}
  {{- with .identity }}{{ $_ := set $kv "identityReference" (include "cae.identityRef" . | fromYaml) }}{{ end }}
  {{- with .key_vault_url }}{{ $_ := set $kv "keyVaultUrl" . }}{{ end }}
  {{- $_ := set $c "certificateKeyVaultProperties" $kv }}
  {{- end }}
  {{- with $cdc.dns_suffix }}{{ $_ := set $c "dnsSuffix" . }}{{ end }}
  customDomainConfiguration:
    {{- if $c }}
    {{- toYaml $c | nindent 4 }}
    {{- else }} {}
    {{- end }}
  {{- end }}
  {{- with $irg }}
  infrastructureResourceGroup: {{ . | quote }}
  {{- end }}
  {{- if not (kindIs "invalid" $pa) }}
  {{- $p := dict }}
  {{- if not (kindIs "invalid" $pa.mtls) }}
  {{- $m := dict }}
  {{- if not (kindIs "invalid" $pa.mtls.enabled) }}{{ $_ := set $m "enabled" $pa.mtls.enabled }}{{ end }}
  {{- $_ := set $p "mtls" $m }}
  {{- end }}
  peerAuthentication: {{ toJson $p }}
  {{- end }}
  {{- if not (kindIs "invalid" $pt) }}
  {{- $p := dict }}
  {{- if not (kindIs "invalid" $pt.encryption) }}
  {{- $e := dict }}
  {{- if not (kindIs "invalid" $pt.encryption.enabled) }}{{ $_ := set $e "enabled" $pt.encryption.enabled }}{{ end }}
  {{- $_ := set $p "encryption" $e }}
  {{- end }}
  peerTrafficConfiguration: {{ toJson $p }}
  {{- end }}
  {{- with $tags }}
  tags:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if not (kindIs "invalid" $vnet) }}
  vnetConfiguration:
    {{- $n := dict }}
    {{- with $vnet.docker_bridge_cidr }}{{ $_ := set $n "dockerBridgeCidr" . }}{{ end }}
    {{- with $vnet.infrastructure_subnet_id }}{{ $_ := set $n "infrastructureSubnetReference" (dict "armId" .) }}{{ end }}
    {{- if not (kindIs "invalid" $vnet.internal) }}{{ $_ := set $n "internal" $vnet.internal }}{{ end }}
    {{- with $vnet.platform_reserved_cidr }}{{ $_ := set $n "platformReservedCidr" . }}{{ end }}
    {{- with $vnet.platform_reserved_dns_ip }}{{ $_ := set $n "platformReservedDnsIP" . }}{{ end }}
    {{- if $n }}
    {{- toYaml $n | nindent 4 }}
    {{- else }} {}
    {{- end }}
  {{- end }}
  {{- if $wpIn }}
  workloadProfiles:
    {{- range $wpIn }}
    {{- if ne .workload_profile_type "Consumption" }}
    - name: {{ .name | quote }}
      workloadProfileType: {{ .workload_profile_type | quote }}
      {{- if not (kindIs "invalid" .minimum_count) }}
      minimumCount: {{ .minimum_count | int }}
      {{- end }}
      {{- if not (kindIs "invalid" .maximum_count) }}
      maximumCount: {{ .maximum_count | int }}
      {{- end }}
    {{- end }}
    {{- end }}
    - name: Consumption
      workloadProfileType: Consumption
  {{- end }}
  {{- if not (kindIs "invalid" $zr) }}
  zoneRedundant: {{ $zr }}
  {{- end }}
  {{- if not (kindIs "invalid" $v.app_insights_configuration) }}
  appInsightsConfiguration: {}
  {{- end }}
  {{- if not (kindIs "invalid" $v.availability_zones) }}
  availabilityZones: {{ toJson $v.availability_zones }}
  {{- end }}
  {{- if not (kindIs "invalid" $v.disk_encryption_configuration) }}
  {{- $d := dict }}
  {{- with $v.disk_encryption_configuration.key_vault_configuration }}
  {{- $kv := dict }}
  {{- if not (kindIs "invalid" .auth) }}
  {{- $a := dict }}
  {{- with .auth.identity }}{{ $_ := set $a "identityReference" (dict "armId" .) }}{{ end }}
  {{- $_ := set $kv "auth" $a }}
  {{- end }}
  {{- with .key_url }}{{ $_ := set $kv "keyUrl" . }}{{ end }}
  {{- $_ := set $d "keyVaultConfiguration" $kv }}
  {{- end }}
  diskEncryptionConfiguration: {{ toJson $d }}
  {{- end }}
  {{- if not (kindIs "invalid" $v.ingress_configuration) }}
  {{- $i := dict }}
  {{- with $v.ingress_configuration }}
  {{- if not (kindIs "invalid" .header_count_limit) }}{{ $_ := set $i "headerCountLimit" (.header_count_limit | int) }}{{ end }}
  {{- if not (kindIs "invalid" .request_idle_timeout) }}{{ $_ := set $i "requestIdleTimeout" (.request_idle_timeout | int) }}{{ end }}
  {{- if not (kindIs "invalid" .termination_grace_period_seconds) }}{{ $_ := set $i "terminationGracePeriodSeconds" (.termination_grace_period_seconds | int) }}{{ end }}
  {{- with .workload_profile_name }}{{ $_ := set $i "workloadProfileName" . }}{{ end }}
  {{- end }}
  ingressConfiguration: {{ toJson $i }}
  {{- end }}
  {{- if not (kindIs "invalid" $v.open_telemetry_configuration) }}
  {{- $o := dict }}
  {{- $ot := $v.open_telemetry_configuration }}
  {{- if not (kindIs "invalid" $ot.destinations_configuration) }}
  {{- $dc := dict }}
  {{- if not (kindIs "invalid" $ot.destinations_configuration.data_dog_configuration) }}
  {{- $dd := dict }}
  {{- with $ot.destinations_configuration.data_dog_configuration.site }}{{ $_ := set $dd "site" . }}{{ end }}
  {{- $_ := set $dc "dataDogConfiguration" $dd }}
  {{- end }}
  {{- if not (kindIs "invalid" $ot.destinations_configuration.otlp_configurations) }}
  {{- $ol := list }}
  {{- range $ot.destinations_configuration.otlp_configurations }}
  {{- $c := dict }}
  {{- with .endpoint }}{{ $_ := set $c "endpoint" . }}{{ end }}
  {{- if not (kindIs "invalid" .headers) }}
  {{- $hl := list }}
  {{- range .headers }}
  {{- $h := dict }}
  {{- with .key }}{{ $_ := set $h "key" . }}{{ end }}
  {{- with .value }}{{ $_ := set $h "value" . }}{{ end }}
  {{- $hl = append $hl $h }}
  {{- end }}
  {{- $_ := set $c "headers" $hl }}
  {{- end }}
  {{- if not (kindIs "invalid" .insecure) }}{{ $_ := set $c "insecure" .insecure }}{{ end }}
  {{- with .name }}{{ $_ := set $c "name" . }}{{ end }}
  {{- $ol = append $ol $c }}
  {{- end }}
  {{- $_ := set $dc "otlpConfigurations" $ol }}
  {{- end }}
  {{- $_ := set $o "destinationsConfiguration" $dc }}
  {{- end }}
  {{- if not (kindIs "invalid" $ot.logs_configuration) }}
  {{- $l := dict }}
  {{- if not (kindIs "invalid" $ot.logs_configuration.destinations) }}{{ $_ := set $l "destinations" $ot.logs_configuration.destinations }}{{ end }}
  {{- $_ := set $o "logsConfiguration" $l }}
  {{- end }}
  {{- if not (kindIs "invalid" $ot.metrics_configuration) }}
  {{- $m := dict }}
  {{- if not (kindIs "invalid" $ot.metrics_configuration.destinations) }}{{ $_ := set $m "destinations" $ot.metrics_configuration.destinations }}{{ end }}
  {{- if not (kindIs "invalid" $ot.metrics_configuration.include_keda) }}{{ $_ := set $m "includeKeda" $ot.metrics_configuration.include_keda }}{{ end }}
  {{- $_ := set $o "metricsConfiguration" $m }}
  {{- end }}
  {{- if not (kindIs "invalid" $ot.traces_configuration) }}
  {{- $t := dict }}
  {{- if not (kindIs "invalid" $ot.traces_configuration.destinations) }}{{ $_ := set $t "destinations" $ot.traces_configuration.destinations }}{{ end }}
  {{- if not (kindIs "invalid" $ot.traces_configuration.include_dapr) }}{{ $_ := set $t "includeDapr" $ot.traces_configuration.include_dapr }}{{ end }}
  {{- $_ := set $o "tracesConfiguration" $t }}
  {{- end }}
  openTelemetryConfiguration:
    {{- if $o }}
    {{- toYaml $o | nindent 4 }}
    {{- else }} {}
    {{- end }}
  {{- end }}
  {{- with $pna }}
  publicNetworkAccess: {{ . | quote }}
  {{- end }}
{{- /* The child modules, each owned by the environment. */ -}}
{{- $envOwner := dict "armId" $envID }}
{{- range $k, $c := ($v.certificates | default dict) }}
{{- if not $c.name }}{{ fail (printf "avm-res-app-managedenvironment: certificates.%s needs a name" $k) }}{{ end }}
{{- if not $c.location }}{{ fail (printf "avm-res-app-managedenvironment: certificates.%s needs a location" $k) }}{{ end }}
{{- if include "cae.set" $c.password }}{{ fail (printf "avm-res-app-managedenvironment: certificates.%s: password is not supported: %s (docs/azure.md, \"Charts\")" $k (printf $secret "a certificate's password")) }}{{ end }}
{{- if include "cae.set" $c.value }}{{ fail (printf "avm-res-app-managedenvironment: certificates.%s: value is not supported: %s; reference a Key Vault secret (certificate_key_vault_properties) instead (docs/azure.md, \"Charts\")" $k (printf $secret "a certificate's blob")) }}{{ end }}
---
apiVersion: app.azure.hfl.dev/v20250101
kind: ManagedEnvironmentsCertificate
metadata:
  {{- include "aso.metadata" (dict "root" $ "name" (include "aso.name" (list $.Release.Name "cert" $k)) "id" (printf "certificate:%s" $k) "abandon" $abandon) | nindent 2 }}
spec:
  azureName: {{ $c.name | quote }}
  location: {{ $c.location | quote }}
  owner:
    {{- toYaml $envOwner | nindent 4 }}
  {{- with $c.certificate_key_vault_properties }}
  properties:
