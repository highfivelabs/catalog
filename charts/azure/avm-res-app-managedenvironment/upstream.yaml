# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set, or accepts only in part. Read by `task
# coverage`; `task coverage-verify` renders the chart to check that each one
# is refused. kind: gap (no Azure Service Operator or aso-extensions kind or
# field; the reason names the type when a kind is missing), not-ported (one
# exists, the chart does not map it yet) or by-design (Bundt replaces it).
refused:
  # The azapi provider's mechanics.
  - variable: ignore_body_changes
    kind: gap
    reason: "Azure Service Operator applies every property it is given and cannot leave a path to another writer (no ignore-changes)"
  - variable: resource_types
    kind: by-design
    reason: "ASO's and aso-extensions' kinds fix the API versions (aso-extensions' ManagedEnvironment 2025-10-02-preview; the children 2025-01-01, 2026-01-01, 2026-03-02-preview or 2026-07-01; RoleAssignment 2022-04-01, DiagnosticSetting 2021-05-01-preview)"
  - variable: retry
    kind: by-design
    reason: "Azure Service Operator retries every failed request itself, with backoff, until the resource is ready"
  - variable: timeouts
    kind: by-design
    reason: "Azure Service Operator has no per-request timeouts; Bundt sets a component's time limit"
  # A lookup in Azure at plan time.
  - variable: log_analytics_workspace
    kind: by-design
    reason: "the module reads the workspace's customer ID and primary shared key from Azure, which a render cannot (give app_logs_configuration.log_analytics_configuration.customer_id and shared_key, a reference to a Kubernetes Secret)"
  # Accepted in part.
  - variable: java_components
    kind: gap
    reason: "accepted for every component type (aso-extensions' ManagedEnvironmentsJavaComponent, ARM API version 2026-03-02-preview), but ingress is refused: the kind has no ingress in its spec (the module sends an empty object, whose one property, fqdn, is read-only)"
    partial: true
    fields: [ingress]
