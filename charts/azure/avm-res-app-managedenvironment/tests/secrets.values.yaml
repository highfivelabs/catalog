# The environment's secret inputs as references to Kubernetes Secrets in
# the component's namespace (docs/secrets.md), put there by External
# Secrets Operator: the Application Insights connection string, the Datadog
# API key, the Log Analytics shared key, the custom domain certificate's
# password and blob, Dapr's Application Insights connection string and
# instrumentation key, and in the children a certificate's password and
# blob, a Dapr component's secret and an Azure Files share's account key.
# No secret value is in the values; each top-level one's _version is
# required with it, as in the module, and does nothing.
name: cae-secrets
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
zone_redundant: false
app_insights_configuration: {}
connection_string: {secretName: cae-telemetry, key: appinsights-connection-string}
connection_string_version: 1
open_telemetry_configuration:
  destinations_configuration:
    data_dog_configuration: {site: datadoghq.com}
  metrics_configuration: {destinations: [dataDog]}
key: {secretName: cae-telemetry, key: datadog-api-key}
key_version: 1
app_logs_configuration:
  destination: log-analytics
  log_analytics_configuration: {customer_id: 00000000-0000-0000-0000-00000000000a, dynamic_json_columns: true}
shared_key: {secretName: cae-logs, key: shared-key}
shared_key_version: 1
custom_domain_configuration: {dns_suffix: apps.example.com}
certificate_password: {secretName: cae-domain, key: password}
certificate_password_version: 1
certificate_value: {secretName: cae-domain, key: pfx}
certificate_value_version: 1
dapr_ai_connection_string: {secretName: cae-dapr, key: connection-string}
dapr_ai_connection_string_version: 1
dapr_ai_instrumentation_key: {secretName: cae-dapr, key: instrumentation-key}
dapr_ai_instrumentation_key_version: 1
certificates:
  api:
    name: api-cert
    location: eastus2
    password: {secretName: cae-api-cert, key: password}
    password_version: 1
    value: {secretName: cae-api-cert, key: pfx}
    value_version: 1
dapr_components:
  state:
    name: statestore
    component_type: state.redis
    dapr_components_version: v1
    metadata:
      - {name: redisHost, value: "redis.example.com:6380"}
      - {name: redisPassword, secret_ref: redis-password}
    secrets:
      - name: redis-password
        value: {secretName: cae-redis, key: password}
    secrets_version: 1
storages:
  files:
    name: files
    account_key: {secretName: cae-storage, key: account-key}
    account_key_version: 1
    azure_file: {access_mode: ReadWrite, account_name: caestorage, share_name: share}
