# The environment's secret inputs as references to Kubernetes Secrets in
# the component's namespace (docs/secrets.md), put there by External
# Secrets Operator: the Application Insights connection string and the
# Datadog API key. No secret value is in the values; each one's _version
# is required with it, as in the module, and does nothing.
name: cae-secrets
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
zone_redundant: false
app_insights_configuration: {}
connection_string: {secretName: cae-telemetry, key: appinsights-connection-string}
connection_string_version: 1
open_telemetry_configuration:
  destinations_configuration:
    data_dog_configuration: {site: datadoghq.com}
  metrics_configuration: {destinations: [dataDog]}
key: {secretName: cae-telemetry, key: datadog-api-key}
key_version: 1
