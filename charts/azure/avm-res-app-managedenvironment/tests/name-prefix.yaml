#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every
# object this chart renders carries the namePrefix in its Azure name
# (spec.azureName, nameFields below), except the kinds listed here, each with
# the reason it cannot collide with another Instance's.
exempt:
  RoleAssignment: "its name is a GUID (a stable UUID ASO makes, or the entry's own), scoped to the environment"
  ManagementLock: "named inside the environment it locks, whose name carries the prefix (the module's lock-<kind>)"
  DiagnosticSetting: "named inside the environment it is on, whose name carries the prefix (the module's diag-<name>)"
  ManagedEnvironmentsCertificate: "named inside the environment, whose name carries the prefix"
  ManagedEnvironmentsDaprComponent: "named inside the environment, whose name carries the prefix (apps refer to it by this name)"
  ManagedEnvironmentsStorage: "named inside the environment, whose name carries the prefix (apps refer to it by this name)"
  ManagedEnvironmentsManagedCertificate: "named inside the environment, whose name carries the prefix"
  ManagedEnvironmentsJavaComponent: "named inside the environment, whose name carries the prefix"
  ManagedEnvironmentsHttpRouteConfig: "named inside the environment, whose name carries the prefix"
  ManagedEnvironmentsMaintenanceConfiguration: "named inside the environment, whose name carries the prefix (Azure takes only default)"
nameFields:
  ManagedEnvironment: azureName
