apiVersion: app.azure.hfl.dev/v20251002preview
kind: ManagedEnvironment
metadata:
  name: newer-cae
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "newer"
    app.kubernetes.io/name: avm-res-app-managedenvironment
    app.kubernetes.io/version: "0.5.0"
  annotations:
    hfl.dev/id: "managed_environment"
spec:
  azureName: "cae-newer"
  location: "eastus2"
  owner:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example"
  identity:
    type: UserAssigned
    userAssignedIdentities:
      - reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uai-cae"
  vnetConfiguration:
    infrastructureSubnetReference:
      armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet/subnets/cae
    internal: true
  workloadProfiles:
    - name: "Dedicated"
      workloadProfileType: "D4"
      minimumCount: 1
      maximumCount: 3
    - name: Consumption
      workloadProfileType: Consumption
  zoneRedundant: true
  appInsightsConfiguration: {}
  availabilityZones: ["1","2","3"]
  diskEncryptionConfiguration: {"keyVaultConfiguration":{"auth":{"identityReference":{"armId":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uai-cae"}},"keyUrl":"https://kv-example.vault.azure.net/keys/disk/0123456789abcdef0123456789abcdef"}}
  ingressConfiguration: {"headerCountLimit":120,"requestIdleTimeout":10,"terminationGracePeriodSeconds":600,"workloadProfileName":"Dedicated"}
  openTelemetryConfiguration:
    destinationsConfiguration:
      dataDogConfiguration:
        site: datadoghq.com
      otlpConfigurations:
      - endpoint: https://otel.example.com:4317
        headers:
        - key: x-tenant
          value: platform
        insecure: false
        name: collector
    logsConfiguration:
      destinations:
      - collector
    metricsConfiguration:
      destinations:
      - collector
      - dataDog
      includeKeda: true
    tracesConfiguration:
      destinations:
      - collector
      includeDapr: true
  publicNetworkAccess: "Disabled"
