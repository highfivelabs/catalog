metadata:
  name: secrets-cert-api
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "secrets"
    app.kubernetes.io/name: avm-res-app-managedenvironment
    app.kubernetes.io/version: "0.6.0"
  annotations:
    hfl.dev/id: "certificate:api"
spec:
  azureName: "api-cert"
  location: "eastus2"
  owner:
    armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.App/managedEnvironments/cae-secrets
  properties:
    password:
      key: password
      name: cae-api-cert
    value:
      key: pfx
      name: cae-api-cert
---
# Source: avm-res-app-managedenvironment/templates/main.yaml
apiVersion: app.azure.hfl.dev/v20250101
kind: ManagedEnvironmentsDaprComponent
metadata:
  name: secrets-dapr-state
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "secrets"
    app.kubernetes.io/name: avm-res-app-managedenvironment
    app.kubernetes.io/version: "0.6.0"
  annotations:
    hfl.dev/id: "dapr_component:state"
spec:
  azureName: "statestore"
  owner:
    armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.App/managedEnvironments/cae-secrets
  componentType: "state.redis"
  metadata:
    - name: "redisHost"
      value: "redis.example.com:6380"
    - name: "redisPassword"
      secretRef: "redis-password"
  secrets:
    - name: "redis-password"
      value: {"key":"password","name":"cae-redis"}
  version: "v1"
