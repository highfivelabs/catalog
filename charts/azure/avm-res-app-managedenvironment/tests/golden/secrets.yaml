---
# Source: avm-res-app-managedenvironment/templates/main.yaml
apiVersion: app.azure.hfl.dev/v20251002preview
kind: ManagedEnvironment
metadata:
  name: secrets-cae
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "secrets"
    app.kubernetes.io/name: avm-res-app-managedenvironment
    app.kubernetes.io/version: "0.6.0"
  annotations:
    hfl.dev/id: "managed_environment"
spec:
  azureName: "cae-secrets"
  location: "eastus2"
  owner:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example"
  appLogsConfiguration:
    destination: log-analytics
    logAnalyticsConfiguration:
      customerId: 00000000-0000-0000-0000-00000000000a
      dynamicJsonColumns: true
      sharedKey:
        key: shared-key
        name: cae-logs
  customDomainConfiguration:
    certificatePassword:
      key: password
      name: cae-domain
    certificateValue:
      key: pfx
      name: cae-domain
    dnsSuffix: apps.example.com
  daprAIConnectionString: {"key":"connection-string","name":"cae-dapr"}
  daprAIInstrumentationKey: {"key":"instrumentation-key","name":"cae-dapr"}
  zoneRedundant: false
  appInsightsConfiguration:
    connectionString: {"key":"appinsights-connection-string","name":"cae-telemetry"}
  openTelemetryConfiguration:
    destinationsConfiguration:
      dataDogConfiguration:
        key:
          key: datadog-api-key
          name: cae-telemetry
        site: datadoghq.com
    metricsConfiguration:
      destinations:
      - dataDog
---
# Source: avm-res-app-managedenvironment/templates/main.yaml
apiVersion: app.azure.hfl.dev/v20250101
