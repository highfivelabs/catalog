apiVersion: app.azure.hfl.dev/v20260101
kind: ManagedEnvironmentsStorage
metadata:
  name: secrets-storage-files
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "secrets"
    app.kubernetes.io/name: avm-res-app-managedenvironment
    app.kubernetes.io/version: "0.6.0"
