# The deprecated secret inputs, as references to Kubernetes Secrets
# (docs/secrets.md), folded in as the module's effective_* locals fold
# them: the Log Analytics customer ID and primary shared key, the custom
# domain certificate's password and blob, and Dapr's Application Insights
# connection string.
name: cae-secrets-deprecated
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
zone_redundant: false
log_analytics_workspace_customer_id: 00000000-0000-0000-0000-00000000000a
log_analytics_workspace_primary_shared_key: {secretName: cae-logs, key: shared-key}
custom_domain_dns_suffix: apps.example.com
custom_domain_certificate_password: {secretName: cae-domain, key: password}
custom_domain_certificate_value: {secretName: cae-domain, key: pfx}
dapr_application_insights_connection_string: {secretName: cae-dapr, key: connection-string}
