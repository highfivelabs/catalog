# For an apply against the fake cloud: the fields after ASO's
# ManagedEnvironment API version 2025-01-01, so aso-extensions'
# ManagedEnvironment (app.azure.hfl.dev/v20251002preview) (the chart's only kind),
# with a Dapr component and a storage owned by its ARM ID, and a lock; its
# Application Insights connection string, Datadog key, Log Analytics shared
# key, custom domain certificate's password and blob, and Dapr's
# Application Insights connection string and instrumentation key are
# references to a Secret the harness makes before the apply with random values
# (hack/test-secret.sh; nothing committed), as the line below asks:
# secret: catalog-cae-telemetry random
name: catalog-cae-newer
location: eastus2
resource_group_name: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg
zone_redundant: false
tags: {catalog: mock}
app_logs_configuration:
  destination: log-analytics
  log_analytics_configuration: {customer_id: 00000000-0000-0000-0000-0000000000aa}
shared_key: {secretName: catalog-cae-telemetry, key: value}
shared_key_version: 1
custom_domain_configuration: {dns_suffix: apps.catalog.example}
certificate_password: {secretName: catalog-cae-telemetry, key: value}
certificate_password_version: 1
certificate_value: {secretName: catalog-cae-telemetry, key: value}
certificate_value_version: 1
dapr_ai_connection_string: {secretName: catalog-cae-telemetry, key: value}
dapr_ai_connection_string_version: 1
dapr_ai_instrumentation_key: {secretName: catalog-cae-telemetry, key: value}
dapr_ai_instrumentation_key_version: 1
workload_profiles:
  - {name: Consumption, workload_profile_type: Consumption}
app_insights_configuration: {}
connection_string: {secretName: catalog-cae-telemetry, key: value}
connection_string_version: 1
availability_zones: ["1", "2", "3"]
ingress_configuration: {header_count_limit: 120, request_idle_timeout: 10, termination_grace_period_seconds: 600, workload_profile_name: Consumption}
open_telemetry_configuration:
  destinations_configuration:
    otlp_configurations:
      - {name: collector, endpoint: "https://otel.example.com:4317", insecure: false}
  traces_configuration: {destinations: [collector], include_dapr: true}
key: {secretName: catalog-cae-telemetry, key: value}
key_version: 1
public_network_access: Enabled
dapr_components:
  state:
    name: statestore
    component_type: state.azure.blobstorage
    dapr_components_version: v1
    metadata:
      - {name: accountName, value: catalogst}
storages:
  nfs:
    name: nfs
    nfs_azure_file: {access_mode: ReadWrite, server: catalogst.file.core.windows.net, share_name: /catalogst/nfs}
lock: {kind: CanNotDelete}
