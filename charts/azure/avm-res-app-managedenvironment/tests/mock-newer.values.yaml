# For an apply against the fake cloud: the fields after ASO's
# ManagedEnvironment API version 2025-01-01, so aso-extensions'
# ManagedEnvironment (app.azure.hfl.dev/v20251002preview) in place of ASO's,
# with a Dapr component and a storage owned by its ARM ID, and a lock.
name: catalog-cae-newer
location: eastus2
resource_group_name: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg
zone_redundant: false
tags: {catalog: mock}
app_logs_configuration: {destination: azure-monitor}
workload_profiles:
  - {name: Consumption, workload_profile_type: Consumption}
app_insights_configuration: {}
availability_zones: ["1", "2", "3"]
ingress_configuration: {header_count_limit: 120, request_idle_timeout: 10, termination_grace_period_seconds: 600, workload_profile_name: Consumption}
open_telemetry_configuration:
  destinations_configuration:
    otlp_configurations:
      - {name: collector, endpoint: "https://otel.example.com:4317", insecure: false}
  traces_configuration: {destinations: [collector], include_dapr: true}
public_network_access: Enabled
dapr_components:
  state:
    name: statestore
    component_type: state.azure.blobstorage
    dapr_components_version: v1
    metadata:
      - {name: accountName, value: catalogst}
storages:
  nfs:
    name: nfs
    nfs_azure_file: {access_mode: ReadWrite, server: catalogst.file.core.windows.net, share_name: /catalogst/nfs}
lock: {kind: CanNotDelete}
