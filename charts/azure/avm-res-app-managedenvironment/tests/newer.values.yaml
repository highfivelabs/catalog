# The fields after ASO's ManagedEnvironment API version 2025-01-01: the
# chart renders aso-extensions' ManagedEnvironment
# (app.azure.hfl.dev/v20251002preview) and owns every child, the lock, the
# role assignment and the diagnostic setting by the environment's ARM ID.
name: cae-newer
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
zone_redundant: true
managed_identities:
  user_assigned_resource_ids:
    - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uai-cae
vnet_configuration:
  infrastructure_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet/subnets/cae
  internal: true
workload_profiles:
  - {name: Dedicated, workload_profile_type: D4, minimum_count: 1, maximum_count: 3}
app_insights_configuration: {}
availability_zones: ["1", "2", "3"]
disk_encryption_configuration:
  key_vault_configuration:
    auth:
      identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uai-cae
    key_url: https://kv-example.vault.azure.net/keys/disk/0123456789abcdef0123456789abcdef
ingress_configuration:
  header_count_limit: 120
  request_idle_timeout: 10
  termination_grace_period_seconds: 600
  workload_profile_name: Dedicated
open_telemetry_configuration:
  destinations_configuration:
    data_dog_configuration: {site: datadoghq.com}
    otlp_configurations:
      - name: collector
        endpoint: https://otel.example.com:4317
        insecure: false
        headers:
          - {key: x-tenant, value: platform}
  logs_configuration: {destinations: [collector]}
  metrics_configuration: {destinations: [collector, dataDog], include_keda: true}
  traces_configuration: {destinations: [collector], include_dapr: true}
public_network_access_enabled: false
dapr_components:
  state:
    name: statestore
    component_type: state.azure.blobstorage
    dapr_components_version: v1
lock: {kind: CanNotDelete}
role_assignments:
  reader:
    role_definition_id_or_name: Reader
    principal_id: 11111111-1111-1111-1111-111111111111
diagnostic_settings:
  logs:
    name: diag-logs
    workspace_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.OperationalInsights/workspaces/law
