#
# Values mirror the Terraform variables of the Azure Verified Module
# avm-res-web-serverfarm (v2.0.8): same names, types and defaults, so a
# module block's arguments become this file one to one.
# values.schema.json carries the types and the module's validations.
#
# Descriptions quoted from terraform-azurerm-avm-res-web-serverfarm
# (variables.tf, v2.0.8), Copyright (c) Microsoft Corporation, MIT.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables, except tags.
#
# The App Service plan's name in full, {serverFarm}. A name set here takes
# no prefix; one not set is name, with the namePrefix in front.
names: {}
# An optional convenience: "<namePrefix>-" in front of the plan's name
# (never one set under names). Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. ASO never copies them to Azure (Azure
# tags are tags).
labels: {}
# DELETE (the default) or ABANDON, which keeps the plan in Azure when the
# component is deleted (ASO's reconcile-policy detach-on-delete). PREVENT
# is refused: use lock. Not a module variable.
deletion_policy: null

# Optional: The ID of the App Service Environment.
app_service_environment_id: null
# Optional: Whether asynchronous scaling is enabled for the App Service
# Plan.
async_scaling_enabled: null
# A map of diagnostic settings to create on the plan. Each: {name
# (required by Azure), logs: [{category, category_group, enabled (true),
# retention_policy: {days (0), enabled (false)}}], metrics: [{category,
# enabled (true), retention_policy}], log_analytics_destination_type
# ("Dedicated"), workspace_resource_id, storage_account_resource_id,
# event_hub_authorization_rule_resource_id, event_hub_name,
# marketplace_partner_resource_id}.
diagnostic_settings: {}
# This variable controls whether or not telemetry is enabled for the
# module. Accepted; the chart never sends telemetry.
enable_telemetry: true
# Optional: A list of install scripts to run on the Managed Instance App
# Service Plan. Only applicable when os_type is WindowsManagedInstance.
# Each: {name, source: {type ("RemoteAzureBlob"), source_uri}}.
install_scripts: null
# The location where the resources will be deployed.
location: ""
# Controls the Resource Lock configuration for this resource.
# {kind (CanNotDelete or ReadOnly), name (default lock-<kind>)}
lock: null
# Controls the managed identity configuration on this resource.
# {system_assigned (false), user_assigned_resource_ids ([])}
managed_identities: {}
# The maximum number of total workers allowed for this ElasticScaleEnabled
# App Service Plan (EP, WS and FC SKUs; other SKUs send worker_count).
maximum_elastic_worker_count: 3
# The name of the this resource.
name: ""
# The operating system type of the service plan: Windows, Linux,
# WindowsContainer or WindowsManagedInstance.
os_type: ""
# The resource ID of the resource group in which to create this resource.
parent_id: ""
# Should per site scaling be enabled for this App Service Plan.
per_site_scaling_enabled: false
# Optional: The default identity configuration for the Managed Instance
# App Service Plan. {identity_type ("UserAssigned"),
# user_assigned_identity_resource_id}
plan_default_identity: null
# Defaults to false. Should elastic scale be enabled for this App Service
# Plan. Only set to true if deploying a Premium or Elastic Premium SKU.
premium_plan_auto_scale_enabled: false
# Optional: Whether RDP is enabled for the Managed Instance App Service
# Plan. Only applicable when os_type is WindowsManagedInstance.
rdp_enabled: null
# Optional: A list of registry adapters associated with this App Service
# Plan (WindowsManagedInstance only). Each: {registry_key, type (DWORD or
# String), key_vault_secret_reference: {secret_uri}}. The secret's URI, not
# its value: the plan reads it with its identity.
registry_adapters: null
# The retry configuration for azapi resources. Refused when set: ASO
# retries itself.
retry: null
# A map of role assignments to create on the resource. Each:
# {role_definition_id_or_name, principal_id, description,
# skip_service_principal_aad_check (no effect, as in the module), condition,
# condition_version, delegated_managed_identity_resource_id,
# principal_type}.
role_assignments: {}
# The resource type for the server farm. Accepted at its default only: the
# API version is the ASO kind's (2025-05-01).
server_farm_resource_type: Microsoft.Web/serverfarms@2025-03-01
# The SKU name of the service plan. Defaults to P1v2.
sku_name: P1v2
# Optional: A list of storage mounts to configure on the App Service Plan
# (WindowsManagedInstance only). Each: {name, type ("LocalStorage"), source
# (""), destination_path, credentials_key_vault_reference: {secret_uri}}.
storage_mounts: null
# Tags of the resource.
tags: null
# The timeout configuration for azapi resources. Refused when set: ASO has
# none; Bundt sets a component's time limit.
timeouts: null
# Optional: The resource ID of the subnet to integrate the App Service Plan
# with.
virtual_network_subnet_id: null
# The number of workers to allocate for this App Service Plan. Defaults to
# 3. Set to null when worker count is managed by an external autoscale
# setting.
worker_count: 3
# Should zone balancing be enabled for this App Service Plan? Defaults to
# true.
zone_balancing_enabled: true
