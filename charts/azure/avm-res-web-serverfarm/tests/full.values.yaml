# Every variable: a Windows Managed Instance plan with install scripts,
# storage mounts, registry adapters, a plan default identity and RDP, in an
# App Service Environment with VNet integration, identities, lock, role
# assignments and diagnostic settings.
name: asp-full
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full
os_type: WindowsManagedInstance
sku_name: P1v3
worker_count: 2
zone_balancing_enabled: false
per_site_scaling_enabled: true
async_scaling_enabled: false
enable_telemetry: false
deletion_policy: ABANDON
labels: {team: web}
tags: {env: test}
app_service_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Web/hostingEnvironments/ase
virtual_network_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.Network/virtualNetworks/vnet/subnets/snet-apps
server_farm_resource_type: Microsoft.Web/serverfarms@2025-03-01
managed_identities:
  system_assigned: true
  user_assigned_resource_ids: [/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uai]
plan_default_identity:
  user_assigned_identity_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uai
rdp_enabled: true
install_scripts:
  - name: FontInstaller
    source: {source_uri: "https://st.blob.core.windows.net/scripts/fonts.zip"}
storage_mounts:
  - {name: g-drive, destination_path: "G:\\"}
  - name: share
    type: AzureFiles
    source: "https://st.file.core.windows.net/share"
    destination_path: "H:\\"
    credentials_key_vault_reference: {secret_uri: "https://kv.vault.azure.net/secrets/share-key"}
registry_adapters:
  - registry_key: HKEY_LOCAL_MACHINE/SOFTWARE/MyApp/Port
    type: DWORD
    key_vault_secret_reference: {secret_uri: "https://kv.vault.azure.net/secrets/port"}
  - registry_key: HKEY_LOCAL_MACHINE/SOFTWARE/MyApp/Name
    type: String
    key_vault_secret_reference: {secret_uri: "https://kv.vault.azure.net/secrets/name"}
lock: {kind: CanNotDelete, name: no-delete}
role_assignments:
  reader:
    role_definition_id_or_name: Reader
    principal_id: 11111111-1111-1111-1111-111111111111
    principal_type: ServicePrincipal
  owner:
    role_definition_id_or_name: /providers/Microsoft.Authorization/roleDefinitions/8e3af657-a8ff-443c-a75c-2fe8c4bcb635
    principal_id: 22222222-2222-2222-2222-222222222222
    description: owners
diagnostic_settings:
  law:
    name: diag-law
    workspace_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-full/providers/Microsoft.OperationalInsights/workspaces/law
    metrics: [{category: AllMetrics}]
