#
# The Bundt Package for this chart. Outputs are the module's declared
# outputs, selected from the live objects (resources.<id>): the plan's name
# and resource ID.
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: azure-avm-res-web-serverfarm
spec:
  version: 0.1.0
  engine: helm
  providers: [aso]
  outputs:
    name: resources.server_farm.spec.azureName
    resource_id: resources.server_farm.status.id
