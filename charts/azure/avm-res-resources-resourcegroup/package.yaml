#
# The Bundt Package for this chart. Outputs are the module's declared
# outputs, selected from the live objects (resources.<id>) and the
# component's values (inputs): name and location are computed from inputs
# as the module sets them, resource_id is the group's ARM ID from ASO's
# status. The module's resource output (the whole azapi object) is not an
# output (docs/design.md, "Outputs").
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: azure-avm-res-resources-resourcegroup
spec:
  version: 0.1.0
  engine: helm
  providers: [aso]
  outputs:
    name: >-
      ('resourceGroup' in inputs.names && inputs.names.resourceGroup != '' ? inputs.names.resourceGroup : (inputs.namePrefix != '' ? inputs.namePrefix + '-' : '') + inputs.name)
    location: inputs.location
    resource_id: resources.resource_group.status.id
