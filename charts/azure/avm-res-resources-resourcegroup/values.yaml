#
# Values mirror the Terraform variables of the Azure Verified Module
# avm-res-resources-resourcegroup (v0.5.0): same names, types and defaults,
# so a module block's arguments become this file one to one.
# values.schema.json carries the types and the module's validations.
#
# Descriptions quoted from terraform-azurerm-avm-res-resources-resourcegroup
# (variables.tf, v0.5.0), Copyright (c) Microsoft Corporation, MIT.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables, except tags: Bundt supplies names from a team's
# naming convention and stamps its identity labels; the chart takes them
# and computes none.
#
# The resource group's name in full, {resourceGroup}. A name set here takes
# no prefix; one not set is name, with the namePrefix in front.
names: {}
# An optional convenience: "<namePrefix>-" in front of the group's name
# (never one set under names). Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. ASO never copies them to Azure (Azure
# tags are tags).
labels: {}
# DELETE (the default) or ABANDON, which keeps the group, its lock and its
# role assignments in Azure when the component is deleted (ASO's
# reconcile-policy detach-on-delete). PREVENT is refused: use lock. Not a
# module variable.
deletion_policy: null

# This variable controls whether or not telemetry is enabled for the
# module. Accepted; the chart never sends telemetry (no deployment is made).
enable_telemetry: true
# (Optional) Whether to ignore changes to `tags` after resource group
# creation. Refused when true: ASO applies every tag it is given.
ignore_tag_changes: false
# Required. The Azure region for deployment of the this resource.
location: ""
# Controls the Resource Lock configuration for this resource.
# {kind (CanNotDelete or ReadOnly), name (default lock-<kind>)}
lock: null
# (Optional) The ID of the resource or application that manages this
# resource group.
managed_by: null
# Required. The name of the this resource.
name: ""
# The retry configuration applied to the underlying azapi_resource
# resources. Refused when set: ASO retries itself.
# {error_message_regex, interval_seconds, max_interval_seconds}
retry: {}
# Optional. A map of role assignments to create on this resource.
# Each: {name, role_definition_id_or_name, principal_id, description,
# skip_service_principal_aad_check, condition, condition_version,
# delegated_managed_identity_resource_id, principal_type}.
role_assignments: {}
# (Optional) Tags of the resource. Azure tags on the group.
tags: null
# The timeouts applied to the underlying azapi_resource resources. Refused
# when set: ASO has none; Bundt sets a component's time limit.
# {create, delete, read, update}
timeouts: {}
