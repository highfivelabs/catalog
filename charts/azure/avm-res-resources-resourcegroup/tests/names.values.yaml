# Whole names from a naming convention: names.resourceGroup is used as
# given; the namePrefix goes on no name set in full. labels stay in
# Kubernetes; tags reach Azure.
name: platform
location: eastus2
namePrefix: shop-dev
names: {resourceGroup: rg-shop-dev-eus2-platform}
labels:
  hfl.dev/team: shop
tags:
  team: shop
lock:
  kind: ReadOnly
  name: freeze
