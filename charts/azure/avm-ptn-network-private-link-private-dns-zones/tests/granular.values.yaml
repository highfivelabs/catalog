# The module's virtual_network_link_granular_overrides example, on two of
# its zones: links by zone and network, overrides by zone and network, one
# disabled.
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
private_link_private_dns_zones:
  azure_container_apps: {zone_name: "privatelink.{regionName}.azurecontainerapps.io"}
  azure_ml: {zone_name: "privatelink.api.azureml.ms"}
  azure_backup: {zone_name: "privatelink.{regionCode}.backup.windowsazure.com"}
virtual_network_link_by_zone_and_virtual_network:
  azure_container_apps:
    vnet1: {virtual_network_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet4, name: vnet4-link-aca-override-vnet1, resolution_policy: Default}
    vnet3: {virtual_network_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet3, name: vnet3-link-aca}
  azure_ml:
    vnet3: {virtual_network_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet3, name: this-will-be-overridden-by-override-block, resolution_policy: Default}
    vnet4: {virtual_network_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet4, resolution_policy: NxDomainRedirect}
virtual_network_link_default_virtual_networks:
  vnet1: {virtual_network_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet1, virtual_network_link_name_template_override: vnet1-link, resolution_policy: Default}
  vnet2: {virtual_network_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet2, virtual_network_link_name_template_override: "${vnet_key}-link", resolution_policy: NxDomainRedirect}
virtual_network_link_overrides_by_zone_and_virtual_network:
  azure_container_apps:
    vnet1: {resolution_policy: NxDomainRedirect}
    vnet2: {name: custom-vnet2-link-name-aca, resolution_policy: Default}
  azure_ml:
    vnet1: {name: custom-vnet1-link-name-aml, resolution_policy: Default, enabled: true}
    vnet2: {enabled: false}
    vnet3: {name: custom-vnet3-link-name-aml, resolution_policy: NxDomainRedirect}
