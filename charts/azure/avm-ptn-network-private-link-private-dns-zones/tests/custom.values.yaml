# The module's custom-zones example: four zones that do not support
# Private Link (so no link carries a resolution policy), tags, two
# networks with the default link names.
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
private_link_private_dns_zones:
  custom_zone_1: {zone_name: custom-example-1.int, private_dns_zone_supports_private_link: false}
  custom_zone_2: {zone_name: custom-example-2.local, private_dns_zone_supports_private_link: false}
  custom_zone_3: {zone_name: "custom-example-3-{regionName}.local", private_dns_zone_supports_private_link: false}
  custom_zone_4: {zone_name: "custom-example-4-{regionCode}.local", private_dns_zone_supports_private_link: false}
tags: {env: example, example-tag-key: example tag value}
virtual_network_link_default_virtual_networks:
  vnet1: {virtual_network_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet1, resolution_policy: Default}
  vnet2: {virtual_network_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet2, resolution_policy: NxDomainRedirect}
