# The module's virtual_network_link_wide_overrides example, on two of its
# zones: additional networks, overrides by network (one disabled) and by
# zone, a NxDomainRedirect default.
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
private_link_private_dns_zones:
  azure_container_apps: {zone_name: "privatelink.{regionName}.azurecontainerapps.io"}
  azure_ml: {zone_name: "privatelink.api.azureml.ms"}
virtual_network_link_additional_virtual_networks:
  vnet5: {virtual_network_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet5, virtual_network_link_name_template_override: "additional-${vnet_key}-link", resolution_policy: Default}
virtual_network_link_default_virtual_networks:
  vnet1: {virtual_network_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet1, virtual_network_link_name_template_override: "${vnet_key}-link", resolution_policy: Default}
  vnet2: {virtual_network_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet2, virtual_network_link_name_template_override: "${vnet_key}-link", resolution_policy: NxDomainRedirect}
  vnet3: {virtual_network_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet3, virtual_network_link_name_template_override: "${vnet_key}-link", resolution_policy: Default}
  vnet4: {virtual_network_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet4, virtual_network_link_name_template_override: "${vnet_key}-link"}
virtual_network_link_overrides_by_virtual_network:
  vnet1: {virtual_network_link_name_template_override: "overridden-by-vnet-${vnet_key}-link", resolution_policy: NxDomainRedirect}
  vnet2: {virtual_network_link_name_template_override: "overridden-by-vnet-${vnet_key}-link", resolution_policy: Default}
  vnet3: {enabled: false}
  vnet4: {virtual_network_link_name_template_override: "overridden-by-vnet-${vnet_key}-link"}
virtual_network_link_overrides_by_zone:
  azure_container_apps: {virtual_network_link_name_template_override: "overridden-by-zone-${vnet_key}-link", resolution_policy: Default}
virtual_network_link_resolution_policy_default: NxDomainRedirect
