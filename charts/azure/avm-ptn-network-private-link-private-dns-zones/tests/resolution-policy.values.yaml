# The module's resolution_policy example: a zone's own policy, and two
# networks linked to every zone, one named by a template.
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
private_link_private_dns_zones:
  azure_container_apps: {zone_name: "privatelink.{regionName}.azurecontainerapps.io", private_dns_zone_supports_private_link: true, resolution_policy: NxDomainRedirect}
  azure_ml: {zone_name: "privatelink.api.azureml.ms", private_dns_zone_supports_private_link: true}
  azure_ml_notebooks: {zone_name: "privatelink.notebooks.azure.net", private_dns_zone_supports_private_link: true, resolution_policy: NxDomainRedirect}
virtual_network_link_default_virtual_networks:
  vnet1: {virtual_network_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet1, virtual_network_link_name_template_override: vnet1-link}
  vnet2: {virtual_network_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet2, virtual_network_link_name_template_override: "${vnet_key}-link"}
