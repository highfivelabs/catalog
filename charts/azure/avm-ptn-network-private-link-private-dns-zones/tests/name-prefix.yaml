#
# The namePrefix convention (docs/design.md, "Names, labels and tags"). A
# private DNS zone's Azure name is the domain Private Link resolves in, and
# a prefix would serve another domain; every other object is named inside
# its zone or the resource group. So no object here takes the namePrefix,
# each kind with the reason.
noCloudNames: "a Private Link zone's name is the domain Azure's Private Link resolves in (the module's list), which a prefix would change; zones of one name in two resource groups do not collide. Links are named inside their zone, the lock and role assignments inside the resource group"
exempt:
  PrivateDnsZone: "its name is the domain Private Link resolves in, which a prefix would change"
  PrivateDnsZonesVirtualNetworkLink: "named inside its zone, from the module's name template"
  RoleAssignment: "its name is a GUID (a stable UUID ASO makes), scoped to the resource group"
  ManagementLock: "named inside the resource group it locks (the module's lock-<resource group name>)"
