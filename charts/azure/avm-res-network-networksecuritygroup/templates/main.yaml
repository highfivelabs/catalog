azapi_resource.this (Microsoft.Network/networkSecurityGroups): one ASO
NetworkSecurityGroup, owned by the resource group parent_id names. The
module sends flushConnection and securityRules only as placeholders it
always ignores; ASO's kind has no securityRules (the rules are their own
objects, templates/rules.yaml) and the chart leaves flushConnection to
Azure, as the module does. azapi_resource.lock: an aso-extensions
ManagementLock, with the module's notes. azapi_resource.role_assignments:
one ASO RoleAssignment each. azapi_resource.diagnostic_settings: one ASO
DiagnosticSetting each, with no metrics (a network security group emits
none) and Dedicated sent as null, as the module sends them. The
telemetry, and the time_sleep that waits for a deleted lock, are not
ported.
*/ -}}
