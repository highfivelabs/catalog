# The module README's default example: a group with one inbound rule.
name: nsg-example
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
security_rules:
  https:
    name: allow-https
    access: Allow
    direction: Inbound
    priority: 100
    protocol: Tcp
    source_address_prefix: "*"
    source_port_range: "*"
    destination_address_prefix: "*"
    destination_port_range: "443"
