# Every input the chart carries: tags, a lock with its default notes, role
# assignments (by name, by ID, and one skipping the Entra check),
# diagnostic settings (to a workspace, and to storage with categories and
# AzureDiagnostics), and rules with prefixes, port lists and application
# security groups.
name: nsg-apps
location: westeurope
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-net
enable_telemetry: false
tags: {environment: prod}
lock: {kind: CanNotDelete}
role_assignments:
  netops:
    role_definition_id_or_name: Network Contributor
    principal_id: 4179302c-702e-4de7-a061-beacd0a1be09
    principal_type: Group
  deployer:
    role_definition_id_or_name: /providers/Microsoft.Authorization/roleDefinitions/4d97b98b-1d4f-4787-a291-c67834d212e7
    principal_id: 7d3c1f0e-2b4a-4c6d-8e9f-1a2b3c4d5e6f
    skip_service_principal_aad_check: true
    description: pipeline
diagnostic_settings:
  law:
    workspace_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-ops/providers/Microsoft.OperationalInsights/workspaces/law
  archive:
    name: to-storage
    log_groups: []
    log_categories: [NetworkSecurityGroupEvent, NetworkSecurityGroupRuleCounter]
    metric_categories: [AllMetrics]
    log_analytics_destination_type: AzureDiagnostics
    storage_account_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-ops/providers/Microsoft.Storage/storageAccounts/stdiag
security_rules:
  web:
    name: allow-web
    description: HTTP and HTTPS from the load balancer subnets
    access: Allow
    direction: Inbound
    priority: 200
    protocol: Tcp
    source_address_prefixes: [10.0.2.0/24, 10.0.1.0/24]
    source_port_range: "*"
    destination_application_security_group_ids:
      - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-net/providers/Microsoft.Network/applicationSecurityGroups/asg-web
    destination_port_ranges: ["443", "80"]
  db:
    name: allow-db
    access: Allow
    direction: Inbound
    priority: 210
    protocol: "*"
    source_application_security_group_ids:
      - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-net/providers/Microsoft.Network/applicationSecurityGroups/asg-web
    source_port_ranges: ["1024-65535"]
    destination_address_prefixes: [10.0.3.0/24]
    destination_port_range: "5432"
  deny-out:
    name: deny-internet
    access: Deny
    direction: Outbound
    priority: 4096
    protocol: "*"
    source_address_prefix: VirtualNetwork
    source_port_range: "*"
    destination_address_prefix: Internet
    destination_port_range: "*"
