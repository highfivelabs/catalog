# For an apply against the fake cloud (docs/azure.md, "8. Charts"): a
# group with an inbound and an outbound rule in the fake cloud's resource
# group.
name: catalog-nsg
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg
tags: {catalog: mock}
security_rules:
  ssh: {name: allow-ssh, access: Allow, direction: Inbound, priority: 100, protocol: Tcp, source_address_prefix: 10.0.0.0/8, source_port_range: "*", destination_address_prefix: "*", destination_port_range: "22"}
  out: {name: deny-out, access: Deny, direction: Outbound, priority: 4000, protocol: "*", source_address_prefix: "*", source_port_range: "*", destination_address_prefix: Internet, destination_port_range: "*"}
