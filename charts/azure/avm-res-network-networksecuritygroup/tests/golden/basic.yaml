# Source: avm-res-network-networksecuritygroup/templates/rules.yaml
apiVersion: network.azure.com/v20250301
kind: NetworkSecurityGroupsSecurityRule
metadata:
  name: basic-rule-https
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: avm-res-network-networksecuritygroup
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "security_rule:https"
spec:
  azureName: "allow-https"
  owner:
    name: basic-nsg
  access: Allow
  direction: Inbound
  priority: 100
  protocol: "Tcp"
  sourceAddressPrefix: "*"
  sourcePortRange: "*"
  destinationAddressPrefix: "*"
  destinationPortRange: "443"
