#
# Values mirror the Terraform variables of the Azure Verified Module
# avm-res-network-routetable (v0.6.0): same names, types and defaults, so a
# module block's arguments become this file one to one.
# values.schema.json carries the types and the module's validations.
#
# Descriptions quoted from terraform-azurerm-avm-res-network-routetable
# (variables.tf, v0.6.0), Copyright (c) Microsoft Corporation, MIT.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables, except tags.
#
# The route table's name in full, {routeTable}. A name set here takes no
# prefix; one not set is name, with the namePrefix in front. Routes are
# named by their entries.
names: {}
# An optional convenience: "<namePrefix>-" in front of the table's name
# (never one set under names). Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. ASO never copies them to Azure (Azure
# tags are tags).
labels: {}
# DELETE (the default) or ABANDON, which keeps every resource in Azure when
# the component is deleted (ASO's reconcile-policy detach-on-delete).
# PREVENT is refused: use lock. Not a module variable.
deletion_policy: null
# The subscription of resource_group_name. Not a module variable: the
# module's azurerm provider knows its subscription; ASO's owner is an
# Azure resource ID. Not needed when resource_group_name is a resource
# group's ID (/subscriptions/<id>/resourceGroups/<name>).
subscription_id: ""

# (Optional) Boolean flag which controls propagation of routes learned by
# BGP on that route table. Defaults to true.
bgp_route_propagation_enabled: true
# This variable controls whether or not telemetry is enabled for the
# module. Accepted; the chart never sends telemetry.
enable_telemetry: true
# (Required) Specifies the supported Azure location for the resource to be
# deployed.
location: ""
# (Optional) Controls the Resource Lock configuration for this resource.
# {kind (CanNotDelete or ReadOnly), name (default lock-<kind>)}
lock: null
# (Required) Specifies the name of the Route Table.
name: null
# (Required) The name of the resource group in which to create the
# resource (or its ID).
resource_group_name: ""
# (Optional) A map of role assignments to create on this resource.
# Each: {role_definition_id_or_name, principal_id, description,
# skip_service_principal_aad_check, condition, condition_version,
# delegated_managed_identity_resource_id, principal_type}.
role_assignments: {}
# (Optional) A map of route objects to create on the route table.
# Each: {name, address_prefix, next_hop_type (VirtualNetworkGateway,
# VnetLocal, Internet, VirtualAppliance or None), next_hop_in_ip_address
# (only with VirtualAppliance)}.
routes: {}
# (Optional) When set to true, the module will use the legacy mode for
# managing routes (azurerm_route instead of its route submodule). Both are
# the same Azure route; here it changes only the routes output's keys (the
# routes' names, as the module's legacy output).
routes_legacy_mode: false
# (Optional) A map of string subnet IDs to associate the route table to.
# Refused when set: set the subnet's route_table in
# avm-res-network-virtualnetwork.
subnet_resource_ids: {}
# (Optional) Tags of the resource.
tags: null
