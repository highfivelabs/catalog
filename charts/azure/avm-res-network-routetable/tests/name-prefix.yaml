#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every
# object this chart renders carries the namePrefix in its Azure name
# (spec.azureName, nameFields below), except the kinds listed here, each with
# the reason it cannot collide with another Instance's.
exempt:
  RouteTablesRoute: "named inside its table, whose name carries the prefix, by the entry's name, as the module names it"
  RoleAssignment: "its name is a GUID (a stable UUID ASO makes), scoped to the table"
  ManagementLock: "named inside the table it locks, whose name carries the prefix (the module's lock-<kind>)"
nameFields:
  RouteTable: azureName
