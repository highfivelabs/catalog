# Whole names from a naming convention: names.routeTable is used as given;
# the namePrefix goes on no name set in full. labels stay in Kubernetes;
# tags reach Azure. Legacy mode changes only the routes output.
name: apps
location: eastus2
resource_group_name: rg-shop-dev
subscription_id: 00000000-0000-0000-0000-000000000000
namePrefix: shop-dev
names: {routeTable: rt-shop-dev-eus2}
labels: {hfl.dev/team: shop}
tags: {team: shop}
routes_legacy_mode: true
lock: {kind: CanNotDelete, name: keep}
routes:
  a: {name: local, address_prefix: 10.10.0.0/16, next_hop_type: VnetLocal}
