# Whole names from a naming convention: names.privateEndpoint is used as
# given, as is names.networkInterface, so no name takes the namePrefix. labels stay in
# Kubernetes; tags reach Azure.
name: kv
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
namePrefix: shop-dev
names: {privateEndpoint: pe-kv-shop-dev, networkInterface: nic-kv-shop-dev}
network_interface_name: nic-kv
labels: {hfl.dev/team: shop}
tags: {team: shop}
private_connection_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.KeyVault/vaults/kv-example
subnet_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet/subnets/snet-pe
subresource_names: [vault]
