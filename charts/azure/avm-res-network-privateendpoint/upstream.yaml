# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set, or accepts only in part. Read by `task
# coverage`; `task coverage-verify` renders the chart to check that each one
# is refused. kind: gap (no Azure Service Operator or aso-extensions kind or
# field), not-ported (one exists, the chart does not map it yet) or
# by-design (Bundt replaces it).
refused:
  - variable: ignore_body_changes
    kind: gap
    reason: "Azure Service Operator applies every property it is given and cannot leave a path to another writer (no ignore-changes)"
  - variable: resource_types
    kind: by-design
    reason: "ASO's kinds fix the API versions (PrivateEndpoint and PrivateEndpointsPrivateDnsZoneGroup 2025-03-01)"
  - variable: retry
    kind: by-design
    reason: "Azure Service Operator retries every failed request itself, with backoff, until the resource is ready"
  - variable: timeouts
    kind: by-design
    reason: "Azure Service Operator has no per-request timeouts; Bundt sets a component's time limit"
