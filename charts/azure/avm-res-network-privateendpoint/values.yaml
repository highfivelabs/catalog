#
# Values mirror the Terraform variables of the Azure Verified Module
# avm-res-network-privateendpoint (v0.3.1): same names, types and
# defaults, so a module block's arguments become this file one to one.
# values.schema.json carries the types and the module's validations.
# README.md maps each one to Azure Service Operator.
#
# Descriptions quoted from terraform-azurerm-avm-res-network-privateendpoint
# (variables.tf, v0.3.1), Copyright (c) Microsoft Corporation, MIT.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables, except tags.
#
# The private endpoint's and its network interface's names in full,
# {privateEndpoint, networkInterface}. A name set here takes no prefix; one
# not set is name (network_interface_name), with the namePrefix in front.
names: {}
# An optional convenience: "<namePrefix>-" in front of the private
# endpoint's name and of network_interface_name (never of a name set under
# names). Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. ASO never copies them to Azure (Azure
# tags are tags).
labels: {}
# DELETE (the default) or ABANDON, which keeps every resource in Azure when
# the component is deleted (ASO's reconcile-policy detach-on-delete).
# PREVENT is refused: use lock. Not a module variable.
deletion_policy: null

# Module variables (alphabetical, required ones included).

# (Optional) The resource ids of application security group to associate.
application_security_group_association_ids: []
# Enables module-owned migration helpers for upgrading from earlier
# AzureRM-backed versions. Accepted with no effect: ASO adopts an existing
# DNS zone group of the same name on its own.
avm_managed_migration_enabled: false
# This variable controls whether or not telemetry is enabled for the
# module. Accepted; the chart never sends telemetry.
enable_telemetry: true
# Body-relative paths the AzAPI provider ignores for each resource.
# Refused when a list is not empty: ASO cannot leave a path to another
# writer. {authorization_locks, authorization_role_assignments,
# network_private_endpoints, network_private_endpoints_private_dns_zone_groups:
# {network_private_endpoints_private_dns_zone_groups}}
ignore_body_changes: {}
# (Optional) Static IP configurations, each {name, private_ip_address,
# subresource_name, member_name ("default")}.
ip_configurations: {}
# (Required) Azure region where the resource should be deployed.
location: ""
# The resource lock: {kind (CanNotDelete or ReadOnly), name (lock-<kind>),
# notes (the module's default notes)}.
lock: null
# (Required) The name of the this resource.
name: null
# (Optional) The custom name of the network interface attached to the
# private endpoint. Changing this forces a new resource to be created.
network_interface_name: null
# The Azure resource ID of the parent resource group.
parent_id: ""
# (Required) The ID of the Private Link Enabled Remote Resource which this
# Private Endpoint should be connected to.
private_connection_resource_id: ""
# (Optional) Specifies the Name of the Private DNS Zone Group ("default").
private_dns_zone_group_name: null
# (Optional) Specifies the list of Private DNS Zones to include within the
# private_dns_zone_group.
private_dns_zone_resource_ids: []
# (Optional) Specifies the Name of the Private Service Connection
# (pse-<name>).
private_service_connection_name: null
# AzAPI resource types and API versions. Refused when set: ASO's kinds fix
# the API versions.
resource_types: {}
# Retry configuration of the AzAPI provider. Refused when set: ASO retries
# itself.
retry: null
# Role assignments on the private endpoint, each {name,
# role_definition_id_or_name, principal_id, description,
# skip_service_principal_aad_check, condition, condition_version,
# delegated_managed_identity_resource_id, principal_type}.
role_assignments: {}
# (Required) Azure resource ID of the Subnet from which Private IP Addresses
# will be allocated for this Private Endpoint.
subnet_resource_id: ""
# (Optional) A list of subresource names which the Private Endpoint is able
# to connect to.
subresource_names: null
# Tags to be applied to the resource.
tags: null
# Per-operation timeouts of the AzAPI provider. Refused when set: ASO has
# none; Bundt sets a component's time limit.
timeouts: null
