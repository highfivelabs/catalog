# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set, or accepts only in part. Read by `task
# coverage`; `task coverage-verify` renders the chart to check that each one
# is refused. kind: gap (no Azure Service Operator or aso-extensions kind or
# field; the reason names the ARM type when a kind is missing), not-ported
# (one exists, the chart does not map it yet) or by-design. partial: the
# variable is accepted, the reason says what is refused.
refused:
  - variable: scope_maps
    kind: not-ported
    reason: "accepted, but a token's passwords are refused: secrets Azure generates and returns once (generateCredentials); whether a component may hold one is the builder's decision"
    partial: true
    fields: [registry_tokens.passwords]
  - variable: customer_managed_key
    kind: not-ported
    reason: "ASO's Registry takes the key's URI and the identity's client ID (keyIdentifier, identity); the module looks both up from the vault and identity IDs, which a render cannot"
  - variable: resource_types
    kind: by-design
    reason: "ASO's kinds fix the API versions (RegistryCacheRule 2025-11-01)"
  - variable: retry
    kind: by-design
    reason: "Azure Service Operator retries every failed request itself, with backoff, until the resource is ready"
  - variable: timeouts
    kind: by-design
    reason: "Azure Service Operator has no per-request timeouts; Bundt sets a component's time limit"
