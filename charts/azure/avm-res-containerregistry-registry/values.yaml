#
# Values mirror the Terraform variables of the Azure Verified Module
# avm-res-containerregistry-registry (v0.9.0): same names, types and
# defaults, so a module block's arguments become this file one to one.
# values.schema.json carries the types and the module's validations.
#
# Descriptions quoted from
# terraform-azurerm-avm-res-containerregistry-registry (variables*.tf,
# v0.9.0), Copyright (c) Microsoft Corporation, MIT.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables, except tags.
#
# The registry's name in full, {registry}. A name set here takes no
# prefix; one not set is name, with the namePrefix in front (without its
# hyphens: a registry name is letters and digits).
names: {}
# An optional convenience: the namePrefix, hyphens removed, in front of the
# registry's name (never one set under names). Empty (the default) changes
# nothing.
namePrefix: ""
# Kubernetes labels on every object. ASO never copies them to Azure (Azure
# tags are tags).
labels: {}
# DELETE (the default) or ABANDON, which keeps every resource in Azure when
# the component is deleted (ASO's reconcile-policy detach-on-delete).
# PREVENT is refused: use lock. Not a module variable.
deletion_policy: null
# The subscription of resource_group_name. Not a module variable: the
# module's azurerm provider knows its subscription; ASO's owner is an
# Azure resource ID. Not needed when resource_group_name is a resource
# group's ID (/subscriptions/<id>/resourceGroups/<name>).
subscription_id: ""

# Specifies whether the admin user is enabled.
admin_enabled: false
# Specifies whether anonymous (unauthenticated) pull access is enabled.
anonymous_pull_enabled: false
# Whether the registry accepts Microsoft Entra tokens issued for the Azure
# Resource Manager audience.
azuread_authentication_as_arm_policy_enabled: true
# Container Registry cache rules. Each: {name, source_repository,
# target_repository, credential_set_key (a key of credential_sets),
# credential_set_resource_id}.
cache_rules: {}
# Registry-level credential sets that cache rules share, each an
# aso-extensions RegistriesCredentialSet with a system-assigned identity
# (grant it read on the Key Vault secrets; its principal_id is in the
# credential_sets output). Each: {name, login_server, auth_credentials:
# [{name ("Credential1"), username_secret_identifier,
# password_secret_identifier}]} (Key Vault secret URIs, not values).
credential_sets: {}
# A customer-managed key. Refused when set: not mapped (it needs lookups).
customer_managed_key: null
# Specifies whether to enable dedicated data endpoints.
data_endpoint_enabled: false
# A map of diagnostic settings to create on the registry.
# Each: {name, log_categories, log_groups (["allLogs"]), metric_categories
# (["AllMetrics"]), log_analytics_destination_type ("Dedicated"),
# workspace_resource_id, storage_account_resource_id,
# event_hub_authorization_rule_resource_id, event_hub_name,
# marketplace_partner_resource_id}.
diagnostic_settings: {}
# This variable controls whether or not telemetry is enabled for the
# module. Accepted; the chart never sends telemetry.
enable_telemetry: true
# Specified whether trust policy is enabled for this Container Registry.
enable_trust_policy: false
# Specifies whether export policy is enabled.
export_policy_enabled: true
# Geo-replications. Each: {location, regional_endpoint_enabled (true),
# zone_redundancy_enabled (true), tags}.
georeplications: []
# Azure region where the resource should be deployed.
location: ""
# Controls the Resource Lock configuration for this resource.
# {kind (CanNotDelete or ReadOnly), name (default lock-<name>)}
lock: null
# Controls the Managed Identity configuration on this resource.
# {system_assigned (false), user_assigned_resource_ids ([])}
managed_identities: {}
# The name of the Container Registry: 5 to 50 letters and digits.
name: null
# Whether trusted Azure services may bypass the network rules for tasks.
network_rule_bypass_for_tasks_enabled: false
# Trusted Azure services access to a network restricted registry: None or
# AzureServices.
network_rule_bypass_option: None
# The network rule set (Premium). {default_action ("Deny"), ip_rule:
# [{action ("Allow"), ip_range}]}
network_rule_set: null
# Private endpoints to the registry (ASO PrivateEndpoint each).
private_endpoints: {}
# Whether private endpoints inherit the registry's lock (an endpoint's own
# lock takes precedence).
private_endpoints_inherit_lock: true
# Whether to manage private DNS zone groups (false: managed elsewhere,
# e.g. by Azure Policy).
private_endpoints_manage_dns_zone_group: true
# Whether public network access is allowed.
public_network_access_enabled: true
# Specifies whether the quarantine policy is enabled.
quarantine_policy_enabled: false
# The resource group of the registry (its name, or its ID).
resource_group_name: ""
# The azapi resource types of the cache rules and credential sets. Refused
# when set: ASO's kinds fix the API versions.
resource_types: {}
# The number of days to retain untagged manifests (Premium); null disables
# the retention policy.
retention_policy_in_days: 7
# Retry configuration of the cache rules and credential sets. Refused when
# set: ASO retries itself.
retry: null
# The repository authorization mode: LegacyRegistryPermissions or
# AbacRepositoryPermissions.
role_assignment_mode: LegacyRegistryPermissions
# A map of role assignments to create on the registry.
# Each: {role_definition_id_or_name, principal_id, description,
# skip_service_principal_aad_check, condition, condition_version,
# delegated_managed_identity_resource_id, principal_type}.
role_assignments: {}
# Scope maps, each an aso-extensions RegistriesScopeMap, and their tokens
# (RegistriesToken). Each: {name, actions, description, registry_tokens:
# {<key>: {name, enabled (true), passwords}}}. A token's passwords are
# refused: secrets Azure generates and returns once.
scope_maps: {}
# The SKU: Basic, Standard or Premium.
sku: Premium
# (Optional) Tags of the resource.
tags: null
# Timeouts of the cache rules and credential sets. Refused when set: ASO
# has none; Bundt sets a component's time limit.
timeouts: null
# Specifies whether zone redundancy is enabled (Premium).
zone_redundancy_enabled: true
