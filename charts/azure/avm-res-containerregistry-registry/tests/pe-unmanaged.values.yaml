# A private endpoint in another resource group by name, its DNS zone group
# managed elsewhere (Azure Policy), the registry's lock not inherited.
name: acrpe001
location: eastus2
resource_group_name: rg-acr
subscription_id: 00000000-0000-0000-0000-000000000000
public_network_access_enabled: false
lock: {kind: CanNotDelete}
private_endpoints_inherit_lock: false
private_endpoints_manage_dns_zone_group: false
private_endpoints:
  pe:
    resource_group_name: rg-net
    subnet_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-net/providers/Microsoft.Network/virtualNetworks/vnet/subnets/snet-pe
    private_dns_zone_resource_ids: [/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-dns/providers/Microsoft.Network/privateDnsZones/privatelink.azurecr.io]
