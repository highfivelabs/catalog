# For an apply against the fake cloud (docs/azure.md, "8. Charts"): a
# Standard registry with a cache rule (from MCR: Docker Hub needs a
# credential set), a credential set, and a scope map with a token
# (aso-extensions kinds, which its manager reconciles), and a private
# endpoint with a DNS zone group (the fake keeps the references as sent) in
# the fake cloud's resource group.
name: catalogacr001
location: eastus2
resource_group_name: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg
sku: Standard
zone_redundancy_enabled: false
tags: {catalog: mock}
cache_rules:
  mcr: {name: mcr-busybox, source_repository: mcr.microsoft.com/azurelinux/busybox, target_repository: cache/busybox}
credential_sets:
  hub:
    name: dockerhub
    login_server: docker.io
    auth_credentials:
      - {username_secret_identifier: "https://catalog-kv.vault.azure.net/secrets/hub-user", password_secret_identifier: "https://catalog-kv.vault.azure.net/secrets/hub-token"}
scope_maps:
  pull:
    name: app-pull
    actions: [repositories/app/content/read]
    registry_tokens:
      ci: {name: ci-pull}
private_endpoints:
  pe:
    subnet_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/virtualNetworks/catalog-vnet/subnets/snet-pe
    private_dns_zone_resource_ids: [/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/privateDnsZones/privatelink.azurecr.io]
