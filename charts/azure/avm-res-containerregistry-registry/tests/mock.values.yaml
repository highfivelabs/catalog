# For an apply against the fake cloud (docs/azure.md, "8. Charts"): a
# Standard registry with a cache rule in the fake cloud's resource group.
name: catalogacr001
location: eastus2
resource_group_name: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg
sku: Standard
zone_redundancy_enabled: false
tags: {catalog: mock}
cache_rules:
  hub: {name: dockerhub-busybox, source_repository: docker.io/library/busybox, target_repository: cache/busybox}
