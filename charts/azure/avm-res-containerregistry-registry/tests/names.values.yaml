# Whole names from a naming convention: names.registry is used as given;
# the namePrefix goes on no name set in full. labels stay in Kubernetes;
# tags reach Azure.
name: images
location: eastus2
resource_group_name: rg-shop-dev
subscription_id: 00000000-0000-0000-0000-000000000000
namePrefix: shop-dev
names: {registry: acrshopdeveus2}
labels: {hfl.dev/team: shop}
tags: {team: shop}
