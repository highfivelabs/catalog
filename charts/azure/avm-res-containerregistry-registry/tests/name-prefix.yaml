#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every
# object this chart renders carries the namePrefix in its Azure name
# (spec.azureName, nameFields below), except the kinds listed here, each with
# the reason it cannot collide with another Instance's.
exempt:
  RegistryReplication: "named for its location inside its registry, whose name carries the prefix, as azurerm names it"
  RegistryCacheRule: "named inside its registry, whose name carries the prefix, by the entry's name"
  RegistriesCredentialSet: "named inside its registry, whose name carries the prefix, by the entry's name"
  RegistriesScopeMap: "named inside its registry, whose name carries the prefix, by the entry's name"
  RegistriesToken: "named inside its registry, whose name carries the prefix, by the entry's name"
  RoleAssignment: "its name is a GUID (a stable UUID ASO makes), scoped to the registry"
  ManagementLock: "named inside the registry or private endpoint it locks, whose name carries the prefix (the module's lock-<name>, lock-<kind>)"
  PrivateEndpointsPrivateDnsZoneGroup: "named inside its private endpoint (default), as the module names it"
  DiagnosticSetting: "named inside the registry it is on, whose name carries the prefix (the module's diag-<name>)"
nameFields:
  Registry: azureName
  PrivateEndpoint: azureName
compactNames:
  Registry: "a registry name is 5 to 50 letters and digits, so the namePrefix goes on without its hyphens"
