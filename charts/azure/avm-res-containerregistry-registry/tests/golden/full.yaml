# Source: avm-res-containerregistry-registry/templates/main.yaml
apiVersion: containerregistry.azure.com/v20251101
kind: Registry
metadata:
  name: full-acr
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: avm-res-containerregistry-registry
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "registry"
spec:
  azureName: "acrplatform"
  location: "westeurope"
  owner:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-acr"
  adminUserEnabled: true
  anonymousPullEnabled: true
  dataEndpointEnabled: true
  identity:
    type: "SystemAssigned, UserAssigned"
    userAssignedIdentities:
      - reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-acr/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-acr"
  networkRuleBypassAllowedForTasks: true
  networkRuleBypassOptions: AzureServices
  networkRuleSet:
    defaultAction: Deny
    ipRules:
      - action: Allow
        value: "203.0.113.0/24"
  policies:
    azureADAuthenticationAsArmPolicy:
      status: disabled
    exportPolicy:
      status: disabled
    quarantinePolicy:
      status: enabled
    retentionPolicy:
      days: 30
      status: enabled
    trustPolicy:
      status: enabled
      type: Notary
  publicNetworkAccess: Disabled
  roleAssignmentMode: AbacRepositoryPermissions
  sku:
    name: Premium
  zoneRedundancy: Enabled
  tags:
    environment: prod
