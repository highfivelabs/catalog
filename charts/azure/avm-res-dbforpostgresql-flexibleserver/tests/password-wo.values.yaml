# The write-only form: administrator_password_wo, a reference to a
# Kubernetes Secret (docs/secrets.md), with its version (required with it,
# as azurerm requires it; it does nothing, ASO sends the whole body on every
# change), password authentication by default.
name: psql-password-wo
location: eastus2
resource_group_name: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
server_version: 16
sku_name: B_Standard_B1ms
administrator_login: psqladmin
administrator_password_wo: {secretName: psql-admin, key: password}
administrator_password_wo_version: "1"
