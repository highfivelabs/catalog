# For an apply against the fake cloud: a Burstable server with password
# authentication, its administrator's password a reference to a Secret the
# harness makes before the apply with a random value (hack/test-secret.sh;
# nothing committed), as the line below asks, and a database.
# secret: catalog-psql-admin random
name: catalog-psql-pw
location: eastus2
resource_group_name: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg
sku_name: B_Standard_B1ms
server_version: "16"
storage_mb: 32768
high_availability: null
public_network_access_enabled: true
administrator_login: catalogadmin
administrator_password: {secretName: catalog-psql-admin, key: value}
tags: {catalog: mock}
databases:
  app: {name: app}
