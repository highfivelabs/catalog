# The module's default example with its password: password authentication,
# the administrator's password a reference to a Kubernetes Secret in the
# component's namespace (docs/secrets.md), put there by External Secrets
# Operator, and Entra authentication beside it. No secret value is in the
# values.
name: psql-password
location: eastus2
resource_group_name: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
server_version: 16
sku_name: GP_Standard_D2s_v3
zone: 1
administrator_login: psqladmin
administrator_password: {secretName: psql-admin, key: password}
authentication: {active_directory_auth_enabled: true, password_auth_enabled: true, tenant_id: 11111111-2222-3333-4444-555555555555}
