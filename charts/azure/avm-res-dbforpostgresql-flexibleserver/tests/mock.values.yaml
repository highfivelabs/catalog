# For an apply against the fake cloud (docs/azure.md, "8. Charts"): a
# Burstable server with Entra authentication, a database, a firewall rule,
# a server parameter and an Entra administrator, in the fake cloud's
# resource group.
name: catalog-psql
location: eastus2
resource_group_name: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg
sku_name: B_Standard_B1ms
server_version: "16"
storage_mb: 32768
high_availability: null
public_network_access_enabled: true
authentication: {active_directory_auth_enabled: true, password_auth_enabled: false, tenant_id: 11111111-2222-3333-4444-555555555555}
tags: {catalog: mock}
databases:
  app: {name: app}
firewall_rules:
  office: {name: office, start_ip_address: 203.0.113.10, end_ip_address: 203.0.113.10}
server_configuration:
  slow: {name: log_min_duration_statement, config: "1000"}
ad_administrator:
  aso: {tenant_id: 11111111-2222-3333-4444-555555555555, object_id: 22222222-3333-4444-5555-666666666666, principal_name: catalog-aso, principal_type: ServicePrincipal}
