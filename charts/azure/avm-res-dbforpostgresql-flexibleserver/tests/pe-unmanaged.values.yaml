# A private endpoint whose DNS zone group the chart leaves alone
# (private_endpoints_manage_dns_zone_group: false; Azure Policy, say,
# manages it), named in full, in another group by name.
name: psql-pe
location: eastus2
resource_group_name: rg-data
subscription_id: 00000000-0000-0000-0000-000000000000
authentication: {active_directory_auth_enabled: true, password_auth_enabled: false}
firewall_rules: {}
private_endpoints_manage_dns_zone_group: false
private_endpoints:
  a:
    name: pe-psql-pe-hub
    private_service_connection_name: psc-hub
    location: westus3
    subnet_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-net/providers/Microsoft.Network/virtualNetworks/vnet/subnets/pe
    resource_group_name: rg-net
    private_dns_zone_resource_ids: [/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-dns/providers/Microsoft.Network/privateDnsZones/privatelink.postgres.database.azure.com]
