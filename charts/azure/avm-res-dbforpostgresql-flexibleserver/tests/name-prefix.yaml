#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every
# object this chart renders carries the namePrefix in its Azure name
# (spec.azureName, nameFields below), except the kinds listed here, each with
# the reason it cannot collide with another Instance's.
exempt:
  FlexibleServersDatabase: "named inside its server, whose name carries the prefix, by the entry's name"
  FlexibleServersFirewallRule: "named inside its server, whose name carries the prefix, by the entry's name"
  FlexibleServersConfiguration: "a server parameter: PostgreSQL fixes its name, inside a server whose name carries the prefix"
  FlexibleServersAdministrator: "named by the principal's object ID, inside its server"
  FlexibleServersVirtualEndpoint: "named inside its server, whose name carries the prefix, by the entry's name"
  PrivateEndpointsPrivateDnsZoneGroup: "named inside its private endpoint (default), as the module names it"
  RoleAssignment: "its name is a GUID (a stable UUID ASO makes), scoped to the server or endpoint"
  ManagementLock: "named inside the resource it locks, whose name carries the prefix (the module's lock-<kind>)"
  DiagnosticSetting: "named on the server it watches (the module's diag-<name>), whose name carries the prefix"
nameFields:
  FlexibleServer: azureName
  PrivateEndpoint: azureName
