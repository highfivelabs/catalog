# Whole names from a naming convention: names.flexibleServer is used as
# given; the namePrefix goes on no name set in full. labels stay in
# Kubernetes; tags reach Azure. A Burstable server with no high
# availability and the system window.
name: orders
location: eastus2
resource_group_name: rg-shop-dev
subscription_id: 00000000-0000-0000-0000-000000000000
namePrefix: shop-dev
names: {flexibleServer: psql-shop-dev-eus2}
labels: {hfl.dev/team: shop}
tags: {team: shop}
sku_name: B_Standard_B1ms
server_version: "16"
high_availability: null
maintenance_window: null
firewall_rules: {}
authentication: {active_directory_auth_enabled: true, password_auth_enabled: false}
lock: {kind: ReadOnly, name: keep}
