#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every
# object this chart renders carries the namePrefix in its Azure name
# (spec.azureName, nameFields below), except the kinds listed here, each with
# the reason it cannot collide with another Instance's.
exempt:
  ManagementGroupsSubscription: "named by the subscription's ID, the one subscription it places"
  TagSet: "the subscription's one tag set (Azure's name, default)"
  ManagementLock: "a lock inside its resource group, whose name carries the prefix (its default name is lock-<group name>)"
  RoleAssignment: "named by a GUID (the module's uuidv5 of scope, principal and role, or ASO's stable UUID), scoped to what it grants"
  NetworkSecurityGroupsSecurityRule: "a rule inside its network security group, whose name carries the prefix"
  RouteTablesRoute: "a route inside its route table, whose name carries the prefix"
  VirtualNetworksSubnet: "a subnet inside its virtual network, whose name carries the prefix"
  VirtualNetworksVirtualNetworkPeering: "named peer-<uuidv5 of the remote network's ID> as the module names it (a network of the chart's carries the prefix), or as given"
  VirtualHubsHubVirtualNetworkConnection: "named vhc-<uuidv5 of the network's ID>, whose name carries the prefix, or as given"
  FederatedIdentityCredential: "a credential inside its identity, whose name carries the prefix"
nameFields:
  Alias: azureName
  ResourceGroup: azureName
  NetworkSecurityGroup: azureName
  RouteTable: azureName
  UserAssignedIdentity: azureName
  VirtualNetwork: azureName
  Budget: azureName
