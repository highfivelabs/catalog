# An existing subscription placed in a management group, a resource group
# in it and a virtual network with one subnet (the module's
# examples/subscription-existing-mg-network, cut down).
location: eastus2
subscription_id: 00000000-0000-0000-0000-000000000000
subscription_management_group_association_enabled: true
subscription_management_group_id: landing-zones
resource_group_creation_enabled: true
resource_groups:
  network:
    name: rg-network
virtual_network_enabled: true
virtual_networks:
  primary:
    name: vnet-primary
    address_space: ["10.0.0.0/24"]
    resource_group_key: network
    subnets:
      default:
        name: default
        address_prefix: 10.0.0.0/26
