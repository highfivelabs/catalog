# A new subscription from an alias, placed in a management group and
# tagged by the alias's body (the module's examples/subscription-alias).
location: eastus2
subscription_alias_enabled: true
subscription_alias_name: sub-app1-prod
subscription_display_name: App1 Production
subscription_billing_scope: /providers/Microsoft.Billing/billingAccounts/1234567/enrollmentAccounts/123456
subscription_workload: Production
subscription_management_group_association_enabled: true
subscription_management_group_id: landing-zones
subscription_tags:
  costcenter: "1234"
  owner: app1
