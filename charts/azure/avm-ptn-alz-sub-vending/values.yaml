  Microsoft.Cache: []
  Microsoft.Cdn: []
  Microsoft.CognitiveServices: []
  Microsoft.Compute: []
  Microsoft.ContainerInstance: []
  Microsoft.ContainerRegistry: []
  Microsoft.ContainerService: []
  Microsoft.CostManagement: []
  Microsoft.CustomProviders: []
  Microsoft.Databricks: []
  Microsoft.DataLakeAnalytics: []
  Microsoft.DataLakeStore: []
  Microsoft.DataMigration: []
  Microsoft.DataProtection: []
  Microsoft.DBforMariaDB: []
  Microsoft.DBforMySQL: []
  Microsoft.DBforPostgreSQL: []
  Microsoft.DesktopVirtualization: []
  Microsoft.Devices: []
  Microsoft.DevTestLab: []
  Microsoft.DocumentDB: []
  Microsoft.EventGrid: []
  Microsoft.EventHub: []
  Microsoft.HDInsight: []
  Microsoft.HealthcareApis: []
  Microsoft.GuestConfiguration: []
  Microsoft.KeyVault: []
  Microsoft.Kusto: []
  microsoft.insights: []
  Microsoft.Logic: []
  Microsoft.MachineLearningServices: []
  Microsoft.Maintenance: []
  Microsoft.ManagedIdentity: []
  Microsoft.ManagedServices: []
  Microsoft.Management: []
  Microsoft.Maps: []
  Microsoft.MarketplaceOrdering: []
  Microsoft.Network: []
  Microsoft.NotificationHubs: []
  Microsoft.OperationalInsights: []
  Microsoft.OperationsManagement: []
  Microsoft.PolicyInsights: []
  Microsoft.PowerBIDedicated: []
  Microsoft.Relay: []
  Microsoft.RecoveryServices: []
  Microsoft.Resources: []
  Microsoft.Search: []
  Microsoft.Security: []
  Microsoft.SecurityInsights: []
  Microsoft.ServiceBus: []
  Microsoft.ServiceFabric: []
  Microsoft.Sql: []
  Microsoft.Storage: []
  Microsoft.StreamAnalytics: []
  Microsoft.Web: []
# A map of tags to assign to the subscription (a new one's, or an
# existing one's with subscription_update_existing).
subscription_tags: {}
# Whether to update an existing subscription with the supplied tags and
# display name (the display name, a rename, is refused).
subscription_update_existing: false
# The workload type of the new subscription alias: Production or DevTest.
subscription_workload: null
# Whether to enable the creation of user-assigned managed identities.
umi_enabled: false
# A map of user-managed identities, each {name, resource_group_key or
# resource_group_name_existing, location, tags, role_assignments,
# federated_credentials_github, federated_credentials_terraform_cloud,
# federated_credentials_advanced}.
user_managed_identities: {}
# Enables and disables the virtual network submodule.
virtual_network_enabled: false
# A map of the virtual networks to create, each {name, address_space or
# ipam_pools, resource_group_key or resource_group_name_existing,
# location, dns_servers, flow_timeout_in_minutes, ddos_protection_enabled,
# ddos_protection_plan_id, subnets, hub_*, mesh_*, vwan_*, tags}.
virtual_networks: {}
# The duration to wait after vending a subscription before performing
# subscription operations. Accepted with no effect: ASO retries until the
# subscription answers.
wait_for_subscription_before_subscription_operations: {}
