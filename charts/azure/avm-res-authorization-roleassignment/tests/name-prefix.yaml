#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every
# object this chart renders carries the namePrefix in its Azure name
# (spec.azureName, nameFields below), except the kinds listed here, each with
# the reason it cannot collide with another Instance's. This chart names no
# Azure resource.
exempt:
  RoleAssignment: "its name is a GUID (a stable UUID ASO makes), scoped to the scope it grants"
  DirectoryRoleAssignment: "Microsoft Graph names an assignment itself; one is the role, principal and directory scope"
nameFields: {}
noCloudNames: "role assignments are named by a GUID ASO makes, directory role assignments by the ID Microsoft Graph gives them; the chart names nothing, so namePrefix has no effect"
