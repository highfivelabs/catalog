# A resource group's Reader role, by name, for a user and a group given by
# object ID (the module's role_assignments_for_resource_groups example, with
# the principals by object ID).
subscription_id: 00000000-0000-0000-0000-000000000000
users_by_object_id:
  my-user-1: 11111111-0000-0000-0000-000000000001
groups_by_object_id:
  my-group-1: 22222222-0000-0000-0000-000000000001
role_definitions:
  reader:
    name: Reader
role_assignments_for_resource_groups:
  example:
    resource_group_name: rg-example
    role_assignments:
      read:
        role_definition: reader
        users: [my-user-1]
        groups: [my-group-1]
