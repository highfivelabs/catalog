#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every
# object this chart renders carries the namePrefix in its Azure name
# (spec.azureName), except the kinds listed here, each with the reason it
# cannot collide with another Instance's. Every name this chart gives is the
# architecture's.
exempt:
  ManagementGroup: "named by the architecture's management group ID, which its policy definition IDs, scopes and assignable scopes name: a tenant's one hierarchy, deployed once"
  ManagementGroupsSetting: "the tenant root group's one settings resource (Azure's name, default)"
  ManagementGroupsSubscription: "named by the subscription's ID, the one subscription it places"
  PolicyDefinition: "named by the architecture, inside its management group"
  PolicySetDefinition: "named by the architecture, inside its management group"
  PolicyAssignment: "named by the architecture, inside its management group"
  RoleDefinition: "named by the architecture's GUID, inside its management group"
  RoleAssignment: "named by a GUID (the module's uuidv5, or ASO's stable UUID), scoped to what it grants"
nameFields: {}
noCloudNames: "every name is the architecture's (management group IDs and the names of its policy and role resources), which its own resource IDs name, so namePrefix has no effect"
