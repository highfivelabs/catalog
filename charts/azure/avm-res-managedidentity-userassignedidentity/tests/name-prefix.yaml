#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every
# object this chart renders carries the namePrefix in its Azure name
# (spec.azureName, nameFields below), except the kinds listed here, each with
# the reason it cannot collide with another Instance's.
exempt:
  FederatedIdentityCredential: "named inside its identity, whose name carries the prefix, by the entry's name"
  RoleAssignment: "its name is a GUID (a stable UUID ASO makes), scoped to the scope it grants"
  ManagementLock: "named inside the identity it locks, whose name carries the prefix (the module's lock-<kind>)"
nameFields:
  UserAssignedIdentity: azureName
