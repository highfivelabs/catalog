# Every input the chart carries: the group by ID, tags, a lock, a
# federated credential for an AKS workload, and outbound role assignments
# by name and by ID (one with a condition).
name: uami-app
location: westeurope
resource_group_name: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-app
enable_telemetry: false
tags: {environment: prod}
lock: {kind: CanNotDelete}
federated_identity_credentials:
  aks:
    name: aks-app
    audience: [api://AzureADTokenExchange]
    issuer: https://westeurope.oic.prod-aks.azure.com/11111111-2222-3333-4444-555555555555/66666666-7777-8888-9999-000000000000/
    subject: system:serviceaccount:app:app
outbound_role_assignments:
  blob:
    role_definition_id_or_name: Storage Blob Data Reader
    scope: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-app/providers/Microsoft.Storage/storageAccounts/stapp
  kv:
    role_definition_id_or_name: /providers/Microsoft.Authorization/roleDefinitions/4633458b-17de-408a-b874-0445c86b69e6
    scope: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-app/providers/Microsoft.KeyVault/vaults/kv-app
    skip_service_principal_aad_check: true
    condition: "@Resource[Microsoft.KeyVault/vaults/secrets:name] StringStartsWith 'app-'"
    condition_version: "2.0"
