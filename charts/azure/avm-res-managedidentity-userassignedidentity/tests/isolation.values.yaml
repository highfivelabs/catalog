# isolation_scope, after ASO's UserAssignedIdentity API version 2023-01-31:
# aso-extensions' UserAssignedIdentity (managedidentity.azure.hfl.dev/v20241130),
# the principal ID exported by a CEL expression for the outbound role
# assignment, the federated credential and the lock owned by its ARM ID.
name: uami-regional
location: eastus2
resource_group_name: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
isolation_scope: Regional
federated_identity_credentials:
  ci: {name: ci-main, audience: [api://AzureADTokenExchange], issuer: https://token.actions.githubusercontent.com, subject: "repo:example/app:ref:refs/heads/main"}
outbound_role_assignments:
  reader:
    role_definition_id_or_name: Reader
    scope: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
lock: {kind: CanNotDelete}
