# For an apply against the fake cloud (docs/azure.md, "8. Charts"): an
# identity with a federated credential in the fake cloud's resource group,
# and a CanNotDelete lock (aso-extensions' ManagementLock, which its manager
# reconciles; the fake refuses the identity's delete while the lock holds).
name: catalog-uami
location: eastus2
resource_group_name: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg
tags: {catalog: mock}
federated_identity_credentials:
  ci: {name: ci-main, audience: [api://AzureADTokenExchange], issuer: https://token.actions.githubusercontent.com, subject: "repo:highfivelabs/catalog:ref:refs/heads/main"}
lock: {kind: CanNotDelete, name: catalog-mock-lock}
