#
# Values mirror the Terraform variables of the Azure Verified Module
# avm-res-managedidentity-userassignedidentity (v0.6.0): same names, types
# and defaults, so a module block's arguments become this file one to one.
# values.schema.json carries the types and the module's validations.
#
# Descriptions quoted from
# terraform-azurerm-avm-res-managedidentity-userassignedidentity
# (variables.tf, v0.6.0), Copyright (c) Microsoft Corporation, MIT.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables, except tags.
#
# The identity's name in full, {userAssignedIdentity}. A name set here
# takes no prefix; one not set is name, with the namePrefix in front.
# Federated credentials are named by their entries.
names: {}
# An optional convenience: "<namePrefix>-" in front of the identity's name
# (never one set under names). Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. ASO never copies them to Azure (Azure
# tags are tags).
labels: {}
# DELETE (the default) or ABANDON, which keeps every resource in Azure when
# the component is deleted (ASO's reconcile-policy detach-on-delete).
# PREVENT is refused: use lock. Not a module variable.
deletion_policy: null
# The subscription of resource_group_name. Not a module variable: the
# module's azurerm provider knows its subscription; ASO's owner is an
# Azure resource ID. Not needed when resource_group_name is a resource
# group's ID (/subscriptions/<id>/resourceGroups/<name>).
subscription_id: ""

# This variable controls whether or not telemetry is enabled for the
# module. Accepted; the chart never sends telemetry.
enable_telemetry: true
# A map of federated identity credentials to create on the user assigned
# identity. Each: {name, audience (a list), issuer, subject}.
federated_identity_credentials: {}
# The isolation scope of the identity: null or Regional. Refused when set:
# ASO's API version has no isolation scope.
isolation_scope: null
# The Azure region of the identity.
location: ""
# Controls the Resource Lock configuration for this resource.
# {kind (CanNotDelete or ReadOnly), name (default lock-<kind>)}
lock: null
# The name of the user assigned identity.
name: null
# A map of outbound role assignments granting the created user assigned
# identity access at each supplied scope. Each: {role_definition_id_or_name,
# scope, condition, condition_version,
# delegated_managed_identity_resource_id, skip_service_principal_aad_check}.
outbound_role_assignments: {}
# The name of the resource group of the identity (or its ID).
resource_group_name: ""
# (Optional) Tags of the resource.
tags: null
