#
# The Bundt Package for this chart. Outputs are the module's declared
# outputs, selected from the live object (resources.<id>) and the
# component's values (inputs). client_id, principal_id and tenant_id are
# the identity's, from ASO's status; resource_id its ARM ID;
# resource_name computed from inputs as the module sets it. The module's
# resource output (the whole azurerm object) is not an output.
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: azure-avm-res-managedidentity-userassignedidentity
spec:
  version: 0.2.0
  engine: helm
  providers: [aso]
  outputs:
    client_id: resources.user_assigned_identity.status.clientId
    principal_id: resources.user_assigned_identity.status.principalId
    tenant_id: resources.user_assigned_identity.status.tenantId
    resource_id: resources.user_assigned_identity.status.id
    resource_name: >-
      ('userAssignedIdentity' in inputs.names && inputs.names.userAssignedIdentity != '' ? inputs.names.userAssignedIdentity : (inputs.namePrefix != '' ? inputs.namePrefix + '-' : '') + inputs.name)
