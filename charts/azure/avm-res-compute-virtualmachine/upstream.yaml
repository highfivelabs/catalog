# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set, or accepts only in part. Read by `task
# coverage`; `task coverage-verify` renders the chart to check that each one
# is refused. kind: gap (no Azure Service Operator or aso-extensions kind or
# field; the reason names the type when a kind is missing), not-ported (one
# exists, the chart does not map it yet) or by-design (Bundt replaces it).
refused:
  # Secret values: generated ones never (docs/secrets.md); run command
  # secrets not yet.
  - variable: generated_secrets_key_vault_secret_config
    kind: by-design
    reason: "writes a generated password or SSH private key to Key Vault; the catalog never generates a secret (docs/secrets.md)"
  - variable: run_commands_secrets
    kind: not-ported
    reason: "protected parameters and run-as passwords are secret values"
  - variable: account_credentials
    kind: by-design
    partial: true
    reason: "admin_credentials (username, ssh_keys, the password as a Kubernetes Secret reference) and password_authentication_disabled are mapped; key_vault_configuration is refused: it writes a generated password or SSH private key to Key Vault, and the catalog never generates a secret"
  - variable: generate_admin_password_or_ssh_key
    kind: by-design
    partial: true
    reason: "accepted when public keys or a password reference are given; generating an SSH key pair or a password is refused: the catalog never generates a secret"
  - variable: additional_unattend_contents
    kind: gap
    reason: "an unattend file's content can carry a password (AutoLogon) and azurerm treats it as sensitive, but the VirtualMachine takes it only in plain text (no SecretReference), so it would sit in the component's inputs"
  # Kinds and fields ASO and aso-extensions lack.
  - variable: azure_backup_configurations
    kind: gap
    reason: "Microsoft.RecoveryServices/vaults/backupFabrics/protectionContainers/protectedItems (a protected VM) has no Azure Service Operator or aso-extensions kind"
  - variable: extensions
    kind: gap
    partial: true
    reason: "mapped, except an entry's protected_settings (a secret value; protected_settings_from_key_vault is mapped), provision_after_extensions (ASO's VirtualMachinesExtension is at ARM API 2022-03-01, before it) and timeouts; deploy_sequence is accepted and has no effect (ASO reconciles every child once the machine is Ready)"
  - variable: run_commands
    kind: gap
    partial: true
    reason: "mapped, except the managed identities of script_source, error_blob and output_blob (aso-extensions' VirtualMachinesRunCommand is at ARM API 2022-03-01, before them) and timeouts; deploy_sequence is accepted and has no effect"
  # By design.
  - variable: timeouts
    kind: by-design
    reason: "Azure Service Operator has no per-request timeouts; Bundt sets a component's time limit"
