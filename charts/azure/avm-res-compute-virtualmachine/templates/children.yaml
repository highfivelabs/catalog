main.extensions.tf with modules/extension, main.runcommand.tf with
modules/run-command, main.shutdownschedule.tf and
main.maintenance_configurations.tf (v0.21.0), Copyright (c) Microsoft
Corporation, MIT.

module.extension*: one ASO VirtualMachinesExtension
(compute.azure.com/v20220301) per extensions entry, owned by the machine.
module.run_command*: one aso-extensions VirtualMachinesRunCommand
(compute.azure.hfl.dev/v20220301) per run_commands entry.
azurerm_dev_test_global_vm_shutdown_schedule: one aso-extensions Schedule
(devtestlab.azure.hfl.dev/v20180915) per shutdown_schedules entry, named
shutdown-computevm-<machine> in the machine's resource group, as azurerm
names it. azapi_resource.this_maintenance_configuration_assignment: one
aso-extensions ConfigurationAssignment
(maintenance.azure.hfl.dev/v20230401) per entry, on the machine.
The module's deploy_sequence orders its extension and run command modules;
ASO reconciles every child once the machine is Ready, so the sequence is
accepted and has no effect.
*/ -}}
{{- $v := .Values }}
{{- $chart := .Chart.Name }}
{{- $abandon := include "aso.abandon" . }}
{{- $rg := include "vm.rgId" (list $ "resource_group_name" $v.resource_group_name) }}
{{- $vmObj := include "vm.obj" . }}
{{- $newer := eq (include "vm.newer" .) "true" }}
{{- $vmRef := ternary (dict "armId" (include "vm.id" .)) (dict "group" "compute.azure.com" "kind" "VirtualMachine" "name" $vmObj) $newer }}
{{- $vmOwner := ternary (dict "armId" (include "vm.id" .)) (dict "name" $vmObj) $newer }}
{{- $vmName := include "aso.resourceName" (list $ "virtualMachine" "virtual machine" $v.name 64 "^[a-zA-Z0-9_]([a-zA-Z0-9_.-]{0,62}[a-zA-Z0-9_])?$") }}
{{- $types := list }}
{{- range $k, $e := ($v.extensions | default dict) }}
{{- if has $e.type $types }}{{ fail "avm-res-compute-virtualmachine: `type` in `vm_extensions` must be unique." }}{{ end }}
{{- $types = append $types $e.type }}
{{- include "aso.unsupported" (list $ (printf "extensions.%s.protected_settings" $k) $e.protected_settings "protected settings are a secret value; how a component supplies one is the builder's decision (protected_settings_from_key_vault is supported)") }}
{{- include "aso.unsupported" (list $ (printf "extensions.%s.provision_after_extensions" $k) $e.provision_after_extensions "ASO's VirtualMachinesExtension is at ARM API 2022-03-01, before provisionAfterExtensions") }}
{{- include "aso.unsupported" (list $ (printf "extensions.%s.timeouts" $k) $e.timeouts "Azure Service Operator has no per-request timeouts; Bundt sets a component's time limit") }}
{{- $obj := include "aso.name" (list $vmObj "ext" $k) }}
{{- $tags := include "vm.owntags" (list $ $e.tags) | fromJson }}
---
apiVersion: compute.azure.com/v20220301
kind: VirtualMachinesExtension
metadata:
  {{- include "aso.metadata" (dict "root" $ "name" $obj "id" (printf "extension:%s" $k) "abandon" $abandon) | nindent 2 }}
spec:
  azureName: {{ $e.name | quote }}
  location: {{ $v.location | quote }}
  owner:
    {{- toYaml $vmOwner | nindent 4 }}
  {{- if not (kindIs "invalid" $e.auto_upgrade_minor_version) }}
  autoUpgradeMinorVersion: {{ $e.auto_upgrade_minor_version }}
  {{- end }}
  {{- if not (kindIs "invalid" $e.automatic_upgrade_enabled) }}
  enableAutomaticUpgrade: {{ $e.automatic_upgrade_enabled }}
  {{- end }}
  {{- with $e.protected_settings_from_key_vault }}
  protectedSettingsFromKeyVault:
    secretUrl: {{ .secret_url | quote }}
    sourceVault:
      reference:
        armId: {{ .source_vault_id | quote }}
  {{- end }}
  publisher: {{ $e.publisher | quote }}
  {{- with $e.settings }}
  settings:
    {{- toYaml (fromJson .) | nindent 4 }}
  {{- end }}
  suppressFailures: {{ eq $e.failure_suppression_enabled true }}
  {{- with $tags }}
  tags:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  type: {{ $e.type | quote }}
  typeHandlerVersion: {{ $e.type_handler_version | quote }}
{{- end }}
{{- range $k, $r := ($v.run_commands | default dict) }}
{{- $src := $r.script_source | default dict }}
{{- include "aso.unsupported" (list $ (printf "run_commands.%s.script_source.script_uri_managed_identity" $k) $src.script_uri_managed_identity "aso-extensions' VirtualMachinesRunCommand is at ARM API 2022-03-01, before scriptUriManagedIdentity") }}
{{- include "aso.unsupported" (list $ (printf "run_commands.%s.error_blob_managed_identity" $k) $r.error_blob_managed_identity "aso-extensions' VirtualMachinesRunCommand is at ARM API 2022-03-01, before errorBlobManagedIdentity") }}
{{- include "aso.unsupported" (list $ (printf "run_commands.%s.output_blob_managed_identity" $k) $r.output_blob_managed_identity "aso-extensions' VirtualMachinesRunCommand is at ARM API 2022-03-01, before outputBlobManagedIdentity") }}
{{- include "aso.unsupported" (list $ (printf "run_commands.%s.timeouts" $k) $r.timeouts "Azure Service Operator has no per-request timeouts; Bundt sets a component's time limit") }}
{{- $obj := include "aso.name" (list $vmObj "run" $k) }}
---
apiVersion: compute.azure.hfl.dev/v20220301
kind: VirtualMachinesRunCommand
metadata:
  {{- include "aso.metadata" (dict "root" $ "name" $obj "id" (printf "run_command:%s" $k) "abandon" $abandon) | nindent 2 }}
spec:
  azureName: {{ $r.name | quote }}
  location: {{ $r.location | quote }}
  owner:
    {{- toYaml $vmOwner | nindent 4 }}
  {{- with $r.error_blob_uri }}
  errorBlobUri: {{ . | quote }}
  {{- end }}
  {{- with $r.output_blob_uri }}
  outputBlobUri: {{ . | quote }}
  {{- end }}
  {{- with $r.parameters }}
  parameters:
    {{- range $_, $p := . }}
    - name: {{ $p.name | quote }}
      value: {{ $p.value | quote }}
    {{- end }}
  {{- end }}
  source:
    {{- with $src.command_id }}
    commandId: {{ . | quote }}
    {{- end }}
    {{- with $src.script }}
    script: {{ . | quote }}
    {{- end }}
    {{- with $src.script_uri }}
    scriptUri: {{ . | quote }}
    {{- end }}
  {{- with $r.tags }}
  tags:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- range $k, $s := ($v.shutdown_schedules | default dict) }}
{{- $ns := $s.notification_settings | default dict }}
---
apiVersion: devtestlab.azure.hfl.dev/v20180915
kind: Schedule
metadata:
  {{- include "aso.metadata" (dict "root" $ "name" (include "aso.name" (list $vmObj "shutdown" $k)) "id" (printf "shutdown_schedule:%s" $k) "abandon" $abandon) | nindent 2 }}
spec:
  azureName: {{ printf "shutdown-computevm-%s" $vmName | quote }}
  location: {{ $v.location | quote }}
  owner:
    {{- include "aso.owner" (list $ "resource_group_name" $rg) | nindent 4 }}
  dailyRecurrence:
    time: {{ $s.daily_recurrence_time | quote }}
  notificationSettings:
    {{- with $ns.email }}
    emailRecipient: {{ . | quote }}
    {{- end }}
    status: {{ ternary "Enabled" "Disabled" (eq $ns.enabled true) }}
    timeInMinutes: {{ $ns.time_in_minutes | default "30" | int }}
    {{- with $ns.webhook_url }}
    webhookUrl: {{ . | quote }}
    {{- end }}
  status: {{ ternary "Enabled" "Disabled" (ne $s.enabled false) }}
  {{- with $s.tags }}
  tags:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  targetResourceReference:
    {{- toYaml $vmRef | nindent 4 }}
  taskType: ComputeVmShutdownTask
  timeZoneId: {{ $s.timezone | quote }}
{{- end }}
{{- range $k, $id := ($v.maintenance_configuration_resource_ids | default dict) }}
---
apiVersion: maintenance.azure.hfl.dev/v20230401
kind: ConfigurationAssignment
metadata:
  {{- include "aso.metadata" (dict "root" $ "name" (include "aso.name" (list $vmObj "maint" $k)) "id" (printf "maintenance_configuration_assignment:%s" $k) "abandon" $abandon) | nindent 2 }}
spec:
  azureName: {{ printf "%s-maintenance-configuration-%s" $v.name $k | quote }}
  location: {{ $v.location | quote }}
  owner:
    {{- toYaml $vmRef | nindent 4 }}
  maintenanceConfigurationReference:
    armId: {{ lower $id | quote }}
{{- end }}
