#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every
# object this chart renders carries the namePrefix in its Azure name
# (spec.azureName, nameFields below), except the kinds listed here, each with
# the reason it cannot collide with another Instance's.
exempt:
  VirtualMachinesExtension: "named inside the machine, whose name carries the prefix, by the entry's name"
  VirtualMachinesRunCommand: "named inside the machine, whose name carries the prefix, by the entry's name"
  ConfigurationAssignment: "named on the machine it assigns, whose name carries the prefix (the module's <name>-maintenance-configuration-<key>)"
  Schedule: "named after the machine it shuts down (shutdown-computevm-<machine>), whose name carries the prefix"
  RoleAssignment: "its name is a GUID (a stable UUID ASO makes), scoped to the machine, an interface or a disk"
  ManagementLock: "named inside the machine, interface, disk or public IP it locks, whose name carries the prefix"
  DiagnosticSetting: "named on the machine or interface it watches, whose name carries the prefix"
nameFields:
  VirtualMachine: azureName
  NetworkInterface: azureName
  PublicIPAddress: azureName
  Disk: azureName
