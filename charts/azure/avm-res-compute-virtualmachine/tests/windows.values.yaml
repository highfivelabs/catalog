# The module README's Windows example: a Windows Server machine whose admin
# password is a reference to a Kubernetes Secret in the component's
# namespace (docs/secrets.md), put there by External Secrets Operator, with
# the Windows-only settings: automatic updates, hotpatching off, a time
# zone and an HTTP WinRM listener. No secret value is in the values.
name: vm-win
location: eastus2
resource_group_name: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
zone: "1"
os_type: Windows
sku_size: Standard_D2ds_v5
encryption_at_host_enabled: false
account_credentials:
  admin_credentials: {username: winadmin, password: {secretName: vm-win-admin, key: password}}
enable_automatic_updates: true
timezone: UTC
winrm_listeners: [{protocol: Http}]
network_interfaces:
  nic0:
    name: vm-win-nic
    ip_configurations:
      ipc0: {name: ipconfig1, private_ip_subnet_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet/subnets/default}
