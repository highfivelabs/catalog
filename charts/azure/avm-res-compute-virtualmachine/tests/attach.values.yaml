# A Windows machine from an existing OS disk (os_disk_attach_mode): no OS
# profile, so no admin password; the only Windows shape the chart renders.
name: win-restored
location: eastus2
resource_group_name: rg-example
subscription_id: 00000000-0000-0000-0000-000000000000
zone: null
os_type: Windows
os_disk_attach_mode: true
os_managed_disk_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Compute/disks/win-os
encryption_at_host_enabled: false
network_interfaces:
  nic0:
    name: win-restored-nic
    ip_configurations:
      ipc0: {name: ipconfig1, private_ip_subnet_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet/subnets/default}
