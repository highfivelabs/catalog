# Whole names from a naming convention: names.virtualMachine is used as
# given (a namePrefix would go on no name set in full, but still on the
# network interface's). labels stay in Kubernetes; tags reach Azure.
name: app
location: eastus2
resource_group_name: rg-shop-dev
subscription_id: 00000000-0000-0000-0000-000000000000
zone: "1"
os_type: Linux
encryption_at_host_enabled: false
source_image_reference: {publisher: Canonical, offer: ubuntu-24_04-lts, sku: server, version: latest}
account_credentials:
  admin_credentials: {ssh_keys: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK0wmN/Cr3JXqmLW7u+g9pTh+wyqDHpSQEQQ5ZJYHjqh catalog-test"], generate_admin_password_or_ssh_key: false}
names: {virtualMachine: vm-shop-dev-eus2-01}
labels: {hfl.dev/team: shop}
tags: {team: shop}
network_interfaces:
  nic0:
    name: nic-app
    ip_configurations:
      ipc0: {name: ipconfig1, private_ip_subnet_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-shop-dev/providers/Microsoft.Network/virtualNetworks/vnet/subnets/default}
