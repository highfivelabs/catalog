apiVersion: compute.azure.com/v20220301
kind: VirtualMachine
metadata:
  name: attach-vm
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "attach"
    app.kubernetes.io/name: avm-res-compute-virtualmachine
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "virtual_machine"
