apiVersion: compute.azure.hfl.dev/v20250401
kind: VirtualMachine
metadata:
  name: mock-windows-vm
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock-windows"
    app.kubernetes.io/name: avm-res-compute-virtualmachine
    app.kubernetes.io/version: "0.4.0"
  annotations:
    hfl.dev/id: "virtual_machine"
spec:
  azureName: "catalog-vmwin"
  location: "eastus2"
  owner:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg"
  extensionsTimeBudget: "PT1H30M"
  hardwareProfile:
    vmSize: "Standard_B2s"
  networkProfile:
