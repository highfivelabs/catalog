    adminPassword: {"key":"value","name":"catalog-vm-win-admin"}
    windowsConfiguration:
      enableAutomaticUpdates: true
      patchSettings:
        assessmentMode: ImageDefault
        enableHotpatching: false
        patchMode: AutomaticByOS
      provisionVMAgent: true
      timeZone: "UTC"
      winRM:
        listeners:
          - protocol: "Http"
  priority: Regular
  storageProfile:
    imageReference:
      offer: "WindowsServer"
      publisher: "MicrosoftWindowsServer"
      sku: "2022-datacenter-g2"
      version: "latest"
    osDisk:
      caching: ReadWrite
      createOption: FromImage
      deleteOption: Delete
      managedDisk:
