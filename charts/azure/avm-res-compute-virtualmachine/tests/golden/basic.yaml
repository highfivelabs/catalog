---
# Source: avm-res-compute-virtualmachine/templates/network.yaml
apiVersion: network.azure.com/v20250301
kind: NetworkInterface
metadata:
  name: basic-nic-nic0
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: avm-res-compute-virtualmachine
    app.kubernetes.io/version: "0.3.0"
  annotations:
    hfl.dev/id: "network_interface:nic0"
spec:
  azureName: "vm-example-nic"
  location: "eastus2"
  owner:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example"
  enableAcceleratedNetworking: false
  enableIPForwarding: false
  ipConfigurations:
    - name: "ipconfig1"
      primary: true
      privateIPAddressVersion: IPv4
      privateIPAllocationMethod: Dynamic
      subnet:
        reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet/subnets/default"
---
# Source: avm-res-compute-virtualmachine/templates/main.yaml
apiVersion: compute.azure.hfl.dev/v20250401
kind: VirtualMachine
metadata:
  name: basic-vm
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: avm-res-compute-virtualmachine
    app.kubernetes.io/version: "0.3.0"
  annotations:
    hfl.dev/id: "virtual_machine"
spec:
  azureName: "vm-example"
  location: "eastus2"
  owner:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example"
  extensionsTimeBudget: "PT1H30M"
  hardwareProfile:
    vmSize: "Standard_B2s"
  networkProfile:
    networkInterfaces:
      - reference:
          armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/networkInterfaces/vm-example-nic
        primary: true
  osProfile:
    adminUsername: "azureuser"
    allowExtensionOperations: true
    computerName: "vm-example"
    linuxConfiguration:
      disablePasswordAuthentication: true
      patchSettings:
        assessmentMode: ImageDefault
        patchMode: ImageDefault
      provisionVMAgent: true
      ssh:
        publicKeys:
          - keyData: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK0wmN/Cr3JXqmLW7u+g9pTh+wyqDHpSQEQQ5ZJYHjqh catalog-test"
            path: "/home/azureuser/.ssh/authorized_keys"
  priority: Regular
  storageProfile:
    imageReference:
      offer: "ubuntu-24_04-lts"
      publisher: "Canonical"
      sku: "server"
      version: "latest"
    osDisk:
      caching: ReadWrite
      createOption: FromImage
      deleteOption: Delete
      managedDisk:
        storageAccountType: Premium_LRS
      osType: Linux
      writeAcceleratorEnabled: false
  zones:
    - "1"
