apiVersion: compute.azure.hfl.dev/v20250401
kind: VirtualMachine
metadata:
  name: newer-vm
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "newer"
    app.kubernetes.io/name: avm-res-compute-virtualmachine
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "virtual_machine"
spec:
  azureName: "vm-nvme"
  location: "eastus2"
  owner:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example"
  extensionsTimeBudget: "PT1H30M"
  hardwareProfile:
    vmSize: "Standard_B2s"
  networkProfile:
    networkInterfaces:
      - reference:
          armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/networkInterfaces/vm-nvme-nic
        primary: true
  osProfile:
    adminUsername: "azureuser"
    allowExtensionOperations: true
    computerName: "vm-nvme"
    linuxConfiguration:
      disablePasswordAuthentication: true
      patchSettings:
        assessmentMode: ImageDefault
        automaticByPlatformSettings:
          bypassPlatformSafetyChecksOnUserSchedule: true
        patchMode: AutomaticByPlatform
      provisionVMAgent: true
      ssh:
        publicKeys:
          - keyData: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK0wmN/Cr3JXqmLW7u+g9pTh+wyqDHpSQEQQ5ZJYHjqh catalog-test"
            path: "/home/azureuser/.ssh/authorized_keys"
  priority: Regular
  storageProfile:
    dataDisks:
      - caching: ReadWrite
        createOption: Attach
        lun: 0
        managedDisk:
          reference:
            armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Compute/disks/vm-nvme-data
        writeAcceleratorEnabled: false
    diskControllerType: NVMe
    imageReference:
      offer: "ubuntu-24_04-lts"
      publisher: "Canonical"
      sku: "server"
      version: "latest"
    osDisk:
      caching: ReadWrite
      createOption: FromImage
      deleteOption: Delete
      managedDisk:
        storageAccountType: Standard_LRS
      osType: Linux
      writeAcceleratorEnabled: false
  zones:
    - "1"
