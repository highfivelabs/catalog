# For an apply against the fake cloud (docs/azure.md, "8. Charts"): a Linux
# machine in the fake cloud's resource group with an interface (and a
# public IP it makes), a managed data disk and an extension. Only Azure
# Service Operator's kinds so far, though the fake-cloud run installs the
# aso-extensions manager beside ASO too (hack/asox-manager.sh).
name: catalog-vm
location: eastus2
resource_group_name: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg
zone: "1"
os_type: Linux
sku_size: Standard_B2s
encryption_at_host_enabled: false
source_image_reference: {publisher: Canonical, offer: ubuntu-24_04-lts, sku: server, version: latest}
os_disk: {caching: ReadWrite, storage_account_type: Standard_LRS}
account_credentials:
  admin_credentials: {ssh_keys: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK0wmN/Cr3JXqmLW7u+g9pTh+wyqDHpSQEQQ5ZJYHjqh catalog-test"], generate_admin_password_or_ssh_key: false}
tags: {catalog: mock}
network_interfaces:
  nic0:
    name: catalog-vm-nic
    ip_configurations:
      ipc0:
        name: ipconfig1
        private_ip_subnet_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/virtualNetworks/vnet/subnets/default
        create_public_ip_address: true
        public_ip_address_name: catalog-vm-pip
public_ip_configuration_details: {zones: ["1"]}
data_disk_managed_disks:
  data: {name: catalog-vm-data, lun: 0, caching: ReadWrite, storage_account_type: Standard_LRS, disk_size_gb: 4}
extensions:
  script:
    name: hello
    publisher: Microsoft.Azure.Extensions
    type: CustomScript
    type_handler_version: "2.1"
    settings: '{"commandToExecute":"echo hello"}'
