# A Linux machine with password sign-in: the deprecated admin_password, a
# reference to a Kubernetes Secret (docs/secrets.md), and
# disable_password_authentication false; no SSH key.
name: vm-pw
location: eastus2
resource_group_name: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
zone: "1"
os_type: Linux
sku_size: Standard_B2s
encryption_at_host_enabled: false
source_image_reference: {publisher: Canonical, offer: ubuntu-24_04-lts, sku: server, version: latest}
admin_username: vmadmin
admin_password: {secretName: vm-pw-admin, key: password}
disable_password_authentication: false
network_interfaces:
  nic0:
    name: vm-pw-nic
    ip_configurations:
      ipc0: {name: ipconfig1, private_ip_subnet_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet/subnets/default}
