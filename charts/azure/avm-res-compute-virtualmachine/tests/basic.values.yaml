# The module README's Linux example, smallest form: an Ubuntu machine in a
# group by name, one network interface in an existing subnet, an SSH public
# key (generating one is refused: it makes a private key).
name: vm-example
location: eastus2
resource_group_name: rg-example
subscription_id: 00000000-0000-0000-0000-000000000000
zone: "1"
os_type: Linux
sku_size: Standard_B2s
encryption_at_host_enabled: false
source_image_reference: {publisher: Canonical, offer: ubuntu-24_04-lts, sku: server, version: latest}
account_credentials:
  admin_credentials: {username: azureuser, ssh_keys: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK0wmN/Cr3JXqmLW7u+g9pTh+wyqDHpSQEQQ5ZJYHjqh catalog-test"], generate_admin_password_or_ssh_key: false}
network_interfaces:
  nic0:
    name: vm-example-nic
    ip_configurations:
      ipc0: {name: ipconfig1, private_ip_subnet_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet/subnets/default}
