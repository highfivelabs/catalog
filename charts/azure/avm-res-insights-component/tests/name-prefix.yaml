#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every
# object this chart renders carries the namePrefix in its Azure name
# (spec.azureName, nameFields below), except the kinds listed here, each with
# the reason it cannot collide with another Instance's.
exempt:
  PricingPlan: "Azure fixes its name (current), inside the component, whose name carries the prefix"
  PrivateLinkScopesScopedResource: "named inside the private link scope by the component's name (which carries the prefix) or the entry's name"
  RoleAssignment: "its name is a GUID (a stable UUID ASO makes, or the entry's name), scoped to the component"
  ManagementLock: "named inside the component it locks, whose name carries the prefix (the module's lock-<name>)"
  DiagnosticSetting: "named on the component it watches (the module's diag-<name>), whose name carries the prefix"
nameFields:
  Component: azureName
