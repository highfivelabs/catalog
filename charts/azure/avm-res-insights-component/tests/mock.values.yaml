# For an apply against the fake cloud (docs/azure.md, "8. Charts"): a web
# component with a small daily cap in the fake cloud's resource group (the
# fake keeps references as sent, so the workspace need not exist), with
# the profiler's linked storage account (aso-extensions).
name: catalog-appi
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg
workspace_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.OperationalInsights/workspaces/catalog-law
daily_data_cap_in_gb: 1
retention_in_days: 30
tags: {catalog: mock}
linked_storage_account:
  profiler: {resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Storage/storageAccounts/catalogst}
