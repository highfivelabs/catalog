#
# The Bundt Package for this chart. Outputs are the module's declared
# outputs, selected from the live objects (resources.<id>) and the
# component's values (inputs). resource_id, app_id, connection_string and
# instrumentation_key come from ASO's status of the component; name is its
# Azure name as the chart computes it. The module's deprecated resource
# output (the former azurerm object) is not an output.
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: azure-avm-res-insights-component
spec:
  version: 0.2.0
  engine: helm
  providers: [aso]
  outputs:
    name: >-
      ('component' in inputs.names && inputs.names.component != '' ? inputs.names.component : (inputs.namePrefix != '' ? inputs.namePrefix + '-' : '') + inputs.name)
    resource_id: resources.component.status.id
    app_id: resources.component.status.AppId
    connection_string: resources.component.status.ConnectionString
    instrumentation_key: resources.component.status.InstrumentationKey
