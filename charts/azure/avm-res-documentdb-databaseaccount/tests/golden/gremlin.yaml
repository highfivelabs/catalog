apiVersion: documentdb.azure.hfl.dev/v20240815
kind: DatabaseAccountsGremlinDatabasesGraph
metadata:
  name: gremlin-cosmos-graph-database-with-graphs-graph-with-i-cdf76db3
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "gremlin"
    app.kubernetes.io/name: avm-res-documentdb-databaseaccount
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "gremlin_graph:database_with_graphs/graph_with_index_policy"
spec:
  azureName: "graph_with_index_policy"
  owner:
    name: gremlin-cosmos-gremlindb-database-with-graphs-20825b8b
  resource:
    id: "graph_with_index_policy"
    conflictResolutionPolicy:
      mode: LastWriterWins
      conflictResolutionPath: "/_ts"
    indexingPolicy:
      automatic: true
      compositeIndexes:
        -
          - path: "/name"
            order: ascending
          - path: "/age"
            order: descending
      excludedPaths:
        - path: "/excluded/*"
        - path: "/\"_etag\"/?"
      includedPaths:
        - path: "/"
        - path: "/included/*"
      indexingMode: consistent
      spatialIndexes:
        - path: "/location/*"
          types: [Point, LineString, Polygon, MultiPolygon]
    partitionKey:
      kind: Hash
      paths: ["/partitionKey"]
    uniqueKeyPolicy:
      uniqueKeys:
        - paths:
            - "/email"
