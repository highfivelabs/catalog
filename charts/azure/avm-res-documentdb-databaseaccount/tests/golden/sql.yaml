# Source: avm-res-documentdb-databaseaccount/templates/sql.yaml
apiVersion: documentdb.azure.com/v1api20240815
kind: SqlDatabaseContainer
metadata:
  name: sql-cosmos-sqlc-database1-container1
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "sql"
    app.kubernetes.io/name: avm-res-documentdb-databaseaccount
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "sql_container:database1/container1"
spec:
  azureName: "container1"
  owner:
    name: sql-cosmos-sqldb-database1
  options:
    throughput: 400
  resource:
    id: "container1"
    analyticalStorageTtl: 1000
    conflictResolutionPolicy:
      mode: LastWriterWins
      conflictResolutionPath: "/customProperty"
    defaultTtl: 1000
    indexingPolicy:
      indexingMode: consistent
      compositeIndexes:
        -
          - path: "/field1"
            order: ascending
          - path: "/field2"
            order: descending
      excludedPaths:
        - path: "/excluded/*"
      includedPaths:
        - path: "/*"
      spatialIndexes:
        - path: "/location/*"
          types: [Point, LineString, Polygon, MultiPolygon]
    partitionKey:
      kind: Hash
      paths:
        - "/id"
      version: 2
    uniqueKeyPolicy:
      uniqueKeys:
        - paths:
            - "/field1"
            - "/field2"
---
