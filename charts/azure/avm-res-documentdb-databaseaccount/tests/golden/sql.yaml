    autoscaleSettings:
      maxThroughput: 4000
  resource:
    id: "custom"
    conflictResolutionPolicy:
      mode: Custom
      conflictResolutionProcedure: "dbs/{database1}/colls/{custom}/sprocs/{resolver}"
