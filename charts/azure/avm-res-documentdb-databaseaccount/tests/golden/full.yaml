# Source: avm-res-documentdb-databaseaccount/templates/main.yaml
apiVersion: documentdb.azure.com/v1api20240815
kind: DatabaseAccount
metadata:
  name: full-cosmos
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: avm-res-documentdb-databaseaccount
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "account"
spec:
  azureName: "cosmos-full"
  location: "eastus2"
  owner:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example"
  analyticalStorageConfiguration:
    schemaType: FullFidelity
  backupPolicy:
    periodic:
      type: Periodic
      periodicModeProperties:
        backupIntervalInMinutes: 120
        backupRetentionIntervalInHours: 48
        backupStorageRedundancy: Local
  capabilities:
    - name: "DisableRateLimitingResponses"
    - name: "EnableNoSQLVectorSearch"
  capacity:
    totalThroughputLimit: 10000
  consistencyPolicy:
    defaultConsistencyLevel: Session
  cors:
    - allowedHeaders: "Custom-Header,x-ms-meta-data"
      allowedMethods: "GET,POST"
      allowedOrigins: "https://contoso.example"
      exposedHeaders: "x-ms-meta-data"
      maxAgeInSeconds: 100
  databaseAccountOfferType: Standard
  defaultIdentity: "UserAssignedIdentity=/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uai-cosmos"
  disableKeyBasedMetadataWriteAccess: false
  disableLocalAuth: false
  enableAnalyticalStorage: true
  enableAutomaticFailover: false
  enableBurstCapacity: true
  enableFreeTier: false
  enableMultipleWriteLocations: true
  enablePartitionMerge: false
  identity:
    type: SystemAssigned,UserAssigned
    userAssignedIdentities:
      - reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uai-cosmos"
  ipRules:
    - ipAddressOrRange: "198.51.100.7"
    - ipAddressOrRange: "203.0.113.0/24"
  isVirtualNetworkFilterEnabled: true
  keyVaultKeyUri: "https://kv-example.vault.azure.net/keys/cosmos-key"
  kind: GlobalDocumentDB
  locations:
    - locationName: "eastus2"
      failoverPriority: 0
      isZoneRedundant: true
    - locationName: "westus3"
      failoverPriority: 1
      isZoneRedundant: false
  minimalTlsVersion: Tls12
  networkAclBypass: AzureServices
  networkAclBypassResourceReferences:
    - armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Synapse/workspaces/syn"
  publicNetworkAccess: Enabled
  tags:
    env: test
  virtualNetworkRules:
    - reference:
        armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet/subnets/app"
      ignoreMissingVNetServiceEndpoint: false
---
