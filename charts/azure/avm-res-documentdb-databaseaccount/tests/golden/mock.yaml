# Source: avm-res-documentdb-databaseaccount/templates/main.yaml
apiVersion: documentdb.azure.com/v1api20240815
kind: DatabaseAccount
metadata:
  name: mock-cosmos
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: avm-res-documentdb-databaseaccount
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "account"
spec:
  azureName: "catalog-cosmos"
  location: "eastus2"
  owner:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg"
  backupPolicy:
    continuous:
      type: Continuous
      continuousModeProperties:
        tier: Continuous30Days
  capabilities:
    - name: "EnableServerless"
  capacity:
    totalThroughputLimit: -1
  consistencyPolicy:
    defaultConsistencyLevel: BoundedStaleness
    maxIntervalInSeconds: 5
    maxStalenessPrefix: 100
  databaseAccountOfferType: Standard
  defaultIdentity: FirstPartyIdentity
  disableKeyBasedMetadataWriteAccess: true
  disableLocalAuth: false
  enableAnalyticalStorage: false
  enableAutomaticFailover: true
  enableBurstCapacity: false
  enableFreeTier: false
  enableMultipleWriteLocations: false
  enablePartitionMerge: false
  isVirtualNetworkFilterEnabled: false
  kind: GlobalDocumentDB
  locations:
    - locationName: "eastus2"
      failoverPriority: 0
      isZoneRedundant: false
  minimalTlsVersion: Tls12
  networkAclBypass: None
  publicNetworkAccess: Enabled
  tags:
    catalog: mock
