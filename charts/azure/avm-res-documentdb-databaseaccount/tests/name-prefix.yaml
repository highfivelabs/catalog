#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every
# object this chart renders carries the namePrefix in its Azure name
# (spec.azureName, nameFields below), except the kinds listed here, each with
# the reason it cannot collide with another Instance's.
exempt:
  SqlDatabase: "named inside its account, whose name carries the prefix, by the entry's name"
  SqlDatabaseContainer: "named inside its database, by the entry's name"
  SqlDatabaseContainerStoredProcedure: "named inside its container, by the entry's name"
  SqlDatabaseContainerTrigger: "named inside its container, by the entry's name"
  SqlDatabaseContainerUserDefinedFunction: "named inside its container, by the entry's name"
  MongodbDatabase: "named inside its account, whose name carries the prefix, by the entry's name"
  MongodbDatabaseCollection: "named inside its database, by the entry's name"
  DatabaseAccountsGremlinDatabase: "named inside its account, whose name carries the prefix, by the entry's name"
  DatabaseAccountsGremlinDatabasesGraph: "named inside its database, by the entry's name"
  DatabaseAccountsService: "Azure fixes the name (SqlDedicatedGateway), inside the account"
  PrivateEndpointsPrivateDnsZoneGroup: "named inside its private endpoint (default), as the module names it"
  RoleAssignment: "its name is a GUID (a stable UUID ASO makes), scoped to the account or endpoint"
  ManagementLock: "named inside the resource it locks, whose name carries the prefix (the module's lock-<kind>)"
  DiagnosticSetting: "named on the account it watches (the module's diag-<key>)"
nameFields:
  DatabaseAccount: azureName
  PrivateEndpoint: azureName
