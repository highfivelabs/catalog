apiVersion: network.azure.com/v20250301
kind: LoadBalancer
metadata:
  name: full-lb
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: avm-res-network-loadbalancer
    app.kubernetes.io/version: "0.1.0"
    hfl.dev/team: "net"
  annotations:
    hfl.dev/id: "load_balancer"
spec:
  azureName: "lb-full"
  location: "eastus2"
  owner:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example"
  sku:
    name: Standard
    tier: Regional
  frontendIPConfigurations:
    - name: "fe-existing"
      privateIPAllocationMethod: Dynamic
      publicIPAddress:
        reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/publicIPAddresses/pip-existing"
    - name: "fe-private"
      privateIPAddress: "10.0.1.10"
      privateIPAddressVersion: IPv4
      privateIPAllocationMethod: Static
      subnet:
        reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet/subnets/snet-lb"
      zones:
        - "1"
    - name: "fe-public"
      privateIPAllocationMethod: Dynamic
      publicIPAddress:
        reference:
          group: network.azure.com
          kind: PublicIPAddress
          name: full-pip-public
  backendAddressPools:
    - name: "bepool-1"
      virtualNetwork:
        reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet"
    - name: "be-ip"
      loadBalancerBackendAddresses:
        - ipAddress: 10.1.0.4
          name: addr-1
          virtualNetwork:
            reference:
              armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet
      virtualNetwork:
        reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet2"
    - name: "be-web"
      loadBalancerBackendAddresses:
        - ipAddress: 10.0.2.5
          name: addr-2
          virtualNetwork:
            reference:
              armId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet
      virtualNetwork:
        reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet"
  probes:
    - name: "probe-http"
      intervalInSeconds: 15
      numberOfProbes: 2
      port: 80
      probeThreshold: 1
      protocol: Http
      requestPath: "/healthz"
    - name: "probe-tcp"
      intervalInSeconds: 5
      numberOfProbes: 3
      port: 443
      probeThreshold: 2
      protocol: Tcp
  loadBalancingRules:
    - name: "rule-https"
      backendAddressPool:
        reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/loadBalancers/lb-full/backendAddressPools/be-web"
      backendPort: 8443
      disableOutboundSnat: true
      enableFloatingIP: false
      enableTcpReset: true
      frontendIPConfiguration:
        reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/loadBalancers/lb-full/frontendIPConfigurations/fe-public"
      frontendPort: 443
      idleTimeoutInMinutes: 15
      loadDistribution: SourceIP
      probe:
        reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/loadBalancers/lb-full/probes/probe-tcp"
      protocol: Tcp
    - name: "rule-internal"
      backendAddressPool:
        reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/loadBalancers/lb-full/backendAddressPools/be-ip"
      backendPort: 80
      disableOutboundSnat: false
      enableFloatingIP: false
      enableTcpReset: false
      frontendIPConfiguration:
        reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/loadBalancers/lb-full/frontendIPConfigurations/fe-private"
      frontendPort: 80
      idleTimeoutInMinutes: 4
      loadDistribution: Default
      probe:
        reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/loadBalancers/lb-full/probes/probe-http"
      protocol: Tcp
  inboundNatRules:
    - name: "nat-range"
      backendAddressPool:
        reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/loadBalancers/lb-full/backendAddressPools/be-web"
      backendPort: 3389
      enableFloatingIP: false
      enableTcpReset: false
      frontendIPConfiguration:
        reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/loadBalancers/lb-full/frontendIPConfigurations/fe-public"
      frontendPortRangeEnd: 50100
      frontendPortRangeStart: 50000
      idleTimeoutInMinutes: 4
      protocol: Tcp
    - name: "nat-ssh"
      backendPort: 22
      enableFloatingIP: false
      enableTcpReset: true
      frontendIPConfiguration:
        reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/loadBalancers/lb-full/frontendIPConfigurations/fe-public"
      frontendPort: 2222
      idleTimeoutInMinutes: 10
      protocol: Tcp
  inboundNatPools:
    - name: "nat-pool-rdp"
      backendPort: 3389
      enableFloatingIP: false
      enableTcpReset: false
      frontendIPConfiguration:
        reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/loadBalancers/lb-full/frontendIPConfigurations/fe-existing"
      frontendPortRangeEnd: 3100
      frontendPortRangeStart: 3000
      idleTimeoutInMinutes: 4
      protocol: Tcp
  outboundRules:
    - name: "outbound-web"
      allocatedOutboundPorts: 2048
      backendAddressPool:
        reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/loadBalancers/lb-full/backendAddressPools/be-web"
      enableTcpReset: true
      frontendIPConfigurations:
        - reference:
            armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/loadBalancers/lb-full/frontendIPConfigurations/fe-public"
      idleTimeoutInMinutes: 10
      protocol: All
  tags:
    env: dev
    owner: net
