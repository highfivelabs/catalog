# The module README's default shape: an internal Standard load balancer
# with one private frontend in a subnet, a backend pool, a TCP probe and a
# rule.
name: lb-example
location: eastus2
resource_group_name: rg-example
subscription_id: 00000000-0000-0000-0000-000000000000
frontend_subnet_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example/providers/Microsoft.Network/virtualNetworks/vnet/subnets/snet-lb
frontend_ip_configurations:
  fe1: {name: myFrontend}
backend_address_pools:
  pool1: {name: myBackendPool}
lb_probes:
  tcp1: {name: tcp1, protocol: Tcp, port: 80}
lb_rules:
  http:
    name: myHTTPRule
    frontend_ip_configuration_name: myFrontend
    backend_address_pool_object_names: [pool1]
    frontend_port: 80
    backend_port: 80
    probe_object_name: tcp1
