# Whole names from a naming convention: names.loadBalancer is used as
# given; the namePrefix goes on no name set in full (a public IP the chart
# makes would take it: full.yaml). labels stay in Kubernetes; tags reach
# Azure.
name: web
location: eastus2
resource_group_name: rg-shop-dev
subscription_id: 00000000-0000-0000-0000-000000000000
namePrefix: shop-dev
names: {loadBalancer: lbe-shop-dev-web}
labels: {hfl.dev/team: shop}
tags: {team: shop}
frontend_ip_configurations:
  pub: {name: fe, public_ip_address_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-shop-dev/providers/Microsoft.Network/publicIPAddresses/pip-shop-dev-web}
