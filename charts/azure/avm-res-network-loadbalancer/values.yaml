#
# Every variable of avm-res-network-loadbalancer v0.5.0 (variables.tf), with
# its default, and the chart's own values first. README.md maps each one to
# Azure Service Operator.

# Not Terraform variables.
# names.loadBalancer: the load balancer's name in full; no prefix.
names: {}
# A prefix for the load balancer's and the public IPs' names: <namePrefix>-<name>.
namePrefix: ""
# Kubernetes labels on every object; never sent to Azure (tags are).
labels: {}
# DELETE (default) or ABANDON; PREVENT is refused (use lock).
deletion_policy: null
# The subscription of resource_group_name (and of a public IP's group)
# when it is a name: ASO's owner is a resource ID.
subscription_id: ""

# Module variables (alphabetical, required ones included).
backend_address_pool_addresses: {}
backend_address_pool_configuration: null
backend_address_pool_network_interfaces: {}
backend_address_pools: {}
diagnostic_settings: {}
edge_zone: null
enable_telemetry: true
frontend_ip_configurations: {}
frontend_subnet_resource_id: null
lb_nat_pools: {}
lb_nat_rules: {}
lb_outbound_rules: {}
lb_probes: {}
lb_rules: {}
location: ""
lock: null
name: null
public_ip_address_configuration: {}
resource_group_name: ""
role_assignments: {}
sku: Standard
sku_tier: Regional
tags: null
