# For an apply against the fake cloud (docs/azure.md, "8. Charts"): a
# Free-tier cluster with one small node, an OIDC issuer and a user agent
# pool, in the fake cloud's resource group.
name: catalog-aks
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg
dns_prefix: catalogaks
sku: {name: Base, tier: Free}
tags: {catalog: mock}
oidc_issuer_profile: {enabled: true}
default_agent_pool: {vm_size: Standard_D2ds_v5, count_of: 1}
agent_pools:
  user: {name: user, vm_size: Standard_D2ds_v5, count_of: 1, mode: User, os_type: Linux}
maintenanceconfiguration:
  default:
    name: default
    time_in_week: [{day: Sunday, hour_slots: [2, 3]}]
