#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every
# object this chart renders carries the namePrefix in its Azure name
# (spec.azureName, nameFields below), except the kinds listed here, each with
# the reason it cannot collide with another Instance's.
exempt:
  ManagedClustersAgentPool: "named inside the cluster, whose name carries the prefix (and an agent pool name is at most 12 characters)"
  MaintenanceConfiguration: "named inside the cluster, whose name carries the prefix; Azure takes only default, aksManagedAutoUpgradeSchedule and aksManagedNodeOSUpgradeSchedule"
  ManagedClustersManagedNamespace: "a Kubernetes namespace inside the cluster, whose name carries the prefix"
  RoleAssignment: "its name is a GUID (a stable UUID ASO makes), scoped to the cluster"
  ManagementLock: "named inside the cluster it locks, whose name carries the prefix (the module's lock-<kind>)"
  DiagnosticSetting: "named inside the cluster it is on, whose name carries the prefix"
  DataCollectionRuleAssociation: "named inside the cluster it is on, whose name carries the prefix (dcr-<cluster>, msci-<cluster>, configurationAccessEndpoint)"
  PrivateEndpointsPrivateDnsZoneGroup: "named inside its private endpoint (default), as the module names it"
nameFields:
  ManagedCluster: azureName
  PrivateEndpoint: azureName
  DataCollectionEndpoint: azureName
  DataCollectionRule: azureName
  PrometheusRuleGroup: azureName
  ActionGroup: azureName
  MetricAlert: azureName
