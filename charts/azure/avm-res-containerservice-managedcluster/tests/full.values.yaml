# Every input the chart maps that a stable (2026-05-01) cluster takes: a
# private cluster on Azure CNI overlay with a user-assigned identity and a
# kubelet identity, its add-ons and profiles, a second agent pool with the
# preview-only pool settings, a maintenance window, a managed namespace and
# the AVM interfaces.
name: aks-full
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-aks
kubernetes_version: "1.33"
dns_prefix: aksfull
node_resource_group: rg-aks-nodes
node_resource_group_profile: {restriction_level: ReadOnly}
sku: {name: Base, tier: Standard}
support_plan: KubernetesOfficial
kind: Base
public_network_access: Enabled
disable_local_accounts: true
enable_rbac: true
disk_encryption_set_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-aks/providers/Microsoft.Compute/diskEncryptionSets/des
tags: {team: platform}
managed_identities:
  system_assigned: false
  user_assigned_resource_ids:
    - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-aks/providers/Microsoft.ManagedIdentity/userAssignedIdentities/aks-control
identity_profile:
  kubeletidentity:
    resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-aks/providers/Microsoft.ManagedIdentity/userAssignedIdentities/aks-kubelet
aad_profile:
  admin_group_object_ids: [11111111-1111-1111-1111-111111111111]
  enable_azure_rbac: true
  managed: true
  tenant_id: 22222222-2222-2222-2222-222222222222
addon_profile_azure_policy: {enabled: true}
addon_profile_confidential_computing: {enabled: true}
addon_profile_ingress_application_gateway:
  enabled: true
  config:
    application_gateway_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-aks/providers/Microsoft.Network/applicationGateways/agw
addon_profile_key_vault_secrets_provider:
  enabled: true
  config: {enable_secret_rotation: true, rotation_poll_interval: 2m}
addon_profile_oms_agent:
  enabled: true
  config:
    log_analytics_workspace_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-aks/providers/Microsoft.OperationalInsights/workspaces/law
    use_aad_auth: true
addon_profiles_extra:
  openServiceMesh: {enabled: false}
ai_toolchain_operator_profile: {enabled: false}
api_server_access_profile:
  authorized_ip_ranges: []
  disable_run_command: true
  enable_private_cluster: true
  enable_private_cluster_public_fqdn: false
  enable_vnet_integration: true
  private_dns_zone: system
  subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-aks/providers/Microsoft.Network/virtualNetworks/vnet/subnets/apiserver
auto_scaler_profile:
  balance_similar_node_groups: "true"
  expander: least-waste
  max_graceful_termination_sec: "600"
  scan_interval: 10s
  skip_nodes_with_system_pods: "true"
  daemonset_eviction_for_empty_nodes: false
auto_upgrade_profile: {node_os_upgrade_channel: NodeImage, upgrade_channel: stable}
azure_monitor_profile:
  metrics:
    enabled: true
    kube_state_metrics: {metric_annotations_allow_list: "pods=[app]", metric_labels_allowlist: "pods=[team]"}
bootstrap_profile:
  artifact_source: Cache
  container_registry_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-aks/providers/Microsoft.ContainerRegistry/registries/acr
http_proxy_config:
  http_proxy: http://proxy.example:3128
  https_proxy: http://proxy.example:3128
  no_proxy: [localhost, 10.0.0.0/8]
ingress_profile:
  gateway_api: {installation: Standard}
  web_app_routing:
    enabled: true
    dns_zone_resource_ids:
      - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-aks/providers/Microsoft.Network/dnsZones/example.com
    nginx: {default_ingress_controller_type: Internal}
    gateway_api_implementations:
      app_routing_istio: {mode: Enabled}
linux_profile:
  admin_username: azureuser
  ssh:
    public_keys:
      - key_data: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleKeyOnly example
metrics_profile: {cost_analysis: {enabled: true}}
network_profile:
  network_plugin: azure
  network_plugin_mode: overlay
  network_dataplane: cilium
  network_policy: cilium
  outbound_type: loadBalancer
  load_balancer_sku: standard
  pod_cidr: 192.168.0.0/16
  service_cidr: 10.2.0.0/16
  dns_service_ip: 10.2.0.10
  ip_families: [IPv4]
  advanced_networking:
    enabled: true
    observability: {enabled: true}
    security: {enabled: true, advanced_network_policies: FQDN}
  load_balancer_profile:
    idle_timeout_in_minutes: 10
    managed_outbound_ips: {count: 2}
    outbound_ip_prefixes:
      public_ip_prefixes:
        - id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-aks/providers/Microsoft.Network/publicIPPrefixes/egress
  static_egress_gateway_profile: {enabled: false}
node_provisioning_profile: {mode: Manual, default_node_pools: Auto}
oidc_issuer_profile: {enabled: true}
pod_identity_profile: {enabled: false}
private_link_resources:
  - name: management
    group_id: management
    type: Microsoft.ContainerService/managedClusters/privateLinkResources
    id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-aks/providers/Microsoft.ContainerService/managedClusters/aks-full/privateLinkResources/management
    required_members: [management]
security_profile:
  workload_identity: {enabled: true}
  image_cleaner: {enabled: true, interval_hours: 48}
  defender:
    log_analytics_workspace_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-aks/providers/Microsoft.OperationalInsights/workspaces/law
    security_monitoring: {enabled: true}
  azure_key_vault_kms:
    enabled: true
    key_id: https://kv.vault.azure.net/keys/etcd/0123456789abcdef0123456789abcdef
    key_vault_network_access: Private
    key_vault_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-aks/providers/Microsoft.KeyVault/vaults/kv
service_mesh_profile:
  mode: Istio
  istio:
    revisions: [asm-1-25]
    components:
      ingress_gateways: [{enabled: true, mode: Internal}]
      egress_gateways: [{enabled: true, name: egress, namespace: aks-istio-egress}]
    certificate_authority:
      plugin:
        key_vault_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-aks/providers/Microsoft.KeyVault/vaults/kv
        cert_object_name: ca-cert
        key_object_name: ca-key
        root_cert_object_name: root-cert
        cert_chain_object_name: cert-chain
storage_profile:
  blob_csi_driver: {enabled: true}
  disk_csi_driver: {enabled: true}
  file_csi_driver: {enabled: false}
  snapshot_controller: {enabled: true}
upgrade_settings:
  override_settings: {force_upgrade: false, until: "2026-12-31T00:00:00Z"}
windows_profile:
  admin_username: winadmin
  enable_csi_proxy: true
  license_type: None
workload_auto_scaler_profile:
  keda: {enabled: true}
  vertical_pod_autoscaler: {enabled: true}
default_agent_pool:
  name: system
  vm_size: Standard_D4ds_v5
  min_count: 2
  max_count: 5
  enable_auto_scaling: true
  availability_zones: ["1", "2", "3"]
  os_sku: AzureLinux
  os_disk_type: Ephemeral
  os_disk_size_gb: 64
  max_pods: 50
  vnet_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-aks/providers/Microsoft.Network/virtualNetworks/vnet/subnets/nodes
  node_labels: {pool: system}
  upgrade_settings: {max_surge: "33%", drain_timeout_in_minutes: 30}
  kubelet_config: {container_log_max_size_mb: 50, image_gc_high_threshold: 85}
  security_profile: {ssh_access: Disabled}
  artifact_streaming_profile: {enabled: false}
agent_pools:
  user:
    name: user
    vm_size: Standard_D8ds_v5
    count_of: 2
    mode: User
    os_type: Linux
    os_sku: Ubuntu2404
    node_taints: ["workload=batch:NoSchedule"]
    node_labels: {workload: batch}
    tags: {pool: user}
    pod_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-aks/providers/Microsoft.Network/virtualNetworks/vnet/subnets/pods
    kubelet_config: {seccomp_default: RuntimeDefault, cpu_manager_policy: static}
    linux_os_config:
      swap_file_size_mb: 1024
      sysctls: {net_core_somaxconn: 4096, net_ipv4_tcp_tw_reuse: true, vm_max_map_count: 262144}
    upgrade_settings: {max_surge: "1", max_blocked_nodes: "1"}
    upgrade_strategy: Rolling
    node_initialization_taints: ["init=true:NoSchedule"]
    gpu_profile: {driver: None}
    local_dns_profile:
      mode: Preferred
      kube_dns_overrides:
        .: {forward_destination: ClusterCoreDNS, protocol: PreferUDP, cache_duration_in_seconds: 3600}
    network_profile:
      allowed_host_ports: [{port_start: 8000, port_end: 8100, protocol: TCP}]
      node_public_ip_tags: [{ip_tag_type: RoutingPreference, tag: Internet}]
  spot:
    name: spot
    vm_size: Standard_D4ds_v5
    mode: User
    scale_set_priority: Spot
    scale_set_eviction_policy: Delete
    spot_max_price: -1
    min_count: 0
    max_count: 3
    enable_auto_scaling: true
maintenanceconfiguration:
  autoupgrade:
    name: aksManagedAutoUpgradeSchedule
    maintenance_window:
      duration_hours: 4
      schedule: {weekly: {day_of_week: Sunday, interval_weeks: 1}}
      start_time: "02:00"
      utc_offset: "+00:00"
      not_allowed_dates: [{start: "2026-12-24", end: "2026-12-26"}]
  default:
    name: default
    time_in_week: [{day: Saturday, hour_slots: [1, 2, 3]}]
    not_allowed_time: [{start: "2026-12-31T00:00:00Z", end: "2027-01-01T00:00:00Z"}]
namespace:
  team:
    name: team-a
    default_resource_quota: {cpu_request: "4", memory_request: 8Gi}
    default_network_policy: {ingress: AllowSameNamespace, egress: AllowAll}
    adoption_policy: IfIdentical
    delete_policy: Keep
    labels: {team: a}
    annotations: {owner: team-a}
    tags: {team: a}
lock: {kind: CanNotDelete}
role_assignments:
  admins:
    principal_id: 33333333-3333-3333-3333-333333333333
    role_definition_id_or_name: Azure Kubernetes Service RBAC Cluster Admin
    principal_type: Group
diagnostic_settings:
  law:
    workspace_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-aks/providers/Microsoft.OperationalInsights/workspaces/law
    log_groups: [audit]
  categories:
    name: kube-audit
    log_categories: [kube-audit, kube-apiserver]
    log_groups: []
    metric_categories: []
    storage_account_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-aks/providers/Microsoft.Storage/storageAccounts/logs
