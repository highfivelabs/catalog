# Whole names from a naming convention: names.managedCluster is used as
# given; the namePrefix goes on no name set in full. labels stay in
# Kubernetes; tags reach Azure.
name: shop
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-shop-dev
namePrefix: shop-dev
names: {managedCluster: aks-shop-dev-eus2}
labels: {hfl.dev/team: shop}
tags: {team: shop}
