# An AKS Automatic cluster: no agent pools (AKS manages them), and only the
# properties the module sends for one.
name: aks-auto
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-aks
sku: {name: Automatic, tier: Standard}
kubernetes_version: "1.33"
dns_prefix: aksauto
addon_profile_key_vault_secrets_provider: {enabled: true}
network_profile: {outbound_type: managedNATGateway, pod_cidr: 10.244.0.0/16, network_plugin: azure}
hosted_system_profile:
  enabled: true
  node_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-aks/providers/Microsoft.Network/virtualNetworks/vnet/subnets/nodes
  system_node_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-aks/providers/Microsoft.Network/virtualNetworks/vnet/subnets/system
support_plan: KubernetesOfficial
