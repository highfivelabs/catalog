        pod != \"\", job = \"kube-state-metrics\"})\nor sum by (container, pod, namespace,
        cluster, microsoft_resourceid) (kube_pod_init_status_restarts_total{container
        != \"\", pod != \"\", job = \"kube-state-metrics\"})\n)\n* on (pod, namespace,
