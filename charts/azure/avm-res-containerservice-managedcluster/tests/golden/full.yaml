        container_id != \"\", job = \"kube-state-metrics\"})\nor sum by (container, pod,
        namespace, cluster, microsoft_resourceid) (kube_pod_init_container_info{container
        != \"\", pod != \"\", container_id != \"\", job = \"kube-state-metrics\"})\n)\n*
