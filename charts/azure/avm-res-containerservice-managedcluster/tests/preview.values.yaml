# The settings only a preview API has: the module then takes
# managedClusters@2026-03-02-preview, the chart ASO's 2025-10-02-preview.
name: aks-preview
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-aks
dns_prefix: akspreview
network_profile: {network_plugin: azure, network_plugin_mode: overlay}
kube_proxy_config:
  enabled: true
  mode: IPVS
  ipvs_config: {scheduler: RoundRobin, tcp_timeout_seconds: 900}
ingress_profile:
  application_load_balancer: {enabled: true}
security_profile:
  image_integrity: {enabled: true}
  workload_identity: {enabled: true}
oidc_issuer_profile: {enabled: true}
