# For an apply against the fake cloud: a Free-tier cluster with one small
# Linux node and a Windows user pool, the Windows nodes' admin password a
# reference to a Secret the harness makes before the apply with a random
# value (hack/test-secret.sh; nothing committed), as the line below asks.
# secret: catalog-aks-windows random
name: catalog-akswin
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg
dns_prefix: catalogakswin
sku: {name: Base, tier: Free}
tags: {catalog: mock}
network_profile: {network_plugin: azure}
default_agent_pool: {vm_size: Standard_D2ds_v5, count_of: 1}
agent_pools:
  win: {name: win, vm_size: Standard_D4ds_v5, count_of: 1, mode: User, os_type: Windows}
windows_profile: {admin_username: winadmin}
windows_profile_password: {secretName: catalog-aks-windows, key: value}
windows_profile_password_version: "1"
