# The cluster's secret inputs as references to Kubernetes Secrets in the
# component's namespace (docs/secrets.md), put there by External Secrets
# Operator: the Windows nodes' admin password (with its version, required
# with it and doing nothing), a service principal's secret, and a legacy
# AAD integration's server application secret. A Windows user pool beside
# the default one. No secret value is in the values.
name: aks-secrets
location: eastus2
parent_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
default_agent_pool:
  vm_size: Standard_D2ds_v5
agent_pools:
  win: {name: win, vm_size: Standard_D4ds_v5, count_of: 1, mode: User, os_type: Windows}
network_profile: {network_plugin: azure}
windows_profile: {admin_username: winadmin}
windows_profile_password: {secretName: aks-windows, key: password}
windows_profile_password_version: "1"
service_principal_profile:
  client_id: 33333333-3333-3333-3333-333333333333
  secret: {secretName: aks-sp, key: client-secret}
aad_profile:
  managed: false
  client_app_id: 44444444-4444-4444-4444-444444444444
  server_app_id: 55555555-5555-5555-5555-555555555555
  server_app_secret: {secretName: aks-aad, key: server-app-secret}
  tenant_id: 22222222-2222-2222-2222-222222222222
