# Whole names from a naming convention: names.server is used as given; the
# namePrefix goes on no name set in full. labels stay in Kubernetes; tags
# reach Azure.
name: orders
location: eastus2
resource_group_name: rg-shop-dev
subscription_id: 00000000-0000-0000-0000-000000000000
namePrefix: shop-dev
names: {server: sql-shop-dev-eus2}
labels: {hfl.dev/team: shop}
tags: {team: shop}
server_version: "12.0"
azuread_administrator: {azuread_authentication_only: true, login_username: dba, object_id: 33333333-4444-5555-6666-777777777777}
deletion_policy: ABANDON
lock: {kind: ReadOnly, name: keep}
databases:
  orders: {name: orders, sku_name: Basic}
