# For an apply against the fake cloud: a server with a SQL administrator
# whose password is a reference to a Secret the harness makes before the
# apply with a random value (hack/test-secret.sh; nothing committed), as
# the line below asks, and a firewall rule.
# secret: catalog-sql-admin random
name: catalog-sql-pw
location: eastus2
resource_group_name: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg
server_version: "12.0"
public_network_access_enabled: true
administrator_login: catalogadmin
administrator_login_password: {secretName: catalog-sql-admin, key: value}
tags: {catalog: mock}
firewall_rules:
  office: {start_ip_address: 203.0.113.10, end_ip_address: 203.0.113.10}
