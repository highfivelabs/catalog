# A server with a SQL administrator whose password is a reference to a
# Kubernetes Secret in the component's namespace (docs/secrets.md), put
# there by External Secrets Operator, beside an Entra administrator that is
# not the only way in. No secret value is in the values.
name: sql-password
location: eastus2
resource_group_name: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
server_version: "12.0"
administrator_login: sqladmin
administrator_login_password: {secretName: sql-admin, key: password}
azuread_administrator:
  azuread_authentication_only: false
  login_username: dba
  object_id: 00000000-0000-0000-0000-0000000000aa
