#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every
# object this chart renders carries the namePrefix in its Azure name
# (spec.azureName, nameFields below), except the kinds listed here, each with
# the reason it cannot collide with another Instance's.
exempt:
  ServersDatabase: "named inside its server, whose name carries the prefix, by the entry's name"
  ServersElasticPool: "named inside its server, whose name carries the prefix, by the entry's name"
  ServersFirewallRule: "named inside its server, whose name carries the prefix, by the entry's key"
  ServersConnectionPolicy: "the server's one connection policy (default), inside a server whose name carries the prefix"
  ServersDatabasesBackupLongTermRetentionPolicy: "a database's one policy (default), inside its database"
  ServersDatabasesBackupShortTermRetentionPolicy: "a database's one policy (default), inside its database"
  ServersDatabasesSecurityAlertPolicy: "a database's one policy (default), inside its database"
  ServersDatabasesTransparentDataEncryption: "a database's one setting (current), inside its database"
  PrivateEndpointsPrivateDnsZoneGroup: "named inside its private endpoint (default), as the module names it"
  RoleAssignment: "its name is a GUID (a stable UUID ASO makes), scoped to the resource it is on"
  ManagementLock: "named inside the resource it locks (the module's lock-<name>)"
  DiagnosticSetting: "named on the resource it watches (the module's diag-<name>)"
nameFields:
  Server: azureName
  PrivateEndpoint: azureName
