# The write-only form: administrator_login_password_wo, a reference to a
# Kubernetes Secret (docs/secrets.md), with its version (required with it,
# as the provider requires it; it does nothing, ASO sends the whole body on
# every change). No Entra administrator.
name: sql-password-wo
location: eastus2
resource_group_name: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-example
server_version: "12.0"
administrator_login: sqladmin
administrator_login_password_wo: {secretName: sql-admin, key: password}
administrator_login_password_wo_version: 1
