# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set, or accepts only in part. Read by `task
# coverage`; `task coverage-verify` renders the chart to check that each one
# is refused. kind: gap (no Azure Service Operator or aso-extensions kind or
# field; the reason names the type when a kind is missing), not-ported (one
# exists, the chart does not map it yet) or by-design (Bundt replaces it).
refused:
  - variable: administrator_login_password
    kind: by-design
    reason: "a password is a secret value, which does not belong in a component's inputs; ASO's administratorLoginPassword is a reference to a Kubernetes Secret, and how a component supplies that Secret is the builder's decision (open). Use Entra-only authentication (azuread_administrator with azuread_authentication_only: true)"
  - variable: administrator_login_password_wo
    kind: by-design
    reason: "a write-only password is a secret value, refused as administrator_login_password is"
  - variable: administrator_login_password_wo_version
    kind: by-design
    reason: "the version of administrator_login_password_wo, which is refused"
  - variable: generate_administrator_login_password
    kind: by-design
    reason: "a generated password is a secret value, refused as administrator_login_password is (the module's random_password is not ported)"
  - variable: administrator_login_password_key_vault_configuration
    kind: by-design
    reason: "it stores the administrator password, a secret value the chart does not take, in Key Vault; aso-extensions' VaultSecret takes its value from a Kubernetes Secret, and how a component supplies that Secret is the builder's decision (open)"
  - variable: databases
    kind: gap
    reason: "accepted, except import (a .bacpac import is a POST action with a storage key and an administrator password, secret values, and no ASO kind) and threat_detection_policy.storage_account_access_key (a secret value; ASO takes it only from a Kubernetes Secret) and geo_backup_enabled false on a DataWarehouse (DW) SKU (azurerm sets Microsoft.Sql/servers/databases/geoBackupPolicies for DW SKUs only; aso-extensions' ServersDatabasesGeoBackupPolicy at 3d9ba27 names its owner as sql.azure.hfl.dev Servers_Database instead of ASO's ServersDatabase and never reconciles, found against the fake cloud). managed_identities.system_assigned is accepted and ignored, as the module ignores it"
    partial: true
    fields: [import, threat_detection_policy.storage_account_access_key, geo_backup_enabled]
  - variable: firewall_rules
    kind: by-design
    reason: "accepted, but a rule's timeouts are refused: Azure Service Operator has no per-request timeouts; Bundt sets a component's time limit"
    partial: true
    fields: [timeouts]
