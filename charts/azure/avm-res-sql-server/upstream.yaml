# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set, or accepts only in part. Read by `task
# coverage`; `task coverage-verify` renders the chart to check that each one
# is refused. kind: gap (no Azure Service Operator or aso-extensions kind or
# field; the reason names the type when a kind is missing), not-ported (one
# exists, the chart does not map it yet) or by-design (Bundt replaces it).
refused:
  - variable: generate_administrator_login_password
    kind: by-design
    reason: "the catalog never generates a secret (docs/secrets.md); the password comes from a Kubernetes Secret (administrator_login_password, a reference). The module's random_password is not ported"
  - variable: administrator_login_password_key_vault_configuration
    kind: by-design
    reason: "it writes the administrator password into Key Vault, a value the chart never holds (the password is a Kubernetes Secret reference, docs/secrets.md); keep it in Key Vault and let External Secrets Operator fill the Secret instead"
  - variable: databases
    kind: gap
    reason: "accepted, except import (a .bacpac import is a POST action with a storage key and an administrator password, secret values, and no ASO kind) and threat_detection_policy.storage_account_access_key (a secret value; ASO takes it only from a Kubernetes Secret). geo_backup_enabled false on a DataWarehouse (DW) SKU is aso-extensions' ServersDatabasesGeoBackupPolicy (Disabled). managed_identities.system_assigned is accepted and ignored, as the module ignores it"
    partial: true
    fields: [import, threat_detection_policy.storage_account_access_key]
  - variable: firewall_rules
    kind: by-design
    reason: "accepted, but a rule's timeouts are refused: Azure Service Operator has no per-request timeouts; Bundt sets a component's time limit"
    partial: true
    fields: [timeouts]
