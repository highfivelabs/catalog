#
# Values mirror the Terraform variables of the Azure Verified Module
# avm-res-operationalinsights-workspace (v0.5.1): same names, types and
# defaults, so a module block's arguments become this file one to one.
# values.schema.json carries the types and the module's validations.
#
# Descriptions quoted from
# terraform-azurerm-avm-res-operationalinsights-workspace (variables.tf,
# v0.5.1), Copyright (c) Microsoft Corporation, MIT.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables, except tags.
#
# The workspace's name in full, {workspace}. A name set here takes no
# prefix; one not set is name, with the namePrefix in front.
names: {}
# An optional convenience: "<namePrefix>-" in front of the name (never one
# set under names). Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. ASO never copies them to Azure (Azure
# tags are tags).
labels: {}
# DELETE (the default) or ABANDON, which keeps every resource in Azure when
# the component is deleted (ASO's reconcile-policy detach-on-delete).
# PREVENT is refused: use lock. Not a module variable.
deletion_policy: null
# The subscription of resource_group_name. Not a module variable: the
# module's azurerm provider knows its subscription; ASO's owner is an
# Azure resource ID. Not needed when resource_group_name is a resource
# group's ID (/subscriptions/<id>/resourceGroups/<name>).
subscription_id: ""

# A map describing customer-managed keys to associate with the resource.
# Accepted; the module declares it and does not use it, and nor does the
# chart.
customer_managed_key: null
# A map of diagnostic settings to create on the workspace. Each: {name,
# log_categories, log_groups (["allLogs"]), metric_categories
# (["AllMetrics"]), log_analytics_destination_type ("Dedicated"),
# workspace_resource_id (default: this workspace, when no destination is
# given), storage_account_resource_id,
# event_hub_authorization_rule_resource_id, event_hub_name,
# marketplace_partner_resource_id}.
diagnostic_settings: {}
# This variable controls whether or not telemetry is enabled for the
# module. Accepted; the chart never sends telemetry.
enable_telemetry: true
# (Required) The Azure location of the workspace.
location: ""
# Controls the Resource Lock configuration for this resource.
# {kind (CanNotDelete or ReadOnly), name (default lock-<kind>)}
lock: null
# (Optional) Allow users access to data of resources they may view,
# without permission to the workspace. Azure's default is true.
log_analytics_workspace_allow_resource_only_permissions: null
# (Optional) Is Customer Managed Storage mandatory for query management?
log_analytics_workspace_cmk_for_query_forced: null
# (Optional) The workspace daily quota for ingestion in GB (-1:
# unlimited).
log_analytics_workspace_daily_quota_gb: null
# A map of data exports (aso-extensions WorkspacesDataExport). Each: {name,
# table_names, destination_resource_id (a storage account, an Event Hubs
# namespace or an event hub), enabled (true), event_hub_name}.
log_analytics_workspace_data_exports: {}
# (Optional) The dedicated cluster to link, through a linked service named
# Cluster (aso-extensions WorkspacesLinkedService).
log_analytics_workspace_dedicated_cluster_resource_id: null
# The workspace's managed identity. {type (SystemAssigned or
# UserAssigned), identity_ids}
log_analytics_workspace_identity: null
# (Optional) Ingestion over the public internet: "true", "false" or
# "SecuredByPerimeter".
log_analytics_workspace_internet_ingestion_enabled: "false"
# (Optional) Querying over the public internet: "true", "false" or
# "SecuredByPerimeter".
log_analytics_workspace_internet_query_enabled: "false"
# A map of linked storage accounts (aso-extensions
# WorkspacesLinkedStorageAccount, named for its data source type). Each:
# {data_source_type (CustomLogs, AzureWatson, Query, Ingestion, Alerts),
# storage_account_ids}.
log_analytics_workspace_linked_storage_accounts: {}
# (Optional) Local (shared key) authentication. Defaults to true.
log_analytics_workspace_local_authentication_enabled: true
# (Optional) The capacity reservation level in GB a day (100, 200, 300,
# 400, 500, 1000, 2000 or 5000), with sku CapacityReservation.
log_analytics_workspace_reservation_capacity_in_gb_per_day: null
# (Optional) The data retention in days: 7 (Free tier) or 30 to 730.
log_analytics_workspace_retention_in_days: null
# (Optional) The SKU. Defaults to PerGB2018.
log_analytics_workspace_sku: null
# Tables to create (aso-extensions WorkspacesTable). Each: {name,
# resource_id (another workspace), retention_in_days,
# total_retention_in_days, plan, schema: {name, description, columns:
# [{name, type}]}}.
log_analytics_workspace_tables: {}
# Tables to update, such as Heartbeat or Syslog (a WorkspacesTable left in
# Azure when deleted). Each as log_analytics_workspace_tables.
log_analytics_workspace_tables_update: {}
# The timeouts of the workspace. Refused when set: ASO has none; Bundt
# sets a component's time limit.
log_analytics_workspace_timeouts: null
# Monitor Private Link Scopes to create (aso-extensions PrivateLinkScope,
# with a scoped resource linking this workspace). Each: {name
# ("law_pl_scope"), resource_id (its resource group), ingestion_access_mode,
# query_access_mode ("PrivateOnly"), exclusions, lock}.
monitor_private_link_scope: {}
# Existing Monitor Private Link Scopes to join (a
# PrivateLinkScopesScopedResource each). Each: {name (the workspace's),
# resource_id (the scope), exclusions (refused)}.
monitor_private_link_scoped_resource: {}
# The name of the workspace's scoped resource in each created scope;
# required with monitor_private_link_scope.
monitor_private_link_scoped_service_name: null
# (Required) The name of the workspace.
name: null
# The Network Security Perimeter association (aso-extensions
# NetworkSecurityPerimetersResourceAssociation, nsp-assoc-<name>):
# {resource_id, profile_name, access_mode ("Learning")}.
network_security_perimeter_association: null
# Private endpoint extensions, keyed like private_endpoints: {
# monitor_private_link_scope_key (the scope the endpoint connects to),
# monitor_private_link_scope_exclusion (refused when it changes the scope's
# access modes: it names a connection Azure names), manage_dns_zone_group}.
private_endpoint_extensions: {}
# Private endpoints to a Monitor Private Link Scope (ASO PrivateEndpoint
# each).
private_endpoints: {}
# (Required) The name of the resource group of the workspace (or its ID).
resource_group_name: ""
# A map of role assignments to create on the workspace.
# Each: {role_definition_id_or_name, principal_id, description,
# skip_service_principal_aad_check, condition, condition_version,
# delegated_managed_identity_resource_id, principal_type}.
role_assignments: {}
# (Optional) Tags of the resource.
tags: null
