# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set. Read by `task coverage`; `task
# coverage-verify` renders the chart to check that each one is refused.
# kind: gap (no Azure Service Operator or aso-extensions kind or field; the
# reason names the ARM type when a kind is missing), not-ported (one
# exists, the chart does not map it yet) or by-design.
refused:
  - variable: log_analytics_workspace_data_exports
    kind: gap
    reason: "Microsoft.OperationalInsights/workspaces/dataExports has no ASO or aso-extensions kind"
  - variable: log_analytics_workspace_dedicated_cluster_resource_id
    kind: gap
    reason: "the module links the cluster with a linked service, Microsoft.OperationalInsights/workspaces/linkedServices, which has no ASO or aso-extensions kind"
  - variable: log_analytics_workspace_linked_storage_accounts
    kind: gap
    reason: "Microsoft.OperationalInsights/workspaces/linkedStorageAccounts has no ASO or aso-extensions kind"
  - variable: log_analytics_workspace_tables
