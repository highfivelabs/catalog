  - variable: log_analytics_workspace_tables_update
    kind: gap
    reason: "Microsoft.OperationalInsights/workspaces/tables has no ASO or aso-extensions kind"
  - variable: monitor_private_link_scope
    kind: gap
    reason: "Microsoft.Insights/privateLinkScopes and their scopedResources have no ASO or aso-extensions kind"
  - variable: monitor_private_link_scoped_resource
    kind: gap
    reason: "Microsoft.Insights/privateLinkScopes/scopedResources has no ASO or aso-extensions kind"
  - variable: monitor_private_link_scoped_service_name
