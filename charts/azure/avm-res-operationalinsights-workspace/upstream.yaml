# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set. Read by `task coverage`; `task
# coverage-verify` renders the chart to check that each one is refused.
# kind: gap (no Azure Service Operator or aso-extensions kind or field; the
# reason names the ARM type when a kind is missing), not-ported (one
# exists, the chart does not map it yet) or by-design.
refused:
  - variable: monitor_private_link_scoped_resource
    kind: not-ported
    reason: "accepted, but an entry's exclusions are refused: they update the access mode settings of an existing scope, which the module reads first and the chart does not own"
    partial: true
    fields: [exclusions]
  - variable: private_endpoint_extensions
    kind: not-ported
    reason: "accepted, but monitor_private_link_scope_exclusion is refused when it would change the scope's access modes for the endpoint: the module names the exclusion by the scope's private endpoint connection, which Azure names and a render cannot read"
    partial: true
    fields: [monitor_private_link_scope_exclusion]
  - variable: log_analytics_workspace_timeouts
    kind: by-design
    reason: "Azure Service Operator has no per-request timeouts; Bundt sets a component's time limit"
