#
# The Bundt Package for this chart. Outputs are the module's declared
# outputs, selected from the live objects (resources.<id>). resource_id is
# the workspace's ARM ID from ASO's status. Not outputs: resource (the
# module's whole azurerm object, sensitive there for its shared keys) and
# private_endpoints (refused). customer_id, the workspace ID agents and
# queries take, is added from status.customerId; it is the field consumers
# take from resource.
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: azure-avm-res-operationalinsights-workspace
spec:
  version: 0.1.0
  engine: helm
  providers: [aso]
  outputs:
    resource_id: resources.workspace.status.id
    customer_id: resources.workspace.status.customerId
