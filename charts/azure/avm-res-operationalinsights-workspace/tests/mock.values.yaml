# For an apply against the fake cloud (docs/azure.md, "8. Charts"): a
# workspace with 30 days' retention in the fake cloud's resource group, its
# tables, export, linked storage, a Monitor Private Link Scope, and a
# private endpoint to that scope with a DNS zone group (the fake keeps the
# references as sent).
name: catalog-law
location: eastus2
resource_group_name: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg
log_analytics_workspace_retention_in_days: 30
tags: {catalog: mock}
log_analytics_workspace_tables:
  app:
    name: AppEvents_CL
    retention_in_days: 30
    schema:
      name: AppEvents_CL
      columns: [{name: TimeGenerated, type: datetime}, {name: Message, type: string}]
log_analytics_workspace_tables_update:
  heartbeat: {name: Heartbeat, retention_in_days: 60}
log_analytics_workspace_data_exports:
  storage: {name: export-storage, table_names: [AppEvents_CL], destination_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Storage/storageAccounts/catalogexport}
log_analytics_workspace_linked_storage_accounts:
  query: {data_source_type: Query, storage_account_ids: [/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Storage/storageAccounts/catalogquery]}
monitor_private_link_scope:
  ampls: {name: catalog-ampls, resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg, ingestion_access_mode: Open, query_access_mode: Open}
monitor_private_link_scoped_service_name: catalog-law
private_endpoints:
  ampls:
    subnet_resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/virtualNetworks/catalog-vnet/subnets/snet-pe
    private_dns_zone_resource_ids: [/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/catalog-rg/providers/Microsoft.Network/privateDnsZones/privatelink.monitor.azure.com]
private_endpoint_extensions:
  ampls:
    monitor_private_link_scope_exclusion: {exclude: false}
