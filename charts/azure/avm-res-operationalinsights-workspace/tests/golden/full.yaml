# Source: avm-res-operationalinsights-workspace/templates/main.yaml
apiVersion: operationalinsights.azure.com/v20250701
kind: Workspace
metadata:
  name: full-law
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: avm-res-operationalinsights-workspace
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "workspace"
spec:
  azureName: "law-platform"
  location: "westeurope"
  owner:
    armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-ops"
  features:
    disableLocalAuth: true
    enableLogAccessUsingOnlyResourcePermissions: false
  forceCmkForQuery: true
  identity:
    type: UserAssigned
    userAssignedIdentities:
      - reference:
          armId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-ops/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-law"
  publicNetworkAccessForIngestion: Enabled
  publicNetworkAccessForQuery: SecuredByPerimeter
  retentionInDays: 90
  sku:
    name: CapacityReservation
    capacityReservationLevel: 100
  workspaceCapping:
    dailyQuotaGb: 10.5
  tags:
    environment: prod
