#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every
# object this chart renders carries the namePrefix in its Azure name
# (spec.azureName, nameFields below), except the kinds listed here, each with
# the reason it cannot collide with another Instance's.
exempt:
  RoleAssignment: "its name is a GUID (a stable UUID ASO makes), scoped to the workspace"
  ManagementLock: "named inside the workspace it locks, whose name carries the prefix (the module's lock-<kind>)"
  DiagnosticSetting: "named inside the workspace it is on, whose name carries the prefix (the module's diag-<name>)"
  WorkspacesDataExport: "named inside the workspace, whose name carries the prefix, by the entry's name"
  WorkspacesLinkedService: "the workspace's one linked service, Cluster, inside the workspace, whose name carries the prefix"
  WorkspacesLinkedStorageAccount: "named for its data source type inside the workspace, whose name carries the prefix"
  WorkspacesTable: "named inside the workspace, whose name carries the prefix, by the entry's (Azure's) table name"
  PrivateLinkScopesScopedResource: "named inside its scope by monitor_private_link_scoped_service_name or the workspace's name, which carries the prefix"
  NetworkSecurityPerimetersResourceAssociation: "named nsp-assoc-<workspace name>, which carries the prefix, inside its perimeter"
nameFields:
  Workspace: azureName
  PrivateLinkScope: azureName
