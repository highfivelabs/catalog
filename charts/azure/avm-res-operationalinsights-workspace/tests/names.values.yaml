# Whole names from a naming convention: names.workspace is used as given;
# the namePrefix goes on no name set in full. labels stay in Kubernetes;
# tags reach Azure.
name: logs
location: eastus2
resource_group_name: rg-shop-dev
subscription_id: 00000000-0000-0000-0000-000000000000
namePrefix: shop-dev
names: {workspace: law-shop-dev-eus2}
labels: {hfl.dev/team: shop}
tags: {team: shop}
