# aws_redshift_subnet_group has no kind (ACK's redshift-controller has no
# release).
redshift_route_table_tags: {}
# Specify true to indicate that network interfaces created in the specified
# subnet should be assigned an IPv6 address. Default is `false`
# Not supported (gap): Redshift subnets are not ported:
# aws_redshift_subnet_group has no kind (ACK's redshift-controller has no
# release).
redshift_subnet_assign_ipv6_address_on_creation: false
# Indicates whether DNS queries made to the Amazon-provided DNS Resolver in
# this subnet should return synthetic IPv6 addresses for IPv4-only
# destinations. Default: `true`
# Not supported (gap): Redshift subnets are not ported:
# aws_redshift_subnet_group has no kind (ACK's redshift-controller has no
# release).
redshift_subnet_enable_dns64: true
# Indicates whether to respond to DNS queries for instance hostnames with DNS
# A records. Default: `false`
# Not supported (gap): Redshift subnets are not ported:
# aws_redshift_subnet_group has no kind (ACK's redshift-controller has no
# release).
redshift_subnet_enable_resource_name_dns_a_record_on_launch: false
# Indicates whether to respond to DNS queries for instance hostnames with DNS
# AAAA records. Default: `true`
# Not supported (gap): Redshift subnets are not ported:
# aws_redshift_subnet_group has no kind (ACK's redshift-controller has no
# release).
redshift_subnet_enable_resource_name_dns_aaaa_record_on_launch: true
# Name of redshift subnet group
# Not supported (gap): Redshift subnets are not ported:
# aws_redshift_subnet_group has no kind (ACK's redshift-controller has no
# release).
redshift_subnet_group_name: null
# Additional tags for the redshift subnet group
# Not supported (gap): Redshift subnets are not ported:
# aws_redshift_subnet_group has no kind (ACK's redshift-controller has no
# release).
redshift_subnet_group_tags: {}
# Indicates whether to create an IPv6-only subnet. Default: `false`
# Not supported (gap): Redshift subnets are not ported:
# aws_redshift_subnet_group has no kind (ACK's redshift-controller has no
# release).
redshift_subnet_ipv6_native: false
# Assigns IPv6 redshift subnet id based on the Amazon provided /56 prefix base
# 10 integer (0-256). Must be of equal length to the corresponding IPv4 subnet
# list
# Not supported (gap): Redshift subnets are not ported:
# aws_redshift_subnet_group has no kind (ACK's redshift-controller has no
# release).
redshift_subnet_ipv6_prefixes: []
# Explicit values to use in the Name tag on redshift subnets. If empty, Name
# tags are generated
# Not supported (gap): Redshift subnets are not ported:
# aws_redshift_subnet_group has no kind (ACK's redshift-controller has no
# release).
redshift_subnet_names: []
# The type of hostnames to assign to instances in the subnet at launch. For
# IPv6-only subnets, an instance DNS name must be based on the instance ID.
# For dual-stack and IPv4-only subnets, you can specify whether DNS names use
# the instance IPv4 address or the instance ID. Valid values: `ip-name`,
# `resource-name`
# Not supported (gap): Redshift subnets are not ported:
# aws_redshift_subnet_group has no kind (ACK's redshift-controller has no
# release).
redshift_subnet_private_dns_hostname_type_on_launch: null
# Suffix to append to redshift subnets name
# Not supported (gap): Redshift subnets are not ported:
# aws_redshift_subnet_group has no kind (ACK's redshift-controller has no
# release).
redshift_subnet_suffix: "redshift"
# Additional tags for the redshift subnets
# Not supported (gap): Redshift subnets are not ported:
# aws_redshift_subnet_group has no kind (ACK's redshift-controller has no
# release).
redshift_subnet_tags: {}
# A list of redshift subnets inside the VPC
# Not supported (gap): Redshift subnets are not ported:
# aws_redshift_subnet_group has no kind (ACK's redshift-controller has no
# release).
redshift_subnets: []
# Region where the resource(s) will be managed. Defaults to the Region set in
# the provider configuration
region: null
# Should be true if you don't want EIPs to be created for your NAT Gateways
# and will instead pass them in via the 'external_nat_ip_ids' variable
reuse_nat_ips: false
# List of secondary CIDR blocks to associate with the VPC to extend the IP
# Address pool
secondary_cidr_blocks: []
# Should be true if you want to provision a single shared NAT Gateway across
# all of your private networks
single_nat_gateway: false
# A map of tags to add to all resources
tags: {}
# Determines whether IPAM pool is used for CIDR allocation
# Not supported (gap): VPC.cidrBlocks is required in ACK's VPC, so a VPC
# cannot take its whole block from an IPAM pool by netmask length;
# ipv4_ipam_pool_id with cidr is supported.
use_ipam_pool: false
# A map of VPC block public access exclusions
# Not supported (gap): aws_vpc_block_public_access_exclusion takes this chart's
# VPC's or subnets' IDs, and ack-extensions' VPCBlockPublicAccessExclusion
# (Cloud Control) has no reference to either (vpcRef, subnetRef).
vpc_block_public_access_exclusions: {}
# A map of VPC block public access options
# In part: VPCBlockPublicAccessOptions is an ack-extensions kind (Cloud
# Control, outside ACK's releases): needs allow_alpha: true.
vpc_block_public_access_options: {}
# Name of the IAM policy
# Not supported (gap): flow logs are not ported: FlowLog.resourceID takes the
# VPC's ID, known only after apply, and FlowLog has no reference to a VPC
# (vpcRef).
vpc_flow_log_iam_policy_name: "vpc-flow-log-to-cloudwatch"
# Determines whether the name of the IAM policy
# (`vpc_flow_log_iam_policy_name`) is used as a prefix
# Not supported (gap): flow logs are not ported: FlowLog.resourceID takes the
# VPC's ID, known only after apply, and FlowLog has no reference to a VPC
# (vpcRef).
vpc_flow_log_iam_policy_use_name_prefix: true
# Name to use on the VPC Flow Log IAM role created
# Not supported (gap): flow logs are not ported: FlowLog.resourceID takes the
# VPC's ID, known only after apply, and FlowLog has no reference to a VPC
# (vpcRef).
vpc_flow_log_iam_role_name: "vpc-flow-log-role"
# The path for the VPC Flow Log IAM Role
# Not supported (gap): flow logs are not ported: FlowLog.resourceID takes the
# VPC's ID, known only after apply, and FlowLog has no reference to a VPC
# (vpcRef).
vpc_flow_log_iam_role_path: null
# Determines whether the IAM role name (`vpc_flow_log_iam_role_name_name`) is
# used as a prefix
# Not supported (gap): flow logs are not ported: FlowLog.resourceID takes the
# VPC's ID, known only after apply, and FlowLog has no reference to a VPC
# (vpcRef).
vpc_flow_log_iam_role_use_name_prefix: true
# The ARN of the Permissions Boundary for the VPC Flow Log IAM Role
# Not supported (gap): flow logs are not ported: FlowLog.resourceID takes the
# VPC's ID, known only after apply, and FlowLog has no reference to a VPC
# (vpcRef).
vpc_flow_log_permissions_boundary: null
# Additional tags for the VPC Flow Logs
# Not supported (gap): flow logs are not ported: FlowLog.resourceID takes the
# VPC's ID, known only after apply, and FlowLog has no reference to a VPC
# (vpcRef).
vpc_flow_log_tags: {}
# Additional tags for the VPC
vpc_tags: {}
# The Availability Zone for the VPN Gateway
# Not supported (gap): the VPN gateway is not ported: ack-extensions'
# VPNGateway takes the VPC as a plain ID (spec.vpc) and
# VPNGatewayRoutePropagation the route table as a plain ID
# (spec.routeTableID), both known only after apply; neither has a reference
# field.
vpn_gateway_az: null
# ID of VPN Gateway to attach to the VPC
# Not supported (gap): the VPN gateway is not ported: ack-extensions'
# VPNGateway takes the VPC as a plain ID (spec.vpc) and
# VPNGatewayRoutePropagation the route table as a plain ID
# (spec.routeTableID), both known only after apply; neither has a reference
# field.
vpn_gateway_id: ""
# Additional tags for the VPN gateway
# Not supported (gap): the VPN gateway is not ported: ack-extensions'
# VPNGateway takes the VPC as a plain ID (spec.vpc) and
# VPNGatewayRoutePropagation the route table as a plain ID
# (spec.routeTableID), both known only after apply; neither has a reference
# field.
vpn_gateway_tags: {}
