#
# Values mirror the Terraform variables of terraform-aws-modules' vpc module
# (v6.7.3): same names, types and defaults, so a module block's arguments
# become a values file one to one. values.schema.json carries the types.
# A variable the chart cannot carry stays here and stops the render when
# set (upstream.yaml lists them; README.md says why).

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables, except tags, which is the module's own.
#
# Names in full, {vpc, databaseSubnetGroup, elasticacheSubnetGroup}. A name
# set here takes no namePrefix. names.vpc is the VPC's Name tag and the base
# every other derived Name tag starts with (in place of name); the subnet
# group names are AWS names, unique in the account and region.
names: {}
# An optional convenience: "<namePrefix>-" in front of every name the chart
# derives or takes from the module's variables (Name tags and subnet group
# names), never one set under names. Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. They stay in Kubernetes: ACK does not
# copy labels to AWS (AWS tags are the module's tags variable).
labels: {}
# Kinds outside ACK's released controllers (ack-extensions' CustomerGateway,
# for customer_gateways, and VPCBlockPublicAccessOptions, for
# vpc_block_public_access_options) render only with allow_alpha: true
# (docs/design.md, "Alpha kinds").
allow_alpha: false
# DELETE (default): deleting the component deletes the AWS resources.
# ABANDON keeps them (services.k8s.aws/deletion-policy: retain).
deletion_policy: DELETE

# The module's variables, in alphabetical order, with its defaults.

# The Autonomous System Number (ASN) for the Amazon side of the gateway. By
# default the virtual private gateway is created with the current default
# Amazon ASN
# Not supported (gap): the VPN gateway is not ported: ack-extensions'
# VPNGateway takes the VPC as a plain ID (spec.vpc) and
# VPNGatewayRoutePropagation the route table as a plain ID
# (spec.routeTableID), both known only after apply; neither has a reference
# field.
amazon_side_asn: "64512"
# A list of availability zones names or ids in the region
azs: []
# (Optional) The IPv4 CIDR block for the VPC. CIDR can be explicitly set or it
# can be derived from IPAM using `ipv4_netmask_length` & `ipv4_ipam_pool_id`
cidr: "10.0.0.0/16"
# Controls if an internet gateway route for public database access should be
# created
create_database_internet_gateway_route: false
# Controls if a nat gateway route should be created to give internet access to
# the database subnets
create_database_nat_gateway_route: false
# Controls if database subnet group should be created (n.b. database_subnets
# must also be set)
create_database_subnet_group: true
# Controls if separate route table for database should be created
create_database_subnet_route_table: false
# Controls if an Egress Only Internet Gateway is created and its related
# routes
# Not supported (gap): IPv6 is not ported: a subnet's IPv6 block is cut from
# the VPC's Amazon-assigned block (cidrsubnet), known only after apply, and
# Subnet has no field that references it; a route to an egress-only internet
# gateway has no reference either (RouteTable.routes takes
# egressOnlyInternetGatewayID only).
create_egress_only_igw: true
# Controls if elasticache subnet group should be created
create_elasticache_subnet_group: true
# Controls if separate route table for elasticache should be created
create_elasticache_subnet_route_table: false
# Whether to create IAM role for VPC Flow Logs
# Not supported (gap): flow logs are not ported: FlowLog.resourceID takes the
# VPC's ID, known only after apply, and FlowLog has no reference to a VPC
# (vpcRef).
create_flow_log_cloudwatch_iam_role: false
# Whether to create CloudWatch log group for VPC Flow Logs
# Not supported (gap): flow logs are not ported: FlowLog.resourceID takes the
# VPC's ID, known only after apply, and FlowLog has no reference to a VPC
# (vpcRef).
create_flow_log_cloudwatch_log_group: false
# Controls if an Internet Gateway is created for public subnets and the
# related routes that connect them
create_igw: true
# Indicates whether to create a separate route table for each intra subnet.
# Default: `false`
create_multiple_intra_route_tables: false
# Indicates whether to create a separate route table for each public subnet.
# Default: `false`
create_multiple_public_route_tables: false
# Controls if a nat gateway route should be created to give internet access to
# the private subnets
create_private_nat_gateway_route: true
# Controls if redshift subnet group should be created
# Not supported (gap): Redshift subnets are not ported:
# aws_redshift_subnet_group has no kind (ACK's redshift-controller has no
# release).
create_redshift_subnet_group: true
# Controls if separate route table for redshift should be created
# Not supported (gap): Redshift subnets are not ported:
# aws_redshift_subnet_group has no kind (ACK's redshift-controller has no
# release).
create_redshift_subnet_route_table: false
# Controls if VPC should be created (it affects almost all resources)
create_vpc: true
# Additional tags for the Customer Gateway
customer_gateway_tags: {}
# Maps of Customer Gateway's attributes (BGP ASN and Gateway's Internet-
# routable external IP address)
# In part: CustomerGateway is an ack-extensions kind (outside ACK's releases):
# needs allow_alpha: true.
customer_gateways: {}
# The customer owned IPv4 address pool. Typically used with the
# `map_customer_owned_ip_on_launch` argument. The `outpost_arn` argument must
# be specified when configured
# Not supported (not-ported): Outpost subnets are not ported yet: Subnet has
# outpostARN and customerOwnedIPv4Pool, the chart does not map them.
customer_owned_ipv4_pool: null
# Additional tags for the database subnets network ACL
database_acl_tags: {}
# Whether to use dedicated network ACL (not default) and custom rules for
# database subnets
database_dedicated_network_acl: false
# Database subnets inbound network ACL rules
database_inbound_acl_rules: [{"rule_number": 100, "rule_action": "allow", "from_port": 0, "to_port": 0, "protocol": "-1", "cidr_block": "0.0.0.0/0"}]
# Database subnets outbound network ACL rules
database_outbound_acl_rules: [{"rule_number": 100, "rule_action": "allow", "from_port": 0, "to_port": 0, "protocol": "-1", "cidr_block": "0.0.0.0/0"}]
# Additional tags for the database route tables
database_route_table_tags: {}
# Specify true to indicate that network interfaces created in the specified
# subnet should be assigned an IPv6 address. Default is `false`
# Not supported (gap): IPv6 is not ported: a subnet's IPv6 block is cut from
# the VPC's Amazon-assigned block (cidrsubnet), known only after apply, and
# Subnet has no field that references it; a route to an egress-only internet
# gateway has no reference either (RouteTable.routes takes
# egressOnlyInternetGatewayID only).
database_subnet_assign_ipv6_address_on_creation: false
# Indicates whether DNS queries made to the Amazon-provided DNS Resolver in
# this subnet should return synthetic IPv6 addresses for IPv4-only
# destinations. Default: `true`
# Not supported (gap): IPv6 is not ported: a subnet's IPv6 block is cut from
# the VPC's Amazon-assigned block (cidrsubnet), known only after apply, and
# Subnet has no field that references it; a route to an egress-only internet
# gateway has no reference either (RouteTable.routes takes
# egressOnlyInternetGatewayID only).
database_subnet_enable_dns64: true
# Indicates whether to respond to DNS queries for instance hostnames with DNS
# A records. Default: `false`
database_subnet_enable_resource_name_dns_a_record_on_launch: false
# Indicates whether to respond to DNS queries for instance hostnames with DNS
# AAAA records. Default: `true`
# Not supported (gap): IPv6 is not ported: a subnet's IPv6 block is cut from
# the VPC's Amazon-assigned block (cidrsubnet), known only after apply, and
# Subnet has no field that references it; a route to an egress-only internet
# gateway has no reference either (RouteTable.routes takes
# egressOnlyInternetGatewayID only).
database_subnet_enable_resource_name_dns_aaaa_record_on_launch: true
# Name of database subnet group
database_subnet_group_name: null
# Additional tags for the database subnet group
database_subnet_group_tags: {}
# Indicates whether to create an IPv6-only subnet. Default: `false`
# Not supported (gap): IPv6 is not ported: a subnet's IPv6 block is cut from
# the VPC's Amazon-assigned block (cidrsubnet), known only after apply, and
# Subnet has no field that references it; a route to an egress-only internet
# gateway has no reference either (RouteTable.routes takes
# egressOnlyInternetGatewayID only).
database_subnet_ipv6_native: false
# Assigns IPv6 database subnet id based on the Amazon provided /56 prefix base
# 10 integer (0-256). Must be of equal length to the corresponding IPv4 subnet
# list
# Not supported (gap): IPv6 is not ported: a subnet's IPv6 block is cut from
# the VPC's Amazon-assigned block (cidrsubnet), known only after apply, and
# Subnet has no field that references it; a route to an egress-only internet
# gateway has no reference either (RouteTable.routes takes
# egressOnlyInternetGatewayID only).
database_subnet_ipv6_prefixes: []
# Explicit values to use in the Name tag on database subnets. If empty, Name
# tags are generated
database_subnet_names: []
# The type of hostnames to assign to instances in the subnet at launch. For
# IPv6-only subnets, an instance DNS name must be based on the instance ID.
# For dual-stack and IPv4-only subnets, you can specify whether DNS names use
# the instance IPv4 address or the instance ID. Valid values: `ip-name`,
# `resource-name`
database_subnet_private_dns_hostname_type_on_launch: null
# Suffix to append to database subnets name
database_subnet_suffix: "db"
# Additional tags for the database subnets
database_subnet_tags: {}
# A list of database subnets inside the VPC
database_subnets: []
# List of maps of egress rules to set on the Default Network ACL
# Not supported (gap): the VPC's default network ACL is not adopted
# (aws_default_network_acl has no kind): it keeps AWS's own rules and gets no
# name or tags.
default_network_acl_egress: [{"rule_no": 100, "action": "allow", "from_port": 0, "to_port": 0, "protocol": "-1", "cidr_block": "0.0.0.0/0"}, {"rule_no": 101, "action": "allow", "from_port": 0, "to_port": 0, "protocol": "-1", "ipv6_cidr_block": "::/0"}]
# List of maps of ingress rules to set on the Default Network ACL
# Not supported (gap): the VPC's default network ACL is not adopted
# (aws_default_network_acl has no kind): it keeps AWS's own rules and gets no
# name or tags.
default_network_acl_ingress: [{"rule_no": 100, "action": "allow", "from_port": 0, "to_port": 0, "protocol": "-1", "cidr_block": "0.0.0.0/0"}, {"rule_no": 101, "action": "allow", "from_port": 0, "to_port": 0, "protocol": "-1", "ipv6_cidr_block": "::/0"}]
# Name to be used on the Default Network ACL
# Not supported (gap): the VPC's default network ACL is not adopted
# (aws_default_network_acl has no kind): it keeps AWS's own rules and gets no
# name or tags.
default_network_acl_name: null
# Additional tags for the Default Network ACL
# Not supported (gap): the VPC's default network ACL is not adopted
# (aws_default_network_acl has no kind): it keeps AWS's own rules and gets no
# name or tags.
default_network_acl_tags: {}
# Name to be used on the default route table
# Not supported (gap): the VPC's main route table is not adopted
# (aws_default_route_table has no kind): no routes, route propagation, name or
# tags are set on it.
default_route_table_name: null
# List of virtual gateways for propagation
# Not supported (gap): the VPC's main route table is not adopted
# (aws_default_route_table has no kind): no routes, route propagation, name or
# tags are set on it.
default_route_table_propagating_vgws: []
# Configuration block of routes. See https://registry.terraform.io/providers/h
# ashicorp/aws/latest/docs/resources/default_route_table#route
# Not supported (gap): the VPC's main route table is not adopted
# (aws_default_route_table has no kind): no routes, route propagation, name or
# tags are set on it.
default_route_table_routes: []
# Additional tags for the default route table
# Not supported (gap): the VPC's main route table is not adopted
# (aws_default_route_table has no kind): no routes, route propagation, name or
# tags are set on it.
default_route_table_tags: {}
# List of maps of egress rules to set on the default security group
# Not supported (gap): the VPC's default security group is not adopted
# (aws_default_security_group has no kind): its rules, name and tags are not
# set; manage_default_security_group removes its rules.
default_security_group_egress: []
# List of maps of ingress rules to set on the default security group
# Not supported (gap): the VPC's default security group is not adopted
# (aws_default_security_group has no kind): its rules, name and tags are not
# set; manage_default_security_group removes its rules.
default_security_group_ingress: []
# Name to be used on the default security group
# Not supported (gap): the VPC's default security group is not adopted
# (aws_default_security_group has no kind): its rules, name and tags are not
# set; manage_default_security_group removes its rules.
default_security_group_name: null
# Additional tags for the default security group
# Not supported (gap): the VPC's default security group is not adopted
# (aws_default_security_group has no kind): its rules, name and tags are not
# set; manage_default_security_group removes its rules.
default_security_group_tags: {}
# Should be true to enable DNS hostnames in the Default VPC
# Not supported (gap): the account's default VPC is not managed:
# aws_default_vpc has no kind.
default_vpc_enable_dns_hostnames: true
# Should be true to enable DNS support in the Default VPC
# Not supported (gap): the account's default VPC is not managed:
# aws_default_vpc has no kind.
default_vpc_enable_dns_support: true
# Name to be used on the Default VPC
# Not supported (gap): the account's default VPC is not managed:
# aws_default_vpc has no kind.
default_vpc_name: null
# Additional tags for the Default VPC
# Not supported (gap): the account's default VPC is not managed:
# aws_default_vpc has no kind.
default_vpc_tags: {}
# Specifies DNS name for DHCP options set (requires enable_dhcp_options set to
# true)
dhcp_options_domain_name: ""
# Specify a list of DNS server addresses for DHCP options set, default to AWS
# provided (requires enable_dhcp_options set to true)
dhcp_options_domain_name_servers: ["AmazonProvidedDNS"]
# How frequently, in seconds, a running instance with an IPv6 assigned to it
# goes through DHCPv6 lease renewal (requires enable_dhcp_options set to true)
dhcp_options_ipv6_address_preferred_lease_time: null
# Specify a list of netbios servers for DHCP options set (requires
# enable_dhcp_options set to true)
dhcp_options_netbios_name_servers: []
# Specify netbios node_type for DHCP options set (requires enable_dhcp_options
# set to true)
dhcp_options_netbios_node_type: ""
# Specify a list of NTP servers for DHCP options set (requires
# enable_dhcp_options set to true)
dhcp_options_ntp_servers: []
# Additional tags for the DHCP option set (requires enable_dhcp_options set to
# true)
dhcp_options_tags: {}
# Additional tags for the elasticache subnets network ACL
elasticache_acl_tags: {}
# Whether to use dedicated network ACL (not default) and custom rules for
# elasticache subnets
elasticache_dedicated_network_acl: false
# Elasticache subnets inbound network ACL rules
elasticache_inbound_acl_rules: [{"rule_number": 100, "rule_action": "allow", "from_port": 0, "to_port": 0, "protocol": "-1", "cidr_block": "0.0.0.0/0"}]
# Elasticache subnets outbound network ACL rules
elasticache_outbound_acl_rules: [{"rule_number": 100, "rule_action": "allow", "from_port": 0, "to_port": 0, "protocol": "-1", "cidr_block": "0.0.0.0/0"}]
# Additional tags for the elasticache route tables
elasticache_route_table_tags: {}
# Specify true to indicate that network interfaces created in the specified
# subnet should be assigned an IPv6 address. Default is `false`
# Not supported (gap): IPv6 is not ported: a subnet's IPv6 block is cut from
# the VPC's Amazon-assigned block (cidrsubnet), known only after apply, and
# Subnet has no field that references it; a route to an egress-only internet
# gateway has no reference either (RouteTable.routes takes
# egressOnlyInternetGatewayID only).
elasticache_subnet_assign_ipv6_address_on_creation: false
# Indicates whether DNS queries made to the Amazon-provided DNS Resolver in
# this subnet should return synthetic IPv6 addresses for IPv4-only
# destinations. Default: `true`
# Not supported (gap): IPv6 is not ported: a subnet's IPv6 block is cut from
# the VPC's Amazon-assigned block (cidrsubnet), known only after apply, and
# Subnet has no field that references it; a route to an egress-only internet
# gateway has no reference either (RouteTable.routes takes
# egressOnlyInternetGatewayID only).
elasticache_subnet_enable_dns64: true
# Indicates whether to respond to DNS queries for instance hostnames with DNS
# A records. Default: `false`
elasticache_subnet_enable_resource_name_dns_a_record_on_launch: false
# Indicates whether to respond to DNS queries for instance hostnames with DNS
# AAAA records. Default: `true`
# Not supported (gap): IPv6 is not ported: a subnet's IPv6 block is cut from
# the VPC's Amazon-assigned block (cidrsubnet), known only after apply, and
# Subnet has no field that references it; a route to an egress-only internet
# gateway has no reference either (RouteTable.routes takes
# egressOnlyInternetGatewayID only).
elasticache_subnet_enable_resource_name_dns_aaaa_record_on_launch: true
# Name of elasticache subnet group
elasticache_subnet_group_name: null
# Additional tags for the elasticache subnet group
elasticache_subnet_group_tags: {}
# Indicates whether to create an IPv6-only subnet. Default: `false`
# Not supported (gap): IPv6 is not ported: a subnet's IPv6 block is cut from
# the VPC's Amazon-assigned block (cidrsubnet), known only after apply, and
# Subnet has no field that references it; a route to an egress-only internet
# gateway has no reference either (RouteTable.routes takes
# egressOnlyInternetGatewayID only).
elasticache_subnet_ipv6_native: false
# Assigns IPv6 elasticache subnet id based on the Amazon provided /56 prefix
# base 10 integer (0-256). Must be of equal length to the corresponding IPv4
# subnet list
# Not supported (gap): IPv6 is not ported: a subnet's IPv6 block is cut from
# the VPC's Amazon-assigned block (cidrsubnet), known only after apply, and
# Subnet has no field that references it; a route to an egress-only internet
# gateway has no reference either (RouteTable.routes takes
# egressOnlyInternetGatewayID only).
elasticache_subnet_ipv6_prefixes: []
# Explicit values to use in the Name tag on elasticache subnets. If empty,
# Name tags are generated
elasticache_subnet_names: []
# The type of hostnames to assign to instances in the subnet at launch. For
# IPv6-only subnets, an instance DNS name must be based on the instance ID.
# For dual-stack and IPv4-only subnets, you can specify whether DNS names use
# the instance IPv4 address or the instance ID. Valid values: `ip-name`,
# `resource-name`
elasticache_subnet_private_dns_hostname_type_on_launch: null
# Suffix to append to elasticache subnets name
elasticache_subnet_suffix: "elasticache"
# Additional tags for the elasticache subnets
elasticache_subnet_tags: {}
# A list of elasticache subnets inside the VPC
elasticache_subnets: []
# Should be true if you want to specify a DHCP options set with a custom
# domain name, DNS servers, NTP servers, netbios servers, and/or netbios
# server type
enable_dhcp_options: false
# Should be true to enable DNS hostnames in the VPC
enable_dns_hostnames: true
# Should be true to enable DNS support in the VPC
enable_dns_support: true
# Whether or not to enable VPC Flow Logs
# Not supported (gap): flow logs are not ported: FlowLog.resourceID takes the
# VPC's ID, known only after apply, and FlowLog has no reference to a VPC
# (vpcRef).
enable_flow_log: false
# Requests an Amazon-provided IPv6 CIDR block with a /56 prefix length for the
# VPC. You cannot specify the range of IP addresses, or the size of the CIDR
# block
# Not supported (gap): IPv6 is not ported: a subnet's IPv6 block is cut from
# the VPC's Amazon-assigned block (cidrsubnet), known only after apply, and
# Subnet has no field that references it; a route to an egress-only internet
# gateway has no reference either (RouteTable.routes takes
# egressOnlyInternetGatewayID only).
enable_ipv6: false
# Should be true if you want to provision NAT Gateways for each of your
# private networks
enable_nat_gateway: false
# Determines whether network address usage metrics are enabled for the VPC
enable_network_address_usage_metrics: null
# Controls if redshift should have public routing table
# Not supported (gap): Redshift subnets are not ported:
# aws_redshift_subnet_group has no kind (ACK's redshift-controller has no
# release).
enable_public_redshift: false
# Should be true if you want to create a new VPN Gateway resource and attach
# it to the VPC
# Not supported (gap): the VPN gateway is not ported: ack-extensions'
# VPNGateway takes the VPC as a plain ID (spec.vpc) and
# VPNGatewayRoutePropagation the route table as a plain ID
# (spec.routeTableID), both known only after apply; neither has a reference
# field.
enable_vpn_gateway: false
# List of EIP IDs to be assigned to the NAT Gateways (used in combination with
# reuse_nat_ips)
external_nat_ip_ids: []
# List of EIPs to be used for `nat_public_ips` output (used in combination
# with reuse_nat_ips and external_nat_ip_ids)
external_nat_ips: []
# The ARN for the IAM role that's used to post flow logs to a CloudWatch Logs
# log group. When flow_log_destination_arn is set to ARN of Cloudwatch Logs,
# this argument needs to be provided
# Not supported (gap): flow logs are not ported: FlowLog.resourceID takes the
# VPC's ID, known only after apply, and FlowLog has no reference to a VPC
# (vpcRef).
flow_log_cloudwatch_iam_role_arn: ""
# Additional conditions of the CloudWatch role assumption policy
# Not supported (gap): flow logs are not ported: FlowLog.resourceID takes the
# VPC's ID, known only after apply, and FlowLog has no reference to a VPC
# (vpcRef).
flow_log_cloudwatch_iam_role_conditions: []
# Specified the log class of the log group. Possible values are: `STANDARD` or
# `INFREQUENT_ACCESS`
# Not supported (gap): flow logs are not ported: FlowLog.resourceID takes the
# VPC's ID, known only after apply, and FlowLog has no reference to a VPC
# (vpcRef).
flow_log_cloudwatch_log_group_class: null
# The ARN of the KMS Key to use when encrypting log data for VPC flow logs
# Not supported (gap): flow logs are not ported: FlowLog.resourceID takes the
# VPC's ID, known only after apply, and FlowLog has no reference to a VPC
# (vpcRef).
flow_log_cloudwatch_log_group_kms_key_id: null
# Specifies the name prefix of CloudWatch Log Group for VPC flow logs
# Not supported (gap): flow logs are not ported: FlowLog.resourceID takes the
# VPC's ID, known only after apply, and FlowLog has no reference to a VPC
# (vpcRef).
flow_log_cloudwatch_log_group_name_prefix: "/aws/vpc-flow-log/"
# Specifies the name suffix of CloudWatch Log Group for VPC flow logs
# Not supported (gap): flow logs are not ported: FlowLog.resourceID takes the
# VPC's ID, known only after apply, and FlowLog has no reference to a VPC
# (vpcRef).
flow_log_cloudwatch_log_group_name_suffix: ""
# Specifies the number of days you want to retain log events in the specified
# log group for VPC flow logs
# Not supported (gap): flow logs are not ported: FlowLog.resourceID takes the
# VPC's ID, known only after apply, and FlowLog has no reference to a VPC
# (vpcRef).
flow_log_cloudwatch_log_group_retention_in_days: null
#  Set to true if you do not wish the log group (and any logs it may contain)
# to be deleted at destroy time, and instead just remove the log group from
# the Terraform state
# Not supported (gap): flow logs are not ported: FlowLog.resourceID takes the
# VPC's ID, known only after apply, and FlowLog has no reference to a VPC
# (vpcRef).
flow_log_cloudwatch_log_group_skip_destroy: false
# (Optional) ARN of the IAM role that allows Amazon EC2 to publish flow logs
# across accounts.
# Not supported (gap): flow logs are not ported: FlowLog.resourceID takes the
# VPC's ID, known only after apply, and FlowLog has no reference to a VPC
# (vpcRef).
flow_log_deliver_cross_account_role: null
# The ARN of the CloudWatch log group or S3 bucket where VPC Flow Logs will be
# pushed. If this ARN is a S3 bucket the appropriate permissions need to be
# set on that bucket's policy. When create_flow_log_cloudwatch_log_group is
# set to false this argument must be provided
# Not supported (gap): flow logs are not ported: FlowLog.resourceID takes the
# VPC's ID, known only after apply, and FlowLog has no reference to a VPC
# (vpcRef).
flow_log_destination_arn: ""
# Logging destination type. Valid values: `cloud-watch-logs`, `s3`, `kinesis-
# data-firehose`. Default: `cloud-watch-logs`
# Not supported (gap): flow logs are not ported: FlowLog.resourceID takes the
# VPC's ID, known only after apply, and FlowLog has no reference to a VPC
# (vpcRef).
flow_log_destination_type: "cloud-watch-logs"
# (Optional) The format for the flow log. Valid values: `plain-text`,
# `parquet`
# Not supported (gap): flow logs are not ported: FlowLog.resourceID takes the
# VPC's ID, known only after apply, and FlowLog has no reference to a VPC
# (vpcRef).
flow_log_file_format: null
# (Optional) Indicates whether to use Hive-compatible prefixes for flow logs
# stored in Amazon S3
# Not supported (gap): flow logs are not ported: FlowLog.resourceID takes the
# VPC's ID, known only after apply, and FlowLog has no reference to a VPC
# (vpcRef).
flow_log_hive_compatible_partitions: false
# The fields to include in the flow log record, in the order in which they
# should appear
