# NAT gateways on existing Elastic IPs (reuse_nat_ips), one per AZ, with
# the database subnets routed through the private route tables and an
# internet gateway route on a single database route table.
name: reuse
azs: [eu-west-1a, eu-west-1b]
public_subnets: [10.0.0.0/24, 10.0.1.0/24]
private_subnets: [10.0.10.0/24, 10.0.11.0/24]
database_subnets: [10.0.20.0/24, 10.0.21.0/24]
enable_nat_gateway: true
one_nat_gateway_per_az: true
reuse_nat_ips: true
external_nat_ip_ids: [eipalloc-0aaa, eipalloc-0bbb]
external_nat_ips: [198.51.100.1, 198.51.100.2]
create_database_subnet_group: false
