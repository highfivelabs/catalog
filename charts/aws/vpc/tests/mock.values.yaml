# Applied to the fake AWS by hack/mock-apply-aws.sh: a VPC with public and
# private subnets in two AZs, one NAT gateway, database subnets and their
# subnet group, a dedicated public network ACL and DHCP options.
name: catalog-vpc
cidr: 10.20.0.0/16
region: us-east-1
azs: [us-east-1a, us-east-1b]
public_subnets: [10.20.0.0/24, 10.20.1.0/24]
private_subnets: [10.20.10.0/24, 10.20.11.0/24]
database_subnets: [10.20.20.0/24, 10.20.21.0/24]
enable_nat_gateway: true
single_nat_gateway: true
public_dedicated_network_acl: true
enable_dhcp_options: true
dhcp_options_domain_name: catalog.internal
tags: {catalog-test: "true"}
