#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): every
# object this chart renders carries the namePrefix in its AWS name, except
# the kinds listed here, each with the reason it cannot collide with
# another Instance's. AWS names the EC2 resources by IDs it assigns; their
# Name tags carry the namePrefix too, but a tag need not be unique, so they
# are not checked. The subnet groups' names are unique in the account and
# region: nameFields says where they are.
exempt:
  VPC: "AWS assigns its ID; its Name tag carries the namePrefix but need not be unique"
  Subnet: "AWS assigns its ID; its Name tag carries the namePrefix but need not be unique"
  RouteTable: "AWS assigns its ID; its Name tag carries the namePrefix but need not be unique"
  InternetGateway: "AWS assigns its ID; its Name tag carries the namePrefix but need not be unique"
  ElasticIPAddress: "AWS assigns its allocation ID; its Name tag carries the namePrefix but need not be unique"
  NATGateway: "AWS assigns its ID; its Name tag carries the namePrefix but need not be unique"
  NetworkACL: "AWS assigns its ID; its Name tag carries the namePrefix but need not be unique"
  DHCPOptions: "AWS assigns its ID; its Name tag carries the namePrefix but need not be unique"
  CustomerGateway: "AWS assigns its ID; its Name tag carries the namePrefix but need not be unique"
  VPCBlockPublicAccessOptions: "one per account and Region; it has no name"
  VPCBlockPublicAccessExclusion: "AWS assigns its exclusion ID; it has no name"
nameFields:
  DBSubnetGroup: name
  CacheSubnetGroup: cacheSubnetGroupName
