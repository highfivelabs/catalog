apiVersion: v2
name: vpc
description: >-
  A VPC with its subnets (public, private, database, ElastiCache, intra),
  route tables, internet and NAT gateways, network ACLs, DHCP options and
  RDS and ElastiCache subnet groups, as AWS Controllers for Kubernetes
  (ACK) objects. A port of terraform-aws-modules' vpc module.
type: application
version: 0.1.0
# The module release this chart was ported from (UPSTREAM.md).
appVersion: "terraform-aws-vpc-v6.7.3"
kubeVersion: ">=1.27.0-0"
keywords: [aws, ack, vpc, terraform-aws-modules]
home: https://github.com/highfivelabs/catalog
