{{- /*
Copyright 2026 High Five Labs
SPDX-License-Identifier: Apache-2.0

main.tf, "Internet Gateway" and "NAT Gateway": the internet gateway
(aws_internet_gateway, attached by InternetGateway.vpcRef), the NAT
gateways' Elastic IPs (aws_eip) and the NAT gateways (aws_nat_gateway), in
the public subnets. The routes to them are in subnets.yaml. The egress-only
internet gateway is IPv6, which is refused.
*/ -}}
{{- $p := include "vpc.plan" . | fromJson -}}
{{- if $p.create }}
{{- $v := .Values }}
{{- $vpc := include "ack.name" (list .Release.Name "vpc") }}
{{- if and (gt (len $p.subnets.public) 0) $v.create_igw }}
---
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: InternetGateway
metadata:
{{- include "ack.metadata" (dict "root" $ "name" (include "ack.name" (list .Release.Name "igw")) "id" "igw" "region" $v.region) | nindent 2 }}
spec:
  vpcRef:
{{- include "vpc.ref" $vpc | nindent 4 }}
  tags:
{{- include "ack.tagList" (list (include "ack.tags" (list $ (dict "Name" $p.base) $v.tags $v.igw_tags) | fromJson)) | nindent 4 }}
{{- end }}
{{- if $v.enable_nat_gateway }}
{{- if eq (len $p.subnets.public) 0 }}
{{- fail "vpc: enable_nat_gateway needs public_subnets: the NAT gateways go in them (Terraform: element() of an empty list)" }}
{{- end }}
{{- if and $v.reuse_nat_ips (lt (len ($v.external_nat_ip_ids | default list)) 1) }}
{{- fail "vpc: reuse_nat_ips needs external_nat_ip_ids, the allocation IDs of the Elastic IPs to use" }}
{{- end }}
{{- range $i := until (int $p.natCount) }}
{{- $j := ternary 0 $i $v.single_nat_gateway }}
{{- $name := printf "%s-%s" $p.base (include "vpc.element" (list $v.azs $j "azs")) }}
{{- $eip := include "ack.name" (list $.Release.Name "nat-eip" (toString $i)) }}
{{- if not $v.reuse_nat_ips }}
---
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: ElasticIPAddress
metadata:
{{- include "ack.metadata" (dict "root" $ "name" $eip "id" (printf "nat-eip-%d" $i) "region" $v.region) | nindent 2 }}
spec:
  tags:
{{- include "ack.tagList" (list (include "ack.tags" (list $ (dict "Name" $name) $v.tags $v.nat_eip_tags) | fromJson)) | nindent 4 }}
{{- end }}
---
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: NATGateway
metadata:
{{- include "ack.metadata" (dict "root" $ "name" (include "ack.name" (list $.Release.Name "nat" (toString $i))) "id" (printf "nat-%d" $i) "region" $v.region) | nindent 2 }}
spec:
{{- if $v.reuse_nat_ips }}
  allocationID: {{ include "vpc.element" (list $v.external_nat_ip_ids $j "external_nat_ip_ids") | quote }}
{{- else }}
  allocationRef:
{{- include "vpc.ref" (include "ack.name" (list $.Release.Name "nat-eip" (toString $j))) | nindent 4 }}
{{- end }}
  subnetRef:
{{- include "vpc.ref" (index $p.subnets.public (mod $j (len $p.subnets.public))).k8s | nindent 4 }}
  tags:
{{- include "ack.tagList" (list (include "ack.tags" (list $ (dict "Name" $name) $v.tags $v.nat_gateway_tags) | fromJson)) | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
