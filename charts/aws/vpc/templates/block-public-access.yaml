{{- /*
Copyright 2026 High Five Labs
SPDX-License-Identifier: Apache-2.0

main.tf, "VPC Block Public Access": the account's and Region's options
(aws_vpc_block_public_access_options), as ack-extensions' Cloud Control
kind VPCBlockPublicAccessOptions, which ACK has no kind for: only with
allow_alpha: true (docs/design.md, "Alpha kinds"). The exclusions
(aws_vpc_block_public_access_exclusion) take this chart's VPC's or
subnets' IDs, and their kind has no reference to either: refused
(refusals.yaml).
*/ -}}
{{- $p := include "vpc.plan" . | fromJson -}}
{{- $v := .Values -}}
{{- if and $p.create $v.vpc_block_public_access_options }}
{{- include "ack.alpha" (list $ "vpc_block_public_access_options" $v.vpc_block_public_access_options "VPCBlockPublicAccessOptions (ack-extensions, Cloud Control)") }}
{{- $mode := get $v.vpc_block_public_access_options "internet_gateway_block_mode" }}
{{- if not $mode }}
{{- fail "vpc: vpc_block_public_access_options needs internet_gateway_block_mode (off, block-bidirectional or block-ingress)" }}
{{- end }}
---
apiVersion: ec2.cloudcontrol.aws.hfl.dev/v1alpha1
kind: VPCBlockPublicAccessOptions
metadata:
{{- include "ack.metadata" (dict "root" $ "name" (include "ack.name" (list .Release.Name "block-public-access")) "id" "vpc-block-public-access-options" "region" $v.region) | nindent 2 }}
spec:
  internetGatewayBlockMode: {{ $mode | quote }}
{{- end }}
