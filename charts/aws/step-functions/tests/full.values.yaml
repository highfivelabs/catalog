# Every ported feature: an EXPRESS machine published, logging ALL to the log
# group the chart makes (ARN built from account_id and region), X-Ray, the
# service integrations with default resources (one naming the account), a
# JSON policy, two of a list, policy statements, a policy ARN beside them
# (so every policy is attached by ARN), the role's options, and ABANDON.
name: orders
region: us-east-2
account_id: "111122223333"
type: express
publish: true
definition: '{"StartAt": "Done", "States": {"Done": {"Type": "Succeed"}}}'
logging_configuration: {level: ALL, include_execution_data: "true"}
cloudwatch_log_group_retention_in_days: 14
cloudwatch_log_group_kms_key_id: arn:aws:kms:us-east-2:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab
cloudwatch_log_group_tags: {Logs: "yes"}
service_integrations:
  xray: {xray: true}
  stepfunction_Sync:
    stepfunction: ["arn:aws:states:us-east-2:111122223333:stateMachine:child"]
    stepfunction_Wildcard: ["arn:aws:states:us-east-2:111122223333:execution:child:*"]
    events: true
  dynamodb:
    dynamodb: ["arn:aws:dynamodb:us-east-2:111122223333:table/Orders"]
attach_policy_json: true
policy_json: '{"Version": "2012-10-17", "Statement": [{"Effect": "Allow", "Action": ["xray:GetSamplingStatisticSummaries"], "Resource": ["*"]}]}'
attach_policy_jsons: true
number_of_policy_jsons: 2
policy_jsons:
  - '{"Version": "2012-10-17", "Statement": [{"Effect": "Allow", "Action": ["sqs:SendMessage"], "Resource": ["*"]}]}'
  - '{"Version": "2012-10-17", "Statement": [{"Effect": "Allow", "Action": ["sns:Publish"], "Resource": ["*"]}]}'
attach_policy_statements: true
policy_statements:
  s3_read:
    effect: Allow
    actions: ["s3:GetObject"]
    resources: ["arn:aws:s3:::orders/*"]
    condition:
      - {test: StringEquals, variable: "aws:PrincipalAccount", values: ["111122223333"]}
attach_policy: true
policy: arn:aws:iam::aws:policy/AWSXrayReadOnlyAccess
policy_path: /sfn/
role_name: orders-sfn
role_description: Runs the orders state machine
role_path: /sfn/
role_permissions_boundary: arn:aws:iam::111122223333:policy/boundary
role_tags: {Role: sfn}
trusted_entities: [events.amazonaws.com]
tags: {Environment: dev}
deletion_policy: ABANDON
