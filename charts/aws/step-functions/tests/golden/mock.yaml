# Source: step-functions/templates/state-machine.yaml
apiVersion: sfn.services.k8s.aws/v1alpha1
kind: StateMachine
metadata:
  name: mock-state-machine
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: step-functions
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "state-machine"
    services.k8s.aws/region: "us-east-1"
spec:
  name: "catalog-sfn"
  definition: "{\"StartAt\": \"Hello\", \"States\": {\"Hello\": {\"Type\": \"Pass\", \"Result\": \"Hello\", \"Next\": \"World\"}, \"World\": {\"Type\": \"Pass\", \"Result\": \"World\", \"End\": true}}}"
  roleRef:
    from:
      name: mock-role
  type_: "STANDARD"
  loggingConfiguration:
    destinations:
      - cloudWatchLogsLogGroup:
          logGroupARN: "arn:aws:logs:us-east-1:000000000000:log-group:/aws/vendedlogs/states/catalog-sfn:*"
    includeExecutionData: true
    level: "ALL"
  tracingConfiguration:
    enabled: true
  tags:
    - key: "Name"
      value: "catalog-sfn"
    - key: "catalog-test"
      value: "true"
