# The module's README usage: a state machine calling a Lambda function,
# with the role's Lambda integration policy on that function.
name: my-stepfunction
region: eu-west-1
definition: |
  {"Comment": "A Hello World example of the Amazon States Language using Pass states", "StartAt": "Hello", "States": {"Hello": {"Type": "Pass", "Result": "Hello", "Next": "World"}, "World": {"Type": "Pass", "Result": "World", "End": true}}}
service_integrations:
  lambda:
    lambda: ["arn:aws:lambda:eu-west-1:111122223333:function:test1", "arn:aws:lambda:eu-west-1:111122223333:function:test2"]
type: STANDARD
tags: {Module: my}
