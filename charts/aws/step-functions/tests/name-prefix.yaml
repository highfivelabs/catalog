#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): the
# state machine's name and the log group's (unique in the account and
# region) and the role's and policies' (unique in the account) carry the
# namePrefix; the policies are named after the role.
exempt: {}
nameFields:
  StateMachine: name
  Role: name
  Policy: name
  LogGroup: name
