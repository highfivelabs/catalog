synced: 2026-11-12
# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set (to anything but the module's default), or
# accepts only in part. Read by `task coverage`; `task coverage-verify`
# renders the chart to check that each one is refused. kind: gap (no ACK or
# ack-extensions kind or field), not-ported (ACK has it, the chart does not
# map it yet) or by-design (Bundt replaces it). partial: the variable is
# accepted, the reason says what is not carried.
refused:
- variable: encryption_configuration
  kind: gap
  reason: "ACK's StateMachine (sfn-controller v1.9.1) has no encryptionConfiguration field"
- variable: role_force_detach_policies
  kind: gap
  reason: "accepted true (the default) only: ACK detaches the role's managed policies before it deletes the role, always"
  partial: true
- variable: sfn_state_machine_timeouts
  kind: by-design
  reason: "Terraform's create, update and delete timeouts: ACK retries until the state machine is synced, and Bundt waits for it"
