# Applied to the fake AWS by hack/mock-apply-aws.sh: an instance in the
# subnet tests/mock.needs.yaml makes (subnet_id, tests/mock.set.yaml), with
# an IAM role and instance profile, launched from the module's default AMI
# parameter (resolve:ssm:, which EC2 resolves at launch: no fake's own AMI
# ID), and an Elastic IP associated with it (allow_alpha: EIPAssociation,
# ack-extensions).
name: catalog-instance
region: us-east-1
instance_type: t3.micro
subnet_id: subnet-set-by-mock-set-yaml
create_security_group: false
create_iam_instance_profile: true
iam_role_policies:
  ssm: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
tags: {catalog-test: "true"}
allow_alpha: true
create_eip: true
eip_tags: {catalog-test: eip}
