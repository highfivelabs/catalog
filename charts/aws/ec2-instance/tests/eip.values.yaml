# An instance with an Elastic IP associated with it (allow_alpha:
# EIPAssociation, ack-extensions), the address tagged with tags and eip_tags.
name: web
region: us-east-1
instance_type: t3.micro
subnet_id: subnet-0a1b2c3d4e5f60001
create_security_group: false
vpc_security_group_ids: [sg-0a1b2c3d4e5f60001]
allow_alpha: true
create_eip: true
eip_tags: {Role: public}
tags: {Environment: dev}
