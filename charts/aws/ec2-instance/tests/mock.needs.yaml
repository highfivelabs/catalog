#
# What tests/mock.values.yaml needs and the chart does not make: a VPC, a
# subnet for the instance and an internet gateway (AWS associates an
# Elastic IP with an instance only in a VPC with one); hack/mock-apply-aws.sh
# applies them first, deletes them last.
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: VPC
metadata:
  name: instance-vpc
  annotations:
    services.k8s.aws/region: us-east-1
spec:
  cidrBlocks: [10.40.0.0/16]
---
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: Subnet
metadata:
  name: instance-subnet
  annotations:
    services.k8s.aws/region: us-east-1
spec:
  cidrBlock: 10.40.1.0/24
  availabilityZone: us-east-1a
  vpcRef:
    from:
      name: instance-vpc
---
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: InternetGateway
metadata:
  name: instance-igw
  annotations:
    services.k8s.aws/region: us-east-1
spec:
  vpcRef:
    from:
      name: instance-vpc
