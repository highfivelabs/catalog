#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): the
# IAM role's name, unique in its account, and its instance profile's carry
# the namePrefix. EC2 names an instance by the ID it assigns; its Name tag
# carries the namePrefix but is not unique.
exempt:
  Instance: "EC2 assigns an instance's ID; its Name tag is not unique"
nameFields:
  Role: name
  InstanceProfile: name
