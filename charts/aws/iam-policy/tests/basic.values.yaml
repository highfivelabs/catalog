# The submodule's README, "Usage", with name in place of name_prefix (a
# random suffix would change between renders).
name: example
path: /
description: My example policy
policy: |
  {
    "Version": "2012-10-17",
    "Statement": [
      {
        "Action": [
          "ec2:Describe*"
        ],
        "Effect": "Allow",
        "Resource": "*"
      }
    ]
  }
tags:
  Environment: test
