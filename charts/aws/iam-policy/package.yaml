#
# The Bundt Package for this chart (docs/design.md, "Outputs"): the
# submodule's four outputs, from the live Policy (resources.policy).
# Terraform's id of a policy is its ARN.
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: aws-iam-policy
spec:
  version: 0.1.0
  engine: helm
  providers: [ack]
  outputs:
    id: >-
      'policy' in resources ? resources.policy.status.ackResourceMetadata.arn : null
    arn: >-
      'policy' in resources ? resources.policy.status.ackResourceMetadata.arn : null
    name: >-
      'policy' in resources ? resources.policy.spec.name : null
    policy: >-
      'policy' in resources ? resources.policy.spec.policyDocument : null
