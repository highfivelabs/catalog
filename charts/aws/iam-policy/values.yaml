#
# Values mirror the Terraform variables of terraform-aws-modules' iam module,
# its iam-policy submodule (v6.8.2): same names, types and defaults, so a
# module block's arguments become a values file one to one.
# values.schema.json carries the types. A variable the chart cannot carry
# stays here and stops the render when set (upstream.yaml lists them;
# README.md says why).

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables, except tags, which is the module's own.
#
# The policy's name in full, {policy}. A name set here takes no namePrefix.
# Unset, the policy is named name.
names: {}
# An optional convenience: "<namePrefix>-" in front of the policy's name
# (never one set under names). Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. They stay in Kubernetes: ACK does not
# copy labels to AWS (AWS tags are the module's tags variable).
labels: {}
# DELETE (default): deleting the component deletes the policy. ABANDON keeps
# it (services.k8s.aws/deletion-policy: retain).
deletion_policy: DELETE

# The module's variables, in alphabetical order, with its defaults.

# Whether to create the IAM policy
create: true
# The description of the policy
description: null
# The name of the policy
name: null
# IAM policy name prefix
# Not supported (gap): a policy name with Terraform's random suffix
# (name_prefix) would change between renders; set name (the namePrefix value
# keeps two Instances' policies apart).
name_prefix: null
# The path of the policy in IAM
path: null
# The path of the policy in IAM (tpl file)
policy: ""
# A map of tags to add to all resources.
tags: {}
