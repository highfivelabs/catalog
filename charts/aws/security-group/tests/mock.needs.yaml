# What tests/mock.values.yaml needs and the chart does not make: a VPC for
# the group (hack/mock-apply-aws.sh applies it first, deletes it last).
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: VPC
metadata:
  name: sg-vpc
  annotations:
    services.k8s.aws/region: us-east-1
spec:
  cidrBlocks: [10.30.0.0/16]
  tags:
    - key: catalog-test
      value: "true"
