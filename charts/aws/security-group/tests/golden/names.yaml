---
# Source: security-group/templates/security-group.yaml
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: SecurityGroup
metadata:
  name: names-sg
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "names"
    app.kubernetes.io/name: security-group
    app.kubernetes.io/version: "0.1.0"
    hfl.dev/team: "shop"
  annotations:
    hfl.dev/id: "security-group"
spec:
  name: "shop-dev-euw1-web"
  description: "Managed by Terraform"
  ingressRules:
    - ipProtocol: "tcp"
      fromPort: 80
      toPort: 80
      userIDGroupPairs:
        - {"groupID":"sg-0123456789abcdef0"}
    - ipProtocol: "tcp"
      fromPort: 443
      toPort: 443
      ipv6Ranges:
        - {"cidrIPv6":"::/0"}
    - ipProtocol: "tcp"
      fromPort: 443
      toPort: 443
      prefixListIDs:
        - {"description":"from the prefix list","prefixListID":"pl-12345678"}
  tags:
    - key: "team"
      value: "shop"
