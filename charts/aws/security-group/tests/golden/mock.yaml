# Source: security-group/templates/security-group.yaml
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: SecurityGroup
metadata:
  name: mock-sg
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: security-group
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "security-group"
    services.k8s.aws/region: "us-east-1"
spec:
  name: "catalog-sg"
  description: "Managed by Terraform"
  ingressRules:
    - ipProtocol: "tcp"
      fromPort: 443
      toPort: 443
      ipRanges:
        - {"cidrIP":"10.0.0.0/16"}
    - ipProtocol: "-1"
      userIDGroupPairs:
        - {}
  egressRules:
    - ipProtocol: "-1"
      ipRanges:
        - {"cidrIP":"0.0.0.0/0"}
  tags:
    - key: "catalog-test"
      value: "true"
