# Applied to the fake AWS by hack/mock-apply-aws.sh: a group in the VPC
# tests/mock.needs.yaml makes (vpc_id, tests/mock.set.yaml), with a self
# rule, a CIDR rule and an egress rule, associated with a second VPC
# (allow_alpha: SecurityGroupVpcAssociation, ack-extensions).
name: catalog-sg
vpc_id: vpc-set-by-mock-set-yaml
region: us-east-1
ingress_rules:
  https: {from_port: 443, cidr_ipv4: 10.0.0.0/16}
  self-all: {ip_protocol: "-1", referenced_security_group_id: self}
egress_rules:
  all: {ip_protocol: "-1", cidr_ipv4: 0.0.0.0/0}
tags: {catalog-test: "true"}
allow_alpha: true
vpc_associations:
  other: {vpc_id: vpc-set-by-mock-set-yaml}
