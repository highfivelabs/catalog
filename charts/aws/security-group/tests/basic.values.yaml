# The module's README, "Usage", "Root module".
name: example
description: Example security group
vpc_id: vpc-12345678
ingress_rules:
  https:
    from_port: 443
    ip_protocol: tcp
    cidr_ipv4: 10.0.0.0/16
    description: HTTPS from internal
  self-all:
    ip_protocol: "-1"
    referenced_security_group_id: self
    description: All traffic from members of this SG
egress_rules:
  all:
    ip_protocol: "-1"
    cidr_ipv4: 0.0.0.0/0
tags:
  Environment: dev
