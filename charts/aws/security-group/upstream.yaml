# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set (to anything but the module's default), or
# accepts only in part. Read by `task coverage`; `task coverage-verify`
# renders the chart to check that each one is refused. kind: gap (no ACK or
# ack-extensions kind or field), not-ported (ACK has it, the chart does not
# map it yet) or by-design (Bundt replaces it). partial: the variable is
# accepted, the reason says what is not carried.
refused:
- variable: egress_rules
  kind: gap
  reason: "accepted, but each rule's name and tags (the Name tag of an aws_vpc_security_group_*_rule) are not carried: ACK keeps a group's rules inline in SecurityGroup, which has no per-rule tags"
  partial: true
  fields:
  - name
  - tags
- variable: enable_exclusive_rules
  kind: gap
  reason: "ACK keeps the group's rules inline and owns all of them, as enable_exclusive_rules: true does; letting rules added elsewhere stay has no ACK equivalent"
- variable: ingress_rules
  kind: gap
  reason: "accepted, but each rule's name and tags (the Name tag of an aws_vpc_security_group_*_rule) are not carried: ACK keeps a group's rules inline in SecurityGroup, which has no per-rule tags"
  partial: true
  fields:
  - name
  - tags
- variable: revoke_rules_on_delete
  kind: gap
  reason: ACK's SecurityGroup has no field to revoke its rules before it is deleted
- variable: timeouts
  kind: by-design
  reason: "Terraform's create and delete timeouts: ACK retries until the group is synced, and Bundt waits for it"
- variable: use_name_prefix
  kind: gap
  reason: "accepted: true (the default) names the group name as given, without Terraform's random suffix (name_prefix), since a render must not change between plans; the namePrefix value keeps two Instances' groups apart"
  partial: true
- variable: vpc_associations
  kind: alpha
  reason: "SecurityGroupVpcAssociation is an ack-extensions kind (Cloud Control, outside ACK's releases): needs allow_alpha: true"
  partial: true
  needs_allow_alpha: true
- variable: vpc_id
  kind: gap
  reason: "accepted when set; unset (Terraform's default, the account's default VPC) is refused: ACK's SecurityGroup needs its VPC's ID (vpcID or vpcRef) and the chart cannot look the default VPC up"
  partial: true
