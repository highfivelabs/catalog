The module variables this chart keeps in its values but cannot carry
(upstream.yaml, "refused"): each stops the render, naming the gap, when it
is set to anything but its Terraform default. Renders nothing.
*/ -}}
{{- include "ack.unchanged" (list $ "enable_exclusive_rules" .Values.enable_exclusive_rules "true" "ACK keeps the group's rules inline and owns all of them, as enable_exclusive_rules: true does; letting rules added elsewhere stay has no ACK equivalent") }}
{{- include "ack.unsupported" (list $ "revoke_rules_on_delete" .Values.revoke_rules_on_delete "ACK's SecurityGroup has no field to revoke its rules before it is deleted") }}
{{- include "ack.unsupported" (list $ "timeouts" .Values.timeouts "Terraform's create and delete timeouts: ACK retries until the group is synced, and Bundt waits for it") }}
{{- include "ack.unsupported" (list $ "vpc_associations" .Values.vpc_associations "ack-extensions' SecurityGroupVpcAssociation (Cloud Control) takes the group's ID, with no reference to this chart's group (groupRef), so it cannot be wired in one render") }}
