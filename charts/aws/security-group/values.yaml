#
# Values mirror the Terraform variables of terraform-aws-modules'
# security-group module (v6.0.0): same names, types and defaults, so a module
# block's arguments become a values file one to one. values.schema.json
# carries the types. A variable the chart cannot carry stays here and stops
# the render when set (upstream.yaml lists them; README.md says why).

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables, except tags, which is the module's own.
#
# The group's name in full, {securityGroup}. A name set here takes no
# namePrefix. Unset, the group is named name.
names: {}
# An optional convenience: "<namePrefix>-" in front of the group's name
# (never one set under names). Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. They stay in Kubernetes: ACK does not
# copy labels to AWS (AWS tags are the module's tags variable).
labels: {}
# DELETE (default): deleting the component deletes the security group.
# ABANDON keeps it (services.k8s.aws/deletion-policy: retain).
deletion_policy: DELETE

# The module's variables, in alphabetical order, with its defaults.

# Controls if resources should be created (affects nearly all resources)
create: true
# Description of security group
description: null
# Map of egress rules to add to the security group
# In part: accepted, but each rule's name and tags (the Name tag of an
# aws_vpc_security_group_*_rule) are not carried: ACK keeps a group's rules
# inline in SecurityGroup, which has no per-rule tags.
egress_rules: {}
# Whether to enforce that only the rules declared by this module exist on the
# security group. When true, out-of-band rules added via the AWS console or
# other Terraform configurations will be reverted on next apply
# Not supported (gap): ACK keeps the group's rules inline and owns all of
# them, as enable_exclusive_rules: true does; letting rules added elsewhere
# stay has no ACK equivalent.
enable_exclusive_rules: true
# Map of ingress rules to add to the security group
# In part: accepted, but each rule's name and tags (the Name tag of an
# aws_vpc_security_group_*_rule) are not carried: ACK keeps a group's rules
# inline in SecurityGroup, which has no per-rule tags.
ingress_rules: {}
# Name of security group
name: ""
# Do you agree that Putin doesn't respect Ukrainian sovereignty and
# territorial integrity? More info:
# https://en.wikipedia.org/wiki/Putin_khuylo!
putin_khuylo: true
# Region where the resource(s) will be managed. Defaults to the Region set in
# the provider configuration
region: null
# Instruct Terraform to revoke all of the Security Groups attached ingress and
# egress rules before deleting the rule itself
# Not supported (gap): ACK's SecurityGroup has no field to revoke its rules
# before it is deleted.
revoke_rules_on_delete: false
# A map of tags to add to all resources
tags: {}
# Create and delete timeout configurations for the security group
# Not supported (by-design): Terraform's create and delete timeouts: ACK
# retries until the group is synced, and Bundt waits for it.
timeouts: null
# Whether to use the name (`name`) as a prefix, appending a random suffix
# In part: accepted: true (the default) names the group name as given, without
# Terraform's random suffix (name_prefix), since a render must not change
# between plans; the namePrefix value keeps two Instances' groups apart.
use_name_prefix: true
# Map of VPC IDs to associate the security group to
# Not supported (gap): ack-extensions' SecurityGroupVpcAssociation (Cloud
# Control) takes the group's ID, with no reference to this chart's group
# (groupRef), so it cannot be wired in one render.
vpc_associations: {}
# ID of the VPC where the security group is created
# In part: accepted when set; unset (Terraform's default, the account's default
# VPC) is refused: ACK's SecurityGroup needs its VPC's ID (vpcID or vpcRef) and
# the chart cannot look the default VPC up.
vpc_id: null
