#
# The Bundt Package for this chart (docs/design.md, "Outputs"): the module's
# outputs for what the chart ports, from the live Role (resources.role) and
# custom Policy (resources.policy; a policy's Terraform id is its ARN). The
# module gives null for what it did
# not make; so do these. Not provided: associations, a map of whole
# Terraform objects (each association's live object has them).
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: aws-eks-pod-identity
spec:
  version: 0.1.0
  engine: helm
  providers: [ack]
  outputs:
    iam_role_arn: >-
      'role' in resources ? resources.role.status.ackResourceMetadata.arn : null
    iam_role_name: >-
      'role' in resources ? resources.role.spec.name : null
    iam_role_path: >-
      'role' in resources ? resources.role.spec.path : null
    iam_role_unique_id: >-
      'role' in resources && has(resources.role.status.roleID) ? resources.role.status.roleID : null
    iam_policy_arn: >-
      'policy' in resources ? resources.policy.status.ackResourceMetadata.arn : null
    iam_policy_name: >-
      'policy' in resources ? resources.policy.spec.name : null
    iam_policy_id: >-
      'policy' in resources ? resources.policy.status.ackResourceMetadata.arn : null
