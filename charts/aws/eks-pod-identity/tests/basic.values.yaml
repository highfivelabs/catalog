# The module's README usage, custom: a role with a custom policy of one
# statement, associated with a service account.
name: custom
policy_statements:
  - sid: S3ReadOnly
    actions: ["s3:GetObject", "s3:ListBucket"]
    resources: ["arn:aws:s3:::my-bucket", "arn:aws:s3:::my-bucket/*"]
attach_custom_policy: true
associations:
  this:
    cluster_name: example
    namespace: default
    service_account: example-sa
tags: {Environment: dev}
