#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): the
# role's name and the custom policy's (the same), unique in the account,
# carry the namePrefix. An association has no name.
exempt:
  PodIdentityAssociation: "EKS assigns its ID; a cluster, namespace and service account identify it"
nameFields:
  Role: name
  Policy: name
