---
# Source: eks-pod-identity/templates/role.yaml
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: basic-role
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: eks-pod-identity
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "role"
spec:
  name: "custom"
  path: "/"
  assumeRolePolicyDocument: "{\"Statement\":[{\"Action\":[\"sts:AssumeRole\",\"sts:TagSession\"],\"Effect\":\"Allow\",\"Principal\":{\"Service\":[\"pods.eks.amazonaws.com\"]}}],\"Version\":\"2012-10-17\"}"
  policyRefs:
    - from:
        name: basic-policy
  tags:
    - key: "Environment"
      value: "dev"
---
# Source: eks-pod-identity/templates/associations.yaml
apiVersion: eks.services.k8s.aws/v1alpha1
kind: PodIdentityAssociation
metadata:
  name: basic-association-this
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: eks-pod-identity
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "association-this"
spec:
  clusterName: "example"
  namespace: "default"
  serviceAccount: "example-sa"
  roleRef:
    from:
      name: basic-role
  tags:
    "Environment": "dev"
---
# Source: eks-pod-identity/templates/role.yaml
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Policy
metadata:
  name: basic-policy
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: eks-pod-identity
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "policy"
spec:
  name: "custom"
  path: "/"
  description: "Custom IAM Policy"
  policyDocument: "{\"Statement\":[{\"Action\":[\"s3:GetObject\",\"s3:ListBucket\"],\"Effect\":\"Allow\",\"Resource\":[\"arn:aws:s3:::my-bucket\",\"arn:aws:s3:::my-bucket/*\"],\"Sid\":\"S3ReadOnly\"}],\"Version\":\"2012-10-17\"}"
  tags:
    - key: "Environment"
      value: "dev"
