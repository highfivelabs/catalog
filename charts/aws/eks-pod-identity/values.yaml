# additional_policy_arns.
policy_name_prefix: "AmazonEKS_"
# A list of IAM policy [statements](https://registry.terraform.io/providers/has
# hicorp/aws/latest/docs/data-sources/iam_policy_document#statement) for custom
# permission usage
policy_statements: null
# Region where the resource(s) will be managed. Defaults to the Region set in
# the provider configuration
region: null
# List of IAM policy documents that are merged together into the exported
# document
source_policy_documents: []
# A map of tags to add to all resources
tags: {}
# A list of conditions to add to the role trust policy
trust_policy_conditions: []
# A list of IAM policy [statements](https://registry.terraform.io/providers/has
# hicorp/aws/latest/docs/data-sources/iam_policy_document#statement) for the
# role trust policy
trust_policy_statements: null
# Determines whether the role name and policy name(s) are used as a prefix
# In part: the role and the custom policy are named name, without Terraform's
# random suffix (name_prefix), since a render must not change between plans;
# the namePrefix value keeps two Instances' roles apart.
use_name_prefix: true
# KMS key ARNs to allow Velero to manage encrypted s3 buckets
# Not supported (not ported): the module's preset policies (policy_name_prefix
# and the attach_*_policy presets with their names and ARNs) are not ported
# yet: iam/Policy is stable; pass a preset's document as
# source_policy_documents with attach_custom_policy, or its ARN in
# additional_policy_arns.
velero_kms_arns: []
# Custom name of the Velero IAM policy
# Not supported (not ported): the module's preset policies (policy_name_prefix
# and the attach_*_policy presets with their names and ARNs) are not ported
# yet: iam/Policy is stable; pass a preset's document as
# source_policy_documents with attach_custom_policy, or its ARN in
# additional_policy_arns.
velero_policy_name: null
# List of S3 Bucket ARNs that Velero needs access to list
# Not supported (not ported): the module's preset policies (policy_name_prefix
# and the attach_*_policy presets with their names and ARNs) are not ported
# yet: iam/Policy is stable; pass a preset's document as
# source_policy_documents with attach_custom_policy, or its ARN in
# additional_policy_arns.
velero_s3_bucket_arns: []
# S3 path ARNs to allow Velero to manage items at the provided path(s). This is
# required if `attach_mountpoint_s3_csi_policy = true`
# Not supported (not ported): the module's preset policies (policy_name_prefix
# and the attach_*_policy presets with their names and ARNs) are not ported
# yet: iam/Policy is stable; pass a preset's document as
# source_policy_documents with attach_custom_policy, or its ARN in
# additional_policy_arns.
velero_s3_bucket_path_arns: []
