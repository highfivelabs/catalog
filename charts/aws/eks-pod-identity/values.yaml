# Values mirror the Terraform variables of terraform-aws-modules'
# eks-pod-identity module (v2.10.0): same names, types and defaults, so a
# module block's arguments become a values file one to one.
# values.schema.json carries the types. A variable the chart cannot carry
# stays here and stops the render when set (upstream.yaml lists them;
# README.md says why).

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables, except tags, which is the module's own.
#
# The role's name in full, {role}; the custom policy shares it. A name set
# here takes no namePrefix. Unset, the role is named name.
names: {}
# An optional convenience: "<namePrefix>-" in front of the role's name
# (never one set under names). Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. They stay in Kubernetes: ACK does not
# copy labels to AWS (AWS tags are the module's tags variable).
labels: {}
# The AWS account and partition, which the module reads from the provider.
# A chart cannot read them, so Bundt fills account_id from the Environment.
# Needed only to attach the custom policy beside additional_policy_arns
# (ACK's Role takes policy ARNs or references, not both).
account_id: null
partition: aws
# DELETE (default): deleting the component deletes the role, its policy and
# its associations. ABANDON keeps them
# (services.k8s.aws/deletion-policy: retain).
deletion_policy: DELETE

# The module's variables, in alphabetical order, with its defaults.

# ARNs of additional policies to attach to the IAM role
additional_policy_arns: {}
# Custom name of the Amazon Managed Service for Prometheus IAM policy
# Not supported (not ported): the module's preset policies (policy_name_prefix
# and the attach_*_policy presets with their names and ARNs) are not ported
# yet: iam/Policy is stable; pass a preset's document as
# source_policy_documents with attach_custom_policy, or its ARN in
# additional_policy_arns.
amazon_managed_service_prometheus_policy_name: null
# List of AMP Workspace ARNs to read and write metrics
# Not supported (not ported): the module's preset policies (policy_name_prefix
# and the attach_*_policy presets with their names and ARNs) are not ported
