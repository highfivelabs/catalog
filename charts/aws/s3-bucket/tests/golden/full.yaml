---
# Source: s3-bucket/templates/bucket.yaml
apiVersion: s3.services.k8s.aws/v1alpha1
kind: Bucket
metadata:
  name: full-bucket
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: s3-bucket
    app.kubernetes.io/version: "0.1.0"
    hfl.dev/team: "platform"
  annotations:
    hfl.dev/id: "bucket"
    services.k8s.aws/region: "eu-west-1"
    services.k8s.aws/deletion-policy: retain
spec:
  name: "full-bucket"
  createBucketConfiguration:
    locationConstraint: "eu-west-1"
  objectLockEnabledForBucket: true
  ownershipControls:
    rules:
      - objectOwnership: "BucketOwnerEnforced"
  publicAccessBlock:
    blockPublicACLs: true
    blockPublicPolicy: true
    ignorePublicACLs: true
    restrictPublicBuckets: true
  versioning:
    status: "Enabled"
  encryption:
    rules:
      -
        bucketKeyEnabled: true
        applyServerSideEncryptionByDefault:
          sseAlgorithm: "aws:kms"
          kmsMasterKeyID: "alias/s3"
  cors:
    corsRules:
      - allowedMethods: ["PUT","POST"]
        allowedOrigins: ["https://example.com"]
        allowedHeaders: ["*"]
        exposeHeaders: ["ETag"]
        maxAgeSeconds: 3000
        id: "web"
  logging:
    loggingEnabled:
      targetBucket: "logs-bucket"
      targetPrefix: "log/"
      targetObjectKeyFormat:
        partitionedPrefix:
          partitionDateSource: "EventTime"
  website:
    indexDocument: {suffix: "index.html"}
    errorDocument: {key: "error.html"}
    routingRules:
      - {"condition":{"keyPrefixEquals":"docs/"},"redirect":{"replaceKeyPrefixWith":"documents/"}}
  accelerate:
    status: "Enabled"
  requestPayment:
    payer: "Requester"
  objectLockConfiguration:
    rule:
      defaultRetention:
        mode: "GOVERNANCE"
        days: 1
  policy: "{\"Statement\":[{\"Action\":[\"s3:*\"],\"Condition\":{\"NumericLessThan\":{\"s3:TlsVersion\":[\"1.2\"]}},\"Effect\":\"Deny\",\"Principal\":\"*\",\"Resource\":[\"arn:aws:s3:::full-bucket\",\"arn:aws:s3:::full-bucket/*\"],\"Sid\":\"denyOutdatedTLS\"},{\"Action\":[\"s3:*\"],\"Condition\":{\"Bool\":{\"aws:SecureTransport\":[\"false\"]}},\"Effect\":\"Deny\",\"Principal\":\"*\",\"Resource\":[\"arn:aws:s3:::full-bucket\",\"arn:aws:s3:::full-bucket/*\"],\"Sid\":\"denyInsecureTransport\"},{\"Action\":\"s3:GetObject\",\"Effect\":\"Allow\",\"Principal\":{\"AWS\":\"arn:aws:iam::111122223333:root\"},\"Resource\":\"arn:aws:s3:::full-bucket/*\",\"Sid\":\"read\"}],\"Version\":\"2012-10-17\"}"
  tagging:
    tagSet:
      - key: "Owner"
        value: "platform"
