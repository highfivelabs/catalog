# Values mirror the Terraform variables of terraform-aws-modules' rds module
# (v7.2.2): same names, types and defaults, so a module block's arguments
# become a values file one to one. values.schema.json carries the types. A
# variable the chart cannot carry stays here and stops the render when set
# (upstream.yaml lists them; README.md says why).

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables, except tags, which is the module's own.
#
# Names in full, any of {dbInstance, dbSubnetGroup, parameterGroup,
# optionGroup, monitoringRole}. A name set here takes no namePrefix. Unset,
# each is named as the module names it (identifier, or the group's own
# name variable; monitoring_role_name).
names: {}
# An optional convenience: "<namePrefix>-" in front of every name the chart
# gives (never one set under names). Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. They stay in Kubernetes: ACK does not
# copy labels to AWS (AWS tags are the module's tags variable).
labels: {}
# The ack-extensions OptionGroup (create_db_option_group with an engine
# other than postgres) and DBRoleAssociation (db_instance_role_associations)
# render only with allow_alpha: true (docs/design.md, "Alpha kinds").
allow_alpha: false
# DELETE (default): deleting the component deletes the DB instance (with a
# final snapshot unless skip_final_snapshot) and everything else it made.
# ABANDON keeps them (services.k8s.aws/deletion-policy: retain).
deletion_policy: DELETE

# The module's variables, in alphabetical order, with its defaults.

# The allocated storage in gigabytes
allocated_storage: null
# Indicates that major version upgrades are allowed. Changing this parameter
# does not result in an outage and the change is asynchronously applied as soon
# as possible
# Not supported (gap): ACK's DBInstance has no field for it
# (AllowMajorVersionUpgrade).
allow_major_version_upgrade: false
# Specifies whether any database modifications are applied immediately, or
# during the next maintenance window
# In part: accepted: ACK applies a DB instance's changes immediately, as true
# does; false (the default: wait for the maintenance window) is not carried.
apply_immediately: false
# Indicates that minor engine upgrades will be applied automatically to the DB
# instance during the maintenance window
auto_minor_version_upgrade: true
# The Availability Zone of the RDS instance
availability_zone: null
# The days to retain backups for
backup_retention_period: null
# The daily time range (in UTC) during which automated backups are created if
# they are enabled. Example: '09:46-10:16'. Must not overlap with
# maintenance_window
backup_window: null
# Enables low-downtime updates using RDS Blue/Green deployments.
# Not supported (gap): ACK's DBInstance has no blue/green update.
blue_green_update: null
# Specifies the identifier of the CA certificate for the DB instance
ca_cert_identifier: null
# The character set name to use for DB encoding in Oracle instances. This can't
# be changed. See Oracle Character Sets Supported in Amazon RDS and Collations
# and Character Sets for Microsoft SQL Server for more information. This can
# only be set on creation
character_set_name: null
# Specified the log class of the log group. Possible values are: STANDARD or
# INFREQUENT_ACCESS
cloudwatch_log_group_class: null
# The ARN of the KMS Key to use when encrypting log data
cloudwatch_log_group_kms_key_id: null
# The number of days to retain CloudWatch logs for the DB instance
cloudwatch_log_group_retention_in_days: 7
# Set to true if you do not wish the log group (and any logs it may contain) to
# be deleted at destroy time, and instead just remove the log group from the
# Terraform state
cloudwatch_log_group_skip_destroy: null
# Additional tags for the CloudWatch log group(s)
cloudwatch_log_group_tags: {}
# On delete, copy all Instance tags to the final snapshot
copy_tags_to_snapshot: true
# Determines whether a CloudWatch log group is created for each
# `enabled_cloudwatch_logs_exports`
create_cloudwatch_log_group: false
# Whether to create a database instance
create_db_instance: true
# Create a database option group
# In part: OptionGroup is an ack-extensions kind (outside ACK's releases): an
# engine other than postgres with create_db_option_group true (the default)
# needs allow_alpha: true, or create_db_option_group: false.
create_db_option_group: true
# Whether to create a database parameter group
create_db_parameter_group: true
# Whether to create a database subnet group
create_db_subnet_group: false
# Create IAM role with a defined name that permits RDS to send enhanced
# monitoring metrics to CloudWatch Logs
create_monitoring_role: false
# RDS custom iam instance profile
custom_iam_instance_profile: null
# Indicates whether to enable a customer-owned IP address (CoIP) for an RDS on
# Outposts DB instance
customer_owned_ip_enabled: null
# The mode of Database Insights that is enabled for the instance. Valid values:
# standard, advanced
database_insights_mode: null
# A map of DB instance supported feature name to role association ARNs.
# In part: DBRoleAssociation is an ack-extensions kind (outside ACK's
# releases): needs allow_alpha: true.
db_instance_role_associations: {}
# Additional tags for the DB instance
db_instance_tags: {}
# The DB name to create. If omitted, no database is created initially
db_name: null
# Additional tags for the DB option group
db_option_group_tags: {}
# Additional tags for the  DB parameter group
db_parameter_group_tags: {}
# Description of the DB subnet group to create
db_subnet_group_description: null
# Name of DB subnet group. DB instance will be created in the VPC associated
# with the DB subnet group. If unspecified, will be created in the default VPC
db_subnet_group_name: null
# Additional tags for the DB subnet group
db_subnet_group_tags: {}
# Determines whether to use `subnet_group_name` as is or create a unique name
# beginning with the `subnet_group_name` as the prefix
# In part: accepted: true (the default) names the subnet group
# db_subnet_group_name (or identifier) as given, without Terraform's random
# suffix, since a render must not change between plans; the namePrefix value
# keeps two Instances' groups apart.
db_subnet_group_use_name_prefix: true
# Use a dedicated log volume (DLV) for the DB instance. Requires Provisioned
# IOPS.
# Not supported (gap): ACK's DBInstance has no field for it.
dedicated_log_volume: false
# Specifies whether to remove automated backups immediately after the DB
# instance is deleted
delete_automated_backups: true
# The database can't be deleted when this value is set to true
deletion_protection: false
# The ID of the Directory Service Active Directory domain to create the
# instance in
domain: null
# (Optional, but required if domain_fqdn is provided) The ARN for the Secrets
# Manager secret with the self managed Active Directory credentials for the
# user joining the domain. Conflicts with domain and domain_iam_role_name.
# Not supported (gap): ACK's DBInstance has no field for it (it takes domain
# and domainIAMRoleName only).
domain_auth_secret_arn: null
# (Optional, but required if domain_fqdn is provided) The IPv4 DNS IP addresses
# of your primary and secondary self managed Active Directory domain
# controllers. Two IP addresses must be provided. If there isn't a secondary
# domain controller, use the IP address of the primary domain controller for
# both entries in the list. Conflicts with domain and domain_iam_role_name.
# Not supported (gap): ACK's DBInstance has no field for it (it takes domain
# and domainIAMRoleName only).
domain_dns_ips: null
# The fully qualified domain name (FQDN) of the self managed Active Directory
# domain. Conflicts with domain and domain_iam_role_name.
# Not supported (gap): ACK's DBInstance has no field for it (it takes domain
# and domainIAMRoleName only).
domain_fqdn: null
# (Required if domain is provided) The name of the IAM role to be used when
# making API calls to the Directory Service
domain_iam_role_name: null
# (Optional, but required if domain_fqdn is provided) The self managed Active
# Directory organizational unit for your DB instance to join. Conflicts with
# domain and domain_iam_role_name.
# Not supported (gap): ACK's DBInstance has no field for it (it takes domain
# and domainIAMRoleName only).
domain_ou: null
# List of log types to enable for exporting to CloudWatch logs. If omitted, no
# logs will be exported. Valid values (depending on engine): alert, audit,
# error, general, listener, slowquery, trace, postgresql (PostgreSQL), upgrade
# (PostgreSQL)
enabled_cloudwatch_logs_exports: []
# The database engine to use
engine: null
# The life cycle type for this DB instance. This setting applies only to RDS
# for MySQL and RDS for PostgreSQL. Valid values are `open-source-rds-extended-
# support`, `open-source-rds-extended-support-disabled`. Default value is
# `open-source-rds-extended-support`.
# Not supported (gap): ACK's DBInstance has no field for it.
engine_lifecycle_support: null
# The engine version to use
engine_version: null
# The family of the DB parameter group
family: null
# The name which is prefixed to the final snapshot on cluster destroy
final_snapshot_identifier_prefix: "final"
# Specifies whether or not the mappings of AWS Identity and Access Management
# (IAM) accounts to database accounts are enabled
iam_database_authentication_enabled: false
# The name of the RDS instance
identifier: null
# The instance type of the RDS instance
instance_class: null
# Determines whether to use `identifier` as is or create a unique identifier
# beginning with `identifier` as the specified prefix
# Not supported (gap): an identifier with Terraform's random suffix would
# change between renders.
instance_use_identifier_prefix: false
# The amount of provisioned IOPS. Setting this implies a storage_type of 'io1'
# or `gp3`. See `notes` for limitations regarding this variable for `gp3`
iops: null
# The ARN for the KMS encryption key. If creating an encrypted replica, set
# this to the destination KMS ARN. If storage_encrypted is set to true and
# kms_key_id is not specified the default KMS key created in your account will
# be used. Be sure to use the full ARN, not a key alias.
kms_key_id: null
# License model information for this DB instance. Optional, but required for
# some DB engines, i.e. Oracle SE1
license_model: null
# The window to perform maintenance in. Syntax: 'ddd:hh24:mi-ddd:hh24:mi'. Eg:
# 'Mon:00:00-Mon:03:00'
maintenance_window: null
# Specifies the major version of the engine that this option group should be
# associated with
major_engine_version: null
# Set to true to allow RDS to manage the master user password in Secrets
# Manager
manage_master_user_password: true
# Whether to manage the master user password rotation. By default, false on
# creation, rotation is managed by RDS. There is not currently a way to disable
# this on initial creation even when set to false. Setting this value to false
# after previously having been set to true will disable automatic rotation.
# Not supported (gap): rotation of the managed master user secret
# (aws_secretsmanager_secret_rotation) has no kind: secretsmanager-controller
# PR #69.
manage_master_user_password_rotation: false
# Specifies whether to rotate the secret immediately or wait until the next
# scheduled rotation window.
# Not supported (gap): rotation of the managed master user secret
# (aws_secretsmanager_secret_rotation) has no kind: secretsmanager-controller
# PR #69.
master_user_password_rotate_immediately: null
# Specifies the number of days between automatic scheduled rotations of the
# secret. Either automatically_after_days or schedule_expression must be
# specified.
# Not supported (gap): rotation of the managed master user secret
# (aws_secretsmanager_secret_rotation) has no kind: secretsmanager-controller
# PR #69.
master_user_password_rotation_automatically_after_days: null
# The length of the rotation window in hours. For example, 3h for a three hour
# window.
# Not supported (gap): rotation of the managed master user secret
# (aws_secretsmanager_secret_rotation) has no kind: secretsmanager-controller
# PR #69.
master_user_password_rotation_duration: null
# A cron() or rate() expression that defines the schedule for rotating your
# secret. Either automatically_after_days or schedule_expression must be
# specified.
# Not supported (gap): rotation of the managed master user secret
# (aws_secretsmanager_secret_rotation) has no kind: secretsmanager-controller
# PR #69.
master_user_password_rotation_schedule_expression: null
master_user_secret_kms_key_id: null
# Specifies the value for Storage Autoscaling
max_allocated_storage: 0
# The interval, in seconds, between points when Enhanced Monitoring metrics are
# collected for the DB instance. To disable collecting Enhanced Monitoring
# metrics, specify 0. The default is 0. Valid Values: 0, 1, 5, 10, 15, 30, 60
monitoring_interval: 0
# The ARN for the IAM role that permits RDS to send enhanced monitoring metrics
# to CloudWatch Logs. Must be specified if monitoring_interval is non-zero
monitoring_role_arn: null
# Description of the monitoring IAM role
monitoring_role_description: null
# Name of the IAM role which will be created when create_monitoring_role is
# enabled
monitoring_role_name: "rds-monitoring-role"
# ARN of the policy that is used to set the permissions boundary for the
# monitoring IAM role
monitoring_role_permissions_boundary: null
# Determines whether to use `monitoring_role_name` as is or create a unique
# identifier beginning with `monitoring_role_name` as the specified prefix
# Not supported (gap): a name with Terraform's random suffix (name_prefix)
# would change between renders.
monitoring_role_use_name_prefix: false
# Specifies if the RDS instance is multi-AZ
multi_az: false
# The national character set is used in the NCHAR, NVARCHAR2, and NCLOB data
# types for Oracle instances. This can't be changed.
nchar_character_set_name: null
# The type of network stack to use
network_type: null
# The description of the option group
option_group_description: null
# Name of the option group
option_group_name: null
# Set to true if you do not wish the option group to be deleted at destroy
# time, and instead just remove the option group from the Terraform state
option_group_skip_destroy: null
# Define maximum timeout for deletion of `aws_db_option_group` resource
# Not supported (by-design): Terraform's delete timeout: ACK retries until the
# option group is deleted.
option_group_timeouts: null
# Determines whether to use `option_group_name` as is or create a unique name
# beginning with the `option_group_name` as the prefix
# In part: accepted: true (the default) names the option group
# option_group_name (or identifier) as given, without Terraform's random
# suffix.
option_group_use_name_prefix: true
# A list of Options to apply
options: null
# Description of the DB parameter group to create
parameter_group_description: null
# Name of the DB parameter group to associate or create
parameter_group_name: null
# Set to true if you do not wish the parameter group to be deleted at destroy
# time, and instead just remove the parameter group from the Terraform state
parameter_group_skip_destroy: null
# Determines whether to use `parameter_group_name` as is or create a unique
# name beginning with the `parameter_group_name` as the prefix
# In part: accepted: true (the default) names the parameter group
# parameter_group_name (or identifier) as given, without Terraform's random
# suffix.
parameter_group_use_name_prefix: true
# A list of DB parameters (map) to apply
# In part: accepted, except each parameter's apply_method: ACK's
# DBParameterGroup takes names and values only and RDS applies each by its
# type.
parameters: null
# Write-Only required unless `manage_master_user_password` is set to `true`,
# `snapshot_identifier`, or `replicate_source_db` is provided). Password for
# the master DB user. Note that this may show up in logs, and it will be stored
# in the state file
# Not supported (gap): a password in values would be written into the render;
# ACK takes a Kubernetes Secret (masterUserPassword), which the chart does not
# make: use manage_master_user_password (the default), and RDS keeps the
# password in Secrets Manager.
password_wo: null
# Used together with password_wo to trigger an update. Increment this value
# when an update to password_wo is required.
# Not supported (gap): a password in values would be written into the render;
# ACK takes a Kubernetes Secret (masterUserPassword), which the chart does not
# make: use manage_master_user_password (the default), and RDS keeps the
# password in Secrets Manager.
password_wo_version: null
# Specifies whether Performance Insights are enabled
performance_insights_enabled: false
# The ARN for the KMS key to encrypt Performance Insights data
performance_insights_kms_key_id: null
# The amount of time in days to retain Performance Insights data. Valid values
# are `7`, `731` (2 years) or a multiple of `31`
performance_insights_retention_period: 7
# The port on which the DB accepts connections
port: null
# Bool to control if instance is publicly accessible
publicly_accessible: false
# Do you agree that Putin doesn't respect Ukrainian sovereignty and territorial
# integrity? More info: https://en.wikipedia.org/wiki/Putin_khuylo!
putin_khuylo: true
# Region where this resource will be managed. Defaults to the Region set in the
# provider configuration
region: null
# Specifies whether the replica is in either mounted or open-read-only mode.
# This attribute is only supported by Oracle instances. Oracle replicas operate
# in open-read-only mode unless otherwise specified
replica_mode: null
# Specifies that this resource is a Replicate database, and to use this value
# as the source database. This correlates to the identifier of another Amazon
# RDS Database to replicate
replicate_source_db: null
# Restore to a point in time (MySQL is NOT supported)
# Not supported (gap): ACK's DBInstance has no point-in-time restore
# (RestoreDBInstanceToPointInTime).
restore_to_point_in_time: null
# Restore from a Percona Xtrabackup in S3 (only MySQL is supported)
# Not supported (gap): ACK's DBInstance has no restore from S3
# (RestoreDBInstanceFromS3).
s3_import: null
# Determines whether a final DB snapshot is created before the DB instance is
# deleted. If true is specified, no DBSnapshot is created. If false is
# specified, a DB snapshot is created before the DB instance is deleted
# In part: accepted: false (the default) takes a final snapshot named
# <final_snapshot_identifier_prefix>-<identifier>-<8 hex characters>, as
# Terraform does, but the 8 characters are a hash of identifier and
# snapshot_identifier, not random, so a render does not change between plans.
skip_final_snapshot: false
# Specifies whether or not to create this database from a snapshot. This
# correlates to the snapshot ID you'd find in the RDS console, e.g:
# rds:production-2015-06-26-06-05
snapshot_identifier: null
# Specifies whether the DB instance is encrypted
storage_encrypted: true
# Storage throughput value for the DB instance. See `notes` for limitations
# regarding this variable for `gp3`
storage_throughput: null
# One of 'standard' (magnetic), 'gp2' (general purpose SSD), 'gp3' (new
# generation of general purpose SSD), or 'io1' (provisioned IOPS SSD). The
# default is 'io1' if iops is specified, 'gp2' if not. If you specify 'io1' or
# 'gp3' , you must also include a value for the 'iops' parameter
storage_type: null
# A list of VPC subnet IDs
subnet_ids: []
# A mapping of tags to assign to all resources
tags: {}
# Updated Terraform resource management timeouts. Applies to `aws_db_instance`
# in particular to permit resource management times
# Not supported (by-design): Terraform's create, update and delete timeouts:
# ACK retries until the instance is synced, and Bundt waits for it.
timeouts: null
# Time zone of the DB instance. timezone is currently only supported by
# Microsoft SQL Server. The timezone can only be set on creation. See MSSQL
# User Guide for more information
timezone: null
# Whether to upgrade the storage file system configuration on the read replica.
# Can only be set with replicate_source_db.
# Not supported (gap): ACK's DBInstance has no field for it.
upgrade_storage_config: null
# Username for the master DB user
username: null
# List of VPC security groups to associate
vpc_security_group_ids: []
