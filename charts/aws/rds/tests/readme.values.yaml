# The module's README, "Usage": MySQL with a subnet group, a parameter
# group, an option group (ack-extensions: allow_alpha) and an enhanced
# monitoring role.
allow_alpha: true
identifier: demodb
engine: mysql
engine_version: "8.0"
instance_class: db.t3a.large
allocated_storage: 5
db_name: demodb
username: user
port: "3306"
iam_database_authentication_enabled: true
vpc_security_group_ids: [sg-12345678]
maintenance_window: Mon:00:00-Mon:03:00
backup_window: 03:00-06:00
monitoring_interval: 30
monitoring_role_name: MyRDSMonitoringRole
create_monitoring_role: true
tags:
  Owner: user
  Environment: dev
create_db_subnet_group: true
subnet_ids: [subnet-12345678, subnet-87654321]
family: mysql8.0
major_engine_version: "8.0"
deletion_protection: true
parameters:
  - {name: character_set_client, value: utf8mb4}
  - {name: character_set_server, value: utf8mb4}
options:
  - option_name: MARIADB_AUDIT_PLUGIN
    option_settings:
      - {name: SERVER_AUDIT_EVENTS, value: CONNECT}
      - {name: SERVER_AUDIT_FILE_ROTATIONS, value: "37"}
