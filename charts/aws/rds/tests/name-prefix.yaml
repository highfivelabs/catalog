#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): the
# DB instance's identifier and the subnet, parameter and option groups'
# names (unique in their account and Region) and the monitoring role's
# (unique in its account) carry the namePrefix. A log group is named after
# the instance, so it carries it too. A role association has no name.
exempt:
  DBRoleAssociation: "a role association is named by its instance, role and feature"
nameFields:
  DBInstance: dbInstanceIdentifier
  DBSubnetGroup: name
  DBParameterGroup: name
  OptionGroup: name
  Role: name
  LogGroup: name
