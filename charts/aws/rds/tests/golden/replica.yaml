apiVersion: rds.services.k8s.aws/v1alpha1
kind: DBInstance
metadata:
  name: replica-db-instance
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "replica"
    app.kubernetes.io/name: rds
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "db-instance"
    rds.services.k8s.aws/delete-automated-backups: "true"
    rds.services.k8s.aws/final-db-snapshot-identifier: "final-app-replica-49bc62af"
    rds.services.k8s.aws/skip-final-snapshot: "false"
spec:
  dbInstanceIdentifier: "app-replica"
  dbInstanceClass: "db.m7g.large"
