---
# Source: rds/templates/rds.yaml
apiVersion: rds.services.k8s.aws/v1alpha1
kind: DBInstance
metadata:
  name: basic-db-instance
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: rds
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "db-instance"
    rds.services.k8s.aws/delete-automated-backups: "true"
    rds.services.k8s.aws/final-db-snapshot-identifier: "final-demodb-c0831f98"
    rds.services.k8s.aws/skip-final-snapshot: "false"
spec:
  dbInstanceIdentifier: "demodb"
  dbInstanceClass: "db.t3a.large"
  engine: "mysql"
  engineVersion: "8.0"
  allocatedStorage: 5
  storageEncrypted: true
  dbName: "demodb"
  masterUsername: "user"
  manageMasterUserPassword: true
  port: 3306
  enableIAMDatabaseAuthentication: false
  vpcSecurityGroupIDs:
    - "sg-12345678"
  dbSubnetGroupRef:
    from:
      name: basic-subnet-group
  dbParameterGroupRef:
    from:
      name: basic-parameter-group
  multiAZ: false
  publiclyAccessible: false
  autoMinorVersionUpgrade: true
  copyTagsToSnapshot: true
  performanceInsightsEnabled: false
  monitoringInterval: 0
  deletionProtection: false
  tags:
    - key: "Environment"
      value: "dev"
    - key: "Owner"
      value: "user"
---
# Source: rds/templates/rds.yaml
apiVersion: rds.services.k8s.aws/v1alpha1
kind: DBParameterGroup
metadata:
  name: basic-parameter-group
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: rds
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "db-parameter-group"
spec:
  name: "demodb"
  description: "demodb parameter group"
  family: "mysql8.0"
  tags:
    - key: "Environment"
      value: "dev"
    - key: "Name"
      value: "demodb"
    - key: "Owner"
      value: "user"
---
# Source: rds/templates/rds.yaml
apiVersion: rds.services.k8s.aws/v1alpha1
kind: DBSubnetGroup
metadata:
  name: basic-subnet-group
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: rds
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "db-subnet-group"
spec:
  name: "demodb"
  description: "demodb subnet group"
  subnetIDs:
    - "subnet-12345678"
    - "subnet-87654321"
  tags:
    - key: "Environment"
      value: "dev"
    - key: "Name"
      value: "demodb"
    - key: "Owner"
      value: "user"
