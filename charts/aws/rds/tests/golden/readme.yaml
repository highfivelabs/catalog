apiVersion: rds.aws.hfl.dev/v1alpha1
kind: OptionGroup
metadata:
  name: readme-option-group
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "readme"
    app.kubernetes.io/name: rds
    app.kubernetes.io/version: "0.1.0"
  annotations:
