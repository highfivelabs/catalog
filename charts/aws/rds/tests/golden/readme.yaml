# Source: rds/templates/rds.yaml
apiVersion: rds.services.k8s.aws/v1alpha1
kind: DBInstance
metadata:
  name: readme-db-instance
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "readme"
    app.kubernetes.io/name: rds
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "db-instance"
    rds.services.k8s.aws/delete-automated-backups: "true"
    rds.services.k8s.aws/final-db-snapshot-identifier: "final-demodb-c0831f98"
    rds.services.k8s.aws/skip-final-snapshot: "false"
spec:
  dbInstanceIdentifier: "demodb"
  dbInstanceClass: "db.t3a.large"
  engine: "mysql"
  engineVersion: "8.0"
  allocatedStorage: 5
  storageEncrypted: true
  dbName: "demodb"
  masterUsername: "user"
  manageMasterUserPassword: true
  port: 3306
  enableIAMDatabaseAuthentication: true
  vpcSecurityGroupIDs:
    - "sg-12345678"
  dbSubnetGroupRef:
    from:
      name: readme-subnet-group
  dbParameterGroupRef:
    from:
      name: readme-parameter-group
  optionGroupName: "demodb"
  multiAZ: false
  publiclyAccessible: false
  autoMinorVersionUpgrade: true
  preferredMaintenanceWindow: "Mon:00:00-Mon:03:00"
  copyTagsToSnapshot: true
  performanceInsightsEnabled: false
  preferredBackupWindow: "03:00-06:00"
  monitoringInterval: 30
  monitoringRoleRef:
    from:
      name: readme-monitoring-role
  deletionProtection: true
  tags:
    - key: "Environment"
      value: "dev"
    - key: "Owner"
      value: "user"
---
