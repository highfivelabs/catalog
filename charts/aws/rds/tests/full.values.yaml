# PostgreSQL with most instance options: an existing subnet group and
# parameter group, log exports into log groups the chart makes, Performance
# Insights, Multi-AZ, a monitoring role given by ARN, a role association
# (ack-extensions: allow_alpha), no final snapshot.
allow_alpha: true
identifier: app
engine: postgres
engine_version: "16.4"
instance_class: db.m7g.large
allocated_storage: 100
max_allocated_storage: 500
storage_type: gp3
storage_throughput: 500
iops: 12000
kms_key_id: arn:aws:kms:eu-west-1:111122223333:key/abc
db_name: app
username: app
master_user_secret_kms_key_id: arn:aws:kms:eu-west-1:111122223333:key/def
port: "5432"
region: eu-west-1
multi_az: true
publicly_accessible: false
network_type: DUAL
ca_cert_identifier: rds-ca-rsa2048-g1
create_db_parameter_group: false
parameter_group_name: app-pg16
db_subnet_group_name: shared-db
vpc_security_group_ids: [sg-0123456789abcdef0]
backup_retention_period: 14
backup_window: 02:00-03:00
maintenance_window: sun:04:00-sun:05:00
monitoring_interval: 60
monitoring_role_arn: arn:aws:iam::111122223333:role/rds-monitoring
performance_insights_enabled: true
performance_insights_retention_period: 31
database_insights_mode: advanced
enabled_cloudwatch_logs_exports: [postgresql, upgrade]
create_cloudwatch_log_group: true
cloudwatch_log_group_retention_in_days: 30
cloudwatch_log_group_skip_destroy: true
cloudwatch_log_group_tags: {logs: "yes"}
skip_final_snapshot: true
delete_automated_backups: false
copy_tags_to_snapshot: false
auto_minor_version_upgrade: false
db_instance_role_associations: {s3Import: "arn:aws:iam::111122223333:role/rds-s3"}
db_instance_tags: {tier: data}
tags: {team: shop}
