# Applied to the fake AWS by hack/mock-apply-aws.sh: PostgreSQL with a
# subnet group in the two subnets tests/mock.needs.yaml makes (subnet_ids,
# tests/mock.set.yaml) and a managed master password; no final snapshot.
# The engine's default parameter group: moto answers
# DescribeEngineDefaultParameters, which ACK's DBParameterGroup calls, with
# an error.
identifier: catalog-db
region: us-east-1
engine: postgres
engine_version: "16.4"
instance_class: db.t4g.micro
allocated_storage: 20
db_name: catalog
username: catalog
create_db_parameter_group: false
create_db_subnet_group: true
subnet_ids: [subnet-set-by-mock-set-yaml-a, subnet-set-by-mock-set-yaml-b]
skip_final_snapshot: true
tags: {catalog-test: "true"}
