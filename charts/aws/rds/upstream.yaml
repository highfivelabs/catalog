- variable: skip_final_snapshot
  kind: gap
  reason: "accepted: false (the default) takes a final snapshot named <final_snapshot_identifier_prefix>-<identifier>-<8 hex characters>, as Terraform does, but the 8 characters are a hash of identifier and snapshot_identifier, not random, so a render does not change between plans"
  partial: true
- variable: timeouts
