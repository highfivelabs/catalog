  kind: gap
  reason: "rotation of the managed master user secret (aws_secretsmanager_secret_rotation) has no kind: secretsmanager-controller PR #69"
- variable: master_user_password_rotation_duration
  kind: gap
  reason: "rotation of the managed master user secret (aws_secretsmanager_secret_rotation) has no kind: secretsmanager-controller PR #69"
- variable: master_user_password_rotation_schedule_expression
  kind: gap
  reason: "rotation of the managed master user secret (aws_secretsmanager_secret_rotation) has no kind: secretsmanager-controller PR #69"
- variable: monitoring_role_use_name_prefix
