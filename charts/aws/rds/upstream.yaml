  reason: "ACK's DBInstance has no field for it (it takes domain and domainIAMRoleName only)"
- variable: domain_ou
  kind: gap
  reason: "ACK's DBInstance has no field for it (it takes domain and domainIAMRoleName only)"
- variable: engine_lifecycle_support
  kind: gap
  reason: "ACK's DBInstance has no field for it"
- variable: instance_use_identifier_prefix
  kind: gap
  reason: "an identifier with Terraform's random suffix would change between renders"
- variable: manage_master_user_password_rotation
