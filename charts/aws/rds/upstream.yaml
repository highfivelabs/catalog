# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set (to anything but the module's default), or
# accepts only in part. Read by `task coverage`; `task coverage-verify`
# renders the chart to check that each one is refused. kind: gap (no ACK or
# ack-extensions kind or field), not-ported (ACK has it, the chart does not
# map it yet), alpha (only an ack-extensions kind, behind allow_alpha) or
# by-design (Bundt replaces it). partial: the variable is
# accepted, the reason says what is not carried.
refused:
- variable: allow_major_version_upgrade
  kind: gap
  reason: "ACK's DBInstance has no field for it (AllowMajorVersionUpgrade)"
- variable: apply_immediately
  kind: gap
  reason: "accepted: ACK applies a DB instance's changes immediately, as true does; false (the default: wait for the maintenance window) is not carried"
  partial: true
- variable: blue_green_update
  kind: gap
  reason: "ACK's DBInstance has no blue/green update"
- variable: create_db_option_group
  kind: alpha
  reason: "OptionGroup is an ack-extensions kind (outside ACK's releases): an engine other than postgres with create_db_option_group true (the default) needs allow_alpha: true, or create_db_option_group: false"
  partial: true
  needs_allow_alpha: true
- variable: db_instance_role_associations
  kind: alpha
  reason: "DBRoleAssociation is an ack-extensions kind (outside ACK's releases): needs allow_alpha: true"
  partial: true
  needs_allow_alpha: true
- variable: db_subnet_group_use_name_prefix
  kind: gap
  reason: "accepted: true (the default) names the subnet group db_subnet_group_name (or identifier) as given, without Terraform's random suffix, since a render must not change between plans; the namePrefix value keeps two Instances' groups apart"
  partial: true
- variable: dedicated_log_volume
  kind: gap
  reason: "ACK's DBInstance has no field for it"
- variable: domain_auth_secret_arn
