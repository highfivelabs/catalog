- variable: password_wo
  kind: gap
  reason: "a password in values would be written into the render; ACK takes a Kubernetes Secret (masterUserPassword), which the chart does not make: use manage_master_user_password (the default), and RDS keeps the password in Secrets Manager"
- variable: password_wo_version
  kind: gap
  reason: "a password in values would be written into the render; ACK takes a Kubernetes Secret (masterUserPassword), which the chart does not make: use manage_master_user_password (the default), and RDS keeps the password in Secrets Manager"
