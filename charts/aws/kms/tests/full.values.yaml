# Custom statements, Route 53 DNSSEC, an asymmetric signing key, computed
# aliases, a region and ABANDON.
description: DNSSEC signing key
customer_master_key_spec: ECC_NIST_P256
key_usage: SIGN_VERIFY
enable_key_rotation: false
multi_region: true
region: us-east-1
account_id: "111122223333"
partition: aws
enable_route53_dnssec: true
route53_dnssec_sources:
  - hosted_zone_arn: arn:aws:route53:::hostedzone/Z123
  - account_ids: ["444455556666"]
key_asymmetric_sign_verify_users: ["arn:aws:iam::111122223333:role/signer"]
key_statements:
  - sid: CloudWatchLogs
    actions: ["kms:Encrypt*", "kms:Decrypt*"]
    resources: ["*"]
    principals: [{type: Service, identifiers: [logs.us-east-1.amazonaws.com]}]
    condition:
      - {test: ArnLike, variable: "kms:EncryptionContext:aws:logs:arn", values: ["arn:aws:logs:us-east-1:111122223333:log-group:*"]}
computed_aliases:
  dnssec: {name: dnssec/zone}
deletion_policy: ABANDON
labels: {hfl.dev/team: platform}
tags: {Owner: platform}
