# A key with administrators, users, service users and the Auto Scaling
# service role, two aliases and a grant (the module's key policy inputs).
description: EC2 AutoScaling key usage
key_usage: ENCRYPT_DECRYPT
account_id: "111122223333"
key_administrators: ["arn:aws:iam::111122223333:role/admin"]
key_users: ["arn:aws:iam::111122223333:role/user"]
key_service_users: ["arn:aws:iam::111122223333:role/ec2-role"]
key_service_roles_for_autoscaling: ["arn:aws:iam::111122223333:role/aws-service-role/autoscaling.amazonaws.com/AWSServiceRoleForAutoScaling"]
aliases: [one, foo/bar]
grants:
  lambda:
    grantee_principal: arn:aws:iam::111122223333:role/lambda
    operations: [Encrypt, Decrypt, GenerateDataKey]
    constraints:
      - encryption_context_equals: {Department: Finance}
tags:
  Terraform: "true"
  Environment: dev
