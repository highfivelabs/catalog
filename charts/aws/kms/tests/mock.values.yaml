# Applied to the fake AWS by hack/mock-apply-aws.sh: a symmetric key with a
# user, an alias and a grant, in the fake's own account (account_id, the
# key user and the grantee, tests/mock.set.yaml: AWS refuses a key policy
# that does not let the caller's account manage the key).
region: us-east-1
account_id: "000000000000"
description: catalog test key
key_users: ["arn:aws:iam::000000000000:root"]
aliases: [catalog-test]
grants:
  self: {grantee_principal: "arn:aws:iam::000000000000:root", operations: [Encrypt, Decrypt]}
tags: {catalog-test: "true"}
