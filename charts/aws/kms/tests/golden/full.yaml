apiVersion: kms.services.k8s.aws/v1alpha1
kind: Key
metadata:
  name: full-key
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: kms
    app.kubernetes.io/version: "0.1.0"
    hfl.dev/team: "platform"
