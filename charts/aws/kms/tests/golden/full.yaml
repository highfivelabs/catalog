spec:
  description: "DNSSEC signing key"
  keySpec: "ECC_NIST_P256"
  keyUsage: "SIGN_VERIFY"
  enableKeyRotation: false
  multiRegion: true
  policy: "{\"Statement\":[{\"Action\":[\"kms:*\"],\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"arn:aws:iam::111122223333:root\"]},\"Resource\":[\"*\"],\"Sid\":\"Default\"},{\"Action\":[\"kms:DescribeKey\",\"kms:GetPublicKey\",\"kms:Sign\",\"kms:Verify\"],\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"arn:aws:iam::111122223333:role/signer\"]},\"Resource\":[\"*\"],\"Sid\":\"KeyAsymmetricSignVerify\"},{\"Action\":[\"kms:DescribeKey\",\"kms:GetPublicKey\",\"kms:Sign\"],\"Effect\":\"Allow\",\"Principal\":{\"Service\":[\"dnssec-route53.amazonaws.com\"]},\"Resource\":[\"*\"],\"Sid\":\"Route53DnssecService\"},{\"Action\":[\"kms:CreateGrant\"],\"Condition\":{\"ArnLike\":{\"aws:SourceArn\":[\"arn:aws:route53:::hostedzone/Z123\",\"arn:aws:route53:::hostedzone/*\"]},\"Bool\":{\"kms:GrantIsForAWSResource\":[\"true\"]},\"StringEquals\":{\"aws:SourceAccount\":[\"111122223333\",\"444455556666\"]}},\"Effect\":\"Allow\",\"Principal\":{\"Service\":[\"dnssec-route53.amazonaws.com\"]},\"Resource\":[\"*\"],\"Sid\":\"Route53DnssecGrant\"},{\"Action\":[\"kms:Encrypt*\",\"kms:Decrypt*\"],\"Condition\":{\"ArnLike\":{\"kms:EncryptionContext:aws:logs:arn\":[\"arn:aws:logs:us-east-1:111122223333:log-group:*\"]}},\"Effect\":\"Allow\",\"Principal\":{\"Service\":[\"logs.us-east-1.amazonaws.com\"]},\"Resource\":[\"*\"],\"Sid\":\"CloudWatchLogs\"}],\"Version\":\"2012-10-17\"}"
  tags:
    - tagKey: "Owner"
      tagValue: "platform"
