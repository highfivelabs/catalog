#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): an
# alias's name, unique in its account and Region, carries the namePrefix
# (alias/<namePrefix>-<name>); the kinds listed here have none that can
# collide.
exempt:
  Key: "KMS assigns its key ID; a key has no name"
  ReplicaKey: "a replica has its primary key's ID; it has no name"
  Grant: "a grant's name is not unique: KMS tells grants apart by grant ID"
nameFields:
  Alias: name
