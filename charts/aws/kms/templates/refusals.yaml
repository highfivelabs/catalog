Copyright 2026 High Five Labs
SPDX-License-Identifier: Apache-2.0

The module variables this chart keeps in its values but cannot carry
(upstream.yaml, "refused"): each stops the render, naming the gap, when it
is set to anything but its Terraform default. Renders nothing.
*/ -}}
{{- include "ack.unsupported" (list $ "aliases_use_name_prefix" .Values.aliases_use_name_prefix "an alias name with a random suffix (name_prefix) would change between renders") }}
{{- include "ack.unsupported" (list $ "create_external" .Values.create_external "imported key material (aws_kms_external_key, aws_kms_replica_external_key) has no kind: ACK's Key takes origin EXTERNAL, but nothing imports the material") }}
{{- include "ack.unsupported" (list $ "create_replica_external" .Values.create_replica_external "imported key material (aws_kms_external_key, aws_kms_replica_external_key) has no kind: ACK's Key takes origin EXTERNAL, but nothing imports the material") }}
{{- include "ack.unsupported" (list $ "deletion_window_in_days" .Values.deletion_window_in_days "ACK's Key has no field for the waiting period before deletion (KMS's default, 30 days, applies)") }}
{{- include "ack.unsupported" (list $ "key_material_base64" .Values.key_material_base64 "imported key material (aws_kms_external_key, aws_kms_replica_external_key) has no kind: ACK's Key takes origin EXTERNAL, but nothing imports the material") }}
{{- include "ack.unsupported" (list $ "key_spec" .Values.key_spec "imported key material (aws_kms_external_key, aws_kms_replica_external_key) has no kind: ACK's Key takes origin EXTERNAL, but nothing imports the material (key_spec is the external key's)") }}
{{- include "ack.unsupported" (list $ "override_policy_documents" .Values.override_policy_documents "merging other policy documents into the key policy by statement sid is not ported yet; write the whole policy in policy, or the statements in key_statements") }}
{{- include "ack.unsupported" (list $ "primary_external_key_arn" .Values.primary_external_key_arn "imported key material (aws_kms_external_key, aws_kms_replica_external_key) has no kind: ACK's Key takes origin EXTERNAL, but nothing imports the material") }}
{{- include "ack.unsupported" (list $ "rotation_period_in_days" .Values.rotation_period_in_days "ACK's Key has no rotation period field (enable_key_rotation is supported, with KMS's default period, 365 days)") }}
{{- include "ack.unsupported" (list $ "source_policy_documents" .Values.source_policy_documents "merging other policy documents into the key policy by statement sid is not ported yet; write the whole policy in policy, or the statements in key_statements") }}
{{- include "ack.unsupported" (list $ "valid_to" .Values.valid_to "imported key material (aws_kms_external_key, aws_kms_replica_external_key) has no kind: ACK's Key takes origin EXTERNAL, but nothing imports the material") }}
