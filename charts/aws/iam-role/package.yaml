#
# The Bundt Package for this chart (docs/design.md, "Outputs"): the
# submodule's seven outputs, from the live Role (resources.role) and
# InstanceProfile (resources.instance-profile). Terraform's id of an
# instance profile is its name; a role's unique_id is IAM's RoleId.
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: aws-iam-role
spec:
  version: 0.1.0
  engine: helm
  providers: [ack]
  outputs:
    name: >-
      'role' in resources ? resources.role.spec.name : null
    arn: >-
      'role' in resources ? resources.role.status.ackResourceMetadata.arn : null
    unique_id: >-
      'role' in resources ? resources.role.status.roleID : null
    instance_profile_arn: >-
      'instance-profile' in resources ? resources['instance-profile'].status.ackResourceMetadata.arn : null
    instance_profile_id: >-
      'instance-profile' in resources ? resources['instance-profile'].spec.name : null
    instance_profile_name: >-
      'instance-profile' in resources ? resources['instance-profile'].spec.name : null
    instance_profile_unique_id: >-
      'instance-profile' in resources ? resources['instance-profile'].status.instanceProfileID : null
