# The submodule's README, "IAM Role - GitHub Free, Pro, & Team OIDC", with a
# name (the chart needs one) and the account the OIDC provider is in.
name: github-actions
account_id: "111122223333"
enable_github_oidc: true
oidc_wildcard_subjects: ["terraform-aws-modules/terraform-aws-iam:*"]
policies:
  S3ReadOnly: arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
tags:
  Environment: test
