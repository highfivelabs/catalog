# The submodule's README, "IAM Role - SAML 2.0", with an extra trust action.
name: example
enable_saml: true
saml_provider_ids: ["arn:aws:iam::235367859851:saml-provider/idp_saml"]
saml_trust_actions: ["sts:SetSourceIdentity", "sts:TagSession"]
policies:
  ReadOnlyAccess: arn:aws:iam::aws:policy/ReadOnlyAccess
tags:
  Terraform: "true"
  Environment: dev
