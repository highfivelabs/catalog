#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): the
# role's name, unique in its account, carries the namePrefix, and so does
# its instance profile's, which the module names as the role.
exempt: {}
nameFields:
  Role: name
  InstanceProfile: name
