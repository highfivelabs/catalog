# The submodule's README, "IAM Role - User assume" (the custom policy's ARN
# written out).
name: example
trust_policy_permissions:
  TrustRoleAndServiceToAssume:
    actions: ["sts:AssumeRole", "sts:TagSession"]
    principals:
      - type: AWS
        identifiers: ["arn:aws:iam::835367859851:user/anton"]
    condition:
      - test: StringEquals
        variable: sts:ExternalId
        values: [some-secret-id]
policies:
  AmazonCognitoReadOnly: arn:aws:iam::aws:policy/AmazonCognitoReadOnly
  AlexaForBusinessFullAccess: arn:aws:iam::aws:policy/AlexaForBusinessFullAccess
  custom: arn:aws:iam::835367859851:policy/custom
tags:
  Terraform: "true"
  Environment: dev
