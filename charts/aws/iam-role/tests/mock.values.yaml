# Applied to the fake AWS (hack/mock-apply-aws.sh): a role EC2 can assume,
# with an AWS managed policy attached, an inline policy and an instance
# profile.
name: catalog-test-role
path: /catalog/
description: catalog test role
max_session_duration: 7200
trust_policy_permissions:
  Ec2: {actions: ["sts:AssumeRole"], principals: [{type: Service, identifiers: [ec2.amazonaws.com]}]}
policies:
  ReadOnly: arn:aws:iam::aws:policy/ReadOnlyAccess
create_inline_policy: true
inline_policy_permissions:
  Read: {actions: ["s3:GetObject"], resources: ["*"]}
create_instance_profile: true
tags: {catalog-test: "true"}
