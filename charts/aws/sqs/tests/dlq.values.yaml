# The dead-letter queue as its own component: the module's dlq defaults
# (SQS-managed encryption), and the redrive allow policy naming the queue
# that may use it.
name: user-dlq
region: eu-west-1
redrive_allow_policy:
  redrivePermission: byQueue
  sourceQueueArns: ["arn:aws:sqs:eu-west-1:111122223333:user"]
tags:
  Environment: dev
