apiVersion: sqs.services.k8s.aws/v1alpha1
kind: Queue
metadata:
  name: full-queue
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: sqs
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "queue"
    services.k8s.aws/region: "us-east-1"
