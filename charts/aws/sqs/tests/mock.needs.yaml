# What tests/mock.values.yaml needs and the chart does not make: the
# dead-letter queue (hack/mock-apply-aws.sh applies it first, waits for it,
# deletes it last).
apiVersion: sqs.services.k8s.aws/v1alpha1
kind: Queue
metadata:
  name: sqs-dlq
  annotations:
    services.k8s.aws/region: us-east-1
spec:
  queueName: catalog-test-queue-dlq
  tags:
    catalog-test: "true"
