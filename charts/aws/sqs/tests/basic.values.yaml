# The module's README usage, with the dead-letter queue as its own
# component (create_dlq is refused): the queue's redrive policy names the
# dead-letter queue's ARN, which Bundt passes from that component's
# queue_arn output.
name: user
region: eu-west-1
redrive_policy:
  deadLetterTargetArn: arn:aws:sqs:eu-west-1:111122223333:user-dlq
  maxReceiveCount: 10
tags:
  Environment: dev
