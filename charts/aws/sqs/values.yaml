# Values mirror the Terraform variables of terraform-aws-modules' sqs module
# (v5.2.2): same names, types and defaults, so a module block's arguments
# become a values file one to one. values.schema.json carries the types. A
# variable the chart cannot carry stays here and stops the render when set
# (upstream.yaml lists them; README.md says why).

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables, except tags, which is the module's own.
#
# The queue's name in full, {queue} (with ".fifo" for a FIFO queue). A
# name set here takes no namePrefix. Unset, the queue is named name.
names: {}
# An optional convenience: "<namePrefix>-" in front of the queue's name
# (never one set under names). Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. They stay in Kubernetes: ACK does not
# copy labels to AWS (AWS tags are the module's tags variable).
labels: {}
# The AWS account and partition the queues are in, which the module reads
# from the provider (aws_caller_identity, aws_partition) to build a queue's
# ARN. A chart cannot read them, so Bundt fills account_id from the
# Environment. Needed (with region) only for a queue policy statement
# without resources (the module's default resource is the queue's own
# ARN).
account_id: null
partition: aws
# DELETE (default): deleting the component deletes the queue. ABANDON
# keeps it (services.k8s.aws/deletion-policy: retain).
deletion_policy: DELETE

# The module's variables, in alphabetical order, with its defaults.

# Enables content-based deduplication for FIFO queues
content_based_deduplication: null
# Whether to create SQS queue
create: true
# Determines whether to create SQS dead letter queue
# Not supported (gap), with every dlq_ variable: SQS refuses a redrive
# policy naming a queue that does not exist yet, and ACK's Queue has no
# reference to wait for its dead-letter queue. Make the dead-letter queue
# its own component and pass its queue_arn into redrive_policy.
create_dlq: false
# Whether to create SQS queue policy
create_dlq_queue_policy: false
# Determines whether to create a redrive allow policy for the dead letter
# queue
create_dlq_redrive_allow_policy: true
# Whether to create SQS queue policy
create_queue_policy: false
# Specifies whether message deduplication occurs at the message group or
# queue level
deduplication_scope: null
# Enables content-based deduplication for FIFO queues
dlq_content_based_deduplication: null
# Specifies whether message deduplication occurs at the message group or
# queue level
dlq_deduplication_scope: null
# The time in seconds that the delivery of all messages in the queue will be
# delayed. An integer from 0 to 900 (15 minutes)
dlq_delay_seconds: null
# Specifies whether the Dead Letter Queue FIFO queue throughput quota applies
# to the entire queue or per message group
dlq_fifo_throughput_limit: null
# The length of time, in seconds, for which Amazon SQS can reuse a data key
# to encrypt or decrypt messages before calling AWS KMS again
dlq_kms_data_key_reuse_period_seconds: null
# The ID of an AWS-managed customer master key (CMK) for Amazon SQS or a
# custom CMK
dlq_kms_master_key_id: null
# The number of seconds Amazon SQS retains a message. Integer representing
# seconds, from 60 (1 minute) to 1209600 (14 days)
dlq_message_retention_seconds: null
# This is the human-readable name of the queue. If omitted, Terraform will
# assign a random name
dlq_name: null
# A map of IAM policy statements for custom permission usage
dlq_queue_policy_statements: null
# The time for which a ReceiveMessage call will wait for a message to arrive
# (long polling) before returning. An integer from 0 to 20 (seconds)
dlq_receive_wait_time_seconds: null
# The JSON policy to set up the Dead Letter Queue redrive permission, see
# AWS docs
dlq_redrive_allow_policy: {}
# Boolean to enable server-side encryption (SSE) of message content with
# SQS-owned encryption keys
dlq_sqs_managed_sse_enabled: true
# A mapping of additional tags to assign to the dead letter queue
dlq_tags: {}
# The visibility timeout for the queue. An integer from 0 to 43200 (12 hours)
dlq_visibility_timeout_seconds: null
# The time in seconds that the delivery of all messages in the queue will be
# delayed. An integer from 0 to 900 (15 minutes)
delay_seconds: null
# Boolean designating a FIFO queue
fifo_queue: false
# Specifies whether the FIFO queue throughput quota applies to the entire
# queue or per message group
fifo_throughput_limit: null
# The length of time, in seconds, for which Amazon SQS can reuse a data key
# to encrypt or decrypt messages before calling AWS KMS again. An integer
# representing seconds, between 60 seconds (1 minute) and 86,400 seconds
# (24 hours)
kms_data_key_reuse_period_seconds: null
# The ID of an AWS-managed customer master key (CMK) for Amazon SQS or a
# custom CMK
kms_master_key_id: null
# The limit of how many bytes a message can contain before Amazon SQS
# rejects it. An integer from 1024 bytes (1 KiB) up to 1048576 bytes (1024
# KiB). The default for this attribute is 262144 (256 KiB)
max_message_size: null
# The number of seconds Amazon SQS retains a message. Integer representing
# seconds, from 60 (1 minute) to 1209600 (14 days)
message_retention_seconds: null
# This is the human-readable name of the queue. If omitted, Terraform will
# assign a random name (the chart requires it, or names.queue: a random
# name would change between renders)
name: null
# List of IAM policy documents that are merged together into the exported
# document. In merging, statements with non-blank `sid`s will override
# statements with the same `sid`
override_dlq_queue_policy_documents: []
# List of IAM policy documents that are merged together into the exported
# document. In merging, statements with non-blank `sid`s will override
# statements with the same `sid`
override_queue_policy_documents: []
# A map of IAM policy statements for custom permission usage
queue_policy_statements: null
# The time for which a ReceiveMessage call will wait for a message to arrive
# (long polling) before returning. An integer from 0 to 20 (seconds)
receive_wait_time_seconds: null
# The JSON policy to set up the Dead Letter Queue redrive permission, see
# AWS docs
redrive_allow_policy: {}
# The JSON policy to set up the Dead Letter Queue, see AWS docs. Note: when
# specifying maxReceiveCount, you must specify it as an integer (5), and not
# a string ("5")
redrive_policy: {}
# Region where the resource(s) will be managed. Defaults to the Region set in
# the provider configuration (on ACK: the namespace's or the controller's)
region: null
# List of IAM policy documents that are merged together into the exported
# document. Statements must have unique `sid`s
source_dlq_queue_policy_documents: []
# List of IAM policy documents that are merged together into the exported
# document. Statements must have unique `sid`s
source_queue_policy_documents: []
# Boolean to enable server-side encryption (SSE) of message content with
# SQS-owned encryption keys
sqs_managed_sse_enabled: true
# A mapping of tags to assign to all resources
tags: {}
# Determines whether `name` is used as a prefix
# Not supported (gap): a queue name with Terraform's random suffix
# (name_prefix) would change between renders; set name (the namePrefix
# value keeps two Instances' queues apart).
use_name_prefix: false
# The visibility timeout for the queue. An integer from 0 to 43200 (12 hours)
visibility_timeout_seconds: null
