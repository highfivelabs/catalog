# The module's README, "Usage with Route53 DNS validation and separate AWS
# providers", its second module call: the validation records, from the
# first's outputs (here written out as Bundt would pass them, valueFrom),
# one zone overridden in zones.
create_certificate: false
create_route53_records_only: true
validation_method: DNS
distinct_domain_names: [my-domain.com, app.sub.my-domain.com]
zone_id: Z266PL4W4W6MSG
zones: {app.sub.my-domain.com: Z0SUB}
dns_ttl: 300
acm_certificate_domain_validation_options:
  - {domain_name: my-domain.com, resource_record_name: _a1.my-domain.com., resource_record_type: CNAME, resource_record_value: _x1.acm-validations.aws.}
  - {domain_name: "*.my-domain.com", resource_record_name: _a1.my-domain.com., resource_record_type: CNAME, resource_record_value: _x1.acm-validations.aws.}
  - {domain_name: app.sub.my-domain.com, resource_record_name: _b2.app.sub.my-domain.com., resource_record_type: CNAME, resource_record_value: _x2.acm-validations.aws.}
