---
# Source: acm/templates/certificate.yaml
apiVersion: acm.services.k8s.aws/v1alpha1
kind: Certificate
metadata:
  name: names-certificate
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "names"
    app.kubernetes.io/name: acm
    app.kubernetes.io/version: "0.1.0"
    app: "web"
    hfl.dev/team: "shop"
  annotations:
    hfl.dev/id: "certificate"
spec:
  domainName: "shop.example.com"
  options:
    certificateTransparencyLoggingPreference: "ENABLED"
  tags:
    - key: "team"
      value: "shop"
