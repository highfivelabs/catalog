# Source: acm/templates/certificate.yaml
apiVersion: acm.services.k8s.aws/v1alpha1
kind: Certificate
metadata:
  name: mock-certificate
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: acm
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "certificate"
    services.k8s.aws/region: "us-east-1"
spec:
  domainName: "catalog-test.example.com"
  subjectAlternativeNames:
    - "www.catalog-test.example.com"
  options:
    certificateTransparencyLoggingPreference: "ENABLED"
  tags:
    - key: "catalog-test"
      value: "true"
