---
# Source: acm/templates/certificate.yaml
apiVersion: acm.services.k8s.aws/v1alpha1
kind: Certificate
metadata:
  name: full-certificate
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: acm
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "certificate"
    services.k8s.aws/region: "eu-west-1"
spec:
  domainName: "internal.example.com"
  subjectAlternativeNames:
    - "api.internal.example.com"
  domainValidationOptions:
    - domainName: "internal.example.com"
      validationDomain: "example.com"
  keyAlgorithm: "EC_prime256v1"
  certificateAuthorityARN: "arn:aws:acm-pca:eu-west-1:111122223333:certificate-authority/abc"
  options:
    certificateTransparencyLoggingPreference: "DISABLED"
    export: "ENABLED"
  tags:
    - key: "team"
      value: "shop"
