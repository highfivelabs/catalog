# Every certificate option: a private CA, a key algorithm, export, no
# transparency logging, a validation option, a region, tags.
domain_name: internal.example.com
subject_alternative_names: [api.internal.example.com]
private_authority_arn: arn:aws:acm-pca:eu-west-1:111122223333:certificate-authority/abc
key_algorithm: EC_prime256v1
export: ENABLED
certificate_transparency_logging_preference: false
validation_option:
  internal.example.com: {validation_domain: example.com}
region: eu-west-1
wait_for_validation: false
tags: {team: shop}
