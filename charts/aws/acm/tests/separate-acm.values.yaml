# The module's README, "Usage with Route53 DNS validation and separate AWS
# providers", its first module call: the certificate.
domain_name: my-domain.com
subject_alternative_names: ["*.my-domain.com", "app.sub.my-domain.com"]
validation_method: DNS
create_route53_records: false
validation_record_fqdns: ["_a1.my-domain.com", "_b2.app.sub.my-domain.com"]
