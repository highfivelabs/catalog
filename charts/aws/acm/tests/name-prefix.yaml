# The namePrefix convention (docs/design.md, "Names, labels and tags"): no
# kind here has a name that can collide.
exempt:
  Certificate: "ACM assigns a certificate's ARN; a certificate has no name"
  RecordSet: "a validation record's name is the one ACM gives it"
nameFields: {}
noCloudNames: "ACM names a certificate by the ARN it assigns, and a validation record by the name ACM gives it; the chart names nothing"
