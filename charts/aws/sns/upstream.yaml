synced: 2026-11-12
# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set (to anything but the module's default), or
# accepts only in part. Read by `task coverage`; `task coverage-verify`
# renders the chart to check that each one is refused. kind: gap (no ACK or
# ack-extensions kind or field), not-ported (ACK has it, the chart does not
# map it yet) or by-design (Bundt replaces it). partial: the variable is
# accepted, the reason says what is not carried.
refused:
- variable: archive_policy
  kind: gap
  reason: "ACK's Topic (sns-controller v1.13.0) has no archive policy field (a FIFO topic's message archive)"
- variable: subscriptions
  kind: gap
  reason: "accepted, except replay_policy (ACK's Subscription has no field for it) and confirmation_timeout_in_minutes and endpoint_auto_confirms (Terraform waits for an HTTP(S) endpoint to confirm; ACK does not wait)"
  partial: true
  fields:
  - replay_policy
  - confirmation_timeout_in_minutes
  - endpoint_auto_confirms
- variable: use_name_prefix
  kind: gap
  reason: "a topic name with Terraform's random suffix (name_prefix) would change between renders; set name (the namePrefix value keeps two Instances' topics apart)"
