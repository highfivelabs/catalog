#
# The Bundt Package for this chart (docs/design.md, "Outputs"): the module's
# topic outputs, from the live Topic (resources.topic). Terraform's id of a
# topic is its ARN. Not provided: topic_beginning_archive_time (the archive
# policy is refused) and subscriptions, which are whole Terraform objects.
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: aws-sns
spec:
  version: 0.1.0
  engine: helm
  providers: [ack]
  outputs:
    topic_arn: >-
      'topic' in resources ? resources.topic.status.ackResourceMetadata.arn : null
    topic_id: >-
      'topic' in resources ? resources.topic.status.ackResourceMetadata.arn : null
    topic_name: >-
      'topic' in resources ? resources.topic.spec.name : null
    topic_owner: >-
      'topic' in resources && has(resources.topic.status.owner) ? resources.topic.status.owner : null
