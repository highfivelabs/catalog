#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): the
# topic's name, unique in its account and region, carries the namePrefix.
# Its name is spec.name. A subscription has no name: AWS names it by an ARN
# it assigns.
exempt:
  Subscription: AWS names a subscription by the ARN it assigns
nameFields:
  Topic: name
