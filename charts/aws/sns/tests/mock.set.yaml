# Values hack/mock-apply-aws.sh sets for the fake it runs on: its account,
# in a format (`<value>: account <format>`), which the topic's ARN and the
# default topic policy name; and the subscriber queue's ARN, read from the
# live Queue.
account_id: account %s
subscriptions.queue.endpoint: queues.sqs.services.k8s.aws/sns-subscriber {.status.ackResourceMetadata.arn}
