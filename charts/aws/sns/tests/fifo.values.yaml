# The module's README, "FIFO Topic", with content-based deduplication and
# an SQS subscription.
name: async-events
fifo_topic: true
content_based_deduplication: true
fifo_throughput_scope: MessageGroup
signature_version: 2
region: us-east-1
account_id: "111122223333"
subscriptions:
  sqs:
    protocol: sqs
    endpoint: arn:aws:sqs:us-east-1:111122223333:async-events.fifo
    raw_message_delivery: true
