# What tests/mock.values.yaml needs and the chart does not make: a queue
# for the SQS subscription (hack/mock-apply-aws.sh applies it first,
# deletes it last).
apiVersion: sqs.services.k8s.aws/v1alpha1
kind: Queue
metadata:
  name: sns-subscriber
  annotations:
    services.k8s.aws/region: us-east-1
spec:
  queueName: catalog-test-topic-subscriber
  tags:
    catalog-test: "true"
