# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set (to anything but the module's default), or
# accepts only in part. Read by `task coverage`; `task coverage-verify`
# renders the chart to check that each one is refused. kind: gap (no ACK or
# ack-extensions kind or field), not-ported (ACK has it, the chart does not
# map it yet) or by-design (Bundt replaces it). partial: the variable is
# accepted, the reason says what is not carried.
refused:
- variable: autoscaling_enabled
  kind: not-ported
  reason: "the module's Application Auto Scaling targets and policies (applicationautoscaling-controller's ScalableTarget and ScalingPolicy) are not ported yet"
- variable: autoscaling_indexes
  kind: not-ported
  reason: "the module's Application Auto Scaling targets and policies (applicationautoscaling-controller's ScalableTarget and ScalingPolicy) are not ported yet"
- variable: autoscaling_read
  kind: not-ported
  reason: "the module's Application Auto Scaling targets and policies (applicationautoscaling-controller's ScalableTarget and ScalingPolicy) are not ported yet"
- variable: autoscaling_write
  kind: not-ported
  reason: "the module's Application Auto Scaling targets and policies (applicationautoscaling-controller's ScalableTarget and ScalingPolicy) are not ported yet"
- variable: global_secondary_indexes
  kind: gap
  reason: "accepted, except warm_throughput (ACK's Table has no warm throughput field)"
  partial: true
  fields:
  - warm_throughput
- variable: global_table_witness
  kind: gap
  reason: "ACK's Table (dynamodb-controller v1.14.2) has no witness region field (multi-Region strong consistency)"
- variable: ignore_changes_global_secondary_index
  kind: gap
  reason: "ACK has no way to leave a table's global secondary indexes alone: the controller reconciles them to the spec"
- variable: import_table
  kind: gap
  reason: "ACK's Table has no import from S3 (ImportTable) field"
- variable: replica_regions
  kind: gap
  reason: "accepted, except propagate_tags, point_in_time_recovery, deletion_protection_enabled and consistency_mode (ACK's Table replicas take a region, a KMS key, a table class and throughput overrides only)"
  partial: true
  fields:
  - propagate_tags
  - point_in_time_recovery
  - deletion_protection_enabled
  - consistency_mode
- variable: restore_date_time
  kind: gap
  reason: "ACK's Table has no restore from a point in time or a backup"
- variable: restore_source_name
  kind: gap
  reason: "ACK's Table has no restore from a point in time or a backup"
- variable: restore_source_table_arn
  kind: gap
  reason: "ACK's Table has no restore from a point in time or a backup"
- variable: restore_to_latest_time
  kind: gap
  reason: "ACK's Table has no restore from a point in time or a backup"
- variable: warm_throughput
  kind: gap
  reason: "ACK's Table (dynamodb-controller v1.14.2) has no warm throughput field"
