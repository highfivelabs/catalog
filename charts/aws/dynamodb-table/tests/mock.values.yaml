# Applied to the fake AWS (hack/mock-apply-aws.sh): an on-demand table with
# a range key, a global secondary index, TTL and a stream.
name: catalog-test-table
region: us-east-1
hash_key: id
range_key: sk
attributes: [{name: id, type: S}, {name: sk, type: S}, {name: gk, type: S}]
global_secondary_indexes:
  - {name: ByG, hash_key: gk, projection_type: ALL}
ttl_enabled: true
ttl_attribute_name: expires_at
stream_enabled: true
stream_view_type: NEW_IMAGE
tags: {catalog-test: "true"}
