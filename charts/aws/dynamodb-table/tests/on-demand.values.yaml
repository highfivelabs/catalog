# An on-demand table with throughput limits on the table and on an index.
name: on-demand
hash_key: pk
attributes: [{name: pk, type: S}, {name: gk, type: S}]
on_demand_throughput: {max_read_request_units: 100, max_write_request_units: 50}
global_secondary_indexes:
  - name: ByG
    hash_key: gk
    projection_type: KEYS_ONLY
    on_demand_throughput: {max_read_request_units: 10}
