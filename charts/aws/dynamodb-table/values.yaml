# Values mirror the Terraform variables of terraform-aws-modules'
# dynamodb-table module (v5.5.2): same names, types and defaults, so a
# module block's arguments become a values file one to one.
# values.schema.json carries the types. A variable the chart cannot carry
# stays here and stops the render when set (upstream.yaml lists them;
# README.md says why).

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables, except tags, which is the module's own.
#
# The table's name in full, {table}. A name set here takes no namePrefix.
# Unset, the table is named name.
names: {}
# An optional convenience: "<namePrefix>-" in front of the table's name
# (never one set under names). Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. They stay in Kubernetes: ACK does not
# copy labels to AWS (AWS tags are the module's tags variable).
labels: {}
# The AWS account and partition the table is in, needed only to write the
# table's ARN into resource_policy where it says __DYNAMODB_TABLE_ARN__
# (the module substitutes the ARN Terraform knows); a chart cannot look the
# account up, so Bundt fills account_id from the Environment.
account_id: null
partition: aws
# DELETE (default): deleting the component deletes the table. ABANDON
# keeps it (services.k8s.aws/deletion-policy: retain).
deletion_policy: DELETE

# The module's variables, in alphabetical order, with its defaults.

# List of nested attribute definitions. Only required for hash_key and
# range_key attributes. Each attribute has two properties: name, type (S, N
# or B)
attributes: []
# A map of default autoscaling settings
autoscaling_defaults:
  scale_in_cooldown: 0
  scale_out_cooldown: 0
  target_value: 70
# Whether or not to enable autoscaling
# Not supported (not-ported): Application Auto Scaling is not ported yet.
autoscaling_enabled: false
# A map of index autoscaling configurations (not ported yet)
autoscaling_indexes: {}
# A map of read autoscaling settings (not ported yet)
autoscaling_read: {}
# A map of write autoscaling settings (not ported yet)
autoscaling_write: {}
# Controls how you are billed for read/write throughput and how you manage
# capacity. The valid values are PROVISIONED or PAY_PER_REQUEST
billing_mode: PAY_PER_REQUEST
# Controls if DynamoDB table and associated resources are created
create_table: true
# Enables deletion protection for table
deletion_protection_enabled: null
# Describe a GSI for the table (warm_throughput refused)
global_secondary_indexes: []
# Witness Region in a Multi-Region Strong Consistency deployment
# Not supported (gap): ACK's Table has no witness region field.
global_table_witness: null
# The attribute to use as the hash (partition) key. Must also be defined as
# an attribute
hash_key: null
# Whether to ignore changes lifecycle to global secondary indices
# Not supported (gap): the controller reconciles the indexes to the spec.
ignore_changes_global_secondary_index: false
# Configurations for importing s3 data into a new table
# Not supported (gap): ACK's Table has no import from S3.
import_table: {}
# Describe an LSI on the table; these can only be allocated at creation
local_secondary_indexes: []
# Name of the DynamoDB table
name: null
# Sets the maximum number of read and write units for the specified
# on-demand table
on_demand_throughput: {}
# Whether to enable point-in-time recovery
point_in_time_recovery_enabled: false
# Number of preceding days for which continuous backups are taken and
# maintained. Default 35
point_in_time_recovery_period_in_days: null
# The number of read units for this table. If the billing_mode is
# PROVISIONED, this field should be greater than 0
read_capacity: null
# Region where this resource will be managed (on ACK: the
# services.k8s.aws/region annotation; unset, the namespace's or the
# controller's)
region: null
# Region names for creating replicas for a global DynamoDB table
# (region_name, kms_key_arn; the other keys refused)
replica_regions: []
# The JSON definition of the resource-based policy
# (__DYNAMODB_TABLE_ARN__ becomes the table's ARN)
resource_policy: null
# Not supported (gap): ACK's Table has no restore.
restore_date_time: null
# Not supported (gap): ACK's Table has no restore.
restore_source_name: null
# Not supported (gap): ACK's Table has no restore.
restore_source_table_arn: null
# Not supported (gap): ACK's Table has no restore.
restore_to_latest_time: null
# The attribute to use as the range (sort) key. Must also be defined as an
# attribute
range_key: null
# Whether or not to enable encryption at rest using an AWS managed KMS
# customer master key (CMK)
server_side_encryption_enabled: false
# The ARN of the CMK that should be used for the AWS KMS encryption
server_side_encryption_kms_key_arn: null
# Indicates whether Streams are to be enabled (true) or disabled (false)
stream_enabled: false
# When an item in the table is modified, StreamViewType determines what
# information is written to the table's stream. Valid values are KEYS_ONLY,
# NEW_IMAGE, OLD_IMAGE, NEW_AND_OLD_IMAGES
stream_view_type: null
# The storage class of the table. Valid values are STANDARD and
# STANDARD_INFREQUENT_ACCESS
table_class: null
# A map of tags to add to all resources
tags: {}
# Updated Terraform resource management timeouts (accepted; Terraform's
# own waits, no effect on ACK)
timeouts:
  create: 10m
  update: 60m
  delete: 10m
# The name of the table attribute to store the TTL timestamp in
ttl_attribute_name: ""
# Indicates whether ttl is enabled
ttl_enabled: false
# Sets the number of warm read and write units for the specified table
# Not supported (gap): ACK's Table has no warm throughput field.
warm_throughput: {}
# The number of write units for this table. If the billing_mode is
# PROVISIONED, this field should be greater than 0
write_capacity: null
