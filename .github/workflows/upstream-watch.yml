#
# Daily: find the tracked Terraform modules (upstream/modules.yaml) that have
# a release newer than their pin, and keep ONE tracking issue in this
# repository with the report (docs/upstream-status.md describes it).
#
# Upstream is only read: `git ls-remote --tags` and GETs of public tarballs
# (tools/upstream). Nothing is written to, commented on or opened in an
# upstream repository. The only write is to this repository's issues, with
# the default token and `issues: write`; no other secret is used.
name: upstream-watch

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    if: github.repository == 'highfivelabs/catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0 # ci.yml's TASK_VERSION
          repo-token: ${{ github.token }}
      - name: Find modules behind their pins
        run: task upstream-watch -- --out upstream-status.md --json upstream-status.json --issue issue.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-status
          path: |
            upstream-status.md
            upstream-status.json
      - name: Update the tracking issue (this repository only)
        run: task upstream-watch:issue -- upstream-status.json issue.md
