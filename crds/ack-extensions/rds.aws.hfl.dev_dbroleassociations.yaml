---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: dbroleassociations.rds.aws.hfl.dev
spec:
  group: rds.aws.hfl.dev
  names:
    categories:
    - aws
    - hfl
    kind: DBRoleAssociation
    listKind: DBRoleAssociationList
    plural: dbroleassociations
    shortNames:
    - hfldbroleassociation
    singular: dbroleassociation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.dbClusterIdentifier
      name: CLUSTER
      type: string
    - jsonPath: .spec.dbInstanceIdentifier
      name: INSTANCE
      type: string
    - jsonPath: .spec.featureName
      name: FEATURE
      type: string
    - jsonPath: .status.status
      name: STATUS
      type: string
    - jsonPath: .status.conditions[?(@.type=="ACK.ResourceSynced")].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DBRoleAssociation is the Schema for the DBRoleAssociations API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DBRoleAssociationSpec associates one IAM role with one Aurora DB cluster
              (AddRoleToDBCluster) or one RDS DB instance (AddRoleToDBInstance), for
              one feature: Aurora's S3 import and export and Lambda calls, RDS for
              PostgreSQL's s3Import and s3Export, SQL Server's and Oracle's
              S3_INTEGRATION, and so on.

              ACK's DBCluster and DBInstance report associated roles in their status
              but cannot add one. Exactly one of the cluster and instance fields (or
              their references) must be set, and exactly one of roleARN and roleRef.
              An instance association needs a featureName; a cluster association may
              leave it out (Aurora MySQL names the role in a cluster parameter
              instead).
            properties:
              dbClusterIdentifier:
                description: The identifier of an Aurora DB cluster. Immutable.
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              dbClusterRef:
                description: |-
                  An ACK rds.services.k8s.aws DBCluster whose spec.dbClusterIdentifier
                  is the cluster.
                properties:
                  from:
                    description: |-
                      AWSResourceReference provides all the values necessary to reference another
                      k8s resource for finding the identifier(Id/ARN/Name)
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    type: object
                type: object
              dbInstanceIdentifier:
                description: The identifier of an RDS DB instance. Immutable.
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              dbInstanceRef:
                description: |-
                  An ACK rds.services.k8s.aws DBInstance whose
                  spec.dbInstanceIdentifier is the instance.
                properties:
                  from:
                    description: |-
                      AWSResourceReference provides all the values necessary to reference another
                      k8s resource for finding the identifier(Id/ARN/Name)
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    type: object
                type: object
              featureName:
                description: |-
                  The feature the role is for, as RDS names it for the engine
                  (DescribeDBEngineVersions, SupportedFeatureNames): for example
                  s3Import, s3Export, Lambda, S3_INTEGRATION. Required for a DB
                  instance. Immutable.
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              roleARN:
                description: The ARN of the IAM role. Immutable.
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              roleRef:
                description: |-
                  An ACK iam.services.k8s.aws Role whose status.ackResourceMetadata.arn
                  is the role.
                properties:
                  from:
                    description: |-
                      AWSResourceReference provides all the values necessary to reference another
                      k8s resource for finding the identifier(Id/ARN/Name)
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    type: object
                type: object
            type: object
            x-kubernetes-validations:
            - message: exactly one of dbClusterIdentifier, dbClusterRef, dbInstanceIdentifier
                and dbInstanceRef must be set
              rule: '[has(self.dbClusterIdentifier), has(self.dbClusterRef), has(self.dbInstanceIdentifier),
                has(self.dbInstanceRef)].filter(x, x).size() == 1'
            - message: exactly one of roleARN and roleRef must be set
              rule: '[has(self.roleARN), has(self.roleRef)].filter(x, x).size() ==
                1'
            - message: featureName is required for a DB instance
              rule: '!(has(self.dbInstanceIdentifier) || has(self.dbInstanceRef))
                || has(self.featureName)'
            - message: featureName is immutable once set
              rule: has(self.featureName) == has(oldSelf.featureName)
          status:
            description: DBRoleAssociationStatus defines the observed state of DBRoleAssociation.
            properties:
              ackResourceMetadata:
                description: |-
                  ResourceMetadata is common to all custom resources (CRs) managed by an ACK
                  service controller. It is contained in the CR's `Status` member field and
                  comprises various status and identifier fields useful to ACK for tracking
                  state changes between Kubernetes and the backend AWS service API
                properties:
                  arn:
                    description: |-
                      ARN is the Amazon Resource Name for the resource. This is a
                      globally-unique identifier and is set only by the ACK service controller
                      once the controller has orchestrated the creation of the resource OR
                      when it has verified that an "adopted" resource (a resource where the
                      ARN annotation was set by the Kubernetes user on the CR) exists and
                      matches the supplied CR's Spec field values.
                      https://github.com/aws/aws-controllers-k8s/issues/270
                    type: string
                  ownerAccountID:
                    description: |-
                      OwnerAccountID is the AWS Account ID of the account that owns the
                      backend AWS service API resource.
                    type: string
                  partition:
                    description: Partition is the AWS partition in which the resource
                      exists or will exist
                    type: string
                  region:
                    description: Region is the AWS region in which the resource exists
                      or will exist.
                    type: string
                required:
                - ownerAccountID
                - region
                type: object
              conditions:
                items:
                  description: |-
                    Condition is the common struct used by all CRDs managed by ACK service
                    controllers to indicate terminal states  of the CR and its backend AWS
                    service API resource
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      format: date-time
                      type: string
                    message:
                      description: A human readable message indicating details about
                        the transition.
                      type: string
                    reason:
                      description: The reason for the condition's last transition.
                      type: string
                    status:
                      description: Status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the Condition
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              status:
                description: |-
                  RDS's state of the association: PENDING, ACTIVE, or INVALID (RDS
                  cannot assume the role).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
