---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: vaultsecrets.keyvault.azure.hfl.dev
spec:
  group: keyvault.azure.hfl.dev
  names:
    categories:
    - azure
    - keyvault
    - hfl
    kind: VaultSecret
    listKind: VaultSecretList
    plural: vaultsecrets
    singular: vaultsecret
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].severity
      name: Severity
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].message
      name: Message
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          VaultSecret is a secret in an Azure Key Vault, its value taken from a
          Kubernetes Secret. It is the secret counterpart of ASO's VaultKey, through
          the Key Vault data plane. The vault is an ASO keyvault.azure.com Vault in
          the same namespace, and the credential is the one ASO uses for this object
          (per-resource, the namespace's aso-credential, or global).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              azureName:
                description: |-
                  AzureName is the secret's name in the vault (1-127 letters, digits and
                  dashes). Defaults to the object's name.
                pattern: ^[0-9a-zA-Z-]{1,127}$
                type: string
              contentType:
                description: ContentType is a hint of the value's type, such as text/plain.
                type: string
              createMode:
                description: |-
                  CreateMode is what to do when a soft-deleted secret holds the name at
                  creation: 'default' creates and reports Key Vault's conflict;
                  'recover' recovers the deleted secret and fails when none exists;
                  'createOrRecover' recovers one when it exists and creates otherwise;
                  'purgeThenCreate' purges it for good and creates. The same modes as
                  ASO's VaultKey. Defaults to 'default'.
                enum:
                - default
                - recover
                - createOrRecover
                - purgeThenCreate
                type: string
              deleteMode:
                description: |-
                  DeleteMode is what happens to the secret in the vault when this object
                  is deleted: 'detach' leaves it; 'delete' soft-deletes it; 'disable'
                  sets enabled to false. The same modes and default as ASO's VaultKey:
                  'detach'.
                enum:
                - detach
                - delete
                - disable
                type: string
              enabled:
                description: Enabled is whether the secret can be read. Defaults to
                  true.
                type: boolean
              expiresOn:
                description: ExpiresOn is when the secret stops being usable.
                format: date-time
                type: string
              notBefore:
                description: NotBefore is when the secret becomes usable.
                format: date-time
                type: string
              owner:
                description: Owner is the keyvault.azure.com Vault the secret is in.
                properties:
                  name:
                    description: This is the name of the Kubernetes resource to reference.
                    type: string
                required:
                - name
                type: object
              tags:
                additionalProperties:
                  type: string
                description: Tags are the secret's tags in the vault.
                type: object
              value:
                description: |-
                  Value is a reference to the key of a Kubernetes Secret, in this
                  namespace, that holds the secret's value. A change to it makes a new
                  version in the vault.
                properties:
                  key:
                    description: Key is the key in the Kubernetes secret being referenced
                    type: string
                  name:
                    description: |-
                      Name is the name of the Kubernetes secret being referenced.
                      The secret must be in the same namespace as the resource
                    type: string
                required:
                - key
                - name
                type: object
            required:
            - owner
            - value
            type: object
            x-kubernetes-validations:
            - message: azureName is immutable
              rule: '!has(oldSelf.azureName) || self.azureName == oldSelf.azureName'
            - message: owner is immutable
              rule: self.owner == oldSelf.owner
          status:
            properties:
              conditions:
                description: 'Conditions: The observed state of the resource'
                items:
                  description: Condition defines an extension to status (an observation)
                    of a resource
                  properties:
                    lastTransitionTime:
                      description: LastTransitionTime is the last time the condition
                        transitioned from one status to another.
                      format: date-time
                      type: string
                    message:
                      description: Message is a human readable message indicating
                        details about the transition. This field may be empty.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration is the .metadata.generation that the condition was set based upon. For instance, if
                        .metadata.generation is currently 12, but the .status.condition[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: |-
                        Reason for the condition's last transition.
                        Reasons are upper CamelCase (PascalCase) with no spaces. A reason is always provided, this field will not be empty.
                      type: string
                    severity:
                      description: |-
                        Severity with which to treat failures of this type of condition.
                        For conditions which have positive polarity (Status == True is their normal/healthy state), this will be omitted when Status == True
                        For conditions which have negative polarity (Status == False is their normal/healthy state), this will be omitted when Status == False.
                        This is omitted in all cases when Status == Unknown
                      type: string
                    status:
                      description: Status of the condition, one of True, False, or
                        Unknown.
                      type: string
                    type:
                      description: Type of condition.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
              contentType:
                description: ContentType, Enabled, NotBefore, ExpiresOn and Tags as
                  the vault holds them.
                type: string
              enabled:
                type: boolean
              expiresOn:
                format: date-time
                type: string
              id:
                description: Id is the identifier of the secret's current version.
                type: string
              notBefore:
                format: date-time
                type: string
              recoveryLevel:
                description: |-
                  RecoveryLevel is the vault's deletion recovery level for the secret,
                  such as Recoverable+Purgeable.
                type: string
              tags:
                additionalProperties:
                  type: string
                type: object
              version:
                description: Version is the secret's current version.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
