# The cluster-scoped ProviderConfig of the Upjet AWS provider, pointed at moto
# (a container on kind's Docker network; run.sh fills in MOTO_URL). No real credentials exist.
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-creds
      key: credentials
  endpoint:
    url:
      type: Static
      static: MOTO_URL
    hostnameImmutable: true
    source: Custom
    services: [organizations]
    signingRegion: us-east-1
  skip_credentials_validation: true
  skip_metadata_api_check: true
  skip_region_validation: true
  skip_requesting_account_id: true
