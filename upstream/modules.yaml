#
# Every open-source Terraform module the catalog tracks: where it lives,
# the release the catalog is pinned to, and the chart that ports it
# (chart: null while none does). One entry per module; read by catalogtool
# (task upstream-check, coverage, upstream-watch, upstream-bump). Do not move a
# pin by hand: `task upstream-bump -- <module> <tag>` does it, with the chart.
#
# Fields
#   id           <cloud>/<module>, unique
#   rank         the module's place in its cloud's ranking: fabric by the order a
#                landing zone needs them (docs/gcp-inventory.md), AWS and Azure by
#                downloads in the last year (docs/aws.md, docs/azure.md)
#   repo         the upstream git repository (read-only: never written to)
#   path         the module's directory in that repository ("." for the root)
#   tag_pattern  which tags are releases (a glob; prereleases are ignored)
#   version      the pinned release tag; commit is what that tag points at
#   license      SPDX id of the upstream licence; copyright, its holder
#   registry_url the Terraform Registry page, or null (fabric is not published there)
#   url          the module's page at the pinned tag
#   chart        the chart that ports it, or null
#
# gcp: Cloud Foundation Fabric, every module at v60.0.0 (UPSTREAM.md); and
#      terraform-google-modules' kubernetes-engine beta-private-cluster,
#      which charts/gcp/gke-cluster ports (with its Autopilot twin through
#      mode: autopilot), ranked after fabric's 91; and the other
#      terraform-google-modules modules the offramp's fixtures call, each with
#      its chart, ranked after it: network's firewall-rules,
#      network-firewall-policy and hierarchical-firewall-policy submodules,
#      folders, iam's folders_iam submodule, and org-policy's org_policy_v2.
# aws: terraform-aws-modules, the 40 most-downloaded modules of
#      docs/aws.md "Ranking" at the tags it names; 13 of them have no tag
#      there and are pinned to their latest release on 2026-11-09. Then the
#      submodules a chart ports on its own, each at its module's pin,
#      ranked after the 40: iam's iam-role and iam-policy.
# azure: Azure Verified Modules, the 37 most-downloaded of docs/azure.md
#      "Ranking" at the tags it names (archived modules and utilities that
#      create no resource are under excluded).
