#
# The catalog's entry points (https://taskfile.dev). `task --list` shows
# them. The heavy ones run on an offload VM, never on a laptop.
version: "3"

# Environment identifiers (projects, buckets, service accounts) come from
# the environment or a git-ignored .env; .env.example lists them.
dotenv: ['.env']

vars:
  OFFLOAD: ../offload/offload
  # The project live tests touch: HFL_GCP_TEST_PROJECT from the test
  # estate's env file (factory/estate/gcp/<gen>.env) when it is loaded,
  # else GCP_PROJECT; hack/live-apply.sh refuses any other. And the
  # service account they run as (GCP_LIVE_SA; no keys, the VM acts as it).
  LIVE_PROJECT: '{{.HFL_GCP_TEST_PROJECT | default .GCP_PROJECT}}'
  LIVE_SA: '{{.GCP_LIVE_SA}}'
  # config-connector-extensions at this commit supplies the pinned Config
  # Connector and the fake cloud (docs/design.md, "Testing").
  CCE_COMMIT: d54a2075f611ec13c22fd77d52aa35d0e55cef53
  # The offramp's root modules, one per directory, relative to this
  # repository (offramp/fixtures until they move to the
  # terraform-offramp-demo repository's layout).
  FIXTURES: '{{.FIXTURES | default "offramp/fixtures"}}'
  CCE_TARBALL: '{{.OFFLOAD_BUCKET}}/catalog-inputs/cce-{{.CCE_COMMIT | trunc 8}}.tar.gz'
  # ack-extensions at this commit supplies the fakes (AWS Emulator's pinned
  # package and moto), the no-real-AWS guard and its kinds for the AWS
  # charts' fake-AWS runs; crds/ack-extensions/README.md says which commit
  # each copied CRD comes from.
  ACKX_COMMIT: 2cdca6ca5885c0dd64e787fc2741166f551d5238
  ACKX_TARBALL: '{{.OFFLOAD_BUCKET}}/catalog-inputs/ackx-{{.ACKX_COMMIT | trunc 8}}.tar.gz'
  # aso-extensions at this commit supplies the Azure fake cloud (cmd/fakearm,
  # cmd/fakeentra) and the manager the fake-cloud and live runs install
  # beside ASO (cmd/manager; docs/azure.md, "8. Charts").
  ASOX_COMMIT: 3d9ba27ec1ed6eb2109130539fcd074028ba200d
  # The aso-extensions checkout (beside this repository's main clone).
  ASOX_REPO: '{{.ASOX_REPO | default "../aso-extensions"}}'
  ASOX_TARBALL: '{{.OFFLOAD_BUCKET}}/catalog-inputs/asox-{{.ASOX_COMMIT | trunc 8}}.tar.gz'

tasks:
  default:
    cmds: [task --list]
    silent: true

  test:
    desc: Render tests for every chart (CHART=gcs for one); offline, a few seconds
    cmds:
      - hack/test.sh {{.CHART}}
    vars:
      CHART: '{{.CHART | default ""}}'

  test-update:
    desc: Accept new renders as the golden files (CHART=gcs for one)
    cmds:
      - UPDATE=1 hack/test.sh {{.CHART}}
    vars:
      CHART: '{{.CHART | default ""}}'

  sync-lib:
    desc: Copy lib/_kcc.tpl (Config Connector charts) and lib/_ack.tpl (charts/aws) into every chart
    cmds:
      - hack/sync-lib.sh

  tools:
    desc: Build tools/catalogtool into bin/
    dir: tools
    cmds:
      - go build -o ../bin/catalogtool ./catalogtool
    sources: ["**/*.go", go.mod, go.sum]
    generates: [../bin/catalogtool]

  tools-test:
    desc: Go tests of tools/ (the upstream, coverage and converter code)
    dir: tools
    cmds:
      - go test ./...

  upstream-check:
    desc: Check upstream/modules.yaml and every chart's upstream.yaml agree (pins, licences, Chart.yaml)
    deps: [tools]
    cmds:
      - bin/catalogtool upstream check

  upstream-watch:
    desc: Find tracked modules with a release newer than their pin and diff them (writes docs/upstream-status.md and .json; read-only against upstream; --only gcp/gcs)
    deps: [tools]
    cmds:
      - bin/catalogtool upstream watch {{.CLI_ARGS}}

  "upstream-watch:issue":
    desc: "Create, update or close this repository's upstream-watch tracking issue from upstream watch's --json and --issue files (upstream-watch.yml; writes issues): task upstream-watch:issue -- upstream-status.json issue.md"
    cmds:
      - hack/upstream-watch-issue.sh {{.CLI_ARGS}}

  upstream-bump:
    desc: "Record that a module's pin moved, then regenerate coverage: task upstream-bump -- gcs v61.0.0"
    deps: [tools]
    cmds:
      - bin/catalogtool upstream bump {{.CLI_ARGS}}
      - hack/coverage/run.sh

  coverage:
    desc: Regenerate docs/coverage and the README's coverage section against the pinned OSS modules (--check, --offline)
    cmds:
      - hack/coverage/run.sh {{.CLI_ARGS}}

  coverage-check:
    desc: Fail when docs/coverage or the README's coverage section is out of date
    cmds:
      - hack/coverage/run.sh --check

  coverage-verify:
    desc: Render each chart with the variables its upstream.yaml refuses set, and check it refuses them
    cmds:
      - hack/coverage/run.sh verify

  convert:
    desc: "Convert a Terraform module call to Bundt documents: task convert -- examples/gcs/main.tf --tfvars examples/gcs/terraform.tfvars [--plan]"
    deps: [tools]
    cmds:
      - bin/catalogtool convert {{.CLI_ARGS}}

  examples-test:
    desc: Check examples/ (converter output, plan previews, rendered objects against Config Connector's schemas)
    cmds:
      - hack/examples.sh

  examples-update:
    desc: Accept new converter output, plan previews and renders for examples/
    cmds:
      - UPDATE=1 hack/examples.sh

  # The merge gate while GitHub Actions is off (README.md, "The merge
  # gate"): ci.yml's pull-request job (task check, at ci.yml's pins) for
  # one commit, then the commit status offload/ci on it.
  ci:
    desc: 'ci.yml''s pull-request job (task check, at ci.yml''s tool pins) for one commit, then the offload/ci status on it: task ci [SHA=HEAD].'
    cmds:
      - hack/ci/gate.sh {{.SHA | default "HEAD"}}

  "ci:tools":
    desc: 'Install the tools ci.yml pins (task, helm, kubeconform, actionlint) at its versions into ~/.local/hfl-tools (HFL_TOOLS); put that first on PATH. task ci:tools -- helm for one.'
    cmds:
      - hack/ci/tools.sh {{.CLI_ARGS}}

  hooks:
    desc: Install the pre-push hook (hack/hooks/pre-push, which runs task ci) with core.hooksPath.
    cmds:
      - git config core.hooksPath hack/hooks

  check:
    desc: Everything that must hold before a commit - gofmt and vet of tools/, the Go tests, the chart and example tests (helm lint, golden renders, kubeconform), coverage current, shell lint (warnings and errors) and workflow lint
    cmds:
      - |
        out="$(cd tools && gofmt -l .)"
        if [ -n "$out" ]; then echo "$out"; echo "gofmt needed"; exit 1; fi
      - cd tools && go vet ./...
      - task: tools-test
      - task: offramp-test
      - task: test
      - task: examples-test
      - task: coverage-check
      - |
        if command -v shellcheck >/dev/null; then shellcheck -x -S warning hack/*.sh hack/*/*.sh offramp/hack/*.sh; else echo "shellcheck not installed: scripts not linted"; fi
      - |
        if command -v actionlint >/dev/null; then actionlint; else echo "actionlint not installed: workflows not linted"; fi

  cce-snapshot:
    desc: Upload config-connector-extensions at CCE_COMMIT for the fake-cloud and live runs
    preconditions:
      - sh: test -n "{{.OFFLOAD_BUCKET}}"
        msg: 'set OFFLOAD_BUCKET (the offload bucket, gs://...; see .env.example)'
    status:
      - hack/snapshot.sh present {{.CCE_TARBALL}}
    cmds:
      - hack/snapshot.sh upload ../config-connector-extensions {{.CCE_COMMIT}} {{.CCE_TARBALL}}

  test-mock:
    desc: Apply each chart's tests/mock.values.yaml to the fake cloud on an offload VM (MOCK_CHARTS="gcs net-vpc" for some)
    deps: [test, cce-snapshot]
    cmds:
      - '{{.OFFLOAD}} run --machine e2-standard-8 --hours 2 -- env CCE_TARBALL={{.CCE_TARBALL}} MOCK_CHARTS="{{.MOCK_CHARTS}}" hack/mock-apply.sh'

  ackx-snapshot:
    desc: Upload ack-extensions at ACKX_COMMIT for the AWS charts' fake-AWS runs
    preconditions:
      - sh: test -n "{{.OFFLOAD_BUCKET}}"
        msg: 'set OFFLOAD_BUCKET (the offload bucket, gs://...; see .env.example)'
    status:
      - hack/snapshot.sh present {{.ACKX_TARBALL}}
    cmds:
      - hack/snapshot.sh upload ../ack-extensions {{.ACKX_COMMIT}} {{.ACKX_TARBALL}}

  test-mock-aws:
    desc: Apply each AWS chart's tests/mock.values.yaml to a fake AWS (the pinned ACK controllers and ack-extensions on kind, against AWS Emulator first and moto for what fails there) on an offload VM (MOCK_CHARTS="vpc kms" for some, MOCK_BACKENDS="moto" for one fake)
    deps: [test, ackx-snapshot]
    cmds:
      - '{{.OFFLOAD}} run --machine e2-standard-8 --hours 2 -- env ACKX_TARBALL={{.ACKX_TARBALL}} MOCK_CHARTS="{{.MOCK_CHARTS}}" hack/mock-apply-aws.sh'

  asox-snapshot:
    desc: Upload aso-extensions at ASOX_COMMIT for the Azure fake-cloud run
    preconditions:
      - sh: test -n "{{.OFFLOAD_BUCKET}}"
        msg: 'set OFFLOAD_BUCKET (the offload bucket, gs://...; see .env.example)'
    status:
      - hack/snapshot.sh present {{.ASOX_TARBALL}}
    cmds:
      - hack/snapshot.sh upload {{.ASOX_REPO}} {{.ASOX_COMMIT}} {{.ASOX_TARBALL}}

  test-mock-azure:
    desc: Apply each Azure chart's tests/mock.values.yaml to aso-extensions' fake cloud (fakearm, fakeentra) with stock Azure Service Operator on an offload VM (MOCK_CHARTS="avm-res-network-routetable ..." for some)
    deps: [asox-snapshot]
    cmds:
      - '{{.OFFLOAD}} run --machine e2-standard-8 --hours 2 -- env ASOX_TARBALL={{.ASOX_TARBALL}} MOCK_CHARTS="{{.MOCK_CHARTS}}" hack/azure-mock.sh'

  offramp-test:
    desc: gofmt, vet and the Go tests of the Terraform offramp's converter (offramp/), the equivalence of each fixture's module calls with their charts included (FIXTURES=dir of root modules, default offramp/fixtures)
    dir: offramp
    cmds:
      - |
        out="$(gofmt -l .)"
        if [ -n "$out" ]; then echo "$out"; echo "gofmt needed"; exit 1; fi
      - go vet ./...
      - OFFRAMP_FIXTURES={{.ROOT_DIR}}/{{.FIXTURES}} go test ./...

  offramp-validate:
    desc: terraform fmt, init and validate of the offramp's four fixtures (no credentials), on an offload VM
    cmds:
      - '{{.OFFLOAD}} run --machine e2-standard-4 --hours 1 -- env FIXTURES={{.FIXTURES}} offramp/hack/validate.sh'

  offramp-live:
    desc: "The offramp's live proof of one fixture (SHAPE=shared-vpc) in {{.LIVE_PROJECT}}, on an offload VM acting as cce-live-tests@: apply, scan, convert, adopt with Config Connector, check nothing changed, destroy"
    preconditions:
      - sh: test -n "{{.LIVE_PROJECT}}"
        msg: 'set GCP_PROJECT (or HFL_GCP_TEST_PROJECT, the test estate''s project; see .env.example)'
      - sh: test -n "{{.GCP_CCE_LIVE_SA}}"
        msg: 'set GCP_CCE_LIVE_SA (the service account the offramp''s live proof runs as; see .env.example)'
      - sh: test -n "{{.OFFLOAD_BUCKET}}"
        msg: 'set OFFLOAD_BUCKET (the offload bucket, gs://...; see .env.example)'
    cmds:
      - '{{.OFFLOAD}} run --sa {{.GCP_CCE_LIVE_SA}} --hours 3 -- env PROJECT={{.LIVE_PROJECT}} GCP_PROJECT={{.GCP_PROJECT}} HFL_GCP_TEST_PROJECT={{.HFL_GCP_TEST_PROJECT}} OFFLOAD_BUCKET={{.OFFLOAD_BUCKET}} FIXTURES={{.FIXTURES}} offramp/hack/live.sh {{.SHAPE}}'
    vars:
      SHAPE: '{{.SHAPE | default "shared-vpc"}}'

  test-live:
    desc: Apply charts to real Google Cloud (project {{.LIVE_PROJECT}}, tiny resources, deleted straight after) on an offload VM acting as {{.LIVE_SA}}; LIVE_CHARTS="artifact-registry" picks charts (default the pilot's three; hack/live-apply.sh names the roles each needs)
    deps: [test, cce-snapshot]
    preconditions:
      - sh: test -n "{{.LIVE_PROJECT}}"
        msg: 'set GCP_PROJECT (or HFL_GCP_TEST_PROJECT, the test estate''s project; see .env.example)'
      - sh: test -n "{{.LIVE_SA}}"
        msg: 'set GCP_LIVE_SA (the service account live tests run as; see .env.example)'
    cmds:
      - '{{.OFFLOAD}} run --sa {{.LIVE_SA}} --machine e2-standard-8 --hours 2 -- env PROJECT={{.LIVE_PROJECT}} GCP_PROJECT={{.GCP_PROJECT}} HFL_GCP_TEST_PROJECT={{.HFL_GCP_TEST_PROJECT}} CCE_TARBALL={{.CCE_TARBALL}} LIVE_CHARTS="{{.LIVE_CHARTS}}" hack/live-apply.sh'

  test-live-azure:
    desc: "Apply the Azure charts (virtual network, storage account, key vault, network security group, route table, NAT gateway, public IP, private DNS zone, managed identity, Log Analytics workspace, container registry, firewall policy, load balancer, bastion host, Application Insights component, PostgreSQL flexible server, private endpoint, application gateway with the virtual network it needs, firewall with the network and public IPs it needs, the landing zone's management resources (alz) in the sandbox group, Private Link private DNS zones linked to a network of the run, DNS private resolver with the network it needs, container app with the environment it needs, Container Apps environment with a Dapr component (in AZURE_LIVE_CAE_LOCATION, centralus by default), Azure SQL server; AZURE_LIVE_CASES picks some, cog the Cognitive Services account, vm the virtual machine, asp the App Service plan, redis the Redis cache, cosmos the Cosmos DB account, web the web app with the plan it needs) to the Azure sandbox's resource group {{.AZURE_LIVE_RESOURCE_GROUP}} with Azure Service Operator on kind, on an offload VM acting as {{.AZURE_LIVE_SA}} (keyless federation); tiny resources, deleted straight after"
    preconditions:
      - sh: test -n "{{.AZURE_LIVE_SA}}" -a -n "{{.AZURE_SUBSCRIPTION_ID}}" -a -n "{{.AZURE_TENANT_ID}}" -a -n "{{.AZURE_CLIENT_ID}}" -a -n "{{.AZURE_LIVE_RESOURCE_GROUP}}" -a -n "{{.OFFLOAD_BUCKET}}"
        msg: 'set AZURE_LIVE_SA, AZURE_SUBSCRIPTION_ID, AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_LIVE_RESOURCE_GROUP and OFFLOAD_BUCKET (the aso-extensions snapshot, task asox-snapshot; see .env.example)'
    cmds:
      - '{{.OFFLOAD}} run --sa {{.AZURE_LIVE_SA}} --machine e2-standard-8 --hours 2 -- env AZURE_SUBSCRIPTION_ID={{.AZURE_SUBSCRIPTION_ID}} AZURE_TENANT_ID={{.AZURE_TENANT_ID}} AZURE_CLIENT_ID={{.AZURE_CLIENT_ID}} AZURE_LIVE_RESOURCE_GROUP={{.AZURE_LIVE_RESOURCE_GROUP}} AZURE_LIVE_CASES="{{.AZURE_LIVE_CASES}}" AZURE_LIVE_PSQL_LOCATION="{{.AZURE_LIVE_PSQL_LOCATION}}" AZURE_LIVE_SQL_LOCATION="{{.AZURE_LIVE_SQL_LOCATION}}" ASOX_TARBALL={{.ASOX_TARBALL}} hack/azure-live.sh'

  test-live-gke:
    desc: Apply gke-cluster to real Google Cloud once per mode (a zonal Standard cluster with one Spot node, an Autopilot cluster), wait for Ready, delete, check gcloud no longer lists them; on an offload VM acting as cce-live-tests (needs roles/container.clusterAdmin and the Kubernetes Engine API in {{.LIVE_PROJECT}})
    deps: [test, cce-snapshot]
    preconditions:
      - sh: test -n "{{.LIVE_PROJECT}}"
        msg: 'set GCP_PROJECT (or HFL_GCP_TEST_PROJECT, the test estate''s project; see .env.example)'
      - sh: test -n "{{.GCP_CCE_LIVE_SA}}"
        msg: 'set GCP_CCE_LIVE_SA (the service account live GKE tests run as; see .env.example)'
    cmds:
      - '{{.OFFLOAD}} run --sa {{.GCP_CCE_LIVE_SA}} --machine e2-standard-8 --hours 2 -- env PROJECT={{.LIVE_PROJECT}} GCP_PROJECT={{.GCP_PROJECT}} HFL_GCP_TEST_PROJECT={{.HFL_GCP_TEST_PROJECT}} CCE_TARBALL={{.CCE_TARBALL}} hack/live-gke.sh'

  inventory:
    desc: Regenerate the tables of docs/gcp-inventory.md from fabric and Config Connector at the commits in UPSTREAM.md
    cmds:
      - hack/inventory/run.sh
