#
# module.gke_standard[0] of main.tf as values of the catalog's gke-cluster
# chart (branch gke-chart, charts/gcp/gke-cluster, a port of
# beta-private-cluster v47.0.0): the module's arguments one to one, plus
# what an import adds. This is the "graduated" form of shape 4 (the
# design, "Day 2: graduating to catalog Packages"): render the chart with
# these values, `offramp compare` the render with the objects converted
# from the state, and swap the frozen Package for gke-cluster only when
# they agree. <prefix> and <project> are the run's.
mode: standard
project_id: <project>
name: <prefix>-std
regional: false
region: us-central1
zones: [us-central1-a]
network: <prefix>-gke
subnetwork: <prefix>-gke
ip_range_pods: pods
ip_range_services: services
enable_private_nodes: true
enable_private_endpoint: false
master_ipv4_cidr_block: 172.16.0.0/28
master_authorized_networks:
  - {cidr_block: 10.40.0.0/24, display_name: nodes}
release_channel: REGULAR
deletion_protection: false # accepted, does nothing (the chart's "Differences")
remove_default_node_pool: true
grant_registry_access: false
gateway_api_channel: CHANNEL_STANDARD
enable_cost_allocation: true
gce_pd_csi_driver: true
network_policy: false
dns_cache: false
cluster_resource_labels: {owner: platform}
node_pools:
  - {name: system, machine_type: e2-standard-2, min_count: 1, max_count: 2, initial_node_count: 1, spot: true, disk_size_gb: 30, disk_type: pd-standard, auto_upgrade: true, auto_repair: true}
  - {name: apps, machine_type: e2-standard-2, min_count: 0, max_count: 3, initial_node_count: 0, spot: true, disk_size_gb: 30, disk_type: pd-standard, auto_upgrade: true, auto_repair: true}
node_pools_labels:
  all: {}
  apps: {workload: apps}
node_pools_taints:
  all: []
  apps: [{key: workload, value: apps, effect: NO_SCHEDULE}]

# What the import adds.
#
# Keep what Terraform made when the component is ever deleted.
deletion_policy: ABANDON
# The module names its node account tf-gke-<name>-<random 4>; the random
# part lives only in the state (random_string.cluster_service_account_suffix),
# so the import names the existing account, as the chart's README says.
# With the live runs' create_service_account = false there is no account.
create_service_account: false
# service_account_name: tf-gke-<prefix>-std-abcd   # from the state, when Terraform made it
